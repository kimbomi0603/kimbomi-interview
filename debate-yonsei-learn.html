  { id:"j2", title:"경험 없는 청년은 1년이 지나도 못 들어간다 — 그래서 계속 밀려난다", star:true,
    say:["더 아픈 숫자가 있습니다. 대기업에 가고 싶다고 했던 청년들을 1년 뒤에 다시 봤습니다. 그중 한 번도 일해 본 적이 없는 청년은 셋 중 둘이 여전히 일을 못 구했거나 쉬고 있었습니다. 원하던 자리에 들어간 건 열 명 중 한 명이었습니다.","경력을 쌓을 첫 자리를 못 얻으니, 시간이 갈수록 더 밀려납니다. 1년을 쉬면 다음 해에는 더 불리해집니다. 이건 청년이 게을러서가 아니라 구조입니다.","그래서 저는 첫 경력만큼은 나라가 보장해야 한다고 말합니다."],
    ev:{num:"셋 중 둘 (66.7%)",cap:"대기업 취업을 바란 미취업 청년 중 '취업 경험이 없던 청년'의 1년 뒤 상태",
      viz:{type:"stack",rows:[["취업 경험 없던 청년",[[11.1,"대기업급 일자리 진입"],[22.2,"중소·임시직 취업"],[66.7,"여전히 실업·쉬는 중"]]],["대기업 희망 청년 전체",[[12.1,"대기업급 일자리 진입"],[27.8,"중소·임시직 취업"],[60.0,"여전히 실업·쉬는 중"]]]]},
      lines:["한국은행 이슈노트(10.26) 그림 27: 한국고용정보원 청년패널(2021~23년 조사), 23~28세 학생 아닌 청년 중 대기업 취업을 희망한 미취업자의 다음 해 상태","'대기업급 일자리' = 민간 300인 이상 기업 상용직(보고서의 1차 노동시장)","보고서 본문: \"특히 취업 경험이 없는 최초 진입자의 경우 실업이나 비경제활동인구로 남을 확률이 더욱 높다\""],
      speak:"\"한국은행 보고서를 보면, 대기업에 가고 싶다던 청년 가운데 일해 본 적 없는 청년은…\"",
      src:BOK_SRC},
    easy:"'경력이 없어서 못 뽑히고, 못 뽑혀서 경력이 없다'는 닭과 달걀입니다. 첫 칸에 못 올라선 청년은 다음 해에도 같은 자리에 서 있고, 그 사이 경력 있는 사람이 자리를 가져갑니다.",
    exact:"'청년 전체의 셋 중 둘'이 아닙니다. '대기업을 바랐던 청년 가운데 취업 경험이 없던 청년'의 숫자입니다. 이 앞부분을 빼고 말하면 틀린 말이 됩니다.",
    hit:{atk:"\"눈 낮춰서 중소기업 가면 되잖아요.\"",ans:"\"청년들은 이미 눈을 낮췄습니다. 한국은행 분석을 보면 대기업·공공기관을 원하는 청년은 줄고 중소기업을 원하는 청년이 늘었습니다. 청년 취업자 셋 중 한 명이 임시·일용직입니다. 문제는 거기서 위로 올라가는 사다리가 코로나 전보다 크게 줄었다는 겁니다.\""},
    quiz:[["'셋 중 둘'은 누구의 숫자인가?","대기업 취업을 바란 미취업 청년 중 취업 경험이 없던 청년. 1년 뒤 66.7%가 실업·쉬는 중."],["그중 대기업급 일자리에 들어간 비율은?","11.1%(열 명 중 한 명)."]]},

  { id:"j3", title:"경기가 좋아지기만 기다리면 안 풀린다",
    say:["경기가 좋아지면 해결된다고들 합니다. 한국은행은 그렇지 않다고 봤습니다.","지금 성장은 반도체가 끌고 갑니다. 그런데 사람을 많이 뽑는 서비스업과 일반 제조업은 정체돼 있습니다. 그래서 성장이 청년 채용으로 이어지지 않습니다.","그러니 기다릴 게 아니라, 첫 일자리를 만드는 쪽에 나라가 손을 써야 합니다."],
    ev:{num:"연 0.6%p",cap:"경기 여건으로 예측한 청년고용률보다 실제가 2023년 이후 해마다 평균 0.6%p 낮음",
      lines:["한국은행 이슈노트(10.26) 11·12·25항: 성장은 IT제조업이 주도하지만 상용직 채용은 비IT제조업·서비스업 비중이 높아 성장이 1차 노동시장 수요로 이어지지 못함. 경기 회복만으로는 단기간에 해소되기 어렵다고 판단","같은 보고서: 핵심연령층 대비 청년의 상용직 입직 규모 약 15~20% 축소"],
      speak:"\"한국은행 조사국 보고서도 경기 회복만으로는 안 풀린다고 봤습니다\"",
      src:BOK_SRC.slice(0,1).concat([["상용직 진입 15~20% 위축 — 아주경제 2026.10.26","https://www.ajunews.com/view/20261026155851603"]])},
    easy:"반도체 공장은 돈은 많이 벌지만 사람은 적게 씁니다. 동네 식당·서비스업이 살아야 청년이 많이 뽑히는데 거기가 멈춰 있습니다.",
    exact:"보고서는 집필자 개인 견해로 한은 공식 견해가 아닙니다. \"한국은행이 공식 발표했다\"가 아니라 \"한국은행 조사국 보고서\"로.",
    hit:null,
    quiz:[["성장이 청년 채용으로 안 이어지는 이유(한은)?","성장은 반도체·IT제조업이 이끄는데, 사람을 많이 뽑는 서비스업·일반 제조업은 정체."]]},

  { id:"j4", title:"AI가 신입 자리부터 지운다",
    say:["여기에 AI가 옵니다. 신입이 하던 자료 찾기, 기초 분석을 이제 AI가 합니다. 그러니 기업은 신입을 키우기보다 바로 일할 경력직을 찾습니다.","한국은행 분석으로 최근 4년 동안 줄어든 청년 일자리 28만 5천 개 가운데 94%가 AI에 많이 노출된 업종에서 나왔습니다.","저도 AI로 예산 공개 사이트를 혼자 만듭니다. 예전 같으면 신입 서너 명이 붙어서 배우던 일입니다. 경력 쌓을 첫 자리가 사라지고 있습니다."],
    ev:{num:"94%",cap:"2022.6~2026.6 줄어든 청년 일자리 28만 5천 개 중 26만 8천 개가 AI 고노출 업종",
      lines:["한국은행 조사국 보고서(2026.8.18) — 박정 의원이 10.13 국감에서 인용","한국은행 이슈노트(10.26) 16항: AI가 초급·기초 업무를 대신하면서 기업이 즉시 투입 가능한 경력직을 선호"],
      speak:"\"한국은행 분석을 보면\"",
      src:[["청년 일자리 94% AI 고노출 업종 — 헤럴드경제 2026.8.17","https://www.heraldk.com/article/2026081720250446523"],["박정 의원 국감 인용 — 아주경제 2026.10.13","https://www.ajunews.com/view/20261013153817871"]]},
    easy:"AI는 '신입이 일을 배우던 연습 문제'부터 대신 풉니다. 연습 문제가 없어지면 신입은 배울 기회 자체를 잃습니다.",
    exact:"'AI 업종'이 아니라 'AI에 많이 노출된 업종'입니다. 'AI 업종'이라고 하면 AI 산업처럼 들려 바로 반박당합니다.",
    hit:{atk:"\"AI는 청년에게 기회 아닌가요?\"",ans:"\"기회 맞습니다. 한국은행도 청년의 AI 적응력은 경쟁력이 될 수 있다고 했습니다. 다만 AI와 일하며 숙련을 쌓을 첫 자리가 있어야 기회가 됩니다. 그 첫 자리를 나라가 보장하자는 겁니다.\""},
    quiz:[["94%를 말할 때 꼭 붙일 표현은?","\"AI에 많이 노출된 업종\" + \"한국은행 분석\"."]]},

  { id:"j5", title:"정부도 돈을 썼다. 그런데 첫 직장까지 닿지 않았다",
    say:["정부가 손 놓고 있었던 건 아닙니다. 청년 일자리에 3년 동안 7조 4,500억 원 넘게 썼습니다.","그런데 같은 기간 청년 고용률은 46.1%에서 44.1%로 떨어졌습니다. 상담하고, 가르치고, 수당 주는 데서 끝나고 첫 직장까지 닿지 않았기 때문입니다.","청년을 뽑는 기업에 주는 장려금은 작년에 726억 원을 쓰지도 못했습니다. 돈의 끝이 첫 직장이 되도록 바꿔야 합니다."],
    ev:{num:"7조 4,571억 원",cap:"청년 일자리 예산 3년(2024~2026.8) · 같은 기간 청년 고용률 46.1% → 44.1%",
      lines:["박정 의원(민주당) 고용노동부 국정감사 2026.10.13","청년일자리도약장려금 726억 원 불용 — 국회예산정책처 2025 결산 분석"],
      speak:"\"이번 국정감사에서 우리 당 박정 의원이 짚었듯이\"",
      src:[["청년일자리 3년 7조4600억…고용률 46.1→44.1% — 스트레이트뉴스 2026.10.13","https://www.straightnews.co.kr/news/articleView.html?idxno=313000"]]},
    easy:"수도꼭지를 틀었는데 물이 컵(첫 직장)까지 안 오고 중간 배관(상담·교육)에서 새는 셈입니다.",
    exact:"청년 고용률 46.1→44.1%는 박정 의원 기준 기간(2024~26)입니다. 한국은행의 46.6→43.7%(2022~26)와 기간이 다르니 한자리에서 섞지 마십시오.",
    hit:{atk:"\"7조 넘게 쓰고 고용률은 떨어졌다. 민주당 정부의 실패다.\"",ans:"\"숫자는 맞습니다. 우리 당 박정 의원이 국감에서 직접 낸 숫자입니다. 그래서 정책의 끝을 바꾸자는 겁니다. 상담이 아니라 첫 직장까지.\""},
    quiz:[["3년 청년 일자리 예산과 고용률 변화?","7조 4,571억 원, 46.1% → 44.1% (박정 의원 국감)."]]},

  { id:"j6", title:"첫 단추가 그다음을 정한다",
    say:["첫 단추가 중요합니다. 국회예산정책처 분석을 보면 계약직으로 사회생활을 시작한 청년 셋 중 하나는 지금도 계약직입니다. 정규직으로 시작한 청년이 지금 계약직인 경우는 열에 둘이 안 됩니다.","첫 일자리를 그만두는 청년도 열에 일곱이고, 평균 1년 반을 버팁니다. 들어가기도 어렵고 버티기도 어렵습니다. 그래서 일자리 숫자만큼 첫 일자리의 질이 중요합니다."],
    ev:{num:"34.5% vs 18.7%",cap:"지금 계약직인 비율 — 계약직으로 시작한 청년 vs 정규직으로 시작한 청년",
      viz:{type:"bars",max:40,unit:"%",rows:[["계약직으로 시작",34.5],["정규직으로 시작",18.7]]},
      lines:["국회예산정책처 「청년층 첫 직장 현황」(2026.5 보도)","첫 직장 그만둔 청년 70.7%, 평균 근속 18.4개월 — 국회예산정책처"],
      speak:"\"국회예산정책처 분석을 보면\"",
      src:[["첫 직장 퇴사 70.7%·근속 18.4개월 — 헤럴드경제 2026.5.4","https://www.heraldk.com/article/2026050404000057847"]]},
    easy:"첫 직장은 '출발 칸'입니다. 어디서 출발하느냐가 몇 년 뒤 자리를 정합니다.",
    exact:"18.7%는 '정규직 출발자 비율'이 아니라 '정규직으로 시작했는데 지금 계약직인 비율'입니다.",
    hit:null,
    quiz:[["계약직으로 시작한 청년 중 지금도 계약직은?","34.5%(셋 중 하나)."]]},

  { id:"j7", title:"해법 — 국가청년취업보장제: 첫 경력은 나라가", star:true,
    say:["그래서 저는 국가청년취업보장제를 말합니다. 시장이 첫 경력을 안 주면, 첫 경력은 나라가 보장하자는 겁니다. 상담에서 끝내지 말고 실제 첫 일자리까지 책임지자는 겁니다.","근거도 있습니다. 한국은행 분석을 보면 공공 취업지원이나 훈련을 받아 본 청년이 이듬해 좋은 일자리에 들어간 비율이 더 높았습니다. 나라가 손을 잡아 주면 된다는 뜻입니다.","오스트리아는 25세까지 견습 자리를 나라가 보장합니다. 2024년에 1만 1,713명이 그렇게 일을 시작했습니다.","청년 정책의 성적표는 몇 명한테 얼마 줬느냐가 아니라, 3년 뒤 그 청년이 어디서 무엇을 하고 있느냐여야 합니다."],
    ev:{num:"정책 경험자 진입률 ↑",cap:"공공 취업지원·훈련 이용 경험이 있는 청년의 이듬해 1차 노동시장 진입률이 미경험자보다 높음",
      lines:["한국은행 이슈노트(10.26) 23항·그림 31 (보고서는 '정책효과의 가능성을 시사'로 표현, 표본이 작다는 단서 있음)","오스트리아 청년 견습 보장(Ausbildungsgarantie), 2024년 1만 1,713명","정부 K-유스개런티: 첫 취업 못 한 청년에게 상담·일경험·수당 → 김보미는 '실제 첫 고용'까지"],
      speak:"\"한국은행 분석을 보면 나라가 도와준 청년이 더 많이 들어갔습니다\"",
      src:BOK_SRC.slice(0,1)},
    easy:"운전 연수처럼 '첫 경력 1년'을 나라가 깔아 주는 것. 그다음부터는 청년이 경력으로 경쟁할 수 있습니다.",
    exact:"제도의 세부 방식(나라가 직접 일자리를 주는지, 기업 임금을 보조하는지)은 아직 정하지 않았습니다(자문단 쟁점 4). 무대에서는 '첫 경력을 나라가 보장한다'는 원칙까지만 말하고, 방식을 물으면 \"흩어진 사업을 하나로 묶는 데서 시작하겠다\"로 답하십시오.",
    hit:{atk:"\"재원은 얼마고 어떻게 합니까? 숫자로 말씀하세요.\"",ans:"\"새 돈부터 달라는 게 아닙니다. 내년 청년 예산이 정부안으로 43조 3천억 원입니다. 국회예산정책처는 청년 자산형성 사업만 해도 6개 부처 10개가 겹친다고 했습니다. 흩어진 장려금·인턴 사업을 첫 고용 보장 하나로 묶는 데서 시작하겠습니다.\""},
    hit2:{atk:"\"한국은행도 정규직 보호가 청년 진입장벽이라고 했습니다. 해고 규제부터 풀어야죠.\"",ans:"\"노동시장 경직성 대목은 보고서에 있습니다. 연공서열 임금은 손볼 수 있고 여야가 같이 앉을 대목입니다. 그런데 한은이 첫째로 꼽은 원인은 반도체 쏠림과 AI입니다. 해고를 쉽게 한다고 반도체 공장이 신입을 더 뽑지는 않습니다. 순서는 청년이 사다리 첫 칸에 올라서게 하는 것부터입니다.\""},

  ["3년 새 반토막","ICT 신입 채용, 경력은 +28%(과기부 자료)"],
  ["94%","최근 4년 줄어든 청년 일자리 중 AI에 많이 노출된 업종 비율(한국은행 8월)"],
  ["7조 4,571억","청년 일자리 예산 3년, 그사이 고용률 46.1%→44.1%(박정 의원 국감)"],
  ["67.8만 vs 20만","연세대 인근 원룸 월세 vs 정부 청년 월세 지원(2022년 그대로)"],
  ["10.1%","LH 행복주택 6개월 이상 빈집 — 열 채 중 한 채"],
  ["16.8%","서울 대학 기숙사 수용률, 전국 최저"],
  ["41년","월급 225만 원에서 생활비 빼고 다 모아도 서울 평균 아파트까지(의원실 단순 계산)"],
  ["61.7%","집 얻는 돈 중 부모·친지 돈(2024 청년의 삶 실태조사)"]]},
 {min:"25~35분",h:"받아치기 6개 — 한 줄씩",hits:[
  ["\"대출 규제가 청년만 골라 잡았다\"","\"그건 맞습니다. 청년 실수요자도 같이 맞았습니다. 그런데 대출 다 풀면 집값이 먼저 오릅니다. 필요한 건 빚 안 내고 들어갈 공공의 방입니다.\""],
  ["\"재원은? 숫자로 말해라\"","\"새 돈보다 흩어진 사업부터 묶겠습니다. 청년 자산형성 사업만 6개 부처 10개가 겹친다고 국회예산정책처가 지적했습니다.\""],
  ["\"한은도 노동 유연화하라더라\"","\"경직성 대목은 있습니다. 연공서열 임금은 같이 고칠 수 있습니다. 그런데 한은이 첫째로 꼽은 건 반도체 쏠림과 AI입니다. 해고 쉽게 한다고 신입이 늘지 않습니다.\""],
  ["\"최저임금 지역 차등\"","\"강진 청년이 같은 일 하고 30% 덜 받으면 강진에 남겠습니까?\""],
  ["\"청년 눈이 높다\"","\"청년들은 이미 눈을 낮췄습니다. 대기업·공공 희망은 줄고 중소기업 희망은 늘었습니다(한은). 문제는 거기서 올라갈 사다리입니다.\""],
  ["\"20대가 민주당을 떠났다\" / \"민주당 집권해도 그대로\"","\"맞습니다. 저도 그렇게 말해 왔습니다. 갤럽에서 20대 절반 가까이(45%)가 지지 정당이 없습니다. 그래서 청년이 결정하는 자리에 앉게 하자는 겁니다.\""]]},
 {min:"35~40분",h:"이것만은 말하지 않기",items:[
  "\"청년 셋 중 둘\" X → \"대기업 바란 청년 중 일해 본 적 없는 청년은 셋 중 둘\"",
  "\"정규직 45명\" X → \"상용직 45명\" / \"94% AI 업종\" X → \"AI에 많이 노출된 업종\"",
  "\"41년\"을 정부 통계처럼 X → \"의원실이 계산해 보니\"",
  "\"청년이 국민의힘으로 간 것도 아니다\" X (갤럽에서도 20대는 국민의힘 28 > 민주 21)",
  "김성열 개인사(참고인 조사·탈당·보궐 득표) 먼저 꺼내지 않기. 인신공격이 오면 \"정책 얘기 하시죠\""]}
];

</script>
<script>
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DONE={};try{DONE=JSON.parse(localStorage.getItem('learn1027')||'{}')}catch(e){}
function save(){try{localStorage.setItem('learn1027',JSON.stringify(DONE))}catch(e){}}
function viz(v){
  if(!v)return'';
  if(v.type==='bars'){return '<div class="viz">'+v.rows.map(r=>'<div class="vrow"><span>'+E(r[0])+'</span><div class="vbar"><i style="width:'+Math.min(100,r[1]/v.max*100)+'%"></i><em>'+r[1]+v.unit+'</em></div></div>').join('')+'</div>'}
  if(v.type==='pairs'){return '<div class="viz">'+v.rows.map(r=>'<div class="vrow pair"><span>'+E(r[0])+'</span><div><div class="vbar"><i class="o" style="width:'+(r[1]/v.max*100)+'%"></i><em>'+r[1]+v.unit+'</em></div><div class="vbar"><i style="width:'+(r[2]/v.max*100)+'%"></i><em>'+r[2]+v.unit+'</em></div></div></div>').join('')+'<div class="leg"><span><i style="background:#9fb6dc"></i>'+E(v.legend[0])+'</span><span><i style="background:#1b4fa0"></i>'+E(v.legend[1])+'</span></div></div>'}
  if(v.type==='stack'){return '<div class="viz">'+v.rows.map(r=>'<div class="stk"><div>'+E(r[0])+'</div><div class="stack">'+r[1].map((s,i)=>'<span class="s'+i+'" style="width:'+s[0]+'%" title="'+E(s[1])+' '+s[0]+'%">'+s[0]+'%</span>').join('')+'</div></div>').join('')+'<div class="leg"><span><i style="background:#1b4fa0"></i>대기업급 일자리 진입</span><span><i style="background:#7f9fd1"></i>중소·임시직 취업</span><span><i style="background:#d14b3f"></i>여전히 실업·쉬는 중</span></div></div>'}
  return'';
}
function hitHTML(h){return h?'<div class="hit">상대: '+E(h.atk)+'<br><span class="a">→ '+E(h.ans)+'</span></div>':''}
function card(c,i,ag){
  const ev=c.ev;
  return '<article class="card'+(DONE[c.id]?' done':'')+'" id="'+c.id+'"><div class="ch"><span class="n">'+(ag==='job'?'일':'주')+(i+1)+'</span><div class="t">'+E(c.title)+(c.star?'<span class="st">★ 꼭</span>':'')+'</div><button class="mk" data-id="'+c.id+'">'+(DONE[c.id]?'✓ 외웠음':'외웠음')+'</button></div><div class="cb">'+
  '<div class="lbl s">① 이렇게 말한다</div><div class="say">'+c.say.map(p=>'<p>'+E(p)+'</p>').join('')+'</div>'+
  '<div class="lbl e">② 근거 — 이 숫자가 받친다</div><div class="ev"><div class="num">'+E(ev.num)+'</div><div class="cap">'+E(ev.cap)+'</div>'+viz(ev.viz)+'<ul>'+ev.lines.map(l=>'<li>'+E(l)+'</li>').join('')+'</ul><div class="sp"><b>말할 때 붙일 표현</b> '+E(ev.speak)+'</div>'+(ev.src&&ev.src.length?'<div class="src">'+ev.src.map(s=>'<a href="'+E(s[1])+'" target="_blank" rel="noopener">'+E(s[0])+'</a>').join('')+'</div>':'')+'</div>'+
  '<div class="lbl z">③ 쉽게 이해</div><div class="easy">'+E(c.easy)+'</div>'+
  '<div class="lbl x">④ 정확히는 — 이 선을 넘으면 틀린 말</div><div class="exact">'+E(c.exact)+'</div>'+
  ((c.hit||c.hit2)?'<div class="lbl h">⑤ 상대가 이렇게 치면</div>'+hitHTML(c.hit)+hitHTML(c.hit2):'')+
  (c.quiz||[]).map(q=>'<details class="q"><summary>확인 질문 · '+E(q[0])+'</summary><p>'+E(q[1])+'</p></details>').join('')+
  '</div></article>';
}
function crash(){return '<section id="crash" class="crash"><h2>⏱ 30분 속성 코스 — 시간 없으면 여기만</h2><p style="margin:4px 0 0;opacity:.85">위에서부터 시간 순서대로. 다 읽으면 아래 카드는 궁금한 것만 펼쳐 보십시오.</p>'+CRASH.map(b=>{let x='<div class="cb2"><h3><span class="tm">'+E(b.min)+'</span>'+E(b.h)+'</h3>';
 if(b.items)x+='<ul>'+b.items.map(i=>'<li>'+E(i)+'</li>').join('')+'</ul>';
 if(b.say)x+=b.say.map(s=>'<div class="sy"><b>'+E(s[0])+'</b>'+s[1].map(p=>'<p>'+E(p)+'</p>').join('')+'</div>').join('');
 if(b.nums)x+='<div class="nums">'+b.nums.map(n=>'<div><b>'+E(n[0])+'</b><span>'+E(n[1])+'</span></div>').join('')+'</div>';
 if(b.hits)x+=b.hits.map(h=>'<div class="hl"><div class="q">상대: '+E(h[0])+'</div><div class="r">→ '+E(h[1])+'</div></div>').join('');
 return x+'</div>'}).join('')+'</section>'}
function render(){
  const total=AGENDA.reduce((a,g)=>a+g.cards.length,0),done=AGENDA.reduce((a,g)=>a+g.cards.filter(c=>DONE[c.id]).length,0);
  let h='<div class="back"><a href="dashboard.html#event/overview">준비노트</a> › 말과 근거 학습</div><h1>말과 근거 — 10.27 연세대 토론 학습</h1><p class="lead">말할 문장과 그 말을 받치는 숫자를 한 장에 붙였습니다. 위에서 아래로 한 번 읽고, 노란 칸을 소리 내 읽은 뒤, 확인 질문으로 점검하십시오.</p><div class="prog">외운 카드 <b>'+done+'</b> / '+total+'</div>';
  h+=crash();h+='<section id="big"><h2>큰 그림 — 오늘 김보미의 한 문장</h2><div class="big"><p class="one">'+E(BIG.one)+'</p><div class="chain">'+BIG.chain.map((s,i)=>(i?'<span class="ar">→</span>':'')+'<div class="st"><small>'+E(s.h)+'</small><b>'+E(s.t)+'</b><span>'+E(s.s)+'</span></div>').join('')+'</div><ol class="three">'+BIG.three.map(t=>'<li>'+E(t)+'</li>').join('')+'</ol><div class="how">'+E(BIG.how)+'</div></div></section>';
  AGENDA.forEach(g=>{
    const L=g.learn;
    h+='<section id="'+g.id+'"><h2>'+E(g.no)+' · '+E(g.title)+'</h2><div class="agq">학생회 질문: '+E(g.q)+'</div>';
    h+='<div class="learn"><h3>한 문장 요약</h3><div>'+E(L.one)+'</div><h3>핵심 다섯 가지 (이것만 알면 80%)</h3><ol>'+L.core.map(c=>'<li>'+E(c)+'</li>').join('')+'</ol><h3>현실 비유</h3><div class="an">'+E(L.analogy)+'</div><h3>가장 흔한 오해</h3><div class="my">'+E(L.myth)+'</div><h3>이해 확인 질문 (답은 아래 카드에)</h3><ol>'+L.check.map(c=>'<li>'+E(c)+'</li>').join('')+'</ol></div>';
    h+=g.cards.map((c,i)=>card(c,i,g.id)).join('')+'</section>';
  });
  h+='<section id="hits" class="hits"><h2>받아치기 — 상대가 칠 말과 한 줄 답</h2>'+HITS.map(x=>'<div class="hc"><div class="who">'+E(x.who)+'</div><div class="atk">'+E(x.atk)+'</div><div class="ans">'+E(x.ans)+'</div><div class="nt">'+E(x.note)+'</div></div>').join('')+'</section>';
  h+='<section id="quiz" class="quiz"><h2>자가 점검 — 눌러서 답 확인</h2>'+QUIZ.map((q,i)=>'<details><summary>'+(i+1)+'. '+E(q[0])+'</summary><p>'+E(q[1])+'</p></details>').join('')+'</section>';
  h+='<section id="dont"><h2>틀리면 안 되는 말</h2><div class="dont"><div class="r"><div>이렇게 말하면 틀림</div><div>이렇게 말함</div></div>'+DONT.map(d=>'<div class="r"><div>'+E(d[0])+'</div><div>'+E(d[1])+'</div></div>').join('')+'</div></section>';
  h+='<p class="foot">숫자는 2026. 10. 27. 출처 원문과 다시 대조한 것만 실었습니다. 더 자세한 근거와 다른 카드는 준비노트 「10.27 토론회」 탭에 있습니다.</p>';
  document.getElementById('app').innerHTML=h;
  document.querySelectorAll('.mk').forEach(b=>b.onclick=()=>{const id=b.dataset.id;DONE[id]=!DONE[id];save();const y=scrollY;render();scrollTo(0,y)});
}
render();
</script>
