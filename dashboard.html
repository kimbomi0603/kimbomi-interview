리가 아니라 가치를 보고 표를 던지는 당원들, 자신의 젊은 날을 기억하며 청년의 도전에 손을 내미는 시민들 — 그 한 표 한 표가 바위에 금을 내고 있습니다.","기득권 정당을 끝내고 침묵하는 다수의 숨결을 듣는 정당, 과거에 복수하는 정당이 아니라 미래의 언어로 일하는 정당을 만드는 데 평생을 바치겠습니다. 감사합니다."],"quotes":[["김보미 (확정 답변)","바위는 너무 오래 비를 맞아 허물어지기 직전이고, 계란은 생명을 품고 있습니다."],["김보미 (확정 답변)","가치를 보고 던지는 그 한 표 한 표가 바위에 금을 내고 있습니다."],["김보미 (확정 답변)","침묵하는 다수의 숨결을 듣는 정당을 만드는 데 평생을 바치겠습니다."]],"notes":["최신 클로징(7.22). '계란은 생명을 품고 있다'가 계란-바위 서사의 완성형 — 모든 방송 마무리에 사용 가능."]},{"no":601,"media":"광주KBS무등의아침","part":"무등의아침","label":"내일 생방송","q":"후보님, 청취자 가운데 생소한 분들이 많습니다. 본인이 어떤 정치인인지 소개해 주십시오.","tags":["소개","출마이유","강진","풀뿌리","세대교체","유일한후보","무등의아침"],"script":["저는 전남 강진에서 정치를 시작한 올해 서른여섯 살 김보미입니다. 13년 동안 민주당에서 활동했고, 전국 최연소 기초의회 의장도 지냈습니다.","서울에서 국회의원 보좌관이나 중앙당 당직으로 정치를 시작한 것이 아니라, 강진에서 주민들의 민원을 해결하고 예산을 따내고, 농민과 자영업자의 어려움을 듣는 풀뿌리 정치를 했습니다.","새벽에는 농민을 만나고, 낮에는 시장에서 상인을 만나고, 밤에는 주민들의 민원 전화를 받으며 정치가 무엇인지 배웠습니다. 그래서 저는 정치를 줄대기 기술, 권력의 기술이 아니라 '생활을 바꾸는 기술'이라고 생각합니다.","이번 당대표 선거도 같은 마음으로 출마했습니다. 민주당은 죽기 직전입니다. 이번에도 686 세 명으로 당대표 본경선을 치르면 민주당은 총선·대선에서 이기기 힘듭니다.","개혁은 아무나 할 수 있는 것이 아닙니다. 챙겨줄 사람이 많은 기득권은 걸리적거리는 것이 많아 개혁이 힘듭니다. 신세 진 국회의원도 없고, 챙겨 주어야 할 사람도 없는 김보미가 가장 확실하게 당 개혁을 할 수 있습니다."],"quotes":[["김보미 (무등의아침 준비)","정치는 줄대기 기술, 권력의 기술이 아니라 생활을 바꾸는 기술입니다."],["김보미 (무등의아침 준비)","신세 진 국회의원도 없고 챙겨 줄 사람도 없는 김보미가 가장 확실하게 당 개혁을 할 수 있습니다."]],"notes":["첫 질문=자기소개. 강진 풀뿌리 서사 → 세대교체·개혁 적임자로 자연스럽게 연결."]},{"no":602,"media":"광주KBS무등의아침","part":"무등의아침","label":"내일 생방송","q":"출마 이후 X를 개설했는데 이재명 대통령이 하루 만에 팔로우했습니다. 어떠셨습니까?","tags":["이재명","X팔로우","기탁금","공영제","경청","무등의아침"],"script":["정말 놀랐습니다. 처음에는 저도 믿기지 않았습니다. 대통령이 말씀은 안 하셔도 지켜보고 있구나 하는 생각이 들었습니다. 많이 감사한 마음이었습니다.","개인적으로는 큰 영광이죠. 하지만 저는 그것을 저 개인에 대한 격려라기보다 '청년 정치에 대한 응원'이라고 받아들였습니다.","이재명 대통령께서는 청년들의 경제 사정을 고려해 당내 경선 기탁금 문제도 제기하셨습니다. 그래서 당에서 일부 조정했지 않습니까?","우리나라는 선거공영제를 하고 있어 출마한 후보가 기탁금을 내지 않습니다. 그런데 당에서는 아직도 기탁금을 받고 있습니다. 기탁금은 깎아줄 것이 아니라 없애야 합니다.","민주당에 돈이 남아돕니다. 정당보조금 꼬박꼬박 받고 선거 때는 선거보조금도 받습니다. 그러면서 당내 경선에는 한 푼도 보태줄 수 없으니 출마하는 사람이 다 내라고 하고, 선거 때마다 올립니다. 입시원서 장사하는 대학들과 똑같은 행태입니다. 앞서가는 것은 없고 늘 뒤처져 있는 것이 민주당입니다."],"quotes":[["김보미 (무등의아침 준비)","저 개인에 대한 격려라기보다 청년 정치에 대한 응원이라고 받아들였습니다."],["김보미 (무등의아침 준비)","기탁금은 깎아줄 것이 아니라 없애야 합니다. 민주당에 돈이 남아도는데 왜 출마자에게 다 내라고 합니까."]],"notes":["X팔로우는 '낙점'이 아니라 '청년정치 응원'으로 프레이밍. 자연스럽게 기탁금·공영제로 연결."]},{"no":603,"media":"광주KBS무등의아침","part":"무등의아침","label":"내일 생방송","q":"현역 국회의원도 아니고 조직도 계파도 없는 원외 후보인데 왜 출마하셨습니까?","tags":["출마이유","5무정당","세대교체","김어준","정청래","꼰대","2030","무등의아침"],"script":["많은 분들이 같은 질문을 하십니다. '누구 떨어뜨리려고 나왔냐'고요. 저는 제가 당선되기 위해 나왔습니다. 그리고 지금 민주당이 위기입니다. 공정도, 미래도, 청년도, 민주주의도 다 없습니다.","민주당이 지금처럼 내로남불 정당, 불공정 아이콘, 686 꼰대 정당으로 가면 2030 다 떠나고 총선·대선 다 집니다. 저라도 나와서 세대교체를 말하고 청년정치를 살려야 한다고 외쳐야 한다고 생각했습니다.","제가 '선거 패배 책임지고 물러나야 할 정청래 후보가 왜 또 나왔냐'고 비판했더니, 정청래 후견인 김어준 공장장이 저를 불러 일장 훈계를 했습니다. 왜 나왔냐, 정청래 떨어뜨리려 나왔냐 집요하게 캐물었습니다.","'질 것 같으니 나오지 마라' — 이게 기득권의 언어입니다. 이런 언어 때문에 민주당이 낡은 꼰대 정당이 되어가고 있는 겁니다."],"quotes":[["김보미 (무등의아침 준비)","저는 제가 당선되기 위해 나왔습니다."],["김보미 (무등의아침 준비)","'질 것 같으니 나오지 마라' — 이게 바로 기득권의 언어입니다."]],"notes":["'누구 떨어뜨리러 나왔냐'는 질문의 표준 응답. 5무 진단 → 김어준 훈계 일화 → '기득권의 언어' 반격."]},{"no":604,"media":"광주KBS무등의아침","part":"무등의아침","label":"내일 생방송","q":"현실적으로 당선 가능성이 높지 않은데 왜 출마했습니까?","tags":["노무현2%","김민석","세대교체","청년","이재명","송영길","꼰대","완주","무등의아침","맘다니"],"script":["저는 처음부터 쉬운 선거라고 생각한 적이 없습니다. 하지만 정치는 당선 가능성만 보고 도전하는 것이 아닙니다. 할 말 있으면 누구나 나올 수 있는 것 아닌가요?","김대중 대통령께서는 서른두 살의 김민석 의원을 과감하게 영입했습니다. 그 시절 민주당은 가장 젊고 역동적인 정당이었고 2030 지지율이 가장 높았습니다. 지금은 어떻습니까. 청년이 외면하는 정당이 되어가고 있습니다.","저는 이번 선거로 한 가지는 반드시 바꾸고 싶습니다. 청년이 민주당에서 도전하는 것이 무모한 일이 아니라 자연스러운 일이 되게 만드는 것입니다. 제가 당대표가 되지 못하더라도 다음 세대가 '김보미가 길을 열었다'고 말할 수 있다면 그 자체로 의미 있는 도전입니다.","청년 문제는 세대의 문제가 아니라 민주당의 생존 문제입니다. 민주당의 생존은 이재명 대통령의 성공과 직결됩니다. 청년이 살아야 대통령도 살고 대한민국도 성장할 수 있습니다.","어제 서울시의회에서 저한테 호통친 송영길 후보 소식 들으셨죠. 저런 꼰대 마인드를 가진 사람들이 당을 이끌다간 정권 넘겨줄 수밖에 없습니다."],"quotes":[["김보미 (무등의아침 준비)","청년 문제는 세대의 문제가 아니라 민주당의 생존 문제입니다."],["김보미 (무등의아침 준비)","제가 당대표가 못 되더라도 다음 세대가 '김보미가 길을 열었다'고 말할 수 있다면 의미 있는 도전입니다."],["참고 워딩 (자질·경험·나이 질문 공용)","지방의회는 중앙의 축소판입니다. 오히려 지방의회 경험도 없이 중앙정치 하는 분들이 허다합니다. 유럽은 지방의원부터 정치인을 양성합니다. 뉴욕시장 맘다니는 저보다 동생뻘입니다 — 30대가 못할 게 뭐가 있습니까?"]],"warn":"'꼰대' 표현은 캠프 지침상 과용 금지. 송영길 고함 사건과 함께 1회만, 수용 화법과 균형.","notes":["'계란으로 바위치기' 당선 가능성 질문. 김민석 영입 역사 → 청년=생존 문제 → 이재명 성공 연결."]},{"no":605,"media":"광주KBS무등의아침","part":"무등의아침","label":"내일 생방송","q":"출마 선언 때부터 세대교체를 강조하셨습니다. 유력 후보 세 분이 모두 386세대인데 '686, 786까지 갈 거냐', '멋진 이별을 준비할 때'라고 하셨습니다. 86세대 정치의 가장 큰 문제는 무엇입니까?","tags":["세대교체","86용퇴","내로남불","돈봉투","유령당원","득표수공개","민주주의","화염병짱돌","무등의아침"],"script":["반성할 줄 모릅니다. 자기들이 늘 개혁의 주체인 줄 압니다. 민주당 686은 현재 대한민국 최고의 기득권입니다.","내로남불을 행동강령으로 모시는 분들입니다. 자기편이면 돈봉투를 돌려도 영웅이고, 성폭력 범죄를 저질러도 지켜줍니다. 그래서 공정이 사라졌고 청년이 떠났습니다.","민주주의도 사라졌습니다. 내 편을 공천하기 위해 없는 지침도 만들고, 전과 5범도 억지로 새 규정을 만들어 기어이 공천합니다. 유령당원·불법당원이 후보자를 뽑습니다. 지금 당대표 선거도 마찬가지입니다.","선거 결과도 공개하지 않습니다. 전 세계에서 유권자와 후보자가 선거 결과도 모르는 선거는 민주당이 유일합니다. 왜 그럴까요? 그게 686 기득권을 영원히 유지하는 데 유리하기 때문입니다.","이들이 당을 이끄는 한 민주당에서 민주주의와 공정은 찾기 힘들고 청년은 영원히 등을 돌릴 겁니다. 686이 아름답게 은퇴하고 청년이 그 자리에 와야 합니다. 산업화 세대가 민주화 세대에게 대한민국을 넘겨주었듯이, 이제 민주화 세대가 미래세대에게 민주당을 넘겨줄 때가 되었습니다."],"quotes":[["김보미 (무등의아침 준비)","자기편이면 돈봉투를 돌려도 영웅이고 성폭력 범죄를 저질러도 지켜줍니다. 그래서 공정이 사라졌고 청년이 떠났습니다."],["김보미 (무등의아침 준비)","전 세계에서 유권자와 후보자가 선거 결과도 모르는 선거는 민주당이 유일합니다."],["김보미 (무등의아침 준비)","산업화 세대가 민주화 세대에게 넘겨주었듯, 이제 민주화 세대가 미래세대에게 민주당을 넘겨줄 때입니다."]],"notes":["세대교체 핵심 문항. '반성할 줄 모른다' → 내로남불 → 유령당원/결과비공개 → 세대이양 논리로 마무리."]},{"no":606,"media":"광주KBS무등의아침","part":"무등의아침","label":"내일 생방송","q":"특히 정청래 후보를 가장 강하게 비판하고 계십니다. 지방선거 결과에 책임을 지라는 뜻입니까?","tags":["정청래","책임정치","6.3지방선거","무등의아침"],"script":["선거에 졌습니다. 이길 수 있었던 서울·대구에서 졌고, '내란정당 해산시킨다'고 하고선 내란정당의 핵심들, 추경호·이진숙 같은 사람들을 당선시켰습니다. 그럼 책임져야지, 다시 더 하겠다고 하면 되겠습니까?","민주당에서 책임정치를 실종시킨 최초의 인물이 정청래 후보입니다. 정치에서 가장 중요한 것이 책임입니다. 기업도 실적이 나쁘면 경영진이 책임지고, 축구대표팀도 성적이 나쁘면 감독이 책임집니다.","정청래만 예외입니까? 정청래가 그러니 장동혁이 따라 합니다. 선거에 지고도 책임 안 지는 무책임 정치를 정청래·장동혁이 사이좋게 만들고 있습니다."],"quotes":[["김보미 (무등의아침 준비)","기업도 실적이 나쁘면 경영진이 책임지고, 축구대표팀도 성적이 나쁘면 감독이 책임집니다. 정청래만 예외입니까?"],["김보미 (무등의아침 준비)","민주당에서 책임정치를 실종시킨 최초의 인물이 정청래 후보입니다."]],"notes":["정청래 책임론. 기업·축구 비유가 라디오에서 잘 꽂힘. '정청래→장동혁' 무책임 정치 확산 프레임."]},{"no":607,"media":"광주KBS무등의아침","part":"무등의아침","label":"내일 생방송","q":"6.3 지방선거 과정의 호남 공천에 대해서도 잡음이 끊이지 않았습니다. 어떻게 보셨습니까?","tags":["호남","강진공천","공정","토론회부재","불공정경선","무등의아침"],"script":["민주당의 뿌리도 호남이고 중심도 호남입니다. 호남은 민주당이 어려울 때도 끝까지 지켜준 곳입니다. 그런데 뿌리 호남의 공천이 제일 엉망입니다.","피해자 중 한 사람이 접니다. 당헌에도 없는 기준으로 감산을 받았고, 전과 5범은 감산을 하지 않을 온갖 규정을 만들어 공천을 주었습니다. 아시다시피 무소속에게 패했습니다. 공정을 팽개친 민주당의 공천 참사였습니다.","무엇보다 저는 후보 토론회를 여러 차례 요청했지만 끝내 한 번도 열리지 않았습니다. 유권자들은 후보들의 정책과 비전을 비교할 기회조차 갖지 못했습니다. 이런 일이 어디 강진뿐이었겠습니까?","호남은 공천이 곧 당선입니다. 선거가 없는 거나 마찬가지입니다. 이런 곳일수록 공천 과정에서라도 연설회·토론회를 해서 후보를 검증해야 합니다. 아무 공약도 없고 선거운동도 안 하고, 조직 동원해 억지로 입당시키고 휴대폰 전화만 기다리는 공천 — 여기에 민주주의와 공정한 경쟁은 없습니다.","그래서 저는 호남 정치의 독립을 선언했습니다. 서울 여의도에 줄 대는 정치가 아니라, 호남이 호남의 정치인을 직접 키우는 정치로 바꿔야 합니다. 서울 정치인들은 호남의 피눈물을 모릅니다. 호남의 공천을 혁신해야 민주당이 삽니다."],"quotes":[["김보미 (무등의아침 준비)","뿌리 호남의 공천이 제일 엉망입니다. 그 피해자 중 한 사람이 접니다."],["김보미 (무등의아침 준비)","호남은 공천이 곧 당선입니다. 이런 곳일수록 토론회로 후보를 검증해야 합니다."],["김보미 (호남 독립선언)","서울 여의도에 줄 대는 정치가 아니라, 호남이 호남의 정치인을 직접 키워야 합니다."]],"notes":["호남 로컬 이슈. 본인=불공정 경선 피해자 서사 + 호남 독립선언 연결. 토론회 부재 강조."]},{"no":608,"media":"광주KBS무등의아침","part":"무등의아침","label":"내일 생방송","q":"이번에 선출되는 당대표는 2028년 총선 공천을 책임집니다. 호남 공천 시스템을 어떻게 바꾸시겠습니까?","tags":["공천","유리상자","득표수공개","경선혁신","공정","1인1표","무등의아침"],"script":["세 가지 원칙을 반드시 세우겠습니다. 첫째, '예측 가능한 공천'입니다. 경선 규칙은 선거 직전에 바꾸면 안 됩니다. 최소 6개월 전에 확정해 누구나 같은 조건에서 준비할 수 있어야 합니다. 특정인을 봐주려 규칙이 바뀌는 순간 공정은 무너집니다.","둘째, '투명한 공천'입니다. 민주당은 지금도 경선 결과를 공개하지 않습니다. 저 역시 강진 경선에서 제가 몇 표를 얻었는지, 투표율이 얼마였는지 모릅니다. 출마한 후보가 자기 득표도 모르는 선거가 민주주의입니까? 특정 국회의원의 사주를 받은 당직자가 조작하지 않는다는 보장이 있습니까?","셋째, '경쟁력 중심 공천'입니다. 시험 보고 토론회·연설회를 해서 실력을 검증해야 합니다. 누구한테 줄 섰느냐가 아니라 누가 실력이 있느냐로 평가하는 체계를 갖추겠습니다.","실력 대신 충성도, 정책 대신 계파가 중심인 현재의 공천 시스템이 바뀌지 않으면 민주당은 신뢰를 회복할 수 없습니다."],"quotes":[["김보미 (무등의아침 준비)","공천 3원칙: 예측 가능한 공천, 투명한 공천, 경쟁력 중심 공천."],["김보미 (무등의아침 준비)","출마한 후보가 자기 득표도 모르는 선거가 민주주의입니까?"]],"notes":["정책 대안 문항. '공천 3원칙'을 숫자로 또렷하게. 유리상자 경선 공약과 직결."]},{"no":609,"media":"광주KBS무등의아침","part":"무등의아침","label":"내일 생방송","q":"당대표의 물리적 나이만으로 세대교체를 주장하는 게 아니라 민주당의 체질을 바꿔야 할 텐데요. 2030 지지 이탈을 막으려면 민주당의 체질을 어떻게 바꿔야 합니까?","tags":["2030","무당층","공정","청년결정권","청년최고위원","기탁금","무등의아침"],"script":["청년들이 민주당을 떠난 가장 큰 이유는 정책이 부족해서가 아니라 공정을 잃었기 때문입니다. 또 청년에게 기회가 없는 기득권 정당으로 전락했기 때문입니다.","청년 정치를 확대하겠다면서 청년최고위원을 거부했고, 청년에게 기회를 준다면서 기탁금을 올렸습니다. 이런 모습이 '민주당은 청년을 말하지만 청년을 이용한다'는 확신을 청년들에게 심어주었습니다.","청년에게 공간을 마련해 주어야 합니다. 청년최고위원제를 도입하고, 청년위원회가 당의 청년정책을 결정하게 하고, 무엇보다 당대표가 김보미가 되어야 합니다."],"quotes":[["김보미 (무등의아침 준비)","청년이 떠난 건 정책이 부족해서가 아니라 공정을 잃었기 때문입니다."],["김보미 (무등의아침 준비)","민주당은 청년을 말하지만 청년을 이용합니다."]],"notes":["체질 개선 문항. 청년최고위원 거부·기탁금 인상이 '이용'의 증거. 청년결정권 공약으로 마무리."]},{"no":610,"media":"광주KBS무등의아침","part":"무등의아침","label":"내일 생방송","q":"이번 전당대회에서 청년최고위원 선출이 무산됐습니다. 어떻게 보셨습니까?","tags":["청년최고위원","계파","책임정치","무등의아침"],"script":["2030이 떠나 선거에 참패하고서도 정신을 못 차린 겁니다. 민주당은 사전에 반성과 책임을 지워버린 정당입니다.","최고위원 한 자리 준다고 민주당이 청년정당이 됩니까? 그건 최소한의 요구였는데, 그것마저 '자기 사람 심겠다'는 계파정치의 희생물이 되었습니다. 한심한 일이지요."],"quotes":[["김보미 (무등의아침 준비)","최고위원 한 자리 준다고 청년정당이 됩니까? 그 최소한의 요구마저 계파정치의 희생물이 됐습니다."]],"notes":["짧고 단호하게. 청년최고위원 부결=계파정치 민낯."]},{"no":611,"media":"광주KBS무등의아침","part":"무등의아침","label":"내일 생방송","q":"기탁금도 논란이 많았습니다. 결국 2천만 원을 감액했는데 어떻게 보십니까?","tags":["기탁금","기탁금감액","공영제","내로남불","무등의아침"],"script":["무슨 배추값 깎아주는 것도 아니고, 한심한 일입니다. 대선·총선·지선 나가면 나라에서 선거비용 대주는데, 민주당 경선은 왜 예비후보까지 악착같이 자기 돈 내서 선거하라고 합니까? 이것도 내로남불입니다. 민주당은 내로남불이 아닌 게 하나도 없는 것 같습니다.","기탁금 깎아줬다고 다 된 게 아닙니다. 청년은 돈이 없으면 출마하기 어렵고, 조직이 없으면 경쟁하기 어렵고, 계파가 없으면 알려질 기회조차 얻기 어렵습니다. 최소한 돈 문제라도 해결해 줘야 합니다.","민주당에 돈이 남아돕니다. 그러면서 기탁금을 받습니다. 저는 당대표가 되면 당내 경선에도 선거공영제를 도입하겠습니다. 기탁금을 싹 없애겠습니다."],"quotes":[["김보미 (무등의아침 준비)","무슨 배추값 깎아주는 것도 아니고 — 기탁금은 깎을 게 아니라 없애야 합니다."],["김보미 (무등의아침 준비)","당대표가 되면 당내 경선에도 선거공영제를 도입해 기탁금을 싹 없애겠습니다."]],"notes":["'배추값' 비유가 라디오에서 강렬. 찔끔 감액 비판 → 당직선거 공영제 대안."]},{"no":612,"media":"광주KBS무등의아침","part":"무등의아침","label":"내일 생방송","q":"검찰 보완수사권 폐지 관련입니다. 여고생 살해범 사건 이후 존폐 논란이 확산 중입니다. 민주당은 의총에서 결론을 못 냈는데 후보님 입장은?","tags":["보완수사권","검찰개혁","피해자보호","무등의아침"],"script":["(기존 검찰개혁 스탠스 유지 — '완성하자'는 톤)","검찰개혁, 안 하자는 게 아니라 완성하자는 겁니다. 칼은 뺏어도 좋습니다. 그러나 선까지 자를 일은 아닙니다. 검·경이 서로 견제하는 제도여야 합니다 — 정치검찰도, 경찰 독주도 안 됩니다.","무엇보다 피해자 보호 공백은 절대 안 됩니다. 여성단체가 우려하는 지점이 바로 그것입니다. 속도보다 방향, 그리고 국민 안전이 먼저입니다."],"quotes":[["김보미 (준비 워딩)","칼은 뺏어도 좋습니다. 그러나 선까지 자를 일은 아닙니다. 피해자 보호 공백은 절대 안 됩니다."]],"warn":"질문안에 '(알아서 하던대로)'로 표기된 문항. 기존 검찰개혁 입장 그대로. 즉답 대신 '완성·피해자보호' 균형 화법.","notes":["원 질문안엔 답변 비워둠(하던 대로). 기존 보완수사권 이슈카드 스탠스 그대로 사용."]},{"no":613,"media":"광주KBS무등의아침","part":"무등의아침","label":"내일 생방송","q":"전남·광주에서 가장 뜨거운 이슈가 반도체 산업단지 조성입니다. 당대표가 되면 당 차원에서 어떤 노력을 하시겠습니까?","tags":["메가프로젝트","반도체800조","정청래","호남","AI","균형발전","농업","무등의아침"],"script":["우선 백제시대 이후 최대 프로젝트인 800조 반도체 투자를 '자기정치'에 이용하는 정청래 후보를 꺾는 것이 급선무입니다.","'전북 소외론'으로 전북·전남을 갈라치고, '문재인 대통령 공'이라며 친문·친명을 갈라치는 정청래 후보는 반도체 클러스터 절대 성공 못 시킵니다. 당대표 시절에도 정부가 요구한 개혁법안을 27%밖에 통과시켜 주지 않았습니다. 대통령과 엇박자만 내고 자기정치만 하는 사람이 무슨 3대 메가프로젝트를 성사시키겠습니까?","저는 800조 반도체 투자를 호남에 맞게 하나하나 뒷받침하겠습니다. 수도권과 똑같은 클러스터를 하나 더 만드는 방식은 현실적이지 않습니다. 광주·전남은 잘하는 분야를 세계 최고 수준으로 만드는 전략이 필요합니다.","광주는 AI 국가시범도시로 지정돼 있고 국가 AI데이터센터를 갖췄습니다. 전남은 풍부한 재생에너지와 넓은 산업용지가 있습니다. 두 지역이 힘을 합치면 수도권과 '경쟁'하는 게 아니라 대한민국 AI 반도체 생태계를 '완성'하는 역할을 할 수 있습니다.","AI 반도체 설계(팹리스), AI 서버·데이터센터, 전력반도체, 에너지반도체, 패키징 — 광주·전남이 충분히 경쟁력을 가질 분야입니다. AI 시대엔 공장만이 아니라 데이터센터·전력·재생에너지 공급 능력이 함께 갖춰져야 하는데, 광주·전남은 그 조건을 갖춘 몇 안 되는 지역입니다.","저는 정부의 국가 AI 전략과 광주·전남의 미래산업 전략을 연결하겠습니다. 우리 호남 청년들이 공무원 시험을 준비하는 게 아니라 AI와 첨단산업에서 꿈을 키울 수 있도록 하겠습니다."],"quotes":[["김보미 (무등의아침 준비)","800조 반도체를 자기정치에 이용하는 정청래 후보를 꺾는 것이 급선무입니다."],["김보미 (무등의아침 준비)","광주·전남이 힘을 합치면 수도권과 경쟁이 아니라 대한민국 AI 반도체 생태계를 완성할 수 있습니다."],["김보미 (무등의아침 준비)","호남 청년이 공무원 시험이 아니라 AI·첨단산업에서 꿈을 키우게 하겠습니다."]],"notes":["지역 핵심 문항. 정청래 '갈라치기' 비판 → 광주(AI)·전남(재생에너지) 결합 '생태계 완성' 비전. 구체 산업 나열로 실력 증명."]},{"no":614,"media":"광주KBS무등의아침","part":"무등의아침","label":"내일 생방송","q":"전남·광주 통합특별시가 7월 1일 출범했습니다. 서부권 단체장들은 무안 청사 기능 강화를 요구합니다. 어떻게 보십니까?","tags":["통합특별시","무안청사","균형발전","지방소멸","농업","호남","무등의아침"],"script":["통합이 성공하려면 반드시 지켜야 할 원칙이 있습니다. 한쪽이 커지고 다른 한쪽이 작아지면 안 되고, '함께 커지는 통합'이어야 합니다.","그래서 서부권 단체장들이 말씀하시는 무안 청사 기능 강화 요구는 충분히 타당한 문제 제기라고 생각합니다.","서부권 주민들이 가장 걱정하는 건 청사 건물의 위치가 아닙니다. '전남이 광주에 흡수되고 전남은 더 낙후되는 것 아닌가' 하는 점입니다. 반도체 공장이 광주 군공항 부지로 결정됐는데, 무안 청사 기능마저 약화되면 광주 쏠림은 더 심해집니다.","이 불안을 해소하지 못하면 통합은 완성되기 어렵습니다. 그래서 무안 청사 기능을 더 강화해야 합니다. 농업·수산, 해양, 섬 정책, 균형발전, 지방소멸 대응처럼 전남의 미래를 책임지는 핵심 기능은 무안 청사에 집중 배치하는 것이 맞습니다."],"quotes":[["김보미 (무등의아침 준비)","한쪽이 커지고 다른 쪽이 작아지면 안 됩니다. 함께 커지는 통합이어야 합니다."],["김보미 (무등의아침 준비)","농업·수산·해양·섬·균형발전·지방소멸 대응 기능은 무안 청사에 집중 배치해야 합니다."]],"notes":["서부권 청취자 배려 문항. '함께 커지는 통합' 원칙 + 무안 청사 강화 지지로 지역 균형 메시지."]},{"no":615,"media":"광주KBS무등의아침","part":"무등의아침","label":"내일 생방송·클로징","q":"예비경선이 내일까지 진행됩니다(중앙위원 35%·권리당원 35%·국민여론조사 30%, 5→3인). 본경선 진출 가능성을 어떻게 보십니까?","tags":["본경선진출","세대교체","호남","2030","노무현2%","클로징","투표독려","호남호소","무등의아침"],"script":["이 방송을 듣는 유권자들이 '그래, 총선에 이기려면 2030이 필요하고 대선에 이기려면 김보미가 필요하다'고 생각하시면 저는 당선될 겁니다.","짱돌과 화염병 들었던 세대가 민주당의 주축이라면 민주당의 미래는 없습니다. 저는 세계에서 가장 정치의식이 높은 호남 시·도민들이 김보미를 뽑아 주실 것으로 믿습니다.","호남의 여러분께 호남의 딸로서 호소드립니다. 김대중 대통령을 키운 것도 호남이고, 노무현 대통령을 만든 것도 호남입니다. 위기 때마다 민주당을 살린 것은 언제나 호남의 선택이었습니다. 이제 호남이 호남의 정치인을 키워 주십시오. 서울에서 내려보낸 정치인이 아니라, 강진 논둑에서 자란 호남의 딸 김보미를 키워 주십시오.","저는 민주당 최초의 30대 당대표에 도전하는 것이 아닙니다. 과거에 복수하느라 미래를 잃어버린 686 기득권에 도전하는 것입니다. 싸울 줄만 아는 정치가 아니라 건설할 줄 아는 정치를 민주당에 심기 위해 도전합니다. 호남이 시작해 주십시오. 응원해 주십시오."],"quotes":[["김보미 (무등의아침 준비)","총선에 이기려면 2030이 필요하고, 대선에 이기려면 김보미가 필요합니다."],["김보미 (호남 호소)","김대중을 키운 것도, 노무현을 만든 것도 호남입니다. 이제 호남이 호남의 정치인을 키워 주십시오."],["김보미 (무등의아침 준비)","싸울 줄만 아는 정치가 아니라 건설할 줄 아는 정치를 심겠습니다. 호남이 시작해 주십시오."]],"notes":["클로징 보강판: 투표 독려 + '호남이 호남을 키워야' 독립선언 호소 결합. 광주 청취자 정조준 엔딩."]},{"no":616,"media":"광주KBS무등의아침","part":"무등의아침","label":"호남인의 호소","q":"[호남인의 호소 — 공용 워딩] 호남 독립선언(7.18) + 합동연설회 연설문 호남 대목 · 어떤 호남 질문에도 바로 쓰는 문장 모음","tags":["호남호소","호남","강진","김대중","반도체800조","독립선언","두번째수도권","호남정치","무등의아침"],"script":["[뿌리와 한(합동연설회)] 민주당의 뿌리도 호남이고 중심도 호남입니다. 호남은 민주당이 어려울 때도 끝까지 지켜준 곳입니다. 저는 호남에서 살고 있습니다. 호남의 한을, 호남의 설움을 온몸으로 겪었습니다.","[서울 정치인 비판(합동연설회)] 서울 정치인들은 호남의 피눈물을 모릅니다. 그냥 이용할 뿐입니다. 선거 때만 호남에 내려와 큰절하고, 선거가 끝나면 잊어버립니다. 김보미는 다릅니다. 호남에서 나고 자라 호남에서 정치했습니다.","[호남 정치 독립선언(7.18)] 호남에는 선거가 없고 공천만 있습니다. 권력과 계파에 줄 대야 공천을 받고, 청년이 낄 자리는 없습니다. 이제 호남 정치가 서울 여의도로부터 독립해야 합니다. 호남이 호남의 정치인을 직접 키워야 합니다. 저는 586 선배들을 다 떨어뜨리고 당선되러 나왔습니다.","[미래 비전(합동연설회)] 이재명 대통령께서 호남에 반도체 800조 투자를 약속하셨습니다. 호남인 김보미가, 호남이 대한민국의 두 번째 수도권으로 우뚝 서도록 대통령과 함께 3대 메가프로젝트를 반드시 성공시키겠습니다. 호남 청년들이 공무원 시험이 아니라 AI와 첨단산업에서 꿈을 키우게 하겠습니다.","[마지막 호소] 세계에서 가장 정치의식이 높은 호남 시·도민 여러분, 김대중을 키우셨듯 이제 호남의 딸 김보미를 키워 주십시오. 호남의 선택이 민주당의 미래를 결정합니다."],"quotes":[["김보미 (합동연설회)","서울 정치인들은 호남의 피눈물을 모릅니다. 그냥 이용할 뿐입니다. 김보미는 다릅니다. 호남에서 살고 있습니다."],["김보미 (호남 독립선언 7.18)","호남에는 선거가 없고 공천만 있습니다. 이제 호남이 호남의 정치인을 직접 키워야 합니다."],["김보미 (합동연설회)","호남인 김보미가, 호남이 대한민국의 두 번째 수도권으로 우뚝 서도록 반드시 성공시키겠습니다."]],"notes":["호남 관련 어떤 질문에도 조합해 쓰는 공용 카드. 순서: 뿌리·한 → 서울 정치인 비판 → 독립선언 → 반도체 비전 → 호소. 광주 방송에서 최소 1회는 '피눈물' 워딩 사용 권장."]},{"no":801,"media":"인사말","part":"인사말","label":"첫인사","q":"[첫인사 ①] 표준형 — 평당원 김보미 (방송·연설 공용)","tags":["첫인사","오프닝","소개","계파없음"],"script":["국민 여러분, 당원 여러분! 서른여섯, 평당원 김보미입니다.","나이는 어리지만 민주당에서 정치를 한 지 13년이 지났습니다. 강진에서 전국 최연소 기초의회 의장도 지냈습니다.","저는 계파가 없습니다. 정청래 공격하려 나온 것도, 김민석 도와주려 나온 것도 아닙니다. 686 기득권 정당 민주당을 청년도 공정하게 경쟁하는 정당으로 만들려고, 당대표가 되려고 나왔습니다."],"quotes":[["김보미","서른여섯, 평당원 김보미입니다. 저는 계파가 없습니다."]],"notes":["가장 안전한 표준형. 정견발표 첫인사 그대로 — 어디서든 사용 가능."]},{"no":802,"media":"인사말","part":"인사말","label":"첫인사","q":"[첫인사 ②] 풀뿌리형 — 생활을 바꾸는 기술 (라디오·지역 방송용)","tags":["첫인사","오프닝","강진","풀뿌리"],"script":["안녕하십니까, 전남 강진에서 정치를 시작한 서른여섯 살 김보미입니다.","새벽에는 농민을 만나고, 낮에는 시장에서 상인을 만나고, 밤에는 주민들의 민원 전화를 받으며 정치를 배웠습니다. 그래서 저는 정치를 줄대기 기술이 아니라 '생활을 바꾸는 기술'이라고 믿습니다.","그 마음 그대로, 죽어가는 민주당을 살리려고 당대표에 도전했습니다."],"quotes":[["김보미","정치는 줄대기 기술이 아니라 생활을 바꾸는 기술입니다."]],"notes":["지역·라디오용. 강진 서사로 친근하게 시작. 무등의아침 1번 답변과 동일 톤."]},{"no":803,"media":"인사말","part":"인사말","label":"첫인사","q":"[첫인사 ③] 도전형 — 계란으로 바위 (청년·유튜브·집회용)","tags":["첫인사","오프닝","계란과바위","세대교체","청년"],"script":["여러분, 계란으로 바위 치기라고들 합니다. 맞습니다. 저는 오늘도 계란입니다. 서른여섯 평당원 김보미입니다.","그런데 김대중도, 노무현도 처음엔 다 계란이었습니다. 민주당의 역사는 계란이 바위를 깬 역사입니다.","저는 죽어도, 다음 세대는 살아야 하지 않겠습니까. 이번 생엔, 계란으로 바위를 깨 보겠습니다."],"quotes":[["김보미","김대중도 노무현도 처음엔 다 계란이었습니다. 민주당의 역사는 계란이 바위를 깬 역사입니다."]],"notes":["청년·SNS·현장용. 에너지 높은 오프닝. '계란' 자기 규정 → DJ·노무현 계보로 반전."]},{"no":804,"media":"인사말","part":"인사말","label":"마무리","q":"[마무리 호소 ①] 표준형 — 청년 김보미를 본선에 (정견발표 원문)","tags":["클로징","마무리","본경선진출","뽑고싶은민주당","투표독려"],"script":["민주당의 모든 문제는, 실력과 능력보다 의리와 인맥을 앞세우기 때문입니다. 신세 진 사람, 챙겨야 할 사람이 많으니 불공정과 반민주가 당헌이 되고 말았습니다.","청년에게 기회가 없는 정당이 되면 미래가 없습니다. 686 세 명으로 하는 경선으로는 총선, 대선, 절대 이길 수 없습니다.","청년 김보미를, 본선에 보내 주십시오. 정말 뽑고 싶은 민주당, 청년에게 사랑받는 민주당, 저 김보미가 반드시 만들겠습니다. 감사합니다."],"quotes":[["김보미","청년 김보미를 본선에 보내 주십시오. 뽑고 싶은 민주당, 청년에게 사랑받는 민주당을 반드시 만들겠습니다."]],"notes":["주신 원문 그대로 — 정견발표 마무리 표준형. 투표 독려가 필요한 모든 자리에서 사용."]},{"no":805,"media":"인사말","part":"인사말","label":"마무리","q":"[마무리 호소 ②] 세대교체형 — 아름다운 퇴장 (합동연설회·성명 톤)","tags":["클로징","마무리","아름다운퇴장","세대교체","재집권"],"script":["존경하는 여러분. 저는 김민석, 정청래, 송영길 선배님들을 진심으로 존경합니다.","그러나 민주주의는 권력을 얻는 것으로 끝나지 않습니다. 권력을 다음 세대에게 넘겨줄 때 완성됩니다. 독재권력에 맞섰던 그 용기를, 이제는 권력을 내려놓는 용기로 완성해 주십시오.","가장 위대한 계승, 가장 아름다운 퇴장을 김보미가 준비해 드리겠습니다. 과거를 자랑하는 정당이 아니라 미래를 만드는 정당, 저 김보미가 반드시 만들겠습니다. 감사합니다."],"quotes":[["김보미","독재권력에 맞섰던 그 용기를, 이제는 권력을 내려놓는 용기로 완성해 주십시오."]],"notes":["686 청중 앞·품격 있는 마무리용. 존경→민주주의 완성→내려놓는 용기 3단 구조."]},{"no":806,"media":"인사말","part":"인사말","label":"마무리","q":"[마무리 호소 ③] 미래형 — 건설하는 정치 (방송 클로징용)","tags":["클로징","마무리","2030","세대교체","호남엔딩","투표독려"],"script":["총선에 이기려면 2030이 필요하고, 대선에 이기려면 김보미가 필요합니다.","저는 민주당 최초의 30대 당대표에 도전하는 것이 아닙니다. 과거에 복수하느라 미래를 잃어버린 686 기득권에 도전하는 것입니다.","싸울 줄만 아는 정치가 아니라 건설할 줄 아는 정치를 민주당에 심겠습니다. 청년이 돌아오는 민주당, 공정이 살아있는 민주당 — 응원해 주십시오. 감사합니다."],"quotes":[["김보미","총선에 이기려면 2030이 필요하고, 대선에 이기려면 김보미가 필요합니다."]],"notes":["방송 클로징용(무등의아침 14번과 동일 계열). 짧고 강한 엔딩."]},{"no":807,"media":"인사말","part":"인사말","label":"마무리","q":"[마무리 호소 ④] 계란과 바위형 — 권력은 강하지만 민심은 더 강하다","tags":["클로징","마무리","계란과바위","이재명","민심","투표독려"],"script":["저는 약한 계란입니다. 나이 많은 기득권은 강한 바위입니다. 그래도 저는 도전할 생각입니다. 끝까지 바위를 두드려 결국 금을 내겠습니다.","민주주의가 있는 민주당, 공정이 살아 있는 민주당, 청년이 돌아오는 민주당, 미래를 준비하는 민주당을 만들어 이재명 정부의 성공을 이끌겠습니다.","두렵지 않습니다. 기득권은 커 보일 뿐, 당원과 국민의 열망을 이길 수 없습니다. 권력은 강하지만 민심은 더 강합니다. 감사합니다."],"quotes":[["김보미","끝까지 바위를 두드려 결국 금을 내겠습니다."],["김보미","기득권은 커 보일 뿐, 당원과 국민의 열망을 이길 수 없습니다. 권력은 강하지만 민심은 더 강합니다."]],"notes":["계란과 바위 서사의 완결형 클로징. '약한 계란' 자기 인정 → 도전 의지 → 4無 회복 → 이재명 성공 → '민심은 더 강하다' 대구(對句) 엔딩. 담담하고 결연한 톤으로."]},{"no":809,"media":"인사말","part":"인사말","label":"첫인사","q":"[첫인사 ④·최종] 감사 인사 + 계란과 바위 — 바위에 금을 내는 한 표 (7.23 확정, 방송·연설 공용)","tags":["첫인사","오프닝","계란과바위","바위에금","침묵하는다수","최종확정"],"script":["국민 여러분, 당원 여러분. 서른여섯, 평당원 김보미입니다.","★ 먼저 감사 인사부터 드리겠습니다. 이번 예비경선 기간, 부족한 저를 응원해 주시고 귀한 한 표를 던져 주신 당원 동지 여러분, 그리고 묵묵히 지켜봐 주신 국민 여러분께 진심으로 감사드립니다. 조직도 계파도 없는 세 명짜리 캠프가 여기까지 온 것은 전부 여러분 덕분입니다.","★ 저는 이번 경선에서 확인했습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들이 계시다는 것을. 그 한 표 한 표가 지금 바위에 금을 내고 있습니다.","나이는 서른여섯이지만 입당 13년, 군의원 재선에 전국 최연소 기초의회 의장을 지냈습니다. 지방의회는 중앙의 축소판입니다. 예산 심의, 행정 감사, 조례 제정, 주민 대변 — 국회가 하는 일을 규모만 작게 다 합니다.","다들 제 도전을 계란으로 바위치기라고 합니다. 맞습니다. 저는 약한 계란이고, 40년 이 나라 정치를 독점한 686 기득권은 큰 바위입니다. 하지만 바위는 너무 오래 비를 맞아 허물어지기 직전이고, 계란은 생명을 품고 있습니다.","침묵하는 다수의 소리를 듣는 새로운 민주당을 만들러 나온 김보미입니다. 잘 부탁드립니다."],"quotes":[["김보미","바위는 허물어지기 직전이고, 계란은 생명을 품고 있습니다. 그 한 표 한 표가 바위에 금을 내고 있습니다."]],"notes":["7.22 최종 확정본 — 홍대선언 마무리 문단과 동일 기조. 방송 오프닝·연설 서두 공용."]},{"no":810,"media":"인사말","part":"인사말","label":"마무리","q":"[마무리 ⑥·최종] 확정본 — 바위에 금·침묵하는 다수·미래의 언어 (7.22 확정, 방송·연설 공용)","tags":["마무리멘트","계란과바위","바위에금","침묵하는다수","미래의언어","최종확정"],"script":["저는 약한 계란이고, 40년 이 나라 정치를 독점한 686 기득권은 큰 바위입니다. 하지만 바위는 너무 오래 비를 맞아 허물어지기 직전이고, 계란은 생명을 품고 있습니다.","★ 저는 이번 경선에서 확인했습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들이 있다는 것을, 자신의 젊은 날을 기억하며 청년의 도전에 손을 내미는 시민들이 있다는 것을 — 가슴 깊숙한 울림으로 확인했습니다. 그 한 표 한 표가 바위에 금을 내고 있습니다.","★ 규칙을 만든 사람들의 정당, 기득권이 다 해먹는 정당을 끝내고, 침묵하는 다수의 소리를 듣는 정당을 만드는 데 평생을 바치겠습니다.","★ 과거에 복수하며 싸우는 정당을 끝내고, 미래의 언어로 일하는 정당을 만들겠습니다. 새로운 민주당을 존경하는 당원 여러분, 그리고 묵묵히 김보미를 응원해 주시는 국민 여러분과 함께 만들겠습니다. 감사합니다."],"quotes":[["김보미","기득권이 다 해먹는 정당을 끝내고, 침묵하는 다수의 소리를 듣는 정당을 만드는 데 평생을 바치겠습니다."]],"notes":["7.22 최종 확정본 — 오프닝 ④와 세트. YTN·SBS 등 모든 방송 마무리에 우선 사용."]},{"no":811,"media":"인사말","part":"인사말","label":"마무리","q":"[마무리 ⑦] 진영논리·허위사실 경고 — 우쭈쭈해 준다고 칼잡이 노릇 안 합니다 (꼭 하고 싶은 말)","tags":["진영논리","우쭈쭈","문자폭탄","허위사실","칼잡이","법적조치","마무리멘트"],"script":["★ 지금 저는 양쪽 진영으로부터 악플과 문자 폭격을 동시에 받고 있습니다. 진영논리에 따라 논점은 왜곡되고, 글의 논리는 무시된 채 비틀어 왜곡부터 당합니다. 정말 큰일이라고 생각합니다. 제가 이쪽을 지적하면 저쪽에서 '우쭈쭈' 해주시고, 저쪽을 지적하면 이쪽에서 '우쭈쭈' 해주십니다.","★ 분명히 말씀드립니다. 우쭈쭈해 주신다고 제가 누구 대신 칼잡이 역할을 할 생각은 전혀 없습니다. 저는 사람을 공격하는 것이 아니라 과정의 불공정을 지적할 뿐입니다.","★ 그래서 정중히, 그러나 분명히 경고드립니다. 논점을 흐리고 왜곡하지 마십시오. 허위사실을 유포하지 마십시오. 명백한 허위사실 유포는 지금 전부 기록하고 캡처해 두고 있습니다. 선거가 끝나면 허위사실을 유포한 분들에 대해 법적 조치를 포함해 끝까지 바로잡고, 이런 문화를 근절하겠습니다.","비판은 얼마든지 좋습니다. 저는 쓴소리를 하러 나온 사람이니 쓴소리로 돌려받는 것도 감당하겠습니다. 그러나 비판과 왜곡은 다릅니다. 침묵하는 다수의 정치를 지키기 위해서라도, 거짓이 이기는 선례만큼은 남기지 않겠습니다."],"quotes":[["김보미","우쭈쭈해 주신다고 누구 대신 칼잡이 역할을 할 생각은 전혀 없습니다."]],"notes":["⚠ 방송 사용 시: 경고 대상을 반드시 '명백한 허위사실 유포'로 한정해 말할 것 — 당원·지지자 전체를 향한 위협처럼 들리면 역풍. '고소·고발'보다 '법적 조치를 포함해'가 안전한 표현. 관련 기존 워딩: 912(지지철회·진영논리), 713·1102(들러리·우쭈쭈), 4·8(문자폭탄 반갑게), 1010(탈탈 털렸다)."]},{"no":812,"media":"인사말","part":"인사말","label":"공용","q":"[공용 확정] '떨어질 걸 알면서 왜 나왔냐' — 저는 당선되러 나왔습니다 (7.22 확정 워딩)","tags":["왜나왔느냐","김어준","당선되러","기득권의언어","세대교체","최종확정"],"script":["많은 분들이 떨어질 걸 알면서 왜 나왔냐고 합니다. 제가 '선거 패배 책임지고 물러나야 할 정청래 후보가 왜 또 나왔나' 비판했더니, 정청래 후보의 후견인 격인 김어준 공장장이 저를 불러 일장 훈계를 했습니다. 왜 나왔냐, 정청래 떨어뜨리려 나왔냐 — 집요하게 캐물었습니다.","★ 어이가 없지 않습니까? 저는 누구를 떨어뜨리기 위해 나온 것이 아닙니다. 저는 제가 당선되기 위해 나왔습니다.","지금 민주당이 위기입니다. 공정도, 미래도, 청년도, 민주주의도 다 없습니다.","★ 민주당이 지금처럼 내로남불 정당, 불공정의 아이콘, 686 꼰대 정당으로 가면 2030은 다 떠나고 총선도 대선도 다 질 겁니다. ★ 그래서 저라도 나와서 세대교체를 말하고, 청년정치를 살려야 한다고 외쳐야 한다고 생각했습니다. 그래서 나왔습니다.","★ '질 것 같으니 나오지 마라' — 이게 바로 기득권의 언어입니다. 이런 언어 때문에 민주당이 낡은 꼰대 정당이 되어가고 있는 겁니다."],"quotes":[["김보미","저는 누구를 떨어뜨리기 위해 나온 것이 아닙니다. 제가 당선되기 위해 나왔습니다."]],"notes":["'왜 나왔냐'류 질문 공용 확정 답변 (901 뉴스바사삭 답변의 압축·확정본). ⚠ '후견인' 표현은 단정적 인물 규정이라 방송에서는 '정청래 후보를 응원하시는 김어준 공장장' 정도로 완화 권장."]},{"no":808,"media":"인사말","part":"인사말","label":"마무리","q":"[마무리 ⑤] 부패 당직자 카르텔 — 당권재민은 사무처 쇄신과 재정 공개에서 시작합니다 (오늘의 골자·마지막 하고 싶은 말 버전)","tags":["당직자개혁","당직자카르텔","사무처쇄신","재정공개","당권재민","외부감사","마무리멘트","호남공천","깃발만꽂으면","전남도당"],"script":["★ 마지막으로 오늘 꼭 드리고 싶은 말씀이 있습니다. 지금 민주당 안에는 아무도 말하지 않는 심각한 문제가 있습니다 — 부패한 당직자 카르텔입니다. 우리는 정당의 주인이 당원이라고 말합니다. 그런데 실제 권력은 어디에 있습니까. 당원의 목소리보다 힘이 센 것이, 아무도 견제하지 못하는 당직자의 무소불위 권력과 성역화된 깜깜이 예산입니다.","국회의원은 임기라도 있지, 중앙당 국장급 당직자들은 퇴직 때까지 자리를 지키는 철밥통입니다. 3선 국회의원조차 중앙당 국장 눈치를 보는 기형적 구조입니다. 정치적 중립을 지켜야 할 당직자가 당내 정치에 개입하고 경선 판을 주무릅니다. 저는 직접 겪었습니다 — 경선 국면에서 제 명의로 특정 후보 관련 투서를 써 달라는 요청을 받았고, 정중히 거절하자 공교롭게도 새 가감산 지침이 만들어졌습니다.","★ 한마디로 당직자가 '법기술자' 노릇을 하고 있는 겁니다. 당헌·당규를 주무르며 '단, 달리 정할 수 있다'는 예외조항을 만들어내고, 가감산 지침을 새로 쓰고 — 기득권 지키기를 가능하게 하는 조력자 역할을 하는 것입니다. 686 기득권의 고무줄 규칙 뒤에는 그 규칙을 설계해 주는 법기술자 당직자들이 있습니다.","★ 호남을 보십시오. 전남은 민주당 깃발만 꽂으면 당선입니다. 공천이 곧 당선이니, 경선을 주무르는 권력이 곧 왕이 됩니다. 그래서 선거철만 되면 전남도당 사무처장 자리를 서로 하려고 난리가 납니다. '지방선거 때 전남도당 처장을 하면 아파트 한 채를 산다'는 소문이 당내에 공공연히 돌 정도입니다. 공천을 주무르는 당직자 카르텔 — 호남 공천 혁신이 그래서 당직자 개혁의 시작점입니다.","★ 그래서 약속드립니다. 첫째, 철밥통 사무처를 엄정한 징계와 공정한 성과 평가로 '젊고 치열한 사무처'로 전면 쇄신하겠습니다. 둘째, 국고보조금·선거보조금·당비를 어디에 썼는지, 어떤 업체와 계약했는지 1원까지 실시간 공개하겠습니다. 공무원도 하는 것을 왜 정당만 성역입니까. 셋째, 당직자의 선거 개입은 불법으로 규정해 즉각 중징계·사법 조치하고, 정당 재정에 외부 감사를 도입하겠습니다.","★ 686 기득권과 법기술자 당직자, 그리고 깜깜이 예산 — 이 삼각 카르텔을 깨지 않으면 어떤 개혁도 당헌·당규 조항 하나로 무력화됩니다. 투명하게 공개하고 스스로 쇄신하는 정당만이 신뢰를 얻습니다. 당직자가 주인 노릇하는 정당이 아니라, 진짜 당원과 국민이 주인인 민주당 — 당권재민은 바로 여기서 시작됩니다."],"quotes":[["김보미","공무원도 하는 재정 공개를 왜 정당만 성역입니까. 1원까지 실시간 공개하겠습니다."]],"notes":["⚠ 투서 요청·'아파트 한 채' 소문 등은 특정인 추정 가능성 있는 폭로성 발언 — 방송에서는 실명·직책 특정 없이 '직접 겪은 사실'로만 말하고, 소문 인용('아파트 한 채')은 생방송에서는 생략 권장. 서면·연설에서는 캠프 법률 검토 후 사용."]},{"no":701,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"1. 이 연설로 김보미 후보의 존재를 처음 알게 된 분들도 많은데, 이제는 알아보는 분들이 많아진 것 같습니다. 정견발표 이전과 이후 바뀐 점이 있을까요?","tags":["정견발표","돌풍"],"script":["가끔 식당이나 거리에서 '저거 김보미 아냐?' 이런 소리를 듣습니다. 하지만 아직 686을 지지하는 열성 당원들, 그리고 '김보미가 할 말을 하는구나' 생각하는 극히 일부 청년만 알지, 대부분의 당원과 국민들은 모르시죠. 바사삭이 홍보 좀 많이 해주세요. (웃음)","★ 청년들의 목소리를 대신 전해야 한다는 막중한 책임감을 느끼고 있습니다.","★ 제가 겁이 없는 사람이었는데, 워낙 많은 관심을 받다 보니 오히려 겁이 많아졌네요. (웃음)"],"quotes":[["김보미 (확정)","바사삭이 홍보 좀 많이 해주세요. (웃음)"]],"notes":["유머 오프닝 → ★책임감 → ★겁 많아짐(웃음) 순서로."]},{"no":702,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"1-1. 이재명 대통령이 지난 12일 개설한 X 계정을 다음 날 팔로우해서 기사가 쏟아졌습니다. 팔로우한 거 알고 있었는지? 언제 알게 됐는지?","tags":["이재명","X팔로우","기탁금","공영제"],"script":["팔로우하고 나서 바로 알았습니다. 그런데 그때는 무슨 뜻인지 몰랐어요. 이 대통령이 팔로우한 청년이 저만 있는 것은 아니니까요.","나중에 기탁금 말씀까지 하시는 걸 보면서, 대통령이 말씀은 안 하셔도 지켜보고 계시는구나 하는 생각이 들었습니다. 많이 감사한 마음이었습니다.","★ 개인적으로는 큰 영광이죠. 하지만 저는 그것을 저 개인에 대한 격려라기보다 청년 정치에 대한 응원이라고 생각합니다. 대통령께서 당내 경선 기탁금 문제도 제기하셔서 당에서 일부 조정했지 않습니까.","★ 우리나라는 선거공영제를 하고 있습니다. 출마한 후보가 기탁금을 내지 않습니다. 그런데 당에서는 아직도 기탁금을 받고 있습니다. 기탁금은 깎아줄 것이 아니라 없애야 합니다.","민주당에 돈이 남아돕니다. 정당보조금 꼬박꼬박 받고 선거 때는 선거보조금도 받습니다. 그러면서 당내 경선에는 한 푼도 보태줄 수 없으니 출마하는 너희들이 다 내라 하고, 심지어 선거 때마다 올립니다.","★ 입시원서 팔면서 장사하는 대학들이 생각납니다. 앞서가는 것은 없고, 늘 뒤처져 있는 것이 민주당입니다."],"quotes":[["김보미 (확정)","저 개인에 대한 격려라기보다 청년 정치에 대한 응원이라고 생각합니다."],["김보미 (확정)","기탁금은 깎아줄 것이 아니라 없애야 합니다. 입시원서 팔면서 장사하는 대학들이 생각납니다."]],"notes":["솔직 고백 → ★응원 프레임 → ★공영제 → ★입시원서 비유."]},{"no":703,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"2. 1989년생, 만 36세로 후보 5명 중 가장 젊습니다. 2018년 28살에 강진군의회 역대 최연소 당선. 이번 전대 출마를 결심한 이유부터 여쭤볼게요.","tags":["출마이유","김어준","5무정당","꼰대","맘다니"],"script":["많은 분들이 떨어질 걸 알면서 왜 나왔냐고 합니다. 제가 '선거 패배 책임지고 물러나야 할 정청래 후보가 왜 또 나왔냐'고 비판했더니, 정청래 후견인 김어준 공장장이 저를 불러 일장 훈계를 했습니다. 왜 나왔냐, 정청래 떨어뜨리려 나왔냐, 집요하게 캐물었습니다.","★ 허허, 어이가 없죠? 저는 누구 떨어뜨리기 위해 나온 게 아니고요, 제가 당선되기 위해 나왔습니다.","지금 민주당이 위기입니다. 공정도, 미래도, 청년도, 민주주의도 다 없습니다.","★ 민주당이 지금처럼 내로남불 정당, 불공정 아이콘, 686 꼰대 정당으로 가면 2030 다 떠나고 총선·대선 다 집니다.","★ 저라도 나와서 세대교체를 말하고, 청년정치를 살려야 한다고 외쳐야 한다고 생각했습니다. 그래서 나왔습니다.","★ '질 것 같으니 나오지 마라' — 이게 기득권의 언어입니다. 이런 언어 때문에 민주당이 낡은 꼰대 정당이 되어가고 있는 겁니다."],"quotes":[["김보미 (확정)","저는 누구 떨어뜨리기 위해서가 아니라, 제가 당선되기 위해 나왔습니다."],["김보미 (확정)","'질 것 같으니 나오지 마라' — 이게 기득권의 언어입니다."],["참고 워딩 (자질·경험·나이 질문 공용)","지방의회는 중앙의 축소판입니다. 오히려 지방의회 경험도 없이 중앙정치 하는 분들이 허다합니다. 유럽은 지방의원부터 정치인을 양성합니다. 뉴욕시장 맘다니는 저보다 동생뻘입니다 — 30대가 못할 게 뭐가 있습니까?"]],"notes":["김어준 일화 → ★당선되러 → ★5무·내로남불 → ★세대교체 → ★기득권의 언어."]},{"no":704,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"2-1. 정견발표에서도 언급했지만, 386 감사하지만 이제는 멋진 이별하자 — 민주당의 세대교체를 주장하고 있는데요?","tags":["세대교체","86용퇴","내로남불","유령당원","득표수공개","강진공천","아름다운퇴장"],"script":["686이 너무 오래해서 반성할 줄 모릅니다. 아직도 자기들이 개혁 주체라고 생각하는데, 청년들은 686을 개혁 대상, 물러나야 할 기득권이라고 생각합니다. 그걸 모르는 것 같아요.","★ 민주당 686은 현재 대한민국 최고의 기득권입니다. 내로남불을 행동강령으로 모시는 분들이고요. 자기편이면 돈봉투를 돌려도 영웅이고, 성폭력 범죄를 저질러도 지켜줍니다. 그래서 공정이 사라졌고 청년이 떠났습니다.","민주주의도 사라졌습니다. 강진 군수선거를 보십시오. 자기편을 공천하기 위해 없는 지침도 만들고, 전과 5범도 억지로 억지로 새 규정을 만들어 기어이 공천합니다.","★ 유령당원, 불법당원이 후보자를 뽑습니다. 지금 당대표 선거도 마찬가지입니다. 선거 결과도 공개하지 않습니다. 전 세계에서 유권자와 후보자가 선거 결과도 모르는 선거는 민주당이 유일합니다.","★ 왜 그럴까요? 그게 686 기득권을 영원히 유지하는 데 유리하기 때문입니다. 그런 제도 덕분에 지금의 기득권을 누릴 수 있었던 것입니다.","★ 이들이 당을 이끄는 한 청년은 영원히 등을 돌릴 겁니다. 686이 아름답게 은퇴하고 청년이 그 자리에 와야 합니다. 그래야 민주당이 살고 총선·대선에 이길 수 있습니다.","★ 산업화 세대가 민주화 세대에게 대한민국을 넘겨주었듯이, 이제 민주화 세대가 미래세대에게 민주당을 넘겨줄 때가 되었습니다."],"quotes":[["김보미 (확정)","자기들은 개혁 주체라 생각하지만, 청년들은 686을 개혁 대상이라 생각합니다."],["김보미 (확정)","전 세계에서 유권자와 후보자가 선거 결과도 모르는 선거는 민주당이 유일합니다."]],"notes":["개혁주체vs대상 → ★내로남불·돈봉투 → ★유령당원·결과비공개 → ★기득권 유지 구조 → ★아름다운 은퇴 → ★세대이양."]},{"no":705,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"3. '그 자리 하나가 아까워서 결정을 못 내리냐'고 했는데, 결국 선출직 청년최고위원 도입이 좌초됐습니다. 왜 이런 일이 벌어지고 있다고 보시는지?","tags":["청년최고위원","계파","기탁금","송영길김용"],"script":["왜 그럴까요? 기득권을 놓기 싫은 겁니다. 786, 886까지 계속하겠다는 것이지요.","★ 김민석·정청래·송영길 후보 모두 이번에 2030을 위한 정치를 하겠다고 공약했잖아요? 그런데 청년최고위원 하나 안 줍니다. 청년에게 기회를 준다면서 기탁금을 올렸습니다. 청년이 제출한 원서는 접수조차 안 받고, 686은 자격 미달인데도 등록한 뒤에 자격조건을 바꿔서 선거에 나갈 수 있게 해 주었습니다.","★ 그래 놓고 송영길 후보가 뭐라 했는지 아세요? '그건 당에서 공지하고 당에서 알아서 해줘야지'라고 했습니다. 아니, 자기 출마 자격을 스스로 관리해야지 당이 관리해 줘야 한다? 이거 갈 데까지 간 겁니다.","★ 이렇게 청년을 강제로 퇴장시키는 결정과 행태를 계속하면, 내놓은 공약이 무슨 소용이 있겠습니까? 686 기득권이 남아 있는 한 민주당에 청년이 설 자리는 없습니다."],"quotes":[["김보미 (확정)","기득권을 놓기 싫은 겁니다. 786, 886까지 계속하겠다는 것이지요."],["김보미 (확정)","'당에서 알아서 해줘야지'? 자기 출마 자격을 당이 관리해 달라니, 갈 데까지 간 겁니다."]],"notes":["기득권 본질 → ★세 후보 공약 모순 → ★송영길 발언 → ★강제 퇴장·설 자리 없음."]},{"no":706,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"3-1. 이번 지방선거에서 민주당이 청년들에게 외면받았던 가장 큰 원인은? 2030 표심을 가져오기 위한 대안을 말씀해주신다면?","tags":["2030","내로남불","경선혁신","당비","청년결정권","청년최고위원"],"script":["★ 대안은 많습니다. 제일 중요한 것은 내로남불을 버리는 겁니다. 경선 규칙을 선거 6개월 전에 확정하고 '고무줄 규칙'을 없애야 합니다. 등록하고 나서 경선 규칙 알려주는 정당, 이런 정당이 세상에 어디 있습니까?","★ 당비를 월 1만 원으로 올리고, 6개월 이상 납부해야 권리당원으로 인정해야 합니다. 커피 한 잔 값으로 공당의 후보를 뽑는 자격을 주는 규정, 이게 왜 계속 유지되겠습니까? 그동안 물가가 얼마나 올랐는데요. 686 기득권이 계속 해먹는 데 제일 유리한 제도이기 때문에 안 바뀌는 겁니다.","★ 청년에게 공간을 마련해 줘야 합니다. 청년최고위원제 도입하고, 청년위원회가 당의 청년정책을 결정하고 — 그리고 무엇보다, 당대표가 김보미가 되어야 합니다.","★ 저는 청년 기준을 45세에서 40세로 낮추고, 선출직 청년최고위원제를 도입하고, 지명직 최고위원 2명도 청년으로 임명하겠습니다. 그래야 청년이 권한을 가지고 결정권을 행사합니다. 들러리 세우려는 686처럼 하면 안 됩니다.","당 청년위원회를 청년정책의 최고 의결기구로 격상하고, 그 결정을 당이 입법하도록 의무화하겠습니다. 더 많이 있는데, 김보미닷컴에서 확인해 주시길 바랍니다. (웃음)"],"quotes":[["김보미 (확정)","제일 중요한 대안은 내로남불을 버리는 겁니다."],["김보미 (확정)","커피 한 잔 값 당비가 안 바뀌는 이유? 686이 해먹는 데 제일 유리한 제도이기 때문입니다."]],"notes":["★내로남불 → ★당비 1만원 → ★청년 공간+당대표 김보미 → ★40세·청년최고위원. 김보미닷컴 홍보 마무리."]},{"no":707,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"4. 김보미닷컴에 공약부터 로드맵까지 나와 있던데요. 25개 약속 중 '진짜 1인 1표'가 눈에 띄고, 스웨덴 정치 축제 알메달렌을 한국형으로 하겠다는 공약도?","tags":["1인1표","한국형알메달렌","공약","기탁금","공영제","토론회","강진공천"],"script":["스웨덴 알메달렌은 당대표도 학생도 잔디밭에서 직급 떼고 계파 떼고 정책으로 토론하는 정치 축제입니다. 민주당을 싸움의 정당이 아니라 토론의 정당으로 바꾸는 것, 그게 한국형 알메달렌입니다.","★ 돈 없어도 실력과 전문성만 있으면 누구라도 도전할 수 있는 선거제도를 만들 겁니다. 기탁금 없애고, 당이 선거비용을 다 대도록 하겠습니다. 토론회·연설회도 충분히 보장하겠습니다.","강진군수 선거 때 토론회·연설회 하자고 그렇게 요구해도 안 했습니다. 저는 공약을 66개나 발표했는데, 상대 후보는 공약이 하나도 없었습니다. 그래도 후보가 되는 경선 — 완전히 갈아엎어야 합니다."],"quotes":[["김보미 (확정)","저는 공약 66개, 상대는 0개였습니다. 그래도 후보가 되는 경선, 완전히 갈아엎어야 합니다."],["김보미 (확정)","돈 없어도 실력만 있으면 누구라도 도전하는 선거제도를 만들겠습니다."]],"notes":["알메달렌 → ★기탁금 폐지·토론 보장 → 66개 vs 0개 실화."]},{"no":708,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"5. 박지현 전 비대위원장을 소환했던데, '청년 박지현은 안 되고 686 송영길은 되나, 이게 공정인가'. '불공정을 넘어 비정상의 극치'라고 비판했는데?","tags":["송영길김용","박지현","공정","고함사건"],"script":["송영길 후보님께서 어제 공적인 자리에서 저에게 막말을 퍼부으셨죠. 분명히 말씀드립니다.","★ 저는 박지현과 송영길을 비교한 것이 아닙니다. 절차의 공정을 지키라고 한 것입니다. 그런데 송 후보는 '자기를 감히 박지현과 비교하다니' 하고 분노하시더라고요. 전형적인 논점 흐리기입니다.","★ 한 청년은 자격이 되는지 안 되는지 서류를 검토해 달라고 했는데 봉투조차 뜯어보지 않았고, 한 686은 접수한 뒤에 자격이 안 되는 게 드러나니까 규정을 바꿔 달라고 한 겁니다.","★ 면접이 시작됐는데 면접 자격도 없는 사람이 면접장에 나타나 '내가 누군데, 면접 자격 만들어 놔' 하고 호통친 겁니다.","★ 누가 '달리 정할 수 있다'는 규정이 있는 걸 모릅니까? 그럼 등록 전에 그 문제를 해결했어야죠. 입당 6개월이 안 됐고 당비도 안 냈으면 미리 당무위를 열어 자격 조건을 논의해 달라고 했어야 하는 것 아닌가요? 그래 놓고 '그건 당에서 해줘야지'라고 합니다. 자기가 무슨 왕입니까? 자기 등록 서류를 당이 챙겨주게요.","★ 박지현 때도 똑같은 사례가 있었는데, 당대표까지 한 분이 그걸 몰랐다는 게 말이 되나요? 한마디로 686은 안하무인입니다. '지들이 나를 어째'라는 거죠.","★ '제가 신경 못 써서 미안하다'고 하셔야지, 저를 혼낼 일이 아닙니다. 언어 폭력도 폭력입니다. 당장 저한테 사과하셔야 합니다."],"quotes":[["김보미 (확정)","봉투조차 뜯어보지 않은 청년의 원서, 접수 후 규정을 바꿔달라는 686 — 이게 본질입니다."],["김보미 (확정)","면접 자격도 없는 사람이 면접장에 나타나 '내가 누군데, 면접 자격 만들어 놔' 호통친 겁니다."],["김보미 (확정)","언어 폭력도 폭력입니다. 당장 저한테 사과하셔야 합니다."]],"notes":["★사람 아닌 절차 → ★봉투/규정변경 대비 → ★면접 비유(최중요) → ★왕이냐 → ★안하무인 → ★사과 요구."]},{"no":709,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"6. 기탁금 인상도 논란입니다. 예비경선 2천만 원, 본경선 시 당대표는 8천만 원 추가. 준비하면서 꽤 부담이 됐을 것 같은데요?","tags":["기탁금","공영제","재정공개","당비"],"script":["기탁금 구하느라 거의 반나절을 허비했고, 후원계좌 만드느라 하루를 허비했습니다. 선거기간이 겨우 4일인데요.","★ 참으로 청년에게 매정하고 냉혹한 정당이 민주당입니다.","★ 근본적인 이야기를 하면, 우리나라에서 재정 문제에서 제일 낙후된 조직이 정당입니다. 나라는 선거공영제를 해서 후보가 기탁금을 내지 않는데, 당은 아직도 기탁금을 받고 있습니다. 기탁금은 깎아줄 것이 아니라 없애야 합니다.","★ 민주당에 돈이 남아돕니다. 정당보조금 꼬박꼬박 받고 선거 때는 선거보조금도 받습니다. 부자가 수수료 장사하는 겁니다. 우리는 한 푼도 보태줄 수 없으니 너희가 다 내라 하고, 선거 때마다 올립니다. 입시원서 장사꾼 대학들과 똑같은 행태입니다.","조그마한 울릉군도 재정을 공개하고 정부도 예산서를 모두 공개합니다. 그런데 민주당은 돈을 얼마 거둬서 어디에 썼는지 공개하지 않습니다.","★ 국고보조금과 당비를 받아 어디에 썼는지 한 개도 공개를 안 합니다. 자기가 낸 당비를 어디 썼는지도 모르는데 당원주권 정당이라고 사기를 치고 있습니다.","★ 밀실이 부패와 부정을 만듭니다. 제가 낱낱이 공개하겠습니다. 국고보조금, 선거보조금, 당비를 어디에 썼는지, 여론조사는 어떤 업체와 계약했는지, 10원짜리 하나까지 낱낱이 공개하겠습니다. 재정을 투명하게 공개하지 못하면 당원도 국민도 신뢰하지 않습니다."],"quotes":[["김보미 (확정)","청년에게 매정하고 냉혹한 정당이 민주당입니다."],["김보미 (확정)","부자가 수수료 장사하는 겁니다. 당비를 어디 썼는지도 모르는데 당원주권 정당이라니, 사기입니다."],["김보미 (확정)","여론조사 업체 계약까지, 10원짜리 하나까지 낱낱이 공개하겠습니다."]],"notes":["체험(반나절+하루/4일) → ★매정·냉혹 → ★공영제 → ★수수료 장사 → ★사기 → ★10원까지 공개(여론조사 업체 포함)."]},{"no":710,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"7. 당대표라면 청년뿐 아니라 장년·노년층에게도 지지를 받아야 하잖아요? '이것만큼은 내가 압도적으로 잘할 수 있다'고 자부하는 능력이 있다면?","tags":["계파없음","유일한후보","노년층","노무현"],"script":["저는 계파가 없습니다. 강진군민이 도와주셔서 혼자 컸습니다.","★ 챙겨줄 사람도, 신세 진 사람도 단 한 명 없습니다. 기득권의 눈치를 보지 않습니다. 개혁은 챙겨야 할 사람이 많거나 도움받은 사람이 많으면 할 수 없습니다.","★ 저는 신세 진 사람도 챙길 사람도 없어서 자유로운 사람 — 그래서 거침없이 개혁할 수 있는 유일한 후보라고 자부합니다.","★ 그리고 노년층 지지라면 자신 있습니다. 제가 정치한 강진은 주민 열 명 중 네 명 가까이가 65세 이상인 전국 최고 수준의 초고령 지역입니다. 그 강진에서 저는 어르신들의 최애였습니다. 의장에 당선되고 가장 먼저 인사드린 분이 노인회장님이셨고, 강진에서 저는 그냥 '우리 보미'로 통합니다. 지금도 어르신들이 방송 보시고 전화 주시고 응원해 주십니다.","장년층·노년층은 지금 같은 싸우는 민주당을 원하지 않으십니다. 노인 문제를 해결하는 민주당, 요양원의 열악한 시설을 해결하는 민주당, 노령연금을 충분히 지급하는 민주당을 원하시죠. 어르신들을 위해 당이 바뀌어야 합니다.","★ 과거를 붙들고 싸우는 민주당이 아니라, 인구감소·고령화 사회를 대비하는 일하는 민주당을 김보미가 만들겠습니다.","★ 민주당이 복수 정당이 된 건 노무현 대통령 죽음 이후입니다. 지금까지 복수만 하고 있습니다. 돌아가신 노무현 대통령이, 자신의 죽음 때문에 검찰개혁 말고는 아무것도 안 하는 민주당을 보시면 뭐라고 하실까요? 잘한다고 하실까요? 아니라고 봅니다.","★ '이제 그만 복수하고 일 좀 하라'고 하실 겁니다. 이 말씀을 꼭 드리고 싶습니다."],"quotes":[["김보미 (확정)","신세 진 사람도 챙길 사람도 없어 자유로운 사람 — 거침없이 개혁할 유일한 후보입니다."],["김보미 (확정)","노무현 대통령이 보시면 '이제 그만 복수하고 일 좀 하라'고 하실 겁니다."]],"notes":["★계파없음·유일한 후보 → 노년층 의제 → ★일하는 민주당 → ★★노무현 메시지(피날레)."]},{"no":711,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"8. 여론조사꽃 조사(7.17~18)에서 김민석 22.4%, 정청래 20.5%, 송영길 8.2%, 고민정 2.5%, 김보미 0.6%였습니다. 이름을 꼭 넣어달라 했는데 결과 받아보고 어땠나요?","tags":["여론조사","돌풍"],"script":["엊그제 여론조사에서는 2.5%가 나왔더라고요.","★ 3일 만에 4배가 올랐네요. 지금 속도라면 3위도 가능하지 않을까요? (웃음)","★ 실망하지 않습니다. 그 짧은 시간 안에 저를 지지하는 분들이 이렇게 많아졌다니, 고맙고 감격할 뿐입니다."],"quotes":[["김보미 (확정)","3일 만에 4배가 올랐습니다. 이 속도라면 3위도 가능하지 않을까요? (웃음)"],["김보미 (확정)","짧은 시간에 이렇게 많은 분들이 지지해 주시다니, 고맙고 감격할 뿐입니다."]],"notes":["★4배 상승·3위 유머 → ★감사·감격."],"warn":"'2.5%' 수치는 방송 전 최신 조사로 최종 확인 후 사용."},{"no":712,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"8-1. 뉴스공장 출연 후 '흠씬 두들겨 맞고 왔다', '말려든 것 같은데 노련하게 대처하지 못한 것도 저의 부족함'이라는 후기를 남겼던데, 아쉬웠던 점이?","tags":["김어준","뉴스공장","이생망중꺾마","노무현2%"],"script":["솔직하게 말씀드리면, 흠씬 두들겨 맞고 왔습니다. (웃음) '정청래 떨어뜨리러 나온 거 아니냐'는 집요한 질문에 제 진심이 자꾸 왜곡되는 것 같아 저도 모르게 말려들었습니다. 노련하게 대처하지 못한 건 제 부족함입니다.","다만 '당선이 현실적으로 어렵지 않냐'는 질문엔 이렇게 답하고 싶습니다. 월드컵 우승 못 하면 출전하지 말고, 서울대 못 가면 공부하지 말아야 합니까? 노무현은 2%로 시작했습니다. 중요한 건 꺾이지 않는 마음입니다.","비판해 주신 분들 말씀도 겸허히 받겠습니다. 그분들 다수가 민주당을 사랑하는 분들이니까요. 두들겨 맞아도 저는 꺾이지 않습니다."],"quotes":[["김보미","흠씬 두들겨 맞고 왔습니다. 노련하지 못했던 건 제 부족함입니다."],["김보미","월드컵 우승 못 하면 출전하지 말아야 합니까? 중요한 건 꺾이지 않는 마음입니다."]],"notes":["'그냥 솔직하게' 지침 — 자기 인정 → 명언 반등 → 수용 마무리."]},{"no":713,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"8-2. 당대표 출마 이후 친명·친청계 양쪽에서 공격받고 있는데 심경은?","tags":["문자폭탄","계파","진영논리","들러리"],"script":["당연히 공격받을 것으로 알고 나와서 아무렇지도 않습니다.","★ 다만 제가 아니라 제 가족인, 이혼한 부모 이야기나 가족 이야기로 공격하는 것은 마음이 많이 상합니다.","★ 제가 정청래를 비판하면 김민석 지지자들이 '어쭈쭈' 해주고, 제가 김민석을 비판하면 정청래 지지자들이 '아이고 내 새끼' 하시겠지요.","★ 하지만 죄송하게도, 저는 그런 분들 들러리 서러 나온 것이 아닙니다. A를 비판한다고 B 지지자가 저를 찍기를 바라지도 않고, B를 비판한다고 A 지지자가 저를 지지할 일도 없습니다.","그저 묵묵히, 하지만 확실하게 — 민주당의 위기를 지적하고 청년을 챙기라고 요구할 뿐입니다."],"quotes":[["김보미 (확정)","정청래를 비판하면 '어쭈쭈', 김민석을 비판하면 '아이고 내 새끼' — 저는 그런 분들 들러리 서러 나온 게 아닙니다."],["김보미 (확정)","가족 이야기로 공격하는 것은 마음이 많이 상합니다."]],"notes":["담담함 → ★가족 공격 아픔 → ★어쭈쭈/내새끼 → ★들러리 거부 → 묵묵한 소명."]},{"no":714,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"9. 내일 경선 결과가 발표됩니다. 당선되면 386세대·기성 정치인들과 함께해야 할 텐데, 어떻게 설득하고 당을 이끌어나갈 생각이신지?","tags":["홍대선언","디지털정당","대전환","경선혁신","3선배제","재정공개"],"script":["★ 시스템으로 움직이는 디지털 정당을 만들자고 설득할 계획입니다. 오늘 오후 3시, 제가 '홍대선언'을 합니다. 여기에 모두 담겨 있습니다.","★ 기득권을 유지하려고 규칙을 마음대로 바꾸는 정당에서, 시스템으로 움직이는 진짜 당원 정당으로 — 가짜 당원주권은 폐기하고 디지털 정당으로 완전히 대전환하자고 제안할 겁니다.","몇 가지만 소개하면, 경선 규칙을 선거 6개월 전에 확정하고 '고무줄 규칙'을 없애겠습니다. 가짜당원·불법당원을 정리하고 모든 경선 결과를 100% 공개하겠습니다. 당비를 월 1만 원으로 올리고 6개월 이상 납부하면 권리당원으로 인정하겠습니다.","청년들이 기탁금 없이 토론과 연설로 실력을 겨루는 공천을 하겠습니다. 국회의원이든 단체장이든 동일 지역구 3회 초과 공천 금지를 제도화하겠습니다. 국고보조금과 당비를 어디에 썼는지 낱낱이 공개하겠습니다.","★ 이런 정도 혁신 없이 절대 총선과 대선을 이길 수 없다는 것을 설득하면, 선배 정치인들도 따라올 것으로 믿습니다. 무엇보다 국민이 지지할 겁니다. 그러면 세대교체와 대전환 수준의 개혁이 필요하다는 것을 인정하지 않을 수 없을 겁니다."],"quotes":[["김보미 (확정)","오늘 오후 3시, 홍대선언 — 디지털 정당으로 완전히 대전환하자는 제안입니다."],["김보미 (확정)","이런 혁신 없이 절대 총선·대선 못 이깁니다. 그걸 설득하면 선배들도 따라올 겁니다."]],"notes":["★홍대선언(오늘 15시) 예고 — 오늘의 뉴스포인트 → ★디지털 대전환 → 6대 개혁 → ★혁신 없이 필패 논리."]},{"no":715,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"9-1. 지금 상황에서 김 후보와 가장 말이 잘 통하고, 민주당 문제를 제대로 짚고 2030과 잘 소통할 것 같은 정치인 한 명 골라본다면?","tags":["토론회","이재명","소통"],"script":["딱 한 분을 고르기가 어렵습니다. 지금 전당대회라서 이렇게 살벌해 보이지만, 나머지 네 분 모두 한 분 한 분 청년의 이야기에 공감하고 소통해 주실 분들이라고 생각합니다.","★ 다만 지금은 경쟁이 치열해서 마주 앉아 이야기 나눌 자리가 없다는 게 참 아쉽습니다. 소통의 장, 토론회를 좀 했으면 좋겠습니다. 토론이야말로 서로의 진심을 확인하는 최고의 소통이니까요.","전당대회가 끝난 뒤에라도 다섯 후보가 청년 문제를 놓고 계속 소통했으면 좋겠습니다."],"quotes":[["김보미 (확정)","살벌해 보여도 네 분 모두 청년의 이야기에 공감해 주실 분들입니다. 소통의 장, 토론회를 했으면 좋겠습니다."]],"notes":["특정인 지목 회피 + 네 분 존중 + ★토론회 요구로 전환(확정 지침)."]},{"no":716,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"10. 김보미 후보의 정치인 롤모델이 있는지도 궁금한데?","tags":["김대중","지방자치","호남"],"script":["김대중 대통령입니다. 이유는 두 가지입니다.","첫째, 김대중 대통령은 '미스터 지방자치'셨습니다. 대한민국 지방자치를 만드신 분이죠. 지방자치가 곧 풀뿌리 민주주의라는 것을 평생 강조하셨습니다. 강진에서 기초의원으로 시작한 저에게 그 정신은 교과서였습니다.","★ 둘째, 젊은 피를 수혈한 위대한 멘토셨습니다. 30여 년 전 서른두 살의 청년 김민석을 과감히 발탁하셨고, 송영길·임종석 같은 젊은 인재들을 끌어올려 민주당의 미래를 준비하셨습니다. 그 시절 민주당은 가장 젊고 역동적이었고, 2030 지지율도 가장 높았습니다.","★ 지금 유력 후보라는 그분들이 바로 김대중의 젊은 피 수혈로 정치를 시작한 분들입니다. 그런데 그 수혈을 받았던 분들이 30년이 지나도록 다음 세대에게는 피를 돌리지 않고 있습니다. 김대중 정신을 잇는 길은 지금 다시 2030에게 기회를 주는 것입니다.","지방자치와 청년, 제가 걷는 두 길이 모두 김대중 대통령에게서 왔습니다. 저는 그 도전과 포용의 적통을 잇고 싶습니다."],"quotes":[["김보미 (확정)","김대중은 서른두 살 김민석을 발탁하고 송영길 같은 젊은 피를 수혈해 민주당의 전성기를 만들었습니다."],["김보미 (확정)","그 수혈을 받았던 분들이 30년이 지나도록 다음 세대에게는 피를 돌리지 않고 있습니다."]],"notes":["롤모델=김대중. ★젊은 피 수혈(김민석·송영길 발탁) → ★'수혈받은 그들이 이제는 안 돌린다' 반전 → 2030 필요 어필."]},{"no":717,"media":"바삭한인터뷰","part":"바삭한인터뷰","label":"바삭","q":"11. 마지막으로, 10년 뒤·20년 뒤 어떤 '정치인 김보미'의 모습일지 말씀해주신다면?","tags":["대전환","클로징","계란과바위","홍대선언","똑순이"],"script":["★ 오늘 홍대선언, 기대해 주십시오. 본선에 가든 가지 않든, 저는 제가 한 약속을 평생이 걸리더라도 지킬 것입니다. 제 별명이 똑순이, 오뚝이, 그리고 '강진의 이재명'입니다.","저는 약한 계란이고, 40년 이 나라 정치를 독점한 686 기득권은 큰 바위죠. 하지만 바위는 너무 오래 비를 맞아 허물어지기 직전이고, 계란은 생명을 품고 있습니다.","★ 저는 이번 경선에서 확인했습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들이 있다는 것을, 자신의 젊은 날을 기억하며 청년의 도전에 손을 내미는 시민들이 있다는 것을 — 가슴 깊숙한 울림으로 확인했습니다.","★ 그 한 표 한 표가 바위에 금을 내고 있습니다. 규칙을 만든 사람들의 정당, 기득권이 다 해먹는 정당을 끝내고, 침묵하는 다수의 소리를 듣는 정당을 만드는 데 평생을 바치겠습니다.","★ 과거에 복수하는 싸우는 정당을 끝내고, 미래의 언어로 일하는 정당을 만들겠습니다. 새로운 민주당을 — 존경하는 당원 여러분, 그리고 묵묵히 김보미를 응원하는 국민 여러분과 함께 만들겠습니다."],"quotes":[["김보미 (확정)","바위는 너무 오래 비를 맞아 허물어지기 직전이고, 계란은 생명을 품고 있습니다."],["김보미 (확정)","기득권이 다 해먹는 정당을 끝내고, 침묵하는 다수의 소리를 듣는 정당에 평생을 바치겠습니다."],["김보미 (확정)","오늘 홍대선언, 기대해 주십시오."]],"notes":["★홍대선언 예고로 시작(중요!) → 별명 → 계란=생명 서사 → ★가치 투표 확인 → ★침묵하는 다수 → ★미래의 언어. 최종 클로징."]},{"no":1101,"media":"뉴스핌(서면)","q":"1. 당대표 출마를 결심하게 된 배경은 무엇인지.","tags":["내로남불","2030","민주주의","세대교체","686","기득권","뉴스핌(서면)"],"script":["지금 민주당은 죽기 직전입니다. 공정도, 민주주의도, 청년도, 미래도, 세대교체도 없는 '5무(無) 정당'이 되었습니다. 내로남불 정당, 불공정의 아이콘, 686 꼰대 정당으로 가면 2030은 다 떠나고 총선과 대선에서 모두 집니다.","저는 그 불공정의 피해 당사자이기도 합니다. 지난 강진군수 경선에서 당헌·당규에도 없는 새 지침으로 기어이 15%를 감산당했고, 전과 5범 상대 후보는 감산 없이 공천을 받았습니다. 결국 무소속에게 당을 통째로 내준 공천 참사였습니다. 이런 일이 어디 강진뿐이겠습니까.","분명히 말씀드립니다. 저는 누구를 떨어뜨리기 위해서가 아니라, 제가 당선되기 위해 나왔습니다. 저라도 나와서 세대교체를 말하고 청년정치를 살려야 한다고 외쳐야 한다고 생각했습니다. '질 것 같으니 나오지 마라'는 기득권의 언어를 깨러 나왔습니다. 민주당의 역사는 계란이 바위를 깬 역사입니다. 김대중도, 노무현도 처음엔 다 계란이었습니다."]},{"no":1102,"media":"뉴스핌(서면)","q":"2. 정청래, 송영길, 김민석 이른바 686세대 후보들을 향한 직설적인 발언에 대해 당원들의 반응은 어떻게 체감하고 있는지.","tags":["여론조사","문자폭탄","진영논리","86세대","유불리","686","뉴스핌(서면)"],"script":["양쪽에서 공격받고 있습니다. 제가 정청래 후보를 비판하면 김민석 지지자들이 '우쭈쭈' 해주고, 김민석 후보를 비판하면 정청래 지지자들이 '우쭈쭈' 하십니다. 하지만 저는 그런 분들 들러리 서러 나온 것이 아닙니다. 문자폭탄도 받고, 진영논리에 따라 글의 논리를 비틀어 왜곡하는 일도 겪고 있습니다.","그러나 응원과 격려가 훨씬 많습니다. '우리가 하고 싶었던 말이니 마음껏 하라'며 지지해 주시는 당원 동지들이 계십니다. 실제로 여론조사 지지율이 3일 만에 4배로 올랐습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들이 있다는 것을, 가슴 깊숙한 울림으로 확인하고 있습니다. 그 한 표 한 표가 바위에 금을 내고 있습니다."]},{"no":1103,"media":"뉴스핌(서면)","q":"3. 현실적으로 당장의 세대교체가 어렵다면 어떤 대안이 가능하다고 보는지, 앞으로 민주당에는 어떤 변화가 필요하다고 보는지.","tags":["청년최고위원","민주주의","세대교체","최고위원","대전환","최고위","뉴스핌(서면)"],"script":["세대교체는 사람 몇 명을 바꾸는 문제가 아니라 제도의 문제입니다. 스스로 물러날 사람은 없습니다. 제도로 교체가 이루어질 수밖에 없도록 만드는 것이 유일한 길입니다.","그래서 저는 '민주당 대전환을 위한 11대 공약'을 발표했습니다. 국회의원이든 자치단체장이든 같은 지역구 3선 초과 공천 금지를 당헌에 제도화하겠습니다(민주당 혁신위도 이미 제안했던 방안입니다). 청년 기준을 45세에서 40세로 낮추고, 선출직 청년최고위원을 당헌에 명문화하며, 지명직 최고위원 2명도 청년으로 임명하겠습니다.","동시에 떠나는 선배들에게는 '가장 아름다운 퇴장'을 준비해 드리겠습니다. 선배들의 헌신은 당의 역사에 기념비로 기록하고 예우하되, 그 역사가 다음 세대를 차단하는 성벽이 되어서는 안 됩니다. 민주주의는 권력을 얻는 것이 아니라 다음 세대에게 넘겨줄 때 완성됩니다. 산업화 세대가 민주화 세대에게 대한민국을 넘겨주었듯, 이제 민주화 세대가 미래세대에게 민주당을 넘겨줄 때입니다."]},{"no":1104,"media":"뉴스핌(서면)","q":"4. 최근에 있었던 전당대회 기탁금 논란과 선호투표제 도입 및 예비경선(컷오프)에 대한 입장이 궁금하다.","tags":["선호투표제","당원주권","예비경선","선호투표","전당대회","기탁금","뉴스핌(서면)"],"script":["기탁금부터 말씀드리면, 저는 예비경선 기탁금 1천만 원이 없어서 등록 당일 다섯 군데에서 빌렸습니다. 기탁금 구하느라 하루, 후원계좌 만드느라 하루를 허비했습니다. 선거기간이 겨우 4일인데 말입니다. '과하다'는 비판에 2천만 원씩 깎았지만, 무슨 배추값 깎아주는 것도 아니고, 기탁금은 깎을 것이 아니라 없애야 합니다. 기탁금을 내렸다지만 예비경선에서는 전혀 의미가 없습니다. 이미 문턱 자체가 높았고, 기탁금 인하를 체감하려면 본선에 올라가야 하기 때문입니다. 나라도 선거공영제를 하는데 정당이 아직도 기탁금을 받습니다. 당직선거 공영제를 도입해 돈 없어도, 계파 없어도 도전할 수 있는 정당을 만들겠습니다.","선호투표제 도입 자체는 환영합니다. 1순위는 물론 2순위 지지까지 버리지 않는 것이 진짜 당원주권입니다. 다만 일회성으로 끝내지 말고 모든 경선에 항구적으로 제도화해야 하고, 순위별 득표 데이터를 100% 공개해야 완성됩니다. 공개하지 못할 경선이라면 공정한 경선이라 말할 수 없습니다.","컷오프는 반대합니다. 선호투표제를 도입했으면 표가 갈릴 걱정이 없는데 왜 후보를 자릅니까. 특히 5일짜리 예비경선, 후보를 딱 한 번 앉혀 놓고 7분 연설만 시키는 '동영상 촬영회'는 청년의 진입을 가로막는 칸막이입니다. 예비경선은 후보가 6명 이상일 때만 실시하고, 하더라도 2주 이상의 선거운동 기간과 최소 3회 이상의 토론회를 보장해야 합니다."]},{"no":1105,"media":"뉴스핌(서면)","q":"5. 검찰개혁과 보완수사권 폐지에 관한 생각은.","tags":["보완수사권","검찰개혁","견제","의제","뉴스핌(서면)"],"script":["검찰개혁과 내란 청산은 반드시 완수해야 합니다. 안 하자는 것이 아니라 완성하자는 것입니다. 다만 칼은 뺏어도 좋지만 선까지 자를 일은 아닙니다. 검찰과 경찰이 서로 견제하는 제도여야 합니다. 정치검찰도 안 되지만 경찰 독주도 안 됩니다. 그리고 최근 사건들에서 보듯 피해자 보호 공백은 절대 있어서는 안 됩니다. 여성단체들이 우려하는 지점이 바로 그것입니다. 속도보다 방향, 그리고 국민 안전이 먼저입니다.","동시에 민주당이 국민에게 내놓을 의제가 검찰개혁뿐일 수는 없습니다. 과거에 복수하는 '복수혈전 민주당'을 미래를 여는 '미래선도 민주당'으로 바꿔야 합니다."]},{"no":1106,"media":"뉴스핌(서면)","q":"6. 김민석 후보가 제기한 신천지 전당대회 개입설은 어떻게 보는가.","tags":["당원명부","전수조사","민주주의","전당대회","불법당원","기득권","뉴스핌(서면)"],"script":["의혹이 사실이라면, 자신의 투표권을 대리인에게 넘긴 명백한 불법 당원입니다. 불법당원을 전수조사하고 모두 솎아낸 뒤 경선을 해야 하는 것 아닙니까. 검증하자는 것입니다.","당원명부를 행정안전부 주민등록 자료와 대조하고 자발적 가입 여부를 전수 확인해 정비해야 합니다. 자격을 검증하지 않은 1인 1표는 기득권을 지키기 위한 가짜 민주주의일 뿐입니다."]},{"no":1107,"media":"뉴스핌(서면)","q":"7. 민주당이 2030세대의 지지를 얻지 못하는 이유는 무엇이며, 이를 극복하기 위해 어떤 노력을 해야 한다고 생각하는지.","tags":["청년최고위원","내로남불","2030","청년정책","최고위원","기탁금","뉴스핌(서면)"],"script":["청년이 민주당을 떠난 것이 아니라 민주당이 먼저 청년을 버렸습니다. 청년이 떠난 가장 큰 이유는 정책이 부족해서가 아니라 공정을 잃었기 때문입니다. 청년에게는 원칙을 들이대고 기득권에게는 특혜를 줍니다. 청년 정치를 확대하겠다면서 청년최고위원을 부결시켰고, 청년에게 기회를 준다면서 기탁금을 올렸습니다. 청년들은 민주당이 청년을 '말'하지만 청년을 '이용'한다는 것을 압니다. 공격할 때 꺼내 쓰는 도구, 배경의 병풍 — 이것이 민주당이 청년을 보는 서글픈 현주소입니다.","극복하려면 제일 먼저 내로남불을 버려야 합니다. 그리고 청년에게 자리가 아니라 권력과 권한을 줘야 합니다. 당 예산의 10%를 청년이 직접 편성·집행·평가하게 하고, 청년위원회를 청년정책의 최고 의결기구로 격상해 그 결정을 당이 입법하도록 의무화하겠습니다. 마이크가 아니라 예산을, 자리가 아니라 결정권을 주는 것 — 그것이 진짜 청년 정치입니다."]},{"no":1108,"media":"뉴스핌(서면)","q":"8. 다른 당대표 후보들과 비교했을 때 본인만의 차별화된 경쟁력은 무엇이며 대표적인 공약은 무엇인지.","tags":["메가프로젝트","미래전환위","김보미닷컴","당원명부","유리상자","기탁금","뉴스핌(서면)"],"script":["첫째, 저는 계파가 없습니다. 추미애 대표 때 공천받고, 이낙연 대표 때 제명되고, 이재명 대표 때 복당한 제가 누구의 계파가 되겠습니까. 신세 진 사람도 챙길 사람도 단 한 명 없어서 자유로운 사람, 그래서 거침없이 개혁할 수 있는 유일한 후보입니다. 개혁은 챙겨야 할 사람이 많은 사람은 할 수 없습니다.","둘째, 말이 아니라 시스템을 만드는 실력입니다. 저는 강진군수 낙선 이후 공약을 이행하기 위해, 243개 지자체의 예산과 집행내역, 계약현황 등을 3초 만에 확인할 수 있는 지방재정 감시 플랫폼 '나라살림 돋보기'를 직접 만들었습니다.","대표 공약은 '뽑고 싶은 민주당'을 만드는 것입니다. 경선의 모든 과정을 공개하는 유리상자 경선(결과 전량 공개·룰 D-180 동결), 당원명부 검증과 당비 월 1만 원의 진짜 1인 1표, 기탁금 폐지와 당직선거 공영제, 같은 지역구 3선 초과 공천 금지, 청년 예산 의결권 10%, 그리고 당대표 직속 미래전환위원회를 설치해 대통령과 함께 반도체·AI 데이터센터·피지컬 AI 3대 메가프로젝트를 성공시키는 것입니다. 자세한 내용은 김보미닷컴에 모두 공개되어 있습니다."]},{"no":1201,"media":"무등일보(서면)","q":"1-①. 36세 원외 정치인이 당대표 선거에 출마한 가장 결정적인 이유, 지금 민주당에 가장 시급한 변화는.","tags":["골든타임","민주주의","시대정신","세대교체","686","주의","무등일보(서면)"],"script":["민주당이 죽기 직전이기 때문입니다. 공정·민주주의·청년·미래·세대교체가 모두 사라진 '5무 정당'이 됐습니다.","가장 시급한 변화는 세대교체입니다. 686이 786, 886까지 가면 민주당은 망합니다. 이번에도 686 세 분으로 본경선을 치르면 총선·대선에서 이기기 어렵습니다. 세대교체는 시대정신입니다. 지금 이 골든타임을 놓치면 총선도, 대선도 필패합니다."]},{"no":1202,"media":"무등일보(서면)","q":"1-②. 당선 가능성이 높지 않다는 평가에도 출마를 결심한 이유는.","tags":["여론조사","686","기득권","노무현","김대중","2%","무등일보(서면)"],"script":["민주당의 역사는 계란으로 바위치기의 역사입니다. 김대중은 서슬 퍼런 군사독재 치하에서도 도전했고, 노무현은 지지율 2%로 시작했습니다. 월드컵에서 우승해야만 출전할 수 있습니까? 정치는 당선 가능성만 보고 도전하는 것이 아닙니다.","저는 약한 계란이고 686 기득권은 큰 바위입니다. 그러나 바위는 40년 비를 맞아 허물어지기 직전이고, 계란은 생명을 품고 있습니다. 이번 경선 여론조사꽃 조사에서 2.9%를 확인했습니다. 이 짧은 기간에도 가치를 보고 표를 던지는 당원들이 계시다는 뜻입니다. 그 한 표 한 표가 지금 바위에 금을 내고 있습니다."]},{"no":1203,"media":"무등일보(서면)","q":"1-③. 경험 부족이나 정치적 무게감에 대한 지적은.","tags":["지방의회","지방의원","축소판","김민석","김대중","맘다니","무등일보(서면)"],"script":["나이는 서른여섯이지만 입당 13년, 군의원 재선에 전국 최연소 기초의회 의장을 지냈습니다. 지방의회는 중앙의 축소판입니다. 예산 심의, 행정 감사, 조례 제정, 주민 대변 — 국회가 하는 일을 규모만 작게 다 합니다. 오히려 지방의회 경험도 없이 중앙정치를 하는 분들이 허다합니다. 유럽은 지방의원부터 정치인을 양성하고, 뉴욕시장 맘다니는 저보다 동생뻘입니다.","김대중 대통령께서는 '젊은 피 수혈'로 청년 김민석·송영길을 과감히 발탁하셨고, 그 청년들이 민주당의 주역으로 성장하지 않았습니까. 그때는 되고 지금은 왜 안 됩니까. 청년을 믿고 맡겨 주십시오."]},{"no":1204,"media":"무등일보(서면)","q":"1-④. 당선 외에 반드시 얻고 싶은 정치적 성과는.","tags":["세대교체","전당대회","대전환","청년","의제","의미","무등일보(서면)"],"script":["청년이 민주당에서 도전하는 것이 무모한 일이 아니라 자연스러운 일이 되게 만드는 것입니다. 제가 당대표가 되지 못하더라도 다음 세대 청년 정치인들이 '김보미가 길을 열었다'고 말할 수 있다면 그 자체로 의미 있는 도전입니다. 그리고 세대교체와 대전환이 이번 전당대회의 의제가 되게 하는 것 — 그것은 이미 이루어지고 있다고 생각합니다."]},{"no":1205,"media":"무등일보(서면)","q":"1-⑤. 전당대회 이후의 정치 행보는.","tags":["전당대회","똑순이","기득권","오뚝이","호남","현장","무등일보(서면)"],"script":["본선에 가든 가지 않든, 제가 한 약속은 평생이 걸리더라도 지킬 것입니다. 제 별명이 똑순이, 오뚝이입니다. 규칙을 만든 사람들의 정당, 기득권 정당을 끝내고 침묵하는 다수의 소리를 듣는 정당을 만드는 데 평생을 바치겠습니다. 호남에서, 현장에서 계속 정치하겠습니다."]},{"no":1206,"media":"무등일보(서면)","q":"2-①. 세대교체의 구체적인 기준과 시점은.","tags":["세대교체","당헌","공천","무등일보(서면)"],"script":["기준은 나이가 아니라 '독점'입니다. 같은 지역구에서 연달아든 건너뛰든 합계 세 번을 지냈다면 더는 공천하지 않는 '동일 지역구 3선 초과 공천 금지'를 당헌에 제도화하겠습니다. 민주당 혁신위원회도 이미 제안했던 방안입니다."]},{"no":1207,"media":"무등일보(서면)","q":"2-②. 연령 외에, 남을 정치인과 물러날 정치인의 판단 기준은.","tags":["세대교체","기득권","물갈이","검증","공정","무등일보(서면)"],"script":["실력과 정책으로 공정하게 경쟁할 의사가 있느냐입니다. 몇 살이든 공개 토론과 연설로 검증받고 이기면 됩니다. 문제는 경쟁 자체를 회피하는 것 — 규칙을 사람에 따라 유리하게 바꾸고, 토론을 거부하고, 결과를 공개하지 않는 행태입니다. 그런 분이라면 나이와 무관하게 물러나야 할 기득권입니다. 공정한 기회만 주어지면 세대교체와 물갈이는 강요하지 않아도 저절로 이루어질 것이라고 확신합니다."]},{"no":1208,"media":"무등일보(서면)","q":"2-③. '청년 후보가 선배 세대 전체를 싸잡아 비판한다'는 반론에는.","tags":["민주주의","686","기득권","주의","청년","용기","무등일보(서면)"],"script":["저는 686 선배님들을 진심으로 존경합니다. 최루탄을 맞고 감옥에 가며 민주주의를 만드셨고, 제가 선배님들을 비판할 자유도 그분들이 만들어 주신 것입니다.","저는 사람을 비판하는 것이 아니라 구조를 비판합니다. 선배님들이 변한 것이 아니라, 너무 오래 권력의 중심에 계셔서 자신도 모르게 기득권이 되신 것입니다. 기득권은 문제를 안 보려 하고 책임지지 않습니다. 독재권력에 맞섰던 그 용기를, 이제는 권력을 내려놓는 용기로 완성해 주시기를 정중히 요청드리는 것입니다."]},{"no":1209,"media":"무등일보(서면)","q":"2-④. 계파정치·공천제도·당내 민주주의·정책 경쟁 등 구조적 문제에 대한 입장은.","tags":["족보정치","민주주의","시스템","계파","주의","적통","무등일보(서면)"],"script":["네 가지가 사실 하나의 문제입니다. 실력보다 의리, 정책보다 인맥, 원칙보다 예외가 앞서는 구조입니다. 계파는 족보정치를 낳고(적통 논쟁·족보 캐기는 당장 중단해야 합니다), 그 계파가 공천을 좌우하니 '단, 달리 정할 수 있다'는 고무줄 규칙이 넘쳐나고, 결과를 공개하지 않는 가짜 1인 1표가 유지되고, 정책 경쟁은 실종됩니다.","해법도 하나로 통합니다 — 시스템으로 움직이는 정당입니다. 경선 룰 6개월 전 확정, 경선 결과 100% 공개, 토론 의무제, 그리고 직급 떼고 계파 떼고 정책으로 토론하는 한국형 알메달렌입니다."]},{"no":1210,"media":"무등일보(서면)","q":"2-⑤. 청년에게 실질적 결정권을 주기 위해 가장 먼저 바꿔야 할 제도 하나는.","tags":["청년정책","들러리","결정권","예산","청년","무등일보(서면)"],"script":["당 청년위원회를 청년정책의 최고 의결기구로 격상하고, 청년위가 결정한 정책은 당이 책임지고 입법하도록 의무화하는 것입니다. 자문은 권한이 아닙니다. 여기에 당 예산의 10%를 청년이 직접 편성·집행·평가하는 청년 예산 의결권을 더하면, 청년은 더 이상 들러리가 아니라 주주가 됩니다."]},{"no":1211,"media":"무등일보(서면)","q":"3-①. 정견 발표 과정에서 발언을 제지당했다는 상황의 구체적 설명.","tags":["예비경선","토론회","청년","현장","5일","무등일보(서면)"],"script":["이번 예비경선 자체가 구조적인 '입틀막'이었습니다. 선거운동 기간은 단 5일이었고, 후보를 딱 한 번 앉혀 놓고 7분 연설만 시키는 '동영상 촬영회'가 정견 발표의 전부였습니다. 후보 간 토론회는 단 한 번도 없었습니다. 청년 후보가 자신을 알릴 통로를 제도적으로 막아 놓은 것입니다. 발언 시간 제한과 제지의 구체적 경위는 현장 영상과 함께 말씀드리겠습니다."]},{"no":1212,"media":"무등일보(서면)","q":"3-②. '김어준씨가 끝까지 발언 기회를 줬다'는 일부 평가에 대해서는.","tags":["김어준","686","기득권","정청래","청년","반복","무등일보(서면)"],"script":["발언 기회를 주신 것은 사실이고, 불러주신 것 자체에 감사합니다. 제가 문제 삼는 것은 시간이 아니라 질문의 전제입니다. '당선될 리 없는데 왜 나왔냐', '정청래 떨어뜨리러 나온 것 아니냐'가 반복됐습니다. 청년이 나오면 '왜 나왔느냐'부터 검증받아야 하는 것, 그것이 기득권 정당의 풍경입니다. 686 선배들이 출마할 때 왜 나왔냐고 묻는 사람은 아무도 없지 않습니까."]},{"no":1213,"media":"무등일보(서면)","q":"3-③. 뉴스공장 인터뷰에서 가장 뼈아팠던 지적이나 아쉬웠던 대응은.","tags":["뉴스공장","현실","무등일보(서면)"],"script":["솔직히 흠씬 두들겨 맞고 왔습니다. 제 진심이 왜곡되는 것 같아 저도 모르게 말려들었고, 노련하게 대처하지 못한 것은 저의 부족함입니다. 인정합니다.","다만 '현실을 인정하라'는 말에는 지금도 동의하지 않습니다. 월드컵에서 우승하지 못하면 출전하지 말아야 하고, 서울대에 못 가면 공부를 포기해야 합니까. 민주당의 역사는 계란으로 바위치기의 역사입니다. 중요한 것은 꺾이지 않는 마음입니다."]},{"no":1214,"media":"무등일보(서면)","q":"3-④. '경청하는 민주당'을 위한 구체적 시스템은.","tags":["시스템","계파","경청","의제","무등일보(서면)"],"script":["세 가지입니다. 첫째, 분기마다 전 당원이 정책을 직접 표결하고 지도부가 공개 답변하는 상시 정책투표 플랫폼 '당원국회'. 둘째, 권리당원 1만 명이 서명하면 당무위에 자동 상정되고 60일 안에 답변해야 하는 '당원 1만인 발의제'. 셋째, 직급 떼고 계파 떼고 토론하는 전당원 토론 주간 '한국형 알메달렌'입니다. 경청은 태도가 아니라 시스템이어야 합니다."]},{"no":1215,"media":"무등일보(서면)","q":"4-①. 지방의회를 직접 경험하며 느낀 호남 정치의 가장 큰 문제는.","tags":["지방의회","청년","호남","공천","지방","무등일보(서면)"],"script":["호남에는 선거가 없고 공천만 있다는 것입니다. 공천이 곧 당선이니 주민이 아니라 공천권자를 바라보는 정치를 하게 됩니다. 지역에서는 국회의원이 왕입니다. 밉보이면 아무것도 할 수 없고, 말 잘 듣는 청년만 클 수 있습니다. 아무리 실력이 있어도 자기 말을 안 듣거나 자리를 위협할 것 같으면 가차 없이 잘라버립니다."]},{"no":1216,"media":"무등일보(서면)","q":"4-②. '전라도에 민주주의가 없다', '군수는 제왕, 의회는 거수기' 발언의 배경.","tags":["허위사실","민주주의","예산","견제","주의","감사","무등일보(서면)"],"script":["일당 독점 구조에서는 견제가 사라집니다. 집행부를 감시해야 할 의회가 거수기가 되어 침묵하는 구조를 8년간 직접 봤습니다.","저는 그 구조에 순응하지 않았습니다. 사상 최초로 일문일답 군정질문을 도입해 집행부에 따져 물었고, 낭비예산 108억 원을 삭감했으며, 행정사무감사 시정요구를 최다로 지적했습니다. 그 대가로 표적 징계와 제명, 수사, 허위사실 보도와 언론 조리돌림까지 — 그야말로 탈탈 털렸습니다. 구체적인 사례들은 이미 언론에 보도된 사실관계를 중심으로 말씀드리겠습니다."]},{"no":1217,"media":"무등일보(서면)","q":"4-⑤. 전국 지방의회가 가장 먼저 도입해야 할 변화는.","tags":["지방의회","유리상자","강진","감사","지방","무등일보(서면)"],"script":["'유리상자 의회'입니다. 구체적으로는 일문일답식 질문 제도와 본회의·행정사무감사 실시간 생중계, 그리고 업무추진비 전면 공개입니다. 강진에서 해봤습니다. 공개가 시작되면 행정이 바뀌고, 정치인의 실력이 그대로 드러납니다. 돈이 드는 일도 아닙니다. 의지의 문제일 뿐입니다."]},{"no":1218,"media":"무등일보(서면)","q":"5-①. 강진군수 경선에서 겪은 '불공정한 경선 운영'은 구체적으로.","tags":["토론회","당헌","강진","공천","공약","공정","무등일보(서면)"],"script":["네 가지입니다. 당헌·당규에 없는 새 지침을 만들어 저에게 기어이 15%를 감산했고, 전과 5범 상대 후보는 감산하지 않을 온갖 규정을 만들어 공천했습니다. 후보 토론회를 여러 차례 요청했지만 끝내 한 번도 열리지 않았습니다. 저는 공약을 66개 발표했는데 상대는 0개였습니다. 그리고 저는 제가 몇 표를 얻었는지, 투표율이 얼마였는지 지금도 모릅니다. 결과는 무소속 참패 — 공정을 팽개친 공천 참사였습니다."]},{"no":1219,"media":"무등일보(서면)","q":"5-②. 본인 같은 공천 탈락이 재발하지 않을 공천 시스템은.","tags":["단서조항","시스템","공천","탈락","검증","무등일보(서면)"],"script":["공천 3원칙입니다. 첫째, 예측 가능한 공천 — 경선 규칙은 최소 6개월 전 확정하고 '달리 정할 수 있다'는 단서조항을 전부 삭제합니다. 둘째, 투명한 공천 — 선거인 수·투표수·득표수를 48시간 안에 전량 공개하고, 가·감산은 사전 확정과 증거·소명 기회를 의무화합니다. 셋째, 경쟁력 중심 공천 — 토론·연설로 실력을 검증하고 토론 불참자는 감점합니다. 당한 사람이 바꿉니다."]},{"no":1220,"media":"무등일보(서면)","q":"5-③. '민주당 공천=당선'인 호남의 공천제도 개혁 방향은.","tags":["민주주의","토론회","공약집","주의","호남","공천","무등일보(서면)"],"script":["공천이 곧 당선인 곳일수록 공천이 곧 선거여야 합니다. 즉 본선거 수준의 검증을 경선에 도입해야 합니다. 의무 토론회와 유권자 앞 연설회, 정책 공약집 제출 의무화, 경선 결과 전량 공개, 그리고 외부 인사가 절반인 공정경선 옴부즈맨의 상시 감시입니다. 조직을 동원해 억지로 입당시키고 휴대폰 전화만 기다리는 공천에는 민주주의가 없습니다."]},{"no":1221,"media":"무등일보(서면)","q":"5-④. 호남 기초단체장·지방의원 공천에 실질 효과를 낼 공개 검증 방식은.","tags":["지방의원","토론회","호남","공천","지방","검증","무등일보(서면)"],"script":["권역별 순회 공개 토론회 최소 3회, 유권자·당원 누구나 참석하는 연설회, 그리고 전 과정 영상 아카이브 공개입니다. 여기에 정책·자질 시험을 더해 기본 소양을 검증하고, 검증 결과를 점수화해 공개하면 됩니다. 말 잘하는 사람이 아니라 답을 가진 사람, 줄 잘 서는 사람이 아니라 실력 있는 사람이 이기는 링을 만드는 것입니다."]},{"no":1222,"media":"무등일보(서면)","q":"6-①. 본인이 어떤 계파에도 속하지 않았다고 자신 있게 말할 수 있는 이유는.","tags":["이재명","계파","청년","공천","무등일보(서면)"],"script":["제 당적 이력이 증명합니다. 저는 추미애 대표 시절 공천받고, 이낙연 대표 시절 제명됐으며, 이재명 대표 시절 복당했습니다. 회사로 치면 사장이 수차례 바뀌었는데, 저는 도대체 무슨 계파입니까.","그리고 지금 양쪽에서 공격받고 있다는 사실 자체가 증거입니다. 어느 한쪽 사람이었다면 한쪽에서만 맞았을 것입니다. 애초에 청년은 계파에 끼워 주지도 않습니다. 벽을 쳐서 못 들어오게 막아 놓고, 사진 한 장 나오면 '누구 파냐'고 묻는 흥신소 정치가 웃길 따름입니다."]},{"no":1223,"media":"무등일보(서면)","q":"6-③. 대통령의 팔로우가 갖는 의미는.","tags":["평당원","팔로우","기탁금","격려","청년","감사","무등일보(서면)"],"script":["저 개인에 대한 격려라기보다 청년 정치에 대한 응원이라고 받아들입니다. 실제로 대통령께서는 청년들의 경제 사정을 고려해 기탁금 문제까지 제기하셨습니다. 대통령께서 말씀은 안 하셔도 청년 평당원의 목소리를 지켜보고 계신다는 것 — 감사한 일이지만, 그 이상도 이하도 아닙니다."]},{"no":1224,"media":"무등일보(서면)","q":"7-①. '호남 반도체 프로젝트'의 구체적 산업·지역 구상과 차별점은.","tags":["전략","광주","호남","AI","현실","무등일보(서면)"],"script":["수도권과 똑같은 클러스터를 하나 더 만드는 방식은 현실적이지 않습니다. 광주·전남이 잘하는 분야를 세계 최고로 만드는 전략이어야 합니다. 광주는 AI 국가시범도시이자 국가 AI데이터센터를 갖췄고, 전남은 풍부한 재생에너지와 넓은 산업용지가 있습니다. 두 지역이 결합하면 AI 반도체 설계(팹리스), AI 서버·데이터센터, 전력반도체·에너지반도체, 패키징에서 충분히 세계적 경쟁력을 가질 수 있습니다.","AI 시대에는 공장만이 아니라 데이터센터·전력·재생에너지 공급 능력이 함께 가야 하는데, 광주·전남은 그 조건을 갖춘 몇 안 되는 지역입니다. 수도권과 '경쟁'하는 것이 아니라 대한민국 AI 반도체 생태계를 '완성'하는 것 — 그것이 차별점입니다."]},{"no":1225,"media":"무등일보(서면)","q":"7-②. 호남이 '두 번째 수도권'이 되기 위해 가장 먼저 해결할 문제는.","tags":["메가프로젝트","청년","호남","무등일보(서면)"],"script":["일자리입니다. 산업이 없으면 청년이 없고, 청년이 없으면 미래가 없습니다. 그래서 반도체 800조 투자를 자기 선거에 이용하는 정치부터 끝내야 합니다. '전북 소외론'으로 전남·전북을 가르고 친문·친명을 가르는 정치로는 아무것도 성공시킬 수 없습니다. 호남인 김보미가 대통령과 함께 3대 메가프로젝트를 하나하나 뒷받침하겠습니다."]},{"no":1226,"media":"무등일보(서면)","q":"7-③. 청년이 호남에 정착하기 위해 가장 필요한 정책 한 가지는.","tags":["청년취업보장제","전략","청년","광주","호남","AI","무등일보(서면)"],"script":["청년취업보장제입니다. 호남 청년들이 공무원 시험이 아니라 AI와 첨단산업에서 꿈을 키울 수 있어야 합니다. 정부의 국가 AI 전략과 광주·전남의 미래산업 전략을 연결해, 배우고 취업하고 정착하는 사다리를 지역 안에 만드는 것 — 그것이 청년 유출을 막는 유일한 근본 대책입니다."]},{"no":1227,"media":"무등일보(서면)","q":"8-①. 2030이 민주당을 떠났다고 체감한 구체적 사례는.","tags":["2030","무당층","우쭈쭈","청년","무등일보(서면)"],"script":["숫자가 말해줍니다. 18~29세의 절반 가까이가 무당층입니다. 제 또래 친구들은 민주당 이야기가 나오면 화를 내는 것이 아니라 관심을 꺼버립니다. 분노보다 무서운 것이 무관심입니다. 그리고 이번 경선에서 제가 직접 겪었습니다. 진영에 따라 환호와 비난이 뒤바뀌는 '우쭈쭈 정치'에 청년들은 완전히 질려 있습니다."]},{"no":1228,"media":"무등일보(서면)","q":"8-②. '청년 정치의 실질적인 권한'이란 무엇인가.","tags":["청년최고위원","청년정책","청년정당","최고위원","최고위","결정권","무등일보(서면)"],"script":["자리가 아니라 예산과 결정권입니다. 당 예산의 10%를 청년이 직접 편성·집행·평가하고, 청년위원회가 청년정책의 최고 의결기구가 되어 그 결정이 당론 입법으로 이어지는 것입니다. 청년최고위원 한 자리 준다고 청년정당이 되는 것이 아닙니다."]},{"no":1229,"media":"무등일보(서면)","q":"8-③. 지방선거 공천에서 청년의 진입을 가로막는 가장 큰 장벽은.","tags":["지방선거","기탁금","공영제","계파","청년","공천","무등일보(서면)"],"script":["돈, 조직, 그리고 국회의원의 눈치 — 세 가지입니다. 청년은 돈이 없으면 출마하기 어렵고, 조직이 없으면 경쟁하기 어렵고, 계파가 없으면 알려질 기회조차 얻기 어렵습니다. 그래서 기탁금 폐지와 경선비용 공영제를 추진하겠습니다."]},{"no":1230,"media":"무등일보(서면)","q":"9-①. 취임 후 100일 안에 반드시 바꾸고 싶은 것 3가지는.","tags":["청년최고위원","최고위원","기탁금","공영제","시스템","최고위","무등일보(서면)"],"script":["첫째, 경선 룰 D-180 동결제와 경선 결과 100% 공개(48시간 룰)를 당헌에 명문화하겠습니다. 둘째, 기탁금을 폐지하고 당직선거 공영제를 도입하겠습니다. 셋째, 선출직 청년최고위원 당헌 명문화와 청년위원회 최고 의결기구화 — 취임 당일 1호 안건으로 발의해 30일 안에 개정을 완료하겠습니다. 여기에 국고보조금·당비 사용 내역을 10원짜리 하나까지 공개하는 재정 대시보드까지, 100일 안에 '시스템 정당'의 뼈대를 세우겠습니다."]},{"no":1231,"media":"무등일보(서면)","q":"9-③. '민주주의·개혁'의 가치와 'AI·일자리·주거' 같은 실용 의제를 어떻게 결합하나.","tags":["미래전환위","민주주의","대전환","계파","주의","청년","무등일보(서면)"],"script":["둘은 대립하지 않습니다. 공정한 절차(민주주의)가 있어야 실력 있는 사람이 정책을 만들고, 그래야 실용적 성과가 나옵니다. 지금 민주당의 문제는 가치도 실용도 아닌 '계파'가 의사결정을 지배한다는 것입니다.","당대표 직속 미래전환위원회를 설치해 AI·반도체·로봇·재생에너지·바이오·양자·우주항공 7대 미래산업을 당이 직접 챙기고, AI 전직훈련계좌·기본 AI·소버린 AI의 'AI 대전환 3대 약속'으로 청년의 삶과 직결된 의제를 당의 중심에 세우겠습니다."]},{"no":1232,"media":"무등일보(서면)","q":"9-⑤. 다음 총선·대선 승리를 위해 버려야 할 것 하나, 가져가야 할 것 하나는.","tags":["내로남불","족보정치","노무현","김대중","적통","족보","무등일보(서면)"],"script":["버려야 할 것은 내로남불과 족보정치입니다. 누가 원조 친명인지, 누가 더 적통인지 국민은 아무 관심이 없습니다. 가져가야 할 것은 김대중·노무현의 도전 정신입니다. 민주당의 적통은 혈통이 아니라, 계란으로 바위를 쳤던 그 도전 정신입니다. 저 김보미가 그 적통을 잇겠습니다."]},{"no":1301,"media":"뉴스1(서면)","q":"1. 당대표에 도전하시게 된 배경을 다시 한번 여쭙고 싶습니다.","tags":["골든타임","당선되러","민주주의","시대정신","세대교체","686","뉴스1(서면)"],"script":["민주당이 죽기 직전이기 때문입니다. 공정·민주주의·청년·미래·세대교체가 모두 사라진 '5무 정당'이 됐습니다. 청년이 나오면 '왜 나왔느냐'부터 검증받아야 하는 정당, 686 선배들이 출마할 때는 아무도 묻지 않는 그 질문을 청년에게만 던지는 정당 — 그것이 지금 민주당의 현주소입니다.","가장 시급한 것은 세대교체입니다. 686이 786, 886까지 가면 민주당은 망합니다. 세대교체는 시대정신이고, 지금이 골든타임입니다. 이 골든타임을 놓치면 총선도, 대선도 필패합니다. 저는 죽어가는 민주당을 살리러, 당선되러 나왔습니다."]},{"no":1302,"media":"뉴스1(서면)","q":"2. 일각에서는 후보님의 도전을 두고 '계란으로 바위 치기'라는 시선도 보냅니다. 거물급 주자들과 비교해 후보님만이 가진 가장 차별화된 실력과 무기는 무엇입니까?","tags":["기득권","노무현","김대중","예산","청년","무기","뉴스1(서면)"],"script":["맞습니다. 저는 계란입니다. 그런데 민주당의 역사가 바로 계란으로 바위치기의 역사입니다. 김대중은 서슬 퍼런 군사독재 치하에서 도전했고, 노무현은 지지율 2%로 시작했습니다. '질 것 같으면 나오지 마라'는 말이야말로 기득권의 언어입니다. 그리고 바위는 40년 비를 맞아 허물어지기 직전이고, 계란은 생명을 품고 있습니다.","제 무기는 세 가지입니다. 첫째, 현장의 실력입니다. 입당 13년, 군의원 재선, 전국 최연소 기초의회 의장으로 사상 최초 일문일답 군정질문을 도입했고 낭비예산 108억 원을 삭감했습니다. 말이 아니라 기록으로 검증된 실력입니다. 둘째, 당한 사람의 개혁입니다. 당헌·당규에 없는 지침으로 15%를 감산당하고 표적 징계와 제명까지 겪었습니다. 불공정을 몸으로 통과한 사람이 가장 정확하게 고칩니다. 셋째, 미래의 언어입니다. 거물급 선배들은 과거의 훈장을 말하지만, 저는 AI·청년·지역의 미래 설계도를 말합니다. 잃을 것이 없는 사람의 용기, 그것이 침묵하는 다수를 대변할 수 있는 가장 큰 무기입니다."]},{"no":1303,"media":"뉴스1(서면)","q":"3. 검찰 보완수사권, 1인1표제, 적통 논란, 조국혁신당과의 통합까지 당대표 선거 의제가 적잖습니다. 각각에 대한 후보님의 생각을 한줄 정리해주신다면.","tags":["보완수사권","조국혁신당","당원주권","1인1표","노무현","김대중","뉴스1(서면)"],"script":["△검찰 보완수사권 — \"칼은 뺏어도 좋습니다. 그러나 국민을 지키는 선까지 자를 일은 아닙니다.\" 검·경이 서로 견제하게 하되, 범죄 피해자 보호에 공백이 생겨서는 안 됩니다. 개혁은 속도가 아니라 신뢰로 완성됩니다.","△1인1표제 — 결과를 공개하지 않는 1인 1표는 가짜입니다. 가짜·불법 당원을 솎아내고 경선 결과를 100% 공개해야 진짜 당원주권입니다.","△적통 논란 — 민주당의 적통은 혈통도 인맥도 아니라, 계란으로 바위를 쳤던 김대중·노무현의 도전 정신입니다. 족보 캐기는 당장 중단해야 합니다.","△조국혁신당과의 통합 — 당원이 빠진 합당 논의가 무슨 의미가 있습니까. 욕심보따리부터 내려놓아야 합니다."]},{"no":1304,"media":"뉴스1(서면)","q":"4. 현재 민주당이 마주한 가장 큰 위기이자 '김보미 체제'에서 가장 먼저 뜯어고쳐야 할 구태는 무엇입니까?","tags":["단서조항","무당층","계파","무기","당헌","룰","뉴스1(서면)"],"script":["가장 큰 위기는 미래의 이탈입니다. 18~29세의 절반 가까이가 무당층입니다. 제 또래 친구들은 민주당 이야기가 나오면 화를 내는 것이 아니라 관심을 꺼버립니다. 분노보다 무서운 것이 무관심입니다.","가장 먼저 뜯어고칠 구태는 '고무줄 규칙'입니다. 당헌·당규 곳곳의 '단, 달리 정할 수 있다'는 단서조항이 계파의 무기가 되어 왔습니다. 취임 당일 1호 안건으로 경선 룰 6개월 전 확정(D-180 동결제)과 경선 결과 100% 공개(48시간 룰)를 당헌에 명문화하겠습니다. 게임 도중에 심판이 규칙을 바꾸는 정당으로는 총선도 대선도 이길 수 없습니다."]},{"no":1305,"media":"뉴스1(서면)","q":"5. 출마 이후 친명계와 친청계 양측 모두로부터 공격을 받고 있습니다. 최고위원 선거까지 계파 대리전 양상으로 흐르며 갈등이 격화하고 있는데, 이러한 당내 계파 정치와 주류 세력의 독주 체제에 대해 어떻게 평가하십니까?","tags":["족보정치","홍대선언","최고위원","기득권","대리전","대전환","뉴스1(서면)"],"script":["양쪽에서 공격받고 있다는 사실 자체가 제가 어느 계파도 아니라는 증거입니다. 저는 추미애 대표 시절 공천받고, 이낙연 대표 시절 제명됐으며, 이재명 대표 시절 복당했습니다. 회사로 치면 사장이 수차례 바뀌었는데, 저는 도대체 무슨 계파입니까.","지금의 계파 정치는 족보정치입니다. 누가 원조 친명인지, 누가 더 적통인지 국민은 아무 관심이 없습니다. 사진 한 장 나오면 '누구 파냐'부터 묻는 흥신소 정치, 진영에 따라 환호와 비난이 뒤바뀌는 정치에 국민이 질려 있습니다. 계파는 실력보다 의리, 정책보다 인맥, 원칙보다 예외를 앞세우는 기득권 유지 장치일 뿐입니다. 해법은 하나 — 계파가 아니라 시스템으로 움직이는 정당입니다. 그래서 저는 홍대선언으로 디지털 정당 대전환을 제안했습니다."]},{"no":1306,"media":"뉴스1(서면)","q":"6. 후보님이 진단하는 청년의 민주당 외면 현상이 심화하는 본질적인 원인과 이를 해결할 복안은 무엇입니까?","tags":["청년취업보장제","청년최고위원","청년정책","청년정당","최고위원","기탁금","뉴스1(서면)"],"script":["본질은 간단합니다. 민주당이 청년을 주주가 아니라 병풍으로 써 왔기 때문입니다. 선거철마다 동원되고 이용되지만 실질적 권한은 하나도 없습니다. 누군가를 공격할 때 꺼내 쓰는 도구, 누군가의 배경에 서 있는 병풍 — 이것이 민주당이 청년을 대하는 방식이었습니다. 청년들은 그것을 정확히 알고 있고, 그래서 떠났습니다.","복안은 말이 아니라 권한입니다. 당 청년위원회를 청년정책의 최고 의결기구로 격상해 그 결정이 당론 입법으로 이어지게 하고, 당 예산의 10%를 청년이 직접 편성·집행·평가하게 하겠습니다. 기탁금을 폐지하고 당직선거 공영제를 도입해 돈 없어도 도전할 수 있는 링을 만들고, 청년취업보장제로 청년의 삶 자체를 당의 중심 의제로 세우겠습니다. 청년최고위원 한 자리 준다고 청년정당이 되는 것이 아닙니다."]},{"no":1307,"media":"뉴스1(서면)","q":"7. 이재명 정부 집권 2년 차를 맞아 여당으로서의 강력한 입법 지원도 중요하지만, 민심을 가감 없이 전달하는 당의 독자적인 목소리도 필요합니다. 후보님이 생각하는 가장 이상적인 '이재명 정부-민주당' 간의 당청 관계 모델은 무엇입니까?","tags":["메가프로젝트","문자폭탄","기후위기","재집권","대전환","이재명","뉴스1(서면)"],"script":["박수만 치는 여당은 대통령을 고립시키고, 할 말 하는 여당이 대통령을 성공시킵니다. 여당 당대표의 제1 임무는 이재명 정부를 성공시키고 재집권의 토대를 만드는 것이지만, 그 방법은 맹종이 아니라 경청과 직언이어야 합니다. 쓴소리에 문자폭탄으로 답하는 정당에는 미래가 없습니다.","정부의 성공은 대통령 혼자 만드는 것이 아니라 당이 만드는 것입니다. 지금처럼 계파 싸움으로 발목을 잡는 민주당이야말로 정부를 실패의 길로 이끕니다. 당이 미래 의제를 대통령보다 한발 앞서 준비하고 — AI 대전환, 반도체, 기후위기 — 대통령의 3대 메가프로젝트를 온몸으로 뒷받침하는 것, 그리고 민심을 가감 없이 전달하는 '경청 시스템'을 갖추는 것이 제가 생각하는 이상적인 당청 관계입니다."]},{"no":1308,"media":"뉴스1(서면)","q":"8. 이재명 대통령이 후보님의 엑스(X) 계정을 개설 하루 만에 팔로우하여 큰 화제가 되었습니다. 일각에서는 '이심(李心)이 세대교체론에 힘을 실어준 것 아니냐'는 해석도 나오는데, 이에 대한 생각이 궁금합니다.","tags":["세대교체","평당원","팔로우","기탁금","이재명","낙점","뉴스1(서면)"],"script":["정말 놀랐고, 감사한 마음이었습니다. 다만 저는 그것을 저 개인에 대한 격려라기보다 청년 정치에 대한 응원이라고 받아들입니다. 실제로 대통령께서는 청년들의 경제 사정을 고려해 기탁금 문제까지 제기하셨습니다. 대통령께서 말씀은 안 하셔도 청년 평당원의 목소리를 지켜보고 계신다는 것 — 감사한 일이지만, 그 이상도 이하도 아닙니다.","분명히 말씀드리면, 저는 누구의 낙점도 사주도 아니고 당원의 선택으로 여기까지 왔습니다. 세대교체에 힘을 실어주는 것은 '이심'이 아니라 당심과 민심입니다. 짧은 선거운동 기간에도 가치를 보고 표를 던지는 당원들을 확인했습니다. 그 한 표 한 표가 바위에 금을 내고 있습니다."]},{"no":1309,"media":"뉴스1(서면)","q":"9. 당대표가 되면 '이것만은 하고 싶다'는 게 있으신가요. 아울러 못다한 말씀이 있다면 부탁드립니다.","tags":["예비경선","전당대회","기탁금","공영제","시스템","당비","뉴스1(서면)"],"script":["'뽑고 싶은 민주당'을 만들고 싶습니다. 취임 100일 안에 시스템 정당의 뼈대를 세우겠습니다. 경선 룰 D-180 동결제와 경선 결과 100% 공개를 당헌에 명문화하고, 기탁금을 폐지해 당직선거 공영제를 도입하고, 청년위원회를 최고 의결기구로 격상하겠습니다. 여기에 국고보조금·당비 사용 내역을 10원짜리 하나까지 공개하는 재정 대시보드까지 — 규칙을 만든 사람들의 정당을 끝내고, 침묵하는 다수의 소리를 듣는 정당으로 바꾸겠습니다.","못다한 말씀을 드리자면, 본경선에서는 지지하시는 유력 후보님들 순위대로 마음껏 찍으시고, 예비경선에서만큼은 저 김보미를 링 위에 올려주십시오. 김보미가 올라가는 순간 전당대회는 가장 역동적인 무대가 될 것입니다. 저는 오늘도 계란입니다. 하지만 계란은 생명을 품고 있습니다. 저는 죽어도 다음 세대는 살아야 하지 않겠습니까. 이번 생엔, 계란으로 바위를 깨 보겠습니다."]},{"no":501,"part":8,"q":"어제 합동연설회가 끝났습니다. 현역 중진들과 경쟁 중인데, 현장에서 느낀 분위기는 어땠습니까?","tags":["합동연설회","기탁금","짧은경선","동영상촬영회","토론회부재","투표시작"],"script":["솔직히 다리가 떨렸습니다. 30년 넘게 정치를 해 오신 중진 선배님들 사이에 서른여섯 평당원이 섰으니까요. 그런데 연설이 시작되니 오히려 또렷해졌습니다. 선배님들은 과거를 말씀하시고, 저는 미래를 말했습니다.","다만 후보의 한 사람으로서 아쉬움이 큽니다. 이번 경선은 기탁금은 잔뜩 올려놓고, 정작 후보를 검증할 자리는 없습니다. 토론회 한 번이 없습니다. 당원들 앞에서 대면 연설을 하는 자리도 없이, 달랑 동영상 촬영회 한 번이 전부입니다. 선거운동 기간도 너무 짧고요. 그런데 오늘부터 벌써 투표가 시작됐습니다. 후보가 누구인지, 무엇을 하겠다는지 당원들이 충분히 알기도 전에 표를 달라는 겁니다.","이런 경선은 이미 이름이 알려진 기득권에게만 유리합니다. 신인과 청년에게는 알릴 기회 자체를 주지 않는 것이죠. 이것부터 바꿔야 합니다. 그래서 제가 어제 연설에서 '민주화운동은 존중받아야 하지만 정치를 40년, 50년 독점할 권리는 없다'고 말씀드렸고, 그 영상이 100만 조회를 넘었습니다. 바뀌어야 한다는 국민의 갈증이 그만큼 크다는 뜻입니다."],"quotes":[["7.20 합동연설회 연설문(최종)","달랑 동영상 하나 찍고 연설이랍시고, 토론회 한 번·대면 연설 한 번 없는 경선 — 2030 다 떠날 거고 총선 대선 반드시 진다"],["일정(7.21)","예비경선 투표 7.21~23 — 검증 자리 없이 투표부터 시작"]],"notes":["◆ 녹화: 7.21(화) 16:20 사전녹화(16:00 메이크업), KBS광주총국 2층 뉴스스튜디오, 방송 19:00 뉴스7 [정치맥] 약 7분, 담당 박성혜 작가","분위기 질문이지만 '짧은 경선·토론회 부재·동영상 한 번·오늘 투표 시작' 아쉬움으로 자연 전환","기탁금 상세는 T5에서 다시 — 여기선 '올려놓고 검증 자리는 없다'까지만"],"warn":null,"media":"KBS광주TV","label":"T1"},{"no":502,"part":8,"q":"오늘 서울시의회 간담회 정견발표에서 송영길 후보로부터 고함을 들었다는 글을 SNS에 올리셨는데, 상황을 설명해주신다면요?","tags":["고함사건","송영길","공정","사과요구"],"script":["네, 오늘 아침 서울시의회 의장실 접견 자리였습니다. 의장님과 의원님들, 직원분들까지 계신 공개된 자리에서 송영길 후보께서 제 페이스북 글을 두고 고함을 치셨습니다. 다른 분들이 계시니 별도로 통화하자고 정중히 부탁드렸는데도 호통은 계속됐습니다.","제 글은 송영길 후보 개인을 비난한 것이 아닙니다. 손흥민 선수라도 반칙하면 레드카드를 받듯이, 면접이 시작된 뒤에 자격 요건을 바꾸는 '과정의 불공정'을 지적한 것입니다. 그런데 돌아온 답은 '내가 검찰개혁 하다 이렇게 고생했는데, 나 이런 사람이야'였습니다. 공정을 물었더니 훈장이 돌아온 겁니다.","섭섭하실 수는 있습니다. 그러나 여러 사람 앞에서 고함치며 윽박지르는 것은 인격무시 행위입니다. 그래서 정견발표에서 공개적으로 사과를 요청드렸지만 끝내 사과는 없었습니다. 이러니까 청년들이 꼰대라고 하는 것입니다. 저도 당대표 후보입니다. 존중해 주시기 바랍니다."],"quotes":[],"notes":["TV용 — 감정 아닌 팩트 순서: 장소·배석 → 통화 요청 묵살 → 지적의 본질(과정) → 돌아온 말 → 공개 사과 요구·불발","'뻔뻔함' 등 최고 수위 표현은 TV에서 자제 — '인격무시 행위'까지"],"warn":"송영길 개인 인신 비난 금지. 표정은 담담하게 — 피해 호소가 아니라 기록 톤.","media":"KBS광주TV","label":"T2"},{"no":503,"part":8,"q":"전직 기초의원이라는 조건에서 당대표 출마가 쉽지 않은 선택이었을 텐데요. 그럼에도 출마를 결심한 이유가 있을까요?","tags":["출마이유","지역개혁","호남정치개혁","시스템개혁","공약","대전환"],"script":["저는 우리 지역을 바꾸고 싶어서 정치를 시작했습니다. 그런데 13년을 해 보니 알겠더군요. 지역을 바꾸려면 먼저 민주당이 바뀌어야 합니다. 공천이 곧 당선인 호남에서, 낡은 공천 시스템을 그대로 두고는 지역도 청년도 살릴 수 없습니다. 호남 정치의 고질적인 문제, 그 뿌리를 바꾸지 않으면 안 된다 — 그래서 나왔습니다.","저는 계파도 돈도 빽도 없는 평당원입니다. 그런데 바로 그래서 할 수 있습니다. 신세 진 사람, 챙겨줄 사람이 많은 분들은 절대 이 시스템을 못 바꿉니다. 저는 챙겨줄 사람도 없어서, 눈치 보지 않고 거침없이 갈아엎을 수 있습니다.","그래서 어제 연설에서 구체적인 공약을 걸었습니다. 첫째, 경선 데이터 전면 공개와 당원 명부 검증으로 '진짜 1인 1표'를 만들겠다. 둘째, 경선 룰은 6개월 전에 확정하고 불법·유령 당원을 전수조사하겠다. 셋째, 돈 없는 청년도 나올 수 있게 당직선거 공영제를 실현하고 임명직 최고위원 두 자리를 청년에게 주겠다. 넷째, 청년취업보장제를 당의 핵심 정책으로 삼겠다. 그리고 호남에는 800조 반도체를 비롯한 3대 메가프로젝트를 반드시 성사시키겠다. 손보는 수준이 아니라 대전환 수준으로 바꾸겠다는 것이 제 결심입니다."],"quotes":[["7.20 합동연설회 연설문(최종)","경선 룰 6개월 전 확정·불법 유령 대리 당원 정리·경선 결과 100% 공개 · 당직선거 공영제 · 청년취업보장제 · 호남 반도체 800조·3대 메가프로젝트"],["캠프 확정 멘트","저 김보미는 챙겨줄 사람 한 명도 없습니다 → 거침없이 개혁할 수 있는 유일한 후보"]],"notes":["'지역 바꾸려다 민주당을 바꿔야 함을 깨달음 → 호남 정치 고질병 → 어제 연설 공약 5가지' 순서","공약 5개 빠르게 나열(TV 시간): 경선 공개·명부 검증·공영제·청년취업보장·800조","'대전환'으로 마무리"],"warn":null,"media":"KBS광주TV","label":"T3"},{"no":504,"part":8,"q":"출마를 선언하면서 경선 데이터 전면 공개, 당원명부 검증을 통한 '진짜 1인 1표' 실현을 공약으로 내걸었어요. 민주당의 당원 구조나 경선 제도에 문제가 있다는 의미로 읽히는데요.","tags":["1인1표","유령당원","경선데이터","유리상자"],"script":["문제가 있는 정도가 아니라, 지금의 1인1표는 가짜 1인1표입니다. 가짜 당원, 유령 당원이 천지인데 명부 정리를 하라고 해도 하지 않습니다. 오염된 명부 위의 투표가 무슨 당원주권입니까.","제가 겪은 일을 그대로 말씀드리겠습니다. 후보인 저에게 선거인 수도, 투표율도, 득표율도, 득표수도 공개하지 않았습니다. 이름도 없이 숫자 세 개만 보여줍니다. 그게 내 점수인지 남 점수인지, 조작이 있었는지 알 길이 없습니다. 이의를 제기하면 '제명하겠다'는 협박이 돌아옵니다. 전 세계 어느 민주주의 정당이 이렇게 선거를 합니까.","그래서 공약이 두 가지입니다. 당원 명부 전수 검증으로 진짜 1인1표를 만들고, 경선 룰은 6개월 전에 확정하고 결과는 100퍼센트 공개하는 유리상자 경선. 공개 못 할 이유가 없지 않습니까."],"quotes":[["호남 정견발표/성명(7.18~7.21) 원문","여러분이 지지한 후보가 몇 표 받았는지 아십니까? 모릅니다. 선거인 수도, 투표율도, 득표율도, 득표수도 공개하지 않습니다. 이름도 없이 숫자 세 개만 보여줍니다. 내 점수인지 남 점수인지, 조작을 했는지 안 했는지 알 길이 없습니다. 이의를 제기하면 '제명하겠다'는 협박이 돌아옵니다."]],"notes":["강진 15% 감산 상세는 T7(김승남 질문)과 중복되지 않게 여기선 '몇 표인지 모른다'까지만"],"warn":null,"media":"KBS광주TV","label":"T4"},{"no":505,"part":8,"q":"오늘 민주당이 너무 높다는 지적이 나온 전당대회 기탁금을 2천만원 낮추겠다고 발표했습니다. 기탁금 문제를 비롯해 당내 청년 정치인이 마주한 가장 큰 장벽은 뭐라고 보십니까?","tags":["기탁금","기탁금감액","청년장벽","후원회부재","3인캠프","공영제"],"script":["돈이죠, 당연히. 그런데 돈은 시작일 뿐입니다. 오늘 당이 기탁금을 2천만 원 낮췄지만, 그마저도 이재명 대통령 때의 두 배이고, 등록은 이미 끝난 뒤였습니다. 저는 그 돈이 없어서 등록 당일 다섯 군데에서 빌렸습니다.","더 큰 장벽은 구조입니다. 현역 의원이 아니면 후원회조차 만들 수 없습니다. 돈을 모을 길 자체가 막혀 있는 겁니다. 솔직히 말씀드리면 저희 캠프는 선배님 한 분, 후배 한 분, 저까지 셋이 전부입니다. 사무실도 없이 발로 뛰고 있습니다. 요즘 전화가 너무 많이 와서 한 분 한 분 연락을 다 못 드리는데, 이 자리를 빌려 죄송하다는 말씀을 드립니다.","그래서 답은 당직선거 공영제입니다. 기탁금 때문에, 후원회가 없어서 꿈을 접는 청년이 없도록, 당이 선거 비용을 책임지는 구조로 바꿔야 합니다. 그리고 청년에게 사진이 아니라 권한을 줘야 합니다. 임명직 최고위원 두 자리를 청년에게, 청년 정책은 청년위원회가 결정하게 하겠습니다."],"quotes":[["후보 메시지(7.21)","현역 의원이 아니면 후원회도 없다 · 선배 한 분·후배 한 분, 저까지 3인 캠프 · 사무실도 없이 발로 뛴다 · 전화를 다 못 받아 죄송한 마음"],["7.20 합동연설회 연설문(최종)","당직선거 공영제를 반드시 실현해, 기탁금 때문에 꿈을 포기하는 청년이 없도록 하겠습니다"]],"notes":["'돈이죠 당연히'로 솔직하게 시작 → 후원회 부재(현역만 가능) → 3인 캠프·사무실 없음·전화 다 못 받아 죄송(진정성) → 공영제","3인 캠프 스토리는 동정표가 아니라 '가장 가난하지만 가장 많은 사람이 함께하는 캠프' 톤으로"],"warn":null,"media":"KBS광주TV","label":"T5"},{"no":506,"part":8,"q":"이런 가운데 최근 이재명 대통령이 SNS를 팔로우했습니다. 어떤 의미로 받아들이고 있습니까?","tags":["이재명","X팔로우","경청"],"script":["저도 놀랐고, 감사했습니다. 대통령께서 청년 평당원의 목소리까지 지켜봐 주신다는 뜻이라고 생각합니다. 댓글까지 직접 읽으신다는 분 아닙니까. 그런 경청의 정치를 저도 배우고 싶습니다.","다만 분명한 것은, 저는 누구의 낙점으로 여기까지 온 사람이 아니라는 점입니다. 당원의 선택, 국민의 선택으로 왔습니다. 팔로우는 감사하게 받고, 표는 당원과 국민께 받겠습니다."],"quotes":[],"notes":["'낙점설' 인정 금지 — 감사+자립 2단 구조, 20초 컷"],"warn":null,"media":"KBS광주TV","label":"T6"},{"no":507,"part":8,"q":"강진군의장 시절에도 당시 지역위원장이었던 김승남 전 국회의원과 갈등이 있지 않았습니까. 당시 경험이 지금의 민주당을 비판하는 문제의식과도 연결된다고 봐야 할까요?","tags":["김승남","표적징계","강진","구조문제"],"script":["연결됩니다. 다만 저는 이걸 특정인과의 사적 갈등으로 보지 않습니다. 구조의 문제입니다. 지역에서는 국회의원이 왕입니다. 자기 마음에 들면 키워주고, 말을 듣지 않으면 씨를 말립니다. 선거 때는 동원하고, 공천 때는 줄을 세웁니다. 저는 의장 시절 표적 징계와 불신임, 압수수색, 100건이 넘는 허위 보도까지 겪었습니다.","그때 많은 분들이 그러셨습니다. '계란으로 바위치기다, 억울해도 그냥 10년 쉬면 기회가 온다.' 그런데 더 많은 분들이 저를 지켜주셨습니다. 하루 1,000명이 불신임 철회 서명을 해 주셨고, 고소·감사·수사는 전부 혐의없음으로 끝났고, 허위 보도 손해배상 소송은 제가 이겼습니다.","그 시간을 지나며 확신했습니다. 개인이 착해지길 기다릴 게 아니라 구조를 바꿔야 한다고요. 그래서 제 결론은 하나입니다. 공천은 충성도가 아니라 실력과 전문성으로, 당원과 주민이 결정하는 상향식으로 바꿔야 합니다. 그러면 누구도 왕이 될 수 없습니다. 그 문제의식이 지금 제가 민주당 개혁을 외치는 이유입니다."],"quotes":[["후보 메시지(7.21)","지역에서는 국회의원이 왕입니다. 마음에 들면 키워주고 말을 듣지 않으면 씨를 말립니다. 선거 때는 동원하고, 공천 때는 줄을 세우고 — 공천은 충성도가 아니라 실력과 전문성으로, 당원과 주민이 결정하는 상향식으로"],["후보 메시지(7.21)","많은 분들이 '계란으로 바위치기다, 10년 쉬면 기회가 온다'고 했지만, 더 많은 분들이 지켜주셨습니다 — 구조적 문제이고, 민주당 개혁이 필요한 이유"]],"notes":["김승남 실명은 질문에 나온 경우에만 받고, 답변에서는 '특정인이 아니라 구조'로 즉시 전환","'전 건 혐의없음·손배 승소·주민 1,000명 서명'은 검증된 사실 — 자신 있게"],"warn":"김승남 개인 비위 단정 금지 — 법적 리스크. '제가 겪은 일'과 '확정된 결과'만, 그리고 '구조의 문제'로 전환.","media":"KBS광주TV","label":"T7"},{"no":508,"part":8,"q":"마지막으로, 정치인 김보미의 목표는 무엇인지 들어보겠습니다.","tags":["목표","대전환","다음김대중","클로징","호남엔딩","본경선진출"],"script":["제 목표는 당대표 자리 자체가 아닙니다. 청년이 공정하게 경쟁하는 민주당, 국민이 자랑스럽게 '뽑고 싶은' 민주당으로 대전환하는 것입니다. 계파가 아니라 가치를, 기득권이 아니라 변화를, 과거가 아니라 미래를 선택받는 정당으로 바꾸겠습니다.","그리고 호남의 딸로서 꿈이 하나 있습니다. 김대중 대통령을 낳은 이 땅이 다음 김대중을 길러내는 것입니다. 민주당이 살아야 호남이 살고, 호남이 살아야 대한민국이 살고, 대한민국이 살아야 청년이 삽니다. 저 김보미를 민주당 당대표 본경선에 꼭 진출시켜 주십시오. 686 세 명으로 하는 경선은 민주당의 몰락을 이끌 뿐입니다. 그런 경선으로는 총선도 대선도 절대 이길 수 없습니다. 가장 현명하신 전남·광주의 힘을 보여주십시오. 서울에서 호남을 이용하려는 정치인이 아니라, 호남에 살며 호남과 운명을 같이할 사람을 꼭 본경선에 올려 주십시오.","저는 약한 계란입니다. 그러나 계란은 생명을 품고 있습니다. 끝까지 바위를 두드려 결국 금을 내겠습니다. 8월 17일까지 완주하겠습니다. 지켜봐 주십시오."],"quotes":[],"notes":["마지막 답변 — 카메라 정면, 천천히. '대전환·다음 김대중·계란' 3요소 고정"],"warn":null,"media":"KBS광주TV","label":"T8"},{"no":509,"part":8,"media":"KBS광주TV","label":"T9","q":"[정견발표 전문·핵심 워딩] 서울시의회 정견발표(7.21) — 방송에서 바로 인용하는 문장 모음","tags":["정견발표전문","세대교체","내로남불","기득권","족보경쟁","아름다운퇴장","공약"],"script":["【세대교체 요청(존경 먼저)】 저는 김민석·정청래·송영길, 686 선배님들을 존경합니다. 최루탄을 맞고 감옥에 가며 민주주의를 만드셨습니다. 제가 오늘 민주당을 비판할 자유도 선배님들 덕분입니다. 그런데 바로 그렇기 때문에, 정중히 세대교체를 요청드립니다. 밀어내려는 것이 아니라, 다음 총선에서 이겨 재집권하기 위해서입니다.","【1. 왜 위기인가】 민주당이 더 이상 반성하지 않기 때문입니다. '우리가 국민의 마음을 잘못 읽은 것은 아닐까' — 이 질문이 사라졌습니다. 질문보다 확신이 많고, 경청은 없고 연설만 있습니다. 실력보다 의리, 정책보다 인맥, 원칙보다 예외. 그렇게 내로남불이 탄생했습니다.","【2. 누가 기득권인가】 지금 대한민국에서 가장 강한 기득권은 민주당 686입니다. 권력이 없을 때는 모두 민주주의자가 되지만, 권력을 오래 가지면 자신도 모르게 기득권이 됩니다. 기득권은 책임지지 않습니다. 선거에서 져도 다시 당대표에 나옵니다. 그러나 청년은 공천 한 번 떨어지면 정치를 접어야 합니다.","【3. 왜 청년이 떠나는가】 청년 정치를 확대하겠다더니 기탁금만 올렸습니다. '청년이 미래'라는 말은 '지금은 아니다, 기다려라'가 된 지 오래입니다. 미래만 약속하는 정당은 현재를 빼앗는 정당입니다.","【4. 족보 경쟁】 국민은 원조를 보지 않습니다. 누가 내 삶을 바꾸는지를 봅니다. 정책이 족보를 이기고, 정책이 계파를 이겨야 합니다.","【5. 왜 지금인가】 민주화 시대의 무기는 용기였지만 AI 시대는 다릅니다. 선배님들의 역사는 기념비가 되어야지, 다음 세대를 막는 성벽이 되어서는 안 됩니다. 지금 바꾸지 못하면 국민은 '당신들은 정권은 바꾸었지만 자신들은 바꾸지 않았다'고 할 것입니다. 세대교체는 총선 필승 전략이고 재집권 전략입니다.","【6. 이렇게 바꾸겠다】 당직선거 공영제로 기탁금 때문에 꿈을 포기하는 청년이 없게 하겠습니다. 청년위원회에 실제 정책 결정권을 주겠습니다. 공천은 충성도가 아니라 실력과 전문성으로 하겠습니다. 당 최고 의사결정 단위에 지방의원의 몫을 보장하고, 자치입법권·자치재정권을 확대하는 제2의 지방자치 개혁으로 서울시의회에 힘을 보태겠습니다. 같은 지역에서 세 번 이상 국회의원을 하신 분들은 후배들에게 길을 열어 주십시오. 그리고 그만 싸우십시오 — 재집권에 실패하면 다시 계엄입니다.","【7. 아름다운 퇴장】 이번 선거가 686 잔치로 끝나면 총선은 국민의힘 잔치판이 될 것입니다. 저는 선배님들의 시대를 끝내자는 것이 아니라 다음 세대로 이어가자는 것입니다. 가장 위대한 계승, 가장 아름다운 퇴장을 김보미가 준비해 드리겠습니다. 저는 계파가 없습니다. 챙겨줄 사람이 단 한 명도 없어 거침없이 개혁할 수 있는 유일한 후보입니다.","【클로징】 청년이 돌아오는 민주당, 공정이 살아 있는 민주당, 계파보다 실력이 존중받는 민주당. 과거를 자랑하는 정당이 아니라 미래를 만드는 정당을, 풀뿌리에서 자란 김보미가 반드시 만들겠습니다. 여러분의 한 표가 기적의 봄을 만듭니다."],"quotes":[["서울시의회 정견발표 전문(7.21)","7개 장(위기·기득권·청년·족보·세대교체·공약·퇴장) + 세대교체 요청 서두 — 본 카드는 방송용 발췌"]],"notes":["이 카드는 어느 문항에서도 문장 단위로 꺼내 쓰는 '원문 창고'","세대교체 답변은 반드시 '존경 먼저 → 요청'","신규 공약 눈여겨볼 것: 제2의 지방자치 개혁(자치입법권·자치재정권 확대), 같은 지역 3선 이상 용퇴 요청"],"warn":null},{"no":401,"part":7,"q":"어제 민주당 첫 합동연설회에서 세대교체론을 전면에 내세우며 청년 정치의 필요성을 강조하셨는데요. 36살의 나이로 당대표에 출마하신 배경부터 간단히 말씀해주실까요?","tags":["출마배경","세대교체","대전환","평당원"],"script":["네, 안녕하세요. 만 서른여섯, 계파도 돈도 빽도 없는 평당원 김보미입니다. 저는 강진에서 정치를 시작해 13년, 지방의원 8년, 전국 최연소 기초의회 의장을 지냈습니다.","제가 나온 이유는 하나입니다. 686 기득권 정당이 된 민주당을, 청년도 공정하게 경쟁할 수 있는 정당으로 바꾸려고 나왔습니다. 지금 민주당에는 공정도, 세대교체도, 청년도 보이지 않습니다. 경선 규칙은 경기 중에 바뀌고, 청년최고위원제는 부결되고, 기탁금은 올라갔습니다. 이 정도면 손보는 수준으로는 안 됩니다. 대전환 수준으로 다시 태어나야 합니다.","민주화운동은 존중받아야 합니다. 그러나 대한민국 정치를 40년, 50년 독점할 권리는 누구에게도 없습니다. 이제 다음 세대에게 넘겨줄 때가 됐습니다. 그 일을 저 김보미가 시작하겠습니다."],"quotes":[],"notes":["첫 답변은 30~40초 안에 — 대전환 키워드 1회 포함"],"warn":null,"media":"광주KBS","label":"G1"},{"no":402,"part":7,"q":"36살, 젊은 나이잖아요. 전남광주를 찾아서 당원과 시민들 만나보셨어요? 어떤 말씀을 많이 하고, 들으셨나요?","tags":["호남","광주","현장","독립선언"],"script":["네, 저는 전남 강진에서 나고 자라 13년을 전남에서 정치했습니다. 앞으로 전남·광주와, 호남과 운명을 함께할 호남의 후보입니다. 그래서 저에게는 매일이 현장입니다.","들은 말씀은 아프게도 비슷했습니다. '호남에는 선거가 없고 공천만 있다.' '우리 애들은 다 나가서 안 돌아온다.' 청년이 떠나고, 일자리가 사라지고, 면소재지에는 밥 먹을 식당 하나 남지 않았습니다. 호남이 전국에서 가장 낙후된 지역이 된 것, 저는 호남을 표밭으로만 이용해 온 정치 탓이라고 봅니다.","제가 드린 말씀은 하나였습니다. 호남이 각성하지 않으면 민주당은 절대 바뀌지 않습니다. 권력에 줄 서지 않고 오직 군민의 도움으로 성장한 저 김보미가, 낡은 공천을 완전히 갈아엎고 호남 정치를 혁신하겠습니다. 그래야 백제 이후 절호의 기회인 800조 반도체 투자도 제대로 성사시킬 수 있습니다."],"quotes":[["호남 정견발표/성명(7.18~7.21) 원문","지역민은 외면하고 권력에 줄 대는 정치, 실력은 쌓지 않고 눈치만 보는 정치 — 그런 정치가 호남 정치였습니다. 이제 이 김보미가 완전히 갈아엎겠습니다"],["호남 정견발표/성명(7.18~7.21) 원문","호남을 표밭으로만 이용하는, 가장 대표적인 갈라치기 정치입니다. 청년이 떠나고, 마을이 없어지고, 면소재지에 밥 먹을 식당이 모두 사라진 것 아닙니까"]],"notes":["7.18 광주 기자회견('호남 정치 독립선언') 기반 — 구체 일화 추가는 후보 재량"],"warn":null,"media":"광주KBS","label":"G2"},{"no":403,"part":7,"q":"예비경선을 앞두고 '공천이 곧 당선인 곳에서 권력과 계파에 줄 대고, 청년이 낄 자리는 없는 게 호남 정치'라고 비판하셨어요.","tags":["호남정치","강진공천","불공정경선","줄서기"],"script":["제가 몸으로 겪은 일이라 거리낌 없이 말씀드릴 수 있습니다. 호남의 지방선거 공천, 공정했습니까. 여러분이 던진 한 표는 던진 그대로 계산됐습니까. 여러분이 지지한 후보가 몇 표 받았는지 아십니까? 모릅니다. 선거인 수도, 투표율도, 득표율도, 득표수도 공개하지 않습니다. 이름도 없이 숫자 세 개만 보여줍니다. 내 점수인지 남 점수인지, 조작을 했는지 안 했는지 알 길이 없습니다. 이의를 제기하면 '제명하겠다'는 협박이 돌아옵니다.","지난 강진군수 경선에서 저는 우리 당의 민낯을 봤습니다. 당헌·당규에도 없는 새 지침을 만들어 기어이 15퍼센트를 감산했습니다. 반대로 전과 5범 후보에게는 감산할 조항을 억지로 만들어 하나도 감산하지 않았습니다. 결과는 무소속에게 참패였습니다. 공천이 곧 당선인 곳에서 국회의원이 왕이 되니, 청년은 키울 생각이 없고 죽일 생각만 있는 겁니다.","그래서 처방은 분명합니다. 경선 룰은 6개월 전에 확정해 못 바꾸게 하고, 결과는 100퍼센트 공개하고, 공천은 당원과 주민이 결정하는 상향식으로 바꾸겠습니다. 호남의 공천부터 대한민국에서 가장 깨끗하고 혁신적으로 만들겠습니다."],"quotes":[["호남 정견발표/성명(7.18~7.21) 원문","선거인수도, 투표율도, 득표율도, 득표수도 하나도 공개하지 않습니다. 이름도 밝히지 않고 숫자 3개만 보여줍니다 … 이의를 제기하면 '제명하겠다'는 협박이 들어옵니다"],["호남 정견발표/성명(7.18~7.21) 원문","당헌·당규에도 없는 새 지침으로 15% 감산. 전과 5범 후보에게는 감산 조항을 억지로 만들어 감산하지 않았습니다. 청년을 키울 생각이 없습니다. 죽일 생각만 있습니다"]],"notes":["강진 사례 수치는 사실관계 자료 기준 — 생방송에서 상대 후보 실명 거론 금지"],"warn":"상대 후보·특정 의원 실명 금지. 강진 사례는 '제가 겪은 일'로만.","media":"광주KBS","label":"G3"},{"no":404,"part":7,"q":"민주당이 전당대회를 앞두고 후보들이 내는 기탁금을 큰 폭으로 올리기로 했는데, 이 문제는 어떻게 생각하세요?","tags":["기탁금","기탁금감액","공영제","투개표비용"],"script":["네, 그 소식엔 오늘 낮에 후속편이 나왔습니다. 비판이 쏟아지고 대통령까지 나서시니까, 오늘 당 선관위가 당대표 기탁금을 1억에서 8천만 원으로, 최고위원은 5천에서 3천만 원으로 내렸습니다.","안 내리는 것보다는 낫습니다. 그런데 세 가지가 문제입니다. 첫째, 원상복귀가 아닙니다. 이재명 대통령이 당대표였던 재작년의 딱 두 배입니다. 둘째, 순서가 틀렸습니다. 등록은 이미 끝났습니다. 저는 그 돈이 없어서 등록 당일 다섯 군데에서 빌렸습니다. 문턱에 걸려 출마를 포기한 청년은 누가 책임집니까. 셋째, 당에서는 '투개표 비용은 후보가 부담하는 게 맞다'고 하는데요, 저는 반대입니다. 투개표는 정당 민주주의의 기본 비용입니다. 그걸 후보 지갑에 떠넘기면 돈 있는 사람만 출마하는 정당이 됩니다.","답은 당직선거 공영제입니다. 이재명 대통령이 당대표 시절 하려던 것을 제가 완성하겠습니다."],"quotes":[],"notes":["질문 전제(인상)가 구정보 — 오늘 감액 결정을 자연스럽게 업데이트하며 시작"],"warn":null,"media":"광주KBS","label":"G4"},{"no":405,"part":7,"q":"이 발언 이후에 이재명 대통령이 하루 만에 SNS 팔로우를 했더라구요. 화제가 됐는데, 어떠셨어요?","tags":["이재명","X팔로우","경청"],"script":["솔직히 저도 놀랐습니다. 대통령께서 청년 평당원의 목소리까지 지켜봐 주신다는 것, 감사한 일이지요.","저는 그걸 '경청'이라고 생각합니다. 댓글까지 다 읽으시고 거기서 아이디어를 얻으신다는 대통령 아닙니까. 국민의 목소리를 직접 보고 들어주는 대통령이 계시다는 건 정말 든든한 일입니다. 저도 그런 경청의 정치를 하고 싶습니다.","다만 분명히 말씀드리면, 저는 누구의 낙점으로 여기까지 온 사람이 아닙니다. 당원의 선택, 국민의 선택으로 왔습니다. 대통령의 팔로우는 감사하되, 제 표는 당원과 국민께 받겠습니다."],"quotes":[],"notes":["'낙점설' 프레임 인정 금지(공통 금지선) — 감사+자립 2단 구조"],"warn":null,"media":"광주KBS","label":"G5"},{"no":406,"part":7,"q":"민주당 대표 경선을 3파전이라고 하지 않습니까? 김 후보님의 도전이 '계란으로 바위치기다' 이런 얘기가 나오는데 어떻게 생각하시나요?","tags":["계란과바위","3파전","노무현2%","완주"],"script":["맞습니다. 저는 계란입니다. 그런데요, 민주당의 역사가 처음부터 끝까지 계란으로 바위를 친 역사입니다. 김대중 대통령은 목숨을 위협받으면서도 도전하셨고, 노무현 대통령은 경선 초기 지지율 2%로 시작하셨습니다. 제 첫 여론조사도 2%였습니다. 저는 이 숫자가 부끄럽지 않습니다. 2%는 절망의 숫자가 아니라 희망이 출발하는 숫자입니다.","월드컵 우승 못 하면 출전하지 말아야 합니까? 서울대 못 가면 공부도 하지 말아야 합니까? 질 것이 뻔하다던 도전들이 이 나라 민주주의를 만들었고 지역주의에 금을 냈습니다.","약한 계란이 강한 바위를 두드려 결국 금을 냅니다. 저는 8월 17일 대전까지 완주합니다. 3파전이라고들 하시는데, 청년 한 명 끼워서 4파전 만들어 주십시오. 그건 당원 여러분이 하실 수 있습니다. 오늘부터 투표입니다."],"quotes":[],"notes":["끝에 투표 독려로 연결 — 방송 흐름상 자연스러운 지점"],"warn":null,"media":"광주KBS","label":"G6"},{"no":407,"part":7,"q":"보완수사권 폐지 관련해서 민주당 내에서도 신중론이 나오는데, 보완수사권에 대해서는 어떤 의견을 갖고 계신가요?","tags":["검찰개혁","보완수사권","피해자보호"],"script":["검찰개혁의 방향에는 전적으로 동의합니다. 그런데 솔직하게 여쭙고 싶습니다. 언제 적 검찰개혁입니까. 노무현 대통령 때 시작해서 24년째 완성을 못 했습니다. 혹시 완성하는 것보다 외치는 것이 공천에 유리했던 것은 아닙니까.","제 원칙은 두 가지입니다. 하나, 검찰과 경찰이 서로 견제하게 만들어야 합니다. 정치검찰도 안 되지만 경찰의 독주도 안 됩니다. 둘, 개혁의 속도전 속에 범죄 피해자 보호에 공백이 생겨서는 안 됩니다. 여성단체들이 우려하는 지점이 바로 그것이고, 저는 그 우려가 정당하다고 봅니다.","한 가지 덧붙이면, 대통령께서도 보완수사권이 없으면 여러 문제가 생길 수 있다고 생각하시는 것 같습니다. 그렇다면 대통령께서도 입장을 조금 더 명확히 밝히시고, 공론화를 통해 국민과 함께 결론을 내는 것이 좋지 않을까 합니다. 칼은 뺏어도 좋습니다. 그러나 국민을 지키는 선까지 자를 일은 아닙니다. 개혁은 속도가 아니라 신뢰로 완성됩니다."],"quotes":[["박동완 통화 원워딩(7.21 14:39)","대통령이 보완수사권이 없으면 여러 가지 문제가 생긴다고 생각하고 계시는 것 같은데, 그런 입장을 조금 더 명확히 하고 공론화를 하는 게 좋지 않을까 한다 — 이 정도는 추가하되 나머지는 지난번대로"],["캠프 확정 멘트","칼은 뺏어도 좋습니다. 그러나 국민을 지키는 선까지 자를 일은 아닙니다"]],"notes":["기존 기조 유지 + 7.21 14:39 통화 추가 지시: '대통령 입장 명확화·공론화' 워딩 삽입","특정 후보(김민석 등) 거명 비교는 하지 않음(통화에서 보류)"],"warn":null,"media":"광주KBS","label":"G7"},{"no":408,"part":7,"q":"최근 전남국립의대가 원점으로 돌아갈 위기에 놓였는데, 강진에서 정치를 하셨던 만큼 의료인프라가 취약하다는 것을 많이 느끼셨을 듯한데요.","tags":["전남국립의대","의료공백","지방소멸","강진"],"script":["이건 제가 통계가 아니라 생활로 아는 문제입니다. 강진에서는 한밤에 아이가 아프면 광주까지 달려야 합니다. 어르신들은 투석 한 번 받으러 왕복 서너 시간을 다니십니다. 전남은 전국에서 유일하게 의과대학이 없는 지역입니다. 도민들이 수십 년을 기다려 온 약속인데, 이것이 원점으로 돌아가서는 안 됩니다.","다만 지금 논란의 핵심에 대해서는 원칙을 말씀드리겠습니다. 대학과 병원을 분리한다는 것은 말이 안 됩니다. 의대와 부속병원은 한 몸입니다. 같은 곳에서 가르치고, 수련하고, 진료해야 지역에 정착하는 의사가 나옵니다. 이 원칙이 흔들리면 의대는 껍데기만 남습니다.","어디에 두느냐 하는 입지 문제는, 시장께서 지역 주민들과 충분히 협의하면서 풀어나가시는 것이 맞다고 봅니다. 특정 지역 편을 드는 것은 갈등만 키웁니다. 분명한 것은 하나입니다. 병원이 문을 닫으면 마을이 문을 닫습니다. 전남국립의대는 흔들림 없이, 그리고 온전한 모습으로 추진돼야 하고, 여당이 당론으로 힘을 실어야 합니다."],"quotes":[["박동완 통화 원워딩(7.21 14:39)","대학하고 병원을 분리한다는 게 일단 말이 안 된다, 같은 한 곳에 있어야 되는 것 아니냐 — 이 정도 원칙을 정하고. 어디로 가느냐는 시장이 지역 주민들과 협의해 가면서 잘 풀어나갔으면 좋겠다. 한쪽 편을 들면 안 된다"]],"notes":["7.21 14:39 통화 지시: 한쪽 편들기 금지 — ①대학·병원 분리 반대 원칙 ②입지는 시장이 주민 협의로, 두 가지만","통화에서 '민영배 시장' 언급(음성인식 표기) — 생방송에서는 실명 대신 '시장께서'로 안전하게","순천이냐 목포냐 유도 질문에 절대 안 올라탐"],"warn":"입지(순천·목포 등) 관련 한쪽 편드는 발언 절대 금지. 정부·부처 비난 톤 금지.","media":"광주KBS","label":"G8"},{"no":409,"part":7,"q":"오늘부터 8·17 전당대회의 첫 관문인 예비경선(컷오프)이 진행되는데요. 1차 컷오프로 3명의 당대표 후보가 정해집니다. 컷오프에 대해서도 비판하셨어요.","tags":["컷오프","예비경선","투표독려","선호투표"],"script":["네, 오늘부터 23일까지 투표입니다. 먼저 권리당원 여러분께 부탁드립니다. 누구를 찍으시든 꼭 참여해 주십시오. 참여가 많아질수록 계파와 조직의 힘은 작아지고 당원의 뜻이 커집니다.","컷오프 자체에 대해선 분명히 비판합니다. 다섯 명밖에 출마하지 않았는데 왜 자릅니까. 당헌에도 컷오프를 '할 수 있다'고 돼 있지, 꼭 3명으로 잘라야 한다고 돼 있지 않습니다. 게다가 이번엔 선호투표제까지 도입했잖아요. 표가 갈릴 걱정이 없는데 왜 자릅니까. 결국 청년에게는 마이크를 쥐여주지 않겠다는 것 아닙니까.","방식도 문제입니다. 달랑 동영상 연설 하나, 당원들 앞 대면 연설 한 번 없이, 토론 한 번 없이 자릅니다. 이런 경선으로는 청년이 설 자리가 없습니다. 686끼리 하는 경선, 무슨 감동이 있겠습니까. 청년 한 명은 본선 무대에 세워야 하지 않겠습니까. 당원 여러분의 한 표를 믿습니다."],"quotes":[],"notes":["오늘=투표 시작일(21~23) — '오늘 3명이 정해진다'는 전제가 오면 '발표는 23일'로 자연 정정"],"warn":null,"media":"광주KBS","label":"G9"},{"no":410,"part":7,"q":"끝으로 김보미 후보에게 호남이란 어떤 의미인가요?","tags":["호남","강진","김대중","반도체800조"],"script":["호남은 민주주의의 뿌리이고, 저에게는 제 삶이고 제 정치의 시작입니다. 저는 강진에서 나고 자라 13년을 전남에서 정치했습니다. 앞으로도 전남·광주, 호남과 운명을 함께하겠습니다.","그런데 이상하게 됐습니다. 그 뿌리를 흔들어 놓은 것이 다름 아닌 민주당입니다. 호남을 표밭으로만 이용하는 갈라치기 정치, 지역민은 외면하고 권력에 줄 대는 정치 — 그런 정치를 지지해 온 결과가 지금의 낙후된 호남입니다.","저는 이제 호남이 '주기만 하는 땅'이 아니라 '주인이 되는 땅'이 되기를 바랍니다. 호남의 공천이 가장 깨끗하고 혁신적이어야 하고, 호남이 세대교체에 가장 앞장서야 합니다. 김대중 대통령을 낳은 땅이 다음 김대중을 길러내야 하지 않겠습니까. 800조 반도체와 함께 호남을 대한민국의 두 번째 수도권으로, 그 일을 호남의 딸 김보미가 하겠습니다."],"quotes":[["박동완 통화 원워딩(7.21 14:39)","호남은 민주주의의 뿌리죠. 그 뿌리를 흔들어 놓은 당이 민주당이죠. 호남의 공천이 가장 깨끗하고 가장 혁신적이어야 되는 거죠. 호남이 세대교체에도 앞장서야 되는 거고 … 호남은 내 삶이고 내 정치의 시작이고 대한민국 정치의 시작"]],"notes":["7.21 14:39 통화 지시 반영: 뿌리 → 뿌리를 흔든 민주당 → 호남 공천이 가장 깨끗·혁신적이어야, 호남이 세대교체 선봉 — 논리 순서 고정"],"warn":null,"media":"광주KBS","label":"G10"},{"no":411,"part":7,"q":"정견발표에서 '민주화운동은 존중받아야 하지만 대한민국 정치를 40~50년 독점할 권리는 없다'며 86세대를 비판하고 세대교체를 주장해 주목받았습니다. 관련 영상은 조회수 100만회를 넘겼는데요. 끝으로 청취자들에게 하고 싶은 말씀 있다면?","tags":["클로징","100만조회","세대교체","투표독려","2%","호남엔딩","본경선진출","전남광주"],"script":["100만이라는 조회수는 김보미가 잘나서가 아닙니다. 그만큼 바뀌어야 한다는 국민의 갈증이 크다는 뜻입니다. 저는 그 갈증을 무겁게 받았습니다.","민주화운동은 존중받아야 합니다. 그러나 어떤 세대도 대한민국 정치를 40년, 50년 독점할 권리는 없습니다. 산업화 세대가 민주화 세대에게 권력을 넘겼듯, 이제 민주화 세대가 AI 세대에게 넘겨줄 때입니다.","민주당이 살아야 호남이 살고, 호남이 살아야 대한민국이 살고, 대한민국이 살아야 청년이 삽니다. 저 김보미를 민주당 당대표 본경선에 꼭 진출시켜 주십시오. 686 세 명으로 하는 경선은 민주당의 몰락을 이끌 뿐입니다. 그런 경선으로는 총선도 대선도 절대 이길 수 없습니다. 가장 현명하신 전남·광주의 힘을 보여주십시오. 서울에서 호남을 이용하려는 정치인이 아니라, 호남에 살며 호남과 운명을 같이할 사람을 꼭 본경선에 올려 주십시오.","청취자 여러분, 오늘부터 23일까지 예비경선 투표입니다. 여러분의 한 표가 민주당을 바꾸고, 대통령을 살리고, 대한민국의 미래를 바꿉니다. 저는 약한 계란이지만, 계란은 생명을 품고 있습니다. 끝까지 바위를 두드려 결국 금을 내겠습니다. 쫄지 않고, 끝까지 가겠습니다. 감사합니다."],"quotes":[["후보 엔딩 멘트(7.21)","민주당이 살아야 호남이 살고, 호남이 살아야 대한민국이 살고, 대한민국이 살아야 청년이 삽니다. 저 김보미를 민주당 당대표 본경선에 꼭 진출시켜 주십시오. 686 세 명으로 하는 경선은 민주당의 몰락을 이끌 뿐입니다. 그런 경선으로는 총선도 대선도 절대 이길 수 없습니다. 가장 현명하신 전남·광주의 힘을 보여주십시오. 서울에서 호남을 이용하려는 정치인이 아니라, 호남에 살며 호남과 운명을 같이할 사람을 꼭 본경선에 올려 주십시오."]],"notes":["광주 지역방송 클로징 — '전남·광주의 힘' 직접 호소가 가장 강한 지점","순서: 갈증 → 세대교체 → 호남 3연(살아야) → 투표 독려 → 계란 → 감사","'서울에서 호남을 이용하려는 정치인 vs 호남에 사는 사람' 대비가 핵심 한 방"],"warn":null,"media":"광주KBS","label":"G11"},{"no":412,"part":7,"media":"광주KBS","label":"G12","q":"[공격·수비 워딩 카드] 새 성명 '물러나야 민주당이 산다'(7.21) — 생방송에서 바로 쓰는 핵심 문장 모음","tags":["워딩카드","성명","족보정치","약자코스프레","3선배제","공천혁신","박수칠때떠나라"],"script":["【위기 진단】 민주당의 민주주의가 왜 위기입니까. '너희는 틀렸고 우리만 옳다'는 독선과 아집 때문입니다. 동지의 잘못은 감싸고 반대파의 사소한 잘못엔 시퍼런 칼날을 들이대는 내로남불이 686의 문화가 됐습니다. 그 세월을 지나 지금, 정의는 없고 계파만 남았습니다.","【기득권 규정】 김민석·정청래·송영길 세 선배님이야말로 대한민국의 가장 센 기득권, 민주당 686입니다. 청년들이 몽땅 민주당을 떠나도 아무도 책임을 묻지 않고, 선거에 지고도 다시 당대표 선거에 나옵니다. 청년은 한 번 탈락하면 다시 기회를 얻기 어려운데, 686은 돌아가며 사이좋게 '형님 먼저, 아우 먼저'를 하고 있습니다.","【약자 코스프레 반박(정청래 '집단폭행' 발언 대응)】 30년째 기득권을 누리고 당대표까지 지낸 분이 약자라니요. 진짜 약자는 눈물 한 방울 흘릴 공간도 없고, 억울한 사연을 호소할 토론회 한 번 없고, 기탁금이 없어 빚을 내는 사람입니다. 그런 발연기, 정말 어이가 없습니다.","【족보 정치】 원조라는 글자가 안 들어간 가게가 없는 신당동 떡볶이골목이 생각납니다. 내가 김대중과 친했다, 니가 노무현을 배신하지 않았냐, 내가 이재명을 지켰다 — 언제까지 족보 정치를 할 겁니까. 청년들은 686 삼인방의 족보에 아무 관심이 없습니다. 실용이 뭡니까. 필요한 능력이 있으면 족보를 안 따지고 쓰는 것 아닙니까.","【정책 경쟁 촉구】 청년이 돌아올 정책, 사망 직전인 공정을 회생시킬 대책, 가짜·불법 당원 정리 대책, 3대 메가프로젝트 성공 전략 — 이런 걸 가지고 피 튀기게 싸우십시오. AI 경쟁, 반도체 패권, RE100, 지방소멸, 기후위기로 박 터지게 싸우면 국민과 당원이 행복해집니다.","【통합·재집권】 친명·친청이 합치는 건 기본이고, 모든 민주진보세력에 합리적 보수까지 끌어와야 다음 대선에서 이깁니다. 재집권에 실패하면 다시 계엄입니다. 오늘, 지금, 당장, 족보 타령과 비방을 중단하십시오.","【공천 혁신(신규 공약)】 저는 다음 총선 공천을 686 세대교체의 원년으로 삼겠습니다. 같은 지역에서 합계 세 번 이상 국회의원을 한 분은 공천하지 않겠습니다. 현장 경험과 전문성을 갖춘 청년 인재, 686 등쌀에 기 한 번 못 펴본 각 분야 실력자들을 대거 공천하겠습니다. 2028년 총선, 686 운동권의 명예로운 퇴장을 준비해 드리겠습니다.","【클로징】 산업화 세대가 민주화 세대에게 권력을 넘겼듯, 이제 민주화 세대가 AI 세대에게 권력을 넘겨야 합니다. 운동권 경력은 장기집권 면허증이 아닙니다. 박수 칠 때 떠나라 — 지금이 딱 그때입니다."],"quotes":[["새 성명 전문(7.21)","'왜 민주당은 위기인가'부터 '물러나야 민주당이 산다'까지 8개 장 — 본 카드는 생방송용 발췌"]],"notes":["'3선 이상 공천 배제'는 신규 공약 — 방송에서 처음 공개 시 뉴스포인트, 단 '검토'가 아니라 '하겠다'로 단정하려면 캠프 확정 여부 확인","'발연기' '댕댕이가 웃는다' 등 최고 수위 표현은 라디오에서는 한 번만, 웃음기 없이","송영길 등록 준비 질책('뭐 하다가 면접장에 나타나')은 고함 사건 질문이 나올 때만"],"warn":"수위 최상급 카드 — 생방송에서는 질문이 해당 주제를 정확히 건드릴 때만 꺼낼 것. 선제 공격용으로 쓰지 말 것."},{"no":1,"part":2,"q":"지난 12일 정견 발표, 86 핵심 인사들 앞에서 사실상 '용퇴'를 직격했
