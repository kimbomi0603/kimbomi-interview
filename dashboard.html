 전당대회는 적통이냐 적자냐, 과거 복수혈전에 매달려 있습니다. 국민의 공감도 정책도 관심 밖입니다.","★ 그러니 당 지지율이 대통령 지지율을 따라가지 못하고 오히려 발목을 잡고 있는 것 아닙니까. 저는 그 간격이 곧 민주당 숙제의 크기라고 봅니다.","【참고】 뉴이재명 현상 — 당은 지지하지 않고 이재명 대통령만 지지하는 층이 뚜렷합니다. 대통령 한 사람에게 기대는 정당은 그분이 임기를 마치는 순간 무너집니다. 여당이 할 일은 대통령팔이가 아니라, 정부가 국민께 약속한 것을 입법과 예산으로 완수하는 것입니다.","【참고】 5·18 정신 헌법 전문 수록은 이재명 정부가 국민께 약속한 공식 국정과제 1호이자 호남에게는 정체성 그 자체입니다. 지금 전당대회는 자기정치가 아니라 누가 정부의 약속을 뒷받침해 완수하느냐를 겨루는 자리여야 합니다."],"quotes":[],"notes":[]},{"no":2605,"media":"한겨레21","q":"Q5. 민주당 전당대회가 파묘, 정통성, 자기정치 비판을 받습니다. 어떻게 보십니까?","tags":["계파","파묘","적통논쟁","정책파묘","족보정치","족보캐기","밥그릇싸움","한겨레21"],"script":["★ 정확한 비판이라고 생각합니다. 저도 이번 경선에서 뼈저리게 느낀 게 있습니다.","왜 나왔냐고 물으셔서, 5대 분야 25개 정책 공약과 3단계 실행 로드맵, 그리고 민주당이 가야 할 길을 담은 12가지 약속까지 정말 많이 공부하고 바닥 민심과 청년의 목소리를 담아 말씀드렸습니다. 그런데 아무도 정책을 묻지 않았습니다.","★ 언제 누구와 사진을 찍었는지, 쟤는 어느 라인인지 계파인지, 족보 캐기만 하고 있는 현실을 보면서 참 황당했습니다. 지금도 노사모냐 아니냐, 돌아가신 위인들 이름만 붙들고 부르짖는 전당대회입니다. 일반 청년들이 보기에는 정신이 이상한 것 아닌가 싶은 겁니다.","★ 이게 밥그릇 싸움이 아니면 무엇입니까. 밥그릇 싸움할 때가 아닙니다. 정신 차려야 합니다.","★ 제발 사진 파묘 말고 정책 파묘를 했으면 좋겠습니다. 정책을 파고들어 정책으로 싸우는 전당대회라면, 서울이든 경기든 호남이든 청년들이 다시 투표장으로 돌아올 것입니다."],"quotes":[],"notes":[]},{"no":2606,"media":"한겨레21","q":"Q6. 청년 정치인으로 당대표에 출마한 소회는?","tags":["감사","계란","소회","기탁금","베네핏","컷오프","한겨레21","후원107명"],"script":["★ 당락의 유불리를 떠나 가치와 미래를 보고 소중한 한 표를 던져 주신 감사한 분들, 본인의 젊은 날을 떠올리며 청년의 도전에 손을 내밀어 주신 선배님 후배님들, 한 분 한 분 정말 감사합니다.","★ 정치의 가장 큰 베네핏은 이런 훌륭하고 감사한 분들을 만나뵙고 소통하고 배울 수 있다는 점 아니겠습니까. 저는 정말 복 받았다고 생각합니다.","그만큼 욕도 많이 얻어먹었습니다. 상처 주는 것도 사람이지만, 감사한 분들이 훨씬 더 많습니다. 정치하길 참 잘했다는 생각이 들었습니다.","【참고 숫자】 나흘 남짓한 선거운동에 107명이 1,909만 원을 후원해 주셨습니다. 대부분 소액이었습니다.","【참고】 예비경선 현주소 — 집권여당의 전당대회 예비경선이라고 하기에도 부끄러운, 한마디로 불공정과 반민주의 표본이었습니다. 검증 토론회 한 번 없이 청중 없는 스튜디오에서 7분짜리 동영상 한 번 찍은 게 전부였습니다. 연설회가 아니라 '동영상 촬영회'였습니다."],"quotes":[],"notes":[]},{"no":2607,"media":"한겨레21","q":"Q7. 청년최고위원 부결, 기탁금 문제 등 청년정치인으로서 민주당의 문제는?","tags":["공영제","기탁금","후원회","입장불가","청년결정권","한겨레21","청년최고위원"],"script":["★ 기울어진 운동장이라는 표현으로는 부족합니다. 기탁금을 내고도 운동장 출입 자체가, 입장조차 안 되는 것이 지금의 구조입니다.","★ 청년최고위원 부결이 가장 상징적입니다. 지금도 출마 후보들은 청년, 청년을 외칩니다. 그런데 말뿐이고 구호뿐입니다. 정말로 권한과 마이크를 줘야 합니다.","【참고 숫자】 이번 전당대회 기탁금은 당대표 8천만 원, 최고위원 3천만 원입니다. 과하다는 비판에 2천만 원씩 깎고도 이 액수입니다. 저는 1천만 원을 냈는데 실제 선거운동 기간은 나흘, 공휴일을 빼면 이틀이었습니다.","【참고】 후원회 문제 — 저는 지난 지방선거 때 후원회를 만들고 싶어도 컷오프되고 나서야 승인이 나는 바람에 후원금 한 번 못 받아 보고 서류 작성에 해산 신고까지 했습니다. 이번에는 목숨 걸다시피 매달려 겨우 개설해 하루 이틀 모금하고 컷오프됐습니다. 다른 청년 후보들은 컷오프된 뒤에야 절차가 진행돼 모금 자체를 못 했습니다. 개인의 문제가 아니라 당 시스템의 문제입니다.","【해법】 홍대선언 6번 — 기탁금 완전 폐지 + 당직선거 공영제. 7번 — 청년 기준 45→40세, 선출직 청년최고위원 당헌 명문화, 지명직 최고위원 2명도 청년 임명, 청년위를 청년정책 최고 의결기구로 격상하고 청년위 결정 정책은 당이 책임지고 입법."],"quotes":[],"notes":[]},{"no":2608,"media":"한겨레21","q":"Q8. 8월 17일 결과와 관련해 미리 말씀해 주실 내용이 있다면?","tags":["도색","시스템","세대교체","싱어게인","한겨레21"],"script":["★ 어떤 결과가 나오든, 가장 중요한 것은 누가 되어도 바뀌지 않는 시스템을 만드는 일이라고 생각합니다.","★ 낡은 운영체제 위에 새 얼굴만 얹는 것은 혁신이 아닌 도색입니다.","★ 승자도 패자도 함께 빛나는 싱어게인 같은 민주당이 되었으면 좋겠습니다. 국민의 한 사람으로서 민주당이 정말 잘되기를 바랍니다.","【참고】 경선이 끝나면 패자에게는 마이크조차 주어지지 않습니다. 이번에도 그 장면이 나오지 않는다면, 다음 청년은 또 도전하지 않을 것입니다."],"quotes":[],"notes":[]},{"no":2609,"media":"한겨레21","q":"Q9. 선출된 당대표가 해야 할 핵심 역할은?","tags":["경선혁신","공천혁신","유령당원","홍대선언","당대표역할","득표수공개","청년결정권","한겨레21"],"script":["★ 홍대선언 12약속 가운데 당장 세 가지만 해 주시면 됩니다.","첫째, 경선 규칙을 선거 6개월 전에 확정하고 '달리 정할 수 있다'는 고무줄 예외조항을 전부 삭제하는 것입니다. 다르게 적용되는 규칙은 민주주의를 죽이는 흉기입니다.","둘째, 당원명부를 행정안전부 주민등록 자료와 대조해 가짜당원과 불법당원을 정리하고, 선거인 수와 투표율과 득표수를 전량 공개하는 것입니다. 공개하지 못할 경선이라면 공정한 경선이라 말할 수 없습니다.","셋째, 청년에게 자리 대신 권한을 주는 것입니다. 청년 기준 40세, 선출직 청년최고위원, 청년위 최고 의결기구화입니다.","【추가로 요구할 것】 동일 지역구 3선 초과 공천 금지(민주당 혁신위원회도 이미 제안), 당직선거 공영제, 미래전환위원회 설치와 7대 미래산업(AI·반도체·로봇·재생에너지·바이오·양자·우주항공), 당 재정 전면 공개."],"quotes":[],"notes":[]},{"no":2610,"media":"한겨레21","q":"Q10. 86세대의 핵심 문제는 무엇이고, 물러나야 하는 이유는?","tags":["김대중","3선배제","86세대","86용퇴","골든타임","세대교체","후배양성","김대중발탁","한겨레21","화염병짱돌"],"script":["★ 이분들의 감사한 마음을 누가 모르겠습니까. 더군다나 호남 사람이라면 모를 수가 없습니다. 그리고 물러나라고 해서 물러나실 분들입니까.","★ 김대중 대통령 시절 30대 청년들이 발탁되어 지금 30년, 40년째 정치를 하고 계십니다. 이제는 후배 양성도 좀 하고 넥스트 민주당을 생각해야 할 때가 한참 지났습니다.","★ 골든타임도 놓쳤습니다. 이제 밥그릇 싸움 그만하시고 민주당을 살렸으면 좋겠습니다.","【되받아치기】 30여 년 전에 발탁되신 분들은 그때 준비가 완료된 상태였습니까. 기회를 먼저 받고 그 안에서 성장하신 것 아닙니까. 그런데 지금은 청년에게 '아직 준비가 안 됐다'고 합니다.","【제도적 해법】 스스로 물러날 사람은 없습니다. 그래서 동일 지역구 3선 초과 공천 금지를 당헌·당규에 제도화해야 합니다. 세대교체 없이 2030년 재집권은 어렵습니다."],"quotes":[],"notes":[]},{"no":2611,"media":"한겨레21","q":"Q11. 생각하시는 청년 정치란 무엇인가요?","tags":["꼰대","청년","세대교체","청년정치","청년팔이","20대꼰대","한겨레21","싹쓸이세대교체"],"script":["★ 청년팔이 하는 것 아니냐, 능력 없으면 정치하지 말라고들 하십니다. 그건 민주당의 시스템을 한 번도 겪어 보지 않은 문외한이 하는 소리입니다. 출마 한 번 안 해 보신 분들이 평론이라며 막말을 많이 하시던데, 직접 겪어 보고 말씀하셨으면 합니다.","★ 제가 지적하는 것은 능력이 아니라 시스템의 불공정입니다. 기울어진 운동장 정도가 아니라 아예 출입이 안 되는 구조입니다.","★ 20대 꼰대가 있을 수 있고 60대 청년이 있을 수 있습니다. 나이가 중요한 게 아닙니다. 시스템만 바로 서면, 능력 없이 줄만 잡고 계신 분들은 알아서 정리되고 싹쓸이 세대교체가 될 것이라 확신합니다.","【덧붙일 정의】 청년 정치는 당사자가 결정에 참여하는 정치입니다. 청년 주거 정책을 청년 없이 만드니 폐버스 이야기가 나옵니다. 땡볕에 걸어보지 않은 사람은 그늘길 알려주는 앱 같은 정책을 만들지 못합니다. 저도 이번 경선 때 서울에 잘 곳이 없어 렌터카에서 쪽잠을 잤습니다."],"quotes":[],"notes":[]},{"no":2612,"media":"한겨레21","q":"Q12. 국내외에서 청년 정치의 모델로 삼고 계신 인물이 있으실까요?","tags":["맘다니","스웨덴","청년당","프랑스","지방의원","청년정치","해외사례","한겨레21","지방의원평가절하"],"script":["★ 인물보다 판을 봅니다. 프랑스는 서른아홉에 대통령이 나왔고 서른네 살 총리가 나왔습니다. 스웨덴은 20대 국회의원이 흔하고, 정당의 청년조직이 자체 예산과 인사권을 갖고 정치인을 길러 냅니다. 뉴욕에서는 서른네 살 조란 맘다니가 시장이 되었습니다. 저보다 동생뻘입니다.","★ 그 나라들이 특별히 청년을 사랑해서가 아닙니다. 청년이 실력을 증명할 링이 있었던 것입니다.","★ 그리고 하나 꼭 말씀드리고 싶은 게 있습니다. 저는 강진군의회 의장까지 지냈습니다. 그런데 지방의원 출신이라고 하면 정치 경력으로 쳐 주지도 않습니다. 주민을 가장 가까이에서 만나고 예산을 직접 심의하고 집행을 감시하는 자리인데 말입니다. 지방의원을 평가절하하는 문화 자체가 청년 정치를 가로막는 벽입니다. 정치는 여의도에서만 하는 게 아닙니다.","【참고】 해외 청년조직 사례 — 독일 사민당 유조스(Jusos)와 영국 노동당 영 레이버(Young Labour)는 자체 예산과 인사권을 갖고 대의원과 집행위원을 직접 선출합니다. 청년조직이 장식품이 아니라 지도자를 길러 내는 훈련소이자 견제 장치입니다. 그래서 저는 당헌상 특별기구로 '민주당 청년당'을 제안했습니다. 자동가입, 직선제, 독자 재정, 청년 선거구 공천추천권까지 갖는 준자치 조직입니다.","【참고】 합동연설회 공약 — 최고위원회 등 당의 최고 의사결정 단위에 청년과 지방의원의 몫을 제도적으로 보장하겠다고 약속했습니다."],"quotes":[],"notes":[]},{"no":2613,"media":"한겨레21","q":"Q13. '입틀막'에 대해 구체적으로 설명 부탁드립니다.","tags":["인증샷","입틀막","컷오프","문자폭탄","사과문자","득표수공개","온라인폭력","좋아요눈치","한겨레21"],"script":["★ 거창한 게 아닙니다. 아주 실무적인 방식으로 이루어집니다.","돈으로 막습니다. 기탁금, 그리고 컷오프된 뒤에야 승인되는 후원회입니다. 시간으로 막습니다. 선거운동 나흘, 공휴일 빼면 이틀입니다. 마이크로 막습니다. 검증 토론회 한 번 없이 7분 동영상 한 번, 첫 방송토론은 컷오프가 끝난 뒤에 열렸습니다. 숫자로 막습니다. 저는 제가 몇 표를 받았는지 지금도 모릅니다.","★ 그런데 가장 아픈 건 따로 있습니다. 청년 동지들이 눈치가 보여서 페이스북 좋아요조차 누르지 못하면서, 4번은 찍었다며 인증샷을 몰래 보내옵니다. 저에 대한 지적 글을 올리고 나서 어쩔 수 없었다며 사과 문자를 보내온 청년 동지도 있었습니다.","★ 이게 입틀막의 현실입니다. 좋아요 하나 누르는 데도 눈치를 봐야 하는 정당에서 어떤 청년이 자기 목소리를 내겠습니까.","【참고】 온라인 폭력 — 예비경선 기간에 제가 받은 것은 비판이 아니었습니다. 쳐죽인다, 묻어버린다는 협박과 쌍욕, 여성 비하와 장애 조롱이었습니다. 지금 고소를 진행하고 있습니다. 저 하나 조용해지는 것으로 끝날 일이었다면 시작하지도 않았습니다."],"quotes":[],"notes":[]},{"no":2614,"media":"한겨레21","q":"Q14. 민주당에서 세대교체가 이뤄지지 못하는 이유는?","tags":["공천","김민석","5대요구","세대교체","운영체제","족보전쟁","족보정치","한겨레21","공천혁신특위"],"script":["★ 지금 한창 전쟁 중인 족보 전쟁 아니겠습니까. 어느 라인이냐, 어느 출신이냐로 자리가 정해집니다.","★ 그래서 저는 세대교체는 사람의 교체가 아닌 운영체제의 교체다, 공정한 링이 먼저 세워져야 한다고 계속 목소리를 내는 것입니다.","그래서 저는 김민석 후보의 공천혁신특별위원회 제안을 환영했습니다. 모든 후보 가운데 유일하게 호남 공천 문제의 심각성을 인정하고, 당대표가 되는 즉시 특위를 구성해 연말까지 새 공천 시스템을 만들겠다고 약속했기 때문입니다. 어제(8월 10일) 광주 전일빌딩245에서 기자회견을 열어 특위가 반드시 담아야 할 다섯 가지를 요구했습니다.","★ 【공천혁신특위 5대 요구】 하나, 공천 규칙을 선거 6개월 전에 확정하고 '달리 정할 수 있다' 예외조항을 삭제할 것. 둘, 유령당원과 불법당원과 이중당원을 전면 정리하고 당원명부를 행정안전부 주민등록 데이터와 대조해 진정한 1인 1표를 실현할 것. 셋, 선거인 수와 투표율과 후보별 득표수까지 경선 결과를 100% 공개할 것. 넷, 토론과 연설로 실력을 겨루는 경선을 보장할 것. 다섯, 특위 위원 과반수를 낙천자와 청년 당원으로 구성하고 기득권 정치인은 배제할 것.","★ 현 시스템의 수혜자, 낡은 운영체계 덕분에 기득권을 쌓아온 정치인은 배제해야 합니다. 도둑에게 자물쇠를 맡길 수는 없습니다."],"quotes":[],"notes":[]},{"no":2615,"media":"한겨레21","q":"Q15. 청년 정치인에게 기회가 부족한 겁니까, 실력이 부족한 겁니까?","tags":["공천","청년","토론회","경선혁신","자료없음","토론없음","한겨레21","기회vs실력"],"script":["★ 실력을 보여 줄 기회가 없으니, 실력을 판단할 자료도 없는 것입니다.","토론 한 번, 연설 한 번 없이 공천이 끝나는데 누가 실력 있는지 무엇으로 압니까. 후보가 한글을 읽을 줄은 아는지, 어떤 정책과 비전을 가졌는지 알 길조차 없습니다. 그러니 결국 이름값과 조직력으로 결정됩니다. 그 경기에서 청년이 이길 방법은 없습니다.","★ 토론과 연설로 겨루는 경선만 보장되면, 실력 논쟁은 저절로 끝납니다. 공정한 링만 세워지면 능력 있는 분들로 싹쓸이 세대교체가 될 것이라 확신합니다."],"quotes":[],"notes":[]},{"no":2616,"media":"한겨레21","q":"Q16. 민주당에서 이준석 대표 같은 청년 당대표가 나오지 못하는 이유는?","tags":["구조","맘다니","이준석","컷오프","경선혁신","이틀선거","한겨레21"],"script":["★ 이준석이 아니라 맘다니가 와도 나올 수 없는 구조입니다.","★ 이번 예비경선을 보십시오. 공휴일을 끼면 사실상 이틀도 안 되는 선거 기간입니다. 로또에 당첨된다 해도 이 경선을 통과하기는 힘든 구조입니다. 사람의 문제가 아니라 판의 문제입니다.","★ 지금 민주당의 현주소를 이보다 잘 보여 주는 게 있습니까.","【덧붙일 구조 설명】 당시 국민의힘은 위기에서 흥행이 필요했고, 토론과 미디어로 승부가 나는 판이 열렸습니다. 무명이라도 말로 이기면 올라갈 수 있었습니다. 민주당은 조직과 명부로 승부가 납니다. 토론이 없으면 신인이 뒤집을 지점이 없고, 명부에 유령당원과 이중당원이 섞이면 조직력 격차는 더 벌어집니다. 판만 바꾸면 민주당에도 30대 대표가 나옵니다."],"quotes":[],"notes":[]},{"no":2617,"media":"한겨레21","q":"Q17. 86세대가 물러나면 청년 정치는 어떤 콘텐츠로 채울 수 있을까요?","tags":["AI","청년","모병제","응원봉","86용퇴","골든타임","기후위기","미래의제","지방소멸","미래전환위","한겨레21","5060정당","메가프로젝트","청년취업보장제"],"script":["★ 지금 민주당은 말 그대로 5060의 정당 아닙니까. 2030, 2040의 다양한 목소리를 반영하는 것이 민주당이 해야 할 일입니다.","★ 더군다나 2030은 무관심을 넘어 아예 마음이 돌아서 버렸습니다. 여론조사를 돌아보십시오. 응원봉을 들었던 청년들이 다 어디로 갔습니까. 골든타임을 넘어섰습니다. 더 이상 늦으면 안 됩니다.","★ 채울 콘텐츠는 이미 준비되어 있습니다. 5대 분야 25개 정책 공약과 3단계 실행 로드맵을 내놓았습니다.","【미래 의제 목록】 ① AI 대전환 — 대통령과 함께 반도체, AI 데이터센터, 피지컬 AI 3대 메가프로젝트 성공, 호남 반도체 800조 뒷받침. ② 미래전환위원회 설치와 7대 미래산업(AI·반도체·로봇·재생에너지·바이오·양자·우주항공). ③ 지방소멸 대응과 국토균형발전. ④ 국가청년취업보장제를 민주당 핵심 정책으로 도입. ⑤ 청년 주거 — 소형·이동형 주택 등 실질 대안. ⑥ 징병제의 단계적 모병제 전환과 군 복무자 가산점·보상 제도화. ⑦ 기후위기 대응과 농업('AI 다음은 농업', 기후위기는 곧 식량위기). ⑧ 당원 정치·정책교육(16세 당원부터 50년 당원까지).","【참고】 검찰개혁과 내란 청산은 반드시 완수해야 합니다. 그러나 민주당이 국민에게 내놓을 의제가 그것뿐일 수는 없습니다. 과거에 복수하는 복수혈전 민주당을 미래를 여는 미래선도 민주당으로 바꿔야 합니다."],"quotes":[],"notes":[]},{"no":2618,"media":"한겨레21","q":"Q18. 2030이 민주당을 떠난 이유는? 민주당의 핵심 문제는?","tags":["공정","문화","언어","무당층","2030","뉴이재명","온라인폭력","한겨레21","2030이탈"],"script":["★ 세 가지로 봅니다. 공정, 언어, 문화입니다.","첫째, 공정입니다. 청년은 결과보다 과정을 봅니다. 규칙이 수시로 바뀌고 결과를 공개하지 않는 정당을 청년이 신뢰할 리 없습니다. 우리 당이 가장 크게 배신한 지점이 바로 여기입니다.","둘째, 언어입니다. 당은 계속 과거를 말하는데 청년의 삶은 지금 여기에 있습니다. 집값, 일자리, 돌봄, AI. 이 단어들이 이번 전당대회에서 몇 번이나 나왔습니까.","셋째, 문화입니다. 온라인에서 다른 의견을 내면 조리돌림을 당합니다. 저는 이번에 협박과 쌍욕, 여성 비하와 장애 조롱을 다 겪었습니다. 그 광경을 본 청년이 어느 정당에 가입하겠습니까.","★ 지금은 당을 지지하기보다 이재명 대통령만 지지하는 층, 이른바 뉴이재명 현상이 뚜렷합니다. 대통령 지지율과 당 지지율의 간격이 곧 민주당 숙제의 크기입니다."],"quotes":[],"notes":[]},{"no":2619,"media":"한겨레21","q":"Q19. 민주당은 어떻게 변해야 할까요?","tags":["대전환","경선혁신","당원주권","공약총정리","미래전환위","의지의문제","청년결정권","한겨레21"],"script":["★ 제가 제안한 것을 그대로 말씀드리겠습니다. 규칙, 당원, 청년, 미래 네 갈래입니다.","규칙에서는 경선 규칙 6개월 전 확정과 예외조항 삭제, 결과 100% 공개, 토론과 연설로 겨루는 공천과 토론 불참자 감점, 선호투표제 항구 제도화, 예비경선 2주 이상 보장과 토론회 3회 이상, 기탁금 폐지와 당직선거 공영제입니다.","당원에서는 가짜당원과 불법당원과 이중당원 정리, 행안부 주민등록 대조와 자발적 가입 전수 확인, 당비 월 1만 원과 6개월 납부 권리당원제입니다.","청년에서는 자리가 아닌 권한, 청년 기준 45→40세, 선출직 청년최고위원 당헌 명문화와 지명직 2명 청년 임명, 청년위 최고 의결기구화와 입법 의무화, 청년 예산 10%, 정책 오디션, 최고 의사결정 단위에 청년과 지방의원 몫 보장입니다.","미래에서는 미래전환위 설치와 7대 미래산업, 3대 메가프로젝트 성공, 동일 지역구 3선 초과 공천 금지, 사무처 전면 쇄신, 당원 정치·정책교육, 그리고 당 재정 10원까지 전면 공개입니다.","★ 돈이 드는 일도, 시간이 걸리는 일도 아닙니다. 의지의 문제입니다."],"quotes":[],"notes":[]},{"no":2620,"media":"한겨레21","q":"Q20. 2013년 23살에 입당하셨습니다. 계기와 목표는?","tags":["강진","입당","최다득표","기회의정당","지역위원장","한겨레21"],"script":["★ 제가 살고 있는 이곳이 바뀌려면 정치가 바뀌어야 한다고 생각했고, 당연히 그것을 바꿀 수 있는 정당이 민주당이라고 믿었습니다.","★ 그리고 민주당은 저에게 있어서 그야말로 기회의 정당이었습니다. 지역위원장이 누구인지도 모르고 정치에 도전했는데, 공정한 경선의 링이 있었고 거기서 최다득표로 당선되었습니다.","★ 마음껏 선거운동하고 경선할 수 있는 기회의 자리를 열어 주신 그때 지역위원장님께 아직도 감사한 마음입니다.","★ 제가 그 링을 다시 세우자고 말하는 이유가 여기 있습니다. 저는 그 링 덕분에 정치를 시작했습니다. 그런데 지금 청년들에게는 그 링이 없습니다."],"quotes":[],"notes":[]},{"no":2621,"media":"한겨레21","q":"Q21. 앞으로 어떤 계획을 갖고 계실까요?","tags":["계획","25공약","재정주권","기차는간다","한겨레21","공천혁신특위","불통의민주당","예산바로보기"],"script":["★ 지금 제가 정말 바닥 민심 싹싹 긁고 청년들의 목소리를 모아서 5대 분야 25개 정책 공약과 3단계 실행 로드맵, 그리고 민주당이 가야 할 길 12가지 약속을 제시했습니다. 제가 발언한 이 모든 것을 지키려면 더 열심히 살아야 하지 않겠습니까.","★ 제 자리에서 제가 할 수 있는 모든 역할을 다 할 것이고, 앞으로도 목소리를 낼 것입니다.","★ 지금 민주당은 불통의 민주당입니다. 개가 짖어도 기차는 간다는 식입니다. 그렇다면 저는 끝까지 외치고 짖어대겠습니다.","【구체 계획】 하나, 재정주권 시민행동 공동대표로 예산 바로보기 운동을 전국으로 넓히겠습니다. 정당의 깜깜이 회계가 투명해지는 그날까지 청년들과 함께 하겠습니다. 둘, 공천혁신 5대 요구가 연말까지 당헌·당규가 되는지 끝까지 감시하겠습니다. 되지 않으면 가장 먼저, 가장 크게 비판하는 사람이 저일 것입니다. 셋, 온라인 폭력 고소는 끝까지 가겠습니다. 넷, 링이 열리면 다시 오르겠습니다."],"quotes":[],"notes":[]},{"no":2622,"media":"한겨레21","q":"Q22. 꼭 하고 싶은 말씀이 있으실까요?","tags":["계란","마무리","계란과바위","도전의역사","한겨레21","침묵하는다수"],"script":["★ 두 가지만 말씀드리겠습니다.","★ 첫째, 침묵하는 다수입니다. 지금 민주당의 목소리는 일부 강성 지지층이 대표하는 것처럼 보입니다. 그러나 제가 만난 당원의 대부분은 그렇지 않았습니다. 어느 당원께서 저에게 '빨리 세상이 제자리를 찾아갔으면 좋겠다'고 하셨습니다. 그 간절한 바람이 이루어지는 민주당을 만들고 싶습니다.","★ 둘째, 도전하는 청년들에게 하고 싶은 말입니다. 저는 이번에 깨졌습니다. 그런데 깨지면서 알았습니다. 계란 하나로는 안 되지만, 계란이 뭉치면 바위에 금이 갑니다.","★ 이제 눈치 보지 않겠습니다. 길들여질 생각도, 순응할 생각도 없습니다. 끝까지 계란으로 바위 치기, 도전의 역사는 계속될 것입니다."],"quotes":[],"notes":[]},{"no":2623,"media":"한겨레21","q":"Q23. 존경하는 정치인은 누구입니까?","tags":["계란","김근태","김대중","노무현","문재인","이해찬","적통논쟁","지방자치","계란과바위","도전의적통","한겨레21"],"script":["★ 김대중, 노무현, 문재인 세 분 대통령은 물론이고, 김근태, 이해찬 선배님 같은 분들도 존경합니다. 그분들의 헌신 위에 오늘의 민주당이 서 있습니다.","★ 그중에서도 저는 김대중 대통령을 첫손에 꼽습니다. 미스터 지방자치, 이 나라 지방자치를 만들어 내신 분입니다. 단식까지 하며 지방자치를 관철하셨습니다. 저는 그 지방자치 덕분에 스물아홉에 강진에서 군의원이 되었고 의장까지 지냈습니다. 제 정치의 출발점을 만들어 주신 분입니다.","★ 그리고 김대중 대통령은 30대 젊은피를 수혈해 민주당을 바꾸신 분입니다. 지금의 686이 바로 그때 발탁된 청년들입니다. 청년들이 민주당에 가장 뜨거웠던 시절이 언제였습니까. 바로 그때였습니다.","★ 노무현 대통령은 어떻습니까. 이길 수 없다는 것을 알면서도 지역주의와 싸우겠다며 부산에 나가 떨어지고 또 떨어졌습니다. 계산으로는 설명이 안 되는 선택이었습니다.","★ 저는 민주당의 적통이 여기 있다고 생각합니다. 계란으로 바위를 치는 도전의 정신, 그것이 민주당의 역사입니다. 지금 누가 적통이냐고 족보를 캐고 계신데, 적통은 사진이나 인맥에 있지 않습니다. 도전의 정신을 잇는 사람이 적통입니다.","★ 저는 그 도전의 적통을 잇고 있다고 감히 말씀드립니다. 계란은 깨졌지만 바위에 낸 금은 남았습니다. 계란들의 반란은 앞으로도 계속될 것입니다.","【참고】 김대중 대통령은 지방자치 실시를 관철하기 위해 1990년 13일간 단식했습니다. 1996년 총선에서는 30대 청년들을 대거 발탁했고, 그때 발탁된 분들이 지금 30년 넘게 정치를 하고 계십니다. 그래서 저는 말씀드립니다. 그분들도 준비가 완료된 상태에서 발탁된 것이 아닙니다. 기회를 먼저 받고 그 안에서 성장하셨습니다.","【연결】 지금 민주당이 해야 할 일은 그때 김대중 대통령이 하신 일을 다시 하는 것입니다. 청년에게 기회를 주고, 그 안에서 자라게 하는 것입니다."],"quotes":[],"notes":[]},{"no":2701,"media":"전격시사(8.12)","q":"【Q1 · 출마 소회】 1/ 후보 등록 기간 기탁금 문제부터 해서, 청년최고위원 제도 도입에 대한 논란도 있었습니다. 결과적으로 아쉽게도 청년 후보들이 예비경선에서 컷오프 되는 바람에 전당대회 과정에서 청년의 목소리가 더 듣기 어려워진 것 같은데요. 아픈 이야기지만 다른 이야기하기 전에, 이번 전당대회에 출마한 소회도 한 말씀 듣고 싶습니다.","tags":["8.12","KBS","기탁금","전격시사","청년","청년최고위원"],"script":["★ 정말 많은 관심과 큰 사랑을 받았습니다. 감사한 마음으로 용기를 내고 있습니다. 정치하기 참 잘했다는 생각이 듭니다.","당락의 유불리를 떠나 가치와 미래를 보고 한 표를 던져 주신 분들, 본인의 젊은 날을 떠올리며 청년의 도전에 손을 내밀어 주신 진짜 어른들, 훌륭한 선배님 후배님들. 그 한 분 한 분이 정말 감사했습니다.","이런 분들을 만나고 배우고 소통할 수 있다는 것, 그게 정치의 가장 큰 베네핏 아니겠습니까. 물론 평생 들을 욕도 다 들었습니다. 사람에게 상처도 받지만, 결국 더 훌륭한 많은 분들에게 힘을 얻습니다.","★ 계란은 깨졌지만, 바위에 낸 금은 남았습니다."],"quotes":[],"notes":[]},{"no":2702,"media":"전격시사(8.12)","q":"【Q1-1 · 연설 기회 부족】 - 공식적으로 후보 연설을 들을 기회도 굉장히 적었어요?","tags":["8.12","KBS","전격시사"],"script":["★ 집권여당의 전당대회 예비경선이라고 하기에도 부끄러운, 한마디로 불공정과 반민주의 표본이었습니다.","검증 토론회 한 번 없이, 청중 없는 스튜디오에서 7분짜리 동영상 한 번 찍은 게 전부였습니다. 연설회가 아니라 '동영상 촬영회'였지요.","★ 이 짧은 예비경선 기간에 민주당이 현주소를 다 보여줬다고 생각합니다."],"quotes":[],"notes":[]},{"no":2703,"media":"전격시사(8.12)","q":"【Q1-2 · 청년 원외의 어려움(후원회)】 - 청년 원외 정치인이 현실적으로 겪는 어려움은 어떤 게 있습니까?","tags":["8.12","KBS","기탁금","전격시사","청년"],"script":["★ 다들 보좌관에 비서진이 있으시지만, 여기 김형남 국장님이나 저나 본인이 다 해야 합니다. 특히 후원회 문제를 빼놓을 수 없습니다.","저는 지난 지방선거 때 후원회를 만들고 싶어도 컷오프되고 나서야 승인이 나는 바람에, 후원금 한 번 못 받아 보고 고생은 고생대로 하고, 서류 작성에 해산 신고까지 하느라 속이 많이 상했습니다.","그 경험이 있어서 이번엔 다 제쳐 두고 목숨 걸다시피 매달렸고, 운 좋게 겨우 개설해서 하루 이틀이나마 모금을 하고 컷오프됐습니다. 그런데 다른 후보님들은 컷오프된 뒤에야 절차가 진행돼 모금 자체를 못 했습니다.","개인의 문제가 아니라 당 시스템의 문제입니다. 실제 선거운동이 하루 이틀뿐인데, 이게 어떻게 전당대회가 되겠습니까.","★ 기울어진 운동장이 아니라, 기탁금을 내고도 운동장에 사실상 입장조차 못 하는 현실입니다."],"quotes":[],"notes":[]},{"no":2704,"media":"전격시사(8.12)","q":"【Q2 · 전대 룰 · 준비 부족】 2/ 1인1표제와 선호투표제가 처음으로 적용되는 전당대회인데, 투표를 하고 연설을 듣는다는 등 전당대회 룰에 대한 지적이 있지 않습니까. 준비가 부족했다는 점에 대해서는 어떻게 생각하시는지요?","tags":["8.12","KBS","전격시사"],"script":["★ 이력서도 안 읽고 합격 도장부터 찍는 회사는 없죠? 저는 준비 부족이 아니라 설계라고 봅니다. 돈 드는 일도 아닙니다. 의지의 문제입니다.","많은 분들이 개선해야 한다고 말하면 좀 들어야 하지 않겠습니까. '개가 짖어도 기차는 간다'는 식의 불통이 진짜 문제입니다.","★ 당원주권, 1인1표를 구호로만 외칠 게 아니라 당원이 체감하게 해야 합니다. 듣는 척도 하지 않지만, 저는 계속 목소리를 내겠습니다."],"quotes":[],"notes":[]},{"no":2705,"media":"전격시사(8.12)","q":"【Q3 · 지명직 청년 배정 공약】 3/ 김민석 후보는 지명직 최고위원 중 하나는 청년 선출직 최고위원으로, 다른 하나는 노동계 최고위원으로 하겠다는 입장을 밝혔고, 송영길 후보는 지명직 두 자리를 모두 청년에게 배정하겠다고 밝혔습니다. 정청래 후보도 청년 평당원 가운데 1명을 지명직으로 임명하겠다는 입장이고요. 이건 어떻게 보시는지요?","tags":["8.12","KBS","전격시사","청년","청년최고위원"],"script":["★ 김대중 대통령께서 젊은피 수혈로 30대 청년 김민석, 송영길을 발탁하셨고, 그분들이 30년간 정치를 해 오시지 않았습니까.","그런데 지금 민주당의 현실을 보십시오. 2030이 어디 있습니까. 5060 정당입니다.","지난 30년 정치인으로 뭐 하시다가, 당대표가 되면 갑자기 하시겠다니 믿음이 안 가는 게 당연하지 않습니까. 심지어 두 분은 당대표까지 지내신 분들입니다.","★ 선거 때 공약을 막 던질 게 아니라 정말 신중해야 합니다. 정치인에게 가장 중요한 건 책임감입니다."],"quotes":[],"notes":[]},{"no":2706,"media":"전격시사(8.12)","q":"【Q4 · 2030 청년 타운홀 미팅】 4/ 전당대회와 동시에 '2030 청년 타운홀 미팅'도 진행이 되고 있습니다. 좀 구체적인 이야기가 되고 있나요? 당이 청년 목소리를 더 반영하기 위해서는 구조적으로 어떤 변화가 필요하다고 보십니까?","tags":["8.12","KBS","전격시사","청년"],"script":["★ 제가 페이스북에 쓴 그대로입니다. 말만 최종면접이지, 결국 전당대회 마지막 대미를 장식하는 데 청년을 병풍으로, 들러리로 사진 찍으러 오라는 것 아닌가. 너무 아쉽습니다.","투표가 사실상 다 끝난 뒤에 보는 면접이 무슨 면접입니까. 채용 끝내 놓고 면접관 부르는 회사는 없습니다.","★ 청년에게 사실상 마이크도 안 주는 정당이 무슨 권한을 주겠나 싶지만, 그래도 저는 계속 외칩니다. 당사자에게 정책 권한을 달라, 예산 권한을 달라."],"quotes":[],"notes":[]},{"no":2707,"media":"전격시사(8.12)","q":"【Q5 · 버스하우스 논란】 5/ 황희 의원이 '버스하우스' 논란에 대해 사과를 했습니다만, 청년 민심과 부동산 민심을 제대로 읽지 못하고 있다는 지적이 거셉니다. 이 문제는 어떻게 보셨는지요?","tags":["8.12","KBS","공급대책","부동산","세제개편안","전격시사","청년"],"script":["★ 중요한 건 청년의 분노를 못 읽었다는 겁니다. 저는 정책 아이디어 자체는 다양하게 펼쳐져야 한다고 생각합니다. 문제는 절차와 과정입니다.","본인들은 쾌적한 집에 살면서 청년에게는 폐버스를 던져 주니 와닿지 않는 겁니다. 저도 이번 경선 때 서울에 잘 곳이 없어 렌터카에서 쪽잠을 잤습니다. 땡볕에 걸어보지 않은 사람은 그늘길 앱 같은 정책을 못 만듭니다.","홍콩의 튜브하우스, 스웨덴의 대학가 마이크로주택처럼 진지한 대안은 많습니다. 청년과 함께 설계하면 됩니다.","★ 던져 놓고 지우는 정치도, 조롱만 하는 정치도 청년의 잠자리는 못 지킵니다.","★ ▼ [Q5-1 예상] 부동산 공급대책, 세제개편안 의견을 물으면 (간결판)","★ ⭐ 핵심 한 문장 — 청년은 낼 세금이 없어서 힘든 게 아니라, 낼 집이 없어서 힘듭니다.","★ [정부 대책 평가] 방향은 옳습니다. 거주 중심으로 가는 것, 찬성합니다. 다만 이번 개편은 종부세를 조이고 양도세 퇴로를 열어 다주택자 매물을 끌어내는 구조입니다. 집이 매물로 나오면 그 집에 세 들어 살던 청년부터 나가야 합니다. 집값 잡는 대책은 있는데, 세입자 지키는 대책이 없습니다.","★ 내일 나올 공급대책에는 딱 두 가지만 담아 주십시오. 5만 호 중 청년 몫이 몇 호인지, 그리고 언제 입주하는지. 총량만 발표하면 청년 몫은 늘 마지막에 사라집니다.","★ [청년 주거난의 본질] 부모 자산이 없으면 서울에서 못 버팁니다. 2026년 최저임금이 월 215만 원, 세금 떼면 200만 원이 안 됩니다. 그런데 원룸 월세에 관리비까지 더하면 소득의 3분의 1이 그냥 나갑니다. 대출 규제는 투기꾼 잡겠다고 만들었는데 청년 실수요자가 같이 맞고 있습니다. 청년과 신혼부부는 예외로 하겠다고 7월부터 검토만 하고 있습니다.","★ [당장 할 일 3가지] 첫째, 청년월세지원이 월 20만 원입니다. 서울 월세의 3분의 1도 안 됩니다. 현실에 맞게 올려야 합니다. 둘째, 월 30만 원대에 살 수 있는 청년임대주택을 눈에 보이게 늘려야 합니다. 기숙사와 청년주택은 주민 반대로 번번이 무산되는데, 정부가 직접 중재해야 지어집니다. 셋째, 이번 대책은 서울과 수도권에 집중돼 있습니다. 한쪽은 집이 없어 난리인데 저희 강진은 빈집이 늘어 갑니다. 수도권에 5만 호 짓는 정성의 절반만 지방 빈집을 청년 주거로 바꾸는 데 써 주십시오.","★ 부동산 정책의 성적표는 세율표에 있지 않습니다. 청년이 오늘 밤 어디서 자느냐에 있습니다."],"quotes":[],"notes":[]},{"no":2708,"media":"전격시사(8.12)","q":"【Q6 · 귀를 사로잡은 것(공천혁신)】 6/ 전당대회 이야기 조금 더 해보면, 청년 정치인의 입장에서 봤을 때, 지금까지 진행 과정에서 청년의 귀를 사로잡는 이야기가 있습니까?","tags":["8.12","KBS","공천","전격시사","청년","호남"],"script":["★ 솔직히 공약을 지킬지 의구심부터 드는데, 무슨 솔깃한 이야기가 있겠습니까. 청년들은 지금 투표도 하기 싫어합니다. 그 마음, 너무나 잘 압니다. 뽑고 싶은 후보가 없는 겁니다.","민주당에서 13년째 정치하고 있는 저 김보미에게 유일하게 솔깃했던 건 공천 혁신입니다. 모든 후보 가운데 유일하게 호남 공천 문제의 심각성과 임계점에 다다른 호남의 분노를 파악하고, 당대표가 되는 즉시 공천혁신특위를 구성해 연말까지 새 공천 시스템을 만들겠다는 김민석 후보의 발언에, 저는 환영하고 공천혁신 완수를 촉구하는 기자회견까지 했습니다.","★ 누가 대표가 되든 바뀌지 않는 공천 시스템이 서야, 기울어지지 않은 운동장이 됩니다. 공정한 링만 세워지면, 능력 있는 분들로 싹쓸이 세대교체가 될 거라고 확신합니다.","★ ※ 특위에 제안할 3가지가 이어서 나오면 → 돌발카드 ② 참고"],"quotes":[],"notes":[]},{"no":2709,"media":"전격시사(8.12)","q":"【Q7 · 어떤 지도부가 필요한가】 7/ 두 분은 이번 전당대회에서 가장 중요한 게 뭐라고 생각하십니까? 어떤 지도부가 선출되어야 한다고 생각하시는지요?","tags":["8.12","KBS","공천","전격시사","청년"],"script":["★ 누가 되느냐보다, 누가 되어도 바뀌지 않는 시스템을 남기느냐입니다. 낡은 운영체제 위에 새 얼굴만 얹는 건 혁신이 아니라 도색입니다.","경선과 공천 데이터를 공개할 지도부, 청년에게 자리가 아니라 예산과 결정권을 줄 지도부, 과거에 복수하는 대신 AI 대전환과 지방소멸, 청년의 삶이라는 미래의 언어로 일할 지도부입니다.","★ 재집권에 실패하면 다시 계엄입니다. 이기려면 2030이 돌아와야 하고, 그 시작은 공정입니다."],"quotes":[],"notes":[]},{"no":2710,"media":"전격시사(8.12)","q":"【Q8 · 판세 (수치 방송직전 재확인!)】 8/ 전당대회 마지막 승부처인 호남과 서울경기 순회경선이 오늘부터 본격적으로 시작됩니다. 지금까지는 투표 결과, 김민석 후보가 46.01%(9만 5821표), 정청래 후보가 44.53%(9만 2735표), 송영길 후보가 9.47%(1만 9715표)로 초박빙 승부를 보이고 있는데요. 두 분은 판세 어떻게 보고 계시는지요?","tags":["8.12","KBS","기탁금","전격시사","청년","호남"],"script":["★ 정말 안타까운 건, 모두가 대통령팔이만 하고 있다는 겁니다. 뒷받침하겠다면서, 정작 대통령께서 밤낮으로 뛰고 계신 미래 의제를 구체적으로 어떻게 뒷받침하겠다는 말은 들리지도 않습니다.","아직도 적통이냐 적자냐 족보 캐기, 과거 복수혈전뿐입니다. 국민은 공감도 관심도 없습니다. 그러니 뽑고 싶은 후보가 없다는 말이 나오고, 당이 대통령 발목을 잡아 지지율까지 끌어내리고 있으니 한탄스럽기 짝이 없습니다.","언제부터 민주당이 일부 강성 지지층 목소리에 흔들리는 정당이었습니까. 침묵하는 다수가 더 많습니다. 그분들의 목소리를 듣는 정당이 되자고, 제가 홍대에서 선언했습니다.","★ 경선 규칙 6개월 전 확정, 유령당원 정리와 결과 100% 공개, 기탁금 폐지와 공영제, 청년 결정권, 당 재정 공개, 그리고 시민의 삶과 링크된 디지털 정당. 민주당이 가야 할 길은 이미 나와 있습니다.","★ ※ 판세 수치(46.01% · 44.53% · 9.47%)는 방송 직전 최신 결과로 재확인"],"quotes":[],"notes":[]},{"no":2711,"media":"전격시사(8.12)","q":"【Q9 · 호남 바닥 민심】 9/ 김보미 의장님은 호남에서 활동하고 계시니 바닥 민심이 어떤지 의견 듣고 싶은데요. 최근 여론조사에서는 김민석 후보가 정청래 후보를 크게 앞서는 걸로 나왔습니다? 어떻게 체감하십니까?","tags":["8.12","KBS","공천","전격시사","호남"],"script":["★ 그야말로 부글부글 끓고 있습니다. 정청래 후보는 당대표 시절 호남표를 얻기 위해 '4무 공천' 사기극을 벌였습니다. 저는 강진에서 그 현장을 몸으로 겪었습니다.","그런데 아무 책임도 지지 않고 연임에 도전하는 것 자체가 호남을 무시하는 일이라고 생각합니다. 제가 이렇게 발언하는 이유는 분명합니다. 지방선거 참패의 책임을 져야 할 당 지도부였기 때문입니다. 민주 정치는 책임 정치입니다.","전당대회 때만 되면 호남팔이 해대는 것도 지겹습니다. 정청래 후보께서 토론회에서 강진 사위라고 홍보하시던데요. 이번 지방선거 공천장 수여식을 강진군에서 할 때, '사위 자식 개자식', '전과 5범 공천한 정 서방, 인자 처갓집 오지 마소' 같은 공천 폭거 규탄 현수막에 상여까지 등장해 난리가 났고, 정문으로 들어가지도 못하셨습니다.","★ 호남팔이 그만하십시오. 제발 정치인들이 책임과 양심을 가졌으면 좋겠습니다."],"quotes":[],"notes":[]},{"no":2712,"media":"전격시사(8.12)","q":"【Q10 · 최고위원 선거】 10/ 최고위원 선거도 굉장히 치열합니다. 지금까지는 최민희 후보가 1등을 유지하고 있고, 이른바 친명 후보가 3명, 친청 후보가 2명입니다. 호남에서 변동이 있을까요? 어떻게 예상하십니까?","tags":["8.12","KBS","전격시사","청년","청년최고위원","호남"],"script":["★ 순위보다 걱정되는 건 선거의 언어입니다. '박쥐'에 '일베'까지 나왔습니다.","★ 민주주의, 공정, 청년, 미래, 세대교체가 없는 5무 정당에 품격까지 사라지면 6무입니다. 전당대회가 콜로세움이 되어서는 안 됩니다."],"quotes":[],"notes":[]},{"no":2713,"media":"전격시사(8.12)","q":"【Q11 · 서울경기 민심 · 2030】 11/ 호남과 서울경기 투표가 하루 차이인데, 서울경기 민심은 어떻게 전망하시는지요? 호남과 비슷하게 갈까요? - 그런데, 지역의 2030 민심과 수도권 2030 민심은 좀 차이가 있다고 보십니까?","tags":["8.12","KBS","전격시사","청년","호남"],"script":["★ 참 신기한 게, 당대표까지 지내신 분이 피해자 코스프레를 하십니다. 하기야 목을 자르겠다느니 무섭게 발언하시는 분도 당대표 하신 분이니 그럴 법도 합니다만, 참 안타깝습니다.","제가 이번 경선에서 뼈저리게 느낀 게 있습니다. 평생 먹을 욕도 먹고 관심도 많이 받았습니다만, 다들 족보 캐고 사진 파묘만 하고 있더라는 겁니다. 제발 사진 파묘 말고 정책 파묘를 했으면 좋겠습니다.","싸우더라도 정책 가지고 싸워야지, 노사모네 아니네부터 돌아가신 분들 이름만 불러대고 있으니, 청년들 눈에는 정치인들이 제정신인가 싶은 겁니다.","★ 정책을 파고들어 정책으로 싸우는 전당대회라면, 서울이든 경기든 호남이든 청년들이 다시 투표장으로 돌아올 겁니다."],"quotes":[],"notes":[]},{"no":2714,"media":"전격시사(8.12)","q":"【Q12 · 갈등 봉합 · 불법당원】 12/ 계속 이야기해왔습니다만, 계파간 경쟁이 심해지면서 전당대회 이후 갈등 봉합에 대한 우려도 있습니다. 신천지 논란, 조국혁신당과 합당 논란 등 불씨가 금방 꺼질 것 같지 않거든요?","tags":["8.12","KBS","전격시사"],"script":["★ 이런 논란으로 시끌시끌한 것 자체가 말이 안 됩니다. 그 동네 살지도 않는 불법당원, 자기가 당원인지도 모르는 유령당원, 이 당 저 당 모두 가입한 이중당원까지 — 불법당원은 불법입니다. 불법은 정리해야지요. 왜 정리하지 않고 묵인하고 덮고 갑니까.","이번 기회에 당원명부를 행안부 자료와 대조해서 불법당원 전수조사를 확실히 해야 합니다. 총선이 금방인데 지금 뭐 하고 있는 겁니까.","★ 쇄신할 부분은 확실하게 쇄신하고 가야 합니다. 그렇지 않으면 민주당에 미래도 없고 답도 없습니다. 망합니다.","★ ※ 신천지 의혹 자체를 물으면 → 돌발카드 ④ (조건부 답변만)"],"quotes":[],"notes":[]},{"no":2715,"media":"전격시사(8.12)","q":"【Q13 · 오늘 TV토론 쟁점】 13/ 오늘 오후 2시 마지막 당대표 TV토론이 예정돼 있습니다. 오늘 토론회 쟁점은 뭐가 될 거라고 보십니까?","tags":["8.12","KBS","전격시사"],"script":["★ 토론이 갈수록 감정적으로 격화되는 게 보입니다. 바닥 민심을 아직도 모른다는 생각이 듭니다.","★ 국민과 당원들이 보고 싶은 건 감정싸움이 아니라 정책 검증입니다. 침묵하는 다수의 목소리를 듣는 토론이 되기를 바랍니다."],"quotes":[],"notes":[]},{"no":2716,"media":"전격시사(8.12)","q":"【Q13-1 · 남은 변수】 - 호남과 서울경기, 사실 약 70% 권리당원이 남아있기 때문에 큰 변동이 일어날 수도 있는 상황인데, 남은 기간 변수가 있다면 어떤 게 있을까요?","tags":["8.12","KBS","전격시사","청년","호남"],"script":["★ 솔직히 얼마나 네거티브가 난무할지 벌써부터 눈살이 찌푸려집니다. 밥그릇 싸움하시는 데 별 기대는 없고요.","승자도 패자도 함께 빛나는 민주당, 민주주의와 공정과 청년이 살아 있는 민주당, 세대교체로 미래를 여는 민주당. 그 민주당을 만드는 데 전국의 계란들이 꿈틀꿈틀 움직이고 있습니다.","★ 끝까지 계란으로 바위 치기, 도전의 역사는 계속될 것입니다."],"quotes":[],"notes":[]},{"no":2717,"media":"전격시사(8.12)","q":"【Q13-2 · 5·18 국정과제 1호】 - 전날 열린 KBC TV토론회에서 송영길 후보가 정청래 후보에게 '국정과제 1호'를 묻자 정 후보는 내란청산이라고 말하면서 공식 국정과제 1호인 5·18헌법전문수록을 답하지 못했습니다. 이에 대해 어떻게 보시는지요?","tags":["5·18","8.12","KBS","전격시사","호남"],"script":["★ 말실수가 아니라 우선순위의 문제라고 봅니다. 5·18 정신의 헌법 전문 수록은 이재명 정부가 국민께 약속한 국정과제 1호이자, 호남에게는 정체성 그 자체입니다.","여당 대표가 되겠다는 분이라면 정부의 1호 약속은 몸에 새기고 있어야지요. 여당 대표의 일은 자기 어젠다를 앞세우는 게 아니라, 정부의 약속을 뒷받침해 완수하는 것입니다.","★ 뭣이 중헌지 아는 정치가 필요합니다. 호남 투표 직전에 호남이 이 장면을 어떻게 받아들일지, 지켜볼 일입니다."],"quotes":[],"notes":[]},{"no":2718,"media":"전격시사(8.12)","q":"【★ 기회되면 할 말 · 재정주권】 [기회되면 할 말] 재정주권 시민행동 공동대표로서 — 앞으로의 계획 (진행자 질문과 무관하게 기회가 올 때)","tags":["8.12","KBS","재정주권","전격시사","청년"],"script":["★ 재정주권 시민행동 공동대표로서 '예산 바로보기' 운동을 하고 있습니다. 저희가 만든 '나라살림 돋보기'는 동네 이름만 치면 전국 243개 지자체와 중앙정부 예산이 3초 만에 나옵니다. 내가 낸 세금이 어디로 가는지 직접 들여다보는 것만큼 확실한 정치 참여는 없습니다.","그런데 정작 정당은 어떻습니까. 울릉군도 재정을 공개하고 정부도 예산서를 다 공개하는데, 국고보조금에 선거보조금까지 받는 정당은 그 돈을 어디에 썼는지 공개하지 않습니다. 밀실이 부패를 만듭니다.","★ 정당의 깜깜이 회계가 투명해지는 그날까지, 청년들과 함께 이 운동을 전국으로 넓혀 가겠습니다."],"quotes":[],"notes":[]},{"no":2719,"media":"전격시사(8.12)","q":"【돌발① · \"그래서 누구를 지지하십니까?\"】 (돌발) 결국 누가 당대표가 되길 바라십니까? 특정 후보를 지지하시는 겁니까?","tags":["8.12","KBS","공천","전격시사"],"script":["★ 저는 특정 후보가 아니라 시스템을 지지합니다. 제 기준은 딱 하나 — 공천혁신을 누가 실제로 해내느냐입니다.","김민석 후보의 공천혁신특위 공약을 환영하는 기자회견을 한 것도, 사람이 아니라 약속을 보고 한 일입니다.","★ 누가 되든, 그 약속이 지켜지는지 끝까지 지켜보고 목소리를 내겠습니다."],"quotes":[],"notes":[]},{"no":2720,"media":"전격시사(8.12)","q":"【돌발② · 공천특위에 제안할 3가지】 (돌발) 공천혁신특위가 실제로 만들어지면, 어떤 제안을 하시겠습니까?","tags":["8.12","KBS","공천","전격시사","청년"],"script":["★ 세 가지입니다. 첫째, 공천 규칙은 선거 6개월 전에 확정하고, '달리 정할 수 있다'는 예외조항을 삭제해야 합니다.","둘째, 유령당원·불법당원·이중당원을 깨끗이 정리하고, 투표율과 후보별 득표수까지 경선 결과를 100% 공개해야 합니다. 그리고 토론과 연설로 실력을 겨루도록 보장해야 합니다.","셋째, 특위 구성이 핵심입니다. 현 시스템의 수혜자, 낡은 운영체계 덕분에 기득권을 쌓아온 정치인은 배제해야 합니다.","★ 특위 위원의 과반수를 낙천자와 청년 당원으로 채워야, 공천혁명이 가능합니다."],"quotes":[],"notes":[]},{"no":2721,"media":"전격시사(8.12)","q":"【돌발③ · 예비경선 공약이 뭐였나】 (돌발) 예비경선 때 내세운 공약은 무엇이었습니까?","tags":["8.12","KBS","기탁금","전격시사","청년"],"script":["★ 홍대에서 선언했습니다. 5대 분야, 25개 약속, 3단계 로드맵입니다.","핵심만 말씀드리면 — 경선 규칙 6개월 전 확정과 결과 100% 공개의 '유리상자 경선', 기탁금 폐지와 선거 공영제, 청년에게 자리가 아니라 예산과 결정권, 정당 재정 공개, 그리고 시민의 삶과 링크된 디지털 정당입니다.","★ 전문은 김보미닷컴에 다 공개되어 있습니다."],"quotes":[],"notes":[]},{"no":2722,"media":"전격시사(8.12)","q":"【돌발④ · 신천지 의혹 (조건부만!)】 (돌발) 신천지 당원 가입 의혹, 어떻게 보십니까?","tags":["8.12","KBS","전격시사"],"script":["★ 의혹이 사실이라면 있을 수 없는 일이고, 반드시 진상을 규명해서 책임을 물어야 합니다.","다만 지금은 의혹 단계입니다. 답은 하나입니다. 당원명부 전수조사로 당이 스스로 투명하게 밝히면 됩니다.","★ 덮으면 의혹은 커지고, 공개하면 끝납니다.","★ ※ 가드레일: 단정 금지 — 반드시 '사실이라면' 조건부 유지"],"quotes":[],"notes":[]},{"no":2723,"media":"전격시사(8.12)","q":"【돌발⑤ · 송영길 재판 관련】 (돌발) 송영길 후보의 재판(돈봉투 사건) 문제는 어떻게 보십니까?","tags":["8.12","KBS","전격시사"],"script":["★ 재판이 진행 중인 사안이라 유무죄를 예단하지 않겠습니다.","★ 다만 정당이 사법 리스크에 대해 국민 눈높이에 맞는 기준과 절차를 세워야 한다는 것, 그게 핵심이라고 봅니다.","★ ※ 가드레일: 절차 프레임만 — 개인 공격·유무죄 판단 금지"],"quotes":[],"notes":[]},{"no":2724,"media":"전격시사(8.12)","q":"【돌발⑥ · 향후 계획 · 총선 출마?】 (돌발) 전당대회가 끝나면 무엇을 하실 겁니까? 총선에 출마하십니까?","tags":["8.12","KBS","공천","재정주권","전격시사","청년"],"script":["★ 우선 재정주권 시민행동 공동대표로 '예산 바로보기' 운동을 전국으로 넓히겠습니다. 그리고 청년들과 함께, 공천혁신이 실제로 완수되는지 끝까지 감시하겠습니다.","★ 총선은 지금 말할 단계가 아닙니다. 지금은 당을 바꾸는 일이 먼저입니다."],"quotes":[],"notes":[]},{"no":2725,"media":"전격시사(8.12)","q":"【돌발⑦ · 이재명 정부 평가】 (돌발) 이재명 대통령의 국정운영은 어떻게 평가하십니까?","tags":["8.12","KBS","전격시사"],"script":["★ 대통령께서는 밤낮없이 미래 의제를 뛰고 계십니다. 문제는 당입니다. 과거 싸움으로 대통령 발목을 잡아 지지율을 끌어내리고 있지 않습니까.","★ 여당이 할 일은 대통령팔이가 아니라, 정부의 약속을 정책으로 뒷받침해 완수하는 것입니다."],"quotes":[],"notes":[]},{"no":2726,"media":"전격시사(8.12)","q":"【돌발⑧ · 군인권 쪽 질문이 오면】 (돌발) 군인권 관련 질문이 김보미에게 넘어올 때 — 짧게 받고 넘기기","tags":["8.12","KBS","군인권","전격시사","청년"],"script":["★ 군인권 문제는 옆에 계신 김형남 국장님께서 훨씬 정확하게 말씀해 주실 겁니다.","★ 저는 한 가지만 보태겠습니다. 군 문제든 청년 문제든, 당사자의 목소리가 정책이 되는 구조 — 그게 바뀌어야 한다는 것입니다."],"quotes":[],"notes":[]},{"no":2727,"media":"전격시사(8.12)","q":"1. 당대표 경선 과정, 어떤 마음으로 뛰었고 무엇이 남았나. 소회를 듣고 싶다.","tags":["8.12","KBS","기탁금","전격시사","청년"],"script":["★ 화가 나서 나왔습니다. 민주당은 지방선거에서 참패했는데 반성도 사과도 없었습니다. 높으신 분들은 죽었다 깨어나도 모르는 바닥 민심을 전하러, 국민 대신 회초리를 들고 나왔습니다. 출마선언에서 저는 민주당에 다섯 가지가 없다고 했습니다. 민주주의, 공정, 청년, 미래, 세대교체. 5무(無) 정당이라고요. 그런데 이번 경선이 그 다섯 가지 없음을 따로 설명할 필요도 없이 총망라해서 보여줬습니다. 등록을 마친 뒤에야 받아 본 경선 규칙, 기탁금을 내고도 토론회 한 번 없이 청중 없는 스튜디오에서 7분 동영상 한 번 찍은 것이 전부였던 '동영상 촬영회', 그리고 지금까지도 알 수 없는 제 득표수. 민주당의 민낯을 어떤 말보다 정확하게 보여준 것이 이번 경선이었습니다.","그런데 남은 것은 절망이 아니라 사람입니다. 조직도 계파도 없는 세 명짜리 캠프가 카페와 식당을 전전하며 노트북 하나로 회의했는데, 나흘 동안 107명의 국민이 1,909만 원을 후원해 주셨습니다. 실제로 짱돌을 들었던 민주화운동 세대 선배님이 전화를 주셔서 '네 말이 맞다, 우리 세대가 미안하다'고 하셨습니다. 저는 이번 경선에서 확인했습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들이 계시다는 것, 침묵하는 다수가 살아 계시다는 것을요. 계란은 깨졌지만, 바위에 낸 금은 남아 있습니다. 그 금을 보고 다음 계란이, 그다음 계란이 던져질 것입니다."],"quotes":[],"notes":[]},{"no":2728,"media":"전격시사(8.12)","q":"2. 당대표 선출 결과를 청년 정치인으로서 어떻게 평가하나. 새 지도부를 어떻게 전망하나. (8.17 결과 확정 후 전화 보완)","tags":["8.12","KBS","공천","전격시사","청년","청년최고위원"],"script":["★ 누가 당선됐느냐로 저의 평가가 달라지지는 않습니다. 저는 경선 기간 내내 특정 후보가 아니라 제도를 지지한다고 말해 왔고, 그 기준은 지금도 같습니다. 새 지도부를 평가할 시험지는 이미 나와 있습니다. 첫째, 경선과 공천의 데이터를 유리상자처럼 100% 공개하는가. 둘째, 청년에게 자리가 아니라 예산과 결정권을 주는가 — 전당대회준비위가 만장일치로 의결하고도 최고위에서 부결된 선출직 청년최고위원제를 당헌에 새기는가. 셋째, 약속한 공천혁신을 연말까지 당헌·당규로 만드는가. 지금까지 민주당 지도부의 공천개혁 약속은 번번이 공수표로 끝났습니다. 이번에도 공수표라면 가장 먼저, 가장 크게 비판하는 사람이 저일 것입니다. 지원하되, 끝까지 감시하겠습니다.","(※ 8.17 이후 보완 포인트 — 당선자 확정 시: 득표율·2순위 반영 여부와 함께, 당선 수락 연설에서 청년·공천혁신·데이터 공개가 언급됐는지를 기준으로 코멘트. 초박빙 승부였던 만큼 '이긴 쪽의 정통성과 진 쪽의 승복 모두 데이터 공개에서 나온다'는 워딩 유지.)"],"quotes":[],"notes":[]},{"no":2729,"media":"전격시사(8.12)","q":"3. 경선 과정에서 몸으로 느낀 민주당의 문제는 무엇이었나.","tags":["8.12","KBS","공천","기탁금","전격시사","청년"],"script":["★ 한마디로, 규칙을 만든 사람들의 정당이 됐다는 것입니다. 민주주의에는 잔인한 역설이 있습니다. 권력이 없을 때는 모두가 민주주의자인데, 권력을 오래 쥐면 자신도 모르게 권력을 지키는 사람이 됩니다. 그리고 권력을 지키는 가장 손쉬운 방법이 규칙을 쥐는 것입니다. 이럴 땐 헌법처럼 지키고, 저럴 땐 예외를 만들고, 필요하면 하루 전에 바꿉니다. 저는 후보 등록을 마치고 나서야 경선 규칙을 받았습니다. 당헌에는 '달리 정할 수 있다'는 단서조항이 곳곳에 숨어 있어서, 사람에 따라 지역에 따라 규칙이 달라집니다. 저는 이걸 고무줄 규칙이라고 부릅니다. 다르게 적용되는 규칙은 규칙이 아니라 민주주의를 죽이는 흉기입니다.","청년에게 그 구조는 세 개의 벽으로 나타납니다. 돈의 벽, 정보의 벽, 족보의 벽. 기탁금 구하느라 반나절을 쓰고 서울에 잘 곳이 없어 렌터카에서 쪽잠을 자는 것이 돈의 벽이고, 규칙과 일정을 기득권만 먼저 아는 것이 정보의 벽이고, 계파가 없으면 유령 취급을 받다가 사진 한 장 찍히면 '누구 파냐'는 파묘부터 당하는 것이 족보의 벽입니다. 저는 그 마지막 것을 흥신소 정치라고 부릅니다. 저는 추미애 대표 때 공천받고, 이낙연 대표 때 억울하게 제명당했고, 이재명 대표 때 복당한 사람입니다. 회사로 치면 사장이 세 번 바뀐 건데, 도대체 저는 무슨 계파입니까. 그런데도 족보에 끼워주지도 않으면서 족보 검증은 제일 먼저 받는 것, 그것이 청년이 마주하는 민주당입니다."],"quotes":[],"notes":[]},{"no":2730,"media":"전격시사(8.12)","q":"4. 민주당 지지자였던 2030은 왜 민주당을 떠났나.","tags":["8.12","KBS","기탁금","전격시사","청년","청년최고위원"],"script":["★ 청년이 민주당을 떠난 게 아닙니다. 민주당이 먼저 청년을 떠났습니다. 이 순서를 바로잡는 데서 모든 답이 시작됩니다. 원인은 정책 부족이 아니라 공정의 상실입니다. 공정에 가장 민감한 세대에게 민주당은 가장 불공정한 모습을 보여 왔습니다. 영입할 때는 미래라고 부르고, 규칙을 정하는 방에서는 지웁니다. 기자회견 때는 병풍처럼 세워 놓고 사진을 찍고 돌려보냅니다. 청년 정치를 확대하겠다면서 청년최고위원제를 부결시키고, 청년에게 기회를 준다면서 기탁금을 네 배로 올렸습니다. 말과 행동의 거리 — SNS 세대는 그 간격을 실시간으로 확인합니다. 청년들은 몰라서 떠나는 게 아니라 너무 잘 알아서 떠나는 겁니다.","지금 18~29살의 절반 가까이가 무당층입니다. 저는 이걸 보수화라고 부르는 것에도 동의하지 않습니다. 청년들은 보수화된 게 아니라 탈민주당화된 것입니다. 제 또래 친구들은 민주당 이야기가 나오면 화를 내지 않습니다. 관심을 꺼 버립니다. 분노보다 무서운 것이 무관심입니다. 지금 청년 세대에서 회귀물 콘텐츠가 유행하는 이유를 정치가 무겁게 읽어야 합니다. 다시 태어나야만 인생을 바꿀 수 있다고 느끼는 세대라는 뜻입니다. 이번 생은 망했다고 말하는 세대에게, 정치는 한 번도 '네 잘못이 아니다'라고 말해 준 적이 없습니다. 저는 그 말을 하러 나왔습니다."],"quotes":[],"notes":[]},{"no":2731,"media":"전격시사(8.12)","q":"5. 민주당의 세대교체는 왜 필요한가. '가치와 노선 없는 세대교체는 위험하다'는 반론에는 뭐라고 답하나.","tags":["8.12","KBS","공천","전격시사","청년"],"script":["★ 그 반론에 절반은 동의합니다. 저도 얼굴만 바꾸는 세대교체에는 반대합니다. 낡은 운영체제 위에 새 얼굴만 얹는 것은 혁신이 아니라 도색입니다. 제가 말하는 세대교체는 사람 교체가 아니라 운영체제 교체이고, 의제 교체입니다. 86세대의 시대정신은 민주화였고 그분들은 그 소임을 훌륭히 해냈습니다. 저는 선배님들을 진심으로 존경합니다. 제가 이렇게 비판할 자유도 그분들이 만들어 주신 민주주의 덕분입니다. 그러나 민주화운동이 대한민국 정치를 40~50년 독점할 권리가 될 수는 없습니다. 지금 국민의 삶을 짓누르는 과제는 AI 전환, 지방소멸, 양극화, 청년의 일자리와 주거입니다. 과제가 바뀌면, 그 과제를 온몸으로 살아 낸 세대가 테이블에 앉아야 합니다.","'청년이 준비가 안 됐다'는 말에는 이렇게 되묻고 싶습니다. 30여 년 전 김대중 대통령이 서른두 살 김민석을 발탁했을 때, 준비가 완료된 사람을 뽑았습니까? 가치와 노선은 검증의 링 위에서 길러지는 것이지, 링에 들여보내지도 않고 요구할 수 있는 것이 아닙니다. 검증은 걸러내기 전에 해야 검증이고, 걸러낸 뒤에 하면 홍보입니다. 그리고 세대교체는 양심에 맡길 일이 아니라 제도로 해야 합니다. 솔직히, 제가 나가시란다고 나가시겠습니까. 동일 지역구 3선 초과 공천 금지를 당헌에 새기고 공정한 검증의 링만 만들면, 세대교체는 강요하지 않아도 저절로 이루어집니다. 퇴출이 아니라 영입입니다. 3선이 넘은 지역구가 열려야 새 인재가 들어올 자리가 생깁니다. 도전하던 사람들이 도전받는 자리에 서더니 도전 자체를 막고 있는 이 도돌이표를 끊자는 것입니다. 민주주의는 권력을 얻는 것으로 끝나지 않습니다. 다음 세대에게 넘겨줄 때 완성됩니다."],"quotes":[],"notes":[]},{"no":2732,"media":"전격시사(8.12)","q":"6. 민주당이 변해야 할 길은 무엇인가.","tags":["8.12","KBS","기탁금","전격시사","청년"],"script":["★ 부분 수리로는 안 됩니다. 재창당 수준의 대전환이어야 합니다. 저는 예비경선 결과 발표 전날, 여의도가 아니라 청년의 거리 홍대에서 '민주당 대전환 선언'을 발표했습니다. 떨어질 수 있다는 걸 알면서도 결과와 상관없는 약속을 드린 것은, 그 선언이 저의 선거운동이 아니라 길을 잃은 민주당이 가야 할 방향이라고 믿었기 때문입니다. 핵심은 네 가지입니다. 첫째, 규칙을 만든 사람들의 정당을 끝내는 것 — 경선 규칙 6개월 전 확정, '달리 정할 수 있다' 단서조항 전부 삭제, 경선 결과 100% 공개. 둘째, 가짜 당원주권의 폐기 — 당원명부를 행정안전부 주민등록과 대조해 그 동네 살지도 않는 불법당원, 자기가 당원인지도 모르는 유령당원을 정리하는 것. 휴대전화가 당원일 수는 없습니다. 셋째, 돈의 장벽 철거 — 기탁금 폐지와 당직선거 공영제. 정치는 돈이 아니라 비전과 실력으로 경쟁해야 합니다. 넷째, 검찰 저격수를 넘어 국민 삶의 설계자로 — 과거에 복수하는 '복수혈전 민주당'이 아니라 미래의 언어로 일하는 '미래선도 민주당'입니다.","그리고 이 모든 것을 관통하는 것이 디지털 정당입니다. 오해하지 마십시오. 온라인 투표하는 정당, 앱 만드는 정당이 아닙니다. 자본은 이미 시민을 데이터로 정밀하게 읽는데, 정치는 아직도 시민을 동원 수단으로 읽습니다. '목소리를 내지 않는 사람에게는 권리가 없다'는 낡은 문법 속에서 고함치는 소수가 이기고 조용히 살아가는 다수가 졌습니다. 광장에 나올 시간이 없는 사람, 하루 10분밖에 낼 수 없는 사람의 요구가 데이터로 모여 정책이 되는 정당. 중앙 서버에 로그인하는 정당이 아니라 시민의 삶과 링크된 정당. 그것이 결집한 소수가 침묵하는 다수를 삼키는 팬덤정치의 유일한 해독제라고 저는 믿습니다."],"quotes":[],"notes":[]},{"no":2733,"media":"전격시사(8.12)","q":"7. 민주당에서 청년정치란 무엇인가. 앞으로 어떤 정치를 하려 하나.","tags":["8.12","KBS","공천","재정주권","전격시사","청년"],"script":["★ 지금까지 민주당에서 청년은 주주가 아니라 병풍이었습니다. 선거철마다 동원되고 이용되지만 실질적 권한은 하나도 없었습니다. 누군가를 공격할 때 꺼내 쓰는 도구, 성명서 발표할 때 뒤에 일렬횡대로 세우는 배경. 저는 그 병풍을 주주로 바꾸는 것이 청년정치라고 생각합니다. 마이크가 아니라 예산을, 자리가 아니라 결정권을 주는 것입니다. 시혜는 회수되지만 당헌에 새긴 결정권은 회수되지 않습니다. 그래서 저는 새 지도부에 당헌에 근거를 둔 '민주당 청년당'을 제안합니다. 청년 당원이 자동 가입하고 지도부를 직접 뽑고 독자 재정권과 공천 추천권까지 갖는 준자치 기구 — 독일 사민당의 유소스, 영국 노동당의 영 레이버처럼요. 청년이 청년의 정책을 스스로 결정하고, 계파가 아니라 숫자로 자기 존재를 증명할 수 있게 되는 순간, 청년은 더 이상 줄을 서지 않아도 됩니다.","저의 다음 걸음을 자리로 말씀드리지는 않겠습니다. 링이 열리면 언제든 다시 오르겠습니다. 당장은 세 가지입니다. 공천특위 5대 요구가 연말까지 당헌·당규가 되는지 감시하는 일, 재정주권 시민행동 공동대표로서 우리 동네 예산부터 중앙당의 깜깜이 회계까지 돈의 흐름을 투명하게 만드는 예산 바로보기 운동, 그리고 전국 각지에서 이름 없이 지역 기반을 다지는 청년 정치인들 — 전국의 김보미들을 찾아 공동전선을 만드는 일입니다. 이번에 각개약진하다 각개격파당한 교훈을 배웠으니, 다음에는 함께 갑니다. 민주당의 역사는 김대중, 노무현의 계란으로 바위 치기의 역사입니다. 서슬 퍼런 군사독재에 도전한 김대중도, 지지율 2%로 시작한 노무현도 모두 계란이었습니다. 지금 전당대회에서는 누가 적통이니 적자니 족보 캐기가 한창입니다만, 민주당의 진짜 적통은 혈통도 인맥도 아니고 그 도전정신입니다. 저는 그 적통을 잇겠습니다. 바위는 40년 비를 맞아 허물어지기 직전이고, 계란은 생명을 품고 있습니다. 훗날 어느 청년 정치인이 '김보미가 먼저 부딪혀 준 덕에 내 길이 조금 덜 아팠다'고 말해 준다면, 그것으로 충분합니다."],"quotes":[],"notes":[]},{"no":2734,"media":"전격시사(8.12)","q":"8. [추가] 재정주권 시민행동 공동대표로서, 앞으로의 계획은. 정당도 예산을 공개해야 한다는 문제의식은.","tags":["8.12","KBS","재정주권","전격시사","청년"],"script":["★ 재정주권 시민행동 공동대표로서 '예산 바로보기' 운동을 하고 있습니다. 저희가 만든 '나라살림 돋보기'는 동네 이름만 치면 전국 243개 지자체와 중앙정부 예산이 3초 만에 나옵니다. 내가 낸 세금이 어디로 가는지 직접 들여다보는 것만큼 확실한 정치 참여이자 정치 교육은 없습니다. 저는 강진군의원 시절 업무추진비를 전면 공개하고 '김보미365'로 의정활동을 낱낱이 기록했습니다. 돈의 흐름이 보이는 순간 정치는 남의 일이 아니게 됩니다.","그런데 정작 정당은 어떻습니까. 울릉군도 재정을 공개하고 정부도 예산서를 다 공개하는데, 국고보조금에 선거보조금까지 받는 정당은 그 돈을 어디에 썼는지, 어떤 업체와 계약했는지 공개하지 않습니다. 대한민국에서 가장 낙후된 조직입니다. 밀실이 부패를 만듭니다. 당 재정부터 10원짜리 하나까지 공개하라는 것이 제 홍대선언 12번째 약속이었습니다. 정당의 깜깜이 회계가 투명해지는 그날까지, 청년들과 함께 이 운동을 전국으로 넓혀 가겠습니다. 재정이 투명한 정당이 국민의 신뢰를 얻습니다."],"quotes":[],"notes":[]},{"no":3001,"media":"정치시그널","q":"Q1. 요즘 어떻게 지내시나요?","tags":["시그널픽","재정주권","근황","정당회계공개"],"quotes":[],"script":["★ (인사) 안녕하십니까. 민주당의 적통은 혈통도 계파도 아닌, 계란으로 바위를 쳤던 김대중, 노무현의 도전 정신입니다. 그 도전을 잇는 강진 시골쥐, 김보미입니다.","예비경선을 마치고, 재정주권시민행동 공동대표로 바쁘게 지내고 있습니다. 국민이 우리 동네 예산부터 나라 살림까지, 세금이 제대로 쓰이는지 직접 들여다보는 재정 감시 운동입니다. 너무 당연한 일이라 아무도 관심을 주지 않는 이야기, 정당의 돈 문제를 붙들고 있습니다.","울릉군도 재정을 공개하고 정부도 예산서를 다 공개하는데, 국고보조금에 선거보조금까지 받는 정당은 그 돈을 어디에 썼는지 공개하지 않습니다.","당원이 낸 소중한 당비뿐 아니라 국민 혈세가 들어가는데 깜깜이입니다. 밀실이 부패를 만듭니다.","★ 여야를 떠나 10원짜리 하나까지 공개하는 것, 이것이 모든 정당이 풀어야 할 숙제입니다. 내가 낸 세금이 어디로 가는지 직접 들여다보는 것만큼 확실한 정치 참여는 없습니다.","★ 시청자 여러분의 관심이 이 낡은 관행을 바꾸는 힘입니다. 재정주권시민행동, 많은 관심 부탁드립니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3002,"media":"정치시그널","q":"Q2. 당대표 예비경선에 직접 출마하셨습니다. 직접 뛰어보니 어떠셨습니까? 어떤 점이 가장 어려우셨나요?","tags":["시그널픽","예비경선","렌터카쪽잠","KDLC"],"quotes":[],"script":["예비경선이라고 부르기도 민망할 만큼 짧은 기간이었습니다. 기울어진 운동장 정도가 아니라, 운동장 입장 자체가 불가능한 룰이었습니다.","기탁금을 마련하기도 힘들었고, 사무실도 없으니 렌터카에서 노트북 들고 쪽잠을 자며 다녔습니다. 그래도 저는 운이 좋은 사람입니다.","★ 박승원 광명시장님께서 기회를 주신 덕분에 KDLC 정견발표에서 7분의 첫 무대에 설 수 있었고, 그 연설 덕분에 지금 이 자리에서 청년들의 목소리를 전할 수 있는 것 아니겠습니까. 저한테 사고 치지 말라고 하시는 분들도 계십니다.","그런데 저는 높으신 분들 우쭈쭈에 말 잘 듣는 착한 똘마니가 되려고 정치를 시작한 것이 아닙니다. 줄은 변하지 않는 국민에게 서는 것이 답입니다.","★ 국민의 목소리를 대신 전달하는 것, 그것이 제가 말하는 '할 말'입니다. 이 자리를 빌려, 당락의 유불리를 떠나 가치와 미래에 투표해 주신 분들, 자신의 젊은 날을 회상하며 계란으로 바위 치는 청년의 도전에 손 내밀어 주신 진짜 어른들, 선배님들, 후배님들께 진심으로 감사드립니다.","열심히 살겠습니다!"],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3003,"media":"정치시그널","q":"Q3. 청년, 젊은 후보들이 탈락한 것을 두고 \"개인의 실패가 아니라 구조의 실패\"라고 직격하셨는데, 어떤 구조적 문제가 있다고 보셨나요?","tags":["시그널픽","구조의실패","5무정당"],"quotes":[],"script":["★ 기득권의 이익만 지키도록 설계된 구조였습니다, 이번 예비경선은. 규칙도 안 알려주고, 말할 기회도 안 주고, 결과도 안 알려주는 경선에 어느 누가 감히 낄 수 있겠습니까.","등록을 마친 뒤에야 경선 규칙을 받아 봤습니다. 기탁금은 네 배가 올랐는데, 그 돈을 내고도 토론회 한 번 없이 동영상 한 번 찍은 것이 전부였습니다.","그리고 저는 지금까지도 제가 몇 표를 받았는지 모릅니다. 저는 출마선언에서 민주당에 민주주의, 공정, 청년, 미래, 세대교체 다섯 가지가 없다고, 5무 정당이라고 외쳤습니다.","★ 지난 지방선거 경선의 불공정을 겪은 당사자로서 한 말인데, 이번에는 지방선거를 들먹일 필요도 없었습니다. 이번 예비경선 자체가 그 민낯이었습니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3004,"media":"정치시그널","q":"Q4. 민주당이 청년을 강조해왔지만, 청년최고위원제 도입은 무산됐습니다. 이 점은 굉장히 아쉬우실 것 같아요?","tags":["시그널픽","청년최고위원","청년강퇴정당"],"quotes":[],"script":["★ 정말 아쉬웠습니다. 청년에게는 다시없는 기회였는데요.","★ 말로는 청년, 청년을 외치면서 정작 청년은 입장 불가, 청년 강퇴 정당입니다. 이러니 민주당이 내로남불 위선 정당이라는 소리를 듣는 것입니다.","전준위, 전당대회준비위원회가 만장일치로 의결한 제도를 일주일 만에 최고위원회가 부결시켰습니다. 선출직과 지명직은 천지 차이입니다.","왜 청년에게 기회를 주지 않고 목줄만 채우려고 합니까. 그래서 제 공약이 청년최고위원을 당연히 선출직으로 당헌에 박고, 당 청년위원회를 청년정책 최고 의결기구로 격상하고, 청년 예산 결정권을 보장하고, 기탁금을 폐지해 당직선거 공영제를 도입하고, 청년취업보장제를 당 핵심 정책으로 채택하는 것이었습니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3005,"media":"정치시그널","q":"Q5. \"AI 3대 강국을 향해야 할 나라에서 화염병과 짱돌을 들던 세대가 아직도 주축이어야 하느냐\"라고 해서 화제였는데요. 민주당은 여전히 그 세대가 주축인 것 같다고 느끼시나요?","tags":["시그널픽","세대교체","686","화염병짱돌"],"quotes":[],"script":["★ 네, 안타깝지만 그렇습니다. 세대교체는 시대정신입니다.","제 말에 686 선배님들께서 많이 긁히셨다고 들었습니다. 정치하시면서 기분 나쁘게 들으실 일이 아닙니다.","제가 목이 터져라 외친 말은, 30년 전 386이던 청년들이 기득권을 향해 외쳤던 바로 그 말입니다. 젊은 날의 그 정신은 어디로 갔습니까.","★ 김대중 대통령이 선배님들께 기회를 주었듯, 이제 여러분이 청년들에게 목소리 낼 기회를 주십시오. 받았던 기회를 돌려주는 것, 그것이 세대교체입니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3006,"media":"정치시그널","q":"Q6. 김민석 대표 체제가 들어선 지 일주일 정도 지났는데, 어떻게 평가하시나요?","tags":["시그널픽","김민석체제","4대혁신플랜"],"quotes":[],"script":["★ 쉬지 않고 일하는 길만이 민주당이 사는 길입니다. 무엇보다","제가 예비경선 기간 청년들의 목소리를 모아 목이 터져라 외쳤던 공약들 중 경선토론 의무화, 청년최고위원 보장, 청년 예산 자율권이 김민석 대표의 4대 혁신 플랜에 담겼습니다. 저는 이것을 청년들의 성과라고 생각합니다.","다만 말뿐인지 보여주기식인지는 이제부터입니다. 남은 약속들, 기탁금 폐지와 당직선거 공영제, 경선 규칙 6개월 전 확정, 불법당원 명부 정리까지.","★ 당원의 한 사람으로서 끝까지, 될 때까지 지켜보고 목소리를 내겠습니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3007,"media":"정치시그널","q":"Q7. 여당 지지율이 떨어졌습니다. 지난주보다 민주당 지지율 6%p 하락, 국민의힘과 오차범위 내로 격차가 좁혀졌습니다. 전당대회 후 컨벤션 효과 실종, 당내 분열 이후 지지층 회복이 안 되고 있는 건가요?","tags":["시그널픽","민주당지지율","컨벤션효과","청년의공간","백낙청유시민","촛불"],"quotes":[],"script":["★ 뼈아프게 받아들입니다. 컨벤션 효과는 감동에서 나옵니다. 이번 전당대회가 국민께 감동을 드리지 못했다는 뜻이니, 반성부터 하는 것이 맞습니다.","전당대회 결과를 두고 백낙청 교수님과 유시민 작가님의 평가가 엇갈리지 않았습니까.","★ 저는 백낙청 교수님의 문제의식에 깊이 공감합니다. 민주당이 특정 계파, 386 엘리트의 정당이 되어서는 국민의 지지를 받을 수 없습니다.","촛불을 들었던 시민에는 시민단체만 있는 것이 아닙니다. 평범한 청년과 국민들, 호남의 발전을 바라는 호남인들의 목소리가 함께 있습니다.","★ 다만 유시민 작가님처럼 결과를 하나의 답으로 규정하고 단정하는 방식은 안 된다고 생각합니다.","★ 이번 전당대회는 정작 우리 청년들의 이야기가 없었던 선거였습니다. 민주당에 청년들의 공간을 만드는 것이 민주당의 숙제입니다. 회복의 길은 하나, 민생의 성과로 증명하는 것입니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3008,"media":"정치시그널","q":"Q8. 이재명 대통령의 국정 지지율이 취임 후 처음으로 30%대 후반을 기록했다는 여론조사 결과가 나왔습니다. 최근 유시민 작가가 \"3자도 곧 나온다\"고 예견한 대로 된 건가요?","tags":["시그널픽","대통령지지율","유시민","민생","당정협력"],"quotes":[],"script":["★ 예견대로 됐느냐고 물으신다면, 저는 지지율을 하나의 답으로 규정하고 단정하는 방식은 안 된다고 생각합니다. 답은 민생에 있습니다.","현장의 목소리에서 답을 찾아야 합니다. 부동산만 해도 그렇습니다.","집값과 세제 논쟁보다, 지금 청년들의 불안을 해소할 실질적인 지원 대책이 먼저입니다. 이 일은 대통령 혼자서는 못 합니다.","이제 김민석 지도부가 정부를 뒷받침하겠다고 나섰으니, 당정이 한 몸으로 민생에서 성과를 내면 지지율은 오르지 않겠습니까. 그러려면 더 노력해야 합니다.","★ 청년에게 필요한 것은 열심히 하면 취업할 수 있고 실패해도 다시 시작할 수 있다는 예측 가능한 믿음입니다. 그 믿음이 생기면 지지율은 따라옵니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3009,"media":"정치시그널","q":"Q9. \"2030이 민주당을 떠난 게 아니라 민주당이 먼저 떠났다\"고 말씀하셨는데, 지금 2030이 민주당에 등을 돌린 가장 큰 이유는 무엇이라고 보십니까?","tags":["시그널픽","2030이탈","불공정","무당층"],"quotes":[],"script":["★ 불공정이죠. 청년이 민주당을 떠난 게 아니라 민주당이 먼저 청년을 버렸습니다.","선거철에 청년을 앞줄에 세워 사진 찍고, 선거가 끝나면 돌려보내는 일을 반복해 놓고 청년이 떠난다고 걱정합니다. 청년에게는 원칙을 들이대고 기득권에게는 특혜를 주는 이중잣대에 2030은 완전히 질렸습니다.","지금 18세에서 29세의 절반 가까이가 무당층입니다. 어떤 정당도 내 삶에 답하지 않았다고 생각하는 것입니다.","분노보다 무서운 것이 무관심입니다.","★ 청년들은 몰라서 떠나는 것이 아니라 너무 잘 알아서 떠나는 것입니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3010,"media":"정치시그널","q":"Q10. 집을 사기는 어렵고 전월세 부담은 큰 상황에서, 최근 정부·여당의 부동산 정책이 청년들에게는 어떤 메시지로 받아들여지고 있다고 보십니까?","tags":["시그널픽","부동산","세입자대책"],"quotes":[],"script":["집값을 잡겠다는 정부의 의도는 알겠고 공감합니다. 정책 아이디어도 다양할수록 좋습니다.","★ 문제는 그 과정에서 피해를 보는 청년에 대한 대책이 빠졌다는 것입니다. 지금 서울 부동산은 총체적 불만 상태입니다.","집 가진 분들은 보유세가 올라 불만이고, 서울 시민의 절반인 세입자들은 전월세가 뛰어 불만입니다. 다주택자는 늘어난 세 부담을 세입자에게 넘기고, 1주택자는 실거주 요건 때문에 세놓던 집에 들어가면서 임대 물량이 줄어 전월세가 더 오르는 구조입니다.","그 이중고의 맨 앞줄에, 열에 여덟이 세입자인 청년이 서 있습니다. 용산공원 같은 장기 공급은 빨라야 7년, 길면 15년 걸립니다.","그런데 전월세는 당장 내년, 내후년이 고비라는 전망이 나오고, 재개발 철거와 이사까지 몰린다고 합니다. 집값 대책만큼, 아니 지금은 그보다","★ 더, 세입자를 지키는 단기 대책이 시급합니다. 세입자 대책이 곧 청년 대책입니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3011,"media":"정치시그널","q":"Q11. 황희 의원으로부터 촉발된 폐버스 논란이 터졌을 때, 의장님 생각은 어땠나요?","tags":["시그널픽","폐버스","결정테이블"],"quotes":[],"script":["★ 본인들은 넓은 집에 살면서 청년에게는 폐버스를 던져주니 분노하는 것 아니겠습니까. 땡볕에 걸어보지 않은 사람은 그늘길 알려주는 앱 같은 정책을 만들지 못합니다.","★ 청년이 결정 테이블에 없으니 청년의 삶이 설계에서 빠지는 것입니다. 청년이 결정 테이블에 앉아야 이런 일이 되풀이되지 않습니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3012,"media":"정치시그널","q":"Q12. ISA 개편 논란을 두고 청년층에서 '정부 정책까지 오락가락한다'는 불만이 나왔습니다. 민주당이 청년에 대한 감수성이 떨어진다는 비판은 어떻게 생각하십니까?","tags":["시그널픽","ISA","청년감수성","사진말고권한"],"quotes":[],"script":["★ 솔직히 저도 ISA 계좌가 없습니다. 당장 먹고살기 바쁜 청년 중에 이 계좌에 넣을 여윳돈이 있는 사람이 얼마나 되겠습니까.","그런데 그 계좌마저 안정된 고소득자만 한도를 다 쓰는 구조로 바꾸려 했습니다.","계좌가 있는 청년은 혜택을 뺏겨서 화가 나고, 계좌가 없는 청년은 말로는 청년을 외치면서 있는 혜택마저 줄이는 모습에 화가 나는 것입니다. 다행인 것은 우기지 않았다는 점입니다.","아니다 싶으니 대통령이 빠르게 인정하고 직접 바로잡았습니다.","하지만 이런 소동이 되풀이되지 않으려면 구조를 바꿔야 합니다. 그래서 저는 당 청년위원회를 청년정책 최고 의결기구로 격상하고 청년 예산 결정권을 보장하라고 요구해 왔습니다.","★ 정부에도 흩어진 청년정책을 총괄할 컨트롤타워, 대통령 직속 청년위원회가 필요합니다. 행사 포토타임에 병풍으로 세우지 말고, 사진 말고 권한을 줘야 합니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3013,"media":"정치시그널","q":"Q13. 이번 당대표 도전은 끝났지만 앞으로도 민주당 안에서 역할을 하실 텐데요. 앞으로 민주당이 어떤 정당으로 바뀌어야 한다고 생각하십니까?","tags":["시그널픽","청년정당","전국정당","기본3원칙"],"quotes":[],"script":["★ 청년 정당, 새로운 세대와 함께하는 정당이 되어야 합니다. 그것이 첫 번째입니다.","그리고 투쟁하는 민주당에서 문제를 해결하는 민주당으로, 강성 지지층만 바라보는 민주당에서 국민 전체를 바라보는 민주당으로, 호남에 기대는 민주당에서 영남의 마음까지 얻는 전국정당으로 가야 합니다. 당이 국민을 지키면 국민이 대통령을 지켜줍니다.","★ 그러려면 기본부터 지켜야 합니다. 투명해야 하고, 공개해야 하고, 공정한 룰을 지켜야 합니다.","기본인데, 지금 민주당은 그 기본이 안 되고 있습니다. 처음에 말씀드린 정당의 돈 문제부터, 기본을 지키는 민주당으로 바뀌어야 합니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3014,"media":"정치시그널","q":"Q14. 본인은 어떤 정치인이 되고 싶으십니까?","tags":["시그널픽","킵고잉","장인정신"],"quotes":[],"script":["★ 뱉은 말에 책임지는 정치인이 되고 싶습니다. 나이도 어린 것이, 어디 여자가.","이런 말을 들으며 도시도 아닌 농촌에서 13년째 정치했습니다. 탈탈 털렸는데 먼지 한 톨 안 나왔습니다.","★ 앞으로도 꺾이지 않는 장인정신으로, 오직 국민 눈치만 보며 예비경선 기간 외쳤던 약속들이 지켜질 때까지 청년들의 목소리를 끝까지 외치겠습니다. 시골쥐 김보미, 더 깡깡한 마음으로 킵고잉하겠습니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3015,"media":"정치시그널","q":"[돌발 1] 다음 선거에 출마하나?","tags":["시그널픽","돌발대비","출마"],"quotes":[],"script":["★ 당연히 목소리를 낼 기회가 있으면 내야죠. 선거는 그다음 문제입니다.","당장은 공천혁신 약속이 연말까지 당헌당규가 되는지 감시하는 일, 그리고 재정주권 운동으로 우리 동네 예산부터 중앙당의 깜깜이 회계까지 투명하게 만드는 일부터 하겠습니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3016,"media":"정치시그널","q":"[돌발 2] 전당대회 결과를 두고 백낙청, 유시민 두 분의 평가가 엇갈렸는데?","tags":["시그널픽","돌발대비","백낙청유시민","촛불","청년의자리"],"quotes":[],"script":["★ 저는 백낙청 교수님의 문제의식에 깊이 공감합니다. 민주당이 특정 계파, 386 엘리트의 정당이 되어서는 국민의 지지를 받을 수 없습니다.","촛불을 들었던 시민에는 시민단체만 있는 것이 아닙니다. 평범한 청년과 국민들, 호남의 발전을 바라는 호남인들의 목소리가 함께 있습니다.","이번 전당대회는 당내 두 세력의 싸움이기 전에, 민주당이 특정 세력의 정당이 되어서는 안 된다는 국민과 호남의 의지가 반영된 결과라고 봅니다. 다만 유시민 작가님처럼 결과를 하나의 답으로 규정하고 단정하는 방식은 안 된다고 생각합니다.","이번 전당대회는 정작 우리 청년들의 이야기가 없었던 선거였습니다. 민주당에 청년들의 공간을 만드는 것이 민주당의 숙제라고 생각합니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3017,"media":"정치시그널","q":"[돌발 3] 제주 실종 셀프 종결, 성폭행 피해자 불송치 뒤 사망 — 보완수사권 폐지의 한계 아닌가? (돌발·최신)","tags":["시그널픽","돌발대비","보완수사권"],"quotes":[],"script":["★ 안전장치 없는 법은 이미 통과됐습니다. 저는 억울한 피해자들의 눈물이 2028년 총선에서 매서운 청구서가 되어 돌아올 것이라고 분명히 의견을 냈습니다.","전건송치 대상을 피해자 중심으로 다시 설계하고, 검찰의 보완수사 요구권만큼은 살려야 합니다. 어느 기관이든 견제받지 않는 수사권은 반드시 부패합니다.","개혁은 속도가 아니라 신뢰로 완성됩니다. 그리고 이제는 보완 입법으로 이 논쟁을 매듭짓고, 정치의 시간을 민생으로 돌려야 합니다.","국민은 검찰 이야기에 지쳤습니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3018,"media":"정치시그널","q":"[돌발 4] 미래대응기금은 어떻게 보나?","tags":["시그널픽","돌발대비","미래대응기금"],"quotes":[],"script":["★ 미래대응기금이야말로 이번 전당대회에서 토론됐어야 할 의제입니다. 반도체 초과세수로 미래 세대에 투자하겠다는 기금이라면, 2030 청년의 주거와 창업과 일자리가 그 한복판에 있어야 하고, 지역 청년이 설계에 참여해야 합니다.","서울에서 설계하면 서울 정책만 나옵니다. 그리고 기금일수록 투명해야 합니다.","어디에 얼마를 쓰는지 1원까지 실시간으로 공개해야 합니다. 반도체가 벌어들인 초과이윤이 다음 세대의 산업을 키우는 씨앗이 되도록, 미래산업 생태계를 세우는 제도로까지 이어져야 합니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3019,"media":"정치시그널","q":"[돌발 5] 전용기 최고위원 지명, 일방 통보 논란도 있는데?","tags":["시그널픽","돌발대비","전용기"],"quotes":[],"script":["★ 저는 축하 글까지 올린 사람입니다. 예비경선 때 공식 행사장에서 저를 공개 지지해 주신 유일한 국회의원이었고, 청년 몫 지명은 4대 혁신 플랜 약속의 이행입니다.","인선 절차의 아쉬움은 당이 조율로 풀 일이고, 제 관심은 하나입니다. 지명은 사람이 바뀌면 사라지지만 당헌에 새긴 자리는 사라지지 않습니다.","청년최고위원의 당헌 명문화까지 가야 진짜입니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3020,"media":"정치시그널","q":"[돌발 6] 선택적 모병제를 어떻게 보나?","tags":["시그널픽","돌발대비","선택적모병제"],"quotes":[],"script":["★ 저는 지지합니다. 곧 국방일보에 기고도 합니다.","군대가 가기 싫은 곳이었던 이유는 청춘을 바치는데 제대로 된 대가가 없는 일방적 의무였기 때문입니다. 월급을 제대로 받고 첨단 기술을 배우고 전역할 때 경력과 가산점을 들고나오는, 내가 선택해서 가는 첫 직장으로 군대를 바꿔야 합니다.","다만 이사를 하더라도 살던 집을 먼저 부수지는 않습니다. 모병이 자리 잡는 만큼 징병을 단계적으로 줄여가면 되고, 남성이든 여성이든 차별 없이 모병을 확대해야 성별 갈라치기도 줄어듭니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3021,"media":"정치시그널","q":"[돌발 7] 그럼 여성징병에는 찬성인가? (돌발)","tags":["시그널픽","돌발대비","여성징병"],"quotes":[],"script":["★ 강제로 끌고 가는 확대는 답이 아니고, 문을 여는 것이 답입니다. 처우가 민간 일자리와 경쟁이 되는 직업이라면 여성인 저부터 도전할 만합니다.","병역이 남녀 갈등의 소재가 되어온 시대를 끝내고, 성별과 상관없이 도전할 수 있는 좋은 직업으로 만들자는 것입니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3022,"media":"정치시그널","q":"[돌발 8] 검찰개혁, 공소청·중수청 전환은?","tags":["시그널픽","돌발대비","검찰개혁"],"quotes":[],"script":["★ 수사와 기소의 분리라는 방향에 동의합니다. 다만 보완책의 설계가 거꾸로 된 부분은 고쳐야 합니다.","죄명으로 피해자를 가르는 방식, 아동학대 피해자는 보호받고 전세사기 피해자는 제외되는 기준이 국민께 설명이 됩니까. 보호 대상을 범죄 유형이 아니라 피해자 중심으로 다시 설계해야 합니다.","그것까지 마치면 이제 검찰을 둘러싼 공방은 새 사법 시스템에 맡기고, 정치는 민생과 미래로 넘어가야 합니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3023,"media":"정치시그널","q":"[돌발 9] 국회법 개정, 패스트트랙 단축은 입법 독주 아닌가?","tags":["시그널픽","돌발대비","국회법"],"quotes":[],"script":["★ 일하는 국회로 가자는 방향에는 공감합니다. 다만 저는 어느 쪽이든 원칙은 하나라고 생각합니다.","규칙은 미리 정하고, 예외를 만들지 말고, 결과를 공개하라. 제가 당내 경선에 요구하는 원칙과 똑같습니다.","다수결의 정당성은 절차의 정당성에서 나옵니다. 속도를 내되 소수의 말할 권리는 지키는 균형을 국회가 스스로 증명해야 합니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3024,"media":"정치시그널","q":"[돌발 10] 개헌 논의는 어떻게 보나?","tags":["시그널픽","돌발대비","개헌"],"quotes":[],"script":["★ 87년 체제가 낡았다는 데 많은 국민이 공감하실 겁니다. 다만 개헌은 정치인들의 밥그릇 계산이 아니라 국민의 공론으로 가야 합니다.","저는 하나만 보탭니다. 어떤 개헌이든 다음 세대의 몫, 청년의 참여가 설계 단계부터 들어가야 합니다.","청년 없이 만든 미래 헌법이 무슨 미래를 담겠습니까."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3025,"media":"정치시그널","q":"[돌발 11] 선관위 재검표, 부정선거 논란은?","tags":["시그널픽","돌발대비","재검표"],"quotes":[],"script":["★ 검증은 제도로 하고, 신뢰는 투명성으로 세우는 것입니다. 저는 이 대목에서 우리 당도 떳떳해야 한다고 말해 왔습니다.","경선 결과도 공개하지 않는 정당이 남의 개표를 따져 물으면 국민께서 뭐라고 하시겠습니까. 모든 표는 공개적으로 검증 가능해야 합니다.","나라의 선거든 정당의 경선이든 같은 원칙입니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3026,"media":"정치시그널","q":"[돌발 12] 국민연금 레버리지 사태는?","tags":["시그널픽","돌발대비","국민연금"],"quotes":[],"script":["★ 국민의 노후 자금은 실험 대상이 아닙니다. 왜 그런 투자가 가능했는지, 누가 결정했는지 낱낱이 밝혀야 합니다.","저는 재정 감시 운동을 하는 사람으로서 하나만 강조합니다. 돈의 문제는 언제나 공개가 답입니다.","어디에 얼마를 어떻게 굴리는지 국민이 들여다볼 수 있어야 이런 일이 재발하지 않습니다."],"notes":["채널A 「라디오쇼 정치시그널」 시그널픽 8/27(목) 08:35 생방송 최종. ★=꼭 할 말."]},{"no":3101,"media":"9월 현안(2026.9)","q":"[아시아투데이 서면 9.16] 인사청문 논란으로 국정·정당 지지율이 떨어지고 2030 민심도 악화됐습니다. 민주당은 어떤 행보를 보여야 합니까?","tags":["9월현안","2030","지지율","인사청문","공정","청년최고위원제"],"quotes":[["김보미 (아시아투데이 서면, 9.16)","청년은 몰라서 떠나는 게 아닙니다. 너무 잘 알아서 떠납니다."]],"script":["★ 청년은 몰라서 떠나는 게 아닙니다. 너무 잘 알아서 떠납니다.","숫자가 먼저 말해 주고 있습니다. 한국갤럽 조사에서 대통령 직무 긍정률은 9월 첫째 주 40%, 둘째 주 38%로 두 주 연속 취임 후 최저를 새로 썼습니다. 9월 첫째 주에는 18~29세 긍정률이 25%로 처음 20%대까지 내려앉았습니다. 리얼미터 9월 10~11일 조사에서는 국민의힘 42.1%, 민주당 36.1%로 정당 지지율마저 뒤집혔습니다.","맞습니다. 인사 논란이 불을 댕겼습니다. 다만 인사 몇 건의 실수로만 볼 일이 아닙니다. 36세 최연소 장관 후보자를 내세웠는데 청년들은 박수 대신 등을 돌렸습니다. 청년이 물은 것은 나이가 아니라 공정이었기 때문입니다.","★ 청년이 민주당을 떠난 게 아니라, 민주당이 먼저 청년을 떠난 겁니다.","하나. 검증의 잣대부터 바로 세우십시오. 청년에게 들이대는 원칙과 힘 있는 사람에게 적용하는 원칙이 같아야 합니다.","둘. 결정하는 방에 청년을 앉히십시오. 전당대회준비위원회가 만장일치로 의결하고도 최고위원회에서 부결된 청년최고위원제부터 되살려야 합니다.","셋. 민주당이 먼저 기득권을 내려놓으십시오. 위성정당 선거보조금 환수, 정당 보조금 상시 인터넷 공개, 선거제도 개혁을 청년들 앞에서 공개 토론합시다.","★ 분노보다 무서운 것이 무관심입니다. 골든타임이 남아 있을 때 말이 아니라 행동으로 답해야 합니다."],"notes":["출처: 한국갤럽 9.1~3(1,001명)·9.8~10(1,000명, 긍정률 38%), 리얼미터·에너지경제신문 9.10~11(1,003명). 기자 질의의 '김상민 후보'는 확인되지 않음 — 보도상 인물은 김승원 법무부 장관 후보자. 답변에 실명은 쓰지 않음."]},{"no":3102,"media":"9월 현안(2026.9)","q":"용혜인 후보자가 지명 14일 만에 사퇴했습니다(9.13). 어떻게 봅니까?","tags":["9월현안","용혜인","위성정당","정치개혁"],"quotes":[["김보미 (페이스북, 9.16)","용혜인은 원인이 아닙니다. 고장 난 정치 제도가 낳은 일그러진 결과일 뿐입니다."]],"script":["★ 사퇴는 끝이 아니라 시작이어야 합니다.","\"떳떳하지 않은 것이 없었다\"며 국민의힘과 언론 탓만 했습니다. 위성정당으로 두 번 배지를 달고 그 의석을 발판 삼아 나랏돈을 챙겼다는 지적에는 끝내 사과가 없었습니다.","용혜인은 원인이 아닙니다. 고장 난 제도가 낳은 결과입니다. 떨어진 떡고물 하나 치웠다고 판이 바뀌지 않습니다.","겸직 금지법 하나 만든다고 위성정당이 사라지지 않습니다. 곁가지 싸움은 그만하고 실패한 제도를 인정해야 합니다."],"notes":["8.30 지명 → 9.13 자진 사퇴(경향신문·한국일보 9.13). 개인 의혹(배우자 채용 등)은 청문회가 열리지 않아 검증되지 않음 — 단정 금지."]},{"no":3103,"media":"9월 현안(2026.9)","q":"위성정당 문제, 해법이 뭡니까? 위성정당 방지법이면 됩니까?","tags":["9월현안","위성정당","선거제도","병립형","중대선거구제"],"quotes":[["김보미 (페이스북, 9.16)","정치개혁은 구호가 아니라 법안이어야 합니다."]],"script":["★ 법에 구멍이 있으면 빠져나가고, 구멍이 없으면 뚫어서라도 빠져나가는 게 여의도 정치입니다. 방지법만으로는 안 됩니다.","하나. 실패한 준연동형을 폐기하고 병립형으로 돌아가십시오. 지역구 후보 없이 비례만 내거나 선거 뒤 바로 합치는 가짜 정당에는 한 석도, 1원의 나랏돈도 돌아가지 않게 하십시오.","둘. 승자독식 소선거구제를 깨고 중대선거구제로 바꾸십시오. 2등, 3등의 목소리도 국회에 닿아야 양당의 적대적 공생이 무너집니다.","셋. 선거 규칙은 미리 정하십시오. 법은 선거구를 선거일 1년 전까지 확정하라고 하는데 매번 어기고 있습니다."],"notes":["위성정당 선거보조금: 미래한국당 61억·국민의미래 28억·더불어시민당 24억·더불어민주연합 28억 원(정치자금법 총망라 보고서 기준)."]},{"no":3104,"media":"9월 현안(2026.9)","q":"정당 국고보조금, 무엇이 문제입니까?","tags":["9월현안","국고보조금","정치자금법","재정주권","상시공개"],"quotes":[["김보미 (페이스북, 9.16)","국가 예산은 '열린재정'에, 지자체 살림은 '지방재정365'에 날마다 올라옵니다. 그런데 정당 보조금만은 선관위 사무소에 찾아가야 합니다."]],"script":["★ 2025년 한 해 정당 국고보조금 1,047억 원. 어디에 썼는지 국민은 볼 수 없습니다.","민주당 501억 원, 국민의힘 459억 원입니다. 그런데 회계보고는 선관위 사무소에 직접 가야, 그것도 정해진 몇 달 동안만 열람할 수 있습니다.","★ 다섯 가지를 요구합니다. 정당 보조금 상시 인터넷 공개, 위성정당 선거보조금 전액 환수, 선관위 지정 외부 회계감사, 보조금 인건비 수령자 검증 의무화, 허위 회계보고 원스트라이크 아웃.","민주당은 501억 원, 국민의힘은 459억 원의 사용 내역부터 공개하십시오. 제 주머니는 감추고 남의 허물만 찌르는 법안은 개혁이 아닙니다."],"notes":["상세 근거: 이슈현안 자료실 '정치자금법 문제점 및 개선 총망라'(issue-politicalfund.html)."]},{"no":3105,"media":"9월 현안(2026.9)","q":"청년과의 정치개혁 공개토론을 제안했는데, 무슨 취지입니까?","tags":["9월현안","청년","공개토론","정치개혁","2030"],"quotes":[["김보미 (페이스북, 9.16)","청년들이 묻고, 정치가 답하는 자리입니다."]],"script":["★ 위성정당 사기극의 청구서는 결국 청년에게 날아옵니다.","두 당이 나눠 가진 판에 청년 정치인이 들어갈 자리는 없습니다. 그런데 선거 규칙은 늘 여의도 밀실에서, 이해당사자인 현역 의원들끼리 정합니다.","민주당과 국민의힘 지도부, 국회 정치개혁 논의를 맡은 의원들이 청년들 앞에 나와야 합니다. 위성정당을 왜 만들었는지, 어떻게 끝낼 건지 공개 토론장에서 답하십시오. 저 김보미도 그 자리에 함께 서겠습니다."],"notes":[]},{"no":3106,"media":"9월 현안(2026.9)","q":"인사청문 슈퍼위크(9.14~18), 다른 후보자 의혹은 어떻게 봅니까?","tags":["9월현안","인사청문","검증","공정"],"quotes":[],"script":["★ 청년에게 들이대는 잣대와 힘 있는 사람에게 대는 잣대가 같아야 합니다.","의혹은 청문회에서 사실로 가려져야 합니다. 제가 여기서 단정할 일은 아닙니다.","다만 의혹이 나왔을 때 버티기로 갈 것인지, 국민 눈높이로 판단할 것인지는 여당이 답해야 합니다. 그 선택을 2030이 실시간으로 지켜보고 있습니다."],"notes":["금지선: 의혹 단정, 특정 후보자 실명 비난 자제. 보도상 쟁점: 김승원 법무부 장관 후보자(신약 임상 승인 외압 의혹 등, 9.15 청문회), 이형일 재정경제부 장관 후보자(비거주 1주택, 9.17 경과보고서 채택 여부)."]}],"ARTICLES":[["오마이뉴스","\"민주당에 공정이 없다\" 86세대 직격, 당대표 후보 김보미 누구?","https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003250922","프로필·정견발표 반향 종합"],["오마이뉴스","\"손흥민도 반칙하면 '레드카드' 받아… 이 대통령 팔로우에 위안\"","https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003252338","공정 비유('레드카드')·X 팔로우 소회 — 인용 활용도 최상"],["국민일보","\"내로남불·불공정·위선 끝판왕을 민주당에서 본다\" 37세 당대표 후보 김보미 [인터뷰]","https://www.kmib.co.kr/article/view.asp?arcid=0030115498","※'37세' 표기 오류 — 만 36세로 정정 요청 대상"],["문화일보","37세 김보미 \"청년 박지현은 안되고, 송영길은 되나… 비정상의 극치\"","https://www.munhwa.com/article/11603240","송영길 자격 비판 핵심 워딩 보도"],["MBC 뉴스투데이","36살 김보미 당대표 출마 이유?… \"정청래가 재도전? 민주당 죽었다\" [모닝콜]","https://imnews.imbc.com/replay/2026/nwtoday/article/6837813_37012.html","지상파 첫 모닝콜 인터뷰"],["경향신문","이 대통령, '정청래·86 직격' 김보미 당대표 후보 엑스 팔로우","https://www.khan.co.kr/article/202607171426011/","X 팔로우 보도(교차 확인됨)"],["파이낸셜뉴스","SNS 개설 하루만에 李 대통령이 팔로우한 사람… \"86세대는 가라\" 김보미","https://www.fnnews.com/news/202607172243052541","X 팔로우·86 비판 종합"],["프레시안","\"다 죽은 국민의힘을 펄펄 살게 만들었다\"… 36세 청년 김보미, 정청래에 거침없는 비판","https://www.pressian.com/pages/articles/2026071617485205196","정청래 책임론 보도"],["뉴스핌","'36살 민주당 평당원' 김보미, 당대표 도전 선언… 청년 돌풍 변수 부상","https://www.newspim.com/news/view/20260704000036","7.4 출마선언 보도"],["한국일보","\"박지현은 안되고 송영길은 되나\"… 與 출마 예외 인정에 '공정성 논란'","https://www.hankookilbo.com/news/article/A2026071709110001619","당규 6개월·당비 6회 규정 상세"],["헤럴드경제","김용·송영길 전당대회 출마 허용에… '686 불공정' 반발 확산","ht xuva.com/vision.html?post=msg1",["1인1표","공약"],"1인 1표 논쟁의 본질 — '뽑고 싶은 후보'가 있어야 완성"],["비전·공약","승자도 패자도 함께 빛나는 '싱어게인' 민주당 (7.1 메시지②)","https://www.xn--4k0b53xuva.com/vision.html?post=msg2",["유리상자","공약","공정"],"경선 데이터 전면 공개 — 공통 공약 제안 원문"],["방송기록","📺 방송·인터뷰 출연 기록 대장 (7.20 기준)","https://kimbomi0603.github.io/trackcamp-board/broadcast_log.html",["방송기록","김어준","뉴스공장","확정멘트"],"출연 14건 시간순 기록 + 방송별 발언 일관성 체크(확정 멘트) + 다음 출연 전략 — 뉴스공장 여론 관리 지침 포함"],["도구","🔍 나라살림 돋보기 — 우리동네 예산 3초 확인","https://www.xn--4k0b53xuva.com/narasalim.html",["나라살림돋보기","예산"],"243개 지자체+중앙정부 예산 — 실력 증명용 시연 가능"]],"ISSUES":[["🆕 [7.23 확정] 예비경선 결과 — 김민석·정청래·송영길 3파전, 청년 후보 전원 탈락","7.23 국회 의원회관 발표: 당대표 본선은 김민석·정청래·송영길 686 빅3로 압축. 김보미·고민정 컷오프, 최고위원 8인 확정(친청계 전원 생존). 김보미는 4일 선거운동 동안 107명에게 약 1,909만원 후원을 받음(김보미닷컴).","결과는 겸허히 받아들입니다. 결과는 졌지만 도전은 지지 않았습니다. 계란은 깨졌지만 바위에 낸 금은 남아 있습니다. 청년 후보 전원 탈락은 '지금의 경선 구조로는 어떤 청년도 불가능하다'는 증거입니다. 저의 '민주당 갈아엎기 대전환 선언'은 결과와 상관없는 약속이고, 그 약속은 지금부터 시작입니다.",["예비경선결과","탈락","3파전","청년전원탈락","돌발이슈"],"https://www.hankookilbo.com/news/article/A2026072316100000149"],["🆕 [7.22] 정청래 차량 습격 — 50대 남성 검거 (7.20 여의도 당사 앞)","7.20 저녁 예비경선 합동 설명회 종료 후 여의도 당사 앞에서 50대 남성이 정청래 후보 차량을 발과 도구로 공격(재물손괴, 인명피해 없음). 7.22 경찰 검거 발표 — '민주당원 여부는 확인 불가'. 정청래 '엄벌·배후 규명' 요구, 김민석 '반민주당 행위, 발본색원'.","정치인에 대한 폭력은 어떤 이유로도 정당화될 수 없습니다. 정청래 후보님께 위로의 말씀을 드리고, 엄정한 수사를 촉구합니다. 다만 한 가지를 함께 봐야 합니다 — 정치가 증오를 조직하면 폭력은 그 끝에서 나옵니다. 진영에 따라 환호와 비난이 뒤바뀌고, 상대를 악마화하는 정치를 계속하는 한 이런 일은 반복됩니다. 증오를 조직하는 정치를 끝내고 정책으로 경쟁하는 정당을 만드는 것이 근본 대책입니다.",["차량습격","정치폭력","증오정치","진영논리","돌발이슈"],"https://www.hankookilbo.com/news/article/A2026072214460001484"],["🆕 [7.22] 신천지 전대 개입 공방 격화 — 김민석 '실체적 근거' vs 정청래 '죗값 치를 것'","김민석 '신천지는 비유법이 아니라 실체법, 반명·분열주의와 사실상 연합'(7.21 MBC라디오) vs 정청래 '정교분리 위반, 반드시 죗값 치르게 하겠다'(7.22 SBS). 송영길은 통일교·신천지 특검 조사 필요 제기. 친명계 이건태 의원 '신천지 전대개입 제보센터' 설치, 친청계는 김민석에 '근거 제시 못하면 사퇴' 요구. 당 공식 입장은 '예의주시 중이나 수상한 입당·개입 아직 확인 안 됨'(7.22).","이 공방이야말로 제가 말한 '가짜 1인 1표'의 민낯입니다. 특정 종교의 개입 여부는 단정할 수 없습니다 — 단정이 아니라 검증을 요구합니다. 의혹이 사실이라면 자신의 투표권을 대리인에게 넘긴 명백한 불법 당원이니, 제보센터 공방으로 서로 때릴 게 아니라 불법당원 전수조사부터 하고 경선해야 합니다. 유령당원·불법당원이 후보를 뽑는 구조를 방치하니 이런 의혹이 파고드는 겁니다. 근본 해법은 가짜 당원 정리와 경선 결과 100% 공개입니다.",["신천지","불법당원","전수조사","제보센터","1인1표","돌발이슈"],"https://www.fnnews.com/news/202607221611387982"],["🆕 [7.21~22] 유시민 '어물전론' — ABC론·재건축론·필패론에 이어","유시민, 7.21 유튜브 '2분뉴스'에서 '절대권력은 부패한다. 좋은 생선을 팔아도 비린내가 나고, 내버려두면 썩은 냄새가 난다. 후각이 예민한 사람이 말을 해야 한다'(어물전론) — 당내 비판자 축출 비판. 앞서 ABC론(A=가치 기반 코어 지지층, B=이익 좇아 모여드는 정치인·평론가, C=교집합, 3월 매불쇼), 재건축론, '필연적 실패의 길'(필패론) 발언으로 연쇄 파장.","어물전론의 취지에 공감합니다. 비린내가 난다고 후각이 예민한 사람을 쫓아내면 결국 생선이 다 썩습니다. 쓴소리에 문자폭탄으로 답하는 정당에는 미래가 없습니다. 저부터가 당에 쓴소리하러 나온 사람입니다. 다만 저는 실패를 예언하러 나온 게 아니라 성공시키러 나왔습니다. 계파 싸움으로 발목 잡는 민주당이야말로 필연적 실패의 길이고, 당을 바꿔야 정부가 성공합니다. 재건축을 넘어 대전환 — 그래서 홍대선언입니다.",["유시민","어물전론","ABC론","필패론","쓴소리","돌발이슈"],"https://segye.com/newsView/20260722504520"],["🆕 [7.22 오늘] 대통령 지지율 48.4% 하락 · 민주 43.1% vs 국힘 40.0% 초박빙 — '계파 공방 후폭풍'","리얼미터(7.20 발표): 이재명 대통령 국정 긍정평가 48.4%로 하락, 민주당 43.1%·국민의힘 40.0% 초박빙. 언론들은 전당대회가 정책 경쟁 대신 계파 공방(명청대전·적통논쟁)으로 흐른 후폭풍으로 분석. 당권투쟁 격화에 대통령이 잇단 경고.","보십시오. 계파 싸움의 대가를 지금 숫자가 보여주고 있습니다. 전당대회가 정책 경쟁이 아니라 족보 경쟁·명청대전으로 흐르니 대통령 지지율이 떨어지고 국민의힘이 코앞까지 쫓아왔습니다. 제가 말씀드렸지 않습니까 — 그만 싸우십시오. 정책이 족보를 이겨야 합니다. 재집권에 실패하면 다시 계엄입니다. 이 와중에 유일하게 정책과 공약으로 경쟁하는 후보가 누구인지 봐 주십시오.",["지지율하락","명청대전","계파","족보정치","재집권","돌발이슈"],"https://www.fnnews.com/news/202607200812212775"],["🆕 [7.21~22] 정청래 '집토끼' vs 김민석 '명청대전 끝내야' — 본선 구도 공방","컷오프 국면에서 정청래 후보는 '집토끼(강성 지지층)가 집을 나가면 무망하다'며 결집 호소, 김민석 후보는 '명청대전을 끝내야 한다'며 당청 단합 강조. 송영길 후보는 정청래의 당청 갈등을 공격. 본선은 '정청래 대 비(非)청' 구도 전망.","집토끼 산토끼 얘기가 아니라, 지금 토끼장이 무너지고 있습니다. 2030이 떠나고 무당층이 절반인데 집토끼만 붙잡으면 총선을 이깁니까? 명청대전을 끝내자는 말엔 동의합니다. 그런데 끝내는 방법은 686끼리 자리를 나누는 게 아니라 세대교체입니다. 계파의 언어(집토끼·적통·명청)가 아니라 미래의 언어(AI·일자리·청년)로 경쟁합시다.",["집토끼","명청대전","세대교체","무당층","2030","돌발이슈"],"https://www.sedaily.com/article/20069701"],["🆕 [7.22 오늘] 예비경선 마지막 날 — 오늘·내일 3인 확정","당대표 예비경선 당원투표가 오늘까지 진행(중앙위원 35%·권리당원 35%·국민여론조사 30%), 7.23 국회 의원회관에서 5→3인 결과 발표. 김보미는 원외·최연소 후보로 컷오프 통과가 최대 관문.","오늘이 고비입니다. 하지만 저는 결과에 연연하지 않습니다. 선호투표제를 도입했으면 컷오프 자체가 필요 없습니다. 표가 갈릴 걱정이 없는데 왜 청년의 입을 막습니까. 3인에 들든 안 들든 저는 8월 17일 대전까지 완주하고, '김보미가 길을 열었다'는 말을 남기겠습니다.",["예비경선","컷오프","선호투표","완주","본경선진출","돌발이슈"],"https://www.fnnews.com/news/202607190601535786"],["🆕 [7.21 어제] 송영길 후보, 서울시의회 의장실서 고함","7.21 서울시의회 의장 접견 자리(의장·의원·직원 배석)에서 송영길 후보가 김보미의 페이스북 게시글(출마자격 예외 비판)을 두고 고함. 별도 통화 요청에도 호통 지속. 김보미는 정견발표에서 공개 사과를 요구했으나 사과는 없었음.","여러 사람 앞에서 고함치며 윽박지르는 건 인격 무시입니다. 저도 당대표 후보입니다. 존중해 주십시오. 공개적으로 고함치셨으니 저도 공개적으로 사과를 요구한 겁니다. 저는 '사람'이 아니라 '과정의 불공정'을 지적했을 뿐입니다. 손흥민도 반칙하면 레드카드를 받습니다.",["고함사건","송영길김용","공정","레드카드","돌발이슈"],"https://www.facebook.com/kimbomi1989"],["🆕 [7.21 어제] 기탁금 감액 확정 — 당대표 8천·최고위 3천","당 선관위, 당대표 1억→8,000만·최고위원 5,000만→3,000만 확정. 청년 50% 감면 유지(청년 최고위원 2,500만→1,500만). '투개표 비용은 후보자 부담'이라는 입장 유지.","안 내리는 것보다 낫지만 원상복귀가 아닙니다. 이재명 대표 시절의 정확히 두 배입니다. 게다가 등록은 이미 끝났고, 저는 등록 당일 다섯 군데서 빌렸습니다. 투개표는 정당 민주주의의 기본 비용인데 후보 지갑에 떠넘기면 돈 있는 사람만 나오는 정당이 됩니다. 답은 찔끔 감액이 아니라 당직선거 공영제입니다.",["기탁금감액","기탁금","공영제","투개표비용","돌발이슈"],"https://www.fnnews.com/news/202607211232402474"],["🆕 [7.22 지역] 전남·광주 통합특별시(7.1 출범) — 무안청사 기능 강화 논란","7.1 통합특별시 출범. 동부·무안·광주 3청사 중 서부권 단체장들이 무안 청사 기능 강화를 요구. 반도체 공장이 광주 군공항 부지로 결정되며 '광주 쏠림·전남 낙후' 우려 확산.","통합은 한쪽이 커지고 다른 쪽이 작아지면 안 됩니다. '함께 커지는 통합'이어야 합니다. 서부권의 무안 청사 강화 요구는 타당합니다. 농업·수산·해양·섬 정책·균형발전·지방소멸 대응처럼 전남의 미래를 책임지는 기능은 무안 청사에 집중 배치해야 합니다.",["통합특별시","무안청사","균형발전","지방소멸","호남","돌발이슈"],"https://www.xn--4k0b53xuva.com/"],["🆕 [최근] 여고생 살해사건 계기 — 보완수사권 존폐 재점화","여고생 살해범 사건 이후 검찰 보완수사권 폐지 존폐 논란 확산. 민주당은 의총에서 결론을 못 냄. 여성단체는 완전 폐지 시 피해자 보호 공백 우려.","검찰개혁, 안 하자는 게 아니라 완성하자는 겁니다. 칼은 뺏어도 좋지만 선까지 자를 일은 아닙니다. 검·경이 서로 견제해야 정치검찰도 경찰 독주도 막습니다. 무엇보다 피해자 보호 공백은 절대 안 됩니다. 속도보다 방향, 국민 안전이 먼저입니다.",["보완수사권","검찰개혁","피해자보호","돌발이슈"],"https://www.lawtimes.co.kr/news/articleView.html?idxno=223389"],["🆕 [최근] 정청래 '개혁법안 27% 처리' — 대통령과 엇박자 논란","김보미는 무등의아침 대비에서 '정청래 후보가 당대표 시절 정부 요구 개혁법안을 27%밖에 통과시키지 않았다'며 대통령과의 엇박자를 지적. 800조 반도체 '자기정치 이용'·'전북 소외론' 갈라치기 비판과 연결.","국가 비전이 발표됐으면 온몸을 바쳐 성공시켜야지 자기 선거에 이용하면 안 됩니다. 대통령과 엇박자만 내고 개혁법안도 27%밖에 처리 안 한 분이 무슨 3대 메가프로젝트를 성사시킵니까. 호남 반도체 800조, 제가 하나하나 뒷받침하겠습니다.",["정청래","메가프로젝트","반도체800조","호남","책임정치","돌발이슈"],"https://www.xn--4k0b53xuva.com/vision.html?post=pmrqh15wvgxyr"],["🆕 [여론] 김민석 22.4 vs 정청래 20.5 오차범위 접전 — 김보미 0.6%(RDD 2.9%)","여론조사꽃(7.17~18, 전화면접) 당대표 적합도: 김민석 22.4%·정청래 20.5%(접전)·송영길 8.2%·고민정 2.5%·김보미 0.6%·적합인물 없음 38.2%. 별도 RDD 조사에선 김보미 2.9%, 18~29세 남성 6.5%(전체 3위), 진보층 고민정과 3.9% 동률.","숫자는 작아도 방향은 분명합니다. 무당층에선 '김보미' 아니면 '없음' 둘 중 하나였습니다. 20대 남성 6.5%로 전체 3위입니다. 기존 민주당이 못 데려오던 표를 데려올 외연 확장 카드가 누구인지 데이터가 증명했습니다. 적합인물 '없음' 38%가 바로 세대교체의 갈증입니다.",["여론조사","무당층","2030","돌발이슈","김민석","정청래"],"https://www.xn--4k0b53xuva.com/"],["기탁금 감액 결정 (7.21 당 선관위)","중앙당선관위(임호선 부위원장), 당대표 1억→8,000만·최고위원 5,000만→3,000만 확정. 청년 50% 감면 유지(청년 최고위원 2,500만→1,500만), 원외 장애인 50% 감면 신규. '과도 부담 지적에 2020~2022년 기준'·'투개표 비용은 후보자 부담이 맞다'는 입장.","안 내리는 것보다는 낫습니다. 그러나 원상복귀가 아닙니다. 이재명 대표 시절의 정확히 두 배입니다. 그리고 등록은 이미 끝났습니다 — 저는 등록 당일 다섯 군데서 빌렸습니다. 투개표는 정당 민주주의의 기본 비용입니다. 후보 지갑에 떠넘기면 돈 있는 사람만 출마하는 정당이 됩니다. 답은 찔끔 감액이 아니라 당직선거 공영제입니다.",["기탁금감액","투개표비용","공영제","기탁금"],"https://www.fnnews.com/news/202607211232402474"],["송영길 후보 공개 석상 고함 (7.21 서울시의회 의장실)","의장·의원·의회사무과 직원 배석 접견 자리에서 송영길 후보가 김보미 후보의 페이스북 게시글(출마자격 예외 비판)을 두고 고함. 별도 통화 요청에도 호통 지속. 김 후보는 정견발표에서 공개 사과를 요구했으나 끝내 사과 없음.","저는 사람이 아니라 '과정의 불공정'을 지적했습니다. 손흥민도 반칙하면 레드카드를 받습니다. 섭섭하실 수는 있지만 여러 사람 앞에서 고함치며 윽박지르는 것은 인격무시 행위입니다. 공개적으로 고함치셨으니 저도 공개적으로 사과를 요구한 것입니다. 저도 당대표 후보입니다. 존중해 주십시오.",["고함사건","송영길김용","공정"],"https://www.facebook.com/kimbomi1989"],["예비경선 투표 시작 (7.21~23, 5→3인) — 오늘부터 당원투표","당대표 예비경선: 중앙위원 35%·권리당원 35%·국민여론조사 30%, 결과 발표 7.23 국회 의원회관. 최고위원은 14→8인(중앙위원 50%·권리당원 50%).","선호투표제를 도입했으면 컷오프는 안 됩니다. 표가 갈릴 걱정이 없는데 왜 자릅니까. 청년의 입을 막는 '청년 컷오프' 하지 말고 5인 모두 본선에서 겨룹시다. 그리고 저는 끝장을 봅니다. 8월 17일 대전까지 완주합니다.",["컷오프","선호투표","완주"],"https://www.fnnews.com/news/202607190601535786"],["선호투표제 확정 (7.14 최고위→7.15 당무위)","1인 1표 선호투표제로 본선 진행 확정.","방향은 환영합니다. 이제 순위별 득표 데이터 전면 공개로 완성하십시오. 공개 못 할 이유가 없지 않습니까. 그리고 선호투표와 컷오프는 양립할 수 없습니다.",["선호투표","1인1표","유리상자"],"https://www.newspim.com/news/view/20260714000314"],["청년최고위원 분리선출안 최고위 부결","전준위 전원일치 결의에도 최고위가 부결. 계파 간 '선호투표제와 거래' 의혹 시각.","거래로 보인다면 그게 계파 정치의 민낯입니다. 청년의 자리가 협상 카드로 쓰인 겁니다. 저는 취임 당일 1호 안건으로 발의해 30일 안에 개정을 완료하겠다고 문서로 약속했습니다.",["청년최고위원","계파","공개질의답변"],"https://www.sedaily.com/article/20067716"],["송영길·김용 후보자격 예외 인정","복당 6개월 미달·당비 미납에도 최고위 의결·당무위로 구제. 박지현 사례와 이중잣대 논란 확산.","청년 박지현은 서류 접수조차 거부당했고, 686 송영길은 밤 10시 반 긴급 최고위로 구제됐습니다. 손흥민도 반칙하면 레드카드를 받습니다. 규칙보다 사람이 우선하는 순간 민주주의는 무너집니다. 당헌 위반 강행 시 가처분을 포함해 대응합니다.",["송영길김용","박지현","공정","가처분"],"https://www.hankookilbo.com/news/article/A2026071709110001619"],["기탁금 인상 + 대통령 '원상복귀' 주문","예비경선 2,000만(청년 50% 감면), 본경선 5,000만으로 인상. 이재명 대통령이 인하 주문 — 일각 '당무개입' 논란.","저는 그 1,000만 원이 없어서 등록 당일 다섯 군데서 빌렸습니다. 대통령 말씀은 당연한 것이고, 그 당연한 말을 대통령이 해야 할 만큼 지도부가 거꾸로 간 게 문제입니다. 이게 어떻게 당무개입입니까. 당직선거 공영제로 갑시다.",["기탁금","공영제","이재명"],"https://www.xn--4k0b53xuva.com/manifesto.html"],["이재명 대통령 X 팔로우 화제","X 계정 개설 하루 만에 대통령이 팔로우 — '낙점설' 해석 유통.","대통령께서 청년 평당원의 목소리를 지켜봐 주신다면 감사한 일입니다. 하지만 저는 누구의 선택이 아니라 당원의 선택으로 여기까지 왔습니다. 저는 누구의 똘마니도 아닙니다.",["X팔로우","낙점","이재명"],"https://www.khan.co.kr/article/202607171426011/"],["신천지 조직적 유입 의혹","특정 후보 지원 목적의 조직 입당 의혹 제기 — 당 차원 대응 없음.","의혹이 사실이라면 자신의 투표권을 대리인에게 넘긴 명백한 불법 당원입니다. 불법당원 전수조사하고 모두 솎아내고 경선해야 합니다. 단정이 아니라 검증을 요구하는 겁니다.",["신천지","유령당원","1인1표"],"https://www.xn--4k0b53xuva.com/manifesto.html"],["조국혁신당 합당론","당 안팎에서 합당 논의 부상.","거꾸로 여쭙고 싶습니다. 당원이 빠진 합당 논의가 무슨 의미가 있습니까. 욕심보따리부터 내려놓아야 합니다.",["조국혁신당","합당"],"https://www.xn--4k0b53xuva.com/"],["'적통' 논쟁 — 이해찬 전 총리 배우자, 정청래 후원회장","적통 마케팅 가열 전망.","고인은 당의 큰 어른이셨고 유족의 선택은 존중합니다. 다만 적통이 혈통입니까, 인맥입니까. 민주당의 적통은 계란으로 바위를 쳤던 김대중·노무현의 도전 정신입니다. 저는 그 도전의 적통을 잇겠습니다.",["적통논쟁","정청래","계파"],"https://www.xn--4k0b53xuva.com/manifesto.html"],["유시민 '필연적 실패의 길' 발언","이재명 정부의 검찰개혁 의지 비판.","쓴소리는 경청해야 합니다. 다만 저는 정부의 실패를 예언하러 나온 사람이 아니라 성공시키러 나온 사람입니다. 계파 싸움으로 발목 잡는 민주당이야말로 필연적 실패의 길입니다. 당을 바꿔야 정부가 성공합니다.",["유시민","이재명","검찰개혁"],"https://www.xn--4k0b53xuva.com/"],["보완수사권·검찰개혁 '8.17 전 처리' 방침","당론안: 형소법 196조 삭제+보완수사요구권 유지. 여성단체, 완전 폐지 우려.","안 하자는 게 아니라 완성하자는 겁니다. 칼은 뺏어도 좋습니다. 그러나 선까지 자를 일은 아닙니다. 검경이 서로 견제하는 제도 — 정치검찰도, 경찰 독주도 안 됩니다. 피해자 보호 공백은 절대 안 됩니다.",["보완수사권","검찰개혁"],"https://www.lawtimes.co.kr/news/articleView.html?idxno=223389"],["3대 메가프로젝트·호남 반도체 800조 vs '전북 소외' 반발","정청래 후보 '전북 빠졌다·문재인 덕분' 발언 — 지역 갈라치기 논란.","국가 비전이 발표됐으면 '내가 온몸을 바쳐 성공시키겠다'고 해야지, 자기 선거에 이용하면 안 됩니다. 호남이 대한민국의 두 번째 수도권으로 서도록 대통령과 함께 반드시 성공시키겠습니다. AI 다음은 농업입니다 — 기후위기는 곧 식량위기니까요.",["메가프로젝트","호남","농업","균형발전"],"https://www.xn--4k0b53xuva.com/vision.html?post=pmrqh15wvgxyr"],["6.3 지방선거 책임론","대통령 고지지율에도 패배. 직전 지도부 책임·공천 파행 논란.","민주 정치는 책임 정치입니다. 반성도 평가도 없이 한 번 더 하겠다는 게 지금 민주당입니다. 다 죽은 국민의힘을 펄펄 날게 만들어 준 책임, 누가 집니까.",["책임정치","정청래","강진공천"],"https://www.pressian.com/pages/articles/2026071617485205196"],["송파 투표소 사건·청년 참정권 시위","투표용지 부족 참정권 침해 — 올림픽공원 시위로 확산. 당 차원 응답 부재.","청년들은 결과를 뒤집자는 게 아니라 왜 과정의 공정이 무너졌는지 묻고 있습니다. 민주당은 아무 답도 하지 않았습니다. 저라면 현장에 가서 먼저 듣겠습니다.",["참정권","공정","청년"],"https://www.xn--4k0b53xuva.com/manifesto.html"],["2030 무당층 48%·청년 이탈","18~29세 절반이 무당층. 20대 남성 이탈 심화, 여성도 이탈 조짐.","청년이 민주당을 떠난 게 아니라 민주당이 먼저 청년을 떠났습니다. 청년의 보수화는 민주당의 기득권 정치가 뿌린 씨앗입니다. 저는 '네 잘못이 아니다'라는 말을 하러 나왔습니다.",["무당층","2030","청년"],"https://www.xn--4k0b53xuva.com/manifesto.html"],["뉴스공장 출연 후폭풍","7.17 출연 — 검증형 질문에 고전 평가와 무례 비판 여론 혼재. 생각나누기 127건.","흠씬 두들겨 맞았습니다. 그러나 꺾이지 않겠습니다. 비판해 주신 분들 말씀도 겸허히 받겠습니다 — 그분들 다수가 민주당을 사랑하는 분들이니까요. ⚠'꼰대' 표현 재사용 금지(캠프 지침), 수용 화법으로.",["김어준","뉴스공장","이생망중꺾마"],"https://www.xn--4k0b53xuva.com/vision.html?post=pmrrfrezv01bl"]],"MEDIAS":["연세대 토론회(10.27)","9월 현안(2026.9)","이맘때(광주KBS)","한겨레21 추가(8.18)","신동아","⚠️ 교차점검","TV조선","문화일보","취재편의점","이데일리","기자회견문·성명","한겨레뷰리핑(7.27)","한겨레TV","KBC광주방송","경향신문(통화)","JTBC","세계일보(서면)","프레시안(서면)","SBS확정대본","SBS뉴스브리핑","YTN뉴스명당","뉴스바사삭","광주KBS무등의아침","바삭한인터뷰","뉴스핌(서면)","무등일보(서면)","뉴스1(서면)","인사말","KBS광주TV","광주KBS","조선일보","불교방송","뉴탐사","한겨레","광주기자회견","한겨레21","전격시사(8.12)"],"VOICE":[{"sec":"아름다운 퇴장 ① 존경, 그리고 정중한 세대교체 요청","kw":["아름다운퇴장","세대교체","86용퇴","재집권"],"lines":["저는 김민석·정청래·송영길, 686 선배님들을 존경합니다. 최루탄도 맞고 감옥도 가시며 아름다운 청춘을 민주주의에 바치셨습니다. 제가 비판할 자유도 선배님들이 만들어 주신 민주주의 덕분입니다.","바로 그렇기에 정중히 세대교체를 요청드립니다. 민주주의는 권력을 얻는 것으로 끝나지 않고, 권력을 다음 세대에게 넘겨줄 때 완성됩니다.","산업화 세대가 민주화 세대에게 대한민국을 넘겨주었듯, 이제 민주화 세대가 미래세대에게 민주당을 넘겨줄 차례입니다. 밀어내려는 것이 아니라, 청년에게 사랑받는 정당으로 다음 총선에 이겨 재집권하기를 바라기 때문입니다."]},{"sec":"아름다운 퇴장 ② 민주당은 왜 위기인가 — 반성의 실종","kw":["아름다운퇴장","내로남불","5무정당","반성"],"lines":["위기의 시작은 민주당이 더 이상 반성하지 않기 때문입니다. '내가 틀린 건 아닐까, 국민 마음을 잘못 읽은 건 아닐까'라는 질문이 사라졌습니다. 질문을 멈추는 순간 청년은 떠납니다.","경청은 없고 연설만 있습니다. '우리가 정의다, 우리가 개혁이다'라는 믿음이 어느새 다른 목소리를 듣지 않는 독선이 되었습니다.","실력보다 의리, 정책보다 인맥, 원칙보다 예외가 앞서며 '내로남불'이 탄생했습니다. 우리 편 잘못은 감싸고 다른 편은 단죄합니다. 이 이미지를 벗지 못하면 대통령이 아무리 잘해도 총선·대선은 어렵습니다."]},{"sec":"아름다운 퇴장 ③ 누가 기득권인가","kw":["아름다운퇴장","86용퇴","계파","책임정치"],"lines":["지금 대한민국에서 가장 강한 기득권은 민주당 686입니다. 선배님들이 변한 게 아니라, 너무 오래 권력의 중심에 계셔서 자신도 모르게 기득권이 되신 겁니다.","기득권은 문제를 안 보려 하고 책임지지 않습니다. 청년이 떠나도, 선거에 져도 책임지는 사람이 없고 아무렇지 않게 다시 당대표에 나옵니다.","청년은 기회 한 번 잡기가 하늘의 별 따기이고, 공천 한 번 떨어지면 정치를 접어야 합니다. 민주주의를 위해 싸운 그 용기로, 이제는 권력을 내려놓고 청년에게 물려주는 용기를 보여주십시오."]},{"sec":"아름다운 퇴장 ④ 족보 경쟁을 끝내야 · 힘을 합쳐야","kw":["아름다운퇴장","족보정치","적통논쟁","친명친청","계엄","재집권"],"lines":["적통 논쟁, 족보 캐기 그만하십시오. 누가 원조 친명인지, 누가 DJ·노무현과 더 가까웠는지 청년도 국민도 관심 없습니다. 정책이 족보를, 정책이 계파를 이겨야 합니다.","그만 싸우십시오. 친명·친청 나눌 때가 아닙니다. 둘이 합치는 건 기본이고 모든 민주진보세력이, 합리적 보수까지 끌어와야 다음 대선에서 이깁니다.","재집권에 실패하면 다시 계엄이고 극우의 천국입니다. 이재명 대통령의 성공도 물거품이 됩니다. 지금 당장 족보 캐기와 비방을 중단해 주십시오."]},{"sec":"아름다운 퇴장 ⑤ 왜 지금인가 · 가장 아름다운 퇴장","kw":["아름다운퇴장","AI","세대교체","화염병짱돌","뽑고싶은민주당"],"lines":["민주화 시대엔 짱돌과 화염병, 권력과 싸우는 용기가 무기였습니다. 그러나 AI 시대는 데이터를 이해하는 정치, 기술·산업을 이해하고 세계와 경쟁하는 정치를 요구합니다.","선배님들의 역사는 기념비가 되어야지, 다음 세대를 차단하는 성벽이 되어선 안 됩니다. 세대교체는 총선 필승·재집권 필승 전략입니다.","가장 위대한 계승, 가장 아름다운 퇴장을 김보미가 준비해 드리겠습니다. 과거를 자랑하는 정당이 아니라 미래를 만드는 정당을, 청년이 돌아오고 공정이 살아있는 민주당을 반드시 만들겠습니다."]},{"sec":"당직자 개혁 ① 문제 — 부패 당직자 카르텔: 당원 위에 군림하는 무소불위 권력과 깜깜이 예산","kw":["당직자개혁","당직자카르텔","당권재민","철밥통","깜깜이예산"],"lines":["우리는 흔히 정당의 주인이 당원이라고 말합니다. 하지만 실제 정당의 권력은 어디에 있습니까. 정작 당원들의 목소리보다 더 힘을 발휘하는 것은, 아무도 견제하지 못하는 '당직자의 무소불위 권력'과 '성역화된 깜깜이 예산'입니다.","국회의원의 임기는 정해져 있지만, 중앙당 국장 등 핵심 당직자들은 퇴직할 때까지 자리를 지키는 사실상의 철밥통입니다. 그 결과 3선 국회의원조차 중앙당 국장의 눈치를 보고 두려워하는 기형적인 권력 구조가 만들어졌습니다.","당직자는 엄격한 정치적 중립을 지켜야 함에도, 현실은 당내 정치에 개입하고 선거 구도를 뒤흔들고 있습니다. 선거철만 되면 도당 사무처장 자리를 두고 치열한 암투가 벌어집니다.","제가 겪은 지난 지방선거 경선은 충격적이었습니다. 중앙당 국장이 저에게 직접 연락해, 특정 후보를 낙선시키기 위해 제 명의로 불법 당원 관련 투서를 작성해 달라고 요청했습니다. 정중히 거절하자, 공교롭게도 경선 가감산 지침이 새롭게 만들어졌습니다. 이미 판을 짜놓고 당선자를 미리 스케치한 뒤 한 치의 오차도 없이 경선을 주무르는 권력 — 이것이 개혁되어야 할 민낯입니다.","이들은 한마디로 '법기술자'입니다. 당헌·당규를 주무르며 '단, 달리 정할 수 있다'는 예외조항을 설계하고, 필요하면 가감산 지침을 새로 만들어냅니다. 기득권이 규칙으로 권력을 지킬 수 있도록 뒷받침하는 조력자 — 686 기득권의 고무줄 규칙 뒤에는 그 규칙을 설계해 주는 법기술자 당직자들이 있는 것입니다.","더 큰 문제는 제 식구 감싸기입니다. 일반 기업이나 공직 사회라면 중징계·퇴출감인 사고를 쳐도 유야무야 넘어갑니다. 엄정한 징계도, 객관적인 성과 평가도 없으니 치열함은 사라지고 '어차피 안 잘린다'는 안일함과 부패가 둥지를 틀었습니다."]},{"sec":"당직자 개혁 ② 재정 — 공무원보다 못한 정당 재정, 성역을 없애야","kw":["재정공개","국고보조금","당비","나라살림돋보기"],"lines":["국가 예산을 집행하는 공무원은 세금을 쓸 때 실시간으로 집행 내역을 기록하고, 국민 누구나 검증할 수 있습니다. 그런데 왜 정당만은 성역입니까.","정당이 쓰는 돈은 알 길이 없습니다. 선거가 끝난 뒤에나 대충 내놓는 사후 보고가 전부입니다. 제가 '나라살림 돋보기'로 정당의 예산 쓰임새를 들여다보려 했을 때도 정당의 벽에 막혀 단 한 줄의 내역조차 확인할 수 없었습니다.","당원이 매달 내는 소중한 당비가 어디에 쓰이는지 당원조차 모릅니다. 국민 세금으로 지급되는 국고보조금조차 국민은 쓰임새를 알 수 없습니다."]},{"sec":"당직자 개혁 ③ 약속 — 젊은 사무처·1원까지 실시간 공개·외부 감사","kw":["사무처쇄신","실시간공개","외부감사","정치중립"],"lines":["첫째, 사무처 전면 쇄신 — 철밥통 구조를 깨고 엄정한 평가와 징계 시스템을 도입해, 줄 세우기와 비리로 물든 조직을 감성과 실력을 갖춘 '젊고 치열한 혁신 사무처'로 재편하겠습니다.","둘째, 국고보조금·선거보조금·당비 사용 내역의 실시간 완벽 공개 — 어디에 어떻게 쓰였는지, 어떤 업체와 계약했는지 단 1원까지 투명하게 낱낱이 공개하겠습니다.","셋째, 당직자의 정치적 중립 의무 강화와 재정 외부 감사 도입 — 경선 가감산 지침 등 선거 구도를 사전에 조작하려는 어떠한 시도도 불법 행위로 규정해 즉각 중징계·사법 조치하고, 정당 재정에 엄격한 외부 감사를 도입하겠습니다.","투명하게 공개하고 스스로 쇄신하는 정당만이 국민과 당원의 진정한 신뢰를 얻습니다. 당직자가 주인이 되는 안일한 정당이 아니라, 젊고 깨끗하며 진짜 당원과 국민이 주인이 되는 민주당을 만들겠습니다. 민주당의 당권재민은 재정 투명성과 당직자 전면 쇄신에서 시작합니다."]},{"sec":"첫인사","kw":["소개","출마이유","계파없음","세대교체","공정"],"lines":["국민 여러분, 당원 여러분! 서른여섯, 평당원 김보미입니다.","나이는 어리지만 민주당에서 정치를 한 지 13년이 지났습니다. 강진에서 전국 최연소 기초의회 의장도 지냈습니다.","많은 분들이 묻습니다. '정청래 공격하려 나왔냐, 김민석 도와주려 나왔냐.' 아닙니다. 저는 계파가 없습니다.","686 기득권 정당 민주당을, 청년도 공정하게 경쟁하는 정당으로 만들겠습니다. 저 김보미가 당대표가 되려고 나왔습니다."]},{"sec":"세대교체","kw":["세대교체","86용퇴","화염병짱돌","AI"],"lines":["민주당엔 세대교체가 없습니다. 당대표로 유력한 세 분 모두 386입니다.","AI 3대 강국에 진입하는 대한민국에, 화염병과 짱돌 들고 싸우던 세대가 아직도 민주당의 주인입니다.","이제 세대교체를 해야 합니다. 686이 786, 886까지 가면 민주당은 망합니다.","686은 아름답게 퇴장하고, 청년들이 민주당을 이끌어야 합니다."]},{"sec":"공정","kw":["공정","강진공천","경선혁신"],"lines":["민주당에 공정이 없습니다. 지난 강진군수 경선, 정말 불공정의 극치였습니다.","저에게는 당헌·당규에도 없는 새 지침을 만들어 기어이 15퍼센트를 감산했습니다.","전과가 다섯 개나 있는 상대 후보는 감산을 하나도 하지 않고 공천을 줬습니다. 결국 무소속에게 참패했습니다. 불공정 경선이 빚은 참사였습니다.","경선 규칙 전면 혁신하고, 실력으로 정책으로 공정하게 경쟁하는 정당을 반드시 만들겠습니다."]},{"sec":"민주주의","kw":["민주주의","1인1표","유령당원","신천지","정청래","득표수공개","유리상자"],"lines":["민주당에 민주주의도 없습니다. 정청래 후보는 지난 지방선거에서 가짜·불법 당원을 모았다는 이유로 몇몇 후보자를 징계했습니다.","그래 놓고 그 가짜 불법 당원들이 민주당 후보를 뽑게 했습니다. 이게 1인 1표입니까? 이건 가짜 1인 1표입니다.","선거인 수도, 득표수도 공개하지 않았습니다. 당원들이 내가 뽑은 후보가 몇 표를 얻었는지도 모릅니다. 이게 당원 주권입니까? 이건 가짜 당원 주권입니다.","신천지가 특정 후보를 지원하려 조직적으로 들어왔다는 의혹이 사실이라면, 자신의 투표권을 대리인에게 넘긴 명백한 불법 당원 아닙니까? 불법당원 전수조사해야 합니다.","경선 룰은 6개월 전에 확정하고 절대 바꾸지 않겠습니다. 불법·유령·대리 당원 모두 정리하고, 경선 결과는 100% 공개하겠습니다."]},{"sec":"청년","kw":["청년","기탁금","공영제","청년결정권","이재명"],"lines":["지금 청년들의 삶은 심각합니다. 절망은 필수가 되었고, 희망은 사치가 되었습니다. 그런데 아무도 책임지는 사람이 없습니다.","지역에선 국회의원이 왕입니다. 자기 말을 듣지 않는 청년은 씨를 말립니다.","이재명 대통령이 당대표 시절 당직선거 공영제를 도입하려 했습니다. 기탁금이라도 줄여 놓았더니 오히려 더 올려버렸습니다. 오죽하면 대통령이 나서서 기탁금 깎아주자고 했겠습니까? 이게 어떻게 당무개입입니까?","당직선거 공영제, 저 김보미가 반드시 실현하겠습니다. 청년취업보장제를 민주당 핵심 정책으로 도입하고, 당 청년위원회가 청년 정책 결정권을 갖도록 하겠습니다."]},{"sec":"반도체·호남","kw":["메가프로젝트","반도체800조","호남","균형발전","정청래","농업"],"lines":["이재명 대통령께서 균형발전을 위해 3대 메가프로젝트를 발표했습니다. 호남에는 반도체 800조 투자를 약속했습니다.","그런데 정청래 후보는 '전북은 소외됐다, 반도체 800조는 문재인 대통령 덕분이다'라고 합니다. 본인이 온몸을 바쳐 성공시키겠다 하지 않고 자기 선거에만 이용하고 있습니다.","서울 정치인들은 호남의 피눈물을 모릅니다. 그냥 이용할 뿐입니다. 김보미는 다릅니다. 호남에서 살고 있습니다. 호남의 한을, 설움을 온몸으로 겪었습니다.","호남인 김보미가, 호남이 대한민국의 두 번째 수도권으로 우뚝 서도록 대통령과 함께 3대 메가프로젝트를 반드시 성공시키겠습니다."]},{"sec":"마무리","kw":["유일한후보","계파없음","세대교체","재집권","뽑고싶은민주당"],"lines":["민주당의 모든 문제는 실력과 능력보다 의리와 인맥을 앞세우기 때문입니다. 신세 진 사람, 챙겨야 할 사람이 많으니 불공정과 반민주가 당헌이 되고 말았습니다.","686 세 후보로는 개혁이 안 됩니다. 챙길 사람이 너무 많습니다. 저 김보미는 챙겨줄 사람 한 명도 없습니다. 민주당 개혁을 거침없이 추진할 유일한 후보가 김보미입니다.","686 세 명으로 하는 경선으로는 총선·대선 절대 이길 수 없습니다. 청년 김보미를 본선에 보내 주십시오.","정말 뽑고 싶은 민주당, 청년에게 사랑받는 민주당, 저 김보미가 반드시 만들겠습니다. 감사합니다."]}],"SLOGANS":[["뽑고 싶은 민주당, 뽑고 싶은 김보미",["뽑고싶은민주당","슬로건"]],["새로운 시대, 진짜 실력으로 경쟁하는 공정한 민주당",["공정","세대교체","슬로건"]],["저는 죽어도, 다음 세대는 살아야 하지 않겠습니까",["청년","세대교체","슬로건"]],["이번 생엔, 계란으로 바위를 깁시다",["계란과바위","슬로건"]],["역사상 가장 가난하지만, 가장 많은 사람이 함께하는 캠프",["계파없음","재산","슬로건"]],["돈도 없고 빽도 없습니다. 저의 빽도 여러분, 후원자도 여러분, 대변인도 여러분입니다",["계파없음","슬로건"]]],"PLEDGES":[["① 유리상자 경선",["유리상자","공정","득표수공개"],"경선 결과 전량 공개·룰 6개월 전 동결 등 공정 회복. 유권자와 후보가 득표수를 아는 '유리상자' 경선."],["② 진짜 1인 1표",["1인1표","유령당원","선호투표"],"실명·거주 인증, 당원국회 등 당원주권 실질화. 유령·대리 당원 정리로 '가짜 1인1표' 종식."],["③ 청년 결정권",["청년결정권","청년","청년최고위원"],"청년 예산 10%, 정책 오디션, 청년위원회 정책 결정권, 선출직 청년최고위원."],["④ 미래 설계 정당",["AI","메가프로젝트","기후위기","농업"],"미래전략원 설치, AI 대전환 준비. 'AI 다음은 농업' — 기후위기=식량위기 대응."],["⑤ 성장 사다리 정당",["공천","공영제","균형발전"],"풀뿌리 사다리·공정 경쟁 공천, 당직선거 공영제로 돈 없어도 도전하는 정당."]],"PLEDGES11":[["1","경선 규칙은 선거 6개월 전에 확정 — '고무줄 규칙' 폐지",["경선혁신","공정","유리상자","공천"],"당대표·최고위원 선거와 국회의원·지방선거 후보 경선의 주요 규칙을 선거일 6개월 전까지 확정하고, 어떤 경우에도 바꿀 수 없도록 당헌·당규에 못 박는다. 특정인을 심기 위해 만들어 놓은 수많은 예외규정, \"달리 정할 수 있다\"는 단서조항을 모조리 없앤다. 사람에 따라, 지역에 따라 규정이 달라지는 일은 다시는 없을 것."],["2","가짜당원·유령당원 정리 — 모든 경선 결과 100% 공개",["1인1표","유령당원","득표수공개","유리상자","신천지"],"내가 찍은 후보가 몇 표를 얻었는지도 모르는데 당원주권을 어디 가서 찾겠는가. 이번 전당대회만 해도 선거인명부 열람 기간이 단 하루였다. 당원명부를 행정안전부 주민등록 자료와 대조하고 자발적 가입 여부를 전수 확인해 정비한다. 경선 결과는 득표수까지 후보자와 당원에게 전부 공개한다. 공개하지 못할 경선이라면 공정한 경선이라 말할 수 없다. '당원 500만'? 자격 검증 없는 1인1표는 기득권을 지키기 위한 가짜 민주주의일 뿐."],["3","당비 월 1만원 — 이름뿐인 권리당원이 아닌 '진짜 권리당원'의 정당",["당원주권","당비","1인1표"],"민주당 운영비 대부분은 국고보조금·선거보조금이다. 올해 지방선거에서도 258억 원의 선거보조금을 받았다. 그런데 당원들은 30년째 한 달에 1천 원을 낸다. 겨우 1천 원 내고 당원주권 정당이라 우기는 것, 민망하지 않은가. 당비를 월 1만 원으로 하고 6개월 이상 낸 당원만 권리당원으로 인정한다. 공당의 후보 선출권은 아무나 갖지 못하는 권리 — 그 무게에 비하면 월 1만 원은 결코 큰돈이 아니다."],["4","토론과 연설로 실력을 겨루는 공천 — 토론 불참 감점",["토론회","공천","공정","경선혁신"],"억지로 입당원서 받아 놓고 경선 전화 오면 나를 찍어 달라는 경선 — 686 기득권에겐 더없이 행복한 경선이지만 새로 도전하는 청년에겐 철벽같은 칸막이다. 당대표·최고위원은 물론 국회의원·자치단체장 경선까지 충분한 공개토론과 유권자 앞 연설회를 보장한다. 조직 동원이 아니라 실력과 정책으로 겨루는 공천. 정당한 사유 없이 토론에 불참한 후보는 감점 — 민주주의는 토론으로 완성된다. 토론을 피하는 후보에게 민주당의 이름을 맡길 수 없다."],["5","선호투표제 항구 제도화 — 예비경선도 충분한 선거운동 보장",["선호투표","컷오프","1인1표","동영상촬영회"],"이번 전당대회에 처음 도입된 선호투표제를 일회성으로 끝내지 않고 모든 경선에 항구적으로 제도화한다. 1순위는 물론 2순위 지지까지 버리지 않는 것이 진짜 당원주권. 예비경선(컷오프)은 후보가 6명 이상 등록했을 때만 실시하고, 하더라도 2주 이상 선거운동 기간을 보장한다. 청년 진입을 가로막는 5일짜리 예비경선, 후보를 딱 한 번 앉혀 놓고 7분 연설만 시키는 '동영상 촬영회'는 없앤다. 대신 누구나 참석하는 연설회와 후보 간 토론회 최소 3회 이상을 보장한다."],["6","기탁금 폐지 — 당직선거 공영제 실시",["기탁금","공영제","청년","기탁금감액"],"이번 전당대회 기탁금은 당대표 8천만 원, 최고위원 3천만 원. '과하다'는 비판에 2천만 원씩 깎고도 이 액수다. 돈 없는 청년에게 이것은 출마하지 말라는 말과 같다. 기탁금 제도를 완전히 폐지하고 선거비용을 당이 부담하는 당직선거 공영제를 도입한다. 돈도 계파도 없는 청년이 당대표·최고위원·국회의원·지방의원에 도전할 수 있게 한다. 정치는 돈이 아니라 비전과 실력으로 경쟁해야 한다."],["7","청년에게 자리가 아니라 권력과 권한 — 청년 기준 45→40세",["청년결정권","청년최고위원","청년","2030"],"청년 나이 기준을 현행 45세에서 40세로 낮춘다. 8년 만에 부활한 청년최고위원을 일회성 이벤트로 끝내지 않도록 선출직으로 당헌에 명문화하고, 지명직 최고위원 2명도 청년으로 임명한다. 당 청년위원회를 청년정책의 최고 의결기구로 격상하고, 청년위가 결정한 정책은 당이 책임지고 입법하도록 의무화한다. 청년이 민주당을 떠난 것이 아니라 민주당이 먼저 청년을 버렸다. 선거 때만 청년을 앞줄에 세우고 끝나면 돌려보내는 일, 다시는 반복하지 않는다."],["8","철밥통 사무처를 역동적인 사무처로",["사무처개혁","세대교체","계파"],"정당은 국민의 삶과 함께 숨 쉬는 조직이고, 국민의 요구를 정책으로 만들어 내는 역동성이 생명이다. 그런데 지금 민주당 사무처는 공무원보다 심한 철밥통 — 징계도, 긴장도, 세대교체도 없다. 5060이 주도하는 관료화된 사무처가 무슨 개혁을 하겠는가. 직무평가와 책임인사를 제도화하고, 관료주의에 물든 조직에 참신한 청년 인재를 대거 수혈한다."],["9","국회의원·자치단체장·지방의원 모두 — 같은 지역구 3선 초과 금지",["3선배제","세대교체","공천","86용퇴"],"연달아 했든 건너뛰어 했든, 같은 지역구에서 합계 세 번을 지냈다면 더는 공천하지 않는다. '동일 지역구 3선 초과 공천 금지'를 당헌·당규에 제도화한다. 민주당 혁신위원회도 이미 제안했던 방안 — 이제는 실행할 때다. 세대교체 없이 2030년 재집권은 어렵다. 스스로 물러날 사람은 없다. 제도로 교체가 이루어질 수밖에 없도록 만드는 것이 유일한 길이다."],["10","'검찰 저격수'를 넘어 '국민 삶의 설계자'로 — 미래전환위·7대 미래산업",["검찰개혁","메가프로젝트","AI","미래전환위","기후위기"],"검찰개혁과 내란 청산은 반드시 완수해야 한다. 그러나 민주당이 국민에게 내놓을 의제가 그것뿐일 수는 없다. 과거에 복수하는 '복수혈전 민주당'을 미래를 여는 '미래선도 민주당'으로 바꾼다. 대통령과 함께 반도체·AI 데이터센터·피지컬 AI의 3대 메가프로젝트를 반드시 성공시킨다. 당대표 직속 미래전환위원회를 설치하고 AI·반도체·로봇·재생에너지·바이오·양자·우주항공을 7대 미래산업으로 키운다. 최고위원회의가 미래산업과 민생경제를 정례 점검하고, 당 소속 지방정부와 지역별 산업 육성 전략을 직접 챙긴다."],["11","16세 당원부터 50년 당원까지 — 정치교육·정책교육 강화",["당원교육","청년","당원주권"],"2022년 정당법 개정으로 16세면 법정대리인 동의 아래 당원이 될 수 있고 18세면 선거
