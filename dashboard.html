떠난 게 아닙니다. 민주당이 청년을 밀어낸 것입니다."],["김보미","한 아이를 키우려면 온 마을이 필요하다고 하는데, 온 마을이 김보미를 키워 주셨다."]],"notes":["마무리 질문 — 계란·온마을로 감정선을 닫는 것이 가장 강함."]},{"no":2851,"media":"⚠️ 교차점검","q":"【게재 전 최우선 처리 5건】 신동아·기자님 답변지를 대조해 찾은, 말하기 전에 정리해야 할 것들","tags":["교차점검","최우선","신동아","기탁금","정청래","4무공천"],"script":["★ 1) 예비경선 기간 — 달력 4일, 공휴일 빼면 실질 이틀 미만, 실제 선거운동 48시간 — 셋 다 같은 이야기. \"달력으로는 4일인데 공휴일 빼면 이틀도 안 됐고, 그나마 서류와 후원회에 다 써서 실제 운동은 48시간\"으로 한 문장에 담을 것.","★ 2) 정청래 후보 '4무 공천 사기극' — '사기'는 범죄를 함의하는 단어인데 '4무'가 무엇인지 어느 문서에도 정의돼 있지 않음. 4무의 내용과 근거를 준비하거나 \"책임지지 않은 공천\" 같은 평가 표현으로 완화.","★ 3) 공약 개수 66개 vs 25개 — 66개는 강진군수 경선, 25개는 당대표 경선. 나란히 인용되면 충돌로 읽히니 반드시 한정어를 붙일 것.","★ 4) 부록 A 항목 수 — 본문은 \"5대 분야 25개\"인데 실제 부록 항목은 35개. 세어 보면 어긋남.","★ 5) 김어준 발언 축자 인용 — \"당선도 안 될 건데 왜 나왔느냐\"를 따옴표로 인용. 방송명·날짜를 병기하거나 간접 인용으로 전환."],"quotes":[],"notes":["내일 인터뷰 전에 이 5건만이라도 정리해 두면 반박·정정 요구를 막을 수 있음."],"warn":"이 카드는 발언용이 아니라 사전 점검용입니다. 그대로 읽지 마세요."},{"no":2852,"media":"⚠️ 교차점검","q":"【두 문서 간 모순 7건】 신동아와 기자님 답변지에서 서로 다르게 말한 것","tags":["교차점검","모순","후원회","기탁금","청년취업보장제"],"script":["후원회 타임라인 — 답변지 Q3은 \"겨우 개설해 하루 정도 모금하고 컷오프\", 신동아는 \"후원회 만드는 데 이틀\". 물으면 \"개설까지 이틀, 승인 뒤 모금은 하루\"로 정리.","기탁금 액수 — 신동아에만 \"돈을 빌려 등록\"이 있고 답변지에는 액수도 차입 사실도 없음. 기자가 반드시 묻는 항목이니 정확한 액수를 양쪽에 동일하게.","7대 미래산업 vs 7대 시드산업 — 답변지 부록은 '미래산업', 신동아 6번은 '시드산업'. 정부 공식 명칭으로 통일.","국가청년취업보장제 vs 청년취업보장제 — 대표 공약 이름이 세 곳에서 갈림.","경선 중 숙박 장면 — \"렌터카에서 쪽잠\" / \"방 얻기를 포기하고 오가는 편\" / \"뿔뿔이 흩어져 잤다\" 세 가지가 병존. 한 장면으로 정리.","강진군수 경선 — 답변지 Q3은 \"컷오프\", 신동아 3번은 경선에 참여했으나 상대가 후보가 된 서술. 기자가 반드시 확인할 지점.","중립 주장과 실명 평가의 비대칭 — 신동아는 \"세 후보 모두에게 세대교체를 말했다\"인데, 답변지는 김민석만 실명 환영·정청래만 실명 비난. \"결국 한쪽 편 아니냐\"는 반박이 나옴."],"quotes":[],"notes":[]},{"no":2853,"media":"⚠️ 교차점검","q":"【문서 내부 모순 9건】 같은 문서 안에서 숫자가 어긋나는 것","tags":["교차점검","내부모순","청년월세지원","86세대","입당13년"],"script":["3단계 실행 로드맵 — Q8·Q29에서 두 번 언급되지만 부록 어디에도 3단계가 정의돼 있지 않음.","동일 지역구 공천 제한 — 부록 A-2는 \"3선 초과 금지\"(4선부터), 부록 B-9는 \"3회 이상 금지\"(3선부터). 같은 홍대선언 9번인데 강도가 한 선 차이.","청년월세지원 '인상' — 현행 월 최대 20만 원을 \"20만~30만 원으로 인상\"이라 하면 하한이 현행과 같아 인상이 성립하지 않음. \"월 30만 원으로 인상\"이 깔끔.","'서울 월세의 3분의 1도 안 된다' — 같은 문서가 월세를 50만~100만 원으로 잡았으니 50만 원 기준이면 20만 원은 40%로 3분의 1을 넘음.","'지난 7월부터 검토 … 몇 달째' — 문서 시점이 2026년 8월이라 올해 7월이면 한 달. 연도를 밝혀야 성립.","86세대 '30년, 40년째' — DJ의 젊은피 수혈은 1996년 계열로 2026년 기준 약 30년. 40년째는 발탁 이전.","입당 13년째 vs 14년째 — 2013년 입당 기준이면 2026년은 14년째. 첫 당선(2014년) 기준이면 13년째.","Q23 결번 — 답변지 질문 번호가 Q22에서 Q24로 건너뜀.","'86세대'와 '686' 표기 혼용 — 신동아는 전부 686."],"quotes":[],"notes":[]},{"no":2854,"media":"⚠️ 교차점검","q":"【팩트체크·법적 노출 14건】 기자가 근거를 물을 대목","tags":["교차점검","팩트체크","법적리스크","반도체800조","모병제","정청래"],"script":["★ 근거 서류를 미리 챙겨 둘 것 — 피선거권 10년 박탈 조항, 가처분 관련 당 공문 원본, 경선 규칙 사후 수령 및 선거인명부 열람 하루 관련 당 공지 일자. 사실이면 기사의 핵심이 될 대목입니다.","대통령 3회 탄핵 소추 — 소추 의결과 인용은 다름(노무현은 기각). \"대통령 탄핵소추 3회\"로 한정하는 편이 정확.","검찰개혁 20년째 — 기산점이 불명확. 참여정부면 23년, 문재인 정부면 9년.","맘다니 '저보다 동생뻘' — 2013년 23살 입당 기준이면 1990~91년생으로 맘다니(1991년생)와 사실상 동년배. 빼는 편이 안전.","프랑스·스웨덴 사례 — 마크롱 39세·아탈 34세는 부합하나 실명이 없음. 스웨덴 \"20대 의원이 흔하다\", \"청년조직이 인사권 보유\"는 통계·근거 필요.","반도체 800조 — 금액·지역·주체를 원출처로 확인.","ISA·최저임금·5만 호 수치 — 세제개편안 원문, 해당 연도 최저임금 세후 환산액, 공급 대책 실제 호수와 대조.","신문식 지역위원장 — 실명과 당시 직함 확인.","모병제 전환 공약 — 본문에는 없고 부록 A-5에만 있는데 공개 시 가장 크게 기사화될 수 있는 안보 공약. 의도한 공약이 맞는지 확인.","정청래 강진 현장 서술 — \"공천장 수여식에 상여까지 등장, 정문으로 들어가지 못했다\"는 구체적 행적 적시. 사진·보도 등 입증자료 없이 게재하면 정정보도 청구 대상.","강진군수 경선 상대 후보 — 이름은 없지만 특정이 즉시 가능하고 \"공약이 하나도 없었다\"는 검증 가능한 사실 적시.","황희 의원 '본인들은 쾌적한 집에 살면서' — 개인의 주거 상황을 근거 없이 끌어들이는 부분은 인신공격으로 읽힘.","타 정당 '민주당과 한 몸' — 조국혁신당·정의당·기본소득당의 공개 반박·정정 요구를 부를 수 있음."],"quotes":[],"notes":[],"warn":"실명 인물에 대한 사실 적시는 입증자료 없이 반복하지 말 것."},{"no":2380,"media":"TV조선","q":"앵커멘트: 서른여섯 나이로 민주당 당대표 선거에 출마해 화제를 모았던 분입니다. 김보미 전 강진군의회 의장과 이야기 나눠보겠습니다. (인사)","tags":["첫인사","감사","기득권바위"],"script":["안녕하십니까, 김보미입니다. 먼저 감사드립니다.","★ 이번 경선에서 확인했습니다. 당원들은 유불리가 아니라 가치와 미래를 보고 표를 던졌습니다. 그 한 표 한 표가 기득권이라는 바위에 금을 내고 있습니다."],"quotes":[],"notes":[]},{"no":2381,"media":"TV조선","q":"Q1. 최근 민주당 당대표 선거에 도전하셨다가 예비경선에서 탈락하셨는데요. 당대표 출마를 결심했던 결정적 계기 뭐였습니까?","tags":["출마계기","5무","참패","사이렌","회초리"],"script":["★ 민주당은 지방선거에서 참패했습니다. 그런데 반성도 사과도 없습니다. 하도 답답하고 화가 나서, 높으신 분들은 죽었다 깨어나도 모르는 바닥 민심을 전하러 국민 대신 회초리 들고 출마했습니다.","출마 선언에서 약속했습니다. 민주당에 없는 다섯 가지 — 공정, 민주주의, 청년, 미래, 세대교체를 찾아오겠다고 했습니다.","★ 지금 민주당은 민생은 뒷전이고 족보 캐기, 적통 논쟁만 붙들고 있습니다. 뭣이 중헌지 모릅니다. 오죽 답답하면 평당원이 목청껏 외치겠습니까."],"quotes":[],"notes":[]},{"no":2382,"media":"TV조선","q":"Q2. 당 지도부가 당일에 예비경선 결과를 비공개로 바꿔서 '이장 선거도 이렇게 하지 않는다'고 비판하셨죠. 본인이 당원들의 선택을 얼마나 받았는지 지금은 알고 계십니까?","tags":["결과비공개","이장선거","정보의불공정","공개요구","충북투표중단"],"script":["★ 지금도 모릅니다. 결과를 안 줬으니까요. 후보인 저도, 저를 찍은 당원도 모릅니다. 이장 선거도 이렇게는 안 합니다.","당은 경선 당일에 득표율 공개 방침을 비공개로 바꿨습니다. 그런데 다른 후보들은 다 아는 것 같습니다. 기득권만 정보를 쥐고 있습니다. 이것이 정보의 불공정입니다. 이래 놓고 민주당에 '민주'가 있다고 할 수 있습니까.","★ 깨끗하게 공개하면 될 일입니다. 경선 규칙 6개월 전 확정, 누구는 붙이고 누구는 떨어뜨리는 요술 방망이 — '달리 정할 수 있다' 예외 단서조항 삭제, 기탁금 폐지, 결과 100% 공개. 제가 발표한 공약입니다. 목이 터져라 외쳐도 소 귀에 경 읽기, 개가 짖든 말든 기차는 간다는 식이어서야 되겠습니까.","(여유가 있으면) 본경선 첫날에는 충북 당원들이 오류 때문에 한 시간 가까이 투표 접속조차 못 했습니다. 당은 시간만 연장하고 설명도 사과도 없었습니다. 이런 선관위를 당원이 어떻게 믿습니까. 시스템을 검증하지 않는 정당에서는 같은 사고가 반복됩니다."],"quotes":[],"notes":[]},{"no":2383,"media":"TV조선","q":"Q3. 출마선언에서 전당대회를 '화려한 뱃지들의 리그'라고 했는데, 지금 경선 결과를 보면 결국 그 화려한 리그가 됐는데요. 당에 세대교체가 필요한 이유, 그리고 세대교체가 되지 않는 이유는 뭐라고 생각하십니까?","tags":["화려한뱃지들의리그","세대교체","2030전무","설계된결과","무당층","시대정신"],"script":["★ 결과가 말 그대로 '686 총충돌, 화려한 뱃지들의 리그'입니다. 기울어진 운동장이 아니라, 운동장에 들여보내 주지도 않기 때문입니다. 기탁금 1천만 원을 받고 토론회는 한 번도 없었습니다. 결과는 감췄습니다. 지난 지방선거에서 겪은 불공정이 도돌이표처럼 그대로 반복됐습니다. 빽 없는 청년은 운동장에 들어갈 수도 없습니다.","왜 필요한가. 청년층의 절반이 무당층입니다. 2030 없이 총선도 대선도 못 이깁니다. 김대중 대통령이 30대 김민석을 발탁했을 때 2030 지지율이 가장 높았습니다. 답은 이미 나와 있습니다.","★ 그래서 제도를 바꾸자는 것입니다. 2030 당사자가 예산과 정책을 결정하는 테이블에 앉아야 합니다. 세대교체는 더 미룰 수 없는 시대정신입니다."],"quotes":[],"notes":[]},{"no":2384,"media":"TV조선","q":"Q3-1. 정청래 전 대표 면전에서 '지선 패배 책임을 져야 할 분이 연임한다고 나오셨다'고 직격한 게 화제가 됐습니다. 객석에서 '시간 끝났다 그만하라'는 야유도 많던데, 무슨 생각 하셨습니까?","tags":["정청래직격","야유","책임","이견처벌","격려전화"],"script":["저에게는 발언 기회가 없었으니, 야유 속에서도 그 1초가 소중했습니다. 실제로 기탁금 1천만 원을 내고 받은 기회가 7분 동영상 촬영 한 번이 전부였습니다.","★ 저는 사람이 아니라 책임을 물었습니다. 지방선거에서 졌으면 당대표가 책임지는 것이 당연합니다. 그런데 사과해야 할 분이 한 번 더 하겠다고 나오셨습니다. 책임지지 않는 정치를 민주당에 처음으로 도입한 '책임정치 파괴범'입니다. 당원을 무시하는 일 아닙니까. 그 질문조차 야유로 입을 틀어막는 문화 — 그것이 민주당의 현주소이자 문제입니다."],"quotes":[],"notes":["⚠ 사람이 아니라 '책임과 문화'를 묻는 프레임 유지 — 정청래 추가 비판으로 확전하지 말 것"]},{"no":2385,"media":"TV조선","q":"Q4. 출마 선언에서 '민주당이 총체적 망조로 가고 있다'고 일갈하셨는데, 가장 크게 잘못된 점은 뭐라고 생각하십니까? 당대표가 된다면 무엇을 먼저 바꾸고 싶으신가요?","tags":["망조","불신","재창당","금고","깜깜이당비","12개공약"],"script":["★ 불신입니다. 분열은 불신에서 자랍니다. 지금 누가 민주당의 시스템을 믿습니까. 민생은 뒷전이고 밥그릇 싸움뿐입니다. 재창당 수준으로 혁신해야 합니다.","★ 제가 대표가 되면 당의 가계부부터 열겠습니다. 국민은 혈세의 사용처를 실시간으로 확인하는데, 정당은 사후 보고가 전부입니다. 민주당도 국민의힘도 똑같습니다. 깜깜이 당비 — 왜 정당만 성역입니까?","투명하지 않은 정당은 공정할 수 없습니다. 저는 지금도 '재정주권 시민행동' 공동대표로 이 운동을 하고 있습니다.","(여유가 있으면) 저는 예비경선 결과가 나오기 전에 '민주당 갈아엎기 대전환 선언'을 발표했습니다. 결과와 상관없이, 길을 잃은 민주당이 가야 할 방향을 제언한 것입니다. 당대표가 누가 되더라도, 사람이 바뀌어도 바뀌지 않는 시스템을 만들겠다고 약속했습니다. 그 약속을 지키기 위해 제가 할 수 있는 자리에서 최선을 다하겠습니다."],"quotes":[],"notes":[]},{"no":2386,"media":"TV조선","q":"Q5. 이번 전당대회에서 청년최고위원 도입이 논란 끝에 무산됐습니다. 국민의힘에는 있는 제도지만 '무늬만 청년'이라는 비판도 많은데, 그럼에도 필요하다고 생각하십니까?","tags":["청년최고위원제","전준위만장일치","최고위부결","무늬만청년","결정권"],"script":["필요합니다. 지금 민주당에는 '무늬만 청년'조차 없습니다. 청년을 병풍처럼 세워 놓고 사진만 찍는, 말로만 청년입니다.","★ 청년의 삶을 결정하는 테이블에 청년이 앉아야 청년의 정책이 나옵니다. 그것이 본질입니다."],"quotes":[],"notes":[]},{"no":2387,"media":"TV조선","q":"Q6. 수도권 집값이 화제고 정부 정책도 집값 잡기에 집중돼 있지만, 인구 소멸 위험 도시가 많은 전남의 걱정은 집값이 아닐 것 같습니다. 중앙에서 더 신경 썼으면 하는 이슈가 있습니까?","tags":["지방소멸","전남","청년일자리","새로운산업","청년취업보장제","미래대응기금","강진","국가의제"],"script":["★ 전남은 집값이 아니라 사람이 떠나는 것을 걱정합니다.","청년이 떠나는 이유는 배울 곳, 일할 곳, 정착할 곳이 없어서입니다. 답은 청년의 일자리, 새로운 산업입니다. 그래서 저는 지역 안에 배우고, 취업하고, 정착하는 사다리 — '청년취업보장제'를 제안해 왔습니다. 미래대응기금도 지역 청년이 설계에 참여해야 합니다. 서울에서 설계하면 서울 정책만 나옵니다.","★ 강진만의 문제가 아닙니다. 지역의 문제는 대한민국의 문제입니다. 청년이 지역에서 살 수 있어야 수도권 집값도 풀립니다."],"quotes":[],"notes":[]},{"no":2388,"media":"TV조선","q":"Q7. 민주당은 오늘 검찰의 보완수사권 폐지 법안을 본회의에서 강행 처리할 계획입니다. 청년 정치인 입장에서 검찰 수사권 완전 박탈이 맞다고 보시는지, 강행 처리는 어떻게 보십니까?","tags":["보완수사권","갤럽61","2030여론","정청래","김민석","피해자편","검경견제"],"script":["저는 검찰개혁을 부정하지 않습니다. 정치검찰의 폐해는 반드시 바로잡아야 합니다. 다만 방법이 문제입니다.","★ 보완수사권 유지는 국민의 뜻입니다. 한국갤럽 7월 조사에서 유지 61%, 전면 폐지 23%입니다. 특히 2030은 더 확실합니다. 20대 66%, 30대 70%가 유지입니다. 폐지를 강행하면 2030은 더 멀어집니다.","민주당 지지층에서조차 폐지는 다수가 아닙니다. 유지 46%, 폐지 39%입니다. 그런데도 686 세 후보는 모두 폐지를 외칩니다. 민주당은 집권여당입니다. 당원에게 박수받는 정치가 아니라, 국민에게 책임지는 정치를 해야 하지 않습니까.","왜 필요한가. 경찰 수사는 완벽하지 않고, 경찰이 관련된 범죄도 많습니다. 견제 장치가 없으면 어떻게 되겠습니까. 대통령의 '엄격한 조건 아래 최소한'이라는 입장처럼, 최소한의 보완수사권은 남기되 요건과 절차를 엄격하게 제한하면 됩니다. 그것이 균형입니다.","그런데 정청래 전 대표는 묻지마 폐지를 외칩니다. 대통령과 생각이 다르면 조율하고 대화해야 하는데, 조율했다는 이야기를 들어 본 적이 없습니다. 이 갈등이 당대표 재선에 도움이 된다고 본 것 아닙니까. 머릿속에 국민이 아니라 당권 욕심보따리만 가득한 것입니다.","김민석 후보도 속으로는 유지 입장이라고 저는 봅니다. 당원표가 무서워 말을 못 할 뿐입니다. 이 정도 여론이면 '당원표를 잃더라도 국민을 지키겠다'고 소신 있게 승부를 걸었어야 합니다.","★ (중요) 보완수사권을 폐지하겠다는 것은, 국가가 범죄 피해자 편이 아니라 범죄 가해자 편에 서겠다고 선언하는 것과 같습니다.","민주당은 오늘 법안을 통과시키겠지만, 2028년 총선이 끝나면 반드시 후회할 것입니다. 앞으로 2년, 억울한 범죄 피해자와 관련된 보도가 하루가 멀다 하고 터져 나올 것입니다.","★ 정치검찰도 안 되지만, 경찰 독주도 안 됩니다. 검찰과 경찰은 서로 견제해야 합니다."],"quotes":[],"notes":["✔ 교차검증(한국갤럽 7.14~16, 1,003명, ±3.1%p): 유지 61% vs 폐지 23% / 20대(18~29) 유지 66%, 30대 70% — 경향·뉴시스 등 복수 보도로 확인","⚠ 민주 지지층 46% vs 39%는 오차범위 내 — '유지가 더 높다' 단정 대신 '폐지가 다수가 아니다'로 말할 것(문항 편향 반론 대비)","⚠ 정청래·김민석 실명 직격 — '저는 ~라고 봅니다' 프레임 유지, 수위는 현장 판단 / '대통령과 조율 안 했다'는 단정 대신 '조율했다는 이야기를 들어 본 적이 없다'가 더 안전"]},{"no":2389,"media":"TV조선","q":"Q8. 진보와 보수로 나뉘어 협치와 화합을 이루지 못하는 고질적 갈등 — 극한으로 치닫는 진영 갈등을 풀려면 정치권이 어떤 역할을 해야 한다고 보세요?","tags":["진영갈등","헌법정신","소통부재","고함사건","5일경선","민생공통분모","토론일상화"],"script":["★ 여야를 막론하고, 지금 국회의 풍경은 헌법 정신과 거리가 멉니다. 국민은 공감하지 못합니다.","갈등의 원인은 소통할 시간이 없다는 것입니다. 이번 경선에서도 상대 후보가 저에게 고함을 쳤습니다. 5일짜리 경선에 토론도 소통도 없었으니까요.","★ 먼저 싸울 이유가 없는 민생부터 같이 처리하면 됩니다. 청년 일자리, 주거, 지역소멸. 얼굴을 보고 토론하는 것이 일상이 되어야 합니다."],"quotes":[],"notes":[]},{"no":2390,"media":"TV조선","q":"Q9. 이번 도전이 30대 청년 정치인에겐 값진 경험이었을 텐데, 앞으로의 비전과 계획이 무엇인지 말씀 부탁드립니다.","tags":["비전","재정주권시민행동","국민에게줄선다","도전정신적통","계란","이제시작"],"script":["저는 계속 갑니다. 민생 중심, 미래 중심, 진짜 당원 중심의 정당 — 꺾이지 않는 마음으로 만들겠습니다. '재정주권 시민행동', 예산 바로보기 운동도 넓혀 갑니다.","★ 저는 돈도, 빽도, 계파도 없이 오직 국민에게 줄을 서 왔습니다.","민주당의 역사는 김대중, 노무현의 계란으로 바위 치기 역사입니다.","★ 적통, 적통들 하시는데 — 김보미가 그 도전정신의 적통을 잇겠습니다. 전국에서 수많은 김보미 같은 계란들이 꿈틀꿈틀 움직일 것입니다. 계란들의 도전은 이제 시작입니다."],"quotes":[],"notes":[]},{"no":2391,"media":"TV조선","q":"마무리 (앵커: 김 전 의장님 말씀은 여기까지 듣겠습니다)","tags":["마무리","도전은지지않았다"],"script":["(한마디 기회가 있으면) ★ 결과는 졌어도 도전은 지지 않았습니다. 감사합니다."],"quotes":[],"notes":[]},{"no":2392,"media":"TV조선","q":"📌 [내부용] TV조선 대응 메모 (문서 미수록)","tags":["내부용","TV조선","금지사항"],"script":["★ 앵커멘트 '서른여섯' — 정정하지 말 것. 날 선 내용일수록 웃으면서, 목소리 높이지 말 것.","★ Q7(보완수사권): 오늘 처리 '계획' 단계 — '처리했다' 단정 금지. '반대한다' 단어 금지, 국민 안전·검경 견제 프레임만.","★ Q3-1(정청래): 사람이 아니라 책임·문화를 묻는 프레임 — 추가 비판으로 확전 금지.","⚠ 금지: 특정 후보 지지 표명 / 송영길 돈봉투·재판 / 신천지 단정(의혹까지만) / 장윤기 사건 세부 / '3060'·'고마해라'·신당 논의 / 확인 안 된 숫자('무당층 절반'은 방송 전 재확인)","되돌아갈 세 문장: ① 저는 국민 대신 회초리를 들었습니다 ② 지금이라도 공개하십시오 ③ 계란들의 도전은 이제 시작입니다"],"quotes":[],"notes":["※ 대시보드 내부 참고용 — 배포 문서 미수록"]},{"no":2340,"media":"문화일보","q":"Q1. 전당대회에서 청년 정치인들이 모두 낙선했다. 원인이 무엇이라고 보나.","tags":["청년전멸","설계된결과","기탁금4배","청년최고위원부결","검증의링부재","득표비공개","족보의벽"],"script":["★ 설계된 결과입니다. 청년 후보들이 유독 부족해서 떨어진 것이 아니라, 통과할 수 있도록 설계돼 있지 않았습니다.","★ 네 겹의 문이 순서대로 닫혔습니다. 첫째, 제도에서 지웠습니다. 전당대회준비위원회가 만장일치로 의결한 청년최고위원제를 최고위원회가 부결시켰습니다. 둘째, 돈으로 막았습니다. 최고위원 예비경선 기탁금이 500만 원에서 2,000만 원으로 네 배 올랐습니다. 셋째, 기회를 봉쇄했습니다. 후보들이 맞붙어 검증받는 토론회 없이 선거운동은 사실상 나흘이었습니다. 넷째, 결과를 감췄습니다. 지금까지도 제가 몇 표를 받았는지 모릅니다.","★ 여기에 하나가 더 있습니다. 족보의 벽입니다. 계파가 없으면 유령 취급을 받고, 사진 한 장 찍히면 '누구 파냐'부터 검증받습니다. 저는 5대 분야 25개 정책공약과 '민주당 대전환 선언문' 12개 과제를 냈는데, 정책은 보지도 않고 십몇 년 전에 누구와 사진을 찍었는지부터 파묘가 시작됐습니다.","★ '청년들이 준비가 안 됐다'는 말이 나옵니다. 그런데 실력을 보여 줄 링 자체가 없었습니다. 합동연설회 한 번이 전부였고, 첫 방송토론은 컷오프가 다 끝난 뒤에야 열렸습니다. 검증은 걸러내기 전에 해야 검증이고, 걸러낸 뒤에 하면 홍보입니다. 평가받을 기회를 주지 않고 평가가 낮았다고 말하는 것은 앞뒤가 맞지 않습니다.","★ 그 결과가 지금 눈앞에 있습니다. 당대표와 최고위원 본선 진출자 가운데 2030은 한 명도 없습니다. 반대로 당대표 본선에 오른 세 분은 모두 686 세대입니다. 제가 출마 선언에서 '청년이 없다, 세대교체가 없다'고 말한 것이 예언이 아니라 관찰이었다는 것을 이번 전당대회가 스스로 증명한 셈입니다."],"quotes":[],"notes":["✔ 기탁금 4배는 최고위원 예비경선 기준","✔ '토론회 0회'가 아니라 '7.20 합동연설회 한 번 외 검증 토론회 없음 / 첫 방송토론은 컷오프 뒤'","⚠ 본선 세 후보 실명 비판·지지 표명 금지 — 세대 구성 사실만"]},{"no":2341,"media":"문화일보","q":"Q2. 전당대회에서 청년 아젠다가 나왔지만 높은 기탁금, 청년최고위원제 도입 무산으로 이어지며 '선거철에만 쓰였다 버려진다'는 현상만 강화했다는 비판이 있다. 어떻게 보나.","tags":["선거철소모품","말은늘고자리는줄었다","선호투표제거래","병풍","당헌에새긴결정권","5무"],"script":["★ 그 비판에 반박할 말이 없습니다. 동의합니다. 이번 전당대회가 그 비판의 가장 정확한 증거입니다.","★ 순서를 보시면 분명합니다. 7월 7일 전당대회준비위원회가 청년최고위원제를 만장일치로 의결했습니다. 그런데 7월 14일 최고위원회가 그것을 부결시켰고, 같은 날 최고위는 선호투표제를 의결했습니다. 청년이 앉을 자리는 지우고, 표를 계산하는 방식은 바꾼 것입니다. 당내에서조차 두 사안이 거래된 것 아니냐는 말이 나왔습니다.","★ 같은 기간에 기탁금은 네 배가 됐습니다. 한쪽에서는 청년을 부르면서 다른 쪽에서는 입장료를 올린 것입니다. 말은 늘었는데 자리는 줄었습니다. 그게 이번 전당대회에서 청년에게 일어난 일의 전부입니다.","★ 청년을 동료 주주가 아니라 득표 도구로 쓰기 때문입니다. 영입할 때는 미래라고 부르고, 규칙을 정하는 방에서는 지웁니다. 기자회견 때는 병풍처럼 세워 놓고 사진을 찍고 돌려보냅니다. SNS 세대는 그 간격을 실시간으로 확인합니다. 청년들은 몰라서 떠나는 것이 아니라 너무 잘 알아서 떠나는 것입니다.","★ 그래서 저는 구호로는 이 문제가 절대 해결되지 않는다고 봅니다. 구호는 검증할 수 없지만 당헌·당규는 검증할 수 있습니다. 시혜는 회수되지만 당헌에 새긴 결정권은 회수되지 않습니다.","★ 최소한 이 다섯 가지는 문서로 박아야 합니다. 청년최고위원제 도입, 임명직 당직의 일정 비율 청년 할당, 당 청년위원회를 청년정책 최고 의결기구로 격상, 당 예산의 10%를 청년이 직접 편성·집행·평가, 기탁금 폐지와 당직선거 공영제. 다음 선거 때 또 '청년'이라고 외치기 전에 이것부터 하시라는 것입니다."],"quotes":[],"notes":["✔ 청년최고위원제: 전준위 7.7 만장일치 의결 → 7.14 최고위 부결 / 같은 날 선호투표제 의결","⚠ '거래' 표현은 '당내에서조차 ~라는 말이 나왔다'는 전언 형태 유지 — 단정 금지"]},{"no":2342,"media":"문화일보","q":"Q3. 기성 정치인을 뚫고 청년 정치인이 살아남으려면 기존 구태정치를 답습할 수밖에 없는 구조라는 목소리가 있다. 실제로 청년 정치인들이 그것을 답습하는 측면도 있다. 어떻게 보나.","tags":["구태답습","줄서기","충성경쟁","알리바이아님","대체된것","규칙으로평가","결과공개"],"script":["★ 아프지만 절반은 맞는 말입니다. 부정하지 않겠습니다.","★ 구조를 먼저 말씀드리면 이렇습니다. 지금 청년에게 주어진 사실상 유일한 생존법은 '누구 사람'이 되는 것입니다. 공천이 계파에서 나오고 기회가 사람에게서 나오는데, 정책으로 평가받는 통로는 없습니다. 그러면 청년은 실력을 키우는 대신 줄을 서게 됩니다. 검증의 링이 없는 정당에서 살아남는 방법은 검증을 통과하는 것이 아니라 검증하는 사람 옆에 서는 것이니까요.","★ 저도 이번에 직접 봤습니다. 저를 향한 저격 글을 청년들이 올렸는데, 나중에 그중 한 청년이 개인적으로 연락을 해 와 '어쩔 수 없었다, 미안하다'고 사과했습니다. 저는 그 청년을 원망하지 않습니다. 그게 지금 청년 정치인이 놓인 현실입니다.","★ 다만 분명히 말씀드립니다. 구조는 설명이 될 수는 있어도 알리바이가 될 수는 없습니다.","★ 구태를 답습해서 살아남은 청년은 살아남은 것이 아니라 대체된 것입니다. 그렇게 얻은 자리에 앉는 순간, 다음 청년에게 똑같은 문을 잠그게 됩니다. 지금 그 문을 잠그고 계신 분들도 30년 전에는 젊은 피로 발탁된 분들이었습니다. 도전하던 사람들이 도전받는 자리에 서더니 도전 자체를 막고 있는 것입니다. 답습은 그 되풀이의 다음 차례를 예약하는 일입니다.","★ 그래서 저는 이번에 손해 보는 쪽을 택했습니다. 줄을 서면 편했을 겁니다. 대신 아무것도 남지 않았을 겁니다. 양쪽 진영에서 악플과 문자 폭격을 받았지만, 어느 진영에도 속하지 않았다는 증명서를 양쪽에서 발급해 준 셈이라고 생각합니다.","★ 청년에게 '구태를 답습하지 말라'고 요구하려면, 답습하지 않아도 살아남을 수 있는 길을 먼저 만들어야 합니다. 평가 기준을 사람에서 규칙으로 옮기면 됩니다. 경선 규칙은 6개월 전에 확정하고, '단, 달리 정할 수 있다'는 단서조항을 삭제하고, 기탁금을 폐지하고, 경선 결과를 100% 공개하는 것입니다.","★ 특히 결과 공개가 핵심입니다. 득표가 공개되면 청년은 계파가 아니라 숫자로 자기 존재를 증명할 수 있습니다. 몇 표를 받았는지 알려 주지 않으니 줄을 서는 것 말고는 증명할 방법이 없는 것입니다. 결과를 공개하는 순간부터 청년은 줄을 서지 않아도 됩니다."],"quotes":[],"notes":["⚠ 저격 글 청년 사례는 개인 특정 없이 '한 청년'으로만","※ '구조는 알리바이가 아니다' → '대체된 것이다' → '그럼 규칙을 바꾸자' 3단 구성. 문화일보가 뽑을 문장은 '살아남은 것이 아니라 대체된 것' 또는 '결과를 공개하면 줄을 서지 않아도 된다'"]},{"no":2343,"media":"문화일보","q":"📌 [내부용] 문화일보 3문항 대응 메모 (문서 미수록)","tags":["내부용","문화일보","금지사항","핵심문장"],"script":["★ 3문항 모두 '청년'에 집중된 인터뷰. 전당대회 절차 비판은 근거로만 쓰고, 결론은 반드시 '그래서 무엇을 바꿔야 하나'로 착지시킬 것.","핵심 문장 3개: ① 설계된 결과입니다 ② 말은 늘었는데 자리는 줄었습니다 ③ 구태를 답습해서 살아남은 청년은 살아남은 것이 아니라 대체된 것입니다.","기억할 숫자 네 개: 기탁금 500→2,000만 원(4배) / 청년최고위원제 전준위 7.7 만장일치 → 7.14 최고위 부결 / 본선 2030 0명 / 선거운동 사실상 나흘.","⚠ 금지: 본선 세 후보 실명 지지·비판 / 송영길 돈봉투·재판 언급(절차·단서조항 프레임만) / 신천지 사실관계 단정(의혹·정황까지만) / 확인 안 된 숫자 / 저격글 청년 개인 특정.","⚠ Q3은 자칫 '민주당 청년들 다 구태'로 기사화될 수 있음. '청년 개인을 탓하는 것이 아니라 평가 기준을 규칙으로 옮기자'는 문장을 반드시 함께 둘 것.","⚠ 문화일보 지면 특성상 여당 비판이 부각될 수 있음 — 마지막은 항상 '누가 대표가 되더라도 바뀌지 않는 시스템을 만들자'는 제안으로 닫을 것."],"quotes":[],"notes":["※ 이 카드는 대시보드 내부 참고용 — 답변지 문서에는 포함되지 않음"]},{"no":2351,"media":"취재편의점","q":"Q1. 어제 민주당 8.17 전당대회 당대표 후보들의 첫 TV토론이 있었다. 예비경선을 함께한 후보로서 어떻게 봤나.","tags":["TV토론","수박겉핥기","정청래","청년실종","정책실종","당원수준","강성지지층","미래의제","미래대응기금","5무"],"script":["★ 핵심 메시지: 수박 겉핥기식 토론이었습니다. 청년도 미래도 '내가 말했다'는 알리바이만 챙긴 토론이었습니다.","어제 토론에 대한 평가는 대체로 이렇습니다. 토론 자체의 완성도가 높지 않았다. 거의 모든 시간이 정청래 후보(특정 후보)에 대한 검증 공방에 소진되면서 '누가 대표가 되면 무엇을 하겠다'는 경쟁이 실종됐다. 송영길 후보(한 후보)가 주가·부동산 위기를 꺼냈지만 정책 토론으로 이어지지 못했고, 결국 계파와 과거 책임과 충성도 검증이 전부였다. 당원과 유권자가 판단 근거를 얻기에는 부실한 100분이었다 — 저도 그렇게 봤습니다.","★ 청년정책도 마찬가지였습니다. 수박 겉핥기식으로, '나도 청년을 말했다'고 할 수 있는 알리바이식 발언이 전부였습니다.","당원들이 관심이 없어서입니까? 아닙니다. 후보들이 당원의 수준을 떨어뜨리고 있는 것입니다. 후보가 방향을 잡아 주고 가이드라인을 제시해야 하는데, 일부 강성 지지층의 요구만 따라가고 있는 것 아닙니까.","무엇을 토론했어야 하나 — 청년정책, 저출산, 기후위기, 지역소멸, 3대 메가 프로젝트, 미래대응기금. 그리고 대통령이 하려는 일을 당이 어떻게 뒷받침할 것인가입니다.","당내 민주주의를 어떻게 회복할 것인지, 엉망인 당원 명부를 어떻게 개선할 것인지도 한마디 나오지 않았습니다.","세 후보는 제가 이번 경선에서 제기한 12개 당내 민주화 현안을 단 하나도 논의하지 않았습니다. 규칙, 기탁금, 결과 공개, 당원 명부 — 전부 지금 이 전당대회에서 벌어지고 있는 문제인데도 말입니다.","★ 정리 문장: 쌈박질만 있지 청년이 없고, 미래가 없고, 민생이 없었습니다. 정치를 수십 년 했다는 세 후보가 당의 수준을 끌어올리기는커녕 떨어뜨리고 있습니다.","(덧붙임) 저는 출마 선언에서 민주당에 없는 것 다섯 가지를 찾아오겠다고 말했습니다. 공정이 없고, 민주주의가 없고, 그래서 청년이 없고, 청년이 없으니 미래가 없고, 결국 세대교체가 없다. 어제 토론은 그 다섯 가지를 그대로 다시 보여 줬습니다."],"quotes":[],"notes":["※ 실명 뒤 괄호가 방송용 대체 표현 — 실명을 말할지 괄호 표현으로 말할지는 현장에서 본인 판단","⚠ '100분'은 방송 전 실제 토론 시간 확인 — 확인 못 하면 '두 시간 가까운 토론'으로"]},{"no":2352,"media":"취재편의점","q":"Q2. 지난주 예비경선 결과를 끝으로 당대표 도전을 마무리하게 됐다. 결과를 받아들며 어떤 생각을 했나.","tags":["결과비공개","득표율","청년진입장벽","격려","12개공약","도전은시작","3인캠프"],"script":["★ 핵심 메시지: 결과를 받아들지 못했습니다. 받은 게 없기 때문입니다.","결과가 공개되지 않았습니다. 저를 찍어 주신 당원들도 제가 몇 퍼센트를 얻었는지 궁금하실 텐데, 알려 주지 않습니다.","★ 기자님은 득표율 알고 계시죠? 후보인 저는 아직도 모릅니다. 자기들끼리는 다 돌려보고, 후보인 저만 모릅니다.","평당원 청년 김보미가 몇 퍼센트를 얻었는지 알아야 청년들이 희망을 가질 것 아닙니까. 그런데 알려 주지 않습니다. '니들은 나서지 마라'는 뜻 아닙니까.","그것이 바로 청년의 진입을 막고 있다는 증거입니다. 깨끗하게 공개하면 될 일입니다.","그럼에도 얻은 것이 있습니다. 나 같은 사람의 말에 누가 귀 기울여 줄까 했는데, 청년부터 어르신까지 세대를 불문하고 격려해 주셨습니다. 제가 세대교체를 이야기한 당사자인 686·786 어르신들까지 격려 전화를 주셨습니다.","이번 경선에 나선 청년 후보들이 모두 떨어졌습니다. 이것을 교훈으로 삼아야 합니다. 앞으로는 함께 힘을 모아 같이 바위를 쳐야 합니다.","떨어졌지만, 마지막에 발표한 12개 당내 민주화 공약은 끝까지 실천하겠습니다.","마무리: 제 도전은 이제 시작입니다.","(덧붙임) 감사 인사를 꼭 드리고 싶습니다. 조직도 계파도 없는 세 명짜리 캠프였습니다. 사무실도 없이 카페를 전전하던 저희를 여기까지 오게 해 주신 분들, 후원해 주신 분들이 계셨습니다. 저는 이번에 확인했습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들이 계십니다. 그 한 표 한 표가 거대한 기득권 바위에 금을 내고 있습니다."],"quotes":[],"notes":[]},{"no":2353,"media":"취재편의점","q":"Q3. 돈·조직·계파가 없는 평당원으로서 예비경선을 치르는 과정 자체가 만만치 않았을 것 같다. 가장 높게 느낀 벽은.","tags":["당헌당규","기득권체제","5일","기탁금1천만원","7분동영상","컷오프무용","돈정보족보","흥신소정치"],"script":["핵심 메시지: 민주당의 당헌·당규와 경선 절차가 기득권에게는 한없이 유리하고, 새로 도전하는 청년에게는 더없이 불리한 체제라는 것을 절실히 느꼈습니다.","★ 예비경선 기간이 5일이었습니다. 접수 절차를 빼고 나면 실제 선거운동은 하루이틀 남짓이었습니다. 이름을 알릴 시간조차 없었습니다.","★ 기탁금 1천만 원을 냈는데 토론회도 연설회도 한 번 없었고, 7분짜리 동영상 한 번 찍은 것이 전부였습니다.","세 명이 토론하든 다섯 명이 토론하든 무슨 차이가 있다고 굳이 컷오프를 합니까. 당헌·당규에도 예비경선을 '할 수 있다'고 되어 있지 '해야 한다'고 되어 있지 않습니다.","말로는 온갖 청년정책을 다 내놓으면서, 막상 경선에서는 어떻게든 청년의 입을 막으려는 행태를 보며 기득권의 벽이 만만치 않다는 것을 새삼 느꼈습니다.","(덧붙임) 벽을 세 개로 정리하면 돈, 정보, 족보입니다. 돈의 벽 — 기탁금 구하는 데 반나절, 후원계좌 만드는 데 이틀을 썼습니다. 정보의 벽 — 경선 규칙은 후보 등록을 마친 뒤에야 받았고, 신청 서류는 거의 하루 전에야 공지받았습니다. 당헌 제25조 제5항은 후보자등록 개시일 30일 전까지 규칙을 확정하라고 되어 있는데, 이번 전당대회에 한해 그 기한을 적용하지 않는다는 부칙을 만들어 비껴갔습니다. 족보의 벽 — 계파가 없으면 유령 취급을 받고, 사진 한 장 찍히면 '누구 파냐'는 검증부터 받습니다. 저는 그것을 흥신소 정치라고 부릅니다."],"quotes":[],"notes":[]},{"no":2354,"media":"취재편의점","q":"Q4. 세대교체를 외친 후보들 모두 본경선에 오르지 못했다. 민주당에서 '청년'·'세대교체'를 이야기하며 선출직 지도부가 되는 것은 어려운 일인가.","tags":["기울어진운동장","입장불가","철벽","제도개혁","설계된결과","2030전무"],"script":["★ 핵심 메시지: 기울어진 운동장이 아닙니다. 운동장에 입장조차 시켜 주지 않습니다.","흔히 '기울어진 운동장에서 하는 경기'라고 표현합니다. 그런데 지금은 그 단계도 아닙니다. 아예 운동장에 들여보내지 않습니다.","철벽을 쳐 놓았으니 뒤집고 들어가기가 쉽지 않습니다. 그래서 제도를 바꾸자는 것입니다.","(덧붙임) 설계된 결과입니다. 제도에서 지웠습니다 — 전당대회준비위원회가 만장일치로 의결한 청년최고위원제를 최고위원회가 부결시켰습니다. 기회를 봉쇄했습니다 — 검증 토론회 없이 영상 촬영이 전부였습니다. 결과를 감췄습니다 — 몇 표인지 아무도 모릅니다. 그 결과, 당대표와 최고위원 본선 진출자 가운데 2030은 한 명도 없습니다. 당대표 본선에 오른 세 분은 모두 686 세대입니다. 제가 '청년이 없다, 세대교체가 없다'고 말한 것이 예언이 아니라 관찰이었다는 것을 이번 전당대회가 스스로 증명했습니다."],"quotes":[],"notes":[]},{"no":2355,"media":"취재편의점","q":"Q5. 예비경선을 치르며 '86세대'를 향해 거침없이 직격했다. 그 말을 들은 '86세대'는 어떤 반응을 보였나. 불편해한 분들도 있었을 것 같은데.","tags":["86세대반응","호통일화","격려","민주화운동선배","명예"],"script":["불편해한 분들이 분명히 있었습니다.","사례 하나를 짧게 — 송영길 후보(유력 686 후보)가 직접 호통을 친 일이 있었습니다. (감정을 싣지 말고 담담하게, 미리 확정해 둔 문장 그대로만 전할 것)","★ 반대로 686·786 세대 중에서도 '네 말이 맞다'며 격려해 주신 분들이 적지 않았습니다. 실제로 민주화운동을 하셨던 선배님들이 직접 전화를 주시고, '우리 세대가 미안하다'고까지 하셨습니다.","(덧붙임 · 호통 일화 확정 문장안) 제가 자격 심사 절차의 문제를 비교해 지적하자, '어디다 대고 비교하느냐'고 호통을 치셨습니다. 저는 사람을 비교한 것이 아니라 절차를 비교한 것이었습니다. 담담하게 이 두 문장까지만 말합니다.","(덧붙임) 저는 양쪽에서 공격받은 것이 오히려 명예롭다고 생각합니다. 어느 진영에도 속하지 않았다는 증명서를 양쪽에서 발급해 준 셈이니까요."],"quotes":[],"notes":[]},{"no":2356,"media":"취재편의점","q":"Q6. 당대표 경선에 도전장을 내밀며 기대한 점이 있었을 것. 기대는 이뤘나. 후회는 없나.","tags":["발언기회부재","영상촬영대회","결과비공개","혼자서는안된다","후회없음","김보미닷컴"],"script":["최소한 발언 기회는 줄 줄 알았습니다. 이렇게까지 기회가 없을 줄은 상상도 못 했습니다.","실제 선거운동은 사흘이었고, 토론회도 연설회도 없이 영상 촬영 대회였습니다.","선거 결과조차 받아 보지 못한 것이 가장 아쉽습니다.","★ 그래서 얻은 결론이 있습니다. 혼자서는 안 된다는 것입니다. 앞으로 다 같이 뭉쳐야겠다는 것을 확인했습니다. 후회는 없습니다.","(덧붙임) 또 하나 마음에 걸리는 것이 있습니다. 김보미닷컴에 '토론회 가서 이 말 좀 대신 해 달라'는 의견을 정말 많은 분들이 남겨 주셨습니다. 그 말씀들을 다 전하지 못하고 끝났습니다. 그 숙제는 제가 계속 안고 갑니다."],"quotes":[],"notes":[]},{"no":2357,"media":"취재편의점","q":"Q7. 23살에 가입한 정당도, 28살에 강진군의회에 도전한 것도, 37살에 당대표에 도전한 것도 민주당이었다. 실망도 많았을 텐데 당을 떠나지 않고 계속 도전하게 하는 민주당의 가치는 무엇인가.","tags":["버텨야하고달라져야","헌법과민주주의","투명공개","김보미가더나온다","도전정신","적통"],"script":["★ 핵심 메시지: 민주당은 버텨야 하고, 동시에 달라져야 합니다.","저는 민주당이 잘됐으면 좋겠습니다. 민주당이 없어지면 대한민국이 어떻게 되겠습니까. 헌법과 민주주의를 지키려면 민주당이 버텨 줘야 합니다.","동시에 달라져야 합니다. 투명하게 공개하고, 다 같이 경쟁하고, 함께 성장하면 얼마나 좋겠습니까.","★ 지금은 김보미 한 명 잘라 버리면 된다고 생각하시는 것 같은데, 앞으로 거침없이 기득권에 도전하는 전국의 김보미들이 더 나올 것입니다.","(덧붙임) 저를 붙잡는 가치를 하나만 꼽으라면 도전정신입니다. 김대중, 노무현이 하신 것이 결국 계란으로 바위 치기였습니다. 될 것 같아서 하신 게 아니라 옳으니까 하신 것입니다. 민주당의 적통은 혈통이 아니라 그 도전정신이고, 저는 그 도전정신의 적통을 잇겠습니다."],"quotes":[],"notes":[]},{"no":2358,"media":"취재편의점","q":"Q8. 민주당에서 청년 정치인이 성장할 수 있는 구조라고 보나. 그 청년 정치인의 기반이 지방이라면.","tags":["당도청년도","두축","줄서지말것","경청","지방의회","축소판","성장사다리","맘다니"],"script":["★ 핵심 메시지: 당도 바뀌어야 하지만, 청년도 바뀌어야 합니다.","첫째, 당이 달라져야 합니다. 공정하게, 투명하게, 기회를 줘야 합니다.","둘째, 청년도 달라져야 합니다. 기대지 말고, 줄 서지 말고, 하고 싶은 이야기를 해야 합니다.","아직 미숙하기 때문에 능력을 키워야 합니다. 그리고 비슷한 목소리를 내는 청년들끼리 차이점을 부각할 것이 아니라, 손을 잡고 함께 도전해야 합니다.","당이 알아서 잘해 주기만을 바라서는 절대 안 됩니다.","★ 청년이 해야 할 첫 번째는 경청입니다. 약자의 목소리를 들어야 합니다. 그리고 스스로 실력을 키워야 합니다. 지금 민주당은 청년 정치인이 훈련할 기회를 주지 않습니다. 그래서 정책적 능력도 떨어집니다. 아무도 가르쳐 주지 않습니다. 우리 청년 스스로 학습을 시작해야 합니다. 제가 한번 총대를 멜 생각입니다.","(덧붙임 · 기반이 지방이라면) 지방의회는 중앙의 축소판입니다. 조례 만들고, 예산 심의하고, 행정사무감사 하고, 주민을 대변합니다. 국회가 하는 일을 규모만 작게 다 합니다. 유럽은 지방의원부터 정치인을 키웁니다. 프랑스는 하원의원의 60% 이상이 지방직 경력자이고, 영국도 지난 총선에서 당선 가능성이 높은 지역구 후보의 절반가량이 지방의원 출신이었습니다. 스웨덴은 아예 국회의원이 지방의원을 겸직합니다. 그런데 우리는 지방의회를 정치의 입구가 아니라 변방으로 취급합니다. 정당이 성장 사다리가 되어 청소년기부터 청년을 키워야 합니다.","(덧붙임) 제가 서른일곱입니다. 그런데도 아직 어리다는 취급을 받습니다. 저보다 동생뻘인 조란 맘다니가 올해 1월 뉴욕시장에 취임했습니다. 왜 못할 것이라고 평가절하하십니까."],"quotes":[],"notes":[]},{"no":2359,"media":"취재편의점","q":"Q9. 민주당에서 '청년' 키워드는 전국 단위 선거 직후 청년 표심 이탈을 확인하는 순간에 가장 많이 나온다. 민주당이 '청년'·'2030세대'를 바라보는 시각에 변화가 필요한 것 아닌가.","tags":["민주당이청년을떠났다","자원과시간의배분","우선순위","성명서배경","말과행동의거리"],"script":["★ 핵심 메시지: 청년이 민주당을 떠난 게 아니라, 민주당이 청년을 떠났습니다.","일자리, 주거, 자산 불균형, 공정 — 청년 세대의 요구는 이미 다 나와 있습니다. 문제는 제기됐는데 해결이 안 되고 있습니다.","결국 자원과 시간의 배분 문제입니다. 일자리·주거·자산 불평등·공정을 먼저 할 것인가, 계파 다툼을 먼저 할 것인가.","정부가 당에 던져 놓은 개혁 입법의 처리 실적을 근거로, 지금 민주당의 우선순위가 어디에 가 있는지 지적합니다.","★ 민주당은 청년을 국회의원 성명서 발표할 때 뒤에 일렬횡대로 세우는 병풍으로만 쓴 것 아닙니까.","(덧붙임) 원인은 말과 행동의 거리입니다. 말로는 청년을 외치면서 막상 결정하는 방에서는 청년을 지웁니다. SNS 세대는 그 간격을 실시간으로 확인합니다. 청년들은 몰라서 떠나는 것이 아니라 너무 잘 알아서 떠나는 것입니다. 그래서 저는 청년정책의 공급자를 기성 정치인에서 청년 당사자로 바꾸자고 말씀드리는 것입니다."],"quotes":[],"notes":[]},{"no":2360,"media":"취재편의점","q":"Q10. 2030세대의 표심이 정치를 떠나기 시작한 것은 어제오늘 일이 아니다. 미래세대가 갈수록 정치에 무관심해지는 것이 어떤 결과를 가져올 것이라고 보나.","tags":["회초리","2028총선","2030대선","골든타임","김민석","DJ발탁"],"script":["★ 2030에게 회초리를 맞고도 정신을 못 차리고 이대로 간다면, 2028년 총선도 2030년 대선도 민주당이 질 수밖에 없습니다.","(덧붙임) 민주당이 지금 골든타임을 넘기면 총선이고 대선이고 다 망합니다. 밥그릇 싸움 그만하시고 민생을 우선순위에 놓으시라고 다시 한번 읍소하고 싶습니다.","(덧붙임) 답은 이미 나와 있습니다. 당의 2030 지지율이 최고였던 때가 언제입니까. 김대중 대통령이 서른한 살 김민석 같은 청년을 국회로 보냈을 때였습니다. 답을 알지만 밥그릇을 뺏기고 싶지 않은 것이겠지요."],"quotes":[],"notes":[]},{"no":2361,"media":"취재편의점","q":"Q11. 새로 꾸려지는 민주당 지도부가 어떤 모습을 보여주길 기대하나. 그리고 다음 정치 행보는.","tags":["12개공약","혁명을품은계란","전국의김보미","공동전선","재정주권시민행동","오뚝이"],"script":["★ 핵심 메시지: 혁명을 품은 계란들끼리 뭉치겠습니다.","지도부에 대한 기대는 이미 발표한 12개 공약으로 갈음합니다. 새 지도부가 무엇을 해결해야 하는지는 이미 다 던져 놓았습니다.","저의 행보 — 떨어졌지만 공약을 지키기 위해 제자리에서 할 수 있는 일을 하겠습니다.","전국 각지에서 이름 없이 민주당의 가치를 지키고, 청년과 미래를 위해 자기 지역 기반을 구축하며 정치를 하겠다는 사람들을 찾아 나서겠습니다.","★ 전국의 김보미를 찾겠습니다. 혁명을 품은 계란들끼리 뭉치겠습니다.","혼자의 힘으로는 힘들다는 것을 절감했습니다. 앞으로는 공동전선을 형성해 함께 도전하겠습니다.","(덧붙임 · 12개 공약을 물으면) 경선 규칙 6개월 전 확정과 '달리 정할 수 있다' 단서조항 삭제, 기탁금 폐지와 당직선거 공영제, 경선 결과 100% 공개, 당 재정 1원까지 실시간 공개 — 누가 당대표가 되더라도 바뀌지 않는 시스템을 만드는 과제들입니다. 본선 세 후보에게 계속 묻겠습니다.","(덧붙임) '재정주권 시민행동'도 확산해 나가겠습니다. 세금이 제대로 쓰이고 있는지, 예산이 계획대로 집행되고 있는지를 시민이 직접 들여다보게 하는 운동입니다. 그야말로 주민의 민원을 해결하는 정치, 저는 거기서부터 다시 시작하겠습니다. 제 별명이 오뚝이입니다. 넘어뜨릴 때마다 기어이 다시 일어났습니다."],"quotes":[],"notes":[]},{"no":2362,"media":"취재편의점","q":"[예상 추가 1] 조정식 의원의 개헌·연임 관련 발언을 어떻게 보나.","tags":["개헌","연임","조정식","87년헌법","시대정신","세대교체","국민투표","AI대격변"],"script":["1987년의 시대정신은 민주화였습니다. 그 시대정신을 실행할 사람으로 30대 386이 정치권에 들어왔습니다.","40년이 지났습니다. 지난 40년 동안 대한민국은 얼마나 달라졌습니까. 386 컴퓨터를 쓰던 시절에서 AI 대격변의 시대가 됐습니다.","★ 이제 시대정신은 세대교체입니다. 1987년 헌법을 새롭게 써야 할 시기입니다.","전당대회가 끝나면 개헌 논의를 시작해야 합니다. 총선 전에 마무리하고, 총선 때 국민투표를 하면 됩니다.","수많은 개헌 논의 중에 대통령 연임제도 있습니다. 논의해야 합니다. 실력이 있다면 다시 한 번 더 하는 것, 논의할 수 있습니다.","★ 다만 대통령 연임 논란으로 개헌 논의 자체가 멈추면 안 됩니다. 정쟁하지 말고 토론하면 됩니다. 국민 의견을 구하고 들으면 됩니다."],"quotes":[],"notes":["⚠ 진영 프레임으로 소비될 수 있는 주제 — 특정 편을 드는 인상 없이 '개헌 논의 자체'로 착지할 것"]},{"no":2363,"media":"취재편의점","q":"[예상 추가 2] 어느 후보를 지지하나.","tags":["지지후보","수박겉핥기","구시대적발상","정책연대","연정","기권","웃으면서"],"script":["★ 제가 왜 지지해야 합니까? 떨어진 후보가 누구를 꼭 지지해야 한다는 발상 자체가 구시대적입니다.","세 후보와 연결고리가 없습니다. 아무도 제 목소리를 듣지 않았고, 청년을 대표해서 제기한 제 공약에 대해 단 한마디 관심도 없었습니다.","당 대표 한 적이 있는 두 사람은 일단 아닌 것 같습니다. 민주당이 이 지경이 된 데 대한 책임이 있는 분들입니다.","내놓으신 청년정책 중에 마음에 드는 것이 없습니다. 장관급 위원회 만들고 회의체 만드는 것이 지금 중요합니까. 청년이 공정하게 경쟁할 수 있는 제도를 만드는 것이 정작 중요한데, 그것을 모르십니다.","★ 전부 수박 겉핥기입니다. '내가 말했다'라고 할 수 있는 알리바이용 청년 정책입니다.","연대라면 정책 연대여야 합니다. 유럽 국가들의 연정처럼 주고받고 양보하고 정책 연대를 해야지, 그런 것 없이 줄만 서라는 것은 곤란합니다.","이러다가 저도 기권할 것 같습니다. 제 주변 청년들 중에 투표하겠다는 사람이 하나도 없습니다. 청년들이 무관심해지는 그 심정을 저도 그대로 느낍니다."],"quotes":[],"notes":[]},{"no":2364,"media":"취재편의점","q":"[예상 추가 3] 불법당원·유령당원·대리당원 문제, 그리고 당 지도부의 제도 개선 언급을 어떻게 보나.","tags":["당원명부","한병도","전수조사","행안부","선관위","이중당적","근본수술","전당대회성과"],"script":["★ 핵심 메시지: 유권자 4천4백만 명인 나라에서 당원이 500만입니다. 이게 말이 됩니까?","불법당원이 신천지만 있는 게 아닙니다. 이중당원, 유령당원, 대리당원, 다른 동네에 사는데 당원으로 올라 있는 경우, 두세 개 정당에 동시에 가입한 경우까지 다양합니다.","해법은 간단합니다. 행정안전부의 협조를 받아 주소지를 확인하고, 선거관리위원회의 협조를 받아 이중당적을 가려내고, 당이 직접 전화로 확인하면 됩니다. 비정상을 정상으로 되돌리는 일일 뿐입니다.","'제도 개선을 위해 머리를 맞대겠다'는 식의 접근은 변죽만 울리는 것입니다. 민주당이 바꾸겠다고 하면 되는 일입니다.","왜 안 하겠습니까. 지금까지 그 시스템으로 권력을 누려 왔기 때문에 바꿀 생각이 없는 것입니다.","전당대회가 끝난 뒤로 미룰 이유가 없습니다. 지금부터 시작해야 합니다.","★ 결론: 명부가 정비되지 않는 한 어떤 당대표를 뽑아도 정당성을 갖기 어렵습니다. 근본적인 수술이 필요합니다.","어제(7.29) 한병도 대표 직무대행 겸 원내대표가 최고위원회의에서 신천지 집단 입당 의혹에 대해 '신속하고 엄정하게 발본색원해야 한다'고 했습니다. 그리고 전당대회가 끝나는 대로 행정안전부, 선거관리위원회, 여야 정당이 함께 제도 개선을 하자고 제안했습니다.","★ 제가 예비경선 내내 외친 불법당원 문제에 당 지도부가 처음으로 공식 응답한 것입니다. 반갑습니다. 저는 이것을 이번 전당대회에서 제가 만든 작은 성과라고 감히 말씀드립니다.","★ 다만 순서가 틀렸습니다. 왜 전당대회가 끝난 뒤입니까. 지금 해야 합니다. 지금 진행 중인 이 선거의 당원 명부부터 검증해야, 누가 이기든 모두가 결과에 승복할 수 있습니다. 신뢰할 수 있는 당 시스템을 만드는 것이 먼저입니다."],"quotes":[],"notes":["✔ 확인된 사실(경향신문 7.29): 한병도 대표 직무대행 겸 원내대표, 7.29 국회 최고위원회의 — 신천지 집단 입당 의혹 '신속·엄정 발본색원' / '확인 안 된 의혹 부풀리기도 안 된다' / 제도 개선은 8.17 전대 종료 후 행안부·선관위·여야 정당 함께 제안","⚠ 신천지는 '의혹'까지만 — 수사 중, 사실관계 단정 금지"]},{"no":2365,"media":"취재편의점","q":"[예상 추가 4 · 신규] 본경선 첫날 충북에서 온라인투표 접속 오류로 투표가 한 시간 가까이 중단됐다. 어떻게 보나.","tags":["충북","투표중단","접속오류","당원주권","선관위불신","사과없음"],"script":["★ 그 한 시간 동안 멈춰 있었던 것은 시스템이 아니라 당원의 주권입니다.","본경선 첫날 오전 9시에 투표가 시작됐는데, 충북 권리당원들은 '개인정보가 일치하지 않는다'는 오류로 한 시간 가까이 투표에 접속조차 하지 못했습니다.","당은 투표 시간을 한 시간 연장하는 것으로 끝냈습니다. 왜 그런 일이 벌어졌는지 원인 설명도, 경위 공개도, 당원들에 대한 사과도 없었습니다.","선거를 관리하는 기구가 이런 일을 겪고도 아무 말이 없는데, 당원들이 그 선거관리위원회를 어떻게 신뢰합니까.","이것이 앞서 말씀드린 당원 명부 문제와 같은 뿌리입니다. 시스템을 검증하지 않는 정당에서는 같은 사고가 반복됩니다."],"quotes":[],"notes":["✔ 확인된 사실: 7.28 본경선 온라인투표 첫날 오전, 충북 권리당원 접속 오류 약 1시간 → 투표시간 1시간 연장. '연장은 했지만 원인 규명·경위 설명·사과가 없었다'로만 말할 것"]},{"no":2366,"media":"취재편의점","q":"[예상 추가 5 · 신규] 입당 6개월 규정에 걸린 후보에게 예외를 의결해 자격 논란이 일었다. 어떻게 보나.","tags":["6개월규정","자격예외","고무줄규칙","단서조항","절차비교","사당"],"script":["★ 사람을 비교하는 것이 아니라 절차를 비교하는 것입니다.","이번에는 송영길 후보(입당 6개월 규정에 걸린 후보)의 자격 문제가 불거지자, 밤에 긴급 최고위원회에서 논의한 뒤 다음 날 비공개 최고위에서 예외를 의결해 자격을 열어 줬습니다.","그런데 같은 규정이 4년 전에는 정반대로 작동했습니다. 2022년 전당대회에서 박지현 전 비대위원장(한 청년 후보)은 '입당 6개월 미만'을 이유로 후보 자격 심사조차 통과하지 못했습니다. 같은 6개월 규정인데 한 번은 문을 닫는 잣대가 되고, 한 번은 예외를 여는 문이 됐습니다.","★ 규칙이 사람에 따라 늘었다 줄었다 하는 고무줄이라면 그것은 이미 규칙이 아닙니다.","면접에 비유하면 이렇습니다. 한 청년은 자격이 되는지 봐 달라며 원서를 냈는데 봉투조차 뜯지 않았고, 한 선배는 접수한 뒤 자격이 안 되는 것이 드러나자 규정을 바꿔 달라고 했습니다. 일개 후보자의 개인 등록 서류를 왜 당이 챙겨 줍니까. 당이 사당입니까.","그래서 제 요구가 '단, 달리 정할 수 있다'는 단서조항의 삭제입니다. 누굴 떨어뜨리고 싶으면 떨어뜨리고, 붙이고 싶으면 붙일 수 있는 구조를 두고 공정을 말할 수는 없습니다."],"quotes":[],"notes":["※ 실명 뒤 괄호가 방송용 대체 표현. 단, 돈봉투·재판 언급은 계속 금지 — '절차·단서조항' 프레임만","✔ 자격 예외: 7.16 밤 긴급 최고위 논의 → 7.17 비공개 최고위 의결 / 2022년 사례는 반드시 연도를 붙여 말할 것"]},{"no":2367,"media":"취재편의점","q":"[예상 추가 6 · 신규] 전당대회준비위가 만장일치로 의결한 청년최고위원제가 최고위에서 무산됐다. 어떻게 보나.","tags":["청년최고위원제","전준위만장일치","최고위부결","선호투표제","되살려야"],"script":["★ 청년이 앉을 자리 하나를 당의 최고 의결기구가 지운 것입니다.","순서를 보시면 분명합니다. 7월 7일 전당대회준비위원회가 청년최고위원제를 만장일치로 의결했습니다. 그런데 7월 14일 최고위원회가 그것을 부결시켰고, 같은 날 최고위는 선호투표제를 의결했습니다. 당내에서조차 두 사안이 거래된 것 아니냐는 말이 나왔습니다.","말로는 청년을 외치면서, 규칙을 정하는 방에서는 청년을 지운 것입니다.","새 지도부가 해야 할 일은 분명합니다. 전준위가 만장일치로 의결하고도 부결된 그 제도를 되살려, 청년이 당의 최고 의사결정 테이블에 정식으로 앉게 하는 것입니다. 시혜는 회수되지만 당헌에 새긴 결정권은 회수되지 않습니다."],"quotes":[],"notes":["⚠ '거래' 표현은 '당내에서조차 ~라는 말이 나왔다'는 전언 형태 유지 — 단정 금지","✔ 전준위 7.7 만장일치 의결 → 7.14 최고위 부결 / 같은 날 선호투표제 의결"]},{"no":2368,"media":"취재편의점","q":"[예상 추가 7 · 신규] 이렇게 비판적인데 탈당이나 신당 합류 생각은 없나.","tags":["탈당","신당","떠나면편하다","안에서바꾼다","버텨야한다"],"script":["★ 떠나면 편합니다. 그런데 떠나는 순간 이 당은 정말 그들만의 것이 됩니다. 바꾸려면 안에 있어야 합니다.","말씀드렸듯이 민주당은 버텨야 합니다. 헌법과 민주주의를 지키려면 민주당이 버텨 줘야 합니다. 저는 그 민주당을 안에서 바꾸겠다는 것입니다.","저는 민주당 안에서 전국의 김보미를 찾겠습니다. 거침없이 기득권에 도전하는 전국의 김보미들이 더 나오게 만드는 것, 그것이 제가 남아서 할 일입니다."],"quotes":[],"notes":["⚠ 신당·창당 관련 내부 논의는 일절 언급 금지 — 이 답변으로만 받고 끊을 것"]},{"no":2369,"media":"취재편의점","q":"Ⅴ. 참고 — (가칭) 3060 플랫폼 개요 (대외 확정 발표 전)","tags":["3060플랫폼","고마해라","김보미를찾아라","후견인","공동전선","비공개"],"script":["★ 인터뷰에서는 아래 취지만 자기 언어로 풀어 말할 것 — 명칭·슬로건·규모는 확정 발표 전이므로 먼저 꺼내지 않는다.","개념: 30대의 정치적 진출을 60대가 지원하는 구조. 가칭 '3060 플랫폼'. 목표는 정당 개혁과 세대교체. 슬로건(잠정): '고마해라'.","참여 기준: 유력 정치인에게 줄 서지 않고 스스로 자기 영토를 개척하겠다는 청년 / 586·686 세대교체에 찬성하는 사람 / 2028년 총선 또는 2030년 지방선거 출마 의사가 있는 사람 / 686 현역 지역구에 도전할 사람 중심.","규모: 5060 후견인 약 10명 + 출마 예정 청년 약 20명. 초기 활동 인원 15~24명 수준.","프로젝트명: '김보미를 찾아라' — 전국 각지에서 이름 없이 지역 기반을 구축하고 있는 청년 정치인을 발굴해 공동전선을 형성한다."],"quotes":[],"notes":["⚠ 대외 확정 발표 전 — 인터뷰에서 '3060', '고마해라', 인원수는 말하지 말고 '전국의 김보미를 찾겠다, 공동전선을 만들겠다'는 취지까지만"]},{"no":2370,"media":"취재편의점","q":"📌 [내부용] 점검 메모 (문서 미수록)","tags":["내부용","수치","금지사항","같은날두인터뷰"],"script":["★ 7.30(목)은 취재편의점 09:30 생중계와 이데일리 10:00 인터뷰가 연달아 있는 날 — 숫자가 서로 다르면 안 됨.","확정 수치(후보 확정본 기준): 예비경선 기간 5일 / 기탁금 1천만 원 / 동영상 7분 / 유권자 약 4천4백만·당원 500만.","※ 선거운동 기간은 Q3 '하루이틀 남짓'과 Q6 '사흘'이 문서 안에 함께 있음 — 방송에서 두 표현을 같은 답변에 섞지만 않으면 무방하나, 하나로 통일하면 더 안전.","※ 이데일리 답변지에는 '선거기간 사실상 나흘'로 되어 있음 — 이데일리에서는 '5일' 기준으로 말하도록 유의.","Q9 개혁 입법 처리 실적 / 직전 지방선거 2030 득표율 — 인터뷰 직전 재확인 전에는 숫자 인용 금지.","⚠ 금지: 특정 후보 지지 표명 / 송영길 돈봉투·재판 언급(절차·단서조항 프레임만) / 신천지 사실관계 단정(의혹·정황까지만) / 저격글 청년 개인 특정 / '3060'·'고마해라'·플랫폼 인원수 선제 공개 / 신당·창당 내부 논의 언급 — 실명은 문서에 표기, 괄호가 방송용 대체 표현","⚠ 호통 일화(Q5)는 확정 문장 두 개까지만 — 인명 제외, 감정 싣지 말 것","⚠ 진행자가 파고들 때 되돌아갈 세 문장: ① 청년이 실종됐습니다 ② 결과를 공개하면 될 일입니다 ③ 전국의 김보미를 찾겠습니다","장소·연락: 서울 영등포구 국회대로 800 여의도파라곤 428호 / 방송 중 벨 금지, 조아림 작가(010-4147-8960)에게 연락"],"quotes":[],"notes":["※ 이 카드는 대시보드 내부 참고용 — 배포 문서에는 포함되지 않음"]},{"no":2371,"media":"취재편의점","q":"[예상 추가 8] 이번 전당대회를 어떻게 전망하나. 본경선 국면을 어떻게 보고 있나.","tags":["전당대회전망","5무민낯","충북투표중단","당원명부","검증없는1인1표","불신","재창당","경청","혁신운동"],"script":["★ 솔직히 말씀드리면, 지금의 전당대회는 이해할 수가 없습니다. 저는 출마 선언에서 민주당에 없는 것 다섯 가지를 찾아오겠다고 말했습니다. 공정이 없고, 민주주의가 없고, 그래서 청년이 없고, 청년이 없으니 미래가 없고, 결국 세대교체가 없다. 이번 전당대회는 제가 지적한 그 다섯 가지를 하나도 빠짐없이 그대로 다시 보여 준 민낯입니다. 나아진 것 하나 없이 오히려 더 나빠진 채로 반복되고 있기 때문입니다.","★ 당장 본경선 첫날부터 충북에서 사고가 났습니다. 오전 9시에 투표가 시작됐는데 충북 권리당원들은 '개인정보가 일치하지 않는다'는 오류로 한 시간 가까이 투표에 접속조차 하지 못했습니다. 당은 투표 시간을 한 시간 연장하는 것으로 끝냈습니다. 왜 그런 일이 벌어졌는지 원인 설명도, 경위 공개도, 당원들에 대한 사과도 없었습니다.","★ 그 한 시간 동안 멈춰 있었던 것은 시스템이 아니라 당원의 주권입니다. 선거를 관리하는 기구가 이런 일을 겪고도 아무 말이 없는데, 당원들이 그 선거관리위원회를 어떻게 신뢰합니까.","★ 여기에 신천지 논란까지 겹치면서 당원 명부 자체의 신뢰성이 도마에 올랐습니다. 그런데 검증은 하지 않고 '1인 1표', '당원주권'이라는 말만 반복하고 있습니다. 당원이 진짜 당원인지 확인하는 것이야말로 정당 민주주의의 기본이고 1인 1표 당원주권의 출발점입니다. 그 기본은 어디다 갖다 버리고 편 가르기와 계파 싸움만 하고 있습니까. 검증 없는 1인 1표는 당원주권이 아니라 구호일 뿐입니다.","★ 분열의 씨앗은 불신에서 자랍니다. 당의 시스템을 믿을 수 있다면 경쟁하고 승복하면 될 일입니다. 그런데 지금 누가 그 시스템을 신뢰합니까. 서로를 증오하고 적으로 규정하는 문화에서는 경쟁을 통해 승자가 정해지는 구조 자체가 만들어질 수 없습니다. 이번에 직접 겪어 보니 특정 계파로 낙인찍어 공격하는 일이 너무나 일상화되어 있었습니다.","★ 그래서 저는 이번 전당대회를 축제가 아니라 위기 신호로 봅니다. 민생과 미래를 챙기지 못하는 민주당, 민주주의의 기본 원칙조차 지키지 못하는 민주당은 재창당 수준으로 혁신해야 합니다. 쇄신하지 않으면 미래가 없습니다.","그럼 무엇부터 되찾아야 하느냐. 저는 경청이라고 봅니다. 제가 지방의원을 할 때 선배들은 늘 '지방의원은 경청이 가장 중요하다, 민원을 잘 듣고 처리해야 한다'고 했습니다. 그런데 국회의원은 무엇이 특별해서 다릅니까? 정치의 미래라는 것이 무엇입니까. 국민의 목소리를 듣고 그 불편함과 절망과 불안을 실제 행정으로 해결하는 것 아닙니까. 지금 민주당에서 사라진 것이 바로 그것입니다.","★ 저는 이번 결과와 무관하게 청년 세대와 함께 민주당의 혁신 운동을 계속하겠습니다. 민생 중심, 미래 중심, 그리고 진짜 당원 중심의 정당을 만드는 일입니다."],"quotes":[],"notes":["⚠ 신천지는 '논란·의혹'까지만 — 사실관계 단정 금지(수사 중)","✔ 충북: 7.28 본경선 온라인투표 첫날 오전 접속 오류 약 1시간 → 투표시간 1시간 연장, 원인·경위·사과 없음"]},{"no":2372,"media":"취재편의점","q":"[예상 추가 9] 정부·여당이 추진하는 미래대응기금을 어떻게 보나.","tags":["미래대응기금","3대메가프로젝트","반도체추가세수","청년몫","재정투명성","재정주권시민행동"],"script":["★ 미래대응기금이야말로 이번 전당대회에서 토론됐어야 할 의제입니다. 당정이 7월 5일 반도체 추가세수로 이 기금을 신설하겠다고 발표했습니다. 3대 메가 프로젝트, 양극화 대응, 그리고 2030 청년의 주거·창업·일자리 — 이만한 의제가 없는데 후보 토론에서는 한마디도 나오지 않았습니다.","방향은 맞다고 봅니다. 반도체 호황으로 생긴 추가 세수를 미래에 투자하겠다는 것 아닙니까. 대통령이 하려는 일을 당이 어떻게 뒷받침할지 논의하는 것, 그것이 전당대회가 했어야 할 일입니다.","★ 다만 두 가지를 짚겠습니다. 첫째, 청년 몫이 있다면 설계에 청년 당사자가 참여해야 합니다. 청년 주거·창업·일자리 지원을 기성 정치인들끼리 설계하면 또 현장과 어긋난 정책이 나옵니다. 청년정책의 공급자를 청년 당사자로 바꾸라는 말씀, 이 기금에도 그대로 적용됩니다.","★ 둘째, 기금일수록 투명해야 합니다. 어디에 얼마를 쓰는지 1원까지 실시간으로 공개해야 합니다. 세금이 제대로 쓰이는지 시민이 직접 들여다보게 하는 것 — 제가 하려는 '재정주권 시민행동'이 바로 그 일입니다."],"quotes":[],"notes":["✔ 확인(경향신문 7.5): 7.5 고위당정협의회 발표 — 반도체 등 추가세수 재원 / 용도: 3대 메가 프로젝트(반도체·AI 데이터센터·피지컬AI)·양극화 대응·2030 청년 주거·창업·일자리 / 관련 법률 제정 추진 중","⚠ 기금 규모·액수는 미공개 — 숫자 언급 금지"]},{"no":2300,"media":"이데일리","q":"Q1. 이번 전당대회를 어떻게 전망하나. 본경선 국면을 어떻게 보고 있나.","tags":["전당대회전망","충북투표중단","선관위불신","당원명부","계파싸움","재창당","5무재현","경청"],"script":["★ 솔직히 말씀드리면, 지금의 전당대회는 이해할 수가 없습니다. 저는 출마 선언에서 민주당에 없는 것 다섯 가지를 찾아오겠다고 말했습니다. 공정이 없고, 민주주의가 없고, 그래서 청년이 없고, 청년이 없으니 미래가 없고, 결국 세대교체가 없다. 이번 전당대회는 제가 지적한 그 다섯 가지를 하나도 빠짐없이 그대로 다시 보여 준 민낯입니다. 나아진 것 하나 없이 오히려 더 나빠진 채로 반복되고 있기 때문입니다.","★ 당장 본경선 첫날부터 충북에서 사고가 났습니다. 오전 9시에 투표가 시작됐는데 충북 권리당원들은 '개인정보가 일치하지 않는다'는 오류로 한 시간 가까이 투표에 접속조차 하지 못했습니다. 당은 투표 시간을 한 시간 연장하는 것으로 끝냈습니다. 왜 그런 일이 벌어졌는지 원인 설명도, 경위 공개도, 당원들에 대한 사과도 없었습니다.","★ 그 한 시간 동안 멈춰 있었던 것은 시스템이 아니라 당원의 주권입니다. 선거를 관리하는 기구가 이런 일을 겪고도 아무 말이 없는데, 당원들이 그 선거관리위원회를 어떻게 신뢰합니까.","★ 여기에 신천지 논란까지 겹치면서 당원 명부 자체의 신뢰성이 도마에 올랐습니다. 그런데 검증은 하지 않고 '1인 1표', '당원주권'이라는 말만 반복하고 있습니다. 당원이 진짜 당원인지 확인하는 것이야말로 정당 민주주의의 기본이고 1인 1표 당원주권의 출발점입니다. 그 기본은 어디다 갖다 버리고 편 가르기와 계파 싸움만 하고 있습니까. 검증 없는 1인 1표는 당원주권이 아니라 구호일 뿐입니다.","★ 분열의 씨앗은 불신에서 자랍니다. 당의 시스템을 믿을 수 있다면 경쟁하고 승복하면 될 일입니다. 그런데 지금 누가 그 시스템을 신뢰합니까. 서로를 증오하고 적으로 규정하는 문화에서는 경쟁을 통해 승자가 정해지는 구조 자체가 만들어질 수 없습니다. 이번에 직접 겪어 보니 특정 계파로 낙인찍어 공격하는 일이 너무나 일상화되어 있었습니다.","★ 그래서 저는 이번 전당대회를 축제가 아니라 위기 신호로 봅니다. 민생과 미래를 챙기지 못하는 민주당, 민주주의의 기본 원칙조차 지키지 못하는 민주당은 재창당 수준으로 혁신해야 합니다. 쇄신하지 않으면 미래가 없습니다.","그럼 무엇부터 되찾아야 하느냐. 저는 경청이라고 봅니다. 제가 지방의원을 할 때 선배들은 늘 '지방의원은 경청이 가장 중요하다, 민원을 잘 듣고 처리해야 한다'고 했습니다. 그런데 국회의원은 무엇이 특별해서 다릅니까? 정치의 미래라는 것이 무엇입니까. 국민의 목소리를 듣고 그 불편함과 절망과 불안을 실제 행정으로 해결하는 것 아닙니까. 지금 민주당에서 사라진 것이 바로 그것입니다.","★ 저는 이번 결과와 무관하게 청년 세대와 함께 민주당의 혁신 운동을 계속하겠습니다. 민생 중심, 미래 중심, 그리고 진짜 당원 중심의 정당을 만드는 일입니다."],"quotes":[],"notes":["✔ 충북: 7.28 본경선 온라인투표 첫날 오전, 충북 권리당원 접속 오류 → 투표시간 1시간 연장. '연장은 했지만 원인 규명·경위 설명·사과가 없었다'로만 말할 것","⚠ 신천지는 '논란·의혹'까지만 — 사실관계 단정 금지(수사 중)","※ 이 답변이 인터뷰 전체의 스파인. Q3·Q4·Q7·Q8에서 5무가 한 번씩 다시 호출됨"]},{"no":2301,"media":"이데일리","q":"Q2. 예비경선 결과를 어떻게 받아들이나. 직접 치르면서 가장 크게 느낀 점과 아쉬웠던 점은.","tags":["소회","시원섭섭","검증의링","토론회","도돌이표"],"script":["겸허히 받아들입니다. 시원섭섭합니다. 그렇지만 결과는 졌어도 도전은 지지 않았습니다.","먼저 감사 인사부터 드리고 싶습니다. 조직도 계파도 없는 세 명짜리 캠프였습니다. 사무실도 없이 카페를 전전하던 저희를 여기까지 오게 해 주신 분들, 후원해 주신 분들, 정말 많은 분들이 손을 잡아 주셨습니다.","저는 이번 경선에서 확인했습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들이 계시다는 것을, 젊은 날의 자신을 떠올리며 청년의 도전에 손을 내밀어 주시는 분들이 계시다는 것을. 그 한 표 한 표가 거대한 기득권 바위에 금을 내고 있다고 생각합니다.","★ 가장 크게 느낀 것은 분위기가 달라졌다는 것입니다. 짱돌을 들었던 민주화운동 세대 선배님들이 직접 전화를 주셔서 격려해 주셨습니다. 청년들은 '이제 참지 않겠다면서 하고 싶은 말을 다 해 줘서 속이 시원하다'고 했습니다. 세대를 불문하고 많은 분들이 '맞는 소리 했다, 집중 공격받는다고 위축되지 말고 발언해라, 다 응원하고 있다'고 공감해 주셨습니다. 저는 거기서 희망을 봤습니다.","★ 가장 아쉬운 것은 시간입니다. 후보자 등록 서류가 거의 하루 전에 떴습니다. 그 서류 만들고 후원회 만드느라 시간을 다 썼고, 실제 선거운동은 사실상 하루 정도였습니다. 기탁금 구하느라고 얼마나 고생을 했는데, 고작 동영상 촬영 7분이 주어지고, 후보들과 소통하고 이야기를 나눌 수 있는 자리는 전무했습니다.","★ 결과적으로 검증의 링이 없었습니다. 경선 규칙은 등록 뒤에야 받았고, 합동연설회 한 번 외에 후보들이 맞붙어 검증받는 토론회는 없었습니다. 첫 방송토론은 컷오프가 다 끝난 뒤에야 열렸습니다. 지금까지도 제가 몇 표를 얻었는지 모릅니다. 정책과 비전을 보여 줄 기회도, 부족함을 확인할 데이터도 주지 않는 경선이 또 반복된 것입니다.","★ 무엇보다 걱정스러운 것은 이것이 처음이 아니라는 점입니다. 지난 지방선거에서 겪은 일이 고스란히 도돌이표처럼 반복됐습니다. 오히려 더했습니다. 시간은 더 부족했고, 득표율은 아예 알려 주지도 않았습니다. 지난 지방선거보다 더하면 더했지 덜하지 않았습니다. 이대로 어떻게 총선에서 승리하겠습니까. 목이 터져라 외쳐도 소 귀에 경 읽기이고, 개가 짖든 말든 기차는 간다는 식입니다. 저는 그것이 정말 걱정됩니다.","또 하나 마음에 걸리는 것은, 김보미닷컴에 '토론회 가서 이 말 좀 대신 해 달라'는 의견을 정말 많은 분들이 남겨 주셨는데 그 말씀들을 다 전하지 못하고 끝났다는 점입니다."],"quotes":[],"notes":["✔ '토론회 0회' → '합동연설회 한 번 외 검증 토론회 없음 / 첫 방송토론은 컷오프 이후'로 정정(7.20 합동연설회는 실제로 있었음)","⚠ '동영상 촬영 7분'은 보도로 확인되지 않는 후보 본인 경험 — 본인 체험으로만 말하고 당 공지 규정처럼 말하지 말 것","※ '개가 짖든 말든 기차는 간다'는 강한 표현 — 지면에 그대로 인용될 수 있음. 사용 여부는 현장 판단"]},{"no":2302,"media":"이데일리","q":"Q3. 전국 최연소 기초의회 의장 출신 지방정치인으로서 중앙 무대에 진입할 때 마주한 가장 큰 장벽은.","tags":["지방정치인","진입장벽","돈의벽","정보의벽","족보의벽","흥신소정치","성장사다리","맘다니"],"script":["★ 돈, 정보, 족보 — 세 개의 벽이 있었습니다. 제가 출마 선언에서 '공정이 없다'고 말한 것의 실물이 바로 이 세 개의 벽입니다.","첫째는 돈의 벽입니다. 기탁금 구하는 데 반나절, 후원계좌 만드는 데 이틀을 썼습니다. 선거기간이 사실상 나흘인데 말입니다. 참으로 청년에게 매정하고 냉혹한 정당입니다.","★ 둘째는 정보의 벽입니다. 경선 규칙은 후보 등록을 마친 뒤에야 받았고, 전당대회 신청 서류는 거의 하루 전에야 공지받았습니다. 높으신 분들이 그걸 몰라서 서류를 못 냈다면 가만히 계셨겠습니까. 정보가 흐르는 곳에는 흐르고 막히는 곳에는 막히는, 그들만의 리그가 아니었냐는 것입니다. 참고로 당헌 제25조 제5항은 당대표·최고위원 후보자등록 신청 개시일 전 30일까지 규칙을 확정하라고 되어 있는데, 이번에는 그 기한을 이번 전당대회에 한해 면제한다는 부칙을 만들어 비껴갔습니다.","★ 셋째는 족보의 벽입니다. 계파가 없으면 유령 취급을 받고, 사진 한 장 찍히면 '누구 파냐'는 검증부터 받습니다. 저는 그것을 흥신소 정치라고 부릅니다.","★ 저는 5대 분야 25개 정책공약과, 민주당이 가야 할 길 12개를 담은 '민주당 대전환 선언문'을 발표했습니다. 그런데 정책은 보지도 않고 십몇 년 전 누구와 사진을 찍었는지 파묘가 시작됐습니다. 정책을 놓고 토론을 해야 하는데 사진을 뒤져 악플과 문자를 보내는 것을 보면 허탈합니다.","진영논리에 매몰돼 본인이 지지하는 후보 얼굴 깎이는 줄도 모르고 욕설과 비방을 하는 지지자들을 보면 안타깝습니다. 집에 가서 자녀분들 앞에서는 하지 못할 말들 아닙니까. 정치인이라고 해서 익명으로 아무렇게나 쏟아내는 말을 다 받아 주는 감정 쓰레기통이 아닙니다.","논리로 두들겨 맞으면 아플지 모르지만, 아무 말 대잔치식 욕설과 비방에는 타격감이 1도 없습니다. 저는 오히려 반면교사로 삼았습니다 — 내가 지지하는 후보가 있다면 그 후보를 생각해서라도 언행을 똑바로 해야겠구나. 지난 13년 정치하면서 하도 이리저리 굴러 봐서, 이번 욕설과 비방도 아프긴 했지만 개의치 않았습니다. 다만 허위사실 유포에 대해서는 절대 간과하지 않겠습니다.","★ 지방의원이라고 평가절하하는 비난도 받았습니다. 지방의회는 중앙의 축소판입니다. 조례 만들고 예산 심의하고 행정사무감사 하고 주민을 대변합니다. 국회가 하는 일을 규모만 작게 다 합니다. 유럽은 지방의원부터 정치인을 키웁니다. 프랑스는 하원의원의 60% 이상이 지방직 경력자이고, 영국도 지난 총선에서 당선 가능성이 높은 지역구 후보의 절반가량이 지방의원 출신이었습니다. 스웨덴은 아예 국회의원이 지방의원을 겸직합니다. 그런데 우리는 지방의회를 정치의 입구가 아니라 변방으로 취급합니다. 정작 우리 국회를 보면 지방의원 경험 한 번 없이 곧바로 국회의원부터 시작한 분들이 대다수입니다. 조례 한 줄 만들어 본 적 없고, 예산 한 건 심의해 본 적 없고, 주민 민원을 직접 받아 본 적 없는 분들이 그 경험을 해 본 사람을 향해 '지방의원 출신'이라며 낮춰 봅니다. 현장을 겪어 보지 않은 쪽이 겪어 본 쪽을 평가절하하는 것인데, 세계 어느 정당도 이런 식으로 사람을 키우지 않습니다. 커리큘럼 자체가 잘못된 것입니다. 정당이 성장 사다리가 되어 청소년기부터 청년을 키워야 합니다.","★ 제가 서른일곱입니다. 그런데도 아직 어리다는 취급을 받습니다. 저보다 동생뻘인 조란 맘다니가 올해 1월 뉴욕시장에 취임했습니다. 프랑스는 만 서른 살 조르당 바르델라가 원내 제1당의 대표이고, 서른일곱 살 가브리엘 아탈은 총리를 지낸 뒤 지금 집권당을 이끌고 있습니다. 왜 못할 것이라고 평가절하하십니까. 본인들이 그 나이에 무엇을 했는지, 그리고 지금까지도 무엇을 쥐고 계신지 되돌아보시라고 일침하고 싶습니다."],"quotes":[],"notes":["✔ 한국의 '지방의원 출신 국회의원' 통계는 확인되지 않아 수치 삭제 — 프랑스 62%, 영국 2024 총선 당선권 후보 51%, 스웨덴 겸직으로 대체(모두 확인됨)","✔ 맘다니 = 1991.10.18생 만 34세, 2026.1 뉴욕시장 취임 → '동생뻘' 대신 '세 살 아래'","✔ 바르델라(만 30세)·아탈(만 37세)로 '30대 당대표' 근거 보강","※ 부칙 신설 경위(6.10 당무위 → 6.16 중앙위)는 Q4에서 상세히 — 여기서는 한 문장만"]},{"no":2303,"media":"이데일리","q":"Q4. '민주당에는 민주주의가 없다'고 비판했다. 실제 경험한 당내 의사결정 구조의 가장 큰 문제는.","tags":["당내민주주의","고무줄규칙","30일규정","단서조항","불법당원","말바꾸기","5무"],"script":["앞서 말씀드린 '없는 것 다섯 가지' 가운데 민주주의가 없다는 것, 그 실물을 이번 예비경선에서 그대로 겪었습니다. 짧은 경선이었지만 제가 외쳤던 모든 것이 총망라돼 있었습니다. 크게 네 가지입니다.","★ 첫째, 규칙이 힘 있는 사람의 사정에 따라 움직입니다. 당헌 제25조 제5항은 당대표·최고위원 선출 방식과 절차를 '후보자등록 신청 개시일 전 30일까지 확정한다'고 못 박고 있습니다. 그런데 6월 10일 당무위원회를 거쳐 6월 16일 중앙위원회에서 '이번 전당대회에 한해 그 준비 기한을 적용하지 않는다'는 부칙을 최종 가결했습니다. 저는 7월 14일 국회 소통관 기자회견에서 이 점을 그대로 지적했습니다. 법을 고치지 않고 시행령으로 우회하는 것과 똑같은 방식입니다. 후보자 등록 공지도 거의 하루 전에야 알 수 있었습니다.","★ 둘째, '단, 달리 정할 수 있다'는 단서조항이 너무 많습니다. 누굴 떨어뜨리고 싶으면 떨어뜨리고, 자격이 안 되는 사람도 붙이고 싶으면 붙일 수 있는 구조입니다. 이번에도 송영길 후보(입당 6개월 규정에 걸린 후보)의 자격 문제가 불거지자, 7월 16일 밤 긴급 최고위원회에서 논의한 뒤 다음 날 비공개 최고위에서 예외를 의결해 자격을 열어 줬습니다.","★ 그런데 같은 규정이 4년 전에는 정반대로 작동했습니다. 2022년 전당대회에서 청년 박지현 전 비대위원장은 '입당 6개월 미만'을 이유로 후보 자격 심사조차 통과하지 못했습니다. 같은 6개월 규정인데 한 번은 문을 닫는 잣대가 되고, 한 번은 예외를 여는 문이 됐습니다. 사람을 비교하는 것이 아니라 절차를 비교하는 것입니다. 규칙이 사람에 따라 늘었다 줄었다 하는 고무줄이라면 그것은 이미 규칙이 아닙니다.","★ 면접에 비유하면 이렇습니다. 한 청년은 자격이 되는지 봐 달라며 원서를 냈는데 봉투조차 뜯지 않았고, 한 선배는 접수한 뒤 자격이 안 되는 게 드러나자 규정을 바꿔 달라고 했습니다. 그러고는 '그런 건 당에서 알아서 챙겨 줘야지'라고 하셨습니다. 일개 후보자의 개인 등록 서류를 왜 당이 챙겨 줍니까. 당이 사당입니까.","★ 왜 이런 말도 안 되는 일들이 당연하다고 하십니까. 본인 가족의 일이라면 가만히 계시겠습니까. 어디다 대고 비교하느냐고 호통을 치시는데, 그 비교 자체가 잘못됐다는 것을 정작 모르십니다. 답답했습니다.","★ 셋째, 약속조차 뒤집힙니다. 후보자 설명회에서는 경선 득표 결과를 알려 준다고 해 놓고 갑자기 말이 바뀌어 아무것도 알려 주지 않았습니다. 결과를 공개하지 않는 1인 1표는 가짜입니다. 전당대회준비위원회가 7월 7일 만장일치로 의결한 청년최고위원제는 7월 14일 최고위원회에서 부결됐고, 같은 날 최고위는 선호투표제를 의결했습니다. 당내에서조차 두 사안이 거래된 것 아니냐는 말이 나왔습니다.","★ 넷째, 신천지 논란 등 불법 당원 문제가 불거졌는데도 그냥 강행한다고 합니다. 가짜 당원이 가짜 후보를 뽑는 것 아닙니까. 저는 지난 지방선거 경선 때부터 불법 당원 문제를 지적하고 대안을 제시해 왔지만 불통의 민주당은 콧방귀도 뀌지 않았습니다.","여기에 하나를 더한다면 이견의 처벌입니다. 다른 목소리를 내면 좌표가 찍히고 악플과 문자 폭격이 쏟아집니다. 이견을 처벌하는 정당에는 결국 침묵만 남습니다. 당원이 주인이라는 말과 실제 의사결정 사이의 이 간격 — 그것이 제가 본 민주당의 민주주의 부재입니다.","★ 제가 기자회견에서 드린 말씀 그대로입니다. '규칙 없는 것'은 최악의 '불공정'입니다. 선수들의 대리인, 즉 민주당 최고위가 룰을 결정하는 것은 세계적인 망신거리입니다."],"quotes":[],"notes":["✔ 박지현 사례는 2022년 건 — 반드시 연도를 붙여 '같은 6개월 규정의 정반대 적용'으로만 말할 것","✔ 자격 예외: 7.16 밤 긴급 최고위 '논의' → 7.17 비공개 최고위 '의결'","✔ 부칙: 6.10 당무위 통과 → 6.16 중앙위 최종 가결(2단계)","✔ 청년최고위원제: 전준위 7.7 만장일치 의결 → 7.14 최고위 부결 / 같은 날 선호투표제 의결","⚠ 송영길 관련: 돈봉투·재판 언급 금지. 실명 뒤 괄호가 대체 표현 — 실명 사용 여부는 현장 판단"]},{"no":2304,"media":"이데일리","q":"Q5. 유령·불법 당원 가능성을 제기하며 '진짜 1인 1표'를 주장했다. 신천지 조직적 개입 의혹도 같은 문제의 연장선인가. 최근 논란을 어떻게 보나.","tags":["신천지","대리당원","전수조사","행안부명부대조","진짜1인1표"],"script":["★ 정확히 같은 뿌리입니다. 제가 '진짜 1인 1표'를 주장한 이유가 바로 이것입니다 — 당원 명부를 당이 스스로 검증하지 못하면 언젠가 반드시 이런 일이 터진다는 것이었습니다. 저는 지난 지방선거 경선 때부터 이 문제를 지적해 왔습니다.","★ 논점은 정확히 해야 합니다. 신천지 신도가 당원에 가입하는 것 자체를 뭐라 할 수는 없습니다. 국민 누구나 정당에 가입할 자유가 있습니다. 문제는 종교가 아니라 대리 당원입니다. 본인 의사와 무관하게 이름이 올라가고 남이 당비를 대신 내주는 당원 — 신천지든 누구든 명백한 불법입니다.","수사기관이 정황을 잡고 수사 중이니 판정은 수사가 합니다. 당이 할 일은 따로 있습니다. 당원 명부 전수조사입니다.","★ 그런데 당이 한 일은 전수조사가 아니었습니다. 약 500만 명 당원의 주소를 특정 종교시설 주소와 대조해 네 건이 일치한다는 것을 확인했고, 불법 등록이 의심되는 5만 4천여 명의 투표권을 제한하는 선에서 정리했습니다. 그리고 전당대회는 예정대로 강행합니다. 이건 검증이 아니라 봉합입니다. 5만 4천 명의 투표권을 제한해야 할 만큼 명부에 문제가 있다고 스스로 인정하면서, 정작 그 명부가 전체적으로 어떤 상태인지는 확인하지 않겠다는 것입니다.","★ 어려운 일도 아닙니다. 행정안전부에 명부를 대조하면 며칠이면 될 일인데 하지 않고 있습니다. 훨씬 많은 명단을 다루는 은행도 다 관리합니다. 정당만 일부러 하지 않는 것처럼 보입니다. 하다못해 전화만 돌려 봐도 됩니다. 최소한 1년에 한 번은 정기 전수조사를 해야 합니다. 지금까지 단 한 번도 하지 않았고, 문제가 제기돼도 그냥 무시하고 넘어갔습니다. 알면서도 필요하니까, 기득권이 한 번 더 해 먹기 위한 원천이라고 봅니다.","본인이 가입했는지, 당비를 본인이 내는지 전수 검증하면 대리 당원은 종교와 상관없이 걸러집니다. 명부 검증과 경선 데이터 100% 공개 없이는 이번이 아니어도 같은 일이 또 반복됩니다."],"quotes":[],"notes":["✔ '전수조사를 안 한다'만 말하면 '조치했다'는 반박이 나옴 → 당이 실제로 한 조치(주소 대조 4건 일치 / 5만 4천여 명 투표권 제한 / 8.17 전대 강행)를 먼저 인정하고 '봉합이지 검증이 아니다'로 반박 봉쇄","⚠ 신천지 사실관계 단정 금지(수사 중) — '의혹·정황'까지만. '특정 종교시설'로 표현하면 더 안전"]},{"no":2305,"media":"이데일리","q":"Q6. 화염병 짱돌, 꼰대 등 파격 발언이 많았다. 주변 반응은 어땠나.","tags":["파격발언","짱돌","악플","저격글","골든타임","국민에게줄서기"],"script":["처음에는 말리는 분들이 많았습니다. '그러다 다친다'고요. 실제로 양쪽 진영에서 악플과 문자 폭격을 받았습니다. 가정사까지 끌어오는 인신공격, 원인도 모르고 개연성도 없는 그야말로 '아무 말 대잔치'였고, 학폭에 가까운 공격이었습니다.","본인이 지지하는 후보 얼굴을 대문짝만하게 걸어 놓고 신랄한 욕설과 비방을 하시는 분들을 보면 참담하기까지 했습니다. 제 욕을 하시는 분들 프로필만 봐도 지지 후보가 대문짝만하게 보입니다. 청년들을 시켜 저를 향한 저격 글도 많이 올렸더군요. 나중에 그 글을 올린 청년이 개인적으로 연락을 해 와 '어쩔 수 없었다, 미안하다'고 사과했습니다. 이게 청년들이 놓인 현실입니다. 그런가 하면 다른 청년들은 용기를 내어 응원해 주기도 했습니다.","★ 무엇보다 인상 깊었던 것은, 실제로 화염병과 짱돌을 들었던 민주화운동 세대 선배님들이 직접 전화를 주신 일입니다. 격려해 주시고, 본인 세대가 미안하다고까지 하셨습니다. 비난을 각오하고 드린 말씀인데 그 세대 당사자들께서 손을 내밀어 주신 겁니다. 울컥했습니다.","★ 저는 양쪽에서 공격받은 것이 오히려 몹시 명예롭다고 생각합니다. 어느 진영에도 속하지 않았다는 증명서를 양쪽에서 발급해 준 셈이니까요. 표 받을 유불리를 따지기보다 할 말을 해야 할 시기입니다. 민주당이 지금 골든타임을 넘기면 총선이고 대선이고 다 망합니다. 밥그릇 싸움 그만하시고 민생을 우선순위에 놓으시라고 다시 한번 읍소하고 싶습니다.","★ 다만 파격 발언 자체가 목적이었던 적은 없습니다. 조곤조곤 부탁드리고 읍소해서는 들어주지 않는다는 것을 지난 13년간 탈탈 털리며 배웠습니다. 가만히 있으라고 해서 가만히도 있어 봤고, 이리저리 두들겨 맞아도 봤습니다. 증거도 근거도 없는 사유로, 한 번의 소명 기회도 없이 징계를 받아 정치생명이 끝났던 적도 있었으니까요. 결국 줄은 국민에게 서야 한다는 것이 답이었습니다. 어떤 정치인이, 어떤 국회의원이 우리들의 삶을 책임져 줍니까. 저는 앞으로도 오직 국민만 보고 줄을 서겠습니다."],"quotes":[],"notes":["⚠ 저격 글을 올린 청년 사례는 개인 특정 없이 '한 청년'으로만"]},{"no":2306,"media":"이데일리","q":"Q7. 과거 개혁·진보·젊은 정당으로 평가받던 민주당이 지금은 어떤 정당이 됐나. 정체성에 변화가 있다고 보나.","tags":["정체성","도전정신","686","적통","계파싸움","미래없음"],"script":["★ 지금은 지키는 정당이 됐습니다. 지금의 민주당은 686의 민주당, 그 이하도 이상도 아니지 않습니까. 세대별 지지율을 봐도 그렇고 구성원을 봐도 그렇습니다. 그때 발탁된 젊은 피가 30년째 자리를 지키고, 전당대회는 미래가 아니라 누가 적통이냐는 족보 논쟁을 하고 있습니다. 내로남불·불공정·위선의 끝판왕, 책임지지 않는 후안무치한 정치인의 표본을 청년들이 민주당에서 봅니다.","★ 제가 말한 '미래가 없다'는 것이 바로 이겁니다. 이번 전당대회에서 민생이 의제였던 적이 있습니까. 청년 일자리, 주거, 부채가 쟁점이 된 적이 있습니까. 남은 것은 계파 공방과 자격 시비뿐이었습니다. 지금 국민들의 마음은 '보기도 듣기도 싫다'입니다. 민생과 삶에서 동떨어진 밥그릇 싸움, 계파 싸움만 하고 있지 않습니까. 이러니 686이 786, 886까지 해 먹겠다고 하면 민주당은 폭망한다는 것입니다. 도전하던 사람들이 도전받는 자리에 서더니 도전 자체를 막고 있는 것입니다.","다만 정체성이 죽었다고는 생각하지 않습니다. 이번 경선에서 확인했습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들, 젊은 날의 자신을 떠올리며 청년의 도전에 손을 내밀어 주시는 분들이 계십니다. 민주당의 적통은 혈통이 아니라 도전정신이고, 그 도전정신은 침묵하는 다수 속에 살아 있습니다.","★ 결국 민주당의 정체성은 김대중, 노무현의 '계란으로 바위 치기', 그 도전정신이었습니다. 저는 그 도전정신의 적통을 잇겠다는 것입니다."],"quotes":[],"notes":[]},{"no":2307,"media":"이데일리","q":"Q8. 청년을 선거 때만 활용하고 권한은 주지 않는다고 비판했다. 당대표·최고위원 본경선 진출자 중 2030이 한 명도 없다. 어떻게 평가하나.","tags":["2030전무","설계된결과","청년최고위원","기탁금","병풍","빽없는청년","세대교체없음"],"script":["설계된 결과입니다. 제도에서 지웠습니다 — 전준위가 만장일치로 의결한 청년최고위원제를 최고위가 부결시켰습니다. 돈으로 막았습니다 — 예비경선 기탁금을 최고위원 기준 500만 원에서 2,000만 원으로 네 배 올렸습니다. 기회를 봉쇄했습니다 — 검증 토론회 없이 선거운동 나흘. 결과를 감췄습니다 — 몇 표인지 아무도 모릅니다.","★ 그 결과가 지금 눈앞에 있습니다. 당대표와 최고위원 본선 진출자 가운데 2030은 한 명도 없습니다. 청년 후보들은 전부 예비경선에서 걸러졌습니다. 반대로 당대표 본선에 오른 세 분은 모두 686 세대입니다. 제가 출마 선언에서 '청년이 없다, 세대교체가 없다'고 말한 것이 예언이 아니라 관찰이었다는 것을 이번 전당대회가 스스로 증명해 준 셈입니다.","★ 말로만 청년이고, 청년은 구호이자 병풍이라는 것을 보여 준 것 아닙니까. 지금 당대표 후보들도 청년을 구호로 외치지만, 지금까지 청년이 떠나는 당을 만드는 데 최선을 다해 오신 분들입니다. 지금의 민주당이 그것을 증명합니다.","★ 지금 구조에서 빽 없는 청년이 예비경선을 통과할 수 있겠습니까. 애초에 통과할 수 있도록 설계돼 있지 않습니다. 그런데도 도전한 청년들이 있었고, 도전했다는 것만으로 욕설과 비방이 쏟아졌습니다. 그래서 저는 그 도전 자체가 더 귀하고 소중하다고 봅니다.","★ 2030 전무는 이 구조가 정확히 작동했다는 증거입니다. 영입할 때는 미래라고 부르고, 규칙을 정하는 방에서는 지웁니다. 기자회견 때는 병풍처럼 세워 놓고 사진 찍고 돌려보냈습니다. 청년을 동료 주주가 아니라 득표 도구로 쓰는 정당의 필연적 결과입니다.","당의 2030 지지율이 최고였던 때가 언제입니까. 김대중 대통령이 서른한 살 김민석 같은 청년을 국회로 보냈을 때였습니다. 답은 이미 나와 있습니다. 답을 알지만 밥그릇을 뺏기고 싶지 않은 것이겠지요."],"quotes":[],"notes":["✔ 김민석 = 1964.5.29생, 1996.4.11 15대 총선 당선 당시 만 31세 → '32세'가 아니라 '서른한 살'","✔ 송영길은 2000년 16대 첫 당선이라 'DJ의 30대 발탁' 사례에서 제외","※ '밥그릇' 대목은 본선 후보 실명과 붙이지 말고 구조 비판으로만"]},{"no":2308,"media":"이데일리","q":"Q9. 2030 세대의 민주당 이탈 — 무엇이 문제이고 어떻게 해결할 수 있나.","tags":["2030이탈","말과행동","청년최고위원","임명직","결정권","청년정책","디지털플랫폼","청년취업보장제"],"script":["★ 원인은 말과 행동의 거리입니다. 말로는 청년을 외치면서 기탁금이라는 장벽은 세워 두고, 청년최고위원제는 좌초시켰습니다. SNS 세대는 그 간격을 실시간으로 확인합니다. 청년들은 몰라서 떠나는 것이 아니라 너무 잘 알아서 떠나는 것입니다.","★ 해결에는 순서가 있습니다. 참여와 정책은 선택지가 아니라 순서입니다. 결정하는 방에 청년이 없으니 청년의 정책이 없는 것입니다. 청년정책의 공급자를 기성 정치인에서 청년 당사자로 바꾸는 것 — 그것이 제 청년정책의 핵심입니다.","★ 첫째, 청년최고위원제를 도입해야 합니다. 전당대회준비위가 만장일치로 의결하고도 최고위에서 부결된 그 제도를 되살려, 청년이 당의 최고 의사결정 테이블에 정식으로 앉아야 합니다. 임명직 당직도 마찬가지로 일정 비율은 반드시 청년으로 채워야 합니다. 선출직의 문이 좁다면 임명직에서라도 길을 열어야 청년이 당에서 배우고 성장할 수 있습니다.","둘째, 당 청년위원회를 청년정책 최고 의결기구로 격상하고 그 결정이 당론 입법으로 이어지게 하겠습니다. 셋째, 당 예산의 10%를 청년이 직접 편성·집행·평가하게 하겠습니다. 시혜는 회수되지만 당헌에 새긴 결정권은 회수되지 않습니다.","★ 넷째, 기탁금을 폐지하고 당직선거 공영제를 도입해 돈이 없어도 도전할 수 있는 링을 만들겠습니다. 다섯째, 청년취업보장제를 민주당의 핵심 정책으로 도입하겠습니다. 배우고, 취업하고, 정착하는 사다리를 지역 안에 만드는 것입니다.","★ 그 위에서 일자리, 주거, 부채라는 삶의 문제를 의제로 올리고, 젊은 세대가 직접 의제를 올리고 토론하고 표결하는 디지털 플랫폼을 만들겠습니다. 로그인만 하는 정당이 아니라 시민의 삶과 링크된 정당이어야 합니다.","제가 계속 드린 말씀은 사실 아주 단순합니다. 청년들 목소리 좀 들어 주면 안 됩니까?"],"quotes":[],"notes":[]},{"no":2309,"media":"이데일리","q":"Q10. 컷오프 이후에도 최고위원회 해체·경선 결과 공개 요구 활동을 계속하겠다고 했다. 구체적 계획과 다음 정치적 목표는.","tags":["앞으로의계획","대전환선언","홍대선언","오뚝이","재정공개","재정주권시민행동"],"script":["김대중 대통령은 젊은 피 수혈로 30대 인재를 발탁했고, 그분들이 30년, 40년 잘해 오시지 않았습니까. 그럼 지금의 젊은 세대가 못 할 게 무엇입니까. 이미 검증된 것입니다. 그 당시 2030 민주당 지지율이 가장 높았습니다. 지금은 지지하지 않습니다. 오직 5060만 지지할 뿐입니다. 그럼 답은 정해져 있는 것 아닙니까.","686 선배님들, 발탁되셔서 잘해 놓고 무엇이 걱정돼 자리를 붙들어 매고 청년의 진입을 막고 계십니까. '지구가 멸망하더라도 나는 내 밥그릇만 챙기면 된다'는 마인드로는 모두 다 죽습니다. 정신 차려야 합니다.","★ 앞으로 할 일은 두 가지입니다. 하나는 청년정책의 공급자를 기성 정치인에서 청년 당사자로 바꾸는 것, 이건 두말할 것 없는 당연한 의제입니다. 다른 하나는 예비경선 결과가 나오기 전 제가 홍대에서 선언한 '민주당 대전환 선언'의 실행입니다. 경선 규칙 6개월 전 확정과 '달리 정할 수 있다' 단서조항 삭제, 기탁금 폐지와 당직선거 공영제, 경선 결과 100% 공개, 당 재정 1원까지 실시간 공개 — 누가 당대표가 되더라도 바뀌지 않는 시스템을 만드는 12대 과제를 본선 세 후보에게 계속 묻겠습니다. 국고보조금과 당비를 어디에 썼는지, 여론조사는 어떤 업체와 계약했는지, 10원짜리 하나까지 공개해야 합니다.","★ '재정주권 시민행동'을 확산해 나가겠습니다. 그야말로 시민들의 민원을 해결하는 정치입니다. 세금이 제대로 쓰이고 있는지, 예산이 계획대로 집행되고 있는지를 시민이 직접 들여다보게 하는 운동입니다. 정치의 미래라는 것이 결국 국민의 목소리를 듣고 그 불편함과 절망을 행정으로 해결하는 것이라면, 저는 그 자리에서부터 다시 시작하겠습니다. 청년 세대와 함께하는 디지털 플랫폼 운동도 계속합니다.","제 별명이 오뚝이입니다. 넘어뜨릴 때마다 기어이 다시 일어났습니다. 다음 목표를 자리로 말씀드리지는 않겠습니다. 다만 방향은 분명합니다 — 민주당을 다시 젊은 정당, 도전하는 정당으로 만드는 것입니다. 김보미의 도전은 이제 시작입니다."],"quotes":[],"notes":["※ Q1에서 이미 '경청·정치의 미래'를 말했으므로 여기서는 '무엇을 할 것인가'에 집중"]},{"no":2310,"media":"이데일리","q":"① 출마선언 '5무(無)' → 이번 전당대회 재현 대조표 (인터뷰 전체의 스파인)","tags":["첨부","5무","대조표","민낯","반복"],"script":["★ 인터뷰 내내 되돌아갈 뼈대입니다. 어떤 질문이 나와도 '제가 출마 선언에서 지적한 것이 이번 전당대회에서 그대로 재현됐다'로 수렴시키면 됩니다.","① 공정이 없다 → [재현] 경선 규칙을 후보 등록을 마친 뒤에야 통지 / 당헌 제25조 제5항 '등록 개시 30일 전 확정' 규정을 6.10 당무위·6.16 중앙위 부칙으로 이번 전대에 한해 면제 / '달리 정할 수 있다' 단서조항으로 자격 예외를 개별 의결(7.16 논의 → 7.17 의결) / 최고위원 예비경선 기탁금 500만 원 → 2,000만 원(4배)","② 민주주의가 없다 → [재현] 전준위가 7.7 만장일치로 의결한 청년최고위원제를 7.14 최고위가 부결(같은 날 선호투표제 의결) / 예비경선 득표율·순위 끝내 비공개 / 7.28 충북 투표 접속 오류에 시간 연장만 하고 원인·경위·사과 없음 / 당원 명부 전수검증 없이 8.17 전대 강행","③ 청년이 없다 → [재현] 당대표·최고위원 본선 진출자 중 2030 0명 / 청년 후보 전원 예비경선 탈락 / 기탁금·나흘 선거운동·검증 토론회 부재라는 3중 장벽","④ 미래가 없다 → [재현] 전당대회 의제가 민생·일자리·주거·부채가 아니라 자격 시비와 계파 공방 / 신천지 논란 공방으로 소진","⑤ 세대교체가 없다 → [재현] 당대표 본선 진출자 세 명 모두 686 세대 / 30년 전 '젊은 피'가 여전히 결정하는 방을 채우고 있음","★ 한 문장 요약: '이번 전당대회는 제가 출마 선언에서 지적한 다섯 가지가 하나도 빠짐없이 그대로 반복된, 민주당의 민낯이었습니다.'"],"quotes":[],"notes":[]},{"no":2311,"media":"이데일리","q":"📎 [내부용] 근거자료 팩트시트 — 확인된 것 / 확인 안 된 것 (문서 미수록)","tags":["내부용","팩트시트","교차검증","근거","주의"],"script":["★ 후보·캠프 내부 확인용입니다. 답변지 문서에는 넣지 않았습니다.","[확인] 당헌 제25조 제5항 — 당대표·최고위원 선출 방식과 절차는 후보자등록 신청 개시일 전 30일까지 확정.","[확인] 부칙 신설 — 6월 10일 당무위원회 통과 → 6월 16일 중앙위원회 최종 가결. '이번 전당대회에 한해 준비 기한 미적용'.","[확인] 청년최고위원제 — 전준위 7월 7일 만장일치 의결 → 7월 14일 최고위원회 부결. 같은 날 최고위는 선호투표제 의결.","[확인] 자격 예외 — 입당 6개월 규정 관련 7월 16일 밤 긴급 최고위 논의, 7월 17일 비공개 최고위에서 예외 의결.","[확인] 2022년 전당대회에서 박지현 전 비대위원장은 '입당 6개월 미만'을 이유로 후보 자격을 얻지 못함.","[확인] 기탁금 — 최고위원 예비경선 기준 500만 원 → 2,000만 원(4배).","[확인] 충북 — 7월 28일 본경선 온라인투표 첫날 오전, '개인정보 불일치' 오류로 약 1시간 접속 불가. 당은 투표시간 1시간 연장. 원인·경위 설명 및 사과 없음.","[확인] 당원명부 — 전수조사 대신 약 500만 당원 주소를 특정 종교시설 주소와 대조해 4건 일치 확인. 불법 등록 의심 5만 4천여 명 투표권 제한. 전당대회는 8월 17일 예정대로.","[확인] 본선 구도 — 당대표·최고위원 본선 진출자 중 2030 없음. 당대표 본선 3인 모두 686 세대.","[확인] 해외 — 맘다니 1991.10.18생(만 34세) 2026.1 뉴욕시장 취임 / 바르델라 만 30세 프랑스 RN 대표 / 아탈 만 37세 총리 역임 후 집권당 대표 / 프랑스 하원 62% 지방직 경력 / 영국 2024 총선 당선권 후보 51% 지방의원 경력 / 스웨덴 349명 중 120명 이상 지방의원 겸직.","[확인] 김민석 1964.5.29생 — 1996.4.11 15대 총선 당선 당시 만 31세.","★ [주의] 아래는 확인되지 않았거나 오해를 부를 수 있는 항목 — 숫자로 단정하지 말 것.","[주의] '동영상 촬영 7분' — 보도 확인 안 됨. 본인 경험으로만.","[주의] '토론회 0회' — 7.20 합동연설회는 있었음. '합동연설회 한 번 외 검증 토론회 없음, 첫 방송토론은 컷오프 뒤'로.","[주의] 한국의 '지방의원 출신 국회의원' 비율 — 확인된 수치 없음. 숫자 언급 금지.","[주의] 송영길 — 돈봉투·재판 언급 금지. '절차와 단서조항' 프레임만.","[주의] 신천지 — 수사 중. '의혹·정황'까지만.","[주의] 박지현 — 2022년 건. 연도 필수."],"quotes":[],"notes":["※ 이 카드는 대시보드 내부 참고용 — 이데일리 답변지 문서에는 포함되지 않음"]},{"no":2401,"media":"기자회견문·성명","q":"📄 2026.7.14 국회 소통관 기자회견문 전문 — 「최고위원회를 해체하고 공정한 경선 규칙을 정해야 합니다」","tags":["기자회견문","원문","30일규정","당헌25조5항","부칙","중앙위원회","최고위해체","서명운동","가처분"],"script":["※ 원문 그대로 (2026. 7. 14. 더불어민주당 당대표 후보 김보미 · 국회 소통관 · 김보미닷컴 게시일 7.15)","★ [핵심] 민주당 당헌 제25조 제5항은 \"당대표와 최고위원의 선출 방식과 절차, 최고위원 선거인단 구성 방법 등 필요한 사항은 당규로 정하되, 후보자등록 신청 개시일 전 30일까지 확정한다\"고 되어 있습니다. 그런데 나중에 당헌 위반 문제가 터질 것 같으니, 지난 6월 16일, 아무도 모르게 중앙위원회를 열어 \"이번 전당대회 준비 기한만 한시적으로 면제한다\"는 기괴한 부칙을 신설했습니다.","최고위원회 해체, 청년 컷오프 폐지, 청년최고위원제 도입 서명에 동참해 주십시오.","전당대회 후보자 등록일이 겨우 이틀 남았습니다. 그런데 최고위원회는 룰을 정하지 않고 선호투표와 청년최고위만 가지고 싸우더니, 오늘 기껏 선호투표는 하고 청년최고위원은 없던 일로 하자고 결론지었습니다.","나머지는 깜깜이입니다. 예비경선을 어떻게 할 건지, 심지어 기탁금이 얼마인지 제출서류가 뭔지도 모릅니다. 정말 놀라운 일입니다. 도대체 뭐하자는 건지 모르겠습니다. 이런 무능이 없고, 이런 난장판이 없습니다.","청년 여러분, 취업 면접을 한다고 가정해 보겠습니다. 내일 모레 원서 접수 마감인데, 오늘에야 어떤 서류를 내야 하는지, 서류 전형과 면접 전형은 어떻게 진행하는지, 심사 기준은 뭔지 알려주지 않는 회사가 있다면 우리는 뭐라 하겠습니까? \"짜고 치는 고스톱이다\", \"누구 뽑을지 정해놓고 들러리 세우는 거다\" 이렇게 분노하지 않겠습니까?","이것이 지금 민주당 최고위원회의 민낯입니다. '규칙 없는 것'은 최악의 '불공정'입니다! 몰상식과 불공정의 끝판왕이 현 최고위원회입니다.","김민석, 정청래, 송영길. 686 기득권 세 분, 이미 이 세 분을 후보로 정해놓은 거 아닙니까? 다 짜놓고 지금 청년을 들러리 세우려는 거 아닙니까? 기습적으로 결정해서 청년들은 원서도 못내게 하자, 김보미의 입을 막자, 이거 아닙니까?","최고위는 이 과정에서 우리 당의 헌법인 '당헌·당규'마저 무시했습니다. (→ 위 [핵심] 당헌 제25조 제5항·6월 16일 중앙위원회 부칙 신설)","법을 고치지 않고 시행령 통치를 했던 검찰의 술수를 민주당이 그대로 베끼고 있는 것입니다. 이거 당원들이 알고 있었나요? 아무도 몰랐습니다.","정청래 후보는 어제 \"모든 권력이 국민으로부터 나오듯 모든 당권은 당원들로부터 나온다\"며 \"더 유능하고 더 민주적인 당원주권 정당으로 만들겠다\"고 했습니다. 지나가는 소가 웃을 일입니다. 당원들도 모르게 자기 입맛대로 당헌에 맞지 않은 부칙을 만들어 놓고, 청년들은 후보 등록도 못하게 만드는 것이 당원주권입니까!","회사에 입사하려는 정청래, 김민석 두 면접자가 심사 기준을 정하는 꼴입니다. 선호투표냐 결선투표냐, 청년최고위원을 둘 거냐 말 거냐를 가지고 계파 싸움만 했습니다. 이런 최고위원회가 무슨 필요가 있습니까. 당장 해체해야 합니다.","★ 민주당은 17일까지 등록하고, 21일에 예비경선 결과를 발표한다고 합니다. 3명만 남기고 자르겠다는 겁니다. 겨우 3일 선거운동을 하자는 것인데, 이게 말이 됩니까? 시간 없다고 중앙위원회에서 자를 겁니까? 1인 1표제라면서요? 당원주권이라면서요? 그렇다면 예비경선도 전 당원 투표로 해야 하는 것 아닙니까?","★ 민주당 당원이 2024년 기준 499만 명, 권리당원은 164만 명이라 합니다. 중앙위원은 545명입니다. 전체 당원투표를 한다면 중앙위원 한 사람이 당원 9,200명을 대표하고, 권리당원투표를 한다면 3,000명을 대표합니다. 이게 정청래 후보가 신주단지 모시듯 하는 1인 1표 당원주권입니까?","최고위원회가 민주주의가 실종된 민주당, 공정이 사라진 민주당을 더욱 병들게 하고 있습니다. 저는 선수 대리인이 정한 룰은 인정할 수 없습니다.","그제 저 김보미의 정견발표 이후 청년들이 들고 일어나고 있습니다. 청년들의 분노가 해일처럼 밀려오고 있습니다. 이 분노에 휩쓸려 최고위원회가 '민주당의 민폐', '민주주의의 파괴자'로 전락하기 전에, 자진해서 해산할 것을 강력히 촉구합니다.","★ [5대 촉구] 첫째, 최고위원회는 전준위에 룰 결정권을 넘기고 오늘 당장 해체하십시오. 선수들의 대리인이 룰을 결정하는 것은 세계적인 망신거리입니다.","둘째, 밀실 컷오프를 당장 포기하고, 다섯 후보 모두 예비경선 없이 본선에서 겨룰 수 있도록 하십시오. 등록하면 기탁금 떼먹고 4일 만에 자르겠다는 해괴망측한 시도를 당장 중단하십시오.","셋째, 전국을 돌며 당원들과 만나 토론회와 연설회를 할 수 있도록 충분한 기회를 보장하십시오. 진정한 당원주권은 당원의 알권리를 보장하는 것입니다. 후보가 어떤 비전과 정책을 가졌는지 검증할 시간조차 주지 않는 선거는 요식행위일 뿐입니다.","넷째, 순회경선을 하면서 권역별 선거인 수와 후보별 득표수를 투명하게 100% 공개하십시오. 후보자가 득표수도 모르는 세계에서 유일한 밀실 깜깜이 경선, 이제 끝내야 합니다. 과정이 투명해야 결과에 승복할 수 있습니다.","다섯째, 무엇보다 청년최고위원제를 반드시 도입해야 합니다. 청년에게 최고위원 자리 하나 못 주겠다는 기득권 정당으로 전락하고 총선·대선에 지는 꼴을 보기 싫다면 결단해야 합니다.","이제 쫄지 맙시다. 가만히 순서나 기다리라는 말을 믿지 맙시다. 가처분하면 제명한다는 말에 겁내지 맙시다. 우리 함께 연대합시다. 우리의 분노를 조직하고, 체념을 결의로 바꿉시다.","선출직 청년최고위원 1명은 기본입니다. 여기에 임명직 최고위원 2명은 무조건 청년으로 지명해야 합니다. 반드시 관철합시다.","오늘부터 최고위원회 해체와 컷오프 폐기, 청년최고위원제 도입을 요구하는 서명을 받겠습니다. 불공정에 분노하는 청년, 민주당을 사랑하는 당원, 민주당의 정권 재창출을 원하는 국민이라면 누구나 참여할 수 있습니다.","우리의 강력한 요구에도 불구하고 민주당이 최고위원회를 해체하지 않고 불공정 경선 일정을 강행하고, 청년 입틀막을 위해 686 세 명만 남기고 컷오프를 강행한다면, 법원에 '경선 중지 가처분 신청'을 내겠습니다.","규칙이 공정해야 경쟁이 아름답습니다. 진짜 변화는 규칙의 정상화에서 시작됩니다. 기득권을 위해 청년을 들러리 세우고 입틀막을 자행하는 '686 짱돌전대'를 즉각 멈춰야 합니다.","청년과 평당원의 힘으로 청년에게 말할 기회를 주는 민주당을 만드는 것, 이것이 바로 민주당의 미래와 나라의 미래를 살리는 유일한 길입니다. 함께 해 주십시오. 감사합니다.","🔗 원문: https://www.xn--4k0b53xuva.com/vision.html?post=pmrlnapghvgve  |  영상(오마이TV 생중계): https://www.youtube.com/live/j8C69le6B2E  |  사진기사(뉴스1, 7.14 국회 소통관): https://www.news1.kr/photos/8008062"],"quotes":[["김보미 (7.14 기자회견문)","당헌 제25조 제5항은 '후보자등록 신청 개시일 전 30일까지 확정한다'고 되어 있습니다. 그런데 6월 16일, 아무도 모르게 중앙위원회를 열어 '이번 전당대회 준비 기한만 한시적으로 면제한다'는 기괴한 부칙을 신설했습니다."],["김보미 (7.14 기자회견문)","'규칙 없는 것'은 최악의 '불공정'입니다."],["김보미 (7.14 기자회견문)","선수들의 대리인이 룰을 결정하는 것은 세계적인 망신거리입니다."],["김보미 (7.14 기자회견문)","중앙위원은 545명입니다. 전체 당원투표를 한다면 중앙위원 한 사람이 당원 9,200명을 대표합니다. 이게 1인 1표 당원주권입니까?"],["김보미 (7.14 기자회견문)","규칙이 공정해야 경쟁이 아름답습니다. 진짜 변화는 규칙의 정상화에서 시작됩니다."]],"notes":["★ 인터뷰에서 30일 규정을 말할 때는 이 회견문 문장을 그대로 쓰면 됩니다 — 당헌 제25조 제5항 / 6월 16일 중앙위원회 / '한시적 면제' 부칙 신설. (이제 조문·기구·날짜 모두 후보 본인 회견문으로 확인됨)","⚠ '윤석열 검찰의 술수를 베꼈다'는 표현은 회견문 원문에는 있으나 인터뷰에서는 '법을 고치지 않고 시행령으로 우회한 방식과 같다' 정도로 순화 권장"]},{"no":2402,"media":"기자회견문·성명","q":"📄 2026.7.17 성명 전문 — 「청년 박지현은 안 되고, 686 송영길은 됩니까? 이게 공정입니까?」","tags":["성명","원문","송영길","박지현","최고위","예외조항","손흥민","가처분"],"script":["※ 원문 그대로 (2026. 7. 17.)","저는 오늘 분노와 참담함을 감출 수 없습니다. 민주당은 지금 무엇을 하고 있습니까? 떠나가는 청년들을 붙잡고 매달려도 시원찮을 판에 이제 몽둥이 들고 쫓아내겠다는 것입니까?","★ 4년 전 청년 박지현은 입당한 지 6개월이 되지 않았다는 이유로 후보 신청서류 접수조차 거부당했습니다. 예외조항이 있으니 비대위와 당무위를 열어 논의해 달라는 요구도 묵살했습니다.","★ 그런데 바로 어제 밤 10시 30분, 민주당 최고위는 박지현과 똑같은 이유로 탈락 위기에 놓인 686 송영길 후보를 구제하기 위해 긴급 최고위원회를 열었습니다. 어제 결론을 못 내고 오늘 오전 또 최고위원회를 연다고 합니다. 김민석 후보도 충분한 예외 사유라며 등록을 허용하라고 했답니다.","이미 등록을 받기 시작했는데, 자격 없는 후보를 규정을 다시 해석하고, 예외를 만들고, 당무위원회를 열어 길을 터주겠다? 입사 면접을 갔는데, 자격이 안 되는 면접자를 위해 면접 기준을 바꾸겠다고 하는 것과 한 치도 다르지 않습니다.","당대표에 출마한 후보들 모두 민주당에서 청년들이 떠나고 있다며 2030 대책을 세우고 온갖 청년 정책을 내놓았습니다. 그래 놓고 청년들이 가장 혐오하는 불공정의 끝판왕을 적나라하게 보여주고 있습니다. 양두구육, 이율배반이 아니고 무엇입니까?","★ 똑같은 사인인데, 박지현은 안 되지만 송영길은 됩니까? 청년은 안 되지만 686 기득권은 됩니까? 청년은 원칙대로 탈락, 기득권은 예외 인정 구제입니까? 규정은 같은데 사람에 따라 적용을 달리한다면, 그것은 불공정을 넘어 비정상의 극치가 아닐 수 없습니다.","민주당에 청년이 없는 이유는 청년이 능력이 없어서가 아닙니다. 청년에게는 원칙을 적용하고, 기득권에게는 특혜를 적용하기 때문입니다.","★ 아무리 손흥민이라도 결정적인 반칙을 하면 레드카드를 받습니다. 심판은 '그동안 국가를 위해 헌신했으니 이번만 봐주겠다' 이렇게 말하지 않습니다. 정치도 마찬가지입니다. 규칙보다 사람이 우선하는 순간, 공정보다 특혜를 우선하는 순간 민주주의는 무너집니다.","청년에게 적용했던 잣대를 이번에도 똑같이 적용하십시오. 민주당은 사람이 아니라 공정과 원칙이 지배하는 정당이 되어야 합니다.","만약 최고위가 송영길의 출마 자격을 인정한다면, 저 김보미는 가처분 신청을 비롯한 모든 수단을 동원해 규탄하는 것은 물론, 이런 불공정한 경선에 참여할 것인지 여부를 심각하게 검토할 것입니다. 최고위는 원칙대로 공정하게 판단하십시오."],"quotes":[["김보미 (7.17 성명)","청년 박지현은 안 되고, 686 송영길은 됩니까? 이게 공정입니까?"],["김보미 (7.17 성명)","규정은 같은데 사람에 따라 적용을 달리한다면, 그것은 불공정을 넘어 비정상의 극치입니다."],["김보미 (7.17 성명)","아무리 손흥민이라도 결정적인 반칙을 하면 레드카드를 받습니다."],["김보미 (7.17 성명)","민주당에 청년이 없는 이유는 청년이 능력이 없어서가 아닙니다. 청년에게는 원칙을, 기득권에게는 특혜를 적용하기 때문입니다."]],"notes":["⚠ 송영길 관련은 이 성명의 '절차·잣대' 프레임 안에서만 — 돈봉투·재판은 언급하지 말 것","※ '입당 6개월 미만'이라는 사유와 '밤 10시 30분 긴급 최고위'는 이 성명에서 확인된 사실관계"]},{"no":2403,"media":"기자회견문·성명","q":"📄 2026.7.21 성명 전문 — 「오늘 정견발표를 앞두고 송영길 후보로부터 고함을 듣는 황당한 일을 당했습니다」","tags":["성명","원문","송영길","고함","서울시의회","꼰대","계란과바위"],"script":["※ 원문 그대로 (2026. 7. 21. 서울시의회 당대표 후보자 초청 간담회)","★ 이러니까 청년들이 꼰대라고 합니다. 저도 당대표 후보입니다. 송영길 후보님, 존중해 주십시오!","오늘 서울시의회 당대표 후보자 초청 간담회 정견발표가 있었습니다. 지난 8년, 지방의원으로 함께 울고 웃었던 분들을 다시 뵙는 자리라서 가는 길 내내 설레었습니다.","그런데 정견발표에 앞서, 서울시의회 의장실 접견 자리에서 저는 제대로 망신을 당했습니다. 의장님을 비롯해 의원님들, 의회사무과 직원분들까지 함께 계신 자리였습니다. 그 공개된 자리에서 송영길 후보께서, 제가 페이스북에 올린 글을 두고 저에게 고함을 치셨습니다.","저는 정중히 부탁드렸습니다. 다른 분들도 계시니, 하실 말씀이 있으면 별도로 전화로 하시자고. 그러나 호통은 멈추지 않았습니다.","★ 제 글이 섭섭하실 수는 있습니다. 그러나 여러 사람 앞에서 고함을 치며 윽박지르는 것은 명백한 인격무시 행위입니다. 저는 분명히 말씀드립니다. 바로 그 고함이, 오늘 민주당의 문제입니다.","저는 송영길 후보가 잘난 사람인지 못난 사람인지를 지적한 것이 아닙니다. 손흥민 선수라도 반칙을 하면 레드카드를 받습니다. 아무리 훌륭한 선수라도 경기 중에 규칙을 바꿔 달라고 할 수는 없습니다. 입사 면접이 한창 진행되는 중에 특정 면접자에 맞추어 자격 요건을 바꾸는 것 — 제가 지적한 것은 사람이 아니라 바로 그 '과정의 불공정'이었습니다.","★ 그런데 돌아온 것은 논점에 대한 답이 아니었습니다. \"내가 검찰개혁을 외치다 이렇게 고생했는데.\" \"나, 이런 사람이야.\" \"너가 도와준 거 있어?\" 공정을 물었더니 훈장을 꺼내셨습니다. 논점은 사라지고, 고함과 훈계만 남았습니다.","이것이 바로 청년들이 말하는 686 꼰대의 현실입니다. 왜 청년들이 민주당을 불공정당, 686 꼰대 정당이라 부르는지, 오늘 그 답을 많은 분들이 두 눈으로 보셨습니다.","그래서 저는 오늘 정견발표에서 분명히 요청드렸습니다. 많은 분들 앞에서 고함치신 것, 사과해 주시라고. 공개적으로 고함치셨으니 저도 공개적으로 사과를 요구했습니다. 그러나 끝끝내 사과는 없었습니다.","민주당의 위기는 밖에서 오지 않습니다. 반성이 사라진 자리, 바로 그 자리에서 시작됩니다. 질문보다 확신이 많고, 경청은 없고 호통만 있는 정당에 청년들은 머물지 않습니다.","★ 저는 계란입니다. 686 기득권은 바위입니다. 오늘 저는 그 바위 앞에서 고함을 들었지만, 내일도 온몸을 던져 두드리겠습니다. 고함으로 청년의 입을 막을 수 있던 시대는 이제 끝나야 합니다. 쫄지 않겠습니다. 굴하지 않겠습니다.","공정이 살아 있는 민주당, 청년이 돌아오는 민주당, 풀뿌리에서 자란 저 김보미가 반드시 만들겠습니다. 감사합니다."],"quotes":[["김보미 (7.21 성명)","바로 그 고함이, 오늘 민주당의 문제입니다."],["김보미 (7.21 성명)","공정을 물었더니 훈장을 꺼내셨습니다. 논점은 사라지고, 고함과 훈계만 남았습니다."],["김보미 (7.21 성명)","저는 계란입니다. 686 기득권은 바위입니다."]],"notes":["※ 방송에서 이 사건을 말할 때는 '사과 요구했으나 사과는 없었다'까지가 사실관계 — 그 이후 상황은 추가 확인 없이 단정하지 말 것"]},{"no":2198,"media":"한겨레뷰리핑(7.27)","q":"🎬 감사 오프닝 인사 — 방송 시작하자마자 (확정본)","tags":["오프닝","감사인사","107명","바위에금"],"script":["★ 먼저 감사 인사부터 드리고 싶습니다. 조직도 계파도 없는 세 명짜리 캠프, 사무실도 없이 카페를 전전하던 저희를 여기까지 오게 해 주신 분들 — 나흘 동안 107명의 국민께서 1,909만 원을 후원해 주셨고, 정말 많은 분들이 손을 잡아 주셨습니다. 그 온기부터 전해드리고 싶습니다. 진심으로 감사합니다.","★ 저는 이번 경선에서 확인했습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들이 계시다는 것을, 젊은 날의 자신을 떠올리며 청년의 도전에 손을 내밀어 주시는 분들이 계시다는 것을. 그 한 표 한 표가 바위에 금을 냈습니다.","★ [자기소개 — 정확 약력] 저를 처음 보시는 분들께 소개드리겠습니다. 1989년생 서른여섯, 전남 강진 사람 김보미입니다. 스물셋에 민주당에 입당해 올해로 13년째 당원입니다. 스물여덟에 지역 최초 청년 군의원으로 강진군의회에 당선돼 최다득표로 재선했고, 서른둘에 전국 최연소 기초의회 의장이 됐습니다. 의장 시절 낭비예산 108억 원을 삭감했고, 업무추진비 전면 공개와 본회의·행정사무감사 생중계, 일문일답 군정질문을 처음 도입했습니다. 지금은 재정주권시민행동 공동대표로서, 세금부터 정당의 돈까지 1원 단위로 투명해지는 '김보미365' 재정 감시 운동을 하고 있습니다.","이렇게 초대해 주신 한겨레TV와 시청자 여러분께도 감사드립니다. 오늘 묻는 말씀에 성실하게 답하겠습니다."],"quotes":[],"notes":[]},{"no":2199,"media":"한겨레뷰리핑(7.27)","q":"🏁 마무리 인사 — 방송 끝날 때 (확정본)","tags":["마무리","오뚝이","도전은시작"],"script":["★ 마지막으로 한 말씀 드리겠습니다. 저는 오늘도 현장으로 돌아갑니다. 정치는 여의도에만 있는 것이 아니라 우리의 삶 속에 있다고 믿기 때문입니다.","★ 계란은 깨졌지만 바위에 낸 금은 남아 있고, 그 금은 점점 넓어질 것입니다. 청년들이 규칙을 정하는 방에 들어가는 그날까지 계속 외치고, 계속 모으겠습니다. 지켜봐 주십시오. 김보미의 도전은 이제 시작입니다. 감사합니다."],"quotes":[],"notes":[]},{"no":2200,"media":"한겨레뷰리핑(7.27)","q":"📋 프로그램 개요 + 오늘의 전략 (녹화 전 1분 점검)","tags":["뷰리핑","전략","하어영"],"script":["한겨레TV '뉴스 뷰리핑' — 7.27(월) 09:30 녹화. 진행 하어영 기자, 패널 강수영 변호사·김원철. 1부: ①김보미 단독 인터뷰(14문항) ②전당대회 순회경선·신천지 패널 ③검찰개혁·정성호 사의 ④조국혁신당. 2부 국제(호르무즈·우크라)는 타 패널 중심 — 지명되면 '전문가들 판단을 경청하고 있다' 정도로 짧게.","★ 오늘의 포지션: 탈락 후보가 아니라 '본선을 지켜보는 감시자'. 개인 공격 없이 시스템 의제(득표 공개·기탁금 폐지·공영제·재정 공개)로 일관. 진행자가 판세 분석을 깊게 물어도 '데이터가 비공개라 누구도 모른다'는 프레임이 가장 안전하고 가장 강한 답.","★ 스몰토크 대비: 근황 = '현장으로 돌아갔다. 카페 캠프를 정리하고, 함께해 준 청년들과 다음 활동을 준비 중이다.'"],"quotes":[],"notes":["⚠ 금지 리스트 동일: 돈봉투 실명 연결·아파트 소문·유시민 논평·특정 후보 지지 표명. 신천지는 수사 중 사안 — 단정 금지"]},{"no":2201,"media":"한겨레뷰리핑(7.27)","q":"Q1. '왜 나왔냐'는 질문에 '당대표가 되려고 나왔다'고 답한 게 화제였다. 지금 시점에서 답한다면?","tags":["왜나왔냐","당선되러","의제화"],"script":["지금도 같은 답입니다. 목표를 정했으면 그 목표를 달성하기 위해 노력하는 것이 당연한 일 아닙니까. 저는 당선되러 나왔습니다. 질 것을 알면서 나오는 사람이 어디 있습니까. 다만 '질 것 같으니 나오지 마라'가 기득권의 언어라는 것을 확인하러 나온 것이기도 합니다.","★ 그리고 지금 시점에서 한 가지를 보태겠습니다 — 당선에는 실패했지만 목적에는 실패하지 않았습니다. 세대교체와 대전환이 이번 전당대회의 의제가 됐고, 어느 후보도 이제 청년과 혁신을 말하지 않고는 선거를 치를 수 없게 됐습니다. 결과는 졌지만, 도전은 지지 않았습니다."],"quotes":[["김보미","저는 당선되러 나왔습니다. '질 것 같으니 나오지 마라' — 이것이 기득권의 언어입니다."]],"notes":[]},{"no":2202,"media":"한겨레뷰리핑(7.27)","q":"Q2. 선거 과정에서 가장 힘들었던 점은?","tags":["힘들었던점","나흘","3인캠프","기탁금"],"script":["시간과 돈입니다. 후보 등록과 후원회 준비에만 사흘이 걸려, 닷새 중 사실상 하루를 가지고 선거운동을 했습니다. 숨만 쉬어도 돈이 드는 것이 선거인데 돈이 없으니 문자 한 통 보내기도 어려웠습니다. 기탁금 구하는 것부터가 선거운동이었습니다.","★ 저희 캠프는 세 명이 전부였습니다. 사무실도 없이 카페와 식당을 전전하며 노트북 하나로 회의했습니다. 그런데 그 나흘 동안 107명의 국민께서 1,909만 원을 후원해 주셨습니다. 힘들었던 것보다 그 온기가 더 크게 남아 있습니다."],"quotes":[["김보미","기탁금 구하는 것부터가 선거운동이었습니다."]],"notes":[]},{"no":2203,"media":"한겨레뷰리핑(7.27)","q":"Q3. 출마 때 '5무(無) 정당'을 외쳤는데, 완주하며 체감한 현실의 벽은 정확히 어디였나?","tags":["5무정당","민낯","고무줄규칙","말바꾸기","청년구호"],"script":["★ 이번 예비경선이야말로 제가 지적한 '5무 정당'의 민낯을 짧은 기간에 적나라하게 보여준 무대였다고 생각합니다. 지난 지방선거의 예를 들 필요도 없습니다. 이 경선 과정 자체가 민주당에 다섯 가지가 없다는 것을 그대로 보여줬고, 지금도 보여주고 있습니다.","공정이 없습니다 — 선거 룰을 받아 든 것은 후보 등록 뒤였고, 준비 시간은 고작 하루였습니다. 그 와중에 기탁금은 올랐습니다. 민주주의가 없습니다 — 후보자 설명회에서는 경선 득표 결과를 알려준다고 해 놓고, 갑자기 말이 바뀌어 아무것도 알려주지 않았습니다. 약속했던 공개마저 뒤집는 것, 그것이 밀실정당입니다.","★ 청년이 없습니다 — 청년, 청년, 구호로만 외치면서 청년최고위원제는 좌초시키고, 절차를 묻는 청년에게는 고함이 돌아왔고, 결과는 청년 후보 전원 탈락이었습니다. 세대교체가 없습니다 — 본선은 결국 686 3파전이 됐습니다. 그리고 미래가 없습니다 — 지금도 누가 적통이냐, 누가 탈당을 했느냐, 과거만 외치고 있지 않습니까.","★ 한마디로 청년을 키워 주지 않는 정당입니다. 예비경선 기간 주는 것을 보십시오 — 새로 도전하는 사람은 이름을 알릴 시간조차 없고, 청년들은 누가 나왔는지도 모르는 채 예비경선이 끝나 버립니다. 제가 만난 벽은 상대 후보가 아니라 이 구조였습니다."],"quotes":[["김보미","이번 경선이야말로 5무 정당의 민낯을 짧은 기간에 그대로 보여준 무대였습니다."]],"notes":[]},{"no":2204,"media":"한겨레뷰리핑(7.27)","q":"Q4. 제도적으로 가장 먼저 손을 대야 할 부분은?","tags":["제도개혁1순위","경선규칙","결과공개","공영제"],"script":["★ 딱 하나를 꼽으라면 '경선 규칙 6개월 전 확정과 결과 100% 공개'입니다. 규칙을 미리 정하고 결과를 투명하게 여는 것 — 이것만 돼도 고무줄 규칙, 밀실 컷오프, 계파 룰 협상이 한꺼번에 사라집니다.","그다음이 기탁금 폐지와 당직선거 공영제입니다. 돈과 조직이 아니라 생각과 실력으로 경쟁하게 하는 것입니다. 이건 청년 우대가 아니라 경쟁의 공정입니다.","★ 그리고 이것이 제가 예비경선 결과 발표 전날, 청년의 거리 홍대에서 '민주당 갈아엎기 대전환 선언'으로 국민께 제언한 민주당이 가야 할 길입니다. 가짜 당원주권을 폐기하고 당의 운영체제 자체를 교체하자 — 경선 규칙 6개월 전 확정, '달리 정할 수 있다' 단서조항 전부 삭제, 가짜·불법 당원 정리와 경선 결과 100% 공개, 기탁금 폐지와 당직선거 공영제, 당 재정 1원까지 실시간 공개, 청년의 예산 결정권, 그리고 로그인만 하는 정당이 아니라 시민의 삶과 링크된 디지털 정당까지 12대 약속입니다. 누가 당대표가 되더라도 바뀌지 않는 시스템 — 본선 세 후보께서 이 제언을 받아 주시기를 지금도 기다리고 있습니다."],"quotes":[["김보미","규칙은 미리, 결과는 투명하게 — 이 한 줄이면 됩니다."]],"notes":[]},{"no":2205,"media":"한겨레뷰리핑(7.27)","q":"Q5. '이장 선거도 공개한다, 전 세계 유일한 밀실정당'이라고 비판했다. 어느 정도 득표했는지 짐작도 못 하나? 캠프별로는 예측치가 있다던데?","tags":["득표비공개","밀실정당","이장선거","서명운동"],"script":["★ 짐작조차 할 수 없습니다. 그게 바로 문제입니다. 이장 선거도, 학생회장 선거도 득표수를 공개합니다. 당원 수백만의 공당이 후보 본인에게조차 득표를 알려주지 않는 것 — 전 세계에 이런 정당이 있는지 묻고 싶습니다.","★ 그런데 이상하지 않습니까. 몇몇 분들은 마치 결과를 알고 있다는 듯이 말씀들을 하십니다. 저는 누가 귀띔이라도 해 줍니까? 그거야말로 기득권 정당이라는 증거입니다. 우리 같은 청년들은 알 길이 없고, 자기들끼리는 다 알고 있고 — 그들만의 리그를 하고 있다는 얘기 아닙니까. 이것이 정보의 불균형이고, 저는 그 뒤에 당직자 카르텔이 있다고 봅니다.","캠프별 예측치요? 솔직히 말씀드리면 그건 각 캠프가 자기 돈 내고 돌린 여론조사입니다 — 요즘 말로 '내돈내산'입니다. 당이 공식 데이터를 주지 않으니 후보들이 사비로 짐작하는 것인데, 돈 있는 캠프는 짐작이라도 하고 저 같은 평당원 후보는 그것조차 못 합니다.","★ 하나 더 말씀드리겠습니다. 전당대회 신청 자격이며 준비 서류를 거의 하루 전에야 공지했습니다. 만약 높으신 분들이 그걸 몰라서 서류를 못 냈다면 가만히 계셨겠습니까. '내가 누군데 아직도 안 알려주느냐'며 난리가 났을 겁니다. 신인이라서 겪는 정보의 불공정 — 이것이 심각합니다.","분명히 말씀드립니다 — 저는 결과에 승복했습니다. 그러나 승복과 검증 요구는 별개입니다. 이긴 쪽도 떳떳하려면 공개해야 합니다. 그래서 득표 공개를 요구하는 서명운동을 하고 있습니다. 본선 세 후보께도 묻고 싶습니다. 득표 공개, 약속하실 수 있습니까."],"quotes":[["김보미","몇몇 분들은 결과를 아는 듯 말씀하십니다. 저는 누가 귀띔이라도 해 줍니까 — 이것이 정보의 불균형입니다."]],"notes":["⚠ '결과를 아는 듯한 발언' 특정 실명 지목 금지 — '몇몇 분들'까지만. 당직자 카르텔은 '저는 ~라고 봅니다' 의견 형식 유지"]},{"no":2206,"media":"한겨레뷰리핑(7.27)","q":"Q6. 청년·세대교체 그룹들과 더 크게 연대하지 못했다 — '각개약진하다 각개격파 당했다'는 지적에는?","tags":["연대","각개격파","청년결집"],"script":["먼저 함께 뛴 청년 후보들의 명예를 위해 말씀드리겠습니다. 모두가 사활을 걸고 각자의 자리에서 최선을 다했습니다. 연대를 안 한 것이 아니라 할 수 없는 구조였습니다.","★ 생각해 보십시오. 연대할 시간이 있기는 했습니까? 선거운동은 겨우 4일이었습니다. 저는 후원회를 열자마자 고작 하루 만에, 컷오프와 함께 자동 마감됐습니다. 연대는커녕 서로 얼굴 볼 시간도 없는 일정입니다.","★ 그리고 지금 민주당 분위기에서는 사진만 같이 찍어도 '무슨 계파냐'며 파묘하고 난리가 납니다. 연대가 조직되기도 전에 낙인부터 찍히는 문화 — 각개격파를 만든 것은 청년들이 아니라 이 구조와 이 문화입니다.","★ 아프게 받아들이는 부분도 있습니다. 그래서 앞으로 이번 출마자들과 함께 청년 정치 세력을 묶어내는 일을 하려고 합니다. 각자 생각이 달라 쉽지 않다는 것을 잘 압니다. 그렇지만 제가 그 일을 하겠습니다.","★ 다만 원칙은 분명합니다. 제가 가는 길은 줄 서지 않는 길입니다. 기득권 정치인들에게 줄 서지 않고 독자적인 힘으로 성장하는 것 — 그것이 제 원칙입니다. 줄대기식 정치로 청년이 얻을 것이 무엇입니까. 저처럼 생각하는 청년들이 많이 있는 것으로 압니다. 그런 분들 중심으로 청년 세력화를 끊임없이 해 나가겠습니다."],"quotes":[["김보미","연대를 안 한 것이 아니라 할 수 없는 구조였습니다. 사진 한 장에도 파묘당하는 정당에서 누가 연대를 하겠습니까."]],"notes":[]},{"no":2207,"media":"한겨레뷰리핑(7.27)","q":"Q7. 광주·전남 기반 행보를 두고 '이낙연계 아니냐'는 말이 돌았다. 이낙연 전 총리와 인연은?","tags":["이낙연계","계파","흥신소정치","무계파"],"script":["'이낙연계'라는 말에는 웃음부터 나옵니다. 제 이력이 답입니다. 민주당에 입당한 지 13년째 — 저는 추미애 대표 시절 공천받고, 이낙연 대표 시절 억울하게 제명당했고, 이재명 대표 시절 복당했습니다. 그럼 저는 도대체 무슨 계파입니까.","★ 인연을 물으셨으니 솔직하게 말씀드리겠습니다. 제가 정치인들 중에 가장 존경하지 않는 분을 꼽으라면 바로 그분입니다. 청춘을 다 바쳐 당에 헌신했는데, 그 시절 저는 헌신짝이 됐습니다. 표적 징계에 제명까지 — 그 억울함이 지금도 사무쳐 있습니다. 그런 분을 존경할 수 있겠습니까. '이낙연계'라니, 당사자에게는 잔인한 농담입니다.","사진 한 장으로 계파를 판정하는 것 — 저는 그것을 '흥신소 정치'라고 부릅니다. 청년은 족보에 끼워 주지도 않으면서, 벽을 쳐서 못 들어오게 막아 놓고, 사진 한 장 나오면 '누구 파냐'고 묻습니다. 그 질문 자체가 민주당의 병입니다."],"quotes":[["김보미","추미애 때 공천받고 이낙연 때 제명되고 이재명 때 복당했습니다. 저는 무슨 계파입니까."]],"notes":["⚠ 이낙연 실명 비판은 후보 확정 워딩(본인 지시) — 기사 제목으로 뽑힐 가능성 높음. 발언 수위는 '억울한 제명의 당사자 심경'까지만, 이낙연 개인의 다른 행적 비판으로 확장 금지"]},{"no":2208,"media":"한겨레뷰리핑(7.27)","q":"Q8. 청년들이 민주당을 '686 꼰대 정당'이라 비판하는 지점은 어디서 비롯됐나?","tags":["686꼰대정당","말과행동","병풍","30년"],"script":["★ 말과 행동의 거리에서 비롯됐습니다. 말로는 청년을 외치면서 기탁금이라는 진입 장벽은 그대로 세워 두고, 영입할 때는 미래라고 부르면서 의사결정에서는 병풍으로 세웁니다. 앞과 뒤가 다르니 청년들이 등을 돌리는 것입니다.","SNS 세대는 그 간격을 실시간으로 확인합니다. 청년들은 몰라서 떠나는 것이 아니라, 너무 잘 알아서 떠나는 것입니다.","★ 그리고 30년입니다. 김대중 대통령께서 32세 김민석을 발탁하셨고, 그때의 젊은 피가 지금까지 30년째 정치를 하고 있습니다. 본인들이 청년일 때 기득권을 향해 외쳤던 소리를 지금의 청년이 똑같이 하는데 기분이 나쁘시다면 — 이미 기득권이 되셨다는 뜻입니다. '꼰대'라는 말은 거기서 나옵니다."],"quotes":[["김보미","청년들은 몰라서 떠나는 것이 아니라, 너무 잘 알아서 떠나는 것입니다."]],"notes":[]},{"no":2209,"media":"한겨레뷰리핑(7.27)","q":"Q9. 송영길 후보 고성 사건 — 오히려 비판도 받았는데, 오해가 있다면 풀고 가자.","tags":["송영길","고함사건","오해","과정의불공정"],"script":["★ 먼저 말씀드리고 싶습니다. 공개석상에서 고함을 치셨습니다. 언어폭력도 폭력입니다. 아무리 섭섭하시더라도 사람의 인격을 무시하는 행동은 안타깝습니다. 좀 존중해 주시면 좋겠습니다. 아쉽습니다.","다만 이런 일이 벌어진 배경도 있다고 봅니다. 토론회 한 번 없고, 만나서 소통할 시간도 없는 — 번갯불에 콩 볶아 먹는 선거 기간 아니었습니까. 후보들이 서로를 알아갈 링이 있었다면 고함 대신 토론이 있었을 겁니다.","★ 오해는 분명히 풀고 가겠습니다. 저는 사람을 비교한 것이 아닙니다. 절차를 비교한 것입니다. 청년 박지현은 당무위든 최고위든 회의를 열어 자격이 되는지 봐 달라고 했습니다. 그런데 당은 회의조차 열지 않았고, 심지어 서류 접수조차 받지 않았습니다. 반면 송영길 후보는 이미 등록이 시작되고 면접이 진행되는 중에, 자격이 안 되는 것을 되게 해 달라고 한 것입니다. 청년이 문제를 제기했을 때 당이 어떻게 했는지, 686 선배가 요구했을 때는 어떻게 했는지 — 그 절차의 공정성을 비교한 것입니다.","★ 그리고 꼰대 논란의 핵심이 그 뒤에 나왔습니다. 송영길 후보께서 유튜브에서 뭐라고 하셨습니까. '그런 건 당에서 알아서 챙겨 줘야지'라고 하셨습니다. 아니, 일개 후보자의 개인 등록 서류를 왜 당이 챙겨 줍니까? 당이 사당입니까? 청년은 서류를 들고 가도 접수조차 안 받아 주는데, 선배님들은 당이 알아서 챙겨 줘야 한다고 생각하는 것 — 그 차이가 바로 제가 지적한 전부입니다. 사람을 비교한 게 아니라 절차를 비교한 것입니다. 논점을 왜곡하지 말았으면 합니다."],"quotes":[["김보미","사람을 비교한 게 아니라 절차를 비교한 것입니다. 청년은 서류 접수조차 거부당했는데, '당에서 알아서 챙겨 줘야지'라니 — 당이 사당입니까?"]],"notes":["⚠ 여기까지가 수위 상한 — 사과 요구·인신 비판으로 확장 금지. '안타깝다·아쉽다·존중해 달라' 톤 유지가 회고 국면에서 가장 유리"]},{"no":2210,"media":"한겨레뷰리핑(7.27)","q":"Q10. '예상보다 훨씬 매섭고 선명한 메시지'라는 평가 — 본인이 생각하는 이번 선거 최대의 성취는?","tags":["최대성취","의제화","기탁금인하","침묵하는다수"],"script":["★ 최대 성취는 민주당이 586 꼰대 정당이 되어 가고 있다는 사실을 알린 것입니다. 그리고 청년 평당원 한 사람이 목소리를 내니 기탁금이 실제로 인하됐습니다 — 목소리를 내면 바뀐다는 것도 증명했습니다.","★ 무엇보다 분위기가 달라졌다는 것을 느꼈습니다. 586 세대교체론은 갑자기 나온 것이 아닙니다. 오래된 문제 제기인데, 지금까지 그 얘기를 꺼낸 사람들은 다 집중포화를 맞고 떨어져 나갔습니다. 4년 전 박지현 위원장이 제기했을 때는 청년들조차 동의하지 않았습니다. 그런데 이번에는 달랐습니다. 586 선배들조차 '이제 그럴 때도 됐지' 하시고, 청년들은 '내가 하고 싶은 얘기를 다 해 준다, 속이 시원하다'고 했습니다. 저는 거기서 희망을 봤습니다. 그래서 민주당을 젊은 정당으로 만드는 일에 더 노력해야겠다고 결심했습니다.","★ 셋째가 가장 큽니다. 침묵하는 다수를 확인했습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들, 젊은 날의 자신을 떠올리며 청년의 도전에 손을 내밀어 주시는 분들 — 실제로 짱돌을 들었던 민주화운동 세대 선배님이 전화로 격려해 주셨습니다. 저는 거기서 민주당의 미래와 희망을 봤습니다. 그 한 표 한 표가 바위에 금을 냈습니다."],"quotes":[["김보미","계란은 깨졌지만 바위에 낸 금은 남아 있습니다."]],"notes":[]},{"no":2211,"media":"한겨레뷰리핑(7.27)","q":"Q11. 이번 전당대회 구도는 어떻게 보나? 당대표로 누구 지지?","tags":["구도","지지후보","방향지지"],"script":["★ 저는 이미 얘기했습니다. 누가 되어야 하는지에 대해서는 답을 내지 않았지만, 누가 되면 안 되는지에 대해서는 이미 수십 차례 말씀드리지 않았습니까. 선거에 졌으면 책임을 져야 합니다. 그 입장은 지금도 같습니다.","★ 그리고 지금 보십시오. 청년에 대해 한마디라도 합니까? 민주당의 미래에 대해 한마디라도 합니까? 강성 당원들에게만 호소하면서, 대한민국의 현안이 검찰개혁밖에 없는 것처럼 선거를 하고 있지 않습니까. 신천지 공방, 적통 논쟁, 구독취소 운동 — 전당대회의 언어에 청년의 삶이 없습니다.","★ 분명히 말씀드립니다. 이 선거는 청년 아젠다를 받는 후보가 이깁니다. 청년과 미래를 소리 높여 외쳐야, 지금 투표하지 않으려는 당원들이 그나마 투표장에 나옵니다. 강성 지지층만 바라보는 선거로는 전당대회 흥행도, 본선 승리도 없습니다."],"quotes":[["김보미","사람이 아니라 방향을 지지합니다. 이 방향에 동의하는 당대표가 제 후보입니다."]],"notes":[]},{"no":2212,"media":"한겨레뷰리핑(7.27)","q":"Q12. (압박) 현실적으로 셋 중 한 명을 골라 지원해야 한다면? 평당원이자 예비경선 후보로서.","tags":["돌발","지지압박","기준제시"],"script":["★ 누가 되면 안 되는지는 이미 말씀드렸으니, 나머지 후보들에 대해 말씀드리겠습니다. 너무 아쉽습니다. 나머지 후보들이라도 청년을 이야기하고, 미래를 이야기하고, 당 개혁을 어떻게 할 건지 이야기해야 하는데 — 저는 재창당 수준의 당 개혁 12대 과제를 공약으로 내놨습니다. 기본 중의 기본입니다. 그런데 아무도 거기에 대해 말을 하지 않습니다. 너무너무 실망했습니다. 정책은 온데간데없고 적통이냐 아니냐만 하고 있는데 무엇을 보고 선택을 합니까.","★ 그래서 제가 '민주당의 적통은 저'라고 말씀드린 것입니다. 족보의 적통이 아니라 도전정신의 적통 말입니다. 32세 김민석을 발탁한 김대중의 도전, 기득권에 맞선 노무현의 도전 — 민주당을 민주당이게 한 것은 혈통이 아니라 그 도전정신이고, 저는 그 적통을 잇겠다는 것입니다.","★ 그러니 지금부터라도 정신 차리시고, 제가 제시한 12대 당 개혁 과제에 대해 어떻게 생각하시는지 답을 듣고 싶습니다. 득표 공개, 기탁금 폐지와 공영제, 재정 공개, 청년의 결정권 — 이 방향에 먼저 손드는 후보가 제 답입니다."],"quotes":[["김보미","정책은 온데간데없고 적통 타령뿐인데 무엇을 보고 고릅니까. 민주당의 적통은 족보가 아니라 도전정신입니다 — 그 적통은 저입니다."]],"notes":["⚠ 재압박이 와도 실명 지지는 절대 금지 — '검증할 링(토론회)부터 달라 + 방향에 먼저 손드는 분' 프레임 반복"]},{"no":2213,"media":"한겨레뷰리핑(7.27)","q":"Q13. 당대표는 어떤 사람이 돼야 하나 — 이재명 정부를 뒷받침하는 후보인가, 개혁의 목소리를 내는 후보인가?","tags":["당대표상","당정관계","민심전달"],"script":["★ 둘 중 하나를 고르라는 질문 자체가 이상합니다. 집권여당 대표가 이재명 정부를 뒷받침하는 것은 물론이고, 개혁하는 것도 당연한 일 아닙니까. 기본을 가지고 노선처럼 경쟁하는 것부터가 문제입니다.","★ 진짜 문제는 따로 있습니다. 반성도 없고 성과도 없이 큰소리만 치는 '근자감' — 근거 없는 자신감입니다. 선거에 지고도, 논란을 만들고도, 내가 적통이네 내가 되어야 하네 큰소리부터 칩니다. 당대표의 자격은 목소리 크기가 아니라 반성과 성과에서 나옵니다.","★ 그런데 지금 그러고 계십니까. 뒷받침도 개혁도 아니고 신천지 얘기만 하고 있지 않습니까. 세 후보 모두에게 부탁드립니다. 청년, 청년, 구호로만 외칠 것이 아니라 — 득표 공개, 기탁금 폐지, 청년의 결정권, 그리고 제가 내놓은 12대 당 개혁 과제 — 실행 계획으로 답해 주십시오. 자기가 물러난 뒤에도 작동하는 공정한 시스템을 남기는 분이 당대표가 돼야 합니다."],"quotes":[["김보미","뒷받침도 개혁도 당연한 기본입니다. 문제는 반성과 성과 없이 큰소리치는 근자감입니다."]],"notes":[]},{"no":2214,"media":"한겨레뷰리핑(7.27)","q":"Q14. 앞으로의 계획은?","tags":["앞으로의행보","청년결집","디지털플랫폼","오뚝이"],"script":["★ 민주당은 김대중·노무현의 계란으로 바위 치기의 역사입니다. 안 된다는 곳에서 도전했고, 그 도전이 바위를 깼습니다. 김보미가 그 도전정신의 적통을 잇겠습니다.","★ 계속 정당 혁신과 세대교체를 외치겠습니다. 뜻을 같이하는 청년들을 모으는 활동도 시작합니다. 이번에 각개격파의 교훈을 배웠으니, 다음에는 함께 갑니다.","홍대선언은 예비경선 결과와 상관없이 국민께 드린 약속입니다. 젊은 세대가 참여하는 민주당의 디지털 플랫폼을 만드는 운동을 시작하고, 재정주권 운동도 계속합니다 — 김보미365처럼 정당의 돈까지 1원 단위로 투명해지는 그날까지.","★ 제 별명이 오뚝이입니다. 넘어뜨릴 때마다 기어이 다시 일어났습니다. 계란은 깨졌지만 바위에 낸 금은 남아 있고, 그 금은 점점 넓어질 것입니다. 김보미의 도전은 이제 시작입니다."],"quotes":[["김보미","민주당은 계란으로 바위 치기의 역사입니다. 그 도전정신의 적통을 잇겠습니다."]],"notes":[]},{"no":2221,"media":"한겨레뷰리핑(7.27)","q":"[패널] 8.1 충청권 첫 순회경선 — 현재까지 구도는 어떻게 보나?","tags":["순회경선","충청권","구도"],"script":["예비경선 득표조차 비공개인 상태라 모든 판세 분석은 어림값이라는 전제를 먼저 두겠습니다. 그 위에서 지역별로 보면 이렇습니다.","★ 호남은 3대 메가 프로젝트가 변수입니다. 정청래 후보가 호남 현안에서 전북 소외론 논란을 만든 것 때문에, 호남 표심이 김민석 후보 쪽으로 뭉칠 가능성이 있다는 이야기가 현지에서 나옵니다. 수도권은 투표율이 관건입니다 — 강성 당원만 투표장에 나오면 정청래 후보가 유리하고, 일반 권리당원까지 투표율이 높아질수록 김민석 후보가 유리해질 수 있습니다. 충청은 정청래 후보 쪽이 첫판 기세를 잡으려고 설계한 구도로 보이지만, 유권자 수 자체는 많지 않습니다.","★ 다만 제가 정말 걱정하는 것은 판세가 아니라 구조입니다. 정책과 비전으로 표가 움직이는 것이 아니라 어느 진영이 몇 명을 동원하느냐의 경쟁이 됐다는 것 — 저는 그것을 걱정합니다."],"quotes":[["김보미","득표가 비공개인 정당에서 판세 분석은 전부 어림값입니다."]],"notes":[]},{"no":2222,"media":"한겨레뷰리핑(7.27)","q":"[패널] 선호투표제 — 정청래 과반 여부가 관건, 과반 없으면 김민석 우위라는 캠프 분석. 맞다고 보나?","tags":["선호투표제","과반","2순위표"],"script":["산식 자체는 맞습니다. 과반이 없으면 3위의 2순위 표가 상위 2인에게 넘어가는데, 김·송 후보 지지자가 2순위로 정 후보를 고를 가능성은 낮다는 분석이지요.","★ 그런데 저는 이 대목에서 다른 것을 짚고 싶습니다. 선호투표제 도입 과정 자체가 계파 간 룰 협상의 산물이었고, 당내에서 선출직 청년최고위원제와 거래됐다는 말까지 나왔습니다. 게임 중에 규칙을 만들고, 그 규칙의 유불리를 계파별로 계산하는 전당대회 — 판세보다 이것이 본질입니다. 경선 규칙 6개월 전 확정, 그래서 필요한 것입니다."],"quotes":[],"notes":["※ 판세 단정 금지 — '산식은 맞지만 데이터는 아무도 모른다' 유지"]},{"no":2223,"media":"한겨레뷰리핑(7.27)","q":"[패널] 친청계 최고위원 3명(최민희·한민수·이성윤) 전원 컷오프 통과 — 조직력·지지세 보면 과반 가능하다는 분석도. 어떻게 보나?","tags":["친청","최고위원","조직력","대리전"],"script":["조직력이 확인된 것은 사실로 보입니다. 다만 최고위원 경선까지 진영별 분산 투표 전략이 가동되는 것 — 저는 이것을 '조직력'이라 부르지 않고 '대리전'이라고 부릅니다.","★ 당대표 선거에 최고위원 후보들이 진영별로 동행하고, 지지층은 상대 진영 유튜브 구독취소 운동을 벌입니다. 이런 전당대회에서 과반이 나온들, 그것이 민주당의 통합입니까, 어느 진영의 점령입니까. 저는 누가 이기느냐보다 이 방식으로 이긴 대표가 당을 통합할 수 있느냐를 묻고 싶습니다."],"quotes":[],"notes":[]},{"no":2224,"media":"한겨레뷰리핑(7.27)","q":"[패널·지명] 신천지 — 검경 합수본이 신도들의 민주당원 가입 정황을 수사 중. 어떻게 보나? + 실제로 호남에서 신천지 활동은?","tags":["신천지","합수본","당원명부","호남"],"script":["★ 논점을 정확히 하고 싶습니다. 신천지 신도가 당원에 가입하는 것 자체를 뭐라 할 수는 없습니다. 대한민국 국민이라면 누구나 정당에 가입할 자유가 있습니다. 문제는 종교가 아니라 대리 당원입니다 — 본인 의사와 무관하게 이름이 올라가고, 남이 당비를 대신 내주는 당원. 그것은 신천지든 누구든 명백한 불법 당원입니다.","★ 그래서 답은 하나입니다. 당원 명부 전수조사입니다. 본인이 가입했는지, 당비를 본인이 내는지 전수 검증하면 대리 당원은 종교와 상관없이 걸러집니다. 수사는 수사기관이 하고, 당은 당대로 전수조사를 해야 합니다. 가짜·유령 당원을 가려내지 못하는 정당은 이번이 아니어도 언젠가 같은 일을 또 겪습니다. 당원명부 전수 검증과 경선 데이터 100% 공개 — 제 공약이 바로 그것이었습니다.","호남 말씀을 주셨는데 — 저는 강진에서 특정 종교단체의 조직적 당원 가입을 직접 목격했다고 말씀드릴 근거는 없습니다. 다만 지역 경선 현장에서 '누가 데려온 당원인지 모르는 표'가 승부를 가르는 구조는 오래된 문제입니다. 명부 검증이 안 되는 한 어느 지역도 자유롭지 않다고 보는 것이 정직한 답일 겁니다."],"quotes":[["김보미","문제는 종교가 아니라 대리 당원입니다. 답은 당원 명부 전수조사입니다."]],"notes":["⚠ 신천지 사실관계 단정 금지(수사 중) · 호남 관련 목격담 창작 금지 — '직접 목격 근거 없다'로 정직하게. 특정 교단 비하 표현 금지"]},{"no":2225,"media":"한겨레뷰리핑(7.27)","q":"[패널] 정청래 '사과하라' 역공 vs 김민석 '불리해도 짚겠다' — 정리하면? + 박선원 구독취소 운동(50만→47.6만)까지.","tags":["신천지공방","구독취소","팬덤정치"],"script":["두 분 다 일리는 있습니다. 문제 제기 자체는 필요했고, 근거 없는 공격이었다면 사과도 필요하겠지요. 그 판정은 수사가 합니다. 정치가 할 일은 따로 있습니다 — 명부 검증 시스템을 만드는 것입니다.","★ 구독취소 운동, 저는 남의 일 같지 않습니다. 저도 양쪽 진영에서 악플과 문자 폭격을 받아 봤습니다. 그야말로 아무 말 대잔치, 학교폭력에 가까운 공격을 퍼붓습니다. 저는 묻고 싶습니다 — 본인이 지지하는 후보의 얼굴을 보면서도 그런 말을 할 수 있습니까? 그 공격이 본인 지지 후보에게 도움이 된다고 정말 생각하십니까?","★ 웃픈 것은, 악플을 단 분의 페이스북에 들어가 보면 지극히 정상적인 분들이라는 겁니다. 자녀가 있고 부모가 있는, 그리고 본인이 지지하는 후보 사진으로 도배가 된 평범한 분들 — 진영이 평범한 사람을 그렇게 만듭니다. 참 안타깝습니다.","★ 그런데 저는 양쪽에서 공격받은 것이 오히려 좋습니다. 제가 누구 편을 들어서, 이 한 몸 바쳐 출마해서 우쭈쭈해 준다고 좋아할 줄 알았다면 오산입니다. 어느 진영에도 속하지 않았다는 증명서를 양쪽에서 발급해 준 셈이니 — 저는 그 악플이 오히려 명예롭다고 생각합니다. 진영논리가 이견을 처벌하기 시작하면 정당에는 침묵만 남습니다. 민주당에 필요한 것은 더 큰 목소리가 아니라, 다른 목소리가 살아남는 구조입니다."],"quotes":[["김보미","양쪽에서 공격받은 것이 오히려 명예롭습니다. 어느 진영에도 속하지 않았다는 증명서를 양쪽에서 발급해 준 셈이니까요."]],"notes":[]},{"no":2226,"media":"한겨레뷰리핑(7.27)","q":"[패널] 적통 논쟁·반명 프레임 격돌(정청래 울산 '탈당 안 했다' vs 김민석 '반명 몰이가 뭔가') — 어떻게 보나?","tags":["적통논쟁","반명프레임","족보정치"],"script":["★ 저는 이 공방에 이름을 붙이겠습니다 — 족보 정치입니다. 누가 탈당을 했네 안 했네, 누가 적통이네 아니네. 2002년 이야기로 2026년 전당대회를 치르고 있습니다. 그 사이 청년 고용은 1년에 25만 명 넘게 줄었는데, 전당대회의 언어에 청년의 삶은 없습니다.","적통은 혈통이 아니라 실천입니다. 김대중의 적통은 김대중처럼 32세 청년을 발탁하는 사람이고, 노무현의 적통은 노무현처럼 기득권 구조에 맞서는 사람입니다. 과거의 족보가 아니라 미래의 실천으로 경쟁해 주십시오 — 세 후보께 드리고 싶은 말씀입니다."],"quotes":[["김보미","적통은 혈통이 아니라 실천입니다."]],"notes":[]},{"no":2227,"media":"한겨레뷰리핑(7.27)","q":"[패널] 박지원 '명청 갈등만 조장, 신천지 전쟁… 대통령 쪽박이라도 깨지 말아야' — 어떻게 보나?","tags":["박지원","쪽박","집권여당"],"script":["뼈아프지만 정확한 지적이라고 생각합니다. 대통령은 밖에서 외교 성과를 내고 있는데, 집권여당은 안에서 신천지 전쟁과 구독취소 운동을 하고 있습니다. 국민 눈에 어떻게 보이겠습니까.","★ 예비경선 때 제가 드린 경고 그대로입니다 — 민주당이 지금처럼 가면 2030이 다 떠나고 총선도 대선도 어렵습니다. 전당대회가 끝나면 남는 것은 당대표 한 명이 아니라 국민이 본 민주당의 모습입니다. 지금 이 모습이라면, 이기는 사람은 있어도 이기는 민주당은 없습니다."],"quotes":[["김보미","이기는 사람은 있어도, 이기는 민주당은 없습니다."]],"notes":[]},{"no":2231,"media":"한겨레뷰리핑(7.27)","q":"[검찰개혁] 7대 범죄 전건송치 등 보완책 — 그래도 부족하다는 지적(전세사기 제외, 죄명 판단 문제). 어떻게 보나?","tags":["보완수사권","전건송치","피해자보호"],"script":["검찰개혁의 방향에는 전적으로 동의합니다. 안 하자는 게 아니라 완성하자는 겁니다. 노무현 대통령 때 시작해 24년째인 숙제, 이번에는 끝내야 합니다.","★ 다만 보완책의 설계가 거꾸로 됐습니다. 죄명으로 피해자를 가르는 방식 — 아동학대 피해자는 보호받고 전세사기 피해자는 제외되는 기준이 국민께 설명이 됩니까. 게다가 경찰이 초동 단계에서 단순 폭행·사기로 죄명을 붙이면 전건송치 대상에서 빠져나갑니다. 보호 대상을 범죄 유형이 아니라 피해자 중심으로 다시 설계해야 합니다.","★ 그래서 두 가지 보완이 필요하다고 봅니다. 첫째, 경찰 내부에 경찰의 비리와 부실 수사를 감시할 수 있는 내부 통제 체계가 반드시 있어야 합니다. 둘째, 검찰에 보완수사권까지는 아니더라도 '보완수사 요구권' — 직접 수사하는 권한이 아니라 경찰에 보완수사를 하라고 요구할 수 있는 권리 — 정도는 주는 것이 맞다고 생각합니다. 그래야 상호 견제가 됩니다.","★ 제 원칙은 하나입니다. 칼은 뺏어도 좋습니다. 그러나 국민을 지키는 선까지 자를 일은 아닙니다. 개혁의 목적은 검찰을 이기는 것이 아니라 국민의 인권과 안전을 지키는 것입니다."],"quotes":[["김보미","칼은 뺏어도 좋습니다. 그러나 국민을 지키는 선까지 자를 일은 아닙니다."]],"notes":[]},{"no":2232,"media":"한겨레뷰리핑(7.27)","q":"[검찰개혁] 중수청에 7대 범죄 보완수사권 부여 — '전방위 수사대' 우려, 간판만 바꾼 수사 권력 아닌가?","tags":["중수청","수사권력","견제"],"script":["정확한 우려라고 생각합니다. 정치검찰도 안 되지만, 이름만 바꾼 또 하나의 무소불위 수사기관도 안 됩니다. 권력기관 개혁의 핵심은 간판 교체가 아니라 상호 견제의 설계입니다.","★ 중수청이 중대범죄 수사라는 설립 취지를 벗어나 경미한 보완수사까지 쓸어 담으면, 국민은 검찰 대신 중수청을 두려워하게 될 뿐입니다. 어느 기관이든 견제받지 않는 수사권은 반드시 부패합니다 — 제가 당직자의 무소불위 권력을 비판했던 것과 같은 원리입니다. 수사기관도, 정당도, 견제와 공개가 답입니다."],"quotes":[],"notes":[]},{"no":2233,"media":"한겨레뷰리핑(7.27)","q":"[검찰개혁] 정성호 법무장관 사의 표명 — 여권 난맥상 노출. 대통령이 힘있게 못 민 이유? 누구 책임인가?","tags":["정성호","사의표명","숙의부재","책임론"],"script":["★ 보완수사권은 유지해야 한다는 것이 정성호 장관의 오랜 소신이라고 봅니다. 경찰에 수사권이 집중됨으로써 발생하는 문제에 대해 주무장관으로서 책임질 수 없다는 생각을 갖고 계셨던 것으로 압니다. 그 소신을 사표로 말할 수밖에 없었던 상황 — 그것이 이 사태의 본질입니다.","★ 그리고 솔직한 아쉬움을 말씀드리면, 이재명 대통령께서 조금 더 명확하게 입장을 밝혀 주셨으면 하는 아쉬움이 있습니다. 동시에 당도 문제입니다. 보완수사권에 이견이 있으면 만나서 협의해야 할 것 아닙니까. 그런데 갈등과 대립을 이용해 자기 표를 얻는 데 집중하는 정치 — 그것은 개혁이 아니라 자기 정치입니다.","숙의 과정도 실종됐습니다. 주무장관이 사표를 던질 정도의 이견이 당론 확정 전에 공론장에서 다뤄지지 못했습니다. 지금이라도 30일 본회의 전에 피해자 보호 공백 문제만큼은 반드시 짚고 가는 것이 책임 있는 집권당의 모습입니다."],"quotes":[["김보미","이견이 있으면 만나서 협의해야지, 갈등을 자기 표로 만드는 것은 개혁이 아니라 자기 정치입니다."]],"notes":["※ '정 장관 소신' 발언은 '~라고 본다/~것으로 안다' 형식 유지(전언 단정 금지). 대통령 관련은 '아쉬움' 수위까지만 — 그 이상 확장 금지"]},{"no":2234,"media":"한겨레뷰리핑(7.27)","q":"[검찰개혁] 민주당이 최영중 전 청주시의원 영장 반려 사건을 '검찰개혁 필요성'으로 프레이밍 — 보완수사권과 결이 다르지 않나?","tags":["최영중","영장반려","프레이밍"],"script":["결이 다르다는 지적에 동의합니다. 검찰의 영장 반려가 부당했다면 그것대로 비판하고 바로잡을 일이지, 그 사건이 보완수사권 완전 폐지의 근거가 되지는 않습니다. 오히려 그 사건은 수사기관 사이의 견제와 기록 공개가 왜 필요한지를 보여주는 사례입니다.","★ 개혁의 근거는 튼튼해야 합니다. 결이 다른 사건을 가져다 붙이면 개혁 전체의 신뢰가 흔들립니다. 개혁은 속도가 아니라 신뢰로 완성됩니다."],"quotes":[],"notes":[]},{"no":2241,"media":"한겨레뷰리핑(7.27)","q":"[조국당] 신장식 신임 대표 '적대적 M&A식 합당 논의 거부' — 민주당이 풀어야 할 이슈인데?","tags":["조국혁신당","신장식","합당"],"script":["당연한 말씀을 하신 것이라고 봅니다. 흡수합병 대상 취급을 받고 좋아할 정당은 없습니다. 통합이 필요하다면 그것은 의석 셈법이 아니라 가치와 정책의 합의에서 시작해야 합니다.","★ 그리고 순서가 있습니다. 민주당이 먼저 매력 있는 정당이 되는 것입니다. 계파싸움과 밀실 경선을 그대로 둔 채 '들어오라'고 하면 누가 오겠습니까. 스스로 혁신한 정당에는 통합을 구걸할 필요가 없습니다 — 사람과 세력이 스스로 모입니다."],"quotes":[],"notes":[]},{"no":2242,"media":"한겨레뷰리핑(7.27)","q":"[조국당] 김민석 '흡수 원칙' vs 정청래 '전당원투표로 조속 통합' — 신 대표 태도는 정청래에게 유리해 보인다. 맞나?","tags":["합당공방","유불리"],"script":["단기 유불리는 그렇게 해석할 수 있겠지요. 하지만 저는 유불리 계산 자체가 문제라고 봅니다. 야권 지형을 좌우할 통합 문제까지 전당대회 표 계산의 소재가 되고 있는 것 — 이것이 지금 민주당 전당대회의 수준입니다.","★ 통합은 당대표 선거용 공약이 아니라 국민과 지지층에 대한 책임의 문제입니다. 누구에게 유리한가가 아니라 어떤 조건이면 국민께 떳떳한가로 논의를 옮겨야 합니다."],"quotes":[],"notes":[]},{"no":2243,"media":"한겨레뷰리핑(7.27)","q":"[조국당·지명] 이중당적 변수 — 실제로 현장에서 이중 당적자가 보이나? 대구에서도?","tags":["이중당적","당원명부","대구"],"script":["제가 개별 당원의 당적을 확인할 방법은 없으니 '봤다'고 말씀드리면 거짓말일 겁니다. 다만 현장 감각으로 말씀드리면, 민주당과 조국혁신당 지지층이 상당 부분 겹치는 것은 사실이고, 대구처럼 당세가 약한 지역일수록 두 당을 오가며 활동하는 열성 지지자의 비중이 커집니다.","★ 문제는 '가려낼 수단이 마땅치 않다'는 바로 그 지점입니다. 이중당적은 정당법 위반인데 명부 검증 시스템이 없어 확인조차 못 한다 — 신천지 논란과 정확히 같은 뿌리입니다. 당원 명부를 검증하지 못하는 정당은 경선 결과의 정당성을 스스로 증명할 수 없습니다. 돌고 돌아 같은 결론입니다. 명부 전수 검증, 데이터 공개."],"quotes":[],"notes":["⚠ '직접 봤다'식 증언 창작 금지 — 확인 불가 사실은 확인 불가라고 답하기"]},{"no":2245,"media":"한겨레뷰리핑(7.27)","q":"[예비] 국민의힘 권영진 '멱살' 사건 — 원외당협위원장 41명 제명 요구. 전망은?","tags":["국민의힘","권영진","멱살"],"script":["★ 말도 안 되는 일이 벌어진 겁니다. 상임위원장 자리 때문에 자기 당 원내대표 멱살을 잡는다니 — 국회의원들 수준 좀 높였으면 좋겠습니다. 맨날 막말이나 하고 멱살이나 잡고, 그래서야 되겠습니까. 우리 청년들이 정치를 보고 뭘 배우겠습니까.","★ 그리고 거울로 삼아야 합니다. 민주당도 지금 전당대회에서 고성과 구독취소 운동을 하고 있지 않습니까. 국민은 여야를 나눠서 보지 않습니다. '정치가 저 모양'이라고 함께 묶어서 봅니다. 여야 모두 품격부터 회복해야 합니다."],"quotes":[],"notes":[]},{"no":2101,"media":"한겨레TV","q":"📋 전략 브리핑 — 한겨레TV는 어떤 자리인가, 무엇을 준비하나","tags":["한겨레TV","전략","브리핑"],"script":["한겨레TV는 진보 성향 시청자 중심의 심층 유튜브 채널입니다. 우호적이지만 얕은 답은 통하지 않습니다 — 구조 비판에 공감하는 시청자들이라 '그래서 뭘 할 건데'까지 파고듭니다. 시간이 길어 꼬리질문이 많습니다.","★ 준비 축은 세 가지입니다. ① 지금까지 모든 매체가 반복해 물은 질문(아래 ①카드 — 답변은 이미 전부 확정돼 있음), ② 김보미가 최근 페이스북·김보미닷컴에서 주장한 내용에서 나올 질문(②카드), ③ 김민석·정청래·송영길 3파전에서 지금 쟁점이 된 내용에서 나올 질문(③카드).","★ 오늘의 포지션: 탈락한 후보가 아니라 '본선을 지켜보는 심판이자 감시자'. 세 후보 개인 평가는 하지 않고, 본선이 검증해야 할 시스템 의제(밀실 컷오프 공개·기탁금 폐지·경선 공영제·재정 공개)를 제시하는 사람으로 앉아 있을 것."],"quotes":[],"notes":["⚠ 진보 매체라고 긴장을 풀면 안 됨 — 우호적 매체일수록 발언이 크게 인용됨. 금지 리스트(돈봉투 실명·아파트 소문·유시민 논평·특정 후보 지지)는 동일 적용"]},{"no":2102,"media":"한겨레TV","q":
