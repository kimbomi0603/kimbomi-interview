"① 매체 공통 반복 질문 15 — 지금까지 모든 인터뷰에서 반복된 질문 (답변 확정본 있음)","tags":["공통질문","반복질문","기출문제"],"script":["★ 다음 15개는 뉴스핌부터 KBC까지 모든 매체가 반복해서 물은 '기출문제'입니다. 한겨레TV도 이 중 대부분을 물을 것입니다. 답변은 대시보드 각 탭에 확정돼 있습니다.","1) 왜 출마했나·왜 나왔냐 (전 매체 공통) → '저는 당선되러 나왔습니다' 확정 워딩","2) 686 정치의 문제·세대교체란 무엇인가 (전 매체) → 사이렌·아름다운 퇴장·검증의 링","3) '세대가 아니라 능력의 문제' 반론 (KBC·SBS 등) → '60대 청년도 있고 40대 꼰대도' + 검증의 링","4) 기탁금 논란 (9개 매체) → 인하는 답이 아니다·폐지와 공영제","5) 이재명 대통령 팔로우의 의미 (7개 매체) → 감사 먼저, 개인의 선의는 시스템을 못 이긴다","6) 청년이 민주당을 외면하는 이유 (7개 매체) → 회귀물 세대·앞과 뒤가 다르니","7) 예비경선에서 직접 겪은 불공정 (KBC·JTBC·세계일보) → 고무줄 규칙·나흘·토론회 0회","8) 강진 경선·표적 징계 경험 (다수) → 침묵의 대가","9) 가짜 1인 1표·경선 결과 비공개 (SBS·KBS광주 등) → 결과를 공개하지 않는 1인 1표는 가짜","10) 송영길 호통 사건 (YTN·SBS·KBS) → 통합 답변 확정본","11) 신천지 개입설 (SBS·뉴스핌·YTN) → 사실이면 중대, 진상규명·명부 검증으로 (아래 ③ 최신 국면 참조)","12) 검찰 보완수사권 (5개 매체) → 확정 입장 유지","13) 호남 공천·호남 정치 (광주 매체 전부) → 선거가 없고 공천만 있다·경선을 본선처럼","14) 친명·친청 양쪽에서 공격받는 심경 (뉴스1·바삭한) → 진영논리·칼잡이 거부 확정 워딩","15) 앞으로의 행보 (전 매체) → 계속 외치겠다·청년 결집·디지털 플랫폼·오뚝이"],"quotes":[],"notes":["※ 각 답변 전문은 해당 매체 탭(KBC·SBS·YTN·서면)에서 클릭 한 번으로 확인"]},{"no":2103,"media":"한겨레TV","q":"② 최근 주장 기반 예상 질문 — 페이스북·김보미닷컴에서 나올 질문","tags":["페이스북","청년강퇴정당","서명운동","가처분","홍대선언"],"script":["★ Q. '청년 강퇴 정당'이라는 표현을 썼다(7.20 페이스북). 무슨 뜻인가? → 민주당이 청년을 키우는 정당이 아니라 강제로 퇴장시키는 정당이 돼 간다는 뜻입니다. 청년은 출발도 못 했는데 기득권은 이미 결승선 근처에 가 있습니다. 기탁금 인상, 나흘짜리 선거운동, 토론회 0회 — 퇴장은 제도가 시킵니다.","★ Q. 컷오프 득표 결과 공개 서명운동을 하고 있다. 경선 불복 아닌가? → 불복이 아니라 상식입니다. 저는 결과에 승복했습니다. 그러나 몇 표를 얻었는지는 후보도 당원도 알아야 합니다. 결과를 공개하지 않는 1인 1표는 가짜입니다. 승복과 검증 요구는 별개입니다 — 이긴 쪽도 떳떳하려면 공개해야 합니다.","Q. 가처분 등 법적 대응까지 거론되는데? → 저는 당이 스스로 공개하는 것이 최선이라고 생각합니다. 당내 민주주의를 당 스스로 회복할 기회를 드리는 것이고, 그래서 서명으로 먼저 요구하는 것입니다.","Q. 홍대선언(갈아엎기 대전환 선언)은 계속 유효한가? → 예비경선 결과와 상관없이 국민께 드린 약속입니다. 12대 약속 그대로 갑니다 — 본선 후보들이 이 의제를 받는지 지켜보고 물을 것입니다."],"quotes":[["인용 후보","승복과 검증 요구는 별개입니다. 이긴 쪽도 떳떳하려면 공개해야 합니다."]],"notes":["※ 서명운동·가처분 관련 표현은 김보미닷컴 게시 기준 — 방송 전 캠프에서 최신 문구·진행 상황 최종 확인 필요"]},{"no":2104,"media":"한겨레TV","q":"③ 본선 쟁점 기반 예상 질문 — 김민석·정청래·송영길 3파전에서 나올 질문","tags":["본선쟁점","신천지","대리전","선호투표제","지지후보"],"script":["★ Q. 신천지 공방이 본선 최대 쟁점이 됐다(친청 '정치공작 음모론' vs 친명 '예의를 잃었다'). 어떻게 보나? → 저는 어느 진영의 편도 아닙니다. 이 공방이 보여주는 것은 하나입니다 — 당원 명부를 당이 검증하지 못하고 있다는 것. 의혹이 사실이면 중대 사안이고, 아니면 무고한 공격입니다. 어느 쪽이든 답은 같습니다. 당원 명부 전수 검증과 경선 데이터 100% 공개. 진짜 1인 1표는 거기서 시작됩니다.","★ Q. 본선이 친명 대 친청 대리전으로 흐르고 있다. → 예비경선 때 제가 드린 말씀 그대로 됐습니다. 청년 고용이 1년에 25만 명 넘게 줄었는데, 전당대회의 언어는 어제도 오늘도 계파입니다. 민주당은 지금 정책이 아니라 족보로 싸우고 있습니다. 본선이 계파 갈등이 아니라 청년·서민·지역을 살리는 정책 경쟁의 장이 되도록 끝까지 요구하겠습니다.","Q. 세 후보 중 누구를 지지하나? → 사람이 아니라 방향을 지지합니다. 밀실 컷오프 공개, 기탁금 폐지와 공영제, 재정 1원까지 공개, 청년 결정권 — 이 방향에 동의하는 당대표를 지지하겠습니다. 세 분 모두에게 공개적으로 묻겠습니다.","Q. 선호투표제·컷오프 결과 비공개 등 룰 논란은? → 게임 중에 규칙을 바꾸고, 끝나도 점수를 안 알려주는 경기를 국민이 신뢰하겠습니까. 경선 규칙 6개월 전 확정과 결과 전량 공개 — 홍대선언 1번 약속입니다.","Q. 송영길 후보 자격 논란·거친 발언은? → 개인 평가는 하지 않겠습니다. 다만 원칙은 말씀드립니다 — 청년 박지현에게 적용된 잣대와 686 선배에게 적용되는 잣대가 다르면, 그것은 공정이 아닙니다."],"quotes":[["인용 후보","민주당은 지금 정책이 아니라 족보로 싸우고 있습니다."]],"notes":["⚠ 신천지: 사실관계 단정 금지(수사·공방 진행 중) — '의혹이 사실이면/아니면' 구조 유지. 송영길: 실명 비판 최소화, 원칙 프레임만"]},{"no":2105,"media":"한겨레TV","q":"⭐ 내일 한겨레TV에서 꼭 할 말 총정리 (이 순서대로)","tags":["할말","필수멘트","한겨레TV"],"script":["★ ① (탈락 소회 물으면) 결과는 졌지만 도전은 지지 않았습니다. 나흘 동안 107명의 국민께서 1,909만 원을 후원해 주셨습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들을 확인했습니다 — 그 한 표 한 표가 바위에 금을 냈습니다.","★ ② (구조 이야기로 전환) 저는 후보 등록을 마치고 나서야 경선 규칙을 받았습니다. 토론회는 0회, 선거운동은 사실상 하루, 그리고 몇 표를 얻었는지는 지금도 모릅니다. 결과를 공개하지 않는 1인 1표는 가짜입니다 — 그래서 컷오프 득표 공개를 요구하는 서명운동을 하고 있습니다. 승복과 검증 요구는 별개입니다.","★ ③ (본선 국면 논평) 청년 후보는 전원 탈락했고 본선은 계파 공방입니다. 민주당은 지금 정책이 아니라 족보로 싸우고 있습니다. 저는 세 후보 모두에게 공개적으로 묻겠습니다 — 밀실 컷오프 공개, 기탁금 폐지, 재정 1원까지 공개, 청년 결정권. 이 방향에 동의하는 당대표를 지지하겠습니다.","★ ④ (세대교체 본질) 김대중 대통령께서는 32세 김민석을 발탁하셨습니다. 그때의 젊은 피가 지금 30년째 정치를 하고 있습니다. 본인들은 됐는데, 왜 지금의 청년들은 못할 것이라고 생각하십니까. 본인들이 청년일 때 외쳤던 소리를 지금의 청년이 하는데 기분이 나쁘시다면 — 이미 기득권이 되셨다는 뜻입니다.","★ ⑤ (해법) 시혜가 아니라 시스템입니다. 누가 당대표가 되더라도 바뀌지 않는 시스템 — 경선 규칙 6개월 전 확정, 기탁금 폐지와 당직선거 공영제, 경선 결과 100% 공개, 당 재정 1원까지 실시간 공개, 청년이 당 예산을 직접 편성·집행·평가하는 결정권. 홍대선언 12대 약속입니다.","★ ⑥ (마무리) 계속 정당 혁신과 세대교체를 외치겠습니다. 뜻을 같이하는 청년들을 모으는 활동도 시작합니다. 계란은 깨졌지만 바위에 낸 금은 남아 있고, 그 금은 점점 넓어질 것입니다. 김보미의 도전은 이제 시작입니다."],"quotes":[],"notes":["※ ②의 서명운동 언급은 방송 전 캠프 최종 확인 후 사용. 시간이 짧으면 ①→③→⑤→⑥ 순으로 압축"]},{"no":1601,"media":"KBC광주방송","q":"Q1. 어제(23일) 예비경선 결과가 나왔습니다. 본선 진출에는 실패했지만 강한 메시지를 던지며 주목을 끌었는데요. 이번 도전을 마친 소회가 어떻습니까?","tags":["소회","탈락","감사","바위에금"],"script":["후회는 없습니다. 먼저 감사 인사부터 드리고 싶습니다. 조직도 계파도 없는 세 명짜리 캠프, 사무실도 없이 카페를 전전하던 저희를 여기까지 오게 해 주신 분들 — 귀한 한 표를 던져 주신 당원 동지 여러분, 그리고 묵묵히 응원해 주신 시민 여러분께 진심으로 감사드립니다.","★ 저는 이번 경선에서 확인했습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들이 계시다는 것을, 젊은 날의 자신을 떠올리며 청년의 도전에 손을 내밀어 주시는 분들이 계시다는 것을. 그 한 표 한 표가 바위에 금을 냈습니다.","★ 결과는 졌지만, 도전은 지지 않았습니다. 계란은 깨졌지만 바위에 낸 금은 남아 있습니다. 이번 전당대회에서 세대교체와 대전환이 의제가 됐고, 그것은 이미 시작된 변화입니다. 제가 홍대에서 선언한 '민주당 갈아엎기 대전환 선언'은 예비경선 결과와 상관없이 국민께 드린 약속입니다 — 그 약속은 지금부터 시작입니다."]},{"no":1602,"media":"KBC광주방송","q":"Q2. 최고위원이 아닌 당대표에 도전한 것을 두고 많은 분들이 놀랐습니다. 쉽지 않은 선택이었는데, 그럼에도 당대표 선거에 뛰어든 이유는?","tags":["당대표도전","의제","최고위원","비전"],"script":["자리를 얻으려 했다면 최고위원이 맞았겠지요. 하지만 저는 자리가 아니라 방향을 바꾸러 나갔습니다. 최고위원은 아홉 자리 중 하나지만, 당대표 선거는 민주당이 어디로 갈 것인가를 정하는 무대입니다. 세대교체와 대전환이라는 의제를 전당대회 한복판에 올리려면 당대표 도전이어야 했습니다.","★ 그리고 이번 전당대회에서 공약집을 발표한 사람은 저밖에 없습니다. 출마선언의 5대 분야 25개 정책공약, 그리고 홍대에서 민주당이 가야 할 길을 제언한 '민주당 갈아엎기 대전환 선언' 12대 약속까지 — 이름을 알리러 나온 것이 아니라, 민주당을 바꿀 설계도를 들고 나갔던 것입니다.","민주당이 지금처럼 가면 2030이 다 떠나고 총선도 대선도 어렵습니다. ★ 누군가는 민주당의 위기에 사이렌을 울려야 했습니다. '686, 이제 떠날 때가 됐다'는 말을 누가 하겠습니까. 권력에 줄 선 적 없고, 눈치 볼 사람도 없는 제가 해야 한다고 생각했습니다. 더 이상 골든타임을 놓칠 수 없으니, 오죽하면 청년 평당원이 답답해서, 화가 나서 나섰겠습니까.",""]},{"no":1603,"media":"KBC광주방송","q":"Q3. 선거 기간 내내 '청년 정치'와 '세대교체'를 화두로 던졌습니다. 이번 선거를 통해 가장 크게 얻은 것은?","tags":["얻은것","침묵하는다수","세대교체의제화"],"script":["★ 침묵하는 다수가 계시다는 확신을 얻었습니다. 진영논리에 지친, 그러나 가치에 반응하는 분들 말입니다. 60~70대 어르신들께 정말 많은 연락을 받았고, 실제로 현장에서 짱돌을 들었던 당 선배님들이 직접 전화를 주셔서 격려해 주시고 동의해 주셨습니다. 저는 거기서 민주당의 미래와 희망을 봤습니다.","그리고 세대교체와 대전환이 이번 전당대회의 의제가 됐습니다. 어느 후보도 이제 청년과 혁신을 말하지 않고는 선거를 치를 수 없게 됐습니다. 이번 도전은 그 자체로 성공입니다."]},{"no":1604,"media":"KBC광주방송","q":"Q4. 당내 현실이나 정치 문화를 직접 경험하면서 '이건 정말 바뀌어야 된다'라고 느낀 부분은?","tags":["당내현실","고무줄규칙","기탁금","경선구조"],"script":["지난 강진군수 경선에서 겪은 일이 그대로 반복되고 있다는 것이 가장 뼈아팠습니다. 네 가지입니다. 첫째, 저는 후보 등록을 마치고 나서야 경선 규칙을 받았습니다. 게임이 시작된 뒤에 규칙을 주는 정당 — '고무줄 규칙'부터 바뀌어야 합니다.","둘째, 선거운동 기간은 단 5일, 후보 간 토론회는 한 번도 없었고, 청중 없이 동영상 한 번 촬영한 것이 공식 기회의 전부였습니다. 셋째, 경선이 끝나도 선거인 수·투표율·득표수를 알 수 없습니다. 결과를 공개하지 않는 1인 1표는 가짜입니다.","★ 넷째, 청년에게는 기탁금이라는 돈의 장벽이 있습니다. 저도 기탁금 구하느라 정말 힘들었습니다. 돈과 조직이 없으면 출발선에 설 수도 없는 구조 — 이것이 바뀌지 않으면 세대교체는 없습니다."]},{"no":1605,"media":"KBC광주방송","q":"Q4-1. 반면 의미 있는 순간도 많았을 것 같은데요. 예비경선을 치르면서 가장 기억에 남았던 순간은?","tags":["기억에남는순간","선배전화","홍대선언"],"script":["★ 두 장면입니다. 하나는 실제로 짱돌을 들었던 민주화운동 세대 선배님이 전화를 주셔서 동의해 주시고 격려해 주신 순간입니다. 비난을 각오하고 드린 말씀이었는데, 그 세대 당사자께서 손을 내밀어 주신 것입니다. 울컥했습니다.","또 하나는 결과 발표 전날, 청년의 거리 홍대에서 '민주당 대전환 선언'을 하던 순간입니다. 본선에 못 갈 수도 있다는 것을 알면서도, 결과와 상관없는 약속을 시민들 앞에서 드렸습니다. 정치 인생에서 가장 떨리고 가장 자유로웠던 순간이었습니다.","카페에서, 식당에서 노트북 하나 들고 회의하던 세 명의 캠프 동지들도 잊지 못할 겁니다."]},{"no":1606,"media":"KBC광주방송","q":"Q5. 기탁금 문제도 공개적으로 제기했고, 결국 당대표 기탁금은 1억에서 8천만 원으로 인하됐습니다. 이번 논란이 시사하는 점은?","tags":["기탁금","공영제","돈의장벽"],"script":["청년 평당원 한 사람이 문제를 제기하니 대통령께서도 공감해 주셨고, 당이 실제로 움직였습니다. 목소리를 내면 바뀐다는 것 — 그것이 첫 번째 시사점입니다.","★ 하지만 인하는 답이 아닙니다. 8천만 원도 청년에게는 넘을 수 없는 벽이고, 이재명 대표 시절과 비교하면 여전히 두 배입니다. 그리고 등록은 이미 끝난 뒤였습니다. 예비경선의 문턱은 여전히 높습니다.","★ 답은 기탁금 폐지와 당직선거 공영제입니다. 대학이 원서 장사를 하듯, 당에 돈이 남아돌면서도 기탁금을 받습니다. 기탁금은 결국 기득권 유지 수단입니다. 경쟁의 자원은 돈과 조직이 아니라 실력과 정책이어야 합니다."]},{"no":1607,"media":"KBC광주방송","q":"Q6. '686 정치'를 공개적으로 비판했지만, 일각에서는 '세대가 아니라 능력의 문제'라는 반론도 있었습니다. 어떻게 생각하십니까?","tags":["능력론","3선배제","검증의링","김대중","돈봉투"],"notes":["⚠ '돈봉투로 선거를 해 놓고' 부분은 특정인(송영길) 추정 가능 + 재판 진행 사안 — 방송에서는 실명 없이 이 표현 그대로만, 유·무죄 단정 금지."],"script":["★ 그 반론에 동의합니다. 60대 청년도 있고 40대 꼰대도 있습니다. 기준은 나이가 아니라 생각입니다. 제가 말하는 세대교체의 대상은, 능력도 없으면서 청년 세대의 진입을 막고 기득권을 누리는 686입니다 — 선거에 져 놓고도, 돈봉투로 선거를 해 놓고도 검찰이 탄압했다며 또 나오는 분들 말입니다. 그래서 제 요구가 바로 '능력으로 겨루게 해달라'는 것이었습니다. 몇 살이든 토론과 연설로 검증받고 이기면 됩니다. 그런데 지금 민주당에는 그 검증의 링 자체가 없습니다. 이번 예비경선에서 후보 토론회가 몇 번 있었습니까. 없었습니다.","능력의 문제라면 능력을 보여줄 기회를 주십시오. 경쟁을 회피하고, 규칙을 유리하게 바꾸고, 결과를 공개하지 않는 것은 능력이 아니라 기득권입니다.","김대중 대통령께서는 32세 김민석, 청년 송영길을 발탁하셨습니다. 능력은 나이를 가리지 않는다는 것을 그분이 증명하셨습니다. 세계를 보십시오. 핀란드 산나 마린은 34세에 총리가 됐고, 오스트리아 쿠르츠는 31세에 총리, 프랑스 마크롱은 39세에 대통령이 됐습니다. 스페인에서는 30대 당대표가 나오고, 뉴욕시장 맘다니는 저보다 동생뻘이며, 그레타 툰베리는 10대의 목소리로 전 세계를 움직이지 않았습니까. 청년이라서 못하는 것이 아니라, 기회를 주지 않아서 못 해 본 것뿐입니다.","★ 그리고 그때 영입되신 분들은 지금까지 30년째 정치를 하고 계십니다. 그때는 SNS가 없어서 드러나지 않았을 뿐 말실수도 사건 사고도 얼마나 많았습니까. 본인들은 됐는데 왜 지금의 청년들은 못할 것이라고 생각하십니까. 본인들이 청년일 때 기득권을 향해 외쳤던 소리를 지금의 청년이 똑같이 하는데 기분이 나쁘시다면 — 그것은 이미 기득권이 되셨다는 뜻입니다."]},{"no":1608,"media":"KBC광주방송","q":"Q7. 기성 정치를 비판할 때마다 '누군가를 떨어뜨리기 위해 나온 것 아니냐'는 반응도 적지 않았습니다. 그런 평가를 감수하면서까지 목소리를 낸 이유는?","tags":["왜목소리","진영논리","침묵의대가"],"script":["저는 누구를 떨어뜨리러 나온 것이 아니라 민주당을 살리러 나왔습니다. 그런데 이 질문 자체가 민주당의 현주소였습니다. 청년이 나오면 '왜 나왔느냐'부터 검증받습니다. 686 선배들이 출마할 때 그렇게 묻는 사람은 없지 않습니까.","★ 침묵하면 안전하다는 것, 저도 압니다. 강진에서 침묵하지 않았다가 표적 징계에 제명, 수사, 언론 조리돌림까지 겪어 봤으니까요. 하지만 침묵의 대가가 무엇인지도 압니다 — 지금의 민주당입니다. 조곤조곤 부탁드리고 읍소하면 들어나 줍니까? 아무도 들어주지 않았습니다. 돌아오는 것은 징계와 제명뿐이었습니다.","저는 사람을 평가하거나 공격한 것이 아니라 과정의 불공정을 질문한 것입니다. 그리고 그 질문은 선배님들이 청년일 때 기성 질서를 향해 외쳤던 바로 그 질문입니다."]},{"no":1609,"media":"KBC광주방송","q":"Q8. 청년 정치가 제대로 자리 잡기 위해 민주당은 공천과 당 운영, 정치 신인 육성 중 무엇부터 바뀌어야 한다고 보십니까?","tags":["공천개혁","청년결정권","정치신인육성"],"script":["★ 공천부터입니다. 공천이 바뀌면 혁신은 따라옵니다. 경선 규칙 6개월 전 확정, '달리 정할 수 있다' 단서조항 전부 삭제, 경선 결과 100% 공개, 기탁금 폐지와 경선비용 공영제, 그리고 충분한 토론회와 연설회 보장과 공천관리위원회에서 국회의원 측근·앞잡이 배제까지 — 이렇게 해야 청년이 링에 오르고, 당선까지 될 수 있습니다.","다음이 당 운영입니다. 청년위원회를 청년정책의 최고 의결기구로 격상하고 당 예산의 일부를 청년이 직접 편성·집행·평가하게 해야 합니다. 자리가 아니라 예산과 결정권 — 청년을 들러리가 아니라 주주로 만드는 것입니다.","육성은 그 토대 위에서 가능합니다. 부모가 동의하면 가입할 수 있는 16세 당원부터 70세 전통 당원까지 정치·정책 교육을 하고, 지방의회부터 인재를 키우는 사다리를 만들어야 합니다. 지방의회는 중앙의 축소판입니다 — 저도 그 사다리에서 자란 사람입니다."]},{"no":1610,"media":"KBC광주방송","q":"Q9. 호남 정치에서도 공정한 경쟁이 필요하다는 목소리가 커지고 있습니다. 지역 정치가 건강해지기 위해 가장 시급한 변화는?","tags":["호남정치","깃발만꽂으면","알권리","공천혁신"],"script":["★ 호남에는 선거가 없고 공천만 있습니다. 깃발만 꽂으면 당선이니, 정치인이 주민이 아니라 공천권자를 바라봅니다. 그래서 당내 경선을 본선거처럼 치러야 합니다 — 의무 토론회, 유권자 앞 연설회, 공약집 제출 의무화, 경선 결과 전량 공개. 본선거 수준의 검증을 경선에 도입하는 것입니다.","그리고 의회가 살아야 합니다. 저는 8년간 견제 없는 일당 구조에서 의회가 거수기가 되는 것을 봤고, 순응하지 않았습니다. 일문일답 군정질문, 낭비예산 108억 삭감, 본회의·행정사무감사 생중계와 업무추진비 전면 공개 — 강진에서 해 봤습니다. 군민들의 알 권리가 시작되면 정치가 바뀝니다. 시민들의 눈과 귀를 여는 것, 그것이 정치입니다.","호남이 김대중을 키웠고 노무현을 만들었습니다. 이제 호남이 호남의 청년 정치인을 키워 주십시오. 그것이 호남 정치가 건강해지는 가장 빠른 길입니다."]},{"no":1611,"media":"KBC광주방송","q":"Q10. 전남광주 반도체 클러스터 조성이 본격화되면서 지역 산업 구조도 크게 바뀔 것으로 보입니다. 지역의 미래를 위해 가장 먼저 준비해야 할 것은?","tags":["반도체클러스터","청년취업보장제","인재사다리","통합인센티브"],"notes":["(※) '통합 인센티브 연 5조' 수치는 방송 전 최종 확인 권장 — 불확실하면 '수조 원대 인센티브'로 표현."],"script":["★ 사람입니다. 공장은 지어도 인재가 없으면 결국 수도권에서 데려오고, 지역 청년은 구경꾼이 됩니다. 배우고, 취업하고, 정착하는 사다리를 지역 안에 만드는 것 — 청년취업보장제가 그래서 필요합니다. 호남 청년들이 공무원 시험이 아니라 AI와 반도체에서 꿈을 키울 수 있어야 합니다.","광주는 AI 시범도시와 국가 AI데이터센터를, 전남은 재생에너지와 산업용지를 갖췄습니다. 두 지역이 결합하면 AI 반도체 설계부터 데이터센터, 전력반도체까지 수도권과 경쟁하는 것이 아니라 대한민국 AI 반도체 생태계를 완성할 수 있습니다.","★ 통합 인센티브로 해마다 5조 원씩 지원된다고 합니다. 이 돈으로 토목 잔치를 벌일 것이 아니라 인재 육성에, 청년들이 지역에서 배우고 정착할 수 있도록 하는 데 써야 합니다. 그리고 경계해야 할 것은 이 800조 국가 비전을 자기 선거에 이용하고 지역을 갈라치는 정치입니다. 전남·전북을 가르고 친문·친명을 가르는 정치로는 아무것도 성공시킬 수 없습니다."]},{"no":1612,"media":"KBC광주방송","q":"Q11. 통합특별시 출범 이후 갈등보다 미래 비전을 만들어야 한다는 목소리가 나옵니다. 우리 지역이 어떤 방향으로 나아가야 한다고 보십니까?","tags":["통합특별시","두번째수도권","청사갈등"],"script":["통합의 목적은 청사 위치가 아니라 지역의 생존입니다. 무안이냐 광주냐로 싸우는 사이에 청년들은 수도권으로 떠납니다. 갈등의 언어가 아니라 미래의 언어로 말해야 합니다.","★ 저는 호남이 대한민국의 '두 번째 수도권'이 되어야 한다고 생각합니다. AI·반도체·재생에너지라는 미래 산업의 조건을 다 갖춘 곳이 호남입니다. 통합특별시는 그 그릇입니다. 그릇을 두고 싸울 것이 아니라, 그 그릇에 무엇을 담을지를 경쟁해야 합니다.","기준은 하나입니다 — 청년이 남는 지역인가. 일자리가 있고, 배울 곳이 있고, 도전할 링이 있는 지역. 그것이 통합특별시가 가야 할 방향입니다.","★ 제가 '호남 독립선언'에서 말씀드린 그대로입니다. 서울로 떠나는 호남이 아니라, 청년들이 찾아오는 호남을 만들겠습니다. 밖에 나간 호남의 청년들이 돌아오고, 다른 지역 청년들까지 본적을 호남으로 옮기고 싶어지는 땅 — 호남이 대한민국의 두 번째 수도권이 되는 그날까지 — 만들어야 합니다. 저도 노력하겠습니다."]},{"no":1613,"media":"KBC광주방송","q":"Q12. 이번 도전은 마무리됐지만 정치인 김보미의 도전은 끝난 것이 아닐 텐데요. 앞으로 어떤 길을 걸어가고 싶습니까? 다음 목표는?","tags":["앞으로의길","홍대선언","오뚝이","디지털플랫폼"],"script":["★ 계속 정당 혁신과 세대교체를 외치겠습니다. 그리고 뜻을 같이하는 청년들을 모으는 활동도 시작할 겁니다. 제 별명이 똑순이, 오뚝이입니다. 넘어질 때마다 다시 일어났습니다. 이번에도 마찬가지입니다.","★ 홍대선언은 예비경선 결과와 상관없이 드린 약속입니다. 젊은 세대가 참여하는 민주당의 디지털 플랫폼을 만드는 운동을 시작하고, 전당대회 본선이 계파 갈등이 아니라 청년·서민·지역을 살리는 정책의 장이 되도록 힘을 보태겠습니다. 재정주권 운동도 계속합니다 — 김보미365처럼, 정당의 돈까지 1원 단위로 투명해지는 그날까지.","★ 규칙을 만든 사람들의 정당을 끝내고 침묵하는 다수의 소리를 듣는 정당을 만드는 데 평생을 바치겠습니다. 호남에서, 현장에서 계속 정치하겠습니다.","★ 이번 경선에서 계란은 깨졌습니다. 하지만 바위에 낸 금은 남아 있고, 그 금은 점점 넓어질 것입니다. 저는 죽어도 다음 세대는 살아야 하지 않겠습니까. 김보미의 도전은 이제 시작입니다. 지켜봐 주십시오."]},{"no":1614,"media":"KBC광주방송","q":"🎬 첫인사 — 전남광주특별시민 여러분께 (호남 중심 오프닝)","tags":["첫인사","호남","전남광주특별시","감사"],"script":["전남광주특별시민 여러분, 안녕하십니까. 김보미입니다.","예비경선을 마치고 처음 인사드리는 자리가 고향 방송이라 마음이 남다릅니다. 지난 며칠 정말 많은 분들이 손을 잡아 주셨습니다. 그 온기부터 전해드리고 싶습니다. 감사합니다.","★ 저는 이번 경선에서 확인했습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들이 계시다는 것을, 젊은 날의 자신을 떠올리며 청년의 도전에 손을 내밀어 주시는 분들이 계시다는 것을. 그 한 표 한 표가 바위에 금을 냈습니다."]},{"no":1615,"media":"KBC광주방송","q":"🏁 마무리 인사 — 전남광주특별시민 여러분과 함께 (호남 중심 클로징)","tags":["마무리","호남","호남독립선언","두번째수도권","전남광주특별시"],"script":["저는 오늘도 현장으로 돌아갑니다. 정치는 여의도에만 있는 것이 아니라 우리의 삶 속에 있다고 믿기 때문입니다.","★ 서울로 떠나는 호남이 아니라 청년들이 찾아오는 호남, 본적을 호남으로 옮기고 싶어지는 땅, 대한민국의 두 번째 수도권 — 전남광주특별시민 여러분과 함께 반드시 만들겠습니다.","지켜봐 주십시오. 김보미의 도전은 이제 시작입니다. 감사합니다."]},{"no":2001,"media":"경향신문(통화)","q":"📞 통화 전 3줄 브리핑 — 김민아 위원은 누구이고 무엇을 쓰려 하나","tags":["경향신문","김민아","칼럼","통화대비"],"script":["김민아 논설위원은 민주당의 계파싸움과 정책 공백을 정면 비판해 온 원칙주의 논객입니다. 6월 칼럼 제목이 '민주당은 지금 자신들의 무가치함과 싸우고 있다'였고, 2030 보수화를 'AI 탓으로 돌리며 지지를 바란다면 뻔뻔하지 않냐'고 썼습니다.","★ 준비 중인 칼럼 주제는 '민주당이 청년 이슈를 다루는 시각과 행태'. 김보미의 구조 비판(병풍·기탁금·깜깜이 경선)과 시각이 거의 일치합니다 — 적대적 검증이 아니라 사례·인용을 찾는 통화입니다.","★ 단, 칼럼 인용용 통화는 한 문장이 그대로 활자화됩니다. 준비된 확정 워딩만 말하고, 즉흥 표현·리스크 발언(돈봉투 실명 연결, 아파트 소문, 유시민, 특정인 공격)은 금지. 길게 설명하지 말고 짧은 문장으로 끊어 말하면 그 문장이 인용됩니다."],"quotes":[],"notes":["⚠ 논설위원 통화는 오프더레코드가 아님 — 전화 받는 순간부터 전부 온더레코드로 간주할 것"]},{"no":2002,"media":"경향신문(통화)","q":"예상 ① 민주당이 청년 이슈를 다루는 방식, 당사자로서 어떻게 봤나?","tags":["병풍","득표도구","청년팔이","전준위"],"script":["★ 민주당은 청년을 동료 주주가 아니라 득표 도구로 봅니다. 영입할 때는 미래라고 부르고, 규칙을 정하는 자리에서는 지웁니다.","★ 이번 전당대회가 그 증거입니다. 전당대회준비위원회가 전원일치로 결의한 선출직 청년최고위원제를 최고위원회가 부결시켰습니다. 당내에서조차 선호투표제와 거래됐다는 말이 나왔습니다. 청년의 자리가 계파 간 협상 카드로 쓰인 것입니다.","말로는 청년을 외치면서 기탁금이라는 돈의 장벽은 그대로 세워 뒀습니다. 앞과 뒤가 다르니 청년들이 등을 돌리는 것입니다."],"quotes":[["인용 후보","사진 찍을 때는 청년이 맨 앞줄인데, 규칙을 정하는 방에는 청년의 의자가 없습니다."]],"notes":[]},{"no":2003,"media":"경향신문(통화)","q":"예상 ② 예비경선에서 직접 겪은 것 — 구조가 어떻게 작동했나?","tags":["기탁금","고무줄규칙","나흘","깜깜이"],"script":["후보 등록을 마치고 나서야 경선 규칙을 받았습니다. 후보 등록과 후원회 준비에만 사흘이 걸렸고, 닷새 중 사실상 하루를 가지고 선거운동을 했습니다. 후보 간 토론회는 한 번도 없었습니다.","★ 저도 기탁금 구하느라 정말 힘들었습니다. 돈과 조직이 없으면 출발선에 설 수도 없는 구조입니다. 그리고 경선이 끝나도 선거인 수·투표율·득표수를 알 수 없습니다. 결과를 공개하지 않는 1인 1표는 가짜입니다.","지난 강진군수 경선에서 겪은 일이 중앙 무대에서 그대로 반복됐습니다. 지역이나 중앙이나 신인에게는 똑같았습니다."],"quotes":[["인용 후보","돈과 조직이 없으면 출발선에 설 수도 없습니다. 결과를 공개하지 않는 1인 1표는 가짜입니다."]],"notes":[]},{"no":2004,"media":"경향신문(통화)","q":"예상 ③ 김민아 칼럼 논지 연결 — 계파싸움과 정책 공백, 동의하나?","tags":["계파싸움","정책공백","공약집","무가치함"],"script":["★ 위원님 칼럼 제목 그대로였습니다. 저는 이번 전당대회에서 공약집을 발표한 사람이 저밖에 없다는 사실이 그 증거라고 생각합니다. 청년 고용이 1년에 25만 명 넘게 줄었는데, 전당대회의 언어는 어제도 오늘도 계파였습니다.","청년들은 민주당이 미워서 떠난 것이 아니라, 기대할 이유를 찾지 못해서 떠난 것입니다. '너의 내일이 오늘보다 낫다'는 증거를 보여주지 못했습니다.","그래서 제 요구가 본선을 계파 갈등이 아니라 청년·서민·지역을 살리는 정책 경쟁의 장으로 만들자는 것입니다."],"quotes":[["인용 후보","이번 전당대회에서 공약집을 낸 후보는 저 하나였습니다. 그것이 민주당의 현주소입니다."]],"notes":["※ '청년 고용 -25만 5천 명'은 김민아 칼럼의 수치 — 통화에서는 '1년에 25만 명 넘게'로 칼럼 인용임을 자연스럽게 표시"]},{"no":2005,"media":"경향신문(통화)","q":"예상 ④ 2030 전원 탈락이라는 결과 — 무엇을 보여주나?","tags":["세대구조","전원탈락","김대중","사이렌"],"script":["★ 민주당에 다음 세대로 가는 사다리가 없다는 것입니다. 개인의 승패가 아니라 구조의 결과입니다.","김대중 대통령께서는 32세 김민석을 발탁하셨습니다. 그때 영입되신 분들이 지금 30년째 정치를 하고 계십니다. 본인들은 됐는데, 왜 지금의 청년들은 못할 것이라고 생각하십니까.","★ 본인들이 청년일 때 기득권을 향해 외쳤던 소리를 지금의 청년이 똑같이 하는데 기분이 나쁘시다면 — 그것은 이미 기득권이 되셨다는 뜻입니다."],"quotes":[["인용 후보","30년 전의 젊은 피가 지금의 기득권이 됐습니다."]],"notes":[]},{"no":2006,"media":"경향신문(통화)","q":"예상 ⑤ 그래서 무엇을 바꿔야 하나? (해법 — 시혜가 아니라 시스템)","tags":["시스템","홍대선언","공영제","당헌"],"script":["★ 시혜가 아니라 시스템입니다. 지명직 한 자리는 기득권이 언제든 회수할 수 있지만, 당헌에 새긴 권리는 회수되지 않습니다.","경선 규칙 6개월 전 확정, '달리 정할 수 있다' 단서조항 전부 삭제, 기탁금 폐지와 당직선거 공영제, 경선 결과 100% 공개, 그리고 청년이 당 예산의 일부를 직접 편성·집행·평가하는 결정권 — 누가 당대표가 되더라도 바뀌지 않는 시스템을 만드는 것입니다.","기탁금 인하가 좋은 예입니다. 대통령께서 공감해 주셔서 당이 움직였지만, 등록은 이미 끝난 뒤였고 예비경선에는 적용되지 않았습니다. 개인의 선의는 시스템을 이기지 못합니다."],"quotes":[["인용 후보","시혜는 회수되지만, 당헌에 새긴 권리는 회수되지 않습니다."]],"notes":[]},{"no":2007,"media":"경향신문(통화)","q":"예상 ⑥ 앞으로 어떻게 할 건가?","tags":["앞으로의행보","청년결집","디지털플랫폼","오뚝이"],"script":["★ 계속 정당 혁신과 세대교체를 외치겠습니다. 뜻을 같이하는 청년들을 모으는 활동도 시작할 겁니다.","홍대선언은 예비경선 결과와 상관없이 드린 약속입니다. 젊은 세대가 참여하는 민주당의 디지털 플랫폼을 만드는 운동을 시작합니다.","★ 결과는 졌지만 도전은 지지 않았습니다. 계란은 깨졌지만 바위에 낸 금은 남아 있고, 그 금은 점점 넓어질 것입니다."],"quotes":[["인용 후보","결과는 졌지만, 도전은 지지 않았습니다."]],"notes":[]},{"no":2009,"media":"경향신문(통화)","q":"예상 ⑦ 청년정책은 어떻게 풀어나갈 것인가 — (시각이 두 갈래: 제도적 참여 확대 vs 정책 문제 해결)","tags":["청년정책","두갈래","결정권","청년취업보장제","디지털플랫폼"],"script":["★ 두 갈래를 나누는 것 자체가 기성 정치의 프레임입니다. 참여와 정책은 선택지가 아니라 순서입니다. 청년 정책이 안 나오는 것은 아이디어가 없어서가 아니라, 결정하는 방에 청년이 없어서입니다. 그래서 저는 세 단계로 풀겠습니다.","★ 첫째, 엔진부터 답니다 — 회수할 수 없는 결정권입니다. 청년위원회를 청년정책의 최고 의결기구로 격상하고, 당 예산의 일부를 청년이 직접 편성·집행·평가하게 합니다. 지명직 몇 자리는 시혜라서 언제든 회수되지만, 당헌에 새긴 결정권은 회수되지 않습니다. 자기 문제의 예산을 자기 손으로 짜 본 세대가 주거·일자리 정책을 가장 절실하게, 가장 정확하게 만듭니다.","★ 둘째, 내용은 삶의 문제부터입니다 — 일자리, 주거, 부채. 일자리는 청년취업보장제입니다. 배우고, 취업하고, 정착하는 사다리를 지역 안에 만드는 것입니다. 호남의 AI·반도체 클러스터가 그 무대입니다. 수조 원대 인센티브로 토목 잔치를 벌일 것이 아니라 인재 육성에, 청년이 지역에서 배우고 정착하는 데 써야 합니다. 청년들이 공무원 시험이 아니라 AI와 반도체에서 꿈을 키울 수 있어야 합니다.","셋째, 방법은 디지털입니다. 젊은 세대가 참여하는 민주당의 디지털 플랫폼을 만들어, 청년이 직접 의제를 올리고 토론하고 표결하게 하는 것입니다. 로그인만 하는 정당이 아니라 시민의 삶과 링크된 정당 — 청년 정책의 공급자를 기성 정치인에서 청년 당사자로 바꾸는 일입니다.","강진에서 봤습니다. 군민들이 예산 내역을 보기 시작하니 낭비예산 108억이 깎였습니다. 보는 사람이 생기면 돈의 방향이 바뀌고, 결정하는 사람이 바뀌면 정책의 방향이 바뀝니다."],"quotes":[["인용 후보","참여와 정책은 선택지가 아니라 순서입니다. 결정하는 방에 청년이 없으니, 청년의 정책이 없는 것입니다."],["인용 후보②","청년 정책의 공급자를 기성 정치인에서 청년 당사자로 바꾸는 것 — 그것이 제 청년정책입니다."]],"notes":[]},{"no":2008,"media":"경향신문(통화)","q":"🚫 통화 중 금지·주의 리스트 (칼럼 인용 = 활자화 전제)","tags":["주의사항","금지멘트","온더레코드"],"script":["★ 금지: 돈봉투를 특정인과 연결하는 발언(재판 중 사안), 전남도당 '아파트 한 채' 소문 인용, 유시민 등 제3자 발언 논평, 김민석·정청래·송영길 개인 평가·지지 표명.","★ 주의: 대통령 관련은 반드시 '감사 먼저, 화살은 구조로' 순서 유지. 수치는 확정된 것만(107명·1,909만 원·기탁금 1억→8천). 확인 안 된 수치를 물으면 '정확한 수치는 확인해 드리겠다'로.","10분 통화 운영: 질문당 30초~1분, 준비된 한 문장으로 시작하고 부연은 짧게. 마지막에 '칼럼에 실리는 인용은 발언 취지 그대로 부탁드린다'고 정중히 요청."],"quotes":[],"notes":["⚠ 지지 후보 질문이 오면: '방향에 동의하는 당대표를 지지하겠다' 프레임으로만"]},{"no":1901,"media":"JTBC","q":"Q1. 예비경선을 직접 치르면서, 청년 후보가 중진 후보와 출발선부터 달랐다고 느낀 순간은? 실제 겪은 사례는?","tags":["출발선","고무줄규칙","기탁금","3인캠프","강진"],"script":["저는 후보 등록을 마치고 나서야 경선 규칙을 받았습니다. 게임이 시작된 뒤에 규칙을 주는 정당 — 중진에게는 이미 몸에 익은 규칙이지만, 신인에게는 눈을 가리고 뛰라는 것과 같습니다. 그 순간 출발선이 다르다는 것을 몸으로 느꼈습니다.","★ 그리고 기탁금입니다. 저도 기탁금 구하느라 정말 힘들었습니다. 돈과 조직이 없으면 출발선에 설 수도 없는 구조입니다. 중진들에게는 절차인 것이 청년에게는 생존의 문제였습니다.","저희 캠프는 세 명이 전부였습니다. 사무실도 없이 카페와 식당을 전전하며 노트북 하나 들고 회의했습니다. 조직과 보좌진을 갖춘 캠프와 같은 링에 오른 것 자체가 기적에 가까웠습니다.","가장 뼈아팠던 것은, 지난 강진군수 경선에서 겪은 일이 중앙 무대에서 그대로 반복되고 있다는 사실이었습니다. 규칙은 늦게, 기회는 적게, 결과는 깜깜이 — 지역이나 중앙이나 신인에게는 똑같았습니다."],"quotes":[["김보미","돈과 조직이 없으면 출발선에 설 수도 없는 구조 — 이것이 바뀌지 않으면 세대교체는 없습니다."]],"notes":[]},{"no":1902,"media":"JTBC","q":"Q2. 선거운동 기간이 사실상 나흘, 하루는 후원회 구성에 썼다. 하지 못한 선거운동은 무엇이고 당락에 어떤 영향을 줬나?","tags":["나흘","후원회","SNS","토론회부재","107명"],"script":["후보 등록과 후원회 준비에만 사흘이 걸립니다. 닷새 중 사실상 하루를 가지고 무슨 선거운동을 하겠습니까. 숨만 쉬어도 돈이 드는 것이 선거인데, 돈이 없으니 문자 한 통 보내기도 어려웠습니다. 권리당원들을 직접 찾아뵙는 일도, 전화 홍보도 못 했습니다. 제가 쓸 수 있었던 것은 오직 SNS뿐이었습니다.","★ 구조도 말씀드리지 않을 수 없습니다. 후보 간 토론회는 한 번도 없었고, 청중 없이 동영상 한 번 촬영한 것이 공식 기회의 전부였습니다. 조직과 인지도가 없는 신인이 실력을 보여줄 검증의 링 자체가 없었던 것입니다.","★ 물론 저의 부족함이 첫 번째입니다. 다만 그 나흘 동안 107명의 국민께서 1,909만 원을 후원해 주셨습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들이 계시다는 것도 확인했습니다. 결과는 졌지만, 도전은 지지 않았습니다."],"quotes":[["김보미","닷새 중 사실상 하루를 가지고 무슨 선거운동을 하겠습니까."]],"notes":[]},{"no":1903,"media":"JTBC","q":"Q3. 기탁금을 '하루 333만원짜리 진입 장벽'이라고 표현했다. 돈과 조직이 없는 청년에게 전당대회 구조가 구체적으로 어떻게 작동했나?","tags":["기탁금","진입장벽","원서장사","공영제","기탁금폐지"],"script":["실제 선거운동이 가능했던 시간으로 나눠 보면 그런 계산이 나옵니다. 장벽이 맞습니다. 제가 산 증인입니다.","★ 당대표 기탁금이 1억에서 8천만 원으로 인하됐지만, 인하는 답이 아닙니다. 8천만 원도 청년에게는 넘을 수 없는 벽이고, 이재명 대표 시절과 비교하면 여전히 두 배입니다. 그리고 등록은 이미 끝난 뒤였고, 예비경선에는 적용되지 않았습니다. 본선에 가지 못하면 아무 의미가 없는 인하입니다.","★ 대학이 원서 장사를 하듯, 당에 돈이 남아돌면서도 기탁금을 받습니다. 기탁금은 결국 청년의 진입을 막는 기득권 유지 수단입니다. 답은 감액이 아니라 폐지, 그리고 당직선거 공영제입니다. 경쟁의 자원은 돈과 조직이 아니라 실력과 정책이어야 합니다."],"quotes":[["김보미","기탁금은 결국 기득권 유지 수단입니다. 답은 폐지와 당직선거 공영제입니다."]],"notes":["※ '하루 333만원' 수치는 기자 제시 표현 — 재계산·재단정하지 않고 취지로 받는 구성"]},{"no":1904,"media":"JTBC","q":"Q4. '청년을 주주가 아니라 병풍으로 써왔다'고 했다. 청년이 의사결정에서 배제된다고 느낀 구체적 장면이나 제도는?","tags":["병풍","동료주주","청년최고위원제","전준위","예산과결정권"],"script":["★ 이번 전당대회에 그 장면이 있었습니다. 전당대회준비위원회가 전원일치로 결의한 선출직 청년최고위원제를 최고위원회가 부결시켰습니다. 당내에서조차 선호투표제와 거래됐다는 말이 나왔습니다. 청년의 자리가 계파 간 협상 카드로 쓰인 것입니다.","'청년 표심에 도움이 되느냐'는 반론 자체가 문제의 본질입니다. 청년을 동료 주주가 아니라 득표 도구로 보는 시각이기 때문입니다. 영입할 때는 미래라고 부르고, 규칙을 정하는 자리에서는 지워집니다.","★ 그래서 제 공약이 자리가 아니라 예산과 결정권이었습니다. 청년위원회를 청년정책의 최고 의결기구로 격상하고, 당 예산의 일부를 청년이 직접 편성·집행·평가하게 하는 것 — 청년을 들러리가 아니라 주주로 만드는 것입니다. 시혜는 언제든 회수되지만, 당헌에 새긴 권리는 회수되지 않습니다."],"quotes":[["김보미","자리가 아니라 예산과 결정권 — 청년을 들러리가 아니라 주주로 만들어야 합니다."]],"notes":[]},{"no":1905,"media":"JTBC","q":"Q5. 2030 후보 전원 탈락, 본경선 진출자 평균 연령 60.9세. 이번 결과가 민주당의 세대구조를 어떻게 보여준다고 보나?","tags":["세대구조","전원탈락","김대중","30년째","사이렌"],"script":["숫자가 말해 주는 그대로입니다. 민주당에 다음 세대로 가는 사다리가 없다는 것입니다. 개인의 승패가 아니라 구조의 결과입니다.","★ 김대중 대통령께서는 32세 김민석, 청년 송영길을 발탁하셨습니다. 능력은 나이를 가리지 않는다는 것을 그분이 증명하셨습니다. 그런데 그때 영입되신 분들은 지금까지 30년째 정치를 하고 계십니다. 본인들은 됐는데, 왜 지금의 청년들은 못할 것이라고 생각하십니까.","핀란드 산나 마린은 34세에 총리가 됐고, 오스트리아 쿠르츠는 31세에 총리, 프랑스 마크롱은 39세에 대통령이 됐습니다. 청년이라서 못하는 것이 아니라, 기회를 주지 않아서 못 해 본 것뿐입니다.","★ 민주당이 지금처럼 가면 2030이 다 떠나고 총선도 대선도 어렵습니다. 누군가는 민주당의 위기에 사이렌을 울려야 했습니다. 이번 결과가 그 사이렌 소리로 기록되기를 바랍니다."],"quotes":[["김보미","본인들은 됐는데, 왜 지금의 청년들은 못할 것이라고 생각하십니까."]],"notes":["※ '평균 60.9세'는 기자 제시 수치 — 답변에서 수치 재단정 없이 '숫자가 말해 주는 그대로'로 받는 구성"]},{"no":1906,"media":"JTBC","q":"Q6. 이재명 대통령이 기탁금 문제를 지적하고 계정을 팔로우했지만 청년 후보는 전원 탈락했다. 대통령 메시지가 제도와 결과로 이어지지 못한 이유는?","tags":["이재명","팔로우","기탁금인하","시스템","홍대선언"],"script":["청년 평당원 한 사람이 문제를 제기하니 대통령께서도 공감해 주셨고, 당이 실제로 움직였습니다. 목소리를 내면 바뀐다는 것 — 그것은 분명한 성과이고, 지금도 감사하게 생각합니다.","★ 하지만 인하는 등록이 이미 끝난 뒤였고, 예비경선에는 적용되지 않았습니다. 메시지는 위에서 내려왔지만, 규칙은 아래에서 그대로였던 것입니다. 당헌·당규와 경선 규칙을 쥐고 있는 구조가 바뀌지 않으면, 가장 높은 곳의 공감도 실무 규정 한 줄 앞에서 멈춥니다.","★ 그래서 제 결론이 '누가 당대표가 되더라도 바뀌지 않는 시스템'입니다. 경선 규칙 6개월 전 확정, '달리 정할 수 있다' 단서조항 전부 삭제, 기탁금 폐지와 당직선거 공영제, 경선 결과 100% 공개 — 홍대에서 선언한 '민주당 갈아엎기 대전환 선언'이 바로 그 답입니다. 시혜는 회수되지만 시스템은 세대를 넘어 작동합니다."],"quotes":[["김보미","메시지는 위에서 내려왔지만, 규칙은 아래에서 그대로였습니다."]],"notes":["⚠ 대통령 비판으로 들리지 않게 — 감사 먼저, 화살은 '구조'로. 제3자(유시민 등) 발언 언급 금지"]},{"no":1907,"media":"JTBC","q":"Q7. 청년 세대가 민주당과 거리를 두는 근본 원인은? 주거·일자리 정책 실패와 당내 문화·공천 구조 중 무엇이 더 큰가?","tags":["청년이탈","회귀물","공천개혁","원인과결과"],"script":["★ 공천과 당내 구조가 원인이고, 정책 실패는 그 결과입니다. 의사결정 자리에 청년이 없으니 청년의 삶 — 주거, 일자리, 부채 — 이 우선순위에서 밀리는 것입니다. 공천이 바뀌면 혁신은 따라옵니다.","지금 청년 세대에서 회귀물 콘텐츠가 유행합니다. 다시 태어나야만 인생을 바꿀 수 있다고 느끼는 세대라는 뜻입니다. 그 세대에게 민주당은 '너의 내일이 오늘보다 낫다'는 증거를 보여주지 못했습니다.","청년들은 민주당이 미워서 떠난 것이 아닙니다. 기대할 이유를 찾지 못해서 떠난 것입니다. 청년이 링에 오르고 당선까지 될 수 있는 공천 구조를 만드는 것 — 그것이 청년 정책의 시작입니다."],"quotes":[["김보미","공천이 바뀌면 혁신은 따라옵니다. 그것이 청년 정책의 시작입니다."]],"notes":[]},{"no":1908,"media":"JTBC","q":"Q8. 홍보·소통의 문제가 아니라면, 청년들이 민주당을 보며 가장 위선적이라고 느끼는 지점은 무엇인가?","tags":["위선","말과행동","기탁금","가짜1인1표","기득권"],"script":["★ 말과 행동의 거리입니다. 말로는 청년을 외치면서 기탁금이라는 돈의 장벽은 그대로 세워 두지 않았습니까. 앞과 뒤가 다르니 청년들이 등을 돌리는 것입니다.","경선이 끝나도 선거인 수·투표율·득표수를 알 수 없습니다. 결과를 공개하지 않는 1인 1표는 가짜입니다. 당원이 주인이라고 말하면서 주인에게 결과조차 보여주지 않는 정당 — SNS 세대는 그 간격을 실시간으로 확인합니다.","★ 그리고 본인들이 청년일 때 기득권을 향해 외쳤던 소리를 지금의 청년이 똑같이 하는데 기분이 나쁘시다면 — 그것은 이미 기득권이 되셨다는 뜻입니다. 청년들이 느끼는 위선의 정점이 바로 그 지점입니다."],"quotes":[["김보미","앞과 뒤가 다르니 청년들이 등을 돌리는 것입니다."]],"notes":[]},{"no":1909,"media":"JTBC","q":"Q9. 컷오프로 끝났지만 계속 정치하겠다고 했다. 앞으로 어떤 방식으로 당내 기득권과 세대교체 문제를 제기할 계획인가?","tags":["앞으로의행보","홍대선언","디지털플랫폼","재정주권","오뚝이"],"script":["★ 계속 정당 혁신과 세대교체를 외치겠습니다. 그리고 뜻을 같이하는 청년들을 모으는 활동도 시작할 겁니다. 제 별명이 똑순이, 오뚝이입니다. 넘어질 때마다 다시 일어났습니다. 이번에도 마찬가지입니다.","★ 홍대선언은 예비경선 결과와 상관없이 드린 약속입니다. 젊은 세대가 참여하는 민주당의 디지털 플랫폼을 만드는 운동을 시작하고, 전당대회 본선이 계파 갈등이 아니라 청년·서민·지역을 살리는 정책의 장이 되도록 힘을 보태겠습니다. 재정주권 운동도 계속합니다 — 김보미365처럼, 정당의 돈까지 1원 단위로 투명해지는 그날까지.","★ 이번 경선에서 계란은 깨졌습니다. 하지만 바위에 낸 금은 남아 있고, 그 금은 점점 넓어질 것입니다. 저는 죽어도 다음 세대는 살아야 하지 않겠습니까. 김보미의 도전은 이제 시작입니다. 지켜봐 주십시오."],"quotes":[["김보미","결과는 졌지만, 도전은 지지 않았습니다. 김보미의 도전은 이제 시작입니다."]],"notes":[]},{"no":1701,"media":"세계일보(서면)","q":"1. 예비경선 결과에 관해 한 말씀 부탁드립니다.","tags":["소회","탈락","바위에금"],"script":["결과는 겸허히 받아들입니다. 후회는 없습니다. 조직도 계파도 없는 세 명짜리 캠프로 시작해, 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들이 계시다는 것을 가슴 깊숙한 울림으로 확인했습니다. 그 한 표 한 표가 바위에 금을 냈습니다.","계란은 깨졌지만 바위에 낸 금은 남아 있습니다. 이번 전당대회에서 세대교체와 대전환이 의제가 됐고, 결과는 졌지만 도전은 지지 않았습니다. 제가 홍대에서 선언한 '민주당 갈아엎기 대전환 선언'은 경선 결과와 상관없이 국민께 드린 약속입니다. 그 약속은 지금부터 시작입니다."]},{"no":1702,"media":"세계일보(서면)","q":"2. 당대표 출마를 결심할 때 민주당에서 가장 바꾸고 싶다, 부족하다고 느꼈던 부분은 무엇이었습니까.","tags":["출마이유","5무정당","시스템정당"],"script":["공정입니다. 민주당은 공정·민주주의·청년·미래·세대교체가 모두 사라진 '5무 정당'이 됐습니다. 규칙은 '단, 달리 정할 수 있다'는 단서조항으로 사람에 따라 달라지고, 경선 결과는 공개되지 않으며, 당원명부는 검증되지 않습니다. 결과를 공개하지 않는 1인 1표는 가짜 당원주권입니다.","그 뒤에는 당헌·당규를 주무르는 당직자 카르텔과 성역화된 깜깜이 예산이 있습니다. 누군가는 민주당의 위기에 사이렌을 울려야 했습니다. '686, 이제 떠날 때가 됐다'는 말을 누가 하겠습니까. 권력에 줄 선 적 없고 눈치 볼 사람도 없는 청년 평당원이 그 일을 해야 한다고 생각했습니다. 그래서 계파가 아니라 시스템으로 움직이는 정당, 데이터로 듣고 공론으로 결정하는 디지털 정당으로의 전면 대전환을 요구하며 나갔습니다."]},{"no":1703,"media":"세계일보(서면)","q":"3. 이번 예비경선 결과의 원인은 무엇이 가장 컸다고 생각하십니까.","tags":["패인","경선구조","5일선거운동"],"script":["저의 부족함이 첫 번째입니다. 다만 현실도 말씀드리겠습니다. 후보 등록과 후원회 준비에만 사흘이 걸립니다. 닷새 중 사실상 하루를 가지고 무슨 선거운동을 하겠습니까. 돈이 없으니 문자 한 통 보내기도 어렵습니다. 기탁금 외에도 숨만 쉬어도 돈이 드는데 기탁금마저 높습니다. 선거운동의 기회 자체가 없으니 얼마나 애태우고 답답했겠습니까. 할 수 있는 것은 오직 SNS뿐이었습니다. 그리고 가장 뼈아팠던 것은, 지난 강진군수 경선에서 겪은 불공정이 중앙 무대에서 그대로 반복되고 있었다는 사실입니다.","구조도 말씀드리지 않을 수 없습니다. 후보 간 토론회는 한 번도 없었으며, 청중 없이 동영상 한 번 촬영한 것이 공식 기회의 전부였습니다. 조직과 인지도가 없는 신인이 실력을 보여줄 링 자체가 없는 구조에서, 결과는 사실상 출발선에서 정해져 있었습니다. 선호투표제를 도입한 이상 컷오프는 필요하지도 않았습니다. 청년의 도전을 닷새 만에 끝내 버리는 '청년 강퇴 예비경선'은 다시 없어야 합니다."]},{"no":1704,"media":"세계일보(서면)","q":"4. 청년최고위원 후보 두 분이 모두 예비경선에서 탈락했습니다. 이번 결과를 어떻게 보시고, 원인은 어디서 찾으십니까.","tags":["청년최고위원탈락","구조의실패","조직동원"],"script":["개인의 실패가 아니라 구조의 실패입니다. 조직 동원과 계파 지지 중심의 경선에서 청년은 출발선 자체가 다릅니다. 돈, 조직, 계파 — 세 개의 벽을 다 넘어야 겨우 링에 오르는데, 링에 올라도 토론 한 번 없이 잘립니다.","청년 후보 전원 탈락은 '지금의 경선 구조로는 어떤 청년도 불가능하다'는 증거입니다. 구조를 바꾸지 않고 청년에게 도전하라고 말하는 것은 사다리 없이 옥상으로 올라오라는 말과 같습니다."]},{"no":1705,"media":"세계일보(서면)","q":"5. 선출직 청년최고위원제 도입이 무산됐습니다. '청년 표심에 도움이 안 된다'는 회의론과 '시급히 도입해야 한다'는 의견이 엇갈리는데, 이번 결정을 어떻게 평가하십니까.","tags":["청년최고위원","부결","계파거래"],"script":["'표심에 도움이 되느냐'는 질문 자체가 문제의 본질입니다. 청년을 동료 주주가 아니라 득표 도구로 보는 시각이기 때문입니다. 청년최고위원제는 표심 마케팅이 아니라 의사결정 구조에 다음 세대의 자리를 만드는 일입니다.","전당대회준비위원회가 전원일치로 결의한 안을 최고위원회가 부결시켰습니다. 당내에서조차 선호투표제와 거래됐다는 말이 나왔습니다. 청년의 자리가 계파 간 협상 카드로 쓰였다면, 그것이 바로 청년이 민주당을 떠나는 이유입니다. 국민의힘조차 유지하고 있는 제도를 민주당이 부결시킨 것 — 저는 이것이 이번 전당대회의 가장 부끄러운 장면 중 하나라고 생각합니다. 말로는 청년을 외치면서 기탁금은 올리지 않았습니까. 앞과 뒤가 다르니 청년들이 등을 돌리는 것입니다."]},{"no":1706,"media":"세계일보(서면)","q":"6. 전당대회 기탁금 문제는 어떻게 보십니까. 청년 정치인에게 진입 장벽이 된다고 보십니까.","tags":["기탁금","진입장벽","공영제"],"script":["장벽이 맞습니다. 제가 산 증인입니다. 저도 예비경선 기탁금을 구하느라 정말 힘들었습니다. 당대표 기탁금이 인하됐다지만 예비경선에는 적용되지 않으니, 본선에 가지 못하면 아무 의미가 없습니다. 본선에 올라가더라도 청년에게는 여전히 넘을 수 없는 벽이고, 이재명 대표 시절과 비교하면 두 배입니다. 그리고 인하 결정은 등록이 끝난 뒤에야 나왔습니다. 예비경선의 문턱은 여전히 높습니다.","대학이 원서 장사를 하듯, 당에 돈이 남아돌면서도 기탁금을 받습니다. 기탁금은 결국 청년의 진입을 막는 기득권 유지 수단입니다. 답은 감액이 아니라 폐지, 그리고 당직선거 공영제입니다. 돈과 조직이 아니라 실력과 정책으로 겨루게 해야 세대교체가 가능합니다."]},{"no":1707,"media":"세계일보(서면)","q":"7. 민주당은 2016년 선출직 청년최고위원이 2년 만에 폐지됐고, 박성민 전 최고위원 '벼락 발탁' 공정성 논란, 박지현 전 비대위원장의 당대표 출마 좌절도 있었습니다. 국민의힘은 2016년 도입한 제도를 유지하고 있는데, 민주당에서 청년 정치는 왜 제도적 연속성을 잃었다고 보십니까.","tags":["제도연속성","벼락발탁","박지현","당헌명문화"],"script":["민주당의 청년 제도가 '청년의 권리'가 아니라 '지도부의 필요'에 따라 만들어지고 버려져 왔기 때문입니다. 선거가 급하면 벼락 발탁으로 데려오고, 위기가 지나면 제도를 폐지하고, 청년이 진짜 도전자로 커지면 문을 닫습니다. 2022년 청년 박지현은 '입당 6개월 미만'을 이유로 후보 자격조차 얻지 못했지만, 이번에는 같은 6개월 규정에 걸린 686 선배가 긴급 최고위 논의와 다음 날 비공개 최고위 의결로 구제됐습니다. 이 이중잣대가 민주당 청년 정치의 역사입니다.","제도가 당헌에 뿌리내리지 못하고 지도부 재량에 좌우되는 한 연속성은 없습니다. 해법은 분명합니다. 선출직 청년최고위원을 당헌에 명문화해 어떤 지도부도 없앨 수 없게 만들고, 청년위원회를 청년정책 최고 의결기구로 격상해 결정권 자체를 제도화하는 것입니다. 시혜는 회수되지만, 당헌에 새긴 권리는 회수되지 않습니다."]},{"no":1708,"media":"세계일보(서면)","q":"8. 30대 청년 정치인으로서 민주당에서, 나아가 우리나라에서 활동하고 성장하기에 가장 어려운 점은 무엇입니까.","tags":["청년정치현실","3대장벽","병풍","진영논리"],"script":["핀란드 산나 마린은 34세에 총리가 됐고, 오스트리아 쿠르츠는 31세에 총리, 프랑스 마크롱은 39세에 대통령이 됐습니다. 그레타 툰베리는 10대의 목소리로 전 세계를 움직였습니다. 그런데 한국에서 30대 정치인은 여전히 '왜 나왔느냐'부터 검증받습니다. 돈이 없으면 출마하기 어렵고, 조직이 없으면 경쟁하기 어렵고, 계파가 없으면 알려질 기회조차 없습니다. 저는 이번 경선을 세 명짜리 캠프로, 사무실도 없이 카페와 식당을 전전하며 치렀습니다.","우리나라도 그랬던 때가 있습니다. 김대중 대통령께서는 32세 청년 김민석을 비롯해 386 세대를 과감히 영입하셨고, 그분들은 지금까지 30년째 정치를 하고 있습니다. 본인들은 됐는데, 왜 지금의 청년들은 못할 것이라고 생각하십니까. 그때는 SNS가 없어서 드러나지 않았을 뿐, 말실수도 사건 사고도 얼마나 많았습니까. 그럼에도 지금까지 정치를 하고 계시면서 청년은 못 미더워 자리를 못 주겠다는 것인지, 내 밥그릇을 챙기겠다는 것인지 안타깝습니다. 본인들이 청년일 때 기득권을 향해 외쳤던 소리를 지금의 청년이 똑같이 하는데 기분이 나쁘시다면 — 그것은 이미 기득권이 되셨다는 뜻입니다.","그보다 힘든 것은 시선입니다. 기자회견 때는 병풍처럼 세워 놓고 사진 찍고 돌려보내는 들러리 취급을 받고, 목소리를 내면 양쪽 진영에서 악플과 문자 폭격이 쏟아집니다. 조곤조곤 부탁드리고 읍소하면 들어나 줍니까. 아무도 들어주지 않았습니다. 실력을 보여줄 링은 주지 않으면서 실력이 없다고 말하는 것 — 그것이 한국 청년 정치의 현실입니다."]},{"no":1709,"media":"세계일보(서면)","q":"9. 6·3 지방선거에서 민주당이 2030의 선택을 받지 못한 원인은 무엇이라고 보십니까. 민주당은 원인과 대안을 올바르게 찾아가고 있다고 보십니까.","tags":["지방선거","2030이탈","책임정치","무당층"],"script":["원인은 공정의 상실입니다. 청년이 민주당을 떠난 것이 아니라 민주당이 먼저 청년을 떠났습니다. 청년에게는 원칙을 들이대고 기득권에게는 특혜를 주는 이중잣대, 진영에 따라 환호와 비난이 뒤바뀌는 정치에 2030은 완전히 질렸습니다. 지금 18~29세의 절반 가까이가 무당층입니다. 분노보다 무서운 것이 무관심입니다.","올바르게 찾아가고 있느냐고 물으신다면, 아직 아닙니다. 지방선거 패배에 대한 반성도 평가도 없이 넘어갔고, 이번 전당대회조차 정책 경쟁이 아니라 적통 논쟁과 계파 공방으로 흘렀습니다. 민주 정치는 책임 정치입니다. 원인을 직시하지 않는 정당에 대안이 나올 수 없습니다."]},{"no":1710,"media":"세계일보(서면)","q":"10. 지명직이나 전당대회용 제도를 넘어, 청년 의제와 청년 정치인의 협상력을 높이기 위해 한국 정당정치에 가장 필요한 '시스템'은 무엇이라고 생각하십니까.","tags":["시스템","청년결정권","공천개혁","디지털정당"],"script":["저는 예비경선 결과가 나오기 전날, 홍대에서 '민주당 갈아엎기 대전환 선언'을 했습니다. 핵심은 하나입니다 — 누가 당대표가 되더라도 바뀌지 않는 시스템을 만드는 것입니다. 그중 다섯 가지를 꼽겠습니다. 첫째, 경선 규칙 6개월 전 확정과 경선 결과 100% 공개 — 예측 가능하고 투명한 링이 있어야 신인이 도전합니다. 둘째, 기탁금 폐지와 당직선거 공영제 — 돈의 장벽을 없애야 합니다. 셋째, 선출직 청년최고위원의 당헌 명문화 — 지도부가 바뀌어도 회수할 수 없는 권리로 만들어야 합니다. 넷째, 청년위원회의 최고 의결기구화와 당 예산 일부의 청년 편성권 — 자리가 아니라 예산과 결정권이 협상력을 만듭니다. 다섯째, 충분한 토론회와 연설회로 검증하는 공천, 그리고 공천관리위원회에서 국회의원 측근 배제 — 실력을 보여줄 무대가 곧 청년의 사다리입니다.","한마디로, 시혜가 아니라 시스템입니다. 지명직 한 자리는 기득권이 언제든 회수할 수 있지만, 시스템은 세대를 넘어 작동합니다. 저는 이 시스템을 만드는 일에 정치 인생을 걸겠습니다.","홍대에서 저는 약속드렸습니다. 규칙을 만든 사람들의 정당을 끝내고 침묵하는 다수의 숨결을 듣는 정당을, 과거에 복수하며 싸우는 정당을 끝내고 미래의 언어로 일하는 정당을, 로그인 정당을 끝내고 시민의 삶과 링크된 디지털 정당을 시작하겠다고. 이 약속은 예비경선 결과와 상관없이 유효합니다. 민주당이 달라질 때까지, 민주당이 정상적인 정당으로 우뚝 설 때까지 이 약속을 지키겠습니다."]},{"no":1801,"media":"프레시안(서면)","q":"1. 예비경선 결과를 어떻게 받아들이고 계신가요.","tags":["소회","탈락","가치투표"],"script":["겸허히 받아들입니다. 후회는 없습니다. 조직도 계파도 돈도 없는 세 명짜리 캠프로 시작한 도전이었지만, 저는 이번 경선에서 확인했습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들이 계시다는 것을, 젊은 날의 자신을 떠올리며 청년의 도전에 손을 내밀어 주시는 분들이 계시다는 것을. 그 한 표 한 표가 바위에 금을 냈습니다.","결과는 졌지만, 도전은 지지 않았습니다. 계란은 깨졌지만 바위에 낸 금은 남아 있습니다. 세대교체와 대전환이 이번 전당대회의 의제가 됐고, 어느 후보도 이제 청년과 혁신을 말하지 않고는 선거를 치를 수 없게 됐습니다. 이번 도전은 그 자체로 성공입니다."]},{"no":1802,"media":"프레시안(서면)","q":"2. 이번 당대표 도전을 돌아봤을 때 가장 아쉬운 점과 의미 있게 남은 부분이 있을까요.","tags":["아쉬운점","의미","경선구조","선배전화"],"script":["가장 아쉬운 것은 실력을 보여줄 링이 없었다는 점입니다. 지난 강진군수 경선에서 겪은 불공정이 중앙 무대에서 그대로 반복되고 있었습니다. 선거운동 기간은 단 5일, 후보 간 토론회는 한 번도 없었고, 청중 없이 동영상 한 번 촬영한 것이 공식 기회의 전부였습니다. 저는 이번 전당대회에서 유일하게 공약집을 발표한 후보였지만, 그 공약을 놓고 토론할 무대 자체가 없었습니다. 청년의 도전을 닷새 만에 끝내 버리는 예비경선 구조는 반드시 바뀌어야 합니다.","가장 의미 있게 남은 것은 사람입니다. 실제로 짱돌을 들었던 민주화운동 세대 선배님이 전화를 주셔서 동의해 주시고 격려해 주신 순간, 그리고 결과 발표 전날 홍대에서 결과와 상관없는 약속 — 민주당 대전환 선언을 시민들 앞에서 드린 순간입니다. 침묵하는 다수가 계시다는 확신, 그것이 이번 도전이 남긴 가장 큰 자산입니다."]},{"no":1803,"media":"프레시안(서면)","q":"3. 이번에 제시한 공약을 이어갈 계획과 앞으로의 정치 행보는 어떻게 되실까요.","tags":["앞으로의행보","홍대선언","디지털플랫폼","재정주권"],"script":["제가 홍대에서 선언한 '민주당 갈아엎기 대전환 선언'은 예비경선 결과와 상관없이 국민께 드린 약속입니다. 경선 규칙 6개월 전 확정, 가짜·불법 당원 정리와 경선 결과 100% 공개, 기탁금 폐지와 당직선거 공영제, 청년에게 자리가 아니라 예산과 결정권, 그리고 정당 재정의 1원 단위 공개까지 — 이 12대 약속을 민주당이 받아들일 때까지 요구하겠습니다.","구체적으로는 젊은 세대가 참여하는 민주당의 디지털 플랫폼을 만드는 운동을 시작하고, 본선이 계파 갈등이 아니라 청년·서민·지역을 살리는 정책 경쟁의 장이 되도록 새로운 아젠다 제안에 힘을 보태겠습니다. 재정주권시민행동 공동대표로서 '김보미365'처럼 정당의 돈까지 투명해지는 운동도 계속합니다.","★ 한마디로, 계속 정당 혁신과 세대교체를 외치겠습니다. 그리고 뜻을 같이하는 청년들을 모으는 활동도 시작할 겁니다. 제 별명이 오뚝이입니다. 규칙을 만든 사람들의 정당을 끝내고 침묵하는 다수의 소리를 듣는 정당을 만드는 데 평생을 바치겠습니다. 호남에서, 현장에서 계속 정치하겠습니다. 김보미의 도전은 이제 시작입니다."]},{"no":1501,"media":"SBS확정대본","q":"🎬 오프닝 인사 — [첫인사 ④·최종] 감사 인사 + 계란과 바위 — 바위에 금을 내는 한 표 (7.23 확정, 방송·연설 공용)","tags":["확정대본"],"script":["국민 여러분, 당원 여러분. 서른여섯, 평당원 김보미입니다.","★ 먼저 감사 인사부터 드리겠습니다. 이번 예비경선 기간, 부족한 저를 응원해 주시고 귀한 한 표를 던져 주신 당원 동지 여러분, 그리고 묵묵히 지켜봐 주신 국민 여러분께 진심으로 감사드립니다. 조직도 계파도 없는 세 명짜리 캠프가 여기까지 온 것은 전부 여러분 덕분입니다.","★ 저는 이번 경선에서 확인했습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들이 계시다는 것을. 그 한 표 한 표가 지금 바위에 금을 내고 있습니다.","나이는 서른여섯이지만 입당 13년, 군의원 재선에 전국 최연소 기초의회 의장을 지냈습니다. 지방의회는 중앙의 축소판입니다. 예산 심의, 행정 감사, 조례 제정, 주민 대변 — 국회가 하는 일을 규모만 작게 다 합니다.","다들 제 도전을 계란으로 바위치기라고 합니다. 맞습니다. 저는 약한 계란이고, 40년 이 나라 정치를 독점한 686 기득권은 큰 바위입니다. 하지만 바위는 너무 오래 비를 맞아 허물어지기 직전이고, 계란은 생명을 품고 있습니다.","침묵하는 다수의 소리를 듣는 새로운 민주당을 만들러 나온 김보미입니다. 잘 부탁드립니다.","[김보미] 바위는 허물어지기 직전이고, 계란은 생명을 품고 있습니다. 그 한 표 한 표가 바위에 금을 내고 있습니다."]},{"no":1502,"media":"SBS확정대본","q":"1. 유일한 30대·원외·무계파 후보, 더 힘든 싸움이 될 텐데 당대표 도전을 마음먹은 계기는?","tags":["확정대본"],"script":["민주당이 죽기 직전이기 때문입니다. 공정도, 미래도, 청년도, 민주주의도 다 없습니다. 누군가는 이 말을 해야 하는데, 계파 있고 자리 있는 분들은 아무도 하지 않습니다. 그래서 잃을 것 없는 청년 평당원이 나선 겁니다.","힘든 싸움인 것 맞습니다. 조직도 계파도 돈도 없습니다. 그런데 김대중은 서슬 퍼런 군사독재 치하에서 도전했고, 노무현은 지지율 2%로 시작했습니다. 민주당의 역사가 원래 계란으로 바위치기의 역사입니다.","★ 민주당이 지금처럼 내로남불 정당, 불공정의 아이콘, 686 꼰대 정당으로 가면 2030은 다 떠나고 총선도 대선도 다 질 겁니다. 그래서 저라도 나와서 세대교체를 말하고, 청년정치를 살려야 한다고 외쳐야 한다고 생각했습니다.","★ '질 것 같으니 나오지 마라' — 이게 바로 기득권의 언어입니다. 분명히 말씀드립니다. 저는 누구를 떨어뜨리러 나온 것이 아니라, 당선되러 나왔습니다. 죽어가는 민주당을 살리러 나왔습니다.","★ 한마디로 말씀드리면 — 불공정 그 자체가 된 민주당을, 청년을 비롯한 모든 사람에게 공정한 기회를 주는 정당으로 바꾸기 위해 나왔습니다. 청년이 민주당에 등 돌리는 정당이 아니라 청년이 지지하는 정당으로 만들어야 민주당에 미래가 있고, 민주당의 미래가 대한민국의 미래입니다."]},{"no":1503,"media":"SBS확정대본","q":"1-1. 당원들 반응은? '누구 떨어뜨리려고, 누구 도와주려고 나온 것 아니냐'는 얘기도 듣는다던데?","tags":["확정대본"],"script":["진영에 따라 환호와 비난이 뒤바뀌는데요, 양쪽 진영에서 악플과 문자 폭격도 동시에 받습니다. 제가 이쪽을 지적하면 저쪽에서 '우쭈쭈' 해주시고, 저쪽을 지적하면 이쪽에서 '우쭈쭈' 해주십니다. 하지만 우쭈쭈해 주신다고 누구 대신 칼잡이 노릇할 생각은 전혀 없습니다.","★ 그런데 이 질문 자체가 지금 민주당의 현주소입니다. 청년이 나오면 '왜 나왔느냐'부터 검증받습니다. 686 선배들이 출마할 때 왜 나왔느냐고 묻는 사람은 아무도 없지 않습니까.","★ 뜻밖의 응원도 많습니다. 60~70대 어르신들께 정말 많은 연락을 받았고, 실제 현장에서 짱돌을 들었던 당 선배님들이 직접 전화로 '네 말이 맞다'고 공감해 주셨습니다. 이 짧은 기간에도 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들을 확인했습니다. 그 한 표 한 표가 바위에 금을 내고 있습니다."]},{"no":1504,"media":"SBS확정대본","q":"2. 지금이 민주당의 가장 절박한 골든타임이라고 했는데, 왜 그렇게 생각하나?","tags":["확정대본"],"script":["숫자가 말해줍니다. 18~29세의 절반 가까이가 무당층입니다. 청년이 떠난 정당에 미래가 있습니까. 686이 786, 886까지 가면 민주당은 망합니다.","★ 지금 세대교체를 시작하지 않으면 총선도 대선도 필패합니다. 그리고 재집권에 실패하면 다시 계엄입니다. 이것이 골든타임인 이유입니다.","산업화 세대가 민주화 세대에게 대한민국을 넘겨주었듯이, 이제 민주화 세대가 미래세대에게 민주당을 넘겨줄 때입니다. 그 전환을 이번 전당대회에서 시작해야 합니다."]},{"no":1505,"media":"SBS확정대본","q":"2-1. 민주당이 청년 세대에게 외면받는 이유를 뭐라고 분석하나?","tags":["확정대본"],"script":["청년이 민주당을 떠난 게 아니라, 민주당이 먼저 청년을 떠났습니다.","제 또래 친구들은 민주당 이야기가 나오면 화를 내는 게 아니라 관심을 꺼버립니다. 내로남불 위선 정당에 분노보다 무서운 것이 무관심입니다. 공정이 무너진 정당, 결정권을 주지 않는 정당에 청년이 남아 있을 이유가 없는 겁니다."]},{"no":1506,"media":"SBS확정대본","q":"3. '민주당 세대교체'를 강하게 외치고 있다. 지금 86세대 정치, 어떤 점이 문제라고 보나?","tags":["확정대본"],"script":["반성할 줄 모릅니다. 자기들이 늘 개혁의 주체인 줄 압니다. 민주당 686은 현재 대한민국 최고의 기득권입니다.","★ 내로남불이 행동강령이 됐습니다. 그래서 공정이 사라졌고 청년이 떠났습니다.","민주주의도 사라졌습니다. 내 편을 공천하려고 없는 지침도 만들고, 규칙을 사람에 따라 바꿉니다. 그리고 전 세계에서 유권자와 후보자가 선거 결과도 모르는 선거는 민주당이 유일합니다. 왜 그럴까요? 그게 기득권을 영원히 유지하는 데 유리하기 때문입니다.","오해는 마십시오. 저는 선배님들을 진심으로 존경합니다. 제가 이렇게 비판할 자유도 선배님들이 만들어 주신 민주주의 덕분임을 잘 압니다. 저는 사람이 아니라 구조를 비판하는 것이고, 선배님들이 그때 기성 질서를 향해 외치셨던 질문을 지금 똑같이 외치고 있는 것뿐입니다.","★ 민주주의는 권력을 얻는 것으로 끝나는 게 아니라, 다음 세대에게 그 정신을 넘겨줄 때 완성되는 것 아닙니까. 독재에 맞섰던 그 용기를, 이제는 권력을 내려놓는 용기로 완성해 주시기를 정중히 요청드리는 것입니다."]},{"no":1507,"media":"SBS확정대본","q":"4. 현역 의원 중 세대교체론을 불쾌해하는 사람들도 있을 텐데, 직접 항의를 들은 적은 없나?","tags":["확정대본"],"script":["★ 저는 인물을 비교하거나 평가한 것이 아니라 절차의 공정을 지키라고 말한 것입니다. 본인 등록 서류를 당에서 알아서 챙겨주는 경우가 세상에 어디 있습니까 — 그게 제 질문의 본질입니다. 청년 박지현은 서류 접수조차 거부당했는데, 686 선배는 밤 10시 반 긴급회의로 등록할 길이 열렸습니다. 그런데 공정을 물었더니 호통이 돌아왔습니다.","더 안타까운 것은 경선 구조입니다. 후보끼리 토론이나 대화의 장이 단 한 번도 없으니, 이런 구조에서는 고함이 대화를 대신하게 됩니다. 정견발표에서 공개적으로 사과를 요청드렸지만 끝내 사과는 없었습니다. 저도 당대표 후보입니다. 존중해 주시기 바랍니다.","★ 제가 지금까지 외쳐 온 모든 것 — 청년을 향한 이중잣대, 고무줄 규칙, 경청 없는 기득권 정치 — 그 전부를 그 장면 하나가 딱 보여줬다고 생각합니다. 왜 세대교체인가, 왜 대전환인가. 그 답이 바로 그 현실 장면에 있습니다."]},{"no":1508,"media":"SBS확정대본","q":"4-1. 송영길 후보는 \"우리도 '3김 청산'을 외쳤지만 김대중 유산을 버리지 않았다\"고 반박했는데?","tags":["확정대본"],"script":["저도 똑같습니다. 저는 김대중·노무현의 유산을 버리자는 것이 아니라 그 정신을 잇자는 것입니다. 민주당의 적통은 혈통도 인맥도 아니고, 계란으로 바위를 쳤던 도전 정신입니다.","★ 그때의 청년 송영길에게 길을 열어준 것이 김대중의 유산이라면, 지금의 청년에게 길을 여는 것이 그 유산을 계승하는 길 아니겠습니까. 3김 청산을 외쳤던 그 마음으로, 이제는 아름다운 퇴장을 준비해 주시기 바랍니다."]},{"no":1509,"media":"SBS확정대본","q":"5. 반대 의견이 많을 텐데, 그럼에도 '세대교체'를 어떻게 할지 구체적인 계획이 있나?","tags":["확정대본"],"script":["강요하는 세대교체가 아니라 시스템이 만드는 세대교체입니다. 공정한 기회만 주어지면 물갈이는 저절로 됩니다.","★ 구체적으로 네 가지입니다.","첫째, 동일 지역구 합계 3선 초과 공천 금지를 당헌에 제도화합니다 — 혁신위도 이미 제안했던 방안입니다. 둘","둘째, 기탁금을 폐지하고 당직선거 공영제를 도입해 돈 없어도 도전할 수 있게 합니다.","셋째, 취임 당일 1호 안건으로 선출직 청년최고위원 당헌 개정을 발의해 30일 안에 완료합니다. 넷째, 청년위원회를 청년정책 최고 의결기구로 격상하고 당 예산의 10%를 청년이 직접 편성·집행·평가하게 합니다.","기준은 나이가 아니라 '독점'입니다. 몇 살이든 토론과 연설로 검증받고 이기면 됩니다. 경쟁을 회피하고 규칙을 바꾸는 기득권만 물러나면 됩니다."]},{"no":1510,"media":"SBS확정대본","q":"6. 전대에 등장한 '신천지 개입설', 어떻게 보나? (김민석 문제 제기 → 정청래 법적 공방 예고)","tags":["확정대본"],"script":["국민 보시기에 참 부끄러운 장면입니다. 정책 토론을 해야 할 전당대회가 의혹 공방과 법적 공방 예고로 흐르고 있습니다.","★ 저는 단정도, 부인도 하지 않겠습니다. 검증을 요구합니다. 의혹이 사실이라면 자신의 투표권을 대리인에게 넘긴 명백한 불법 당원입니다. 제보센터 만들어 서로 때릴 게 아니라, 불법당원 전수조사부터 하고 경선을 해야 합니다.","근본 문제는 따로 있습니다. 조직 동원 입당이 가능하고, 유령당원·불법당원이 후보를 뽑아도 확인할 수 없는 구조 — 이 구조를 방치하니 이런 의혹이 파고드는 겁니다. 가짜 당원을 솎아내고 경선 결과를 100% 공개하면 이런 논란 자체가 사라집니다."]},{"no":1511,"media":"SBS확정대본","q":"7. 이번 전당대회부터 권리당원 1인 1표제가 처음 적용되는데, 왜 '가짜 1인 1표'라고 보나?","tags":["확정대본"],"script":["세 가지가 없기 때문입니다.","★ 첫째, 결과 공개가 없습니다. 전 세계에서 유권자와 후보자가 선거 결과도 모르는 선거는 민주당이 유일합니다. 제가 강진군수 경선에서 몇 표를 얻었는지 저는 지금도 모릅니다. 둘째, 명부 검증이 없습니다. 유령당원·불법당원이 섞여 있어도 걸러낼 방법이 없습니다. 셋째, 규칙의 안정성이 없습니다. '단, 달리 정할 수 있다'는 고무줄 조항으로 게임 도중에 심판이 규칙을 바꿉니다.","표는 한 표씩 줬는데 그 표가 어디로 갔는지 알 수 없다면, 그게 어떻게 진짜 1인 1표입니까. 말로만 당원 주권입니다."]},{"no":1512,"media":"SBS확정대본","q":"7-1. 그러면 '진짜 1인 1표'가 되기 위해선 가장 먼저 뭐부터 해야 하나?","tags":["확정대본"],"script":["★ 딱 하나부터 시작하면 됩니다 — 경선 결과 100% 공개입니다. 선거인 수·투표수·득표수를 48시간 안에 전량 공개하는 '48시간 룰'을 당헌에 명문화하는 것입니다. 돈 드는 일도 아니고, 의지의 문제일 뿐입니다.","공개가 시작되면 나머지가 따라옵니다. 결과가 공개되면 유령당원을 숨길 수 없으니 명부 검증이 되고, 명부가 깨끗해지면 조직 동원이 무의미해지고, 그러면 규칙 장난도 사라집니다.","여기에 경선 룰 6개월 전 확정과 '달리 정할 수 있다' 단서조항 전부 삭제까지 — 취임 100일 안에 당헌에 새기겠습니다. 당한 사람이 바꿉니다."]},{"no":1513,"media":"SBS확정대본","q":"10. (마무리) 내가 민주당 대표가 된다면 앞으로의 민주당은 이렇게 바뀔 것이다 —","tags":["확정대본"],"script":["★ 한 가지, 아무도 말하지 않는 문제부터 말씀드리겠습니다. 부패한 당직자 카르텔입니다. 당원의 목소리보다 힘이 센 것이 아무도 견제하지 못하는 당직자의 무소불위 권력과 깜깜이 예산입니다. 저는 철밥통 사무처를 젊고 치열한 사무처로 전면 쇄신하고, 국고보조금·당비를 1원까지 실시간 공개하고, 정당 재정에 외부 감사를 도입하겠습니다. 공무원도 하는 재정 공개를 왜 정당만 성역입니까.","★ '뽑고 싶은 민주당'으로 바뀝니다. 계파가 아니라 시스템이 움직이는 정당, 규칙을 만든 사람들의 정당이 아니라 침묵하는 다수의 소리를 듣는 정당, 과거의 훈장이 아니라 미래의 설계도를 가진 정당 — 100일 안에 그 뼈대를 세우겠습니다.","★ 다들 제 도전을 계란으로 바위치기라고 합니다. 맞습니다. 하지만 바위는 40년 비를 맞아 허물어지기 직전이고, 계란은 생명을 품고 있습니다. 저는 죽어도 다음 세대는 살아야 하지 않겠습니까. 이번 생엔, 계란으로 바위를 깨 보겠습니다. 김보미를 링 위에 올려주십시오."]},{"no":1514,"media":"SBS확정대본","q":"전당대회 끝나면(본선 못 가면) 뭐 할 거냐? — 앞으로의 행보","tags":["확정대본"],"script":["전당대회가 계파 갈등의 장이 아니라 민주당의 미래와 혁신을 이야기하는 장이 되도록 힘을 보태겠습니다.","청년을 어떻게 살리고, 서민을 어떻게 살리고, 지역을 어떻게 살릴지 — 이 논의가 나오는 전당대회가 되어야 합니다.","정부가 제안한 부동산 문제, 3대 메가프로젝트 같은 과제들을 여당이 어떻게 함께 논의하고 풀어갈지, 그 정책 논의에 청년들의 목소리가 반영되도록 새로운 아젠다 제안에 힘을 보태겠습니다.","★ 둘째, 공정한 민주당을 만드는 일입니다. 진짜 당원주권 1인 1표 정당이 되려면 세 가지가 필요합니다. 불법·가짜 당원을 솎아내는 것, 당직자들이 룰을 만들고 그 룰로 권한을 행사하는 것을 막는 것, 그리고 성장 가능성 있는 사람들을 교육하고 훈련시키는 것입니다.","★ 그리고 홍대에서 선언한 대로 — 젊은 세대들이 참여할 수 있는 민주당의 디지털 플랫폼을 만드는 운동을 시작하겠습니다. 본선에 가든 가지 않든, 이 약속은 평생이 걸리더라도 지킵니다."]},{"no":1515,"media":"SBS확정대본","q":"특정 후보와 연대 계획은? (김민석·정청래 기조 평가 포함)","tags":["확정대본"],"script":["★ 누가 당대표가 되든, 제가 제안드린 방향 — 공정한 경선, 가짜 당원 정리, 청년에게 실질적 권한, 디지털 정당 대전환 — 으로 당을 이끌어 주신다면, 그 당대표를 지지하겠습니다.","특정 후보와의 연대는 지금 말할 단계가 아닙니다. 저도 오늘 본선에 오를 수 있는 후보입니다. 다만 제 홍대선언의 방향에 동의하고 함께할 후보가 있다면, 언제든 논의하고 협력할 생각이 있습니다.","솔직히 아직까지 두 분에게서 뚜렷한 비전이나 정책 기조가 보이지 않아 안타깝습니다. 지금은 검찰개혁 논쟁과 계파 공방이 논의를 덮고 있습니다. 본선이 본격화되면 정책으로 함께 논의할 기회가 있었으면 좋겠습니다."]},{"no":1516,"media":"SBS확정대본","q":"[꼭 할 말] 3인 캠프의 현실 — 사무실도 없이 카페와 식당을 전전하며 (후원금·시간 부족)","tags":["확정대본"],"script":["★ 저희 캠프의 현실을 말씀드리면, 단 세 명입니다. 사무실도 없습니다. 카페에서, 식당에서 자리를 전전하며 회의합니다. 후원해 주실 조직도 계파도 없습니다. 유력 후보들이 수십 명 캠프와 사무실을 꾸릴 때, 저희 셋은 노트북 하나 들고 뛰었습니다.","★ 선거운동 기간은 단 5일이었습니다. 토론회 한 번 없이, 동영상 한 번 촬영한 것이 공식 기회의 전부였습니다. 시간도, 돈도, 조직도 없는 싸움 — 이것이 지금 민주당에서 청년 후보가 서 있는 출발선입니다.","그런데도 여기까지 왔습니다. 당원들이 가치를 보고 표를 던져 주셨고, 시민들이 손을 내밀어 주셨기 때문입니다. 저는 이 경험 때문에라도 기탁금 폐지와 당직선거 공영제를 반드시 해내겠습니다. 돈과 조직이 아니라 실력과 정책으로 겨루는 링 — 제가 겪었기에 제가 만들 수 있습니다."]},{"no":1517,"media":"SBS확정대본","q":"재정 투명성 — 김보미365에서 정당 깜깜이 재정까지, 당직자 카르텔 격파론","tags":["확정대본"],"script":["지방의원으로 8년, 예산 심의와 조례 제정을 직접 해 보면서 절실히 느낀 것이 있습니다. 국민의 알 권리가 전혀 충족되지 않고 있다는 것입니다. 다들 삶이 바쁜데 누가 시간을 내서 그 두꺼운 예산서·결산서를 들여다보겠습니까. 확인하려면 아는 사람 찾아가고 정보공개청구까지 해야 하는데, 지역은 한 집 건너 아는 사이라 그것도 곤란합니다. 결국 우리 혈세가 어떻게 쓰이는지 아무도 모르게 되는 겁니다.","★ 그래서 제가 직접 만들었습니다. '김보미365' — 강진의 예산 집행 현황을 모두가 볼 수 있게 공개하는 웹사이트를 개발했습니다. 지금은 재정주권시민행동 공동대표로 활동하면서, 김보미닷컴에 전국 지자체 재정을 3초 만에 진단하는 홈페이지를 만들어 확산하고 있습니다.","★ 그런데 놀라운 것을 발견했습니다. 우리가 낸 혈세가 집행되는 내역은 다 볼 수 있는데, 정작 정당의 돈은 볼 수가 없습니다. 사후에, 그것도 열람만 가능합니다. 민주당 홈페이지에 들어가 봤더니 딸랑 PDF 한 장으로 분기 보고를 하고 있더군요. 울릉군도 공개하는 재정을, 공당이 이렇게 운영합니다.","★ 이 깜깜이 예산 뒤에 당직자 카르텔이 있습니다. 중앙당 국장이 국회의원보다 무소불위라는 말이 나올 정도의 철밥통입니다. 오죽하면 전남도당 처장을 한번 하면 아파트를 산다고 서로 오려고 하고, 한 번 더 하려고 용쓴다는 소리까지 들리겠습니까. 당헌·당규를 주무르는 법기술자 같은 국장들의 카르텔을 격파하고, 능력 있는 청년 인재들로 교체해 물갈이해야 합니다.","★ 어렵지 않습니다. 돈 쓰는 내역만 공개돼도 알아서 물갈이되고 혁신됩니다. 공개가 시작되면 행정이 바뀝니다 — 강진에서 제가 해 봤습니다. 국고보조금·당비 1원까지 실시간 공개, 그것이 당권재민의 시작입니다."]},{"no":1518,"media":"SBS확정대본","q":"🏁 마무리 인사","tags":["확정대본"],"script":["★ 마지막으로 한 말씀 드리겠습니다. 지금 저는 양쪽 진영에서 악플과 문자 폭격을 동시에 받고 있습니다. 우쭈쭈해 주신다고 누구 대신 칼잡이 노릇할 생각 없습니다. 논점을 흐리고 왜곡하는 것, 허위사실을 유포하는 것은 전부 기록하고 캡처해 두고 있습니다. 선거가 끝나면 명백한 허위사실 유포는 법적 조치를 포함해 끝까지 바로잡겠습니다. 비판과 왜곡은 다릅니다.","★ 규칙을 만든 사람들의 정당, 기득권이 다 해먹는 정당을 끝내고 침묵하는 다수의 소리를 듣는 정당을 만드는 데 평생을 바치겠습니다. 과거에 복수하며 싸우는 정당을 끝내고, 미래의 언어로 일하는 정당을 만들겠습니다.","★ 새로운 민주당을 존경하는 당원 여러분, 그리고 묵묵히 김보미를 응원해 주시는 국민 여러분과 함께 만들겠습니다. 감사합니다."]},{"no":1401,"media":"SBS뉴스브리핑","q":"1. 유일한 30대·원외·무계파 후보, 더 힘든 싸움이 될 텐데 당대표 도전을 마음먹은 계기는?","tags":["출마이유","5무정당","세대교체","SBS뉴스브리핑"],"script":["민주당이 죽기 직전이기 때문입니다. 공정도, 미래도, 청년도, 민주주의도 다 없습니다. 누군가는 이 말을 해야 하는데, 계파 있고 자리 있는 분들은 아무도 하지 않습니다. 그래서 잃을 것 없는 청년 평당원이 나선 겁니다.","힘든 싸움인 것 맞습니다. 조직도 계파도 돈도 없습니다. 그런데 김대중은 서슬 퍼런 군사독재 치하에서 도전했고, 노무현은 지지율 2%로 시작했습니다. 민주당의 역사가 원래 계란으로 바위치기의 역사입니다.","★ 민주당이 지금처럼 내로남불 정당, 불공정의 아이콘, 686 꼰대 정당으로 가면 2030은 다 떠나고 총선도 대선도 다 질 겁니다. 그래서 저라도 나와서 세대교체를 말하고, 청년정치를 살려야 한다고 외쳐야 한다고 생각했습니다.","★ '질 것 같으니 나오지 마라' — 이게 바로 기득권의 언어입니다. 분명히 말씀드립니다. 저는 누구를 떨어뜨리러 나온 것이 아니라, 당선되러 나왔습니다. 죽어가는 민주당을 살리러 나왔습니다.","★ 한마디로 말씀드리면 — 불공정 그 자체가 된 민주당을, 청년을 비롯한 모든 사람에게 공정한 기회를 주는 정당으로 바꾸기 위해 나왔습니다. 청년이 민주당에 등 돌리는 정당이 아니라 청년이 지지하는 정당으로 만들어야 민주당에 미래가 있고, 민주당의 미래가 대한민국의 미래입니다."]},{"no":1402,"media":"SBS뉴스브리핑","q":"1-1. 당원들 반응은? '누구 떨어뜨리려고, 누구 도와주려고 나온 것 아니냐'는 얘기도 듣는다던데?","tags":["당원반응","왜나왔느냐","진영논리","SBS뉴스브리핑"],"script":["정말 많이 듣습니다. 정청래 공격하러 나왔냐, 김민석 도와주러 나왔냐 — 표현만 다르지 다 같은 질문입니다. 양쪽 진영에서 악플과 문자 폭격도 동시에 받습니다. 제가 이쪽을 지적하면 저쪽에서 '우쭈쭈' 해주시고, 저쪽을 지적하면 이쪽에서 '우쭈쭈' 해주십니다. 하지만 우쭈쭈해 주신다고 누구 대신 칼잡이 노릇할 생각은 전혀 없습니다.","★ 그런데 이 질문 자체가 지금 민주당의 현주소입니다. 청년이 나오면 '왜 나왔느냐'부터 검증받습니다. 686 선배들이 출마할 때 왜 나왔느냐고 묻는 사람은 아무도 없지 않습니까.","★ 뜻밖의 응원도 많습니다. 60~70대 어르신들께 정말 많은 연락을 받았고, 실제 현장에서 짱돌을 들었던 당 선배님들이 직접 전화로 '네 말이 맞다'고 공감해 주셨습니다. 이 짧은 기간에도 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들을 확인했습니다. 그 한 표 한 표가 바위에 금을 내고 있습니다."]},{"no":1403,"media":"SBS뉴스브리핑","q":"2. 지금이 민주당의 가장 절박한 골든타임이라고 했는데, 왜 그렇게 생각하나?","tags":["골든타임","세대교체","재집권","무당층","SBS뉴스브리핑"],"script":["숫자가 말해줍니다. 18~29세의 절반 가까이가 무당층입니다. 청년이 떠난 정당에 미래가 있습니까. 686이 786, 886까지 가면 민주당은 망합니다.","★ 지금 세대교체를 시작하지 않으면 총선도 대선도 필패합니다. 그리고 재집권에 실패하면 다시 계엄입니다. 이것이 골든타임인 이유입니다.","산업화 세대가 민주화 세대에게 대한민국을 넘겨주었듯이, 이제 민주화 세대가 미래세대에게 민주당을 넘겨줄 때입니다. 그 전환을 이번 전당대회에서 시작해야 합니다."]},{"no":1404,"media":"SBS뉴스브리핑","q":"2-1. 민주당이 청년 세대에게 외면받는 이유를 뭐라고 분석하나?","tags":["청년외면","병풍","우쭈쭈정치","공정","SBS뉴스브리핑"],"script":["청년이 민주당을 떠난 게 아니라, 민주당이 먼저 청년을 떠났습니다.","★ 민주당에서 청년은 주주가 아니라 병풍이었습니다. 선거철마다 동원되고 이용되지만 실질적 권한은 하나도 없습니다. 진영에 따라 환호와 비난이 뒤바뀌는 '우쭈쭈 정치'에 청년들은 완전히 질려 있습니다.","제 또래 친구들은 민주당 이야기가 나오면 화를 내는 게 아니라 관심을 꺼버립니다. 분노보다 무서운 것이 무관심입니다. 공정이 무너진 정당, 결정권을 주지 않는 정당에 청년이 남아 있을 이유가 없는 겁니다."]},{"no":1405,"media":"SBS뉴스브리핑","q":"3. '민주당 세대교체'를 강하게 외치고 있다. 지금 86세대 정치, 어떤 점이 문제라고 보나?","tags":["86세대","기득권","내로남불","세대교체","SBS뉴스브리핑"],"script":["반성할 줄 모릅니다. 자기들이 늘 개혁의 주체인 줄 압니다. 민주당 686은 현재 대한민국 최고의 기득권입니다.","★ 내로남불이 행동강령이 됐습니다. 자기편이면 돈봉투를 돌려도 영웅이고, 성폭력 범죄를 저질러도 지켜줍니다. 그래서 공정이 사라졌고 청년이 떠났습니다.","민주주의도 사라졌습니다. 내 편을 공천하려고 없는 지침도 만들고, 규칙을 사람에 따라 바꿉니다. 그리고 전 세계에서 유권자와 후보자가 선거 결과도 모르는 선거는 민주당이 유일합니다. 왜 그럴까요? 그게 기득권을 영원히 유지하는 데 유리하기 때문입니다.","오해는 마십시오. 저는 선배님들을 진심으로 존경합니다. 제가 이렇게 비판할 자유도 선배님들이 만들어 주신 민주주의 덕분임을 잘 압니다. 저는 사람이 아니라 구조를 비판하는 것이고, 선배님들이 그때 기성 질서를 향해 외치셨던 질문을 지금 똑같이 외치고 있는 것뿐입니다.","★ 민주주의는 권력을 얻는 것으로 끝나는 게 아니라, 다음 세대에게 그 정신을 넘겨줄 때 완성되는 것 아닙니까. 독재에 맞섰던 그 용기를, 이제는 권력을 내려놓는 용기로 완성해 주시기를 정중히 요청드리는 것입니다."]},{"no":1406,"media":"SBS뉴스브리핑","q":"4. 현역 의원 중 세대교체론을 불쾌해하는 사람들도 있을 텐데, 직접 항의를 들은 적은 없나?","tags":["송영길","고함","항의","과정의불공정","SBS뉴스브리핑"],"script":["있습니다. 항의 정도가 아니라 고함을 들었습니다. 서울시의회 의장실 접견 자리, 의장님과 의원님들, 직원분들까지 계신 공개된 자리에서 송영길 후보께서 제 페이스북 글을 두고 고함을 치셨습니다. 별도로 통화하자고 정중히 부탁드렸는데도 호통은 계속됐습니다. 언론에 알려진 것보다 훨씬 셌다고 보시면 됩니다.","★ 저는 인물을 비교하거나 평가한 것이 아니라 절차의 공정을 지키라고 말한 것입니다. 본인 등록 서류를 당에서 알아서 챙겨주는 경우가 세상에 어디 있습니까 — 그게 제 질문의 본질입니다. 2022년 청년 박지현은 '입당 6개월 미만'을 이유로 후보 자격조차 얻지 못했는데, 이번에는 같은 6개월 규정에 걸린 686 선배에게 긴급 최고위 논의와 다음 날 비공개 최고위 의결로 길이 열렸습니다. 그런데 공정을 물었더니 호통이 돌아왔습니다.","더 안타까운 것은 경선 구조입니다. 후보끼리 토론이나 대화의 장이 단 한 번도 없으니, 이런 구조에서는 고함이 대화를 대신하게 됩니다. 정견발표에서 공개적으로 사과를 요청드렸지만 끝내 사과는 없었습니다. 저도 당대표 후보입니다. 존중해 주시기 바랍니다.","★ 제가 지금까지 외쳐 온 모든 것 — 청년을 향한 이중잣대, 고무줄 규칙, 경청 없는 기득권 정치 — 그 전부를 그 장면 하나가 딱 보여줬다고 생각합니다. 왜 세대교체인가, 왜 대전환인가. 그 답이 바로 그 현실 장면에 있습니다."]},{"no":1407,"media":"SBS뉴스브리핑","q":"4-1. 송영길 후보는 \"우리도 '3김 청산'을 외쳤지만 김대중 유산을 버리지 않았다\"고 반박했는데?","tags":["3김청산","김대중","젊은피수혈","계승","SBS뉴스브리핑"],"script":["저도 똑같습니다. 저는 김대중·노무현의 유산을 버리자는 것이 아니라 그 정신을 잇자는 것입니다. 민주당의 적통은 혈통도 인맥도 아니고, 계란으로 바위를 쳤던 도전 정신입니다.","★ 그리고 그 말씀을 하신 송영길 후보야말로 답을 알고 계십니다. '3김 청산'을 외치던 30대 청년 송영길·김민석을 과감히 발탁한 분이 바로 김대중 대통령입니다. 그게 '젊은 피 수혈'이었습니다. 그런데 그 수혈을 받은 분들이 30년이 지나도록 다음 세대에게 피를 돌리지 않고 있습니다.","그때의 청년 송영길에게 길을 열어준 것이 김대중의 유산이라면, 지금의 청년에게 길을 여는 것이 그 유산을 계승하는 길 아니겠습니까. 3김 청산을 외쳤던 그 마음으로, 이제는 아름다운 퇴장을 준비해 주시기 바랍니다."]},{"no":1408,"media":"SBS뉴스브리핑","q":"5. 반대 의견이 많을 텐데, 그럼에도 '세대교체'를 어떻게 할지 구체적인 계획이 있나?","tags":["세대교체계획","3선배제","청년결정권","공영제","SBS뉴스브리핑"],"script":["강요하는 세대교체가 아니라 시스템이 만드는 세대교체입니다. 공정한 기회만 주어지면 물갈이는 저절로 됩니다.","★ 구체적으로 네 가지입니다. 첫째, 동일 지역구 합계 3선 초과 공천 금지를 당헌에 제도화합니다 — 혁신위도 이미 제안했던 방안입니다. 둘째, 기탁금을 폐지하고 당직선거 공영제를 도입해 돈 없어도 도전할 수 있게 합니다. 셋째, 취임 당일 1호 안건으로 선출직 청년최고위원 당헌 개정을 발의해 30일 안에 완료합니다. 넷째, 청년위원회를 청년정책 최고 의결기구로 격상하고 당 예산의 10%를 청년이 직접 편성·집행·평가하게 합니다.","기준은 나이가 아니라 '독점'입니다. 몇 살이든 토론과 연설로 검증받고 이기면 됩니다. 경쟁을 회피하고 규칙을 바꾸는 기득권만 물러나면 됩니다.","★ 그리고 이번 전당대회에서 공약집을 발표한 사람은 저밖에 없습니다. 출마선언의 5대 분야 25개 약속, 대전환 11대 공약(7.21), 홍대선언 12대 약속(7.22)까지 — 언제 무엇을 어떻게 바꿀지 문서로 다 내놨습니다. 계획이 있느냐고 물으신다면, 계획을 문서로 내놓은 유일한 후보가 접니다."]},{"no":1409,"media":"SBS뉴스브리핑","q":"6. 전대에 등장한 '신천지 개입설', 어떻게 보나? (김민석 문제 제기 → 정청래 법적 공방 예고)","tags":["신천지","불법당원","전수조사","1인1표","SBS뉴스브리핑"],"quotes":[["배경 브리핑 (7.22 공방)","김민석 '신천지는 비유법이 아니라 실체법, 반명·분열주의와 사실상 연합' vs 정청래 '정교분리 위반, 반드시 죗값' — 법적 공방 예고. 친명계 제보센터 설치, 친청계 '근거 없으면 사퇴' 요구. 당 공식: '예의주시 중이나 아직 확인 안 됨'(7.22)."]],"script":["국민 보시기에 참 부끄러운 장면입니다. 정책 토론을 해야 할 전당대회가 의혹 공방과 법적 공방 예고로 흐르고 있습니다.","★ 저는 단정도, 부인도 하지 않겠습니다. 검증을 요구합니다. 의혹이 사실이라면 자신의 투표권을 대리인에게 넘긴 명백한 불법 당원입니다. 제보센터 만들어 서로 때릴 게 아니라, 불법당원 전수조사부터 하고 경선을 해야 합니다.","근본 문제는 따로 있습니다. 조직 동원 입당이 가능하고, 유령당원·불법당원이 후보를 뽑아도 확인할 수 없는 구조 — 이 구조를 방치하니 이런 의혹이 파고드는 겁니다. 가짜 당원을 솎아내고 경선 결과를 100% 공개하면 이런 논란 자체가 사라집니다."]},{"no":1410,"media":"SBS뉴스브리핑","q":"7. 이번 전당대회부터 권리당원 1인 1표제가 처음 적용되는데, 왜 '가짜 1인 1표'라고 보나?","tags":["1인1표","가짜1인1표","결과공개","유령당원","SBS뉴스브리핑"],"script":["세 가지가 없기 때문입니다.","★ 첫째, 결과 공개가 없습니다. 전 세계에서 유권자와 후보자가 선거 결과도 모르는 선거는 민주당이 유일합니다. 제가 강진군수 경선에서 몇 표를 얻었는지 저는 지금도 모릅니다. 둘째, 명부 검증이 없습니다. 유령당원·불법당원이 섞여 있어도 걸러낼 방법이 없습니다. 셋째, 규칙의 안정성이 없습니다. '단, 달리 정할 수 있다'는 고무줄 조항으로 게임 도중에 심판이 규칙을 바꿉니다.","표는 한 표씩 줬는데 그 표가 어디로 갔는지 알 수 없다면, 그게 어떻게 진짜 1인 1표입니까. 말로만 당원 주권입니다."]},{"no":1411,"media":"SBS뉴스브리핑","q":"7-1. 그러면 '진짜 1인 1표'가 되기 위해선 가장 먼저 뭐부터 해야 하나?","tags":["결과공개","48시간룰","전수조사","경선룰","SBS뉴스브리핑"],"script":["★ 딱 하나부터 시작하면 됩니다 — 경선 결과 100% 공개입니다. 선거인 수·투표수·득표수를 48시간 안에 전량 공개하는 '48시간 룰'을 당헌에 명문화하는 것입니다. 돈 드는 일도 아니고, 의지의 문제일 뿐입니다.","공개가 시작되면 나머지가 따라옵니다. 결과가 공개되면 유령당원을 숨길 수 없으니 명부 검증이 되고, 명부가 깨끗해지면 조직 동원이 무의미해지고, 그러면 규칙 장난도 사라집니다.","여기에 경선 룰 6개월 전 확정과 '달리 정할 수 있다' 단서조항 전부 삭제까지 — 취임 100일 안에 당헌에 새기겠습니다. 당한 사람이 바꿉니다."]},{"no":1412,"media":"SBS뉴스브리핑","q":"8. 유시민 작가의 '어물전 썩은내' 발언 — 김민석 후보는 반발, 정청래 후보는 노코멘트. 김 후보는 어떻게 보나?","tags":["유시민","어물전론","쓴소리","대전환","SBS뉴스브리핑"],"quotes":[["배경 브리핑 (발언 정리·사실확인 7.22)","타임라인: ABC론(3월) → 재건축론(6월) → 필패론(7.15) → 뉴이재명 수장·어물전(7.22, JTBC 유튜브 2분News). 친명계 격앙 — 김민석 '동지의 언어에 필패·썩은내라는 단어는 없다', 정청래 '노코멘트'. 언론 '전당대회용 아니냐' 분석."],["간략 버전 (시기·개입 프레임)","왜 하필 이 시기인지, 안타깝습니다. 쓴소리 자체는 경청해야 합니다. 그런데 전당대회를 코앞에 두고 필패론에 어물전 발언까지 연달아 나오니, 취지가 무엇이든 진의는 왜곡되고 '전당대회용 아니냐'는 해석만 낳고 있습니다. 지금은 당원들이 스스로 선택할 시간입니다. 선거는 흔들지 말아 주십시오. 원로의 역할은 개입이 아니라 지켜봐 주시는 것이라고 생각합니다."]],"script":["두 분 반응이 대조적인데, 저는 취지에 공감하는 쪽입니다. 비린내가 난다고 후각이 예민한 사람을 쫓아내면 결국 생선이 다 썩습니다. 쓴소리에 문자폭탄으로 답하는 정당에는 미래가 없습니다. 저부터가 당에 쓴소리를 하러 나온 사람입니다.","★ 다만 저는 실패를 예언하러 나온 사람이 아니라 성공시키러 나온 사람입니다. 계파 싸움으로 발목을 잡는 민주당이야말로 '필연적 실패의 길'이고, 당을 바꿔야 정부가 성공합니다.","재건축 이야기까지 나왔는데, 저는 한발 더 나가 '대전환'을 하자는 사람입니다. 어물전에 환풍기 다는 정도로는 안 됩니다. 시스템으로 움직이는 디지털 정당으로 완전히 바꾸자 — 그것이 제가 홍대선언에 담은 제안입니다."],"notes":["⚠ 사실확인: 유시민 '(대통령) 전화' 관련 발언은 보도로 확인되지 않음 — 언급 금지. '정권 내내 조용하다가'도 부정확(3월 ABC론·6월 재건축론·7.15 필패론·7.22 어물전). 시기 비판은 quotes의 '간략 버전' 워딩 사용."]},{"no":1413,"media":"SBS뉴스브리핑","q":"9. 민주당이 검찰 보완수사권을 사실상 완전 폐지하는 방침으로 가닥을 잡았는데, 경찰 부실 수사 우려도 나온다. 어떤 의견인가?","tags":["보완수사권","검찰개혁","피해자보호","검경견제","SBS뉴스브리핑"],"script":["검찰개혁의 방향에는 전적으로 동의합니다. 안 하자는 게 아니라 완성하자는 겁니다. 노무현 대통령 때 시작해서 24년째인 숙제, 이번에는 끝내야 합니다.","★ 다만 완전 폐지로 간다면 두 가지 질문에 반드시 답이 있어야 합니다. 첫째, 경찰의 독주를 누가 견제합니까. 정치검찰도 안 되지만 경찰 독주도 안 됩니다. 검·경이 서로 견제하는 제도여야 합니다. 둘째, 말씀하신 부실 수사 우려처럼 범죄 피해자 보호에 공백이 생기면 어떻게 합니까. 여성단체들이 우려하는 지점이 바로 그것이고, 저는 그 우려가 정당하다고 봅니다.","★ 칼은 뺏어도 좋습니다. 그러나 국민을 지키는 선까지 자를 일은 아닙니다. 개혁의 목적은 검찰을 이기는 것이 아니라 국민의 인권과 안전을 지키는 것입니다. 개혁은 속도가 아니라 신뢰로 완성됩니다."]},{"no":1414,"media":"SBS뉴스브리핑","q":"10. (마무리) 내가 민주당 대표가 된다면 앞으로의 민주당은 이렇게 바뀔 것이다 — 국민과 당원들에게 짧게.","tags":["마무리","뽑고싶은민주당","계란은생명","클로징","당직자카르텔","재정공개","SBS뉴스브리핑"],"script":["★ 한 가지, 아무도 말하지 않는 문제부터 말씀드리겠습니다. 부패한 당직자 카르텔입니다. 당원의 목소리보다 힘이 센 것이 아무도 견제하지 못하는 당직자의 무소불위 권력과 깜깜이 예산입니다. 저는 철밥통 사무처를 젊고 치열한 사무처로 전면 쇄신하고, 국고보조금·당비를 1원까지 실시간 공개하고, 정당 재정에 외부 감사를 도입하겠습니다. 공무원도 하는 재정 공개를 왜 정당만 성역입니까.","★ '뽑고 싶은 민주당'으로 바뀝니다. 계파가 아니라 시스템이 움직이는 정당, 규칙을 만든 사람들의 정당이 아니라 침묵하는 다수의 소리를 듣는 정당, 과거의 훈장이 아니라 미래의 설계도를 가진 정당 — 100일 안에 그 뼈대를 세우겠습니다.","★ 다들 제 도전을 계란으로 바위치기라고 합니다. 맞습니다. 하지만 바위는 40년 비를 맞아 허물어지기 직전이고, 계란은 생명을 품고 있습니다. 저는 죽어도 다음 세대는 살아야 하지 않겠습니까. 이번 생엔, 계란으로 바위를 깨 보겠습니다. 김보미를 링 위에 올려주십시오.","★ 마지막으로 — 논점을 흐리고 왜곡하는 것, 허위사실을 유포하는 것은 전부 기록하고 캡처해 두고 있습니다. 선거가 끝나면 명백한 허위사실 유포는 법적 조치를 포함해 끝까지 바로잡겠습니다. 비판과 왜곡은 다릅니다.","★ 규칙을 만든 사람들의 정당, 기득권이 다 해먹는 정당을 끝내고 침묵하는 다수의 소리를 듣는 정당을, 과거에 복수하며 싸우는 정당을 끝내고 미래의 언어로 일하는 정당을 만들겠습니다. 새로운 민주당을 당원 여러분, 국민 여러분과 함께 만들겠습니다."]},{"no":1415,"media":"SBS뉴스브리핑","q":"[핵심 대비] 전당대회 끝나면(본선 못 가면) 뭐 할 거냐? — 앞으로의 행보 (7.23 아침 확정 기조)","tags":["앞으로의행보","정책전당대회","정당개혁","디지털플랫폼","청년목소리","SBS뉴스브리핑"],"script":["★ 두 가지를 하겠습니다. 첫째, 전당대회가 계파 갈등의 장이 아니라 민주당의 미래와 혁신을 이야기하는 장이 되도록 힘을 보태겠습니다. 검찰개혁을 할 거냐 말 거냐 하는 논쟁이 전당대회의 중심이 되는 것은 바람직하지 않습니다. 민주당의 정체성은 그것이 아닙니다. 청년을 어떻게 살리고, 서민을 어떻게 살리고, 지역을 어떻게 살릴지 — 이 논의가 나오는 전당대회가 되어야 합니다.","정부가 제안한 부동산 문제, 3대 메가프로젝트 같은 과제들을 여당이 어떻게 함께 논의하고 풀어갈지, 그 정책 논의에 청년들의 목소리가 반영되도록 새로운 아젠다 제안에 힘을 보태겠습니다.","★ 둘째, 공정한 민주당을 만드는 일입니다. 진짜 당원주권 1인 1표 정당이 되려면 세 가지가 필요합니다. 불법·가짜 당원을 솎아내는 것, 당직자들이 룰을 만들고 그 룰로 권한을 행사하는 것을 막는 것, 그리고 성장 가능성 있는 사람들을 교육하고 훈련시키는 것입니다.","★ 그리고 홍대에서 선언한 대로 — 젊은 세대들이 참여할 수 있는 민주당의 디지털 플랫폼을 만드는 운동을 시작하겠습니다. 본선에 가든 가지 않든, 이 약속은 평생이 걸리더라도 지킵니다."]},{"no":1416,"media":"SBS뉴스브리핑","q":"[돌발 대비] 그럼 본선에서 누구를 지지할 거냐? 특정 후보와 연대 계획은? (김민석·정청래 기조 평가 포함)","tags":["지지후보","연대","본선","김민석","정청래","SBS뉴스브리핑"],"script":["★ 누가 당대표가 되든, 제가 제안드린 방향 — 공정한 경선, 가짜 당원 정리, 청년에게 실질적 권한, 디지털 정당 대전환 — 으로 당을 이끌어 주신다면, 그 당대표를 지지하겠습니다.","특정 후보와의 연대는 지금 말할 단계가 아닙니다. 저도 오늘 본선에 오를 수 있는 후보입니다. 다만 제 홍대선언의 방향에 동의하고 함께할 후보가 있다면, 언제든 논의하고 협력할 생각이 있습니다.","(김민석·정청래 후보 기조 평가를 물으면) 솔직히 아직까지 두 분에게서 뚜렷한 비전이나 정책 기조가 보이지 않아 안타깝습니다. 지금은 검찰개혁 논쟁과 계파 공방이 논의를 덮고 있습니다. 본선이 본격화되면 정책으로 함께 논의할 기회가 있었으면 좋겠습니다."],"notes":["7.23 아침 이왕재 소장 조율 확정 기조 — '지지 안 한다'로 잘라 말하지 말고 '방향에 동의하는 당대표를 지지'로 여지를 두는 프레임."]},{"no":1417,"media":"SBS뉴스브리핑","q":"[돌발 대비] 이름 알리러 나온 것 아니냐? 당대표로서 무슨 능력과 자격이 있나?","tags":["능력자격","AI리더십","경청","무계파","검증","SBS뉴스브리핑"],"script":["이 질문, 오늘도 받았습니다. 왜 청년 후보에게만 이렇게 물으시는지요. 좋습니다, 이왕 물으셨으니 답하겠습니다. 제가 가진 능력은 세 가지입니다.","★ 첫째, AI 리더십입니다. 저는 AI를 직접 활용하는 디지털 세대입니다. AI 시대의 기술과 감각 속에서 살아온 사람이 AI 시대의 정당을 이끌어야 합니다. 후보들 중에 AI를 직접 다루고 이해하는 사람이 저 말고 누가 있습니까.","★ 둘째, 경청입니다. 저는 8년간 밑바닥에서 사람들의 이야기를 듣고 그 문제를 해결해 온 지방의원이었습니다. 당원과 국민의 가장 작은 목소리를 들을 자세와 의지가 있는 유일한 후보라고 자부합니다.","★ 셋째, 무계파입니다. 계파가 없는 사람이 개혁을 할 수 있습니다. 챙겨줄 사람도, 신세 진 사람도 없는 제가 민주당의 기득권 카르텔을 깰 수 있는 유일한 후보입니다.","여기에 기록이 있습니다 — 최연소 의장, 일문일답 도입, 낭비예산 108억 삭감, 그리고 공약집을 문서로 낸 유일한 후보. 말이 아니라 기록으로 검증받겠습니다."]},{"no":1418,"media":"SBS뉴스브리핑","q":"[꼭 할 말] 3인 캠프의 현실 — 사무실도 없이 카페와 식당을 전전하며 (후원금·시간 부족)","tags":["3인캠프","사무실없음","후원금","시간부족","흙수저캠프","현실","SBS뉴스브리핑"],"script":["★ 저희 캠프의 현실을 말씀드리면, 단 세 명입니다. 사무실도 없습니다. 카페에서, 식당에서 자리를 전전하며 회의합니다. 기탁금은 등록 당일 다섯 군데서 빌렸고, 후원해 주실 조직도 계파도 없습니다. 유력 후보들이 수십 명 캠프와 사무실을 꾸릴 때, 저희 셋은 노트북 하나 들고 뛰었습니다.","★ 선거운동 기간은 단 5일이었습니다. 토론회 한 번 없이, 동영상 한 번 촬영한 것이 공식 기회의 전부였습니다. 시간도, 돈도, 조직도 없는 싸움 — 이것이 지금 민주당에서 청년 후보가 서 있는 출발선입니다.","그런데도 여기까지 왔습니다. 당원들이 가치를 보고 표를 던져 주셨고, 시민들이 손을 내밀어 주셨기 때문입니다. 저는 이 경험 때문에라도 기탁금 폐지와 당직선거 공영제를 반드시 해내겠습니다. 돈과 조직이 아니라 실력과 정책으로 겨루는 링 — 제가 겪었기에 제가 만들 수 있습니다."]},{"no":1419,"media":"SBS뉴스브리핑","q":"[핵심 서사] 재정 투명성 — 김보미365에서 정당 깜깜이 재정까지, 당직자 카르텔 격파론 (이력 피력 겸용)","tags":["재정투명성","김보미365","재정주권시민행동","3초진단","알권리","당직자카르텔","물갈이","SBS뉴스브리핑"],"script":["지방의원으로 8년, 예산 심의와 조례 제정을 직접 해 보면서 절실히 느낀 것이 있습니다. 국민의 알 권리가 전혀 충족되지 않고 있다는 것입니다. 다들 삶이 바쁜데 누가 시간을 내서 그 두꺼운 예산서·결산서를 들여다보겠습니까. 확인하려면 아는 사람 찾아가고 정보공개청구까지 해야 하는데, 지역은 한 집 건너 아는 사이라 그것도 곤란합니다. 결국 우리 혈세가 어떻게 쓰이는지 아무도 모르게 되는 겁니다.","★ 그래서 제가 직접 만들었습니다. '김보미365' — 강진의 예산 집행 현황을 모두가 볼 수 있게 공개하는 웹사이트를 개발했습니다. 지금은 재정주권시민행동 공동대표로 활동하면서, 김보미닷컴에 전국 지자체 재정을 3초 만에 진단하는 홈페이지를 만들어 확산하고 있습니다.","★ 그런데 놀라운 것을 발견했습니다. 우리가 낸 혈세가 집행되는 내역은 다 볼 수 있는데, 정작 정당의 돈은 볼 수가 없습니다. 사후에, 그것도 열람만 가능합니다. 민주당 홈페이지에 들어가 봤더니 딸랑 PDF 한 장으로 분기 보고를 하고 있더군요. 울릉군도 공개하는 재정을, 공당이 이렇게 운영합니다.","★ 이 깜깜이 예산 뒤에 당직자 카르텔이 있습니다. 중앙당 국장이 국회의원보다 무소불위라는 말이 나올 정도의 철밥통입니다. 오죽하면 전남도당 처장을 한번 하면 아파트를 산다고 서로 오려고 하고, 한 번 더 하려고 용쓴다는 소리까지 들리겠습니까. 당헌·당규를 주무르는 법기술자 같은 국장들의 카르텔을 격파하고, 능력 있는 청년 인재들로 교체해 물갈이해야 합니다.","★ 어렵지 않습니다. 돈 쓰는 내역만 공개돼도 알아서 물갈이되고 혁신됩니다. 공개가 시작되면 행정이 바뀝니다 — 강진에서 제가 해 봤습니다. 국고보조금·당비 1원까지 실시간 공개, 그것이 당권재민의 시작입니다."],"notes":["이력 피력을 겸하는 핵심 서사 — '왜 정치하나·무슨 능력 있나' 질문에도 이 흐름으로 연결 가능. ⚠'아파트 산다' 소문은 소문 인용임을 명시('~는 소리까지 들린다')하고 특정인·실명 언급 금지."]},{"no":1420,"media":"SBS뉴스브리핑","q":"[배경 브리핑] '선배님들도 젊을 때 똑같이 외쳤다'의 근거 + 386 실책 리스트 (반박·역공용)","tags":["젊은피수혈","정풍운동","3김청산","김민새","막말","돈봉투","근거자료","SBS뉴스브리핑"],"quotes":[["근거① 김대중의 젊은 피 수혈 (1996·2000)","김대중 총재는 1996년 15대 총선에서 32세 김민석을 공천해 최연소 당선시켰고(당선자 299명 중 최연소), 2000년 16대 총선에서 송영길·임종석·이인영 등 386 운동권을 대거 영입했습니다. 그때 그분들이 내건 구호가 바로 낡은 정치 청산, 정치개혁, 세대교체였습니다. → '그때는 되고 지금은 왜 안 됩니까.'"],["근거② 정풍운동 (2000~2001)","젊은 소장파(천정배·신기남·정동영 등)가 동교동계 권노갑 최고위원 등 당 최대 기득권을 향해 '2선 후퇴'를 공개 요구한 사건. 젊은 의원들이 기득권 퇴진을 요구한 것 — 지금 제가 드리는 '아름다운 퇴장' 요청과 정확히 같은 구조입니다."],["근거③ 송영길 본인의 인정","송영길 후보 스스로 최근 '우리도 3김 청산을 외쳤지만 김대중 유산을 버리지 않았다'고 반박했습니다. 3김 청산을 외쳤다는 사실을 본인이 인정한 것입니다. → '3김 청산을 외치던 그 청년을 발탁한 분이 김대중입니다. 그때의 청년 송영길에게 길을 열어준 것이 유산이라면, 지금의 청년에게 길을 여는 것이 그 유산의 계승입니다.'"],["실책① 김민석 — '김민새' 철새 논란 (2002)","2002년 대선 직전 노무현 후보 지지율이 떨어지자 탈당해 정몽준 지지 선언(국민통합21행), 정몽준이 대선 전날 지지 철회하자 복당 시도 — '철새 정치인 김민새를 복당시켜선 안 된다'는 비판 비등(경향신문). 이후 정치자금 문제로 오랜 공백. → 위기 때 당을 떠난 분이 적통을 말할 수 있습니까."],["실책② 송영길 — 최근 막말 3연발 (7.14~15 확인)","'옛날 같으면 정청래는 역적으로 목이 잘려'(7.14 호남향우회), '스토커'(7.14 CBS), '낙태했어야 하는데 낳았다는 말과 같다'(7.15 MBC, 진행자 지적에도 반복) — 경향신문 '도 넘은 막말 전략' 보도. + 돈봉투 재판, 김보미 공개 석상 고함. → 언어가 곧 정치의 품격입니다."],["실책③ 정청래 — 막말 이력과 컷오프 (2016)","2016년 총선에서 막말 논란 등으로 공천 컷오프 — 당시 본인과 지지자들이 '부당한 컷오프, 밀실 결정'이라며 강하게 반발했습니다. → 컷오프의 부당함을 가장 잘 아시는 분이, 청년을 5일 만에 컷오프하는 예비경선 구조에는 왜 침묵하십니까. + 당대표 시절 정부 요구 개혁법안 27% 처리로 엇박자 논란."]],"script":["★ (활용 예시) 저더러 역사의식이 없다, 선배를 공격한다 하시는데 — 1996년 서른두 살에 최연소 국회의원이 되신 분, 2000년 젊은 피 수혈로 국회에 들어오신 분들, 그리고 3김 청산을 외치셨다고 스스로 말씀하신 분이 지금의 세 후보입니다. 저는 그분들이 청년일 때 외쳤던 말을 똑같이 외치고 있을 뿐입니다. 그때는 맞고 지금은 틀립니까."],"notes":["⚠ 사용 주의: 김민석 철새 논란·정청래 컷오프는 언론 보도로 확립된 사실이지만 방송에서는 조롱 톤('김민새' 별명 직접 호명) 금지 — '위기 때 당을 떠나셨던 분' 수준으로. 송영길 돈봉투는 재판 관련 캠프 기존 주의(무죄 판결 언급 리스크) 유지 — '돈봉투 논란'까지만. 막말 3연발은 날짜·매체까지 확인된 사실."]},{"no":1001,"media":"YTN뉴스명당","q":"1. '짱돌과 화염병' 외치며 선배들에게 아름다운 퇴장 요구하셨다. 기대하셨던 반응들 있었나?","tags":["짱돌과화염병","아름다운퇴장","세대교체","686","YTN뉴스명당"],"script":["★ 뜻밖의 반응이 있었습니다. 60~70대 어르신들께 정말 많은 연락을 받았습니다. 특히 실제로 현장에서 짱돌을 들었던 당 선배님들이 직접 전화를 주셔서 '네 말이 맞다'고 공감해 주셨습니다. 저는 거기서 민주당의 미래와 희망을 확인했습니다.","저에게 역사의식이 없다고 비난하시는 분들도 계십니다. 제가 왜 모르겠습니까. 제가 지금 이렇게 비판할 자유도 선배님들이 만들어 주신 민주주의 덕분이라는 것을 누구보다 잘 알고 있습니다. 민주화운동에 대한 존중은 기본 전제입니다. '짱돌과 화염병'은 그 세대가 가장 잘 아는 그 세대의 언어이고, 저는 선배님들이 그때 기성 질서를 향해 외치셨던 질문을 지금 똑같이 외치고 있는 것뿐입니다.","★ 민주주의는 권력을 얻는 것으로 끝나는 게 아니라, 다음 세대에게 그 정신을 넘겨줄 때 완성되는 것 아닙니까. 그래서 저는 비난이 아니라, 정중히 세대교체를 요청드리는 것입니다.","다만 지금 경쟁 중인 후보님들로부터는 직접적인 반응은 없었습니다. 몹시 불쾌해하시는 분위기는 전해집니다. 솔직히 개인적으로는 조금 무섭기도 합니다. 그래도 할 말은 해야지요. 청년들이 점잖게 말할 때는 아무도 들어주지 않았으니까요.","★ 산업화 세대가 민주화 세대에게 대한민국을 넘겨주었듯이, 이제 민주화 세대가 미래세대에게 민주당을 넘겨줄 때입니다. 가장 위대한 계승, 가장 아름다운 퇴장을 저 김보미가 준비해 드리겠습니다."]},{"no":1002,"media":"YTN뉴스명당","q":"2. 오히려 송영길 후보에게 후보 자격 논란을 말했다가 된통 호통을 들으셨다고. 구체적으로 어떤 상황이었는지?","tags":["송영길","고함","자격논란","과정의불공정","YTN뉴스명당"],"script":["서울시의회 의장실 접견 자리였습니다. 의장님과 의원님들, 직원분들까지 계신 공개된 자리에서 송영길 후보께서 제 페이스북 글을 두고 고함을 치셨습니다. 다른 분들이 계시니 별도로 통화하자고 정중히 부탁드렸는데도 호통은 계속됐습니다. 방송에서 김보미에게 하시는 그런 수준이 아니라, 그보다 두세 배는 셌다고 보시면 됩니다.","★ 논점을 분명히 하고 싶습니다. 저는 인물을 비교하거나 평가한 것이 아니라, 절차의 공정을 지키라고 말한 것입니다. 당헌·당규에 예외 조항이 있는 걸 몰라서 한 말이 아닙니다. 본인 등록 서류를 당에서 알아서 챙겨주는 경우가 세상에 어디 있습니까 — 그게 제 질문의 본질입니다. 2022년 청년 박지현은 '입당 6개월 미만'을 이유로 후보 자격조차 얻지 못했는데, 이번에는 같은 6개월 규정에 걸린 686 선배에게 긴급 최고위 논의와 다음 날 비공개 최고위 의결로 길이 열렸습니다.","★ 더 안타까운 것은 경선 구조입니다. 후보끼리 토론이나 대화의 장이 단 한 번도 없어서 공식적으로 의견을 나눌 기회 자체가 없습니다. 어렵게 기탁금을 구해 등록했는데, 제대로 된 선거운동 기회도 없이 동영상 한 번 촬영하는 것이 전부였습니다. 이런 구조에서는 고함이 대화를 대신하게 됩니다.","섭섭하실 수는 있습니다. 그러나 여러 사람 앞에서 고함치며 윽박지르는 것은 인격무시 행위입니다. 정견발표에서 공개적으로 사과를 요청드렸지만 끝내 사과는 없었습니다. 저도 당대표 후보입니다. 존중해 주시기 바랍니다.","★ 돌이켜 보면, 제가 지금까지 외쳐 온 모든 것 — 청년을 향한 이중잣대, 고무줄 규칙, 경청 없는 기득권 정치 — 그 전부를 어제 그 장면 하나가 딱 보여줬다고 생각합니다. 왜 세대교체인가, 왜 대전환인가. 그 답이 바로 그 현실 장면에 있습니다."]},{"no":1003,"media":"YTN뉴스명당","q":"3. 반면 이재명 대통령께선 후보님 SNS를 팔로우해 화제가 되기도 했다. 혹시 그외 직접적인 연락은 없었는지?","tags":["대통령팔로우","이심","낙점설","기탁금","YTN뉴스명당"],"script":["없었습니다. 팔로우 외에 별도의 직접적인 연락은 없었습니다.","★ 저는 그것을 청년 정치인이자 국민의 한 사람으로서 던진 목소리에 대통령께서도 관심을 갖고 경청해 주시는 차원이라고 받아들입니다. 실제로 대통령께서는 청년들의 경제 사정을 고려해 기탁금 문제까지 제기하셨습니다. 감사한 일이지만, 그 이상도 이하도 아닙니다.","낙점설이니 사주설이니 하는데, 분명히 말씀드립니다. 저는 누구의 낙점도 사주도 아니고, 당원의 선택으로 여기까지 왔습니다."]},{"no":1004,"media":"YTN뉴스명당","q":"4. 이번 민주당 전당대회… 자기정치, 적통, 선호투표제 논란부터 최근에는 기탁금 논란, 신천지 개입설에 차량 습격까지. 정상이라고 보시나?","tags":["전당대회","적통","선호투표제","기탁금","자기정치","차량습격","YTN뉴스명당"],"quotes":[["배경 브리핑 (7.22 확인)","차량 습격: 7.20 저녁 여의도 당사 앞에서 50대 남성이 정청래 후보 차량 공격(재물손괴·인명피해 없음), 7.22 검거. 경찰 '민주당원 여부 확인 불가'. → 언급 시: '정치인에 대한 폭력은 어떤 이유로도 정당화될 수 없습니다. 증오를 조직하는 정치가 계속되는 한 반복됩니다.'"]],"script":["정상이 아닙니다. 국민 눈에 어떻게 보이겠습니까. 정책 경쟁은 실종되고, 누가 원조 친명인지 누가 더 적통인지를 두고 족보 캐기만 하고 있습니다. 국민은 아무 관심이 없습니다.","하나하나가 다 같은 뿌리입니다. 적통 논쟁은 족보정치, 선호투표제 논란은 '결과를 공개하지 않는 가짜 1인 1표', 기탁금은 청년의 출입문을 막는 돈의 장벽입니다. 저는 그 1,000만 원이 없어서 등록 당일 다섯 군데서 빌렸습니다. 기탁금은 깎아줄 것이 아니라 없애야 합니다.","★ 게임 도중에 심판이 규칙을 바꾸고, 결과도 공개하지 않는 선거 — 전 세계에서 유권자와 후보자가 선거 결과도 모르는 선거는 민주당이 유일합니다. 이 비정상을 끝내자는 것이 제 출마 이유입니다."]},{"no":1005,"media":"YTN뉴스명당","q":"4-1. 최근에는 신천지 개입 의혹이 가장 큰 화두인 듯. 지방의회서 잔뼈 굵으시고 정치경력도 상당하신데, 혹시 보고 들으신 것 있으셨나?","tags":["신천지","불법당원","전수조사","조직동원","YTN뉴스명당"],"quotes":[["배경 브리핑 (7.22 공방)","김민석 '신천지는 비유법이 아니라 실체법, 반명·분열주의와 사실상 연합' vs 정청래 '정교분리 위반, 반드시 죗값' vs 송영길 '통일교·신천지 특검 조사 필요'. 친명계 제보센터 설치, 친청계 '근거 없으면 사퇴' 요구. 당 공식: '예의주시 중이나 아직 확인 안 됨'(7.22)."]],"script":["특정 종교의 개입 여부를 제가 단정할 수는 없습니다. 단정이 아니라 검증을 요구하는 겁니다.","★ 다만 의혹이 사실이라면, 자신의 투표권을 대리인에게 넘긴 명백한 불법 당원입니다. 불법당원을 전수조사하고 모두 솎아낸 뒤에 경선을 해야 합니다.","그리고 현장에서 8년을 보낸 사람으로서 말씀드리면, 조직을 동원해 억지로 입당시키고 휴대폰 전화만 기다리게 하는 경선 문화는 어제오늘 일이 아닙니다. 유령당원·불법당원이 후보자를 뽑는 구조 자체가 문제입니다. 이 구조를 방치하니 이런 의혹이 파고드는 것입니다. 가짜 당원을 솎아내고 경선 결과를 100% 공개하는 것, 그것이 근본 해법입니다."]},{"no":1006,"media":"YTN뉴스명당","q":"5. 유시민 작가가 한 번씩 던지는 돌도 큰 파장을 낳고 있다. ABC론-재건축론-필패론-어물전론까지. 이에 대해선 어떻게 보시는지?","tags":["유시민","필패론","쓴소리","대전환","어물전론","ABC론","YTN뉴스명당"],"quotes":[["배경 브리핑 (발언 정리·사실확인 7.22)","타임라인: ABC론(3월 매불쇼) → 재건축론(6월, '재건축하려면 기존 입주자 동의 받아야') → 필패론(7.15, '필연적 실패의 길') → 뉴이재명 수장·어물전(7.22, JTBC 유튜브 2분News: '모든 어물전은 다 썩는다, 썩은 내 나기 전 정화해야'). 친명계 격앙 — 김민석 '동지의 언어에 필패·썩은내라는 단어는 없다', 정청래 '노코멘트'. 언론은 '전당대회용 아니냐' 분석."],["간략 버전 (시기·개입 프레임)","왜 하필 이 시기인지, 안타깝습니다. 쓴소리 자체는 경청해야 합니다. 그런데 전당대회를 코앞에 두고 필패론에 어물전 발언까지 연달아 나오니, 취지가 무엇이든 진의는 왜곡되고 '전당대회용 아니냐'는 해석만 낳고 있습니다. 지금은 당원들이 스스로 선택할 시간입니다. 선거는 흔들지 말아 주십시오. 원로의 역할은 개입이 아니라 지켜봐 주시는 것이라고 생각합니다."]],"script":["표현은 다 다르지만 관통하는 메시지는 하나라고 봅니다. '이대로는 안 된다', 그리고 '쓴소리하는 사람을 쫓아내지 말라'는 것입니다. 어물전론 그대로입니다 — 비린내가 난다고 후각이 예민한 사람을 쫓아내면 결국 생선이 다 썩습니다. 쓴소리는 경청해야 합니다. 저부터가 당에 쓴소리를 하는 사람이니까요.","다만 저는 실패를 예언하러 나온 사람이 아니라, 성공시키러 나온 사람입니다. 정부의 성공은 대통령 혼자 만드는 것이 아니라 당이 만드는 것입니다. 지금처럼 계파 싸움으로 발목을 잡는 민주당이야말로 '필연적 실패의 길'입니다.","재건축 이야기가 나오는데, 저는 한발 더 나가 '대전환'을 하자는 사람입니다. 홍대선언에 담았습니다. 시스템으로 움직이는 디지털 정당으로 완전히 바꾸자는 겁니다.","★ 한 가지만 덧붙이면, 쓴소리에 문자폭탄으로 답하는 정당에는 미래가 없습니다. 쓴소리일수록 경청하는 것이 당내 민주주의이고, 그래야 당도 정부도 삽니다."],"notes":["⚠ 사실확인: 유시민의 '(대통령이) 전화 안 했다'류 발언은 언론 보도에서 확인되지 않음 — 방송에서 언급 금지. '정권 내내 조용하다가'도 부정확(3월 ABC론, 6월 재건축론 등 계속 발언) — '전당대회 앞두고 연달아 세게'로만 표현할 것. 시기·개입 비판은 '간략 버전' 워딩 사용."]},{"no":1007,"media":"YTN뉴스명당","q":"6. 민주당은 청년 의제에 관심이 많다. 후보님도 '세대교체'와 '청년'을 기치로 출마하지 않으셨나. 구체적으로 어떤 변화가 필요하다고 보시나?","tags":["청년결정권","청년최고위원","기탁금폐지","청년예산","YTN뉴스명당"],"script":["말이 아니라 권한이 필요합니다. 지금 민주당에서 청년은 선거철마다 동원되고 이용되지만 실질적 권한은 하나도 없는 병풍입니다.","★ 세 가지입니다. 첫째, 당 청년위원회를 청년정책의 최고 의결기구로 격상해 그 결정이 당론 입법으로 이어지게 합니다. 둘째, 당 예산의 10%를 청년이 직접 편성·집행·평가하게 합니다. 셋째, 기탁금을 폐지하고 당직선거 공영제를 도입해 돈 없어도 도전할 수 있는 링을 만듭니다.","청년최고위원 한 자리 준다고 청년정당이 되는 것이 아닙니다. 자리가 아니라 예산과 결정권 — 청년을 들러리가 아니라 주주로 만드는 것입니다."]},{"no":1008,"media":"YTN뉴스명당","q":"6-1. 전당대회 출마한 후보들은 다 알겠고, 내가 되면 바꾸겠다고 말한다. 믿어지시나?","tags":["청년공약","말과기록","청년최고위원부결","YTN뉴스명당"],"script":["★ 솔직히 말씀드리면, 믿어지지 않습니다. 지금 모든 후보가 청년, 청년을 외치고 계시지만, 그분들이 지금까지 정치하시는 동안 2030 청년이 민주당에 등을 돌렸습니다. 허공에 구호처럼 외치실 뿐, 진정성은 1도 느껴지지 않습니다. 그래서 제가 직접 나와서 외치고 있는 겁니다 — 제발 청년 말 좀 들어달라고요.","★ 민주당이 어떻게 하는지 보십시오. 선거철에 청년을 앞줄에 세워 사진 찍고, 선거가 끝나면 돌려보냅니다. 기자회견할 때 병풍처럼 세워 놓고 사진 찍고 돌려보내는 들러리 — 그것이 민주당에서 청년의 자리였습니다.","기록이 말해줍니다. 전준위가 전원일치로 결의한 선출직 청년최고위원 하나를 최고위에서 부결시켰습니다. 청년에게 기회를 준다면서 기탁금은 올려버렸습니다. 청년이 낸 원서는 접수조차 안 받았습니다. 국민의힘조차 하고 있는 청년최고위원을 민주당은 계파싸움 하느라 부결시켰습니다. 청년을 강제로 퇴장시키는 결정을 계속하면서 내놓는 청년 공약이 무슨 소용입니까.","이번에는 정말 그 약속들을 지키셨으면 좋겠습니다. 하지만 크게 기대하지는 않습니다. 저는 다릅니다. 저는 당하며 배운 사람입니다. 취임 당일 1호 안건으로 청년최고위원 당헌 개정을 발의해 30일 안에 완료하겠다고 문서로 약속했습니다. 믿어달라고 말하지 않겠습니다. 기록과 문서로 판단해 주십시오."]},{"no":1009,"media":"YTN뉴스명당","q":"7. 여론조사들 보면 본경선 가능성 크지 않은 것도 사실. 전당대회 이후 후보님의 계획은 어떻게 되시나?","tags":["전당대회이후","오뚝이","호남","평생약속","YTN뉴스명당"],"script":["본선에 가든 가지 않든, 제가 한 약속은 평생이 걸리더라도 지킬 것입니다. 제 별명이 똑순이, 오뚝이입니다. 넘어질 때마다 다시 일어났습니다.","★ 저는 이번 경선에서 확인했습니다. 당락의 유불리가 아니라 가치를 보고 표를 던지는 당원들이 있다는 것을, 자신의 젊은 날을 기억하며 청년의 도전에 손을 내미는 시민들이 있다는 것을 — 가슴 깊숙한 울림으로 확인했습니다. 그 한 표 한 표가 바위에 금을 내고 있습니다.","★ 규칙을 만든 사람들의 정당, 기득권이 다 해먹는 정당을 끝내고, 침묵하는 다수의 소리를 듣는 정당을 만드는 데 평생을 바치겠습니다.","★ 과거에 복수하며 싸우는 정당을 끝내고, 미래의 언어로 일하는 정당을 만들겠습니다. 새로운 민주당을 존경하는 당원 여러분, 그리고 묵묵히 김보미를 응원해 주시는 국민 여러분과 함께 만들겠습니다. 호남에서, 현장에서 계속 정치하겠습니다.","구체적으로는 두 가지입니다. 전당대회가 계파 갈등이 아니라 청년·서민·지역을 살리는 정책을 이야기하는 장이 되도록 새로운 아젠다 제안에 힘을 보태고, 홍대선언대로 젊은 세대가 참여하는 민주당의 디지털 플랫폼을 만드는 운동을 시작하겠습니다."]},{"no":1010,"media":"YTN뉴스명당","q":"7-1. 유력 당대표 후보들 모두가 개혁과 쇄신의 대상이라며 지르신 부분 있다. 후환이 두렵지는 않으신지?","tags":["후환","표적징계","탈탈털림","용기","YTN뉴스명당"],"script":["★ 두려웠으면 시작도 안 했습니다. 그리고 후환이라면 이미 다 겪었습니다. 강진에서 집행부에 따져 묻고 낭비예산을 삭감했다는 이유로 표적 징계에 제명, 수사, 허위사실 보도와 언론 조리돌림까지 — 그야말로 탈탈 털렸습니다.","잃을 것이 없는 사람이 가장 용감합니다. 저는 지킬 자리도, 챙겨줄 계파도, 신세 진 사람도 없습니다. 그래서 청년이 나서야 하는 겁니다.","가만히 있으면 안전했겠지요. 하지만 가만히 있는 정치를 하려고 정치를 시작한 것이 아닙니다. 민심은 권력보다 강합니다. 저는 민심만 두려워하겠습니다."]},{"no":1011,"media":"YTN뉴스명당","q":"8. 계파 분열과 공방전으로 당에 상처도 많이 생겼다. 전당대회 이후의 민주당 어떻게 전망하시는지?","tags":["분열","통합","재집권","민주진보세력","YTN뉴스명당"],"script":["대통령께서 통합을 원하고 계시고, 누가 당선되든 새 대표도 통합을 내세울 겁니다. 지금은 당권을 두고 치열하게 경쟁해서 그렇지, 전당대회가 끝나면 통합의 길로 가야 하고, 갈 것이라고 봅니다.","다만 조건이 있습니다. 겉으로만 통합을 말하면서 집권 여당 대표가 아니라 '집권 야당 대표'처럼 사사건건 정부와 엇박자를 낸다면 분열은 더 깊어질 수 있습니다.","★ 소인배처럼 당권과 대권에만 빠져 허덕이는 정치가 아니라 국가와 국민을 보고 정치를 해야 합니다. 재집권에 실패하면 다시 계엄입니다. 친명·친청이 힘을 합치는 것은 기본이고, 모든 민주진보세력이 합쳐야 합니다. 그 통합의 접착제가 바로 공정한 시스템입니다. 규칙이 공정하면 결과에 승복하고, 승복하면 분열은 없습니다."]},{"no":1012,"media":"YTN뉴스명당","q":"9. 오늘(23일) 예비경선 결과 발표. 왜 김보미여야 하는지, 못했던 이야기 있다면 시원하게 부탁드린다.","tags":["예비경선","계란은생명","도전의역사","클로징","당직자카르텔","사무처쇄신","재정공개","YTN뉴스명당"],"script":["★ 못했던 이야기, 딱 하나만 하겠습니다. 지금 민주당 안에는 아무도 말하지 않는 심각한 문제가 있습니다 — 부패한 당직자 카르텔입니다. 정당의 주인은 당원이라는데, 실제 권력은 아무도 견제하지 못하는 당직자의 무소불위 권력과 성역화된 깜깜이 예산에 있습니다. 당직자가 당헌·당규를 주무르며 '단, 달리 정할 수 있다'는 예외조항을 설계해 주는 법기술자 노릇을 하고, 국회의원은 임기라도 있지 국장급 당직자는 퇴직까지 철밥통입니다. 저는 경선 국면에서 제 명의로 투서를 써 달라는 요청까지 직접 받아 봤습니다.","★ 그래서 약속드립니다. 철밥통 사무처를 엄정한 징계와 성과 평가로 '젊고 치열한 사무처'로 전면 쇄신하고, 국고보조금·당비를 1원까지 실시간 공개하고, 정당 재정에 외부 감사를 도입하겠습니다. 공무원도 하는 재정 공개를 왜 정당만 성역입니까. 686 기득권 + 법기술자 당직자 + 깜깜이 예산, 이 삼각 카르텔을 깨야 진짜 당권재민이 시작됩니다.","★ 한 말씀 더 드리겠습니다. 지금 저는 양쪽 진영에서 악플과 문자 폭격을 동시에 받고 있습니다. 우쭈쭈해 주신다고 누구 대신 칼잡이 노릇할 생각 없습니다. 논점 흐리지 마시고, 왜곡하지 마시고, 허위사실 유포하지 마십시오. 전부 기록하고 캡처해 두고 있습니다. 선거가 끝나면 명백한 허위사실 유포는 법적 조치를 포함해 끝까지 바로잡겠습니다.","★ 총선에 이기려면 2030이 필요하고, 대선에 이기려면 김보미가 필요합니다. 686 세 분으로만 본경선을 치르면 국민들 눈에 민주당은 어제의 정당으로 보일 것입니다. 김보미가 올라가는 순간, 전당대회는 가장 역동적인 무대가 됩니다.","민주당은 원래 도전의 역사입니다. 김대중도, 노무현도 처음엔 다 계란이었습니다. 군사독재라는 바위에, 지역주의라는 바위에 계란으로 부딪치며 민주당의 역사를 만드셨습니다. 민주당의 적통은 혈통도 인맥도 아니고, 계란으로 바위를 쳤던 그 도전 정신입니다.","★ 다들 제 도전을 '계란으로 바위치기'라고 합니다. 맞습니다. 저는 오늘도 계란입니다. 하지만 바위는 40년 비를 맞아 허물어지기 직전이고, 계란은 생명을 품고 있습니다. 저는 죽어도 다음 세대는 살아야 하지 않겠습니까. 이번 생엔, 계란으로 바위를 깨 보겠습니다."]},{"no":1013,"media":"YTN뉴스명당","q":"[돌발 대비] '그래서 대안이 뭐냐, 어떻게 바꿀 거냐' — 청문회 수준의 검증 질문을 받을 때","tags":["대안검증","공약집","비전제시","젊은피수혈","김대중","이중잣대","YTN뉴스명당"],"script":["★ 이번 전당대회에서 공약집을 발표한 사람은 저밖에 없습니다. 출마선언에서 5대 분야 25개 약속(김보미닷컴에 전부 공개), 7월 21일 대전환을 위한 11대 공약, 그리고 어제 홍대선언의 디지털 정당 12대 약속까지 — 경선 룰 6개월 전 확정부터 재정 10원까지 공개, 청년취업보장제와 3대 메가프로젝트까지, 언제 무엇을 어떻게 바꿀지 문서로 다 내놨습니다. 대안이 뭐냐고 물으신다면, 대안을 문서로 내놓은 유일한 후보가 접니다.","당대표 후보의 기조를 검증하는 것은 당연합니다. 얼마든지 검증받겠습니다. 그런데 당대표의 역할이 무엇입니까. 실무를 다 하는 자리가 아니라 비전을 제시하고 방향을 세우는 자리 아닙니까. 유독 청년 후보에게만 청문회 수준의 심층면접을 하시면서, 왜 시작부터 '못할 것'이라고 단정하십니까. 솔직히 이 현실이 서글픕니다.","★ 김대중 대통령께서는 '젊은 피 수혈'로 청년 김민석·송영길을 대거 영입하셨습니다. 그때 그 청년들이 민주당의 혁신을 이끌지 않았습니까. 본인들이 그렇게 잘해 놓고, 왜 지금의 청년에게는 못 맡긴다고 하십니까. 그러면 그때 본인들이 잘못했다는 말씀입니까.","청년이라서 못하는 것이 아닙니다. 기회를 주지 않아서 못 해 본 것뿐입니다. 김대중의 답이 옳았다면, 지금의 답도 같습니다 — 청년에게 맡겨 보십시오."]},{"no":1014,"media":"YTN뉴스명당","q":"[통합 답변] 송영길 호통 + 사방에서 받는 비난 — 하나로 이어서 답할 때","tags":["송영길","고함","진영논리","악플","문자폭탄","우쭈쭈","허위사실","통합답변","YTN뉴스명당"],"script":["송영길 후보 이야기부터 드리면, 서울시의회 의장실 접견 자리였습니다. 의장님과 의원님들, 직원분들까지 계신 공개된 자리에서 제 페이스북 글을 두고 고함을 치셨습니다. 별도로 통화하자고 정중히 부탁드렸는데도 호통은 계속됐습니다. 방송에서 보시는 그런 수준이 아니라 두세 배는 셌다고 보시면 됩니다.","★ 저는 인물을 평가한 것이 아니라 절차의 공정을 지키라고 말한 것뿐입니다. 본인 등록 서류를 당에서 알아서 챙겨주는 경우가 세상에 어디 있습니까. 2022년 청년 박지현은 '입당 6개월 미만'을 이유로 후보 자격조차 얻지 못했는데, 이번에는 같은 6개월 규정에 걸린 686 선배에게 긴급 최고위 논의와 다음 날 비공개 최고위 의결로 길이 열렸습니다. 그런데 공정을 물었더니 호통이 돌아왔습니다.","그리고 그날 이후로 지금까지, 여기저기서 비난을 받고 있습니다. 역사의식이 없다, 왜 나왔냐, 누구 떨어뜨리려 나왔냐. 양쪽 진영에서 악플과 문자 폭격이 동시에 쏟아집니다. 제가 이쪽을 지적하면 저쪽에서 '우쭈쭈' 해주시고, 저쪽을 지적하면 이쪽에서 '우쭈쭈' 해주십니다. 진영논리에 따라 논점은 왜곡되고, 글의 논리는 무시된 채 비틀립니다.","★ 분명히 말씀드립니다. 저는 누구를 떨어뜨리기 위해 나온 것이 아니라 당선되기 위해 나왔고, 우쭈쭈해 주신다고 누구 대신 칼잡이 노릇할 생각도 전혀 없습니다. 그리고 논점을 흐리고 왜곡하는 것, 허위사실을 유포하는 것은 전부 기록하고 캡처해 두고 있습니다. 선거가 끝나면 명백한 허위사실 유포는 법적 조치를 포함해 끝까지 바로잡겠습니다.","★ 돌이켜 보면 이 모든 장면 — 공개 석상의 호통, 진영에 따라 뒤바뀌는 환호와 비난, 청년을 향한 이중잣대 — 제가 지금까지 외쳐 온 전부를 이 장면들이 딱 보여주고 있습니다. 왜 세대교체인가, 왜 대전환인가. 그 답이 바로 이 현실 장면들에 있습니다."]},{"no":901,"media":"뉴스바사삭","part":"뉴스바사삭","label":"오늘 방송","q":"1. 정견발표 발언이 큰 화제였습니다. 언론 인터뷰에서 가장 많이 받은 질문은 무엇이었습니까?","tags":["출마이유","김어준","돌풍","계파없음","뉴스바사삭"],"script":["단연 '왜 나왔느냐'입니다. 정청래 공격하러 나왔냐, 김민석 도와주러 나왔냐, 누구 떨어뜨리러 나왔냐 — 표현만 다르지 결국 다 같은 질문이었습니다.","그런데 생각해 보십시오. 이 질문 자체가 지금 민주당의 현주소입니다. 청년이 나오면 '왜 나왔느냐'부터 묻습니다. 686 선배들이 출마할 때 왜 나왔느냐고 묻는 사람, 아무도 없지 않습니까. 청년의 도전은 이유부터 검증받아야 하는 것, 그게 기득권 정당의 풍경입니다.","민주당은 원래 도전의 역사입니다. 김대중도, 노무현도 처음엔 다 계란이었습니다. 군사독재라는 바위에, 지역주의라는 바위에 계란으로 부딪치며 민주당의 역사를 만드셨습니다. 민주당의 적통은 혈통도 인맥도 아니고, 계란으로 바위를 쳤던 김대중·노무현의 도전 정신입니다. 저는 그 도전의 적통을 잇겠다고 나왔습니다.","제 답은 처음부터 하나였습니다. 저는 당선되러 나왔습니다. 공정도, 민주주의도, 청년도, 미래도 사라진 죽어가는 민주당을 살리러 나왔습니다.","김어준 총수는 한발 더 나가서 '당선될 리도 없는데 정청래 저격하러 나온 것 아니냐'고 끈질기게 물으셨죠. 오늘도 같은 답을 드립니다 — '질 것 같으면 나오지 마라', 이게 바로 기득권의 언어입니다. 김대중·노무현이 그 말을 들었다면 오늘의 민주당은 없습니다.","네, 다들 제 도전을 '계란으로 바위치기'라고 합니다. 맞습니다. 저는 오늘도 계란입니다. 하지만 바위는 40년 비를 맞아 허물어지기 직전이고, 계란은 생명을 품고 있습니다. 저는 죽어도 다음 세대는 살아야 하지 않겠습니까. 이번 생엔, 계란으로 바위를 깨 보겠습니다."],"quotes":[["김보미 (최신 워딩)","청년이 나오면 '왜 나왔느냐'부터 묻습니다. 686이 출마할 땐 아무도 묻지 않습니다."],["김보미 (기존 발언)","김대중도 노무현도 처음엔 다 계란이었습니다. 민주당의 적통은 혈통이 아니라 계란으로 바위를 쳤던 도전 정신입니다."],["김보미 (최신 워딩)","'질 것 같으면 나오지 마라' — 김대중·노무현이 그 말을 들었다면 오늘의 민주당은 없습니다."]],"notes":["오프닝 강화판: 질문 3종 후킹 → 현주소 반전 → 민주당=도전의 역사(DJ·노무현 계란 계보, 적통=도전 정신) → 당선되러 나왔다 → 김어준 반격."]},{"no":902,"media":"뉴스바사삭","part":"뉴스바사삭","label":"오늘 방송","q":"2. 정청래 의원을 직접 거명하며 강도 높게 비판했습니다. '사이다'라는 환호도 받았지만 이후 당내에서 껄끄럽지는 않으신지?","tags":["정청래","노무현2%","김대중","꼰대","이생망중꺾마","문자폭탄","뉴스바사삭"],"script":["당연히 시끄러웠죠. 댓글 달리는 걸 보면서 솔직히 공포에 떨기도 했습니다. 그런데 제일 마음이 아팠던 건 청년의 도전을 바라보는 시선이었습니다. '당선이 어렵잖아요', '현실을 인정해야죠' — 이 말이 반복해서 날아왔습니다.","정치가 언제부터 당선 가능성이 높은 사람만 도전할 수 있는 곳이 되었습니까? 노무현은 2%로 시작했습니다. 그때 왜 안 될 사람이 나오냐고 했습니까? 김대중 대통령은 박정희 정권이 현해탄에 빠뜨려 죽이려 했던, 서슬 퍼런 군사독재 치하에서도 도전했습니다. 탄압이 심하니 포기해야 했습니까?","김어준 총수 같은 분들이 지금도 '꼰대의 언어'로 공격하고 있지만, 저는 잘 버티고 있습니다. 격려해 주시는 분들이 훨씬 많습니다. '정말 듣고 싶은 말을 해 줘서 고맙다'는 분들이 많았습니다."],"quotes":[["김보미 (최신 워딩)","정치가 언제부터 당선 가능성이 높은 사람만 도전하는 곳이 됐습니까? 노무현은 2%로 시작했습니다."],["김보미 (최신 워딩)","김대중은 현해탄에 수장될 뻔한 독재 치하에서도 도전했습니다. 탄압이 심하니 포기해야 했습니까?"]],"notes":["'공포에 떨었다' 솔직 고백 → 노무현 2%·김대중 현해탄 반격 → '격려가 더 많다' 마무리. 감정 곡선이 핵심.","진영논리 공격 이어지면 912번(지지 철회) 답변으로 연결."],"warn":"'꼰대' 표현은 김어준 1회 언급까지만. 인신 공격으로 확장 금지(캠프 지침)."},{"no":912,"media":"뉴스바사삭","part":"뉴스바사삭","label":"오늘 방송","q":"[돌발 대비] 신인규 변호사·김용민 목사 등 초반에 우호적이던 유튜버들이 '김보미가 이런 사람인 줄 몰랐다'며 지지 철회를 선언했습니다. 어떻게 보십니까?","tags":["유튜버","지지철회","진영논리","계파","공정","본경선진출","선호투표","뉴스바사삭"],"script":["네, 그 영상 저도 봤습니다. 응원도 받지만 질책도 받고 있습니다. 그런데 그 과정에서 우리 정치의 진영논리가 얼마나 심각한지 절감했습니다. 글의 논리는 무시하고, 비틀어 왜곡부터 합니다.","자신이 적으로 생각하는 대상을 공격하는 것 같을 때는 환호하시다가도, 그 말이 자신의 진영을 향하는 것 같으면 불같이 화를 내십니다. 제 말에 깊이 공감하셨다가도, 행여 자신들을 찌를까 성급히 지워내려 하십니다.","분명히 말씀드립니다. 저는 누군가를 공격하기 위해 나온 것이 아닙니다. 제가 지적한 것은 '사람'이 아니라 '과정의 불공정'입니다. 가짜 불법 당원을 솎아내 진짜 1인 1표를 만들자고 했고, 출마 자격 논란도 '사전에 당무위에서 정당하게 논의했어야 한다'는 절차와 상식의 문제를 지적한 것입니다.","안타깝게도 이것이 민주당이 청년을 바라보는 서글픈 현주소입니다. 누군가를 공격할 때 꺼내 쓰는 도구, 누군가의 배경에 서 있는 병풍 — 선거철마다 동원되고 이용되지만 실질적 권한은 하나도 없는 청년의 현실 말입니다.","그래도 힘이 납니다. '우리가 하고 싶었던 말이니 마음껏 하라'며 지지해 주시는 당원 동지들이 계십니다. 본경선에서는 지지하시는 유력 후보님들 순위대로 마음껏 찍으시고, 예비경선에서만큼은 저 김보미를 링 위에 올려주십시오. 김보미가 올라가는 순간, 전당대회는 가장 역동적인 무대가 될 것입니다."],"quotes":[["김보미 (7.22 입장문)","적을 공격할 땐 환호하다가, 자기 진영을 향하면 불같이 화를 내십니다. 이것이 진영논리의 민낯입니다."],["김보미 (7.22 입장문)","저는 사람을 공격한 게 아니라 과정의 불공정을 지적했습니다."],["김보미 (7.22 입장문)","공격할 때 꺼내 쓰는 도구, 배경의 병풍 — 이것이 민주당이 청년을 보는 서글픈 현주소입니다."],["김보미 (7.22 입장문)","본경선에선 유력 후보를 순위대로 찍으시고, 예비경선에선 김보미를 링 위에 올려주십시오."]],"notes":["최신 입장문(7.22) 기반. 흐름: 진영논리 비판 → '사람 아닌 과정' 재확인 → 청년=도구·병풍 서사 → 당원 감사 → 선호투표 전략 호소. 전당대회 흥행론('김보미가 올라가면 역동적')이 마무리 후킹."]},{"no":903,"media":"뉴스바사삭","part":"뉴스바사삭","label":"오늘 방송","q":"3. 핵심 메시지는 '세대교체'였습니다. 청년이 얼굴마담·들러리로 소모돼 온 현실 비판으로 읽혔는데, 진정한 세대교체란 무엇입니까?","tags":["세대교체","청년결정권","공천","호남","들러리","뉴스바사삭"],"script":["청년을 들러리로 생각하지 않는 것, 그게 출발입니다. 청년이 청년의 정책을 스스로 결정하게 해 주고, 청년도 공정하게 출발선에 세워주는 것입니다.","지역 이야기를 좀 해 볼까요? 지역에서는 국회의원이 왕입니다. 국회의원에게 밉보이면 아무것도 할 수 없습니다. 말 잘 듣는 청년만 클 수 있습니다. 아무리 실력이 있어도 자기 말을 안 듣거나 자기 자리를 위협할 것 같으면 가차 없이 잘라버립니다.","그래서 진정한 세대교체를 위해서는 공천 과정에서 국회의원의 입김을 완전히 차단해야 합니다. 얼굴만 젊은 사람을 앞줄에 세우는 게 아니라, 결정권을 넘기는 것 — 그게 진짜 세대교체입니다."],"quotes":[["김보미 (최신 워딩)","지역에서는 국회의원이 왕입니다. 말 잘 듣는 청년만 클 수 있습니다."],["김보미 (최신 워딩)","진정한 세대교체는 공천에서 국회의원의 입김을 완전히 차단하는 것입니다."]],"notes":["세대교체=나이가 아니라 '결정권 이전'. 국회의원 왕 서사가 가장 강력한 실감 사례."]},{"no":904,"media":"뉴스바사삭","part":"뉴스바사삭","label":"오늘 방송","q":"4. '개혁'을 앞세운 젊은 정치인들이 세대 갈라치기나 스스로 기득권화로 실망을 사기도 했습니다. 김보미도 '검증된 대안'인지 의구심이 있는데요?","tags":["자질론","검증","강진","계파없음","뉴스바사삭"],"script":["나이는 서른여섯이지만 입당한 지 13년 됐습니다. 군의원을 두 번 하고 의장도 지냈습니다. 누가 끌어준 것도 아니고, 어느 계파에 소속된 것도 아닙니다. 오직 군민만 보고 정치했습니다.","대한민국에 유력 정치인이 끌어주지 않고, 스스로 온갖 고난을 이기면서 이 자리까지 온 청년 정치인이 있으면 한번 소개해 주십시오.","표적 징계도, 제명도, 수사도 겪었습니다. 100건이 넘는 허위 보도와 싸워 손해배상 승소까지 받아냈습니다. 그런데도 제가 아직 기죽지 않고 정치를 하고 당대표에 도전하고 있다는 것, 그 자체가 제가 검증된 대안이라는 증거입니다."],"quotes":[["김보미 (최신 워딩)","끌어주는 사람 없이 스스로 고난을 이기고 여기까지 온 청년 정치인이 있으면 소개해 주십시오."],["김보미 (최신 워딩)","아직도 기죽지 않고 도전한다는 것, 그게 검증된 대안이라는 증거입니다."]],"notes":["'검증'을 경력이 아니라 '생존 서사'로 증명. 수난기(징계·제명·수사·승소)로 뒷받침."]},{"no":905,"media":"뉴스바사삭","part":"뉴스바사삭","label":"오늘 방송","q":"5. 재산, 부친의 선거 출마 이력을 거론하며 '지역 유지' 프레임으로 해석하려는 움직임이 있습니다. 입장을 밝혀주시죠.","tags":["재산","검증","기탁금","흥신소정치","뉴스바사삭"],"script":["저는 1천만 원 기탁금이 없어서 등록 당일 다섯 군데에서 빌렸습니다. 올해 신고 재산은 채무가 늘어 마이너스 9,178만 원, 빚밖에 없습니다.","아버지는 오래전 군의원에 출마하셨던 분이고 지금은 공방을 운영하십니다. 그게 '지역 유지'입니까?","그냥 자기가 지지하는 후보를 비판하니까 아무 말 대잔치를 하는 겁니다. 사진 한 장, 서류 한 줄로 사람을 재단하는 흥신소 정치는 이제 그만해야 합니다."],"quotes":[["김보미 (최신 워딩)","기탁금 1천만 원이 없어서 등록 당일 다섯 군데서 빌렸습니다. 제 재산은 빚밖에 없습니다."],["김보미 (최신 워딩)","자기 지지 후보를 비판하니까 아무 말 대잔치를 하는 것입니다."]],"notes":["숫자(마이너스 9,178만·다섯 군데)로 즉시 반박 → '아무말 대잔치' 규정 → 흥신소 정치 프레임."]},{"no":906,"media":"뉴스바사삭","part":"뉴스바사삭","label":"오늘 방송","q":"6. 이낙연 전 총리 측근으로 알려진 이진련 전 대구시의원과 찍힌 사진 등이 논란이 됐습니다. 어떻게 돌파하실 계획입니까?","tags":["계파","이낙연계","흥신소정치","세작","족보정치","뉴스바사삭"],"script":["그런 식으로 따진다면 김민석 후보와 사진 찍은 사람은 다 친석파고, 정청래 후보와 사진 찍은 사람은 다 친청파겠네요. 사진 한 장으로 계파를 판정하는 것, 그게 바로 흥신소 정치입니다.","제가 민주당에 입당한 지 13년입니다. 그동안 당대표가 수도 없이 바뀌었습니다. 회사로 치면 사장이 수차례 바뀐 건데, 그럼 저는 도대체 무슨 계파입니까? 실제로 저는 추미애 대표 때 공천받고, 이낙연 대표 때 제명되고, 이재명 대표 때 복당했습니다.","정말 황당한 건 이겁니다. 청년은 족보에 끼워 주지도 않으면서, 이제 와서 족보를 새로 발급해 주고 있습니다. 벽을 치고 못 들어오게 막아 놓고서는, 사진 한 장 나오면 '누구 파냐'고 묻습니다.","저는 계파가 없어서 챙길 사람도 없습니다. 그래서 제가 민주당 개혁을 거침없이 할 수 있는 유일한 후보입니다."],"quotes":[["김보미 (최신 워딩)","입당 13년, 당대표는 수도 없이 바뀌었습니다. 사장이 수차례 바뀌었는데 저는 무슨 계파입니까?"],["김보미 (최신 워딩)","청년은 족보에 끼워 주지도 않으면서, 이제 와서 족보를 새로 발급해 주고 있습니다. 황당합니다."],["김보미 (최신 워딩)","사진 한 장으로 계파를 판정하는 것, 그게 바로 흥신소 정치입니다."]],"notes":["보강판: 사장 교체 비유(13년간 대표 교체) + '족보 신규 발급' 역설 + 흥신소 정치 + 3代 대표 이력 + '계파 없음=개혁 적임' 마무리."]},{"no":907,"media":"뉴스바사삭","part":"뉴스바사삭","label":"오늘 방송","q":"7. 송영길 후보 자격 문제로 박지현 전 위원장을 소환하셨는데, '불가피한 복당'과 '신규 입당'은 달라 비교가 무리라는 지적도 있습니다. 문제의식이 여전히 유효합니까?","tags":["송영길김용","박지현","공정","돈봉투","고함사건","뉴스바사삭"],"script":["당헌·당규 조문을 떠나서 보시죠. 어떤 청년은 '자격이 있는지 회의를 열어 결정해 달라'고 했는데 접수조차 안 받았습니다. 어떤 686은 자격이 안 되니까 긴급 최고위에서 논의한 뒤 다음 날 비공개 최고위 의결로 등록할 길을 열어 줬습니다. 이게 본질입니다.","등록이 시작되고 나서 규정을 고치는 시험이나 면접이 세상에 어디 있습니까? 예외를 인정하려면 최소한 등록 접수 전에 했어야죠. 솔직히 말하면 '나를 어찌하랴' 하고 아무 준비도 안 하신 겁니다. 본인의 준비 부족으로 생긴 문제를 왜 남 탓, 당 탓을 합니까.","그리고 송영길 후보는 이미 당대표를 한 번 하셨습니다. 그때 청년정치를 위해, 공정을 위해, 당내 민주주의를 위해 무엇을 하셨습니까? 낡은 돈봉투 정치 논란의 책임을 지고 성찰하셔야 할 분이 두 번째 당대표를 하겠다는 것 자체가 청년들 눈엔 불공정의 끝판왕으로 보입니다."],"quotes":[["김보미 (최신 워딩)","청년은 회의를 열어달라 해도 접수조차 거부당했고, 686은 긴급 최고위 논의에 이어 다음 날 비공개 최고위 의결로 길이 열렸습니다."],["김보미 (최신 워딩)","등록 시작하고 나서 규정을 고치는 시험이나 면접이 어디 있습니까?"]],"notes":["복당/신규입당 반론을 '절차의 본질'로 재프레임. 시험·면접 비유가 대중적."],"warn":"돈봉투 관련: '법원 무죄 판단'은 사실이므로 '유죄' 단정 금지 — '논란의 책임·성찰' 수준으로. 인격 표현('게으르다' 등)은 방송에서 순화."},{"no":908,"media":"뉴스바사삭","part":"뉴스바사삭","label":"오늘 방송","q":"8. 줄곧 '공정'을 강조하셨는데, '룰'이 공정의 최고 기준이냐는 지적도 나옵니다.","tags":["공정","룰","송영길김용","경선혁신","강진공천","기탁금","중앙위원투표","뉴스바사삭"],"script":["룰이 공정의 최고 기준은 아닙니다. 하지만 최소한의 기준입니다. 그런데 우리 민주당의 룰은 '단, 이러이러한 경우 예외로 한다', '단, 달리 정할 수 있다'가 너무 많습니다. 누굴 떨어뜨리고 싶으면 얼마든지 떨어뜨리고, 자격이 안 되는 사람도 붙이고 싶으면 얼마든지 붙일 수 있는 구조입니다.","이번 전당대회만 봐도 사례가 넘칩니다. 당규상 경선에 영향을 주는 규칙은 최소 30일 전에 확정해야 하는데, 선거를 코앞에 두고 예비경선에 중앙위원 투표를 반영하는 방식으로 룰을 바꿨습니다. 제가 국회 소통관 기자회견에서 지적했던 그대로입니다. 기탁금은 선거 직전에 올렸다가 등록이 끝난 뒤에야 찔끔 깎았습니다. 입당 6개월 규정에 걸린 후보 자격은 7월 16일 밤 긴급 최고위 논의에 이어 다음 날 비공개 최고위에서 예외로 의결됐습니다.","지난 지방선거도 마찬가지입니다. 저에게는 당헌·당규에도 없는 새 지침을 만들어 기어이 15%를 감산했고, 전과 5범 후보는 감산 없이 공천했습니다. 게임 도중에, 심판이, 특정 선수를 위해 규칙을 바꾸는 겁니다.","이번 사태를 두고 어느 민주당 의원께서 '민주당은 룰이 없다'고 하셨는데, 딱 그 말이 맞습니다. 그래서 제 1호 공약이 경선 규칙 6개월 전 확정, '달리 정할 수 있다' 단서조항 전부 삭제, '고무줄 규칙' 완전 폐지입니다."],"quotes":[["김보미 (최신 워딩)","룰은 공정의 최고 기준은 아니지만, 최소한의 기준입니다. 민주당엔 그 최소한도 없습니다."],["김보미 (최신 워딩)","30일 전에 확정해야 할 규칙을 선거 코앞에 중앙위원 투표 방식으로 바꿨습니다. 게임 도중 심판이 규칙을 바꾸는 겁니다."],["김보미 (최신 워딩)","저에겐 없는 지침을 만들어 15% 감산, 전과 5범은 무감산 공천 — 이게 민주당의 룰입니다."]],"notes":["사례 4종 세트: ①중앙위원 투표 룰 변경(30일 규정 위반·기자회견 지적) ②기탁금 인상→사후 감액 ③송영길 밤10시반 구제 ④강진 15% 감산. '게임 도중 심판이 규칙 변경' 비유로 압축."]},{"no":909,"media":"뉴스바사삭","part":"뉴스바사삭","label":"오늘 방송","q":"9. 지방의회 의장으로서 쌓은 실질적 성과는 무엇이고, 그 리더십이 중앙에서도 통한다고 자신하십니까?","tags":["강진","예산","나라살림돋보기","리더십","지방의원","맘다니","뉴스바사삭"],"script":["먼저 여쭙고 싶습니다. 지방의회는 중앙의 축소판 아닙니까? 예산 심의하고, 행정 감사하고, 조례 만들고, 주민을 대변합니다. 국회가 하는 일을 규모만 작게 다 합니다. 오히려 지방의회 경험도 없이 중앙정치를 하시는 분들이 허다합니다.","해외를 보십시오. 유럽의 총리·장관들은 대부분 지방의원부터 시작해 단계를 밟아 올라옵니다. 지방부터 정치인을 양성하는 게 세계의 상식입니다. 미국 뉴욕시장 맘다니를 보십시오 — 저보다 동생뻘입니다. 그 나이에 세계 최대 도시를 이끕니다. 30대가 못할 게 뭐가 있습니까?","제 성과로 말씀드리면, 강진에서 '일문일답 군정질문'을 사상 처음 도입했고, 낭비예산 108억 원을 삭감했으며, 행정사무감사 시정요구 195건을 냈습니다. 업무추진비 전면 공개, 본회의 실시간 생중계, 전남 최초 육아수당(자녀당 월 60만 원)까지 만들어냈습니다.","그리고 '나라살림 돋보기'라는 도구를 직접 만들었습니다. 243개 지자체와 중앙정부 예산을 누구나 3초 만에 확인하는 서비스입니다. 말이 아니라 시스템을 만드는 것 — 이게 제가 일하는 방식이고, 중앙이라고 다르지 않습니다."],"quotes":[["김보미 (최신 워딩)","지방의회는 중앙의 축소판입니다. 오히려 지방의회 경험도 없이 중앙정치 하는 분들이 허다합니다."],["김보미 (최신 워딩)","뉴욕시장 맘다니는 저보다 동생뻘입니다. 30대가 못할 게 뭐가 있습니까?"],["김보미","말이 아니라 시스템을 만듭니다. 낭비예산 108억 삭감, 시정요구 195건이 제 이력서입니다."]],"notes":["보강판: ①지방의회=중앙의 축소판 반문 ②경험 없는 중앙정치인 역공 ③해외사례(유럽 단계 양성+뉴욕 맘다니 동생뻘) ④성과 숫자 ⑤나라살림돋보기. '자격 질문'을 '역량 증명'으로 전환."]},{"no":910,"media":"뉴스바사삭","part":"뉴스바사삭","label":"오늘 방송","q":"10. 후보님이 만들고 싶은 '미래형 민주당'의 청사진, 핵심 키워드 3가지로 정리해 주신다면?","tags":["공정","민주주의","청년","5무정당","모병제","청년취업보장제","신천지","뉴스바사삭"],"script":["첫째, '공정한 민주당'입니다. 지난 강진군수 경선은 불공정의 극치였습니다. 저에게는 당헌·당규에도 없는 새 지침을 만들어 기어이 15%를 감산했고, 전과 5범 후보는 감산 없이 공천을 줬습니다. 경선 규칙을 전면 혁신해 실력과 정책으로 공정하게 경쟁하는 정당을 만들겠습니다.","둘째, '민주정당 민주당'입니다. 가짜·불법 당원이 후보를 뽑고, 선거인 수도 득표수도 공개하지 않으면서 이걸 1인1표, 당원주권이라 자랑합니다. 신천지 조직 유입 의혹도 그냥 넘어가려 합니다. 경선 룰은 6개월 전 확정하고, 불법·유령 당원 모두 정리하고, 경선 결과는 100% 공개하겠습니다.","셋째, '청년정당 민주당'입니다. 지역에선 국회의원이 왕이고, 말 안 듣는 청년은 씨를 말립니다. 청년취업보장제를 당 핵심 정책으로 도입하고, 청년위원회가 청년 정책 결정권을 갖게 하겠습니다. 남녀 모두 단기 기초군사훈련을 받게 하고 징병제는 단계적 모병제로 바꾸는 공약도 발표했습니다. 군 복무자는 가산점과 보상을 받도록 하겠습니다."],"quotes":[["김보미 (최신 워딩)","공정한 민주당, 민주정당 민주당, 청년정당 민주당 — 이 세 가지가 제 청사진입니다."],["김보미 (최신 워딩)","남녀 모두 기초군사훈련, 징병제는 단계적 모병제로 — 군 복무자는 가산점과 보상을 받게 하겠습니다."]],"notes":["3키워드 구조 필수(공정/민주/청년). 모병제·기초군사훈련·청년취업보장제 신규 공약 홍보 기회."],"warn":"신천지 언급은 '의혹이 사실이라면' 단서 유지 — 단정 금지. 검증 요구 프레임."},{"no":911,"media":"뉴스바사삭","part":"뉴스바사삭","label":"오늘 방송","q":"11. 민주당의 분열을 걱정하는 분들이 많습니다. 어떤 생각을 갖고 계신지요.","tags":["통합","정청래","이재명","친명친청","재집권","뉴스바사삭"],"script":["대통령께서 통합을 원하고 계시고, 누가 당선되든 새 대표도 겉으로는 통합을 내세울 겁니다. 지금은 당권을 두고 피 튀기게 경쟁해서 그렇지, 전당대회가 끝나면 다시 통합의 길로 간다고 봅니다.","다만 정청래 후보가 되면 사정이 달라질 수 있다고 봅니다. 지금까지 그래왔던 것처럼 집권 여당 대표가 아니라 '집권 야당 대표'처럼 사사건건 정부와 엇박자를 낸다면 분열상이 심각해질 수 있습니다.","저는 이 말씀을 드리고 싶습니다. 모두 소인배처럼 당권과 대권에만 빠져 허덕이는 정치가 아니라, 국가와 국민을 보고 정치를 했으면 좋겠습니다. 재집권에 실패하면 다시 계엄입니다. 친명·친청 힘을 합치는 것은 기본이고, 모든 민주진보세력이 합쳐야 합니다."],"quotes":[["김보미 (최신 워딩)","집권 여당 대표가 '집권 야당 대표'처럼 정부와 엇박자를 내면 분열은 심각해집니다."],["김보미 (최신 워딩)","당권과 대권에 허덕이는 소인배 정치가 아니라 국가와 국민을 보고 정치합시다."]],"notes":["통합 전망 + 정청래 리스크 지적 + '소인배 정치' 규정. 아름다운 퇴장 성명의 통합론으로 마무리."]},{"no":913,"media":"뉴스바사삭","part":"뉴스바사삭","label":"오늘 방송","q":"[오늘 예고] 앞으로의 계획이 있다면? / 당선되면 386 선배들을 어떻게 설득할 건가요?","tags":["홍대선언","디지털정당","대전환","경선혁신","3선배제","재정공개","뉴스바사삭"],"script":["오늘 오후 3시, 홍대에서 '홍대선언'을 합니다. 시스템으로 움직이는 디지털 정당으로 민주당을 완전히 대전환하자는 제안입니다.","기득권을 유지하려고 규칙을 마음대로 바꾸는 정당에서, 시스템으로 움직이는 진짜 당원 정당으로 바꾸는 겁니다. 경선 규칙 6개월 전 확정과 '고무줄 규칙' 폐지, 가짜·불법당원 정리와 경선 결과 100% 공개, 당비 월 1만 원 진짜 권리당원, 기탁금 없이 토론과 연설로 겨루는 공천, 동일 지역구 3회 초과 공천 금지, 그리고 국고보조금·당비 사용 내역 전면 공개까지 — 모두 담았습니다.","이 정도 조치 없이는 절대 총선과 대선을 이길 수 없습니다. 그걸 설득하면 선배 정치인들도 따라올 것이고, 무엇보다 국민이 지지할 겁니다. 세대교체와 대전환 수준의 개혁, 인정하지 않을 수 없을 겁니다."],"quotes":[["김보미 (확정 답변)","오늘 오후 3시, 홍대선언 — 디지털 정당으로 완전히 대전환하자는 제안입니다."],["김보미 (확정 답변)","규칙을 마음대로 바꾸는 정당에서, 시스템으로 움직이는 진짜 당원 정당으로."]],"notes":["오늘의 뉴스포인트. 방송에서 홍대선언(15시)을 예고해 취재 유도. 6대 개혁 리스트는 호흡 조절하며 나열."]},{"no":914,"media":"뉴스바사삭","part":"뉴스바사삭","label":"오늘 방송","q":"[클로징 대비] 마지막으로 하고 싶은 말씀은? — '계란은 생명을 품고 있다' 최신 마무리","tags":["클로징","계란과바위","홍대선언","똑순이","투표독려","뉴스바사삭"],"script":["본선에 가든 가지 않든, 저는 제가 한 약속을 평생이 걸리더라도 지킬 것입니다. 제 별명이 똑순이, 오뚝이, 그리고 '강진의 이재명'입니다.","저는 약한 계란이고, 40년 이 나라 정치를 독점한 686 기득권은 큰 바위죠. 하지만 바위는 너무 오래 비를 맞아 허물어지기 직전이고, 계란은 생명을 품고 있습니다.","이번 경선에서 확인했습니다. 당락의 유불
