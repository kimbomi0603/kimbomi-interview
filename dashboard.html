000834"]]}, {"t": "같은 말을 한 곳: 전격시사 8.12(2707), 정치시그널 Q10(3010)", "src": [["📼 관련 카드 #2707", "#card/2707"], ["📼 관련 카드 #3010", "#card/3010"]]}]}, {"t": "부동산 정책의 성적표는 세율표에 있지 않습니다. 청년이 오늘 밤 어디서 자느냐에 있습니다.", "ev": [{"t": "청년 가구 최저주거기준 미달 8.2%(일반 3.8%의 2배). 반지하 32.7만(2020)→39.8만 가구(2024)", "src": [["청년가구 최저주거기준 미달 8.2%·반지하 39.8만(참여연대 2026.5.13)", "https://peoplepower21.org/youth/2022703"]]}, {"t": "저소득 청년 86.6%가 공공임대도 주거급여도 못 받는 사각지대(국토연구원 2026.8)", "src": [["저소득 청년 86.6% 공공임대·주거급여 사각지대(파이낸셜뉴스, 국토연구원 2026.8)", "https://www.fnnews.com/news/202608110630517454"]]}]}]}, {"id": "public", "rank": 2, "title": "공공이 가진 방부터 — 기숙사·희망하우징", "tag": "학생회 발제 · 희망하우징", "say": [{"t": "학생회가 든 희망하우징을 보겠습니다. 시세의 30%, 월세 9만~15만 원. 좋은 제도입니다. 그런데 올해 1차 모집이 18호였습니다. 제도가 있다는 것과 들어갈 방이 있다는 건 다른 이야기입니다.", "ev": [{"t": "희망하우징: 시세 30%, 보증금 100만~109만 원, 최장 4년. 2026년 1차 모집 18호(정릉·연남·내발산). 최근 공고 5건은 모두 공공기숙사 잔여세대", "src": [["희망하우징 2026년 1차 모집 18호(고방 2026.5.13)", "https://gobang.kr/contents/7859"], ["희망하우징 임대조건(내 손안에 서울 2018.5.9)", "https://mediahub.seoul.go.kr/archives/1155750"]]}, {"t": "2013·2017년에는 3인 공유 구조 탓에 공실 37~50%가 문제였다", "src": [["희망하우징 다가구 공실 37%(서울신문 2017.2.6)", "https://m.go.seoul.co.kr/news/2017/02/06/20170206500149"]]}]}, {"t": "첫째, 공공이 가진 방입니다. 서울 대학 기숙사 수용률 16.8%, 전국 꼴찌입니다. 수도권 대학은 5년 동안 재학생이 2만 7천 명 늘었는데 기숙사 자리는 2천 개 늘었습니다. 대학 부지와 국공유지에 기숙사를 짓고, 연도별 숫자로 약속하게 해야 합니다.", "ev": [{"t": "서울 대학 기숙사 수용률 16.8%, 17개 시도 최저. 수도권 73개 대학 5년간 학생 +27,107명, 기숙사 +2,042명(18.1%→17.7%)", "src": [["수도권 대학 기숙사 수용률, 서울 16.8%(이투데이 2026.10.15)", "https://etoday.co.kr/news/view/2635271"]]}, {"t": "LH 기숙사형 전세임대 500호 공모(10.7~), 서울대와 2030년까지 200호", "src": [["파이낸셜뉴스 2026.10.6 기숙사형 전세임대", "https://www.fnnews.com/news/202610061826523928"]]}, {"t": "서울시 새싹원룸 1만 실(SH가 원룸을 반전세로 빌려 신입생에 재임대), 청년주택 7.4만(2030)", "src": [["오세훈 청년주택 7.4만·새싹원룸 1만(머니투데이 2026.3.10)", "https://www.mt.co.kr/estate/2026/03/10/2026031015380279900"]]}]}]}, {"id": "safe", "rank": 3, "title": "안전과 통학 — 안전은 월세로 사는 게 아니다", "tag": "학생회 발제 · 안전·통학", "say": [{"t": "학생회 자료에도 \"늦은 시간 안심하고 다닐 수 있는 주거환경\"이 적혀 있습니다. 그런데 서울시 안심귀가스카우트 예산은 2022년 37억 원에서 올해 12억, 내년 안은 6억 원입니다. 여학생들은 안전을 월세로 삽니다. 안전은 공공이 책임질 일입니다.", "ev": [{"t": "안심귀가스카우트 예산 37억(2022)→12억(2025)→6억(2026안), 인력 334명→60명", "src": [["안심귀가스카우트 예산 37억→6억(서울신문 2025.11.17)", "https://m.go.seoul.co.kr/news/2025/11/17/20251117500262"]]}, {"t": "마포·서대문 여성전용 원룸이 일반 원룸보다 월 5만~20만 원 비쌈", "src": [["여성전용 원룸 월세 5만~20만 원 더(서울신문 2024.2.12)", "https://m.seoul.co.kr/news/2024/02/12/20240212500098"]]}]}, {"t": "통학도 돈입니다. 서울과 붙은 경기 11개 시 주민 57%가 편도 1시간 넘게 걸립니다. 청년 기후동행카드는 좋은 정책이지만 경기에서 오는 학생에겐 반쪽입니다. 경기·인천과 같이 쓰는 정기권이 답입니다.", "ev": [{"t": "경기 11개 시 주민 57.3%가 통근·통학 편도 1시간 이상", "src": [["경기 11개 시 57% 편도 1시간 이상(SBS Biz 2026.10.6)", "https://biz.sbs.co.kr/amp/article/20000338571"]]}, {"t": "청년 기후동행카드 월 5만 5천 원(서울시)", "src": [["기후동행카드 청년 5만 5천 원(서울시 2025.9.24)", "https://news.seoul.go.kr/traffic/archives/514914"]]}]}]}, {"id": "support", "rank": 4, "title": "월세 지원은 현실에 맞게 — 30만 원", "tag": "김보미 제안", "say": [{"t": "월세 지원을 현실에 맞게 올리는 겁니다. 지금 20만 원은 학교 앞 월세의 3분의 1이 안 됩니다. 저는 월 30만 원으로 올려야 한다고 봅니다.", "ev": [{"t": "청년월세지원: 월 20만 원·최대 24개월, 19~34세 무주택, 소득 중위 60% 이하. 2026.3 상시화. 2027년부터 소득 기준 중위 100%, 차상위 이하 48개월. 금액 20만 원은 2022년 그대로", "src": [["비즈워치 청년월세 상시화·확대", "https://news.bizwatch.co.kr/article/real_estate/2026/09/15/0035"], ["청년 월세 지원 상시화 20만×24개월(뉴시스 2026.3.18)", "https://mobile.newsis.com/view/NISX20260318_0003552925"]]}, {"t": "\"30만 원으로\"는 교차점검(2853)에서 정한 표현. 서울시 청년월세지원 1.2만 명 추첨, 탈락자 관리비 8만 원", "src": [["📼 관련 카드 #2853", "#card/2853"], ["서울 청년월세지원 2026 1.2만 명·관리비 8만(고방 2026.3.10)", "https://gobang.kr/contents/7691"]]}]}, {"t": "관리비도 월세입니다. 관리비는 지원 대상에서 빠져 있는데 1년에 14%가 올랐습니다.", "ev": [{"t": "연세대 앞 관리비 +14.3%(다방 7월), 대학가 월세+관리비 평균 70.9만(파이낸셜뉴스 10.9)", "src": [["서울 주요 대학가 원룸 월세, 연세대 인근 67.8만(SBS Biz·다방 2026.8.11)", "https://biz.sbs.co.kr/amp/article/20000327969"], ["대학가 월세+관리비 평균 70.9만(파이낸셜뉴스 2026.10.9)", "https://www.fnnews.com/news/202610090343485982"]]}]}]}, {"id": "local", "rank": 5, "title": "서울과 지방을 같이 — 빈집과 원룸", "tag": "김보미만 할 수 있는 말", "say": [{"t": "서울은 방이 없어 난리인데 제 고향 강진은 빈집이 늘어 갑니다. 서울 청년의 주거 절망과 지방 청년의 일자리 절망은 같은 문제의 양면입니다. 수도권에 짓는 정성의 절반만 지방 빈집을 청년 집으로 바꾸는 데 써 주십시오. 지방이 살아야 여러분 학교 앞 월세도 내려갑니다.", "ev": [{"t": "같은 말: 전격시사 8.12(2707), 불교방송(119)", "src": [["📼 관련 카드 #2707", "#card/2707"], ["📼 관련 카드 #119", "#card/119"]]}, {"t": "화순 만원주택 567명 전입, 전남형 청년마을 4,191명 중 68명 정착", "src": [["화순 만원주택, 567명 전입(위키트리)", "https://www.wikitree.co.kr/articles/1143545"], ["전남형 청년마을 4,191명 중 68명 정착(헤럴드경제 2026.6.3)", "https://www.heraldk.com/article/2026060317462970644"]]}]}, {"t": "저는 강진에서 34평 임대아파트에 삽니다. 그런데 지금 일하는 곳 근처에서는 방 한 칸을 못 구했습니다. 그래서 요즘 화성 언니 집에서 출퇴근합니다. 전 군의회 의장도 수도권에서 방 한 칸 못 구합니다.", "ev": [{"t": "승원팰리체 리버시티 전용 84㎡(34평형) 226세대, 10년 민간임대. 강진 30평대 평당 808만 원", "src": [["승원팰리체 리버시티 전용84㎡ 34평형 226세대(장강뉴스)", "https://www.jgynews.com/news/articleView.html?idxno=33434"], ["강진군 30평대 아파트 시세·실거래(리치고)", "https://m.richgo.ai/realty/apt-hub/%EC%A0%84%EB%82%A8%EA%B4%91%EC%A3%BC/%EA%B0%95%EC%A7%84%EA%B5%B0/30%ED%8F%89%EB%8C%80"]]}]}]}], "gov": [{"t": "정부의 틀: 9.21 주거안정플랜 — 2030년까지 공적주택 119만 호(수도권 92만, 77%), 그중 보편형 공공임대 19만 호. 미혼 청년 몫 24.3만 호, 신혼·육아 32.8만 호. 2027년 청년 주거 예산은 9.6조→18.5조로 두 배, 청년 공공임대 10.6만 호(+3.5만).", "ev": [{"t": "정책브리핑(국토부 2026.9.21): 공적주택 119만 호(연 24만), 수도권 92만 호 77%. 공공임대 건설 35만·매입 31만·전세 23만, 공공분양 24만. 보편형 19만(건설 17.5만+매입 1.8만). 미혼 청년 24.3만, 신혼·육아 32.8만, 고령 5.4만", "src": [["국토부 주거안정플랜 발표(정책브리핑 2026.9.21)", "https://www.korea.kr/news/policyNewsView.do?newsId=148972316"]]}, {"t": "노컷뉴스 8.28: 청년 주거 예산 9조6천억→18조5천억, 청년 대상 공공임대 10만6천호(+3만5천). 헤럴드 8.31은 18.1조(집계 범위 다름) → \"약 18조, 두 배\"로", "src": [["노컷뉴스 2026.8.28 2027 청년예산", "https://nocutnews.co.kr/news/6571021"], ["헤럴드경제 2026.8.31 국토부 2027 예산", "https://www.heraldk.com/article/2026083120041480854"]]}, {"t": "118.8만이라고 쓴 매체(뉴스토마토·참여연대)도 있으나 정부 발표는 119만. 토론에서는 \"119만\"", "src": [["뉴스토마토 2026.9.21 주거안정플랜", "https://newstomato.com/ReadNews.aspx?no=1314458"], ["참여연대 2026.9.22 주거안정플랜 논평", "https://peoplepower21.org/stablelife/2029728"]]}]}, {"t": "월세지원 상시화(2026.3), 2027년 소득 기준 중위 100%·차상위 48개월. 청년드림청약 소득 한도 5천→7천만. 청년미래보금자리론(2027.1): 39세 이하 생애최초, 4억 이하 비아파트, LTV 80%.", "ev": [{"t": "청년월세 상시화·조건 확대", "src": [["비즈워치 청년월세 상시화·확대", "https://news.bizwatch.co.kr/article/real_estate/2026/09/15/0035"]]}, {"t": "청년미래보금자리론 조건. 서울 빌라 64%가 4억 초과로 제외 → \"청년은 빌라만 사라는 거냐\" 비판, 금융위는 아파트 포함 가능성 열어 둠", "src": [["헤럴드경제 2026.8.12 청년미래보금자리론", "https://www.heraldk.com/article/2026081220003465184"], ["청년미래보금자리론, 서울 빌라 64% 제외(헤럴드경제 2026.8.21)", "https://biz.heraldcorp.com/article/10847568"]]}]}, {"t": "10·15 대책(2025.10.15): 규제지역 무주택 LTV 70→40%, 주담대 한도 6억. 2030 주담대 매수 42.5% 감소 — 청년 실수요자가 같이 맞았다.", "ev": [{"t": "10·15 대책, 2030 주담대 42.5% 감소", "src": [["10·15 대책, 2030 주담대 42.5% 감소(헤럴드경제)", "https://www.heraldk.com/article/2025101517300227331"]]}]}, {"t": "비판(참여연대·전문가): 전세임대 23만을 빼면 장기 공공임대는 66.3만(연 13.3만). 보편형(중산층) 6.2조인데 저소득층용 통합공공임대 출자는 +5%. 119만은 3기 신도시 5곳의 8배라 실현성 의문. 국토부 반론: 취약계층 지원 약 4조는 줄지 않는다.", "ev": [{"t": "참여연대 9.22·9.30, MTN 9.22 전문가, 참여연대 10.1 좌담회", "src": [["참여연대 2026.9.22 주거안정플랜 논평", "https://peoplepower21.org/stablelife/2029728"], ["참여연대 2026.9.30 2027 주거예산 분석", "https://peoplepower21.org/?p=2030086"], ["MTN 2026.9.22 전문가 평가", "https://news.mtn.co.kr/news-detail/2026092215285210316"], ["참여연대 2026.10.1 좌담회", "https://peoplepower21.org/?p=2029896"]]}]}], "ask": [{"q": "\"대출 규제가 청년만 골라 잡았다. 사다리를 걷어찼다.\"", "who": "개혁신당 김성열", "admit": "맞다. 2030 주담대 매수가 42.5% 줄었다. 청년 실수요자가 같이 맞았다.", "hit": "\"맞습니다. 그래서 청년·신혼 예외를 검토만 할 게 아니라 해야 합니다. 그런데 대출을 다 풀자는 건 답이 아닙니다. 2021년에 봤습니다. 빚으로 올린 집값은 다음 청년이 냅니다. 그리고 개혁신당 공약엔 세입자 대책이 한 줄도 없다는 참여연대 평가에는 뭐라고 답하시겠습니까?\"", "ev": [{"t": "10·15 대책 2030 매수 42.5% 감소", "src": [["10·15 대책, 2030 주담대 42.5% 감소(헤럴드경제)", "https://www.heraldk.com/article/2025101517300227331"]]}, {"t": "참여연대: 개혁신당 2025 대선·2026 지선 \"세입자 대책 거의 없음\"", "src": [["참여연대 2025.5.13 대선 주거공약 평가", "https://peoplepower21.org/stablelife/1991954"], ["참여연대·주거권네트워크 2026.5.18 지선 주거공약 평가", "https://peoplepower21.org/stablelife/2023030"]]}, {"t": "받아치기 카드", "src": [["📼 관련 카드 #3234", "#card/3234"], ["📼 관련 카드 #3211", "#card/3211"]]}]}, {"q": "\"보편형 공공임대는 중산층용이다. 저소득층 대기자 2만 5천이 먼저다.\"", "who": "진보당 박태훈", "admit": "맞다. 통합공공임대 출자는 +5%뿐이고 영구·국민임대 대기자가 2만 5천 명이다.", "hit": "\"순서를 지켜야 한다는 데 동의합니다. 고시원·반지하 청년이 먼저입니다. 그래서 저는 보편형보다 공공이 이미 가진 방부터 채우자고 합니다. 민주당이라도 틀린 건 틀렸다고 하겠습니다.\"", "ev": [{"t": "정태흥(진보당) 9.21 플랜 비판, 참여연대 9.30", "src": [["한국사회복지저널 2026.9.28 정태흥 9.21 비판", "https://www.ksw-news.com/news/articleView.html?idxno=3040183"], ["참여연대 2026.9.30 2027 주거예산 분석", "https://peoplepower21.org/?p=2030086"]]}, {"t": "카드", "src": [["📼 관련 카드 #3237", "#card/3237"]]}]}, {"q": "\"규제·세금만 있고 공급은 없다. 재건축을 풀어야 한다.\"", "who": "국민의힘 논리(학생 질문 가능)", "admit": "공급이 부족하다는 진단은 맞다.", "hit": "\"그런데 재건축 풀어서 나오는 집은 10억짜리입니다. 연세대 앞 8평 원룸이 5억입니다. 학생이 살 집은 재건축에서 안 나옵니다. 민간에 맡긴 청년안심주택은 보증금을 떼였습니다. 공공이 가진 방부터 채우는 게 빠릅니다.\"", "ev": [{"t": "청년안심주택 4개 단지 296가구 보증금 미반환, 잠실 238억, 보증보험 미가입 1,231채", "src": [["청년안심주택 296가구 보증금 선지급(서울시 2025.10.2)", "https://mediahub.seoul.go.kr/archives/2015796"], ["잠실 238억·보증보험 미가입 1,231채(동아일보 2025.8.23)", "https://v.daum.net/v/20250823014527905"]]}, {"t": "카드", "src": [["📼 관련 카드 #3213", "#card/3213"]]}]}, {"q": "\"희망하우징이 있지 않나. 제도는 이미 있다.\"", "who": "학생회 발제", "admit": "좋은 제도다. 시세 30%, 월세 9만~15만 원.", "hit": "\"올해 1차 모집이 18호였습니다. 제도가 있는 것과 들어갈 방이 있는 건 다릅니다. 몇 실을 언제까지 늘릴지 숫자로 약속하고 지었는지 공개하게 해야 합니다.\"", "ev": [{"t": "희망하우징 18호·조건·과거 공실", "src": [["희망하우징 2026년 1차 모집 18호(고방 2026.5.13)", "https://gobang.kr/contents/7859"], ["희망하우징 임대조건(내 손안에 서울 2018.5.9)", "https://mediahub.seoul.go.kr/archives/1155750"], ["희망하우징 다가구 공실 37%(서울신문 2017.2.6)", "https://m.go.seoul.co.kr/news/2017/02/06/20170206500149"]]}]}, {"q": "\"기숙사 많이 지으면 끝 아닌가.\"", "who": "학생", "admit": "맞다. 그게 1순위다.", "hit": "\"그런데 기숙사는 주민 반대로 번번이 무산됩니다. 그래서 연도별 숫자로 약속하고 실제로 지었는지 공개하게 하자는 겁니다. 수도권 대학 5년간 학생 2만 7천 늘 때 기숙사 2천 늘었습니다.\"", "ev": [{"t": "기숙사 수용률 16.8%, 5년 +2,042명", "src": [["수도권 대학 기숙사 수용률, 서울 16.8%(이투데이 2026.10.15)", "https://etoday.co.kr/news/view/2635271"]]}]}, {"q": "\"월세 지원을 올리면 월세가 따라 오른다.\"", "who": "경제학 논리(개혁신당·학생)", "admit": "지원금만 올리면 집주인이 올릴 수 있다는 반론은 있다.", "hit": "\"그래서 공공이 가진 방이 같이 늘어야 합니다. 지원금은 당장 숨 쉬게 하는 것이고, 공공 원룸·기숙사가 시장 월세를 끌어내립니다. 둘을 같이 가야지 하나만 하면 말씀대로 됩니다.\"", "ev": [{"t": "청년월세지원 조건", "src": [["비즈워치 청년월세 상시화·확대", "https://news.bizwatch.co.kr/article/real_estate/2026/09/15/0035"]]}]}, {"q": "\"민주당 정부 119만 호, 지어진 집이 있나. 숫자만 크다.\"", "who": "개혁신당·국민의힘", "admit": "실현성 의문은 전문가도 제기한다(3기 신도시 8배).", "hit": "\"그래서 저는 숫자보다 공개를 말합니다. 연도별로 몇 호 지었는지 매년 공개하게 하면 됩니다. 강진에서 예산 내역을 공개하니 행정이 바뀌었습니다. 2027년 당장 들어갈 수 있는 물량은 전국 15만, 수도권 10만입니다.\"", "ev": [{"t": "입주 가능 물량 2026.4Q~2027: 전국 15만, 수도권 10만(정책브리핑)", "src": [["국토부 주거안정플랜 발표(정책브리핑 2026.9.21)", "https://www.korea.kr/news/policyNewsView.do?newsId=148972316"]]}, {"t": "MTN 전문가 평가", "src": [["MTN 2026.9.22 전문가 평가", "https://news.mtn.co.kr/news-detail/2026092215285210316"]]}]}], "parties": [["민주당·정부", "공공이 짓는 집. 119만 호, 보편형 19만, 청년 주거예산 두 배. 약점은 보편형 쏠림과 세입자 대책", [["국토부 주거안정플랜 발표(정책브리핑 2026.9.21)", "https://www.korea.kr/news/policyNewsView.do?newsId=148972316"], ["참여연대 2026.9.30 2027 주거예산 분석", "https://peoplepower21.org/?p=2030086"]], {"pro": "방향이 맞다. 집을 민간에만 맡기지 않고 공공이 직접 짓고, 청년 주거 예산을 9.5조에서 약 18조로 두 배 늘렸다. 2030년까지 미혼 청년 24.3만 호, 2027년 청년 공적주택 10.6만 호를 숫자로 약속했다. 월세지원 소득 기준도 중위 100%로 넓혔다.", "con": "① 119만 호는 3기 신도시 5곳의 8배 물량이라 재원·실현성 의문. ② 보편형(중산층용) 19만에 6.2조가 가는데 저소득층용 통합공공임대 출자는 +5%뿐 — 반지하·고시원 청년이 뒤로 밀릴 수 있다. ③ 전세임대 23만을 빼면 진짜 장기 공공임대는 66.3만. ④ 세입자 61%를 지키는 대책이 약하다. ⑤ 10·15 대출 규제로 2030 실수요 매수가 42.5% 줄었다.", "rebut": "상대(개혁신당): \"숫자만 크고 지어진 집이 없다.\" 상대(진보당): \"보편형은 중산층용, 대기자 2만 5천이 먼저다.\" 김보미 답: 둘 다 맞는 지적이다. 그래서 저는 \"공공이 가진 방부터\" — 기숙사·희망하우징·공실 임대주택처럼 이미 있는 방을 먼저 채우고, 보편형보다 고시원·반지하 청년 순서를 앞세우자고 한다. 민주당이라도 틀린 건 틀렸다고 한다.", "agree": "공공 공급 확대라는 큰 틀은 지킨다. 민간 임대인 인센티브로 가자는 쪽(국민의힘·개혁신당)과는 선을 긋는다."}], ["국민의힘", "재건축초과이익환수 폐지, 반값 전세, 신규 공공임대 30% 청년·신혼, 10·15 철회. \"규제·세금만 있고 공급은 없다\"", [["머니투데이 2026.5.12 국민의힘 지선 1호 공약", "https://www.mt.co.kr/politics/2026/05/12/2026051115314050355"], ["이투데이 2025.10.22 부동산 정상화 특위", "https://www.etoday.co.kr/news/view/2517113"]], {"pro": "공급 부족이라는 진단은 틀리지 않았다. 재건축·재개발을 풀면 서울 도심 공급이 늘 수 있고, 반값 전세·청년 30% 배정은 청년에게 직접 닿는 공약이다. \"규제만 있고 공급은 없다\"는 비판은 10·15 이후 2030 체감과 맞는다.", "con": "① 재초환 폐지·세금 완화는 집 가진 사람과 재건축 조합원에게 먼저 이익이 간다 — 참여연대·주거권네트워크가 \"집주인 공약\"이라고 평가. ② 등록임대 부활은 2018년 다주택자 혜택 논란을 되풀이한다. ③ 서울시 청년안심주택(민간임대 모델)은 4개 단지 296가구 보증금 미반환, 잠실 한 곳 238억 — 민간에 맡긴 청년 주택의 실패 사례. ④ 반값 전세의 재원·방식이 없다.", "rebut": "상대가 \"공급이 없다\"고 치면: \"맞습니다. 그런데 재건축 풀어서 나오는 집은 10억짜리입니다. 연세대 앞 8평 원룸이 5억입니다. 학생이 살 집은 재건축에서 안 나옵니다. 청년안심주택처럼 민간에 맡겼더니 보증금을 못 받았습니다. 공공이 가진 방부터 채우는 게 빠릅니다.\"", "agree": "청년·신혼 30% 배정 같은 청년 몫 명시는 같이 갈 수 있다."}], ["개혁신당", "대출 정상화·민간 공급·실거주의무 폐지(\"전세 4.9만 호\"). 세입자 대책은 거의 없음(참여연대)", [["머니투데이 2026.7.20 이준석 대출규제 비판", "https://www.mt.co.kr/politics/2026/07/20/2026072009394764215"], ["헤럴드경제 2026.6.14 실거주의무 4.9만호", "https://www.heraldk.com/article/2026061423472675526"], ["참여연대·주거권네트워크 2026.5.18 지선 주거공약 평가", "https://peoplepower21.org/stablelife/2023030"]], {"pro": "청년 실수요자를 대출 규제가 골라 때렸다는 지적은 사실이다(2030 주담대 매수 42.5% 감소). 실거주의무 폐지로 전세 4.9만 호가 풀린다는 계산도 숫자로 제시했다. 시장 원리로 말해 젊은 층에게 설득력이 있다.", "con": "① 2025 대선·2026 지선 두 번 연속 \"세입자 대책 거의 없음\"(참여연대) — 청년 대부분이 세입자인데 세입자가 빠져 있다. ② 대출을 풀면 집값이 먼저 오른다. 2021년 경험이다. 돈 빌려 사는 집은 금리 오르면 청년이 먼저 무너진다. ③ 실거주의무 폐지는 분양받은 사람이 안 살고 세 놓게 하는 것 — 갭투자 허용이다. ④ 이준석 전 대표 본인이 폐버스를 \"차량 거주는 노숙\"이라며 비판했지만 대안은 민간 공급뿐이다.", "rebut": "상대(김성열): \"대출 규제가 청년 사다리를 걷어찼다.\" 김보미 답: \"맞습니다. 청년·신혼 예외는 둬야 합니다. 그런데 대출을 다 풀자는 건 답이 아닙니다. 빚으로 올린 집값은 다음 청년이 냅니다. 세입자 대책이 공약에 한 줄도 없다는 참여연대 평가에는 뭐라고 답하시겠습니까?\"", "agree": "청년·신혼 대출 예외라는 한 가지는 같이 말할 수 있다."}], ["진보당", "지역별 장기공공임대 20% 의무화, 임대료 상한·갱신 무제한, 보유세 강화. \"전세임대 23만은 공공임대가 아니다\"", [["참여연대·주거권네트워크 2026.5.18 지선 주거공약 평가", "https://peoplepower21.org/stablelife/2023030"], ["한국사회복지저널 2026.9.28 정태흥 9.21 비판", "https://www.ksw-news.com/news/articleView.html?idxno=3040183"]], {"pro": "세입자 보호가 가장 두텁다. 전세임대 23만을 공공임대로 세지 말라는 지적, 저소득 대기자 2만 5천이 먼저라는 지적은 정확하다. 정의당·진보당 계열 공약이 시민단체 지선 평가에서 상위다. 공공임대 확대에서 김보미와 같은 편이 될 수 있다.", "con": "① 지역별 20%는 수백만 호 — 연도별 재원표가 없다. ② 임대료 상한·갱신 무제한은 2024년 발의 뒤 \"임대 공급이 줄어든다\"는 반론에 철회된 적이 있다. 공급이 줄면 월세가 더 오를 수 있다. ③ 보유세 강화는 세입자에게 전가될 수 있다(종부세 전가 논란). ④ 전국 4석이라 실행 수단이 없다.", "rebut": "상대(박태훈): \"민주당 정부도 결국 중산층용이다.\" 김보미 답: \"순서를 지켜야 한다는 데 동의합니다. 그런데 임대료 상한을 무제한으로 걸면 집주인이 방을 안 내놓습니다. 저는 상한보다 공공이 직접 가진 방을 늘려서 시장 월세를 끌어내리는 쪽입니다. 그리고 20% 목표의 1년치 예산표를 같이 만들어 보시죠.\"", "agree": "공공임대 확대·세입자 보호에서 연대. \"20%\"의 분모가 다르다는 것만 정리해 두기."}], ["조국혁신당", "99년 국민안심아파트(영구 공공임대), 공공임대 매년 1%씩", [["뉴시스 2026.5.13 조국혁신당 99년 아파트", "https://www.newsis.com/view/NISX20260513_0003627476"], ["뉴시스 2026.8.6 조국혁신당 세입자 우선", "https://www.newsis.com/view/NISX20260806_0003738630"]], {"pro": "\"평생 살 수 있는 공공임대\"라는 메시지가 선명하다. 매년 1%씩이라는 속도 목표는 점검이 가능하다.", "con": "① 99년 임대의 운영비·재건축 재원 계산이 없다. ② 12석 정당이고 1순위 의제는 검찰개혁이라 주거 공약의 무게가 작다. ③ 서울 학생 원룸 같은 소형·단기 수요에 대한 답이 아니다.", "rebut": "학생이 물으면: \"영구 임대라는 방향은 좋습니다. 다만 학생에게 필요한 건 99년이 아니라 당장 4년입니다. 기숙사와 희망하우징이 먼저입니다.\"", "agree": ""}]], "hw": [["청년 주거에서 \"무엇을 우선적으로\"에 대한 김보미의 순서 다섯 가지는?", "① 월세 그 자체 ② 공공이 가진 방(기숙사·희망하우징) ③ 안전·통학 ④ 월세 지원 30만 원·관리비 ⑤ 서울과 지방 같이. 한 줄: \"공공이 가진 방부터, 세입자 대책이 곧 청년 대책.\"", [["📼 관련 카드 #3204", "#card/3204"]]], ["9.21 주거안정플랜 숫자 네 개(총량·수도권·보편형·청년 몫)?", "2030년까지 공적주택 119만 호, 수도권 92만(77%), 보편형 공공임대 19만, 미혼 청년 24.3만 호(신혼·육아 32.8만). 2027년 청년 공공임대 10.6만 호. \"118.8만\"이라 쓴 매체도 있지만 정부 발표는 119만.", [["국토부 주거안정플랜 발표(정책브리핑 2026.9.21)", "https://www.korea.kr/news/policyNewsView.do?newsId=148972316"], ["노컷뉴스 2026.8.28 2027 청년예산", "https://nocutnews.co.kr/news/6571021"]]], ["2027년 청년 주거 예산은?", "9.6조→18.5조, 두 배(노컷). 헤럴드는 18.1조. \"약 18조, 두 배\"로 말한다.", [["노컷뉴스 2026.8.28 2027 청년예산", "https://nocutnews.co.kr/news/6571021"], ["헤럴드경제 2026.8.31 국토부 2027 예산", "https://www.heraldk.com/article/2026083120041480854"]]], ["청년월세지원 조건과 2027년 변화, 김보미 입장은?", "월 20만·최대 24개월·소득 중위 60% 이하. 2027년 중위 100%, 차상위 48개월. 금액은 2022년부터 20만 그대로. 김보미는 \"30만 원으로\".", [["비즈워치 청년월세 상시화·확대", "https://news.bizwatch.co.kr/article/real_estate/2026/09/15/0035"], ["📼 관련 카드 #3241", "#card/3241"]]], ["참여연대가 9.21 플랜에서 지적한 숫자 두 개는?", "① 전세임대 23만을 빼면 장기 공공임대 66.3만(연 13.3만) ② 보편형 6.2조 vs 통합공공임대 출자 +5%. 먼저 인정하고 \"순서\"로 넘어간다.", [["참여연대 2026.9.22 주거안정플랜 논평", "https://peoplepower21.org/stablelife/2029728"], ["참여연대 2026.9.30 2027 주거예산 분석", "https://peoplepower21.org/?p=2030086"]]], ["10·15 대책이 청년에게 어떻게 작용했고 어떻게 답하나?", "LTV 70→40%, 한도 6억, 2030 매수 42.5% 감소. \"투기 잡는 건 맞지만 청년 실수요자가 같이 맞았다. 청년·신혼 예외는 해야 한다. 그래도 대출 다 풀면 집값이 먼저 오른다.\"", [["10·15 대책, 2030 주담대 42.5% 감소(헤럴드경제)", "https://www.heraldk.com/article/2025101517300227331"], ["📼 관련 카드 #3234", "#card/3234"]]], ["학생회 근거 보고서의 서울 20대 응답자 수와, 서울 세부이슈 1위는?", "62명. 서울 전체 세부이슈 1위는 재개발·재건축 58.2%, 2위 주거비 지원·공공임대 44.5%. 전남은 전월세 안정 63.0%가 1위 — \"서울은 집값, 지방은 집세\".", [["중앙선관위 「제9회 지방선거 정책이슈 선정을 위한 빅데이터 분석」(핀인사이트, 2026.3)", "https://policy.nec.go.kr/plc/promotion/initUPRPromotionDetail.do?no=89"]]]], "cuts": []}, {"id": "a2", "rank": 2, "title": "의제 2 · 청년 일자리", "q": "열심히 준비해도 취업이 어려운 사회, 청년 일자리 정책은 어디서부터?", "why": "학생회가 2순위로 둔 이유: 같은 설문에서 서울 20대의 경제/일자리 56.5%(2위). 서울 전체 세부이슈는 일자리·창업지원 67.4%가 1위.", "brief": "학생회 발제문이 든 것: \"첫 일자리까지 18.4개월(고용정보원)\", 고등교육 이수율 OECD 1위인데 대졸 고용률 80% vs OECD 87%. 두 숫자 모두 바로잡을 것이 있다(아래 ②). 질문이 \"어디서부터\"이니 답은 \"첫 직장 문턱부터\".", "topics": [{"id": "first", "rank": 1, "title": "첫 직장 문턱부터 — 경력이라는 보증금", "tag": "학생회 발제 · 어디서부터", "say": [{"t": "첫 직장 문턱부터입니다. 기업이 신입 대신 경력을 찾는 건 신입을 가르치는 비용을 혼자 지기 싫어서입니다. 그 비용을 나라가 나눠 지면 됩니다. 그게 제가 말하는 청년취업보장제입니다.", "ev": [{"t": "500대 기업 61.1% 상반기 신규채용 계획 없거나 미정(한경협). 국가데이터처도 경력직 선호·수시채용을 원인으로 지목", "src": [["2026년 5월 청년층 부가조사(국가데이터처, KDI 요약)", "https://eiec.kdi.re.kr/policy/materialView.do?num=284575"]]}, {"t": "\"경력이 없어서 일을 못 하고, 일을 못 해서 경력이 없다\" — 신동아 답변(2805)", "src": [["📼 관련 카드 #2805", "#card/2805"]]}]}, {"t": "저는 청년의 취업을 국가가 책임지는 \"국가청년취업보장제\"를 도입해야 한다고 말해 왔습니다. — 당대표 후보 시절 머니투데이 답변 그대로.", "ev": [{"t": "머니투데이 서면 답변(2413): \"청년의 취업을 국가가 책임지는 국가청년취업보장제를 민주당의 핵심 정책으로 도입해야\"", "src": [["📼 관련 카드 #2413", "#card/2413"]]}, {"t": "오스트리아는 25세까지 견습 자리를 보장(2024년 11,713명, 약 7,140만 유로). 전체 소요 예산은 산출한 숫자가 없으니 지어내지 말 것", "src": [["오스트리아 훈련 보장 2024년 1만1,713명(오스트리아 사회부)", "https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsmarkt/Arbeitsmarktfoerderungen/Jugendliche-und-junge-Erwachsene.html"], ["📼 관련 카드 #3236", "#card/3236"]]}]}, {"t": "숫자가 말해 줍니다. 15세부터 29세까지 청년 취업자는 지난달까지 47개월 연속 줄었습니다. 금융위기 이후 가장 깁니다. 졸업하고 한 번이라도 일해 본 청년은 역대 최저입니다.", "ev": [{"t": "2026년 9월 고용동향(10.16): 15~29세 취업자 −14만 7천, 47개월 연속 감소(2022.11~). 고용률 44.0%(−1.1%p) 29개월 연속 하락. 실업률 5.4%", "src": [["2026년 9월 고용동향, 청년 취업자 47개월 감소(스마트투데이)", "https://www.smarttoday.co.kr/ko-kr/articles/112773"], ["국가데이터처 9월 고용동향(KDI)", "https://eiec.kdi.re.kr/policy/materialView.do?num=288191"]]}, {"t": "졸업 후 취업 경험 84.8%(2004년 이후 최저). 첫 취업 소요 11.2개월. 미취업 124.3만 중 1년 이상 60.5만(48.6%)", "src": [["2026년 5월 청년층 부가조사(국가데이터처, KDI 요약)", "https://eiec.kdi.re.kr/policy/materialView.do?num=284575"], ["졸업 후 1년 이상 미취업 48.6%(SBS Biz 2026.7.23)", "https://biz.sbs.co.kr/amp/article/20000324195"]]}, {"t": "15~29세 '쉬었음' 36.4만. 2030 '쉬었음' 65.1만(2026.7)", "src": [["국가데이터처 9월 고용동향(KDI)", "https://eiec.kdi.re.kr/policy/materialView.do?num=288191"], ["SBS Biz 2026.9.1 청년 일자리 예산", "https://biz.sbs.co.kr/amp/article/20000331977"]]}]}]}, {"id": "nums", "rank": 2, "title": "학생회 발제문 숫자 바로잡기 — 18.4개월, 80 vs 87", "tag": "학생회 발제 · 숫자", "say": [{"t": "학생회 자료에 18.4개월이라는 숫자가 나왔는데, 찾아보니 그건 첫 직장에서 버티는 평균 기간이었습니다. 어렵게 들어간 첫 직장을 열에 일곱이 1년 반 만에 그만둡니다. 들어가기도 어렵고, 버티기도 어렵습니다.", "ev": [{"t": "국회예산정책처: 첫 직장을 그만둔 청년 70.7%, 평균 근속 18.4개월. 그만둔 이유 1위 근로여건 불만 44.4%, 전공 불일치 7.2%", "src": [["첫 직장 퇴사 70.7%·근속 18.4개월(헤럴드경제 2026.5.4)", "https://www.heraldk.com/article/2026050404000057847"], ["오마이뉴스 2026.8.28 박태훈의 청년 오늘 3화", "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003262261"]]}, {"t": "취업 소요기간은 국가데이터처 11.2개월, 고용정보원 청년패널 22.7개월(비수도권 24.6 vs 수도권 21.2)", "src": [["2026년 5월 청년층 부가조사(국가데이터처, KDI 요약)", "https://eiec.kdi.re.kr/policy/materialView.do?num=284575"], ["고용정보원 청년패널, 비수도권 24.6개월(쿠키뉴스)", "https://www.kukinews.com/article/view/kuk202511270015"]]}, {"t": "학생 체면: \"제가 찾아보니 이런 뜻이었습니다\"로만. 카드 3273", "src": [["📼 관련 카드 #3273", "#card/3273"]]}]}, {"t": "여러분이 공부를 덜 해서가 아닙니다. 우리나라 25~34세 대학 이수율은 71%로 OECD 1위인데, 대졸 고용률은 80%로 OECD 평균 86%보다 낮습니다. 이 사회가 받는 보증금이 너무 비싸서입니다.", "ev": [{"t": "OECD 교육지표 2026: 25~34세 고등교육 이수율 71.1% 1위. 25~64세 대졸 고용률 80.1% vs OECD 86.0%. 발제문의 \"87%\"는 옛 숫자", "src": [["OECD 교육지표 2026(파이낸셜뉴스 2026.9.29)", "https://www.fnnews.com/news/202609291351196534"]]}]}]}, {"id": "quality", "rank": 3, "title": "첫 일자리의 질 — 첫 단추가 평생", "tag": "김보미 논점", "say": [{"t": "첫 단추가 평생을 좌우합니다. 계약직으로 시작한 청년 셋 중 하나는 지금도 계약직입니다. 정규직으로 시작한 청년은 다섯 중 하나도 안 됩니다. 그래서 일자리 숫자만큼 첫 일자리의 질이 중요합니다.", "ev": [{"t": "국회예산정책처 「청년층 첫 직장 현황」: 계약직 출발 34.5%는 현재도 계약직, 정규직 출발 18.7%", "src": [["국회예산정책처 「청년층 첫 직장 현황」(2026.5.2 보도)", "https://v.daum.net/v/20260502202635766"]]}, {"t": "20대 임금 대기업 351만 vs 중소기업 230만 원", "src": [["아이뉴스24 2026.8.28 청년 일자리 대책 분석", "https://www.inews24.com/view/1999625"]]}]}, {"t": "청년 정책의 성적표는 몇 명한테 얼마 줬냐가 아니라, 3년 뒤 그 청년이 어디서 무엇을 하고 있느냐여야 합니다.", "ev": [{"t": "같은 말: 신동아(2804), 이맘때 Q8(2911)", "src": [["📼 관련 카드 #2804", "#card/2804"], ["📼 관련 카드 #2911", "#card/2911"]]}]}, {"t": "정권 바뀔 때마다 청년 정책 이름이 바뀝니다. 내일채움공제는 생겼다 없어졌고, 도약계좌는 미래적금으로 바뀌었습니다. 청년은 정책을 믿고 계획을 짜야 하는데, 나라가 계획을 자꾸 바꿉니다.", "ev": [{"t": "청년도약계좌 해지율 15.3%. 청년자산형성 사업 6개 부처 10개 중복(국회예산정책처 2025.11.14)", "src": [["청년도약계좌 해지율 15.3%(한경비즈니스)", "https://magazine.hankyung.com/business/article/202508051953b"], ["국회예산정책처 청년자산형성 지원사업 평가(2025.11.14)", "https://www.nabo.go.kr/ko/notice/releasesView.do?idx=8981"]]}]}]}, {"id": "region", "rank": 4, "title": "지방은 사다리가 통째로 없다 — 세 사다리", "tag": "김보미만 할 수 있는 말", "say": [{"t": "지방은 사다리가 통째로 없습니다. 배울 곳, 일할 곳, 정착할 곳. 이 세 사다리를 지역 안에 놓아야 합니다. 공장을 지어도 사람이 없으면 수도권에서 데려오고, 지역 청년은 구경꾼이 됩니다. 호남 청년이 공무원 시험이 아니라 AI와 반도체에서 꿈을 키울 수 있어야 합니다.", "ev": [{"t": "같은 말: 이맘때 Q12(2915), KBC Q10(1611), 무등일보(1226)", "src": [["📼 관련 카드 #2915", "#card/2915"], ["📼 관련 카드 #1611", "#card/1611"]]}, {"t": "비수도권 청년 취업 소요 24.6개월 vs 수도권 21.2개월(고용정보원 청년패널)", "src": [["고용정보원 청년패널, 비수도권 24.6개월(쿠키뉴스)", "https://www.kukinews.com/article/view/kuk202511270015"]]}, {"t": "지방국립대 2027 신입생 등록금 전액(2,130억). 반론: 수험생 63.9% \"그래도 안 간다\". 연세대 등록금 2.6% 인상", "src": [["세계일보 2026.8.28 지방국립대 등록금", "https://www.segye.com/newsView/20260828512116"], ["연세대 등록금 2.6% 인상(더팩트 2026.2.8)", "https://news.tf.co.kr/read/life/2290752.htm"]]}]}, {"t": "군대도 첫 직장이 될 수 있습니다. 월급을 제대로 받고 첨단 기술을 배우고 전역할 때 경력과 가산점을 들고나오는, 내가 선택해서 가는 첫 직장으로 군대를 바꿔야 합니다.", "ev": [{"t": "정치시그널 돌발 6(3020) 답변 그대로. 모병제 카드 3248", "src": [["📼 관련 카드 #3020", "#card/3020"], ["📼 관련 카드 #3248", "#card/3248"]]}]}]}, {"id": "ai", "rank": 5, "title": "AI — 위협인가 기회인가, 학생들에게 되묻기", "tag": "학생 질문 예상", "say": [{"t": "AI가 여러분에게 위협입니까, 기회입니까? 정말 궁금해서 묻는 겁니다. 저한테 AI는 기회입니다. 김보미365와 나라살림 돋보기를 혼자 만들었습니다. 그런데 그 일을 전에는 개발자 몇 명, 신입 몇 명이 몇 달 하던 일입니다. 그 자리가 청년이 첫 경력을 쌓던 일자리였습니다. AI가 다 해 주니 경력을 쌓을 일자리 자체가 없어집니다.", "ev": [{"t": "전체 원고는 카드 3210. 고교생 150만 천체 발견(Matteo Paz), 스탠퍼드 22~25세 AI 노출 직종 고용 13% 감소, 한국은행 341만 개 대체 가능", "src": [["📼 관련 카드 #3210", "#card/3210"]]}, {"t": "3년간 줄어든 청년 일자리 21.1만의 98.6%가 AI 노출 업종(아이뉴스24 8.28)", "src": [["아이뉴스24 2026.8.28 청년 일자리 대책 분석", "https://www.inews24.com/view/1999625"]]}, {"t": "\"AI 대전환으로 사라질 청년 일자리는 무엇인지…\" 신동아 Q6(2806) 원문", "src": [["📼 관련 카드 #2806", "#card/2806"]]}]}]}], "gov": [{"t": "정부의 틀: 2027년 청년 예산 43.3조(+53.5%, 28.2조에서), 고용노동부 청년 일자리 3.3조(+7천억). 세 갈래 — ① 첫 취업 못 한 청년에게 상담·일경험·수당(K-유스개런티) ② 청년 뽑는 기업에 장려금(도약장려금 10.5만→13만 명, 비수도권 최대 1,800만) ③ 저축에 나라가 얹어 주기(청년미래적금 1.7조).", "ev": [{"t": "노컷뉴스 8.28 2027 청년예산, 고용부 2027 예산", "src": [["노컷뉴스 2026.8.28 2027 청년예산", "https://nocutnews.co.kr/news/6571021"], ["고용노동부 2027 예산 보도자료(KDI)", "https://eiec.kdi.re.kr/policy/materialView.do?num=287616"], ["뉴스서울 2026.9.4 고용부 2027 예산", "https://newsseoul.co.kr/news/view/1065583215213139"]]}, {"t": "K-유스개런티 3,793억·16만 명은 매체마다 달라 비교에 쓰지 말 것(SBS Biz \"세부 미정\")", "src": [["K-유스개런티 3,793억·16만 명(뉴스서울 2026.9.4)", "https://newsseoul.co.kr/news/view/1065583215213139"], ["SBS Biz 2026.9.1 청년 일자리 예산", "https://biz.sbs.co.kr/amp/article/20000331977"]]}, {"t": "일경험 공공 2만·민간 4.5만, 인턴학기 6만, 첨단 직업훈련 12만. 2030 목표 전문인력 30만·일자리 20만·창업 10만", "src": [["SBS Biz 2026.9.1 청년 일자리 예산", "https://biz.sbs.co.kr/amp/article/20000331977"], ["아이뉴스24 2026.8.28 청년 일자리 대책 분석", "https://www.inews24.com/view/1999625"]]}]}, {"t": "노동 쟁점: 정년연장 중재안(2029년 61세→2037년 65세, 처리 목표 세 번 연기), 2027 최저임금 10,700원(+3.7%), 노란봉투법 2026.3.10 시행, 주4.5일은 법제화 아닌 지원(시범 324억), 청년고용촉진특별법 청년 연령 34세(2026.9.8).", "ev": [{"t": "정년연장 지연·KDI 0.2명·한국은행 0.4~1.5명", "src": [["주간경향 2026.8.29 정년연장 지연", "https://weekly.khan.co.kr/article/202608291624001"], ["헤럴드경제 2026.6.21 KDI 정년연장 분석", "https://www.heraldk.com/article/2026062118153278308"], ["머니투데이 2025.11.23 한은·KDI 정년 효과", "https://www.mt.co.kr/economy/2025/11/23/2025112113575318203"]]}, {"t": "최저임금 10,700원, 노란봉투법 시행 후 실제 교섭 10곳", "src": [["세계일보 2026.7.15 2027 최저임금", "https://www.segye.com/newsView/20260715519984"], ["세계일보 2026.6.22 노란봉투법 시행 후", "https://www.segye.com/newsView/20260622507507"]]}, {"t": "청년고용촉진특별법 개정, 공공기관 청년 의무고용 3% 일몰(2026.12.31) 연장 여부 미확인", "src": [["청년고용촉진특별법 개정 국회 통과(SBS Biz)", "https://biz.sbs.co.kr/amp/article/20000291545"], ["헤럴드경제 2026.4.28 윤준병 청년의무고용 7%", "https://www.heraldk.com/article/2026042815230055750"]]}]}, {"t": "비판: 공공 일자리 10만은 한시직, 민간 10만은 보조금 유도(사중손실), 임금격차 구조는 안 다룸. 도약장려금은 2025년 726억 미집행·111억 인건비 전용인데 단가를 2.5배 올림. 자발적 이직 구직급여는 고용보험기금 적자 속 월 2천억. 정부 반론: 공공기관 상반기 신규채용 12,592명(+약 2천), \"첫 경력이 가장 확실한 투자\".", "ev": [{"t": "아이뉴스24 8.28, 경기신문 7.27(예산정책처 결산), 세계일보 사설", "src": [["아이뉴스24 2026.8.28 청년 일자리 대책 분석", "https://www.inews24.com/view/1999625"], ["경기신문 2026.7.27 예산정책처 도약장려금 결산", "https://kgnews.co.kr/mobile/article.html?no=905336"]]}]}, {"t": "김보미 공약과의 차이: 정부 K-유스개런티는 상담·연결·일경험·수당까지. 청년취업보장제는 나라가 첫 고용의 인건비·교육비를 대고 기업·공공기관이 실제 일과 멘토링을 맡는, 경력으로 쳐 주는 첫 일자리. \"차이는 끝이 어디냐.\"", "ev": [{"t": "카드 3236·3216", "src": [["📼 관련 카드 #3236", "#card/3236"], ["📼 관련 카드 #3216", "#card/3216"]]}]}], "ask": [{"q": "\"정년 연장하면 청년 일자리가 준다. 청년 자리를 586이 깔고 앉는다.\"", "who": "개혁신당 김성열", "admit": "걱정은 맞다. 한국은행 0.4~1.5명, KDI 0.2명 감소 추정.", "hit": "\"그 걱정은 저도 합니다. 그래서 정년 연장은 청년 신규채용을 얼마나 보장할지부터 정하고 가야 합니다(조건부). 정면 부정하지 않는다. 최종 입장은 김보미가 정할 것.\"", "ev": [{"t": "한은·KDI 추정", "src": [["머니투데이 2025.11.23 한은·KDI 정년 효과", "https://www.mt.co.kr/economy/2025/11/23/2025112113575318203"], ["헤럴드경제 2026.6.21 KDI 정년연장 분석", "https://www.heraldk.com/article/2026062118153278308"]]}, {"t": "카드 3217(미확정)", "src": [["📼 관련 카드 #3217", "#card/3217"]]}]}, {"q": "\"최저임금을 지역별로 차등하면 지방 일자리가 는다.\"", "who": "개혁신당", "admit": "지방 일자리를 걱정하는 건 같다.", "hit": "\"하한이 7,020원이 됩니다. 강진 청년이 서울 청년과 같은 일 하고 30% 덜 받으면 강진에 남습니까, 떠납니까? 지방 살리자면서 지방 임금을 깎는 건 앞뒤가 안 맞습니다. 텍사스·캐나다 근거는 팩트체크에서 사실 아님으로 나왔습니다.\"", "ev": [{"t": "노컷 팩트체크 2025.5.28", "src": [["노컷뉴스 2025.5.28 최저임금 차등 팩트체크", "https://www.nocutnews.co.kr/news/6346286"]]}, {"t": "카드", "src": [["📼 관련 카드 #3215", "#card/3215"]]}]}, {"q": "\"청년 예산 43조, 빚으로 미래를 당겨 쓴다. 추경은 불난 집에 기름.\"", "who": "개혁신당 김성열", "admit": "빚 걱정은 맞다. 도약장려금 726억 못 쓴 것도 틀렸다.", "hit": "\"그래서 돈 쓰는 내역부터 10원까지 공개하자는 겁니다. 강진에서 군민이 예산을 보기 시작하니 낭비예산 108억이 깎였습니다. 안 쓰는 게 답이 아니라 첫 경력을 보장하는 데 쓰자는 겁니다.\"", "ev": [{"t": "김성열 4.9 모두발언, 예산정책처 결산", "src": [["김성열 최고위원 모두발언 — 추경 비판(개혁신당 2026.4.9)", "https://reformparty.kr/news/press/665-press-764"], ["경기신문 2026.7.27 예산정책처 도약장려금 결산", "https://kgnews.co.kr/mobile/article.html?no=905336"]]}, {"t": "카드", "src": [["📼 관련 카드 #3282", "#card/3282"]]}]}, {"q": "\"공공 일자리 38만 개, 졸업실업급여 24만 — 국가가 책임져야.\"", "who": "진보당 박태훈", "admit": "국가가 책임지자는 방향은 같은 편.", "hit": "\"다만 38만 개가 또 한시직이면 경력이 안 됩니다. 저는 숫자보다 하나하나가 경력으로 인정되는 첫 일자리를 보장하자는 쪽입니다. 38만 개 1년치 예산을 같이 계산해 보시죠.\"", "ev": [{"t": "진보당 경기도당 10.8 논평", "src": [["인천일보 2026.10.8 진보당 경기도당 청년 논평", "https://www.incheonilbo.com/news/articleView.html?idxno=1333767"]]}, {"t": "카드", "src": [["📼 관련 카드 #3225", "#card/3225"]]}]}, {"q": "\"규제 때문에 기업이 못 뽑는다. 노란봉투법·주52시간을 풀어야.\"", "who": "국민의힘 논리(학생 질문 가능)", "admit": "기업이 안 뽑으면 일자리가 없다는 건 맞다.", "hit": "\"그럼 규제 풀면 신입을 뽑습니까? 기업은 규제가 아니라 신입 가르치는 비용 때문에 경력을 찾습니다. 그 비용을 나라가 나눠 지자는 게 청년취업보장제입니다. 근로시간 늘려 생긴 일자리에서 첫 직장 열에 일곱이 1년 반 만에 나갑니다. 이유 1위가 근로여건입니다.\"", "ev": [{"t": "노란봉투법 시행 후 실제 교섭 10곳", "src": [["세계일보 2026.6.22 노란봉투법 시행 후", "https://www.segye.com/newsView/20260622507507"]]}, {"t": "퇴사 이유 1위 근로여건 44.4%", "src": [["첫 직장 퇴사 70.7%·근속 18.4개월(헤럴드경제 2026.5.4)", "https://www.heraldk.com/article/2026050404000057847"]]}]}, {"q": "\"청년이 눈이 높다. 중소기업은 사람이 없다.\"", "who": "학생·보수", "admit": "중소기업 구인난은 사실이다.", "hit": "\"첫 직장을 그만두는 이유 1위는 근로여건 불만 44.4%이지 전공 불일치 7.2%가 아닙니다. 20대 임금이 대기업 351만, 중소기업 230만입니다. 눈이 높은 게 아니라 조건이 견딜 만하지 않은 겁니다. 박태훈 위원장도 같은 숫자를 씁니다.\"", "ev": [{"t": "예산정책처·박태훈 칼럼", "src": [["첫 직장 퇴사 70.7%·근속 18.4개월(헤럴드경제 2026.5.4)", "https://www.heraldk.com/article/2026050404000057847"], ["오마이뉴스 2026.8.28 박태훈의 청년 오늘 3화", "https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003262261"]]}, {"t": "임금 격차", "src": [["아이뉴스24 2026.8.28 청년 일자리 대책 분석", "https://www.inews24.com/view/1999625"]]}]}, {"q": "\"15~34세로 넓히면 고용률 56%다. 통계가 나쁘지 않다.\"", "who": "정부 옹호 논리", "admit": "기준을 넓히면 그렇게 보인다.", "hit": "\"15~29세는 44.0%로 29개월째 떨어지고 있습니다. 기준을 바꿔서 좋아 보이게 하는 건 착시입니다. 저는 민주당이지만 그렇게 말하지 않겠습니다.\"", "ev": [{"t": "9월 고용동향, 15~34세 56.1% 논란", "src": [["국가데이터처 9월 고용동향(KDI)", "https://eiec.kdi.re.kr/policy/materialView.do?num=288191"], ["9월 고용동향·청년 15~34세 통계(아이뉴스24)", "https://www.inews24.com/view/2015634"]]}]}, {"q": "\"정권 바뀔 때마다 청년 정책 이름이 바뀐다. 믿을 수 있나.\"", "who": "학생", "admit": "맞다. 내일채움공제→없어짐, 도약계좌→미래적금.", "hit": "\"예산정책처도 10개 사업이 겹친다고 했습니다. 하나로 합치고 정권이 바뀌어도 가게 법에 박아야 합니다. 청년은 정책을 믿고 인생 계획을 짭니다.\"", "ev": [{"t": "도약계좌 해지율, 10개 사업 중복", "src": [["청년도약계좌 해지율 15.3%(한경비즈니스)", "https://magazine.hankyung.com/business/article/202508051953b"], ["국회예산정책처 청년자산형성 지원사업 평가(2025.11.14)", "https://www.nabo.go.kr/ko/notice/releasesView.do?idx=8981"]]}, {"t": "카드", "src": [["📼 관련 카드 #3243", "#card/3243"]]}]}], "parties": [["민주당·정부", "첫 경력 지원(K-유스개런티·장려금·일경험), 정년연장 단계안, 노란봉투법 시행, 주4.5일 시범", [["뉴스서울 2026.9.4 고용부 2027 예산", "https://newsseoul.co.kr/news/view/1065583215213139"], ["주간경향 2026.8.29 정년연장 지연", "https://weekly.khan.co.kr/article/202608291624001"]], {"pro": "\"첫 경력이 가장 확실한 투자\"라는 진단이 김보미와 같다. 청년 예산 43.3조(+53.5%), 고용부 청년 일자리 3.3조, 도약장려금 단가를 비수도권 최대 1,800만 원으로 올려 지방 청년을 챙겼다. 공공기관 상반기 신규채용도 늘렸다.", "con": "① 공공 일자리 10만은 한시직, 민간 10만은 보조금 유도라 보조금 끊기면 사라진다(사중손실). ② 도약장려금 2025년 726억 미집행, 111억 인건비 전용 — 못 쓴 돈을 더 올렸다. ③ 자발적 이직 구직급여는 고용보험기금 적자 속 월 2천억 추가. ④ 3년간 줄어든 청년 일자리 21.1만의 98.6%가 AI 노출 업종인데 AI 전환 대책이 얇다. ⑤ 정년연장 처리 목표를 세 번 넘겼고, 청년 신규채용 보장 조항이 없다. ⑥ 정책 이름이 자꾸 바뀐다(내일채움공제→도약계좌→미래적금).", "rebut": "상대(김성열): \"43조, 빚으로 미래를 당겨 쓴다.\" 김보미 답: \"빚 걱정은 맞습니다. 그래서 10원까지 공개하자는 겁니다. 강진에서 군민이 예산을 보기 시작하니 낭비예산 108억이 깎였습니다. 726억 못 쓴 건 틀렸다고 인정합니다. 그런데 안 쓰는 게 답은 아닙니다. 첫 경력을 나라가 보증하는 청년취업보장제로 돈의 끝을 바꾸자는 겁니다.\"", "agree": "첫 경력 지원이라는 방향은 같이 간다. 차이는 \"상담·수당까지\"(정부)와 \"실제 첫 고용 보장\"(김보미)."}], ["국민의힘", "노란봉투법 재개정·폐지 검토, 주52시간 예외 확대, 주4.5일 \"포퓰리즘\", 정년연장은 임금체계 연동·재고용 선택. \"노조 편들다 청년 일자리 막았다\"", [["뉴시스 2026.4.15 노란봉투법 재개정 추진", "https://www.newsis.com/view/NISX20260415_0003592170"], ["MTN 2026.7.31 주52시간 예외 확대 법안", "https://news.mtn.co.kr/news-detail/2026073116400448666"], ["SBS Biz 2026.10.13 정년연장 국감", "https://biz.sbs.co.kr/amp/article/20000339666"]], {"pro": "기업이 사람을 안 뽑으면 청년 일자리가 없다는 논리는 단순하고 강하다. 정년연장을 임금체계 개편·재고용과 묶자는 안은 KDI·한국은행의 청년 고용 감소 추정과 맞닿는다. 500대 기업 61%가 채용 계획이 없다는 숫자가 이쪽 근거다.", "con": "① 노란봉투법 폐지·주52시간 예외는 첫 직장에 들어간 청년의 근로조건을 깎는다 — 첫 직장을 그만두는 이유 1위가 근로여건 불만(44.4%)이다. ② 주4.5일을 \"포퓰리즘\"이라 하면서 청년 노동시간 대안이 없다. ③ \"기업 자율\"에 맡긴 결과가 지금의 경력직 선호·수시채용이다. ④ 청년 대표 공약이 대출·주식 쪽(청년 공약 10건)이라 일자리 그 자체가 약하다.", "rebut": "상대가 \"규제 때문에 못 뽑는다\"고 하면: \"그럼 규제 풀면 신입을 뽑습니까? 기업은 규제가 아니라 신입 가르치는 비용 때문에 경력을 찾습니다. 그 비용을 나라가 나눠 지자는 게 청년취업보장제입니다. 근로시간 늘려서 생긴 일자리에 첫 직장 열에 일곱이 1년 반 만에 나갑니다.\"", "agree": "정년연장에 청년 고용 영향을 따져 보자는 점은 같다(김보미 조건부 안)."}], ["개혁신당", "최저임금 지역별 ±30% 차등(팩트체크 \"근거 사실 아님\"), 정년연장 반대(\"청년 일자리 어떻게 느나\"), 든든출발자금 5천만 원 대출, 규제 완화", [["노컷뉴스 2025.5.28 최저임금 차등 팩트체크", "https://www.nocutnews.co.kr/news/6346286"], ["파이낸셜뉴스 2025.5.19 이준석 정년연장", "https://www.fnnews.com/news/202505191418234808"], ["더팩트 2025.5.25 든든출발자금", "https://news.tf.co.kr/read/ptoday/2208718.htm"]], {"pro": "정년연장이 청년 일자리를 줄인다는 걱정은 한국은행(0.4~1.5명)·KDI(0.2명) 추정으로 뒷받침된다. 세대 간 형평을 정면으로 말하는 유일한 당이라 2030 남성층에 호소력이 있다. 든든출발자금은 청년에게 바로 닿는 공약이다.", "con": "① 최저임금 지역 차등은 하한이 7,020원 — 강진 청년은 같은 일 하고 30% 덜 받는다. 텍사스·캐나다 근거는 팩트체크에서 \"사실 아님\". ② 5천만 원 대출은 빚으로 시작하라는 것이고 상환 설계가 없다. ③ 정년연장 \"반대\"만 있고 고령 빈곤 대안이 없다. ④ 김성열 본인은 추경을 \"불난 집에 기름\"이라며 재정 긴축을 말하는데, 긴축으로는 첫 경력 보장을 못 한다. ⑤ 3석.", "rebut": "상대(김성열): \"정년연장하면 청년 일자리 어떻게 늡니까.\" 김보미 답: \"그 걱정은 저도 합니다. 그래서 청년 신규채용 보장을 조건으로 걸자는 겁니다. 그런데 최저임금 차등은 묻겠습니다. 강진 청년이 서울 청년보다 30% 덜 받으면 강진에 남습니까, 떠납니까? 지방을 살리자면서 지방 임금을 깎는 건 앞뒤가 안 맞습니다.\"", "agree": "정년연장-청년고용 연계라는 문제의식은 공유. 답이 다를 뿐."}], ["진보당", "청년일자리 국가책임제(공공 일자리 38만, 졸업실업급여 24만), 5인 미만 근로기준법 전면 적용, 최저임금 생계비 기준·플랫폼 적용, 정년연장 환영, 메가특구 노동특례 반대", [["인천일보 2026.10.8 진보당 경기도당 청년 논평", "https://www.incheonilbo.com/news/articleView.html?idxno=1333767"], ["시대일보 2026.10.20 5인 미만 근기법", "https://www.sidae.com/article/2026101513065895682"], ["미래경제뉴스 2026.7.15 진보당 최저임금 논평", "https://www.m-economynews.com/mobile/article.html?no=68774"], ["한국사회복지저널 2026.10.12 메가특구 특례 반대", "https://www.ksw-news.com/news/articleView.html?idxno=3045431"], ["다음 2026.6.10 윤종오 정년연장", "https://v.daum.net/v/20260610160122366"]], {"pro": "\"국가 책임\"이라는 틀이 김보미 청년취업보장제와 가장 가깝다. 5인 미만 사업장 근기법 적용은 첫 직장이 영세업체인 청년을 바로 지킨다. 고졸·플랫폼 청년까지 챙기는 점이 다른 당에 없다.", "con": "① 공공 일자리 38만·졸업실업급여 24만의 연도별 재원표가 없다 — 정부 119만 호도 현실성 논란인데 그보다 크다. ② 공공 일자리는 경력이 안 되는 한시직이 되기 쉽다(정부 10만과 같은 문제). ③ 정년연장을 조건 없이 환영하면 청년 신규채용 감소 추정에 답이 없다. ④ 최저임금 생계비 기준은 5인 미만 영세 자영업 폐업과 충돌. ⑤ 4석.", "rebut": "상대(박태훈): \"민주당 정부는 보조금으로 기업만 챙긴다.\" 김보미 답: \"국가가 책임지자는 데는 같은 편입니다. 다만 공공 일자리 38만 개가 또 한시직이면 경력이 안 됩니다. 저는 숫자보다 하나하나가 경력으로 인정되는 첫 일자리를 보장하자는 쪽입니다. 그리고 38만 개 1년 예산이 얼마인지 같이 계산해 보시죠.\"", "agree": "5인 미만 근기법, 국가 책임 원칙에서 연대 가능."}], ["조국혁신당·정의당·사민당", "AI 일자리 안심보장제·고용영향평가(조국), 일자리 보장제·빅테크 AI 전환기금(정의), 로봇세 AI 일자리기금(사민)", [["뉴시스 2026.5.13 조국혁신당 99년 아파트", "https://www.newsis.com/view/NISX20260513_0003627476"], ["프레시안 2026.5.15 정의당 일자리 공약", "https://pressian.com/pages/articles/2026051413544576863"]], {"pro": "AI가 청년 신입 자리를 먼저 없앤다는 문제를 정면으로 다룬다 — 김보미의 \"경력 쌓을 일자리 자체가 없어진다\"와 같은 문제의식. 빅테크·로봇에 과세해 전환 비용을 대자는 재원 아이디어가 있다.", "con": "① 로봇세·AI 기금은 과세 대상 정의가 어렵고 투자 위축 반론이 있다. ② 고용영향평가는 절차라서 일자리를 만들지 않는다. ③ 원외(정의·사민 각 1석 이하)라 실행 수단이 없다.", "rebut": "학생이 AI를 물으면: \"사라질 일자리와 생길 일자리를 정부가 먼저 계산하고 청년을 옮겨 주자는 겁니다. 로봇세보다 먼저 할 일은, AI가 없앤 신입 자리를 나라가 첫 경력으로 보장하는 겁니다.\"", "agree": "AI 전환 비용을 사회가 나눠 진다는 원칙은 같다."}]], "hw": [["의제 2 \"어디서부터\"에 대한 김보미 답 한 줄과 근거 숫자 셋은?", "\"첫 직장 문턱부터. 경력이라는 보증금을 나라가 대신 내자(청년취업보장제).\" 47개월 연속 감소, 취업 경험 84.8% 최저, 계약직 출발 34.5%.", [["📼 관련 카드 #3205", "#card/3205"], ["2026년 9월 고용동향, 청년 취업자 47개월 감소(스마트투데이)", "https://www.smarttoday.co.kr/ko-kr/articles/112773"], ["2026년 5월 청년층 부가조사(국가데이터처, KDI 요약)", "https://eiec.kdi.re.kr/policy/materialView.do?num=284575"], ["국회예산정책처 「청년층 첫 직장 현황」(2026.5.2 보도)", "https://v.daum.net/v/20260502202635766"]]], ["\"18.4개월\"의 진짜 뜻과 토론에서 쓰는 법은?", "첫 직장을 그만둔 청년의 평균 근속기간(예산정책처), 취업 소요는 11.2개월. \"취업까지 걸린 기간이 아니라 첫 직장을 버틴 기간입니다. 그래서 더 아픈 숫자입니다.\" 학생 체면 지키며.", [["첫 직장 퇴사 70.7%·근속 18.4개월(헤럴드경제 2026.5.4)", "https://www.heraldk.com/article/2026050404000057847"], ["2026년 5월 청년층 부가조사(국가데이터처, KDI 요약)", "https://eiec.kdi.re.kr/policy/materialView.do?num=284575"], ["📼 관련 카드 #3273", "#card/3273"]]], ["이수율과 대졸 고용률 숫자는?", "25~34세 이수율 71.1%(OECD 1위), 25~64세 대졸 고용률 80.1% vs OECD 86.0%. \"여러분이 공부를 덜 해서가 아닙니다.\"", [["OECD 교육지표 2026(파이낸셜뉴스 2026.9.29)", "https://www.fnnews.com/news/202609291351196534"]]], ["2027년 청년 예산 총액과 고용부 청년 일자리 예산은?", "43조 3천억(+53.5%), 고용부 3조 3천억(+7천억). \"29.9조\"는 틀린 숫자.", [["노컷뉴스 2026.8.28 2027 청년예산", "https://nocutnews.co.kr/news/6571021"], ["고용노동부 2027 예산 보도자료(KDI)", "https://eiec.kdi.re.kr/policy/materialView.do?num=287616"]]], ["K-유스개런티와 청년취업보장제는 어떻게 다른가?", "정부는 상담·연결·일경험·수당까지, 김보미는 실제 첫 고용(경력으로 쳐 주는 일자리) 보장. \"차이는 끝이 어디냐.\" 3,793억·16만 명은 매체마다 달라 비교에 쓰지 말 것.", [["K-유스개런티 3, 727500064"], ["경향신문 2026.7.25 신장식 대표", "https://www.khan.co.kr/article/202607251647001/amp"], ["위키트리 2026.8.29 정의당 양경규", "https://www.wikitree.co.kr/articles/1155862"], ["주간경향 2026.9.7 기본소득당 오준호", "https://weekly.khan.co.kr/article/202609071125011"]]}, {"t": "개혁신당 비호감도 73%로 전 정당 중 최고(갤럽 7월). 6·3 지선 기초의원 1석. 진보당 지선 광역 7·기초 34", "src": [["여성신문 2026.7.10 갤럽 비호감도", "https://www.womennews.co.kr/news/articleView.html?idxno=279787"], ["주간경향 2026.8.26 이준석 사퇴", "https://weekly.khan.co.kr/article/202608260909001"]]}], "gov": [["정당 비교표 보기", "주거 해법·대출 규제·최저임금·정년 연장·노동법·청년 대표 정책을 여섯 정당 나란히 놓은 표와, 상대별 공략·받아치기 카드는 토론회 「정당 비교」 탭에 있다.", [["📼 관련 카드 #/parties", "#event/parties"]]]], "parties": [["민주당", "공공 공급 119만·보편형 19만, 청년예산 43.3조. 약점: 보편형 쏠림, 세입자 대책, 청년최고위원 부결·기탁금", [["국토부 주거안정플랜 발표(정책브리핑 2026.9.21)", "https://www.korea.kr/news/policyNewsView.do?newsId=148972316"], ["뉴시스 2026.7.15 청년최고위원 부결", "https://www.newsis.com/view/NISX20260715_0003710124"], ["데일리안 2026.7.22 기탁금 조정", "https://www.dailian.co.kr/news/view2/1669360"]], {"pro": "집권당이라 돈과 수단이 있다. 공공 공급·청년 예산 두 배·첫 경력 지원까지 숫자로 약속했고, 161석이라 실행할 수 있다.", "con": "정책의 약점(보편형 쏠림, 세입자 대책 공백, 한시직 일자리, 정책 이름 바꾸기)에 더해 당 자체의 약점이 있다 — 청년최고위원제 부결, 기탁금 2,000만 원, 청년 후보 전원 탈락. \"청년 정책을 청년 없이 만든다\"는 비판은 김보미 본인이 한 말이다.", "rebut": "상대가 \"민주당도 똑같다\"고 하면 부정하지 말 것: \"맞습니다. 저도 그렇게 말했습니다. 그래서 바꾸려고 당대표 선거에 나갔고, 떨어졌지만 계속 하고 있습니다. 틀린 건 틀렸다고 하는 민주당 사람도 있다는 걸 오늘 보여 드리겠습니다.\"", "agree": ""}], ["국민의힘", "재초환 폐지·반값전세·등록임대 부활, 노란봉투법 재개정, 주52시간 예외 확대. 주거권네트워크 \"집주인 공약\". 청년안심주택 보증금 사태", [["머니투데이 2026.5.12 국민의힘 지선 1호 공약", "https://www.mt.co.kr/politics/2026/05/12/2026051115314050355"], ["참여연대·주거권네트워크 2026.5.18 지선 주거공약 평가", "https://peoplepower21.org/stablelife/2023030"], ["청년안심주택 296가구 보증금 선지급(서울시 2025.10.2)", "https://mediahub.seoul.go.kr/archives/2015796"]], {"pro": "공급 부족·기업 채용 위축이라는 진단은 공감을 얻는다. ARS 조사에서 20대 지지가 민주당보다 높게 나오는 조사가 있을 만큼 2030에 파고들었다.", "con": "해법이 집주인·기업 쪽으로 기운다 — 재초환 폐지, 등록임대 부활, 노란봉투법 폐지, 주52시간 예외. 세입자이고 신입인 청년에게는 거꾸로 작용할 수 있다. 서울시 청년안심주택(민간 모델)의 보증금 미반환이 반례. 오늘 토론에 안 나오지만 학생 질문으로 나올 수 있다.", "rebut": "\"국민의힘 안은 어떻게 보나\"가 나오면: \"공급이 부족하다는 건 맞습니다. 그런데 재건축으로 나오는 집은 학생이 살 집이 아니고, 민간에 맡긴 청년주택은 보증금을 떼였습니다. 청년은 세입자이고 신입입니다. 그 두 자리를 지키는 공약인지부터 보십시오.\"", "agree": ""}], ["개혁신당(김성열)", "대출 정상화·민간 공급, 최저임금 ±30%, 정년연장 반대, 재정 건전성(\"추경은 불난 집에 기름\"). 세입자 대책 없음", [["머니투데이 2026.7.20 이준석 대출규제 비판", "https://www.mt.co.kr/politics/2026/07/20/2026072009394764215"], ["노컷뉴스 2025.5.28 최저임금 차등 팩트체크", "https://www.nocutnews.co.kr/news/6346286"], ["김성열 최고위원 모두발언 — 추경 비판(개혁신당 2026.4.9)", "https://reformparty.kr/news/press/665-press-764"], ["참여연대·주거권네트워크 2026.5.18 지선 주거공약 평가", "https://peoplepower21.org/stablelife/2023030"]], {"pro": "세대 형평·시장 원리를 또렷하게 말한다. 대출 규제가 청년을 골라 때렸다, 정년연장이 청년 자리를 줄인다는 두 지적은 숫자 근거가 있다. 김성열 전 최고위원은 민주당 보좌진 출신이라 민주당 내부 비판이 구체적일 것.", "con": "① 청년 대다수가 세입자인데 세입자 대책이 두 번 연속 \"거의 없음\". ② 대출 완화는 집값을 먼저 올린다. ③ 최저임금 지역 차등은 지방 청년 임금을 깎는다(팩트체크 \"근거 사실 아님\"). ④ 재정 긴축과 청년 일자리 보장은 같이 갈 수 없다. ⑤ 이준석 대표 사퇴 뒤 비대위, 3석 — 공약을 실행할 힘이 약하다.", "rebut": "공격 두 가지만 기억: (주거) \"세입자 대책이 공약에 한 줄도 없습니다.\" (일자리) \"강진 청년 임금을 30% 깎으면 강진에 남습니까?\" 인신공격·과거(참고인 조사, 탈당·복당, 하남갑 득표)는 절대 먼저 꺼내지 않는다.", "agree": "청년·신혼 대출 예외, 정년연장-청년고용 연계 문제의식은 같이 말할 수 있다."}], ["진보당(박태훈)", "장기공공임대 20%, 임대료 상한, 청년일자리 국가책임제, 5인 미만 근기법. 이재명 정부엔 비판적 지지, 박태훈은 대통령과 가까움", [["참여연대·주거권네트워크 2026.5.18 지선 주거공약 평가", "https://peoplepower21.org/stablelife/2023030"], ["인천일보 2026.10.8 진보당 경기도당 청년 논평", "https://www.incheonilbo.com/news/articleView.html?idxno=1333767"], ["서울신문 2026.7.27 김종훈 대표 선출", "https://www.seoul.co.kr/news/politics/2026/07/27/20260727500064"], ["폴리뉴스 2026.9.14 이재명 대통령, 박태훈 글에 답", "https://www.polinews.co.kr/news/articleView.html?idxno=743042"]], {"pro": "세입자·영세 사업장 청년을 가장 두텁게 지킨다. 공공임대 확대·국가 책임 일자리에서 김보미와 같은 편이 돼 개혁신당과 2대1 구도를 만들 수 있다. 박태훈 위원장은 대학생 당사자라 학생 공감이 높다.", "con": "① 38만 공공 일자리, 지역별 20% 공공임대 — 재원표가 없다. ② 임대료 상한·갱신 무제한은 공급 감소 반론에 한 번 철회된 안. ③ 조건 없는 정년연장 환영은 청년 고용 감소 추정에 답이 없다. ④ 4석. ⑤ 민주당 정부와 가까워서 \"비판적 지지\"의 선이 흐릿하다.", "rebut": "같은 편으로 묶되 숫자로 구분: \"방향은 같습니다. 그런데 20%와 38만의 1년치 예산을 같이 계산해 보시죠. 저는 숫자가 큰 약속보다, 하나하나가 경력이 되는 첫 일자리와 이미 있는 공공의 방부터 채우는 쪽입니다.\"", "agree": "공공임대 확대, 5인 미만 근기법, 국가 책임 원칙에서 연대."}], ["조국혁신당", "99년 국민안심아파트, AI 일자리 안심보장제. 검찰개혁 1순위", [["뉴시스 2026.5.13 조국혁신당 99년 아파트", "https://www.newsis.com/view/NISX20260513_0003627476"], ["경향신문 2026.7.25 신장식 대표", "https://www.khan.co.kr/article/202607251647001/amp"]], {"pro": "영구 임대·AI 일자리 보장이라는 선명한 메시지. 12석.", "con": "주거·일자리가 당의 중심 의제가 아니고(검찰개혁 1순위) 재원 계산이 없다. 학생 원룸 같은 단기 수요에 답이 아니다.", "rebut": "학생이 물으면 한 줄: \"방향은 좋지만 학생에게 필요한 건 99년이 아니라 당장 4년입니다.\"", "agree": ""}], ["정의당·기본소득당·사민당", "정의당 세입자 보호 공약이 지선 평가 1위(원외). 기본소득당 1석(용혜인 장관 후보자). 사민당 로봇세 AI 일자리기금", [["참여연대·주거권네트워크 2026.5.18 지선 주거공약 평가", "https://peoplepower21.org/stablelife/2023030"], ["주간경향 2026.9.7 기본소득당 오준호", "https://weekly.khan.co.kr/article/202609071125011"]], {"pro": "세입자 보호 공약이 시민단체 평가에서 가장 좋다(정의당). AI 전환 비용을 사회가 나눠 지자는 재원 발상이 있다.", "con": "원외이거나 1석이라 실행 수단이 없고, 로봇세·일자리 보장제는 재원·과세 정의가 불명확하다.", "rebut": "\"군소정당 공약은 어떻게 보나\": \"세입자 보호는 정의당 안이 가장 낫다고 시민단체가 평가했습니다. 좋은 안은 누가 냈든 가져다 쓰는 게 정치입니다.\"", "agree": ""}]], "issues": [["토론 구도", "공공임대 확대에서 진보당과 같은 편, 개혁신당과 1대2 구도가 가능. 단 \"20%\"의 분모가 다르다(진보당 지역별 20% / 정부 전체 주택 10% / 민주당 특위 임대시장 20%).", [["뉴시스 2026.9.17 민주당 주거복지특위", "https://www.newsis.com/view/NISX20260917_0003793435"], ["한국사회복지저널 2026.9.28 정태흥 9.21 비판", "https://www.ksw-news.com/news/articleView.html?idxno=3040183"], ["📼 관련 카드 #3223", "#card/3223"]]], ["김성열은 민주당 출신", "민주당 보좌진 출신이라 \"민주당은 청년을 병풍으로 쓴다\"는 공격이 날카로울 것. 답: 맞다, 저도 똑같이 말했다. 바꾸려면 결정하는 방에 들어가야 한다.", [["📼 관련 카드 #3284", "#card/3284"], ["📼 관련 카드 #3281", "#card/3281"]]]], "hw": [["여섯 정당의 의석수를 말해 보라.", "민주 161, 국민의힘 110, 조국혁신당 12, 진보당 4, 개혁신당 3, 기본소득당 1, 사회민주당 1(6·3 재보선 후 기준, 10월 현재 미확인).", [["연합/다음 2026.6.4 재보선 후 의석", "https://v.daum.net/v/20260604050957548"], ["경북매일 2026.8.31 개혁신당 3석", "https://kbmaeil.com/article/20260830500658"]]], ["공공임대 \"20%\"가 세 가지로 다른 이유는?", "진보당은 지역별 주택의 20%, 정부는 전체 주택의 10%(250만 호), 민주당 주거복지특위는 임대시장의 20%. 분모가 다르니 같은 숫자로 비교하면 안 된다.", r/plc/promotion/initUPRPromotionDetail.do?no=89"]]}], "gov": [["조사 읽는 법", "표본·방식·기간·의뢰처를 본다. 전화면접과 ARS는 응답층이 달라 결과가 갈린다. 상세는 중앙선거여론조사심의위원회 홈페이지. 토론에서는 \"갤럽 조사로는\"처럼 기관 이름을 먼저 말한다.", [["한국갤럽 10.20~22 대통령 40%·민주 37%·국힘 28%(전자신문 2026.10.23)", "https://www.etnews.com/20261023000145"], ["뉴스토마토 2026.10.8 미디어토마토", "https://newstomato.com/ReadNews.aspx?no=1315995"]]]], "parties": null, "issues": [["\"20대가 민주당을 떠났다\"", "답: 떠난 게 아니라 기대할 이유를 못 찾은 것. 갤럽에서 18~29세 무당층이 47%다. 분노보다 무서운 게 무관심. 그래서 청년이 결정하는 자리에 앉게 하자.", [["톱스타뉴스 2026.10.16 갤럽 10월 3주", "https://www.topstarnews.net/news/articleView.html?idxno=16248734"], ["📼 관련 카드 #3231", "#card/3231"]]]], "hw": [["갤럽 최신 정당 지지도와 18~29세 수치는?", "10.20~22: 민주 37%·국민의힘 28%. 10.13~15 조사에서 18~29세는 민주 18%·국민의힘 27%·무당층 47%.", [["한국갤럽 10.20~22 대통령 40%·민주 37%·국힘 28%(전자신문 2026.10.23)", "https://www.etnews.com/20261023000145"], ["톱스타뉴스 2026.10.16 갤럽 10월 3주", "https://www.topstarnews.net/news/articleView.html?idxno=16248734"]]], ["왜 \"청년이 국민의힘으로 갔다\"고 말하면 위험한가?", "전화면접(갤럽)에서는 18~29세 무당층이 47%로 가장 많고, ARS에서만 국민의힘이 크게 앞선다. 방식에 따라 정반대라 조사기관을 붙이지 않으면 반박당한다.", [["톱스타뉴스 2026.10.16 갤럽 10월 3주", "https://www.topstarnews.net/news/articleView.html?idxno=16248734"], ["위키트리 2026.10.6 여론조사공정(ARS)", "https://www.wikitree.co.kr/articles/1164344"]]]]}, {"id": "local", "unit": "지방·강진", "title": "7. 지방 청년과 강진 — 김보미만 할 수 있는 이야기", "time": "10분", "one": "서울 청년의 주거 절망과 지방 청년의 일자리 절망은 같은 문제의 양면이다. 강진은 빈집이 늘고, 미래대응기금 때문에 보통교부세가 30% 줄 수 있다는 분석이 나왔다.", "easy": "서울은 방이 없어 난리인데 강진은 사람이 없어 빈집이 는다. 지방에 좋은 일자리와 학교가 있어야 처음부터 서울로 안 올라와도 된다. 김보미는 강진에서 임대아파트에 살면서 수도권에서는 방을 못 구해 언니 집에서 출퇴근한다. 이 경험이 상대 두 사람에게 없는 김보미의 무기다.", "nums": [{"t": "승원팰리체 리버시티 전용 84㎡(34평형), 226세대, 10년 민간임대. 강진 30평대 아파트 평당 평균 808만 원", "src": [["승원팰리체 리버시티 전용84㎡ 34평형 226세대(장강뉴스)", "https://www.jgynews.com/news/articleView.html?idxno=33434"], ["승원팰리체 리버시티 10년 민간임대(강진일보)", "https://www.nsori.com/news/articleView.html?idxno=23309"], ["강진군 30평대 아파트 시세·실거래(리치고)", "https://m.richgo.ai/realty/apt-hub/%EC%A0%84%EB%82%A8%EA%B4%91%EC%A3%BC/%EA%B0%95%EC%A7%84%EA%B5%B0/30%ED%8F%89%EB%8C%80"]]}, {"t": "미래대응기금(162.3조) 전출분을 내국세에서 먼저 빼면 2027년 강진군 보통교부세 3,580억→2,490억(-1,090억, 30.4%) 분석(나라살림연구소). 전국 감소 29.6조(강광석)/30.5조(서명옥)로 매체마다 다름", "src": [["강진군 보통교부세 1,090억(30.4%) 감소 분석(중도일보 2026.10.23)", "https://www.joongdo.co.kr/web/view.php?key=20261023010006661"]]}, {"t": "전남형 청년마을 4,191명 다녀가 68명 정착. 화순 만원주택 567명 전입. 강진 육아양육수당 월 60만 원, 시행 전후 출생아 83→128명(군 통계)", "src": [["전남형 청년마을 4,191명 중 68명 정착(헤럴드경제 2026.6.3)", "https://www.heraldk.com/article/2026060317462970644"], ["화순 만원주택, 567명 전입(위키트리)", "https://www.wikitree.co.kr/articles/1143545"], ["강진 육아수당 출생아 +54.2%(뉴스서울)", "https://newsseoul.co.kr/news/view/1065584424875698"]]}, {"t": "경남 청년 행복주택 대기 5.7개월(2024)→8.1개월(2026), 매입임대 경쟁률 12대 1에 계약 포기 645명(진보당 전희영, LH 자료)", "src": [["노컷뉴스 2026.10.19 경남 청년 임대 대기", "https://nocutnews.co.kr/news/6593477"]]}, {"t": "강진 청년기본조례 청년 나이 49세→45세(2022.12). 이유: 45·50세면 부모 세대까지 들어와 진짜 청년이 빠진다", "src": [["강진 청년기본조례 45세 조정(미래일보 2022)", "https://hkmd.kr/news/article.html?no=70232"], ["📼 관련 카드 #3206", "#card/3206"]]}], "gov": [["정부 균형발전 정책", "지방국립대 등록금 전액(2027), 서울대 10개 만들기(부산대·전남대·충남대 3곳 선정, 학교당 5년 약 5천억), 비수도권 도약장려금 1,800만·미래적금 25%, 메가프로젝트·호남 반도체. 반론: 수험생 63.9% \"등록금 전액 지원해도 지방국립대 안 간다\".", [["세계일보 2026.8.28 지방국립대 등록금", "https://www.segye.com/newsView/20260828512116"], ["2027 청년 첫취업·도약장려금(SBS Biz 2026.9.1)", "https://biz.sbs.co.kr/amp/article/20000331977"], ["📼 관련 카드 #1611", "#card/1611"]]]], "parties": null, "issues": [["\"지방 기피는 심리 문제, 법인세를 지자체가 정하게\"(이준석 발언)", "답: 면소재지에 밥 먹을 식당이 없어지는 건 심리가 아니다. 세금 몇 % 깎아 준다고 기업이 오지 않는다. 사람·교통·학교가 먼저.", [["이준석 연세대 학식먹자(시대 2025.5.12)", "https://www.sidae.com/article/2025051214455242590"], ["전남형 청년마을 4,191명 중 68명 정착(헤럴드경제 2026.6.3)", "https://www.heraldk.com/article/2026060317462970644"], ["📼 관련 카드 #3214", "#card/3214"]]], ["\"농어촌 기본소득은 선심성\"(김성열)", "답: 지방이 사라지는 걸 막는 돈을 선심이라 하면 안 된다. 다만 3년 뒤 청년이 몇 명 남았는지로 평가하자. 금액·대상은 준비된 자료 없음.", [["김성열 최고위원 모두발언 — 추경 비판(개혁신당 2026.4.9)", "https://reformparty.kr/news/press/665-press-764"], ["📼 관련 카드 #3283", "#card/3283"]]]], "hw": [["강진 보통교부세가 왜, 얼마나 줄 수 있나?", "미래대응기금 전출분을 내국세에서 먼저 빼고 교부세를 계산하는 방식 때문. 2027년 3,580억→2,490억, 1,090억(30.4%) 감소 분석(강광석 통합특별시의원, 나라살림연구소). 전국 수치는 29.6조/30.5조로 매체마다 다르니 \"약 30조\"로.", [["강진군 보통교부세 1,090억(30.4%) 감소 분석(중도일보 2026.10.23)", "https://www.joongdo.co.kr/web/view.php?key=20261023010006661"]]], ["\"세 사다리\"는 무엇인가?", "배울 곳, 일할 곳, 정착할 곳. 지역 안에 이 셋을 놓아야 청년이 남는다. 공장을 지어도 사람이 없으면 수도권에서 데려오고 지역 청년은 구경꾼이 된다(이맘때 Q12, KBC Q10).", [["📼 관련 카드 #2915", "#card/2915"], ["📼 관련 카드 #1611", "#card/1611"]]]]}, {"id": "politics", "unit": "정치제도", "title": "8. 청년 정치 — 정외과 학생이 물을 것들", "time": "10분", "one": "한국 국회의 40세 미만 의원은 4.7%로 155개국 중 142위. 청년 정치 예산은 법으로 있지만 99.3%가 사무처 급여로 쓰인 당도 있다. 김보미가 당대표 선거에서 겪은 기탁금·청년최고위원 부결이 살아 있는 사례다.", "easy": "청년이 정치에 들어가려면 돈의 벽(기탁금), 정보의 벽(규칙을 기득권만 먼저 안다), 족보의 벽(계파)이 있다. 법으로 피선거권을 18세로 낮췄지만 돈의 벽은 그대로다. 북유럽은 정당 청년조직에서 총리가 나오는데 우리 정당엔 청년이 클 길이 없다.", "nums": [{"t": "22대 국회 40세 미만 4.7%, 155개국 중 142위. IPU 2025: 세계 40세 이하 의원 19.0%, 북유럽 30.3%, 동아시아 7.2%", "src": [["22대 국회 40세 미만 4.7%·142위(서울신문 2025.11.21)", "https://seoul.co.kr/news/plan/youngman_area_future/2025/11/21/20251121008003"], ["IPU 청년의원 보고서 2025(원문 PDF)", "https://agora-parl.org/sites/default/files/agora-documents/20250902_YouthParticipation_2025_EN_LR.pdf"]]}, {"t": "2023년 한 당은 청년정치발전비의 99.3%를 청년본부 사무처 급여로 사용. 22대 총선 양당 지역구 공천자 중 청년 3%대. 국회의원 지역구 기탁금 1,500만 원", "src": [["청년정치발전비 99.3% 급여(서울신문 2024.3.18)", "https://m.seoul.co.kr/news/2024/03/18/20240318004004"], ["22대 총선 청년 공천 3%대(서울신문 2024.3.5)", "https://m.seoul.co.kr/news/2024/03/05/20240305004006"]]}, {"t": "민주당 청년최고위원 선출제 최고위 부결(7.14) → 청년 몫 지명직 전용기(8.20). 기탁금 당대표 1억→8천만, 최고위원 5천만→3천만(7.21, 대통령 재검토 요구 뒤). 39세 이하 비현역 50% 감면", "src": [["뉴시스 2026.7.15 청년최고위원 부결", "https://www.newsis.com/view/NISX20260715_0003710124"], ["데일리안 2026.7.22 기탁금 조정", "https://www.dailian.co.kr/news/view2/1669360"], ["청년 몫 지명직 전용기 의원(주간경향 2026.8.21)", "https://weekly.khan.co.kr/article/202608211114001"]]}, {"t": "6·3 지선 39세 이하 후보 10.4%, 당선 9.5%(403명), 단체장 0명. 진보당 손솔 의원은 22대 최연소(30세)", "src": [["22대 총선 청년 공천 3%대(서울신문 2024.3.5)", "https://m.seoul.co.kr/news/2024/03/05/20240305004006"], ["미래경제뉴스 2026.8.15 진보당 4기 지도부", "https://www.m-economynews.com/mobile/article.html?no=69793"]]}, {"t": "정당 국고보조금 2026년 970억 중 양당 86%. 개혁신당 2024년 보조금 6.6억 \"먹튀\" 논란", "src": [["뉴시스 2024.2.21 개혁신당 보조금 논란", "https://www.newsis.com/view/NISX20240221_0002634632"]]}], "gov": [["제도 논의", "피선거권 18세, 국회 개헌 논의(4년 중임·내각제), 선거제 비례성·위성정당. 김보미 입장: 개헌은 필요하지만 정당 개혁은 개헌 없이 지금 당장 할 수 있다. 개헌안 세부 입장은 만들지 않았으니 \"국회 논의를 지켜보되 정당 개혁이 먼저\"로.", [["스웨덴 총리 인준 부결(스웨덴 의회 2026.10.15)", "https://www.riksdagen.se/en/news/articles/2026/oct/15/no-to-magdalena-andersson-socdem-as-prime_cmsd2ab1134-a03c-4be2-b345-af0aacff33d3en/"], ["📼 관련 카드 #3254", "#card/3254"]]]], "parties": null, "issues": [["\"이준석은 36세에 당대표가 됐는데 민주당은 왜 안 되나\"", "답: 사람이 아니라 판의 문제. 국민의힘은 토론·미디어로 승부가 나는 판이 열렸고 민주당은 조직·명부로 승부가 난다. 제 예비경선은 선거운동이 이틀도 안 됐고 토론은 한 번도 없었다.", [["📼 관련 카드 #3247", "#card/3247"]]], ["\"청년 할당제는 역차별\"", "답: 할당보다 경로가 먼저. 다만 공천자 중 청년 3%대인 지금은 공천 목표제 정도는 필요. 김보미 공약은 \"청년 공천 목표제\"지 의무 할당이 아니다.", [["22대 총선 청년 공천 3%대(서울신문 2024.3.5)", "https://m.seoul.co.kr/news/2024/03/05/20240305004006"], ["당 예산 10% 청년 편성 공약(프레시안 2026.7.16)", "https://pressian.com/pages/articles/2026071617485205196"], ["📼 관련 카드 #3255", "#card/3255"]]]], "hw": [["한국 국회 40세 미만 의원 비율과 세계 순위는?", "4.7%, 155개국 중 142위. 북유럽은 30.3%.", [["22대 국회 40세 미만 4.7%·142위(서울신문 2025.11.21)", "https://seoul.co.kr/news/plan/youngman_area_future/2025/11/21/20251121008003"], ["IPU 청년의원 보고서 2025(원문 PDF)", "https://agora-parl.org/sites/default/files/agora-documents/20250902_YouthParticipation_2025_EN_LR.pdf"]]], ["김보미가 당대표 선거에서 겪은 \"돈의 벽\" 숫자는?", "당대표 기탁금 1억(→8천만으로 인하), 다섯 군데서 빌림. 청년최고위원 선출제는 7.14 최고위에서 부결됐고 청년 몫은 지명으로 처리됐다.", [["데일리안 2026.7.22 기탁금 조정", "https://www.dailian.co.kr/news/view2/1669360"], ["뉴시스 2026.7.15 청년최고위원 부결", "https://www.newsis.com/view/NISX20260715_0003710124"], ["📼 관련 카드 #3232", "#card/3232"]]]]}]};

function evBox(ev){if(!ev||!ev.length)return '';const id='ev'+(++_evn);
  return '<a class="evt" href="javascript:void 0" data-ev="'+id+'">근거 '+ev.length+' ▾</a><div class="evb" id="'+id+'" hidden>'+ev.map(e=>'<div class="evi">'+E(e.t)+srcLinks(e.src)+'</div>').join('')+'</div>';}
function bindEv(root){root.querySelectorAll('[data-ev]').forEach(a=>a.onclick=()=>{const b=document.getElementById(a.dataset.ev);b.hidden=!b.hidden;a.textContent=a.textContent.replace(b.hidden?'▴':'▾',b.hidden?'▾':'▴')})}
function pColor(n){return /민주/.test(n)?'var(--dem)':/개혁/.test(n)?'var(--ref)':/진보/.test(n)?'var(--prg)':/국민의힘/.test(n)?'#c9151e':'var(--ink)'}
function partyBlock(ps){
  return '<div class="list">'+ps.map(p=>{const x=p[3]||{};
    return '<div class="row open pty2"><div class="det" style="display:block;padding:14px 20px"><b style="font-size:15.5px;color:'+pColor(p[0])+'">'+E(p[0])+'</b><p class="sp" style="font-size:16px;margin:4px 0 6px">'+E(p[1])+'</p>'+srcLinks(p[2])+
      (x.pro||x.con||x.rebut?'<div class="pc">'+(x.pro?'<div class="pcx g"><b>👍 장점·인정할 것</b><p>'+E(x.pro)+'</p></div>':'')+(x.con?'<div class="pcx r"><b>👎 문제점·단점</b><p>'+E(x.con)+'</p></div>':'')+(x.rebut?'<div class="pcx y"><b>🗣 반론·받아치기</b><p>'+E(x.rebut)+'</p></div>':'')+(x.agree?'<div class="pcx b"><b>🤝 같이 갈 수 있는 것</b><p>'+E(x.agree)+'</p></div>':'')+'</div>':'')+'</div></div>'}).join('')+'</div>';
}
function hwBlock(hw){return '<div class="list">'+hw.map((q,k)=>'<div class="row"><div class="rh"><span class="no"><span class="badge y">문제 '+(k+1)+'</span></span><div class="tx"><div class="tt">'+E(q[0])+'</div></div><span class="ar">▶</span></div><div class="det"><div class="nt" style="font-weight:600;color:var(--mut);margin-top:0">답 보기</div><p class="sp k"><mark>'+E(q[1])+'</mark></p>'+srcLinks(q[2])+'</div></div>').join('')+'</div>'}
function vStudy(){
  const AG=STUDY.agenda||[],L=STUDY.lessons;const done=stDone();
  const ag=AG.find(x=>x.id===stId),cur=L.find(x=>x.id===stId);
  let h='<div class="crumb"><a href="#home">홈</a> › 학습'+(ag?' › '+E(ag.title):cur?' › '+E(cur.unit):'')+'</div>';
  if(!ag&&!cur){
    h+='<h1 class="pt">학습 — 학생회 발제 의제 순서대로</h1><p class="lead">'+E(STUDY.intro)+'</p>';
    h+='<div class="sh"><h3>토론 의제 — 우선순위</h3><span>학생회 발제문 기준</span></div>';
    AG.forEach(a=>{h+='<a class="agcard'+(done[a.id]?' done':'')+'" href="#study/'+a.id+'"><span class="agn">'+(done[a.id]?'✓':a.rank)+'</span><span class="sttx"><b>'+E(a.title)+'</b><span class="agq">'+E(a.q)+'</span><span>'+E(a.why)+'</span><em>할 말 '+a.topics.length+'묶음 · 받아치기 '+a.ask.length+' · 정당 '+a.parties.length+' · 숙제 '+a.hw.length+'</em></span></a>'});
    h+='<div class="sh"><h3>더 알아 둘 것</h3><span>정당·여론·지방·청년 정치</span></div>';
    L.forEach((x,i)=>{h+='<a class="stcard'+(done[x.id]?' done':'')+'" href="#study/'+x.id+'"><span class="stn">'+(done[x.id]?'✓':(i+1))+'</span><span class="sttx"><b>'+E(x.title.replace(/^\d+\.\s*/,''))+'</b><span>'+E(x.one)+'</span><em>'+E(x.time)+' · 숙제 '+x.hw.length+'</em></span></a>'});
    main().innerHTML=h;return;
  }
  const nav='<nav class="tabs" aria-label="학습 차례"><a href="#study">차례</a>'+AG.map(a=>'<a href="#study/'+a.id+'" class="'+(stId===a.id?'on':'')+'">'+(done[a.id]?'✓ ':'')+E(a.title)+'</a>').join('')+L.map((x,k)=>'<a href="#study/'+x.id+'" class="'+(x.id===stId?'on':'')+'">'+(done[x.id]?'✓ ':'')+E(x.title.replace(/^\d+\.\s*/,'').split(' — ')[0].slice(0,12))+'</a>').join('')+'</nav>';
  if(ag){
    h+='<h1 class="pt">'+E(ag.title)+'</h1><p class="lead" style="font-size:18px;color:var(--ink);font-weight:600">“'+E(ag.q)+'”</p>'+nav;
    h+='<div class="callout"><b>왜 이 순위인가.</b> '+E(ag.why)+'<br><b>학생회 발제문.</b> '+E(ag.brief)+' <a href="report-nec-2026.html">근거 보고서 읽기 →</a></div>';
    h+='<div class="stjump">'+[['s1','① 할 말'],['s2','② 정부 정책'],['s3','③ 받아치기'],['s4','④ 정당별'],['s5','⑤ 숙제']].map(x=>'<a href="javascript:void 0" data-j="'+x[0]+'">'+x[1]+'</a>').join('')+'</div>';
    h+='<section class="stsec" id="s1"><div class="sh"><h3>① 김보미가 할 말 — 우선순위순</h3><span>문장은 원고 그대로. 숫자는 「근거」를 눌러 확인</span></div>';
    ag.topics.forEach(t=>{h+='<div class="tp"><div class="tph"><span class="tpn">'+t.rank+'</span><b>'+E(t.title)+'</b><span class="badge '+(/발제/.test(t.tag)?'y':'g')+'">'+E(t.tag)+'</span></div>'+t.say.map(x=>'<div class="sayl"><p class="sp k"><mark>'+E(x.t)+'</mark></p>'+evBox(x.ev)+'</div>').join('')+'</div>'});
    h+='</section>';
    h+='<section class="stsec" id="s2"><div class="sh"><h3>② 정부 정책 — 한 것, 비판, 김보미와의 차이</h3><span>가장 중요 · 상대가 여기서 친다</span></div>'+ag.gov.map(x=>'<div class="sayl gov"><p class="sp">'+E(x.t)+'</p>'+evBox(x.ev)+'</div>').join('');
    if(ag.cuts&&ag.cuts.length){h+='<div class="sh" style="margin-top:18px"><h3>정부가 줄인 것 · 말 바꾼 것</h3><span>상대가 공격할 소재 — 먼저 알고 방어</span></div><div class="list">'+ag.cuts.map(c=>'<div class="row"><div class="rh"><span class="no"><span class="badge r">공격 소재</span></span><div class="tx"><div class="tt">'+E(c.title)+'</div><div class="gs">'+E(c.what)+'</div></div><span class="ar">▶</span></div><div class="det"><p class="sp">'+E(c.what)+'</p><div class="pc"><div class="pcx r"><b>⚔ 상대가 칠 말</b><p>'+E(c.attack)+'</p></div><div class="pcx b"><b>🛡 방어·정부 논리</b><p>'+E(c.defense)+'</p></div></div>'+srcLinks(c.src)+'</div></div>').join('')+'</div>'}
    else h+='<div class="callout">정부가 줄인 것·말 바꾼 것 목록은 조사 중입니다. 올라오면 여기 붙습니다.</div>';
    h+='</section>';
    h+='<section class="stsec" id="s3"><div class="sh"><h3>③ 상대가 칠 말 → 인정할 것 → 받아치기</h3><span>줄을 누르면 펼쳐짐</span></div><div class="list">'+ag.ask.map(q=>'<div class="row"><div class="rh"><span class="no"><span class="badge r">'+E(q.who.split('(')[0].slice(0,9))+'</span></span><div class="tx"><div class="tt">'+E(q.q)+'</div><div class="gs">'+E(q.hit)+'</div></div><span class="ar">▶</span></div><div class="det"><div class="pc"><div class="pcx g"><b>✔ 먼저 인정할 것</b><p>'+E(q.admit)+'</p></div><div class="pcx y"><b>🗣 받아치기</b><p>'+E(q.hit)+'</p></div></div>'+evBox(q.ev)+'</div></div>').join('')+'</div></section>';
    h+='<section class="stsec" id="s4"><div class="sh"><h3>④ 정당별 입장 — 장점 · 문제점 · 반론</h3><a href="#event/parties">정당 비교표 →</a></div>'+partyBlock(ag.parties)+'</section>';
    h+='<section class="stsec" id="s5"><div class="sh"><h3>⑤ 숙제</h3><span>먼저 소리 내 답하고, 답 보기</span></div>'+hwBlock(ag.hw)+'</section>';
    const i=AG.indexOf(ag),next=AG[i+1];
    h+='<div class="stnav"><label class="stdone"><input type="checkbox" id="stchk" '+(done[ag.id]?'checked':'')+'> 이 의제 마쳤음</label>'+(next?'<a class="pri" href="#study/'+next.id+'">다음 · '+E(next.title)+' →</a>':'<a class="pri" href="#study/'+L[0].id+'">더 알아 둘 것 →</a>')+'</div>';
  }else{
    const i=L.indexOf(cur);const prev=L[i-1],next=L[i+1];
    h+='<h1 class="pt">'+E(cur.title)+'</h1><p class="lead">'+E(cur.unit)+' · 약 '+E(cur.time)+'</p>'+nav;
    h+='<section class="stsec"><div class="sh"><h3>한 줄로</h3></div><div class="msg">'+E(cur.one)+'</div></section>';
    h+='<section class="stsec"><div class="sh"><h3>쉽게 말하면</h3></div><div class="read"><p class="sp">'+E(cur.easy)+'</p></div></section>';
    if(cur.gov&&cur.gov.length)h+='<section class="stsec"><div class="sh"><h3>알아 둘 것</h3></div>'+cur.gov.map(g=>'<div class="sayl gov"><b style="font-size:15.5px">'+E(g[0])+'</b><p class="sp" style="margin:6px 0 4px">'+E(g[1])+'</p>'+srcLinks(g[2])+'</div>').join('')+'</section>';
    h+='<section class="stsec"><div class="sh"><h3>숫자 — 필요할 때만</h3><span>'+cur.nums.length+'개</span></div><div class="sayl">'+evBox(cur.nums)+'</div></section>';
    if(cur.parties&&cur.parties.length)h+='<section class="stsec"><div class="sh"><h3>정당별 입장 — 장점 · 문제점 · 반론</h3><a href="#event/parties">정당 비교표 →</a></div>'+partyBlock(cur.parties)+'</section>';
    if(cur.issues&&cur.issues.length)h+='<section class="stsec"><div class="sh"><h3>쟁점과 받아치기</h3><span>상대가 꺼낼 말 → 김보미 답</span></div><div class="list">'+cur.issues.map(q=>'<div class="row"><div class="rh"><span class="no"><span class="badge r">쟁점</span></span><div class="tx"><div class="tt">'+E(q[0])+'</div><div class="gs">'+E(q[1])+'</div></div><span class="ar">▶</span></div><div class="det"><p class="sp k"><mark>'+E(q[1])+'</mark></p>'+srcLinks(q[2])+'</div></div>').join('')+'</div></section>';
    h+='<section class="stsec"><div class="sh"><h3>숙제</h3></div>'+hwBlock(cur.hw)+'</section>';
    h+='<div class="stnav"><label class="stdone"><input type="checkbox" id="stchk" '+(done[cur.id]?'checked':'')+'> 이 과 마쳤음</label>'+(prev?'<a href="#study/'+prev.id+'">← '+E(prev.title.replace(/^\d+\.\s*/,'').split(' — ')[0].slice(0,12))+'</a>':'<a href="#study/'+AG[AG.length-1].id+'">← '+E(AG[AG.length-1].title)+'</a>')+(next?'<a class="pri" href="#study/'+next.id+'">다음 · '+E(next.title.replace(/^\d+\.\s*/,'').split(' — ')[0].slice(0,14))+' →</a>':'<a class="pri" href="#study">차례로 →</a>')+'</div>';
  }
  main().innerHTML=h;
  main().querySelectorAll('.row .rh').forEach(r=>r.onclick=()=>r.parentNode.classList.toggle('open'));
  bindEv(main());
  main().querySelectorAll('[data-j]').forEach(a=>a.onclick=()=>{const el=document.getElementById(a.dataset.j);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})});
  const c=document.getElementById('stchk');if(c)c.onchange=()=>stSet(stId,c.checked);
}

/* ---------- 라우팅 ---------- */
const NEW={study:vStudy,issues:vIssues,youth:vYouth,home:vHome,event:vEvent,archive:vArchive,media:vMedia,topics:vTopics,topic:vTopic,search:vSearch,msg:vMsg,one:vOne,gov:vGov};
const oldRender=window.render;let OLD=false;
const oldExport=window.exportEdited;window.exportEdited=function(){const t=document.getElementById('v2top'),f=document.getElementById('v2foot');const had=document.body.classList.contains('v2');if(t)t.remove();if(f)f.remove();document.body.classList.remove('v2','tts');try{oldExport()}finally{if(had)document.body.classList.add('v2');top();foot()}};
window.applyHash=function(){
  let h=location.hash.slice(1);try{h=decodeURIComponent(h)}catch(e){}
  if(h==='old'){OLD=true;view='sep';return true}
  if(!h){OLD=false;view='home';return true}
  if(NEW[h.split('/')[0]]||/^(yonsei|card)/.test(h))OLD=false;
  let m;
  if((m=h.match(/^card\/(\d+)$/))){view='one';arg=m[1];return true}
  if((m=h.match(/^yonsei(?:\/(\d+))?$/))){view='event';sub=m[1]?secOf(+m[1]):'overview';arg=m[1]||'';return true}
  if((m=h.match(/^event(?:\/([a-z]+))?(?:\/([a-z0-9]+))?$/))){view='event';sub=m[1]||'overview';arg=m[2]||'';return true}
  if((m=h.match(/^(media|topic|search)\/(.+)$/))){view=m[1];arg=m[2];return true}
  if((m=h.match(/^youth(?:\/([a-z]+))?$/))){view='youth';ysub=m[1]||'';return true}
  if((m=h.match(/^issues(?:\/(weekly))?$/))){view='issues';ifTab=m[1]?'weekly':'latest';return true}
  if((m=h.match(/^study(?:\/([a-z0-9-]+))?$/))){view='study';stId=m[1]||'';return true}
  if(NEW[h]){view=h;arg='';return true}
  if(NAV.some(x=>x[0]===h)||['hongdae','kbs0812','five5','pledge25','pledge11','speech','about','timeline','greet'].includes(h)){view=h;return true}
  view='home';return true;
};
window.render=function(){
  if(OLD){document.body.classList.remove('v2');document.documentElement.classList.remove('v2');const _t=document.getElementById('v2top');if(_t)_t.remove();foot();oldRender();return}
  document.body.classList.add('v2');document.documentElement.classList.add('v2');top();foot();
  if(NEW[view])NEW[view]();else{ if(view==='yonsei'){view='event';sub='overview';vEvent()} else oldRender(); }
  const want=view==='study'?'study'+(stId?'/'+stId:''):view==='issues'?'issues'+(ifTab==='weekly'?'/weekly':''):view==='youth'?'youth'+(ysub?'/'+ysub:''):view==='event'?'event/'+sub+(arg?'/'+arg:''):view==='one'?'card/'+arg:/^(media|topic|search)$/.test(view)?view+'/'+arg:view;
  try{if(location.hash.slice(1)!==encodeURI(want)&&decodeURIComponent(location.hash.slice(1))!==want)history.replaceState(null,'','#'+want)}catch(e){}
  try{const h1=document.querySelector('#main h1');document.title=(h1?h1.textContent.replace(/\s+/g,' ').trim().slice(0,30)+' · ':'')+'김보미 준비노트'}catch(e){}
  if(!/^(event)$/.test(view)||!arg)window.scrollTo(0,0);
};
window.addEventListener('hashchange',()=>{applyHash();render()});
// 검색창(옛 오른쪽 패널) 대신 새 검색을 쓴다
const ks=document.getElementById('kwsearch');if(ks)ks.replaceWith(ks.cloneNode(true));
try{history.replaceState(null,'',location.pathname+location.search+(window.__h0||''))}catch(e){}
applyHash();render();
})();
</script>
<script src="tts.js" defer></script>
