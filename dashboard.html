<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>김보미 준비노트</title>
<style>
:root{--blue:#1F4E79;--blue2:#2c6bb3;--red:#C00000;--green:#2E6B30;--gold:#8a6a00;--gray:#5b6472;--bg:#eef1f6;--line:#dce3ec}
*{box-sizing:border-box}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;margin:0;background:var(--bg);color:#1c2430;line-height:1.62;-webkit-text-size-adjust:100%}
a{color:var(--blue2)}
header{background:linear-gradient(120deg,#173a5c,#255a92);color:#fff;padding:13px 18px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.htop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.3px}
header .slog{font-size:12px;opacity:.9}
.live{margin-left:auto;background:#c00000;color:#fff;border-radius:20px;padding:5px 13px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.live .dot{width:8px;height:8px;background:#fff;border-radius:50%;animation:bl 1.1s infinite}
@keyframes bl{50%{opacity:.25}}
nav{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;transition:.12s}
nav button:hover{background:rgba(255,255,255,.24)}
nav button.on{background:#fff;color:var(--blue)}
.layout{display:flex;max-width:1240px;margin:0 auto;gap:14px;padding:14px;align-items:flex-start}
.main{flex:1;min-width:0}
.kwpanel{width:320px;flex-shrink:0;position:sticky;top:70px;max-height:calc(100vh - 84px);overflow-y:scroll;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(31,78,121,.13);padding:0;border:1px solid #d9e3ef}
.kwpanel .kwhead{position:sticky;top:0;background:linear-gradient(120deg,#1f4e79,#2c6bb3);color:#fff;padding:11px 14px 12px;border-radius:12px 12px 0 0;z-index:2}
.kwpanel .kwhead h3{margin:0 0 3px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.kwpanel .kwhead .sub{font-size:11px;opacity:.9}
.kwbody{padding:12px 13px}
#kwsearch{width:100%;padding:9px 11px;font-size:13px;border:2px solid var(--blue);border-radius:9px;margin:10px 0 4px;background:rgba(255,255,255,.96)}
.kwgroup{margin-bottom:13px}
.kwgroup .gt{font-size:12px;font-weight:800;color:#2b3444;margin:0 2px 6px;padding-bottom:3px;border-bottom:1px dashed #d4e0ee}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#eef3f9;color:var(--blue);border:1px solid #cfdcec;border-radius:15px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;transition:.1s;line-height:1.2}
.chip:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip:hover .n{opacity:.85;color:#fff}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 1px 4px rgba(31,78,121,.35)}
.chip .n{opacity:.55;font-size:11px;margin-left:4px;font-weight:700}
.chip.on .n{opacity:.9}
.chip.all{background:#c00000;color:#fff;border-color:#c00000;font-weight:800}
.chip.hot{background:#fff3f3;border-color:#e6b8b8;color:#b02020}
.chip.hot:hover{background:#c00000;color:#fff;border-color:#c00000}
.morekw{font-size:12px;color:var(--blue2);cursor:pointer;margin-top:7px;display:inline-block;font-weight:700}
.card{background:#fff;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 260px}
.qhead{padding:12px 15px;cursor:pointer;display:flex;gap:9px;align-items:flex-start;background:#eef3f9}
.qhead:hover{background:#e3ecf6}
.mtag{font-size:10px;font-weight:700;background:var(--blue);color:#fff;border-radius:7px;padding:2px 7px;white-space:nowrap;margin-top:2px}
.mtag.live{background:#c00000}
.qtxt{font-weight:800;font-size:15.5px;color:#16324e;flex:1}
.arrow{color:var(--blue);font-size:12px;margin-top:3px;transition:.15s}
.card.open .arrow{transform:rotate(90deg)}
.editbtn{font-size:13px;cursor:pointer;opacity:.45;margin-top:1px;transition:.1s;user-select:none}
.editbtn:hover{opacity:1;transform:scale(1.15)}
.toolbar{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
.tbtn{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.tbtn:hover{background:rgba(255,255,255,.3)}
.tbtn.ghost{background:transparent}
.editnotice{display:none;align-items:center;gap:5px;background:#ffd84d;color:#4a3800;border-radius:8px;padding:4px 10px;font-size:11.5px;font-weight:800}
.editov{position:fixed;inset:0;background:rgba(10,20,35,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto}
.editbox{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.editbox h3{margin:0 0 12px;font-size:16px;color:var(--blue);display:flex;align-items:center;gap:8px}
.editbox h3 span{font-size:11px;background:var(--blue);color:#fff;border-radius:7px;padding:2px 8px;font-weight:700}
.editbox label{display:block;font-size:12px;font-weight:800;color:#2b3444;margin:12px 0 4px}
.editbox textarea{width:100%;border:1.5px solid #cfdcec;border-radius:8px;padding:9px 11px;font-size:13.5px;font-family:inherit;line-height:1.55;resize:vertical}
.editbox textarea:focus{outline:none;border-color:var(--blue)}
.ebtns{display:flex;align-items:center;gap:9px;margin-top:15px;flex-wrap:wrap}
.ebtns button{border:none;border-radius:8px;padding:9px 18px;font-size:13.5px;font-weight:800;cursor:pointer}
.ebtns .save{background:var(--blue);color:#fff}
.ebtns .cancel{background:#e7ecf2;color:#333}
.ebtns .ehint{font-size:11px;color:var(--gray);flex:1;min-width:180px}
.body{display:none;padding:13px 17px;border-top:1px solid var(--line)}
.card.open .body{display:block}
.lbl{font-weight:800;font-size:13.5px;margin:14px 0 6px;letter-spacing:-.2px}
.lbl.g{color:var(--green)}.lbl.b{color:var(--blue)}.lbl.r{color:var(--red)}
.script p{margin:10px 0;font-size:17px;line-height:1.72;color:#111a26}
.script p.must{background:linear-gradient(90deg,#ffe98f,#fff3bf);border-left:6px solid #e08c00;padding:11px 14px;border-radius:0 10px 10px 0;font-weight:800;color:#3a2c00;box-shadow:0 2px 6px rgba(200,150,0,.28)}
.script p.must::before{content:"⭐ 꼭 할 말  ";font-size:11.5px;color:#a86f00;letter-spacing:.5px;display:block;margin-bottom:2px}
.script p.must:before{content:"⭐ 필수 멘트  ";font-size:11.5px;color:#b07d00;display:block;margin-bottom:3px;letter-spacing:.3px}
.quote{background:#f4f7fb;border-left:4px solid var(--blue);padding:11px 14px;margin:8px 0;font-size:16px;line-height:1.65;color:#16324e;font-weight:600}
.quote b{color:var(--blue);font-size:12px;display:block;margin-top:5px;font-weight:700}
.warn{color:var(--red);font-size:12px;background:#fdf2f2;border-radius:7px;padding:8px 11px;margin:8px 0;border-left:3px solid var(--red)}
.note{font-size:11.5px;color:var(--gray);background:#f7f8fa;border-radius:7px;padding:7px 10px;margin-top:8px}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.tagrow .t{font-size:10.5px;background:#eaf0f7;color:var(--blue);border-radius:10px;padding:2px 8px;cursor:pointer}
.tagrow .t:hover{background:var(--blue);color:#fff}
.sec-h{font-size:15px;font-weight:800;color:var(--blue);margin:16px 2px 8px;padding-bottom:5px;border-bottom:2px solid var(--blue);display:flex;align-items:center;gap:7px}
.count{font-size:12px;color:var(--gray);margin:4px 2px 12px}
.hero{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px 18px;margin-bottom:13px}
.hero h2{margin:0 0 4px;font-size:17px;color:var(--blue)}
.hero p{margin:5px 0;font-size:13px;color:#333}
.pill{display:inline-block;background:#eef3f9;color:var(--blue);border-radius:20px;padding:3px 11px;font-size:12px;margin:3px 4px 0 0;font-weight:700}
.sl{background:#f4f7fb;border-left:4px solid var(--gold);padding:9px 13px;margin:7px 0;font-size:14px;font-weight:700;color:#3a2f00;border-radius:0 8px 8px 0}
/* timeline */
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tlitem{position:relative;margin-bottom:11px;background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.07);padding:11px 14px;cursor:pointer;transition:.12s}
.tlitem:hover{box-shadow:0 2px 9px rgba(0,0,0,.13);transform:translateX(2px)}
.tlitem:before{content:"";position:absolute;left:-16.5px;top:15px;width:11px;height:11px;background:var(--blue);border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px var(--line)}
.tlitem.hot:before{background:#c00000;box-shadow:0 0 0 2px #f3c0c0}
.tldate{font-size:12px;font-weight:800;color:var(--blue);display:inline-block;min-width:38px}
.tlcat{font-size:10px;background:#eef3f9;color:var(--blue);border-radius:8px;padding:1px 7px;margin-left:4px;font-weight:700}
.tltitle{font-size:13.5px;font-weight:700;color:#16324e;margin:4px 0 3px}
.tlsumm{font-size:12px;color:var(--gray)}
.artlink{display:block;background:#fff;border-radius:9px;box-shadow:0 1px 3px rgba(0,0,0,.07);padding:10px 13px;margin-bottom:8px;text-decoration:none;color:inherit;border-left:3px solid var(--blue2)}
.artlink:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.artlink .m{font-size:10.5px;color:#fff;background:var(--blue2);border-radius:7px;padding:1px 7px;font-weight:700}
.artlink .tt{font-size:13px;font-weight:700;margin:4px 0 2px;color:#16324e}
.artlink .ss{font-size:11.5px;color:var(--gray)}
.empty{text-align:center;color:var(--gray);padding:30px;font-size:13px}
mark{background:#ffe88a;padding:0 1px}
.hint{font-size:12px;color:var(--gray);background:#fff;border-radius:9px;padding:9px 13px;margin-bottom:12px;border-left:3px solid var(--blue2)}
.outline{background:#fff;border:1.5px solid #cfdcec;border-radius:12px;padding:13px 16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.outline .ot{font-size:13.5px;font-weight:800;color:var(--blue);margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid #e4ebf3}
.olist{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.oitem{font-size:13.5px;color:#24344a;cursor:pointer;padding:4px 7px;border-radius:7px;line-height:1.4}
.oitem:hover{background:#eef3f9;color:var(--blue);font-weight:700}
@media(max-width:700px){.olist{grid-template-columns:1fr}}
.mustbox{background:#fffbe8;border:3px solid #e0a800;border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:0 3px 14px rgba(200,160,0,.22)}
.hd-pin{background:linear-gradient(135deg,#c62828,#8e0000);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px;cursor:pointer;box-shadow:0 3px 10px rgba(180,0,0,.35);border:2px solid #ffb3a8;transition:.15s}
.hd-pin:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(180,0,0,.45)}
.hd-pin.on{outline:3px solid #ffd54f}
.hd-pin .hd-t{font-size:15px;font-weight:900;margin-bottom:3px}
.hd-pin .hd-s{font-size:12px;opacity:.92;line-height:1.45}
.mustbox .ot{font-size:14px;font-weight:800;color:#8a6300;margin-bottom:10px;padding-bottom:7px;border-bottom:1.5px dashed #e0c465}
.openbar{display:flex;gap:8px;align-items:center;margin:4px 0 12px;position:sticky;top:0;z-index:30;background:var(--bg,#f4f7fb);padding:8px 0}
.ob{font-size:14px;font-weight:800;padding:8px 16px;border-radius:9px;border:2px solid #1b4c8c;background:#fff;color:#1b4c8c;cursor:pointer}
.ob:hover{background:#1b4c8c;color:#fff}
.obh{font-size:12.5px;color:#777}
.mgroup{cursor:pointer;padding:8px 10px;border-radius:9px;margin-bottom:7px;transition:.1s}
.mgroup:hover{background:#fff3c2}
.mq{font-size:13px;font-weight:800;color:#1F4E79;margin-bottom:3px}
.botnav{max-width:1240px;margin:6px auto 34px;padding:12px 14px;background:linear-gradient(120deg,#173a5c,#255a92);border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.botnav .bt{color:#fff;font-weight:800;font-size:13px;margin-bottom:8px}
.botnav nav{display:flex;gap:4px;flex-wrap:wrap}
.qjbox{background:#f7fafd;border:1.5px solid #c9d8ea;border-radius:10px;padding:9px 10px;margin-bottom:13px}
.qj{font-size:12.5px;color:#24344a;cursor:pointer;padding:3px 7px;border-radius:6px;line-height:1.4}
.qj:hover{background:var(--blue);color:#fff}
.mustonly .script p:not(.must){display:none}
.mustonly .lbl,.mustonly .note,.mustonly .quote,.mustonly .tagrow{display:none}
.todaycols{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.todaycols .outline{flex:1;min-width:290px}
.mtoggle{background:#e8a800;color:#3a2c00;border:none;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 2px 8px rgba(200,150,0,.3)}
.mtoggle.on{background:#3a2c00;color:#ffd84d}
.issuebar{background:#fff;border:1.5px solid #e6b8b8;border-radius:12px;padding:11px 15px;margin-bottom:12px}
.issuebar .ot{font-size:13px;font-weight:800;color:#b02020;margin-bottom:7px}
.mline{font-size:16.5px;font-weight:800;color:#2a1f00;line-height:1.62;padding:4px 0 4px 8px;border-left:3px solid #e8c34d;margin:3px 0}
@media(max-width:860px){.layout{flex-direction:column}.kwpanel{width:100%;position:static;max-height:none;overflow-y:visible}}
</style><style>/* 모바일 가로 넘침 방지 (2026.9.17) */@media(max-width:640px){body{overflow-wrap:anywhere}table{display:block;overflow-x:auto;max-width:100%}.live{white-space:normal!important;max-width:100%}}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style id="v2css">
/* ===== v2 준비노트 디자인 (2026.10.21) =====
   원칙: 남색 바탕의 상단·무대 블록 하나가 정체성, 나머지는 흰 종이 위 목록.
   발언 원고는 소리 내 읽는 글이라 바탕체(고운바탕), 꼭 할 말은 형광펜 밑줄.
   정당 색은 의미가 있을 때만: 민주 #1b4fa0 · 개혁신당 #f26a10 · 진보당 #d1121f */
body.v2{--ink:#17202e;--ink2:#465163;--mut:#7d8798;--navy:#0d2f63;--navy2:#1b4fa0;--yolk:#ffd23f;--paper:#fff;--bg:#f2f4f8;--ln:#e2e6ee;--ok:#11744a;--bad:#b42318;--dem:#1b4fa0;--ref:#f26a10;--prg:#d1121f;
  background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-feature-settings:'ss06';letter-spacing:-.01em}
body.v2>header,body.v2 .kwpanel,body.v2 .botnav{display:none!important}
#v2top .qs{position:relative;flex:0 1 150px;min-width:110px;transition:flex-basis .15s}
#v2top .qs:focus-within{flex-basis:340px}
#v2top .qs input{width:100%;height:36px;border:0;border-radius:9px;padding:0 12px 0 34px;background:rgba(255,255,255,.12);color:#fff;font-size:14px;font-family:inherit;outline:none}
#v2top .qs input::placeholder{color:rgba(255,255,255,.6)}
#v2top .qs input:focus{background:#fff;color:var(--ink)}
#v2top .qs svg{position:absolute;left:11px;top:10px;pointer-events:none;opacity:.8}
#v2top .qs input:focus~svg{opacity:.55;filter:invert(1)}
#v2qdrop{position:absolute;top:56px;left:0;right:0;z-index:50}
.homedrop{position:absolute;top:56px;left:0;right:0;background:#fff;color:var(--ink);border:1px solid var(--ln);border-radius:14px;box-shadow:0 18px 50px rgba(13,47,99,.18);overflow:hidden;z-index:50;display:none;max-height:min(60vh,520px);overflow-y:auto}
.homedrop.on{display:block}
.homedrop .qi{display:block;padding:11px 16px;border-top:1px solid var(--ln);text-decoration:none;color:inherit}.homedrop .qi:first-child{border-top:0}.homedrop .qi:hover,.homedrop .qi.sel{background:#f3f6fb}.homedrop .qi b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em}.homedrop .qi span{display:block;font-size:13.5px;color:var(--ink2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.homedrop .qi i{font-style:normal;font-size:12px;color:var(--mut);font-weight:600;margin-right:6px}.homedrop .qi mark{background:#fff0a8;color:inherit}.homedrop .qall{display:block;padding:11px 16px;background:#f7f9fc;font-size:14px;font-weight:700;color:var(--navy2);text-decoration:none;border-top:1px solid var(--ln)}.homedrop .qe{padding:14px 16px;font-size:14px;color:var(--mut)}
#qsdrop{position:absolute;top:44px;right:0;left:auto;width:min(640px,calc(100vw - 24px));background:#fff;color:var(--ink);border:1px solid var(--ln);border-radius:14px;box-shadow:0 18px 50px rgba(13,47,99,.22);overflow:hidden;z-index:60;display:none;max-height:min(70vh,560px);overflow-y:auto}
#qsdrop.on{display:block}
#qsdrop .qi{display:block;padding:10px 14px;border-top:1px solid var(--ln);text-decoration:none;color:inherit;cursor:pointer}
#qsdrop .qi:first-child{border-top:0}
#qsdrop .qi:hover,#qsdrop .qi.sel{background:#f3f6fb}
#qsdrop .qi b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.02em;line-height:1.4}
#qsdrop .qi span{display:block;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#qsdrop .qi i{font-style:normal;font-size:11.5px;color:var(--mut);font-weight:600;margin-right:6px}
#qsdrop .qi mark{background:#fff0a8;color:inherit;padding:0 1px}
#qsdrop .qall{display:block;padding:10px 14px;background:#f7f9fc;font-size:13.5px;font-weight:700;color:var(--navy2);text-decoration:none;border-top:1px solid var(--ln)}
#qsdrop .qe{padding:14px;font-size:13.5px;color:var(--mut)}
#main:empty::before{content:'';display:block;height:220px;border-radius:16px;background:linear-gradient(90deg,#eef1f6 25%,#f7f9fc 50%,#eef1f6 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
body.v2 .ttsp{display:none!important}
body.v2.tts .ttsp{display:block!important;position:sticky!important;top:0;z-index:25}
body.v2 .layout{display:block;max-width:1040px;padding:28px 20px 56px}
body.v2 a{color:var(--navy2)}
body.v2 :focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
/* 상단 */
#v2top{position:sticky;top:0;z-index:40;background:var(--navy);color:#fff}
#v2top .in{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:0 20px;height:58px}
#v2top .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16.5px;cursor:pointer;white-space:nowrap;letter-spacing:-.03em}
#v2top .brand svg{flex:0 0 auto}
#v2top .brand small{display:none}
#v2top nav{display:flex;flex-wrap:nowrap!important;gap:0;overflow-x:auto;flex:1;scrollbar-width:none;align-self:stretch;padding:0;margin:0;background:none;border:0}
#v2top nav::-webkit-scrollbar{display:none}
#v2top nav a{display:flex;align-items:center;white-space:nowrap;padding:0 10px;font-size:14px;font-weight:600;color:rgba(255,255,255,.78);text-decoration:none;border-bottom:3px solid transparent}
#v2top nav a:hover{color:#fff}
#v2top nav a.on{color:#fff;border-bottom-color:var(--yolk);font-weight:800}
#v2top .tools{display:flex;gap:4px}
#v2top .tools button{border:0;background:rgba(255,255,255,.1);border-radius:8px;width:36px;height:34px;font-size:15px;color:#fff;cursor:pointer}
#v2top .tools button.on{background:var(--yolk);color:var(--navy)}
/* 제목 */
.v2 h1.pt{font-size:30px;font-weight:800;letter-spacing:-.045em;line-height:1.25;margin:2px 0 8px;color:var(--ink)}
.v2 .lead{font-size:15.5px;color:var(--ink2);margin:0 0 22px;line-height:1.7;max-width:46em}
.v2 .crumb{font-size:13px;color:var(--mut);margin-bottom:8px}
.v2 .crumb a{color:var(--ink2);text-decoration:none;font-weight:600}
.v2 .crumb a:hover{text-decoration:underline}
/* 검색 */
.v2 .sbox{display:flex;margin:0 0 30px;background:#fff;border:1.5px solid #cdd5e2;border-radius:12px;overflow:hidden}
.v2 .sbox:focus-within{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(27,79,160,.12)}
.v2 .sbox input{flex:1;min-width:0;border:0;padding:14px 16px;font-size:16px;font-family:inherit;background:none;outline:none}
.v2 .sbox button{flex:0 0 auto;border:0;background:var(--navy);color:#fff;font-weight:700;font-size:15px;padding:0 22px;cursor:pointer;font-family:inherit}
/* 다음 무대 */
.v2 .stage{background:var(--navy);color:#fff;border-radius:20px;padding:30px 32px 26px;margin:0 0 34px;display:grid;grid-template-columns:1fr auto;gap:6px 28px}
.v2 .stage .when{font-size:38px;font-weight:800;letter-spacing:-.05em;line-height:1.15}
.v2 .stage .what{font-size:17px;font-weight:600;opacity:.92;margin-top:6px}
.v2 .stage .where{font-size:14.5px;opacity:.7;margin-top:3px}
.v2 .stage .dd{grid-row:1/3;grid-column:2;align-self:start;text-align:right}
.v2 .stage .dd b{display:block;font-size:64px;font-weight:900;letter-spacing:-.06em;line-height:1;color:var(--yolk)}
.v2 .stage .dd span{font-size:13px;opacity:.7}
.v2 .stage .who{grid-column:1/3;display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.v2 .stage .who a{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:10px;padding:8px 13px 8px 10px;color:#fff;text-decoration:none;font-size:14px}
.v2 .stage .who a:hover{background:rgba(255,255,255,.16)}
.v2 .stage .who i{width:6px;height:26px;border-radius:3px;display:block}
.v2 .stage .who b{font-weight:800}
.v2 .stage .who small{opacity:.7;font-size:12.5px}
.v2 .stage .ag{grid-column:1/3;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.15);font-size:14.5px;line-height:1.75;opacity:.92}
.v2 .stage .ag b{color:var(--yolk);font-weight:700;margin-right:6px}
.v2 .steps{grid-column:1/3;display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.v2 .steps a{background:#fff;color:var(--navy);font-weight:700;font-size:14px;border-radius:10px;padding:9px 14px;text-decoration:none;display:flex;gap:7px;align-items:center}
.v2 .steps a em{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--yolk);color:var(--navy);font-size:12px;font-weight:900;display:grid;place-items:center}
.v2 .steps a:hover{background:var(--yolk)}
/* 숫자 줄 */
.v2 .kpis{display:flex;gap:0;margin:0 0 34px;background:#fff;border:1px solid var(--ln);border-radius:14px}
.v2 .kpi{flex:1;padding:16px 20px;border-left:1px solid var(--ln)}
.v2 .kpi:first-child{border-left:0}
.v2 .kpi b{display:block;font-size:26px;font-weight:800;color:var(--ink);letter-spacing:-.04em}
.v2 .kpi span{font-size:13px;color:var(--mut);font-weight:600}
/* 구역 머리 */
.v2 .sh{display:flex;align-items:baseline;gap:10px;margin:34px 0 12px}
.v2 .sh h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.04em;color:var(--ink)}
.v2 .sh span{font-size:13.5px;color:var(--mut)}
.v2 .sh a{margin-left:auto;font-size:14px;font-weight:700;color:var(--navy2);text-decoration:none}
.v2 .sh a:hover{text-decoration:underline}
/* 바로가기: 두 단 목록 */
.v2 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.v2 .grid.g2{grid-template-columns:repeat(2,1fr)}
.v2 .grid.g4{grid-template-columns:repeat(4,1fr)}
.v2 .tile{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:16px 18px;cursor:pointer;text-decoration:none;color:inherit;display:block}
.v2 a.tile:hover{border-color:var(--navy2)}
.v2 .tile .ic{font-size:20px;line-height:1}
.v2 .tile h4{margin:8px 0 4px;font-size:16.5px;font-weight:800;color:var(--ink);letter-spacing:-.035em}
.v2 .tile p{margin:0;font-size:14px;color:var(--ink2);line-height:1.6}
.v2 .tile .n{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:700;color:var(--mut)}
.v2 .golist{background:#fff;border:1px solid var(--ln);border-radius:14px;display:grid;grid-template-columns:1fr 1fr}
.v2 .golist a{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;text-decoration:none;color:inherit;border-top:1px solid var(--ln)}
.v2 .golist a:nth-child(-n+2){border-top:0}
.v2 .golist a:nth-child(even){border-left:1px solid var(--ln)}
.v2 .golist a:hover{background:#f7f9fc}
.v2 .golist .ic{font-size:22px;line-height:1.2}
.v2 .golist b{display:block;font-size:16.5px;font-weight:800;letter-spacing:-.035em;color:var(--ink)}
.v2 .golist span{display:block;font-size:14px;color:var(--ink2);margin-top:3px;line-height:1.55}
/* 표시 */
.v2 .badge{display:inline-block;font-size:12px;font-weight:700;border-radius:5px;padding:1px 7px;background:#eaf0f9;color:var(--navy2);margin-right:5px;vertical-align:1px}
.v2 .badge.r{background:#fdeceb;color:var(--bad)}.v2 .badge.g{background:#e5f3ec;color:var(--ok)}.v2 .badge.y{background:#fff3c4;color:#7a5a00}.v2 .badge.p{background:#efeafb;color:#5b3aa8}
/* 늘 쓰는 문장 = 원고체 */
.v2 .msg{font-family:'Gowun Batang',serif;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:16px 20px;margin:0 0 8px;font-size:18px;font-weight:700;line-height:1.7;color:var(--ink);letter-spacing:-.02em}
.v2 .msg small{display:block;font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:12.5px;font-weight:600;color:var(--mut);margin-top:4px;letter-spacing:0}
/* 목록(누르면 펼침) */
.v2 .list{background:#fff;border:1px solid var(--ln);border-radius:14px;overflow:hidden;margin:0 0 18px}
.v2 .lh{padding:12px 20px;border-bottom:1px solid var(--ln);font-weight:800;font-size:15px;color:var(--ink);letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.v2 .lh i{width:5px;height:18px;border-radius:3px;background:var(--navy2);display:block}
.v2 .row{border-top:1px solid var(--ln)}
.v2 .lh+.row,.v2 .row:first-child{border-top:0}
.v2 .rh{display:flex;gap:14px;align-items:flex-start;padding:16px 20px;cursor:pointer}
.v2 .rh:hover{background:#f8fafd}
.v2 .rh .no{flex:0 0 auto;font-size:12px;font-weight:600;color:var(--mut);margin-top:4px;min-width:40px;font-variant-numeric:tabular-nums}
.v2 .rh .tx{flex:1;min-width:0}
.v2 .rh .tt{font-size:16.5px;font-weight:700;color:var(--ink);line-height:1.5;letter-spacing:-.03em;margin-top:2px}
.v2 .rh .gs{font-size:14.5px;color:var(--ink2);margin-top:5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.v2 .rh .ar{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--mut);font-size:11px;transition:transform .18s}
.v2 .row.open>.rh{background:#f5f8fd}
.v2 .row.open .ar{transform:rotate(90deg);color:var(--navy2)}
.v2 .row.open .gs{display:none}
.v2 .det{display:none;padding:2px 24px 22px 74px}
.v2 .row.open .det{display:block}
/* 원고 */
.v2 .sp{font-family:'Gowun Batang',serif;font-size:18px;line-height:1.95;margin:12px 0;color:#1c2433;letter-spacing:-.01em;max-width:40em}
.v2 .sp.k{font-weight:700;color:#0f1622}
.v2 .sp.k mark{background:linear-gradient(transparent 66%,rgba(255,210,63,.7) 66%);color:inherit;padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.v2 .sp.o{color:var(--mut);font-size:16.5px}
.v2 .det .qt{font-family:'Gowun Batang',serif;border-left:3px solid var(--navy2);padding:4px 14px;margin:12px 0;font-weight:700;font-size:17px;color:var(--navy)}
.v2 .det .qt small{font-family:'Pretendard Variable',sans-serif;font-weight:500;font-size:12.5px;color:var(--mut)}
.v2 .wr{background:#fdf0ef;color:#8a1c12;border-radius:10px;padding:11px 14px;margin:14px 0;font-size:14.5px;line-height:1.65}
.v2 .nt{background:#f5f7fa;color:var(--ink2);border-radius:10px;padding:11px 14px;margin:10px 0;font-size:14px;line-height:1.7}
.v2 .sr{font-size:13.5px;margin:14px 0 6px;line-height:2}
.v2 .sr b{font-size:13px;color:var(--mut);font-weight:700}
.v2 .sr a{display:inline-block;background:#eef3fa;color:var(--navy2);text-decoration:none;border-radius:6px;padding:2px 9px;margin:0 5px 5px 0;font-weight:600;line-height:1.6}
.v2 .sr a:hover{background:#dfe8f6}
.v2 .sr a.past{background:#fff6d6;color:#6b5000}
.v2 .tg{margin-top:10px}
.v2 .tg a{font-size:13px;color:var(--mut);margin-right:10px;text-decoration:none;font-weight:600}
.v2 .tg a:hover{color:var(--navy2)}
.v2 .act{display:flex;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}
.v2 .act button,.v2 .act a{border:1px solid var(--ln);background:#fff;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;text-decoration:none;font-family:inherit}
.v2 .act button:hover,.v2 .act a:hover{border-color:var(--navy2);color:var(--navy2)}
/* 탭 */
.v2 .tabs{display:flex;gap:0;flex-wrap:nowrap;overflow-x:auto;margin:0 0 24px;border-bottom:2px solid var(--ln);scrollbar-width:none}
.v2 .tabs::-webkit-scrollbar{display:none}
.v2 .tabs a{padding:11px 15px;font-weight:700;font-size:15px;color:var(--mut);text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.v2 .tabs a:hover{color:var(--ink)}
.v2 .tabs a.on{color:var(--navy);border-bottom-color:var(--navy)}
.v2 .tabs a span{font-size:12px;font-weight:600;color:var(--mut);margin-left:4px}
/* 낭독 화면 */
.v2 .read{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:30px 36px;margin:0 0 18px}
.v2 .read .sp{font-size:20px;line-height:2;margin:0 0 16px}
.v2 .read .sp.o{font-size:18px}
.v2 .read .meta{font-size:13.5px;color:var(--mut);margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--ln);line-height:1.6}
.v2 .info{display:grid;grid-template-columns:96px 1fr;gap:10px 18px;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:20px 22px;font-size:15.5px;margin:0}
.v2 .info dt{font-weight:600;color:var(--mut)}
.v2 .info dd{margin:0;color:var(--ink);font-weight:500}
.v2 .callout{background:#fffaea;border:1px solid #f1dc94;border-radius:12px;padding:15px 18px;margin:14px 0;font-size:15px;line-height:1.75}
.v2 .callout.r{background:#fdf1f0;border-color:#f2c3bd}
.v2 .callout b{font-weight:800}
.v2 .chips2{display:flex;flex-wrap:wrap;gap:6px}
.v2 .chips2 a{background:#fff;border:1px solid var(--ln);border-radius:20px;padding:6px 13px;font-size:14px;font-weight:600;color:var(--ink2);text-decoration:none}
.v2 .chips2 a:hover,.v2 .chips2 a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.v2 .chips2 a i{font-style:normal;opacity:.55;font-size:12px;margin-left:4px}
.v2.v2 .foot,body .foot{max-width:1040px;margin:0 auto 34px;padding:18px 20px 0;font-size:13px;color:var(--mut,#888);display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--ln,#ddd)}
.foot a{color:inherit;cursor:pointer;text-decoration:underline}
.v2 .bar2{height:8px;background:#e8edf5;border-radius:6px;overflow:hidden;margin-top:6px}.v2 .bar2 i{display:block;height:100%;background:var(--navy2)}
.v2 table.t2{width:100%;border-collapse:separate;border-spacing:0;background:#fff;font-size:14.5px;border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.v2 table.t2 th{background:#f6f8fb;text-align:left;padding:11px 14px;font-size:13px;font-weight:700;color:var(--ink2)}
.v2 table.t2 td{padding:11px 14px;border-top:1px solid var(--ln)}
.v2 table.t2 td.n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
/* 세 정당 비교 */
.v2 .pty{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 10px}
.v2 .pcard{background:#fff;border:1px solid var(--ln);border-top:5px solid var(--c);border-radius:14px;padding:18px 20px}
.v2 .pcard h4{margin:0;font-size:19px;font-weight:800;letter-spacing:-.04em;color:var(--c)}
.v2 .pcard .who{font-size:14px;color:var(--ink2);margin:4px 0 10px;font-weight:600}
.v2 .pcard .line{font-family:'Gowun Batang',serif;font-size:16.5px;font-weight:700;line-height:1.65;margin:0 0 10px;color:var(--ink)}
.v2 .pcard dl{margin:0;font-size:14px;line-height:1.6}
.v2 .pcard dt{color:var(--mut);font-weight:600;margin-top:8px;font-size:12.5px}
.v2 .pcard dd{margin:2px 0 0}
.v2 .cmp{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--ln);border-radius:14px;overflow:hidden;font-size:14.5px;line-height:1.65}
.v2 .cmp th{text-align:left;padding:12px 14px;background:#f6f8fb;font-size:14px;font-weight:800;border-bottom:1px solid var(--ln)}
.v2 .cmp th.p{border-top:4px solid var(--c);color:var(--c)}
.v2 .cmp td{padding:13px 14px;border-top:1px solid var(--ln);vertical-align:top}
.v2 .cmp td.k{font-weight:800;color:var(--ink);width:120px;background:#fbfcfe}
.v2 .cmp td small{display:block;margin-top:5px;font-size:12px}
.v2 .cmp td small a{color:var(--mut)}
.v2 .cmp tr:first-child td{border-top:0}
/* 예전 화면(방송별 답변지)도 같은 결로 */
body.v2 .card{border:1px solid var(--ln);box-shadow:none;border-radius:14px;margin-bottom:12px}
body.v2 .qhead{background:#fff;padding:15px 18px}
body.v2 .qhead:hover{background:#f8fafd}
body.v2 .qtxt{color:var(--ink);font-size:16.5px;font-weight:700;letter-spacing:-.03em}
body.v2 .mtag{background:#eaf0f9;color:var(--navy2);border-radius:5px;font-size:11.5px}
body.v2 .mtag.live{background:#fdeceb;color:var(--bad)}
body.v2 .body{padding:6px 22px 20px}
body.v2 .lbl{font-size:13px;color:var(--mut)!important;font-weight:700}
body.v2 .script p{font-family:'Gowun Batang',serif;font-size:18px;line-height:1.9;color:#1c2433}
body.v2 .script p.must{background:#fffbea;border-left:4px solid var(--yolk);box-shadow:none;border-radius:0 8px 8px 0;padding:10px 14px;font-weight:700;color:#0f1622}
body.v2 .script p.must:before,body.v2 .script p.must::before{font-family:'Pretendard Variable',sans-serif;content:"꼭 할 말";font-size:11.5px;color:#8a6a00;font-weight:700}
body.v2 .quote{font-family:'Gowun Batang',serif;background:none;border-left:3px solid var(--navy2);font-size:17px}
body.v2 .sec-h{color:var(--ink);border-bottom:2px solid var(--ln);font-size:17px}
body.v2 .hero{box-shadow:none;border:1px solid var(--ln);border-radius:14px}
body.v2 .hero h2{color:var(--ink);letter-spacing:-.04em}
body.v2 .tagrow .t{background:#f1f4f8;color:var(--mut)}
body.v2 .note{background:#f5f7fa;border-radius:10px}
body.v2 .warn{background:#fdf0ef;border-left:0;border-radius:10px;font-size:13.5px}
@media (prefers-reduced-motion:reduce){.v2 *{transition:none!important}}
@media(max-width:1180px){#v2top .brand small{display:none}}

@media(max-width:860px){.v2 .grid,.v2 .grid.g4,.v2 .pty{grid-template-columns:1fr 1fr}.v2 .golist{grid-template-columns:1fr}.v2 .golist a{border-left:0!important;border-top:1px solid var(--ln)!important}.v2 .golist a:first-child{border-top:0!important}#v2top .brand small{display:none}.v2 .cmp{min-width:760px}}
@media(max-width:560px){.v2 .grid,.v2 .grid.g2,.v2 .pty{grid-template-columns:1fr}.v2 .grid.g4{grid-template-columns:1fr 1fr;gap:8px}.v2 .grid.g4 .tile{padding:12px 14px}.v2 h1.pt{font-size:24px}.v2 .det{padding:2px 18px 20px 18px}.v2 .read{padding:20px 18px}.v2 .read .sp{font-size:18px}.v2 .info{grid-template-columns:72px 1fr}.v2 .stage{padding:22px 20px;display:block}.v2 .stage .when{font-size:27px}.v2 .stage .dd{text-align:left;margin-bottom:10px}.v2 .stage .dd b{font-size:44px;display:inline}.v2 .stage .dd span{margin-left:8px}.v2 .kpis{flex-wrap:wrap}.v2 .kpi{flex:1 1 45%;border-left:0;border-top:1px solid var(--ln)}#v2top .brand span{display:none}body.v2 .layout{padding:20px 14px 40px}}
.v2 .stprog{display:flex;align-items:center;gap:14px;margin:0 0 10px}.v2 .stprog .bar2{flex:1;margin:0}.v2 .stprog span{font-size:13.5px;color:var(--mut);white-space:nowrap}
.v2 .stcard{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--ln);border-radius:14px;padding:16px 18px;margin:0 0 10px;text-decoration:none;color:inherit}
.v2 .stcard:hover{border-color:var(--navy2)}
.v2 .stcard .stn{flex:0 0 34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px}
.v2 .stcard.done .stn{background:var(--ok)}
.v2 .stcard .sttx b{display:block;font-size:17px;font-weight:800;letter-spacing:-.035em;color:var(--ink)}
.v2 .stcard .sttx span{display:block;font-size:14.5px;color:var(--ink2);margin-top:4px;line-height:1.6}
.v2 .stcard .sttx em{display:block;font-style:normal;font-size:12.5px;color:var(--mut);margin-top:6px}
.v2 .stsec{margin:0 0 6px}
.v2 .srcl{display:block;font-size:12.5px;line-height:1.9;margin-top:4px}.v2 .srcl a{display:inline-block;background:#eef3fa;color:var(--navy2);text-decoration:none;border-radius:6px;padding:1px 8px;margin:0 5px 4px 0;font-weight:600}.v2 .srcl a.past{background:#fff6d6;color:#6b5000}
.v2 .stnav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:26px 0 10px;padding-top:18px;border-top:1px solid var(--ln)}
.v2 .stnav a{text-decoration:none;font-weight:700;font-size:14.5px;color:var(--navy2);border:1px solid var(--ln);border-radius:10px;padding:9px 14px;background:#fff}
.v2 .stnav a.pri{margin-left:auto;background:var(--navy);color:#fff;border-color:var(--navy)}
.v2 .stdone{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14.5px;color:var(--ink2)}.v2 .stdone input{width:18px;height:18px}
