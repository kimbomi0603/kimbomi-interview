다. 현장 분위기와 심정은.","tags":["정견발표","86용퇴","세대교체"],"script":["솔직히 다리가 떨렸습니다. 서툴렀고요. 그런데 서투르다고 안 하면, 그 말은 영원히 아무도 못 합니다. 실수하더라도 하는 게 안 하는 것보다 낫고, 이건 해야만 하는 말이었습니다.","선배들 면전에서 못 할 말이면 뒤에서도 하면 안 된다고 생각했습니다. 개인이 아니라 40년 된 시스템을 향한 질문이었어요. 그날 현장의 침묵이, 오히려 그 질문이 유효하다는 증거였다고 생각합니다."],"quotes":[["정견발표문(7.12)","민주화운동은 존중하지만, 40~50년 정치를 독점할 권리는 없습니다"],["공개질의 답변서(7.13)","약한 계란이 강한 바위를 두드려, 결국 금을 냅니다"]],"notes":["정견발표 이후 폭발적 관심 — 통화 지시: '정견발표 이후 폭발적인 관심을 보인 것을 보라' [자료 13]","7.12 합동 정견발표문, 김보미.com 게시 [자료 7·9]"],"warn":null,"media":"조선일보","label":"Q1"},{"no":2,"part":2,"q":"86세대 정치인들이 당의 쇄신을 가로막는 가장 치명적인 문제는 구체적으로 무엇인가.","tags":["86용퇴","공정","공천","컷오프","청년"],"script":["한마디로 공정의 문제입니다. 지금도 안 껴 줍니다. 예비경선에서 두 명을 자르겠다는 것부터가 그렇습니다. 청년이 들어오면 컷오프라는 문을 만들어서 잘라냅니다.","공천도 마찬가지입니다. 공정하게 심사하는 것처럼 꾸며 놨지만, 그 심사 자리에 앉은 사람들이 다 국회의원이 추천한 가까운 인사들입니다. 그렇게 정치 신인들, 청년들의 진입을 구조적으로 가로막고 있는 것 — 그게 가장 치명적인 문제입니다.","그래서 저는 '퇴출'을 말하는 게 아닙니다. 3선이 넘은 지역구가 열려야 새 인재가 들어올 자리가 생깁니다. 퇴출이 아니라 영입입니다."],"quotes":[["박동완 통화 원워딩(7.19)","공정 얘기하세요. 안 껴 주는 거, 지금도 안 껴 주잖아요. 두 명 자르잖아요. 공천 심사 자리에 배치된 사람들 다 국회의원 똘마니들이잖아요. 정치 신인들, 청년들의 진입을 가로막고 있다"],["출마선언문","계파도, 돈도, 빽도 없는 평당원"]],"notes":["통화 원워딩은 위 인용 그대로 — 발언 시 '국회의원이 추천한 가까운 인사'로 순화(후보 결정) [자료 13]","'퇴출이 아니라 영입' 프레임: 전대자료집 [자료 10]"],"warn":"'표현이 과하다'는 반발이 오면 Q3 논리로 받을 것.","media":"조선일보","label":"Q2"},{"no":3,"part":2,"q":"“화염병과 짱돌을 들던 세대”라는 표현이 지나치게 공격적이라는 당내 지적이 있다.","tags":["화염병짱돌","표현수위","86용퇴"],"script":["솔직하게 말씀드리겠습니다. 그렇게 말하지 않으면 들어주지 않습니다. 지난 몇 년간 청년들이 점잖게 말할 때 누가 들어줬습니까.","그리고 그건 그 세대가 가장 잘 아는, 그 세대의 언어입니다. 그분들이 청년일 때 기성 질서에 던졌던 질문을, 지금의 청년이 똑같이 던지고 있을 뿐입니다. 민주화운동에 대한 존중은 당연히 전제입니다."],"quotes":[["박동완 통화 원워딩(7.19)","그렇게 얘기 안 하면 들어주지를 않아요"],["정견발표문(7.12)","민주화운동은 존중하지만, 40~50년 정치를 독점할 권리는 없습니다"]],"notes":["통화 지시: 표현 수위의 이유를 정면으로 설명하는 기조 [자료 13]"],"warn":null,"media":"조선일보","label":"Q3"},{"no":4,"part":2,"q":"친청·친명 양쪽에서 공격받고, 송영길·김용 출마 예외 허용을 비판하자 문자폭탄까지 온다는데.","tags":["문자폭탄","정청래","김민석","송영길김용","책임정치"],"script":["예상했습니다. 어떤 분들은 제가 김민석 후보를 위해서 정청래 후보를 공격하는 역할을 해 주길 바라셨던 것 같습니다. 그런데 저는 그거 하려고 출마한 게 아닙니다.","제 얘기는 처음부터 하나였습니다. 586이 40년 해 먹었으면 이제 그만하고 후배들한테 길을 열어 줘야 한다는 것. 그리고 정청래 전 대표를 강하게 비판한 건, 바로 직전 당대표였기 때문입니다. 직전 대표가 모든 책임을 지는 것, 그게 민주 정치 아닙니까. 민주 정치는 책임 정치입니다.","문자폭탄이요, 아주 반갑게 받고 있습니다. 386 중 누구 한 명을 지지하러 나온 후보가 아니라, 어떤 폭탄이 터지더라도 청년의 목소리를 가감 없이 대변하러 나온 후보라고 인정받는 것 같아서, 오히려 기분이 좋습니다."],"quotes":[["박동완 통화 원워딩(7.19)","예상했다. 그 사람들은 제가 김민석을 위해서 정청래 까는 역할을 해 주길 바랐던 거잖아요. 그거 하려고 출마한 거 아니에요. 586이 40년 해 먹었으니까 그만하고 후배들한테 길을 열어 줘야 된다. 정청래가 모든 책임을 져야 된다. 민주 정치는 책임 정치 아니에요. 폭탄이 많이 날아와요. 아주 반갑게 받고 있습니다"],["페이스북(등록 직후)","저는 계파에 줄 선 적 없습니다. 국민께 줄 서서 여기까지 왔습니다"]],"notes":["통화 지시 답변 순서 그대로: 예상했다 → 역할 기대 거부 → 586 40년 → 책임정치 → 문자폭탄 반갑게 [자료 13]","박지현 사례 비교('같지 않고 더 심각 — 룰 확정 후 맞춤형 개정'): 7.18 대책회의 [자료 11]"],"warn":"당원 전체를 적으로 돌리는 표현 금지.","media":"조선일보","label":"Q4"},{"no":5,"part":2,"q":"김어준 뉴스공장에서 '당선은 현실적으로 어렵잖아요, 현실을 인정하라'는 말을 들었다. 당시 기분은.","tags":["김어준","뉴스공장","꼰대","노무현2%","이생망중꺾마"],"script":["사실 그날, 후보 등록 서류를 준비하느라 잠도 못 잔 상태였습니다. 당대표 후보들이 다 안 나가고 저만 남았다고 해서, 무리한 일정인 걸 알면서도 가기로 했습니다. 저는 청년 후보의 이야기를 들어주는 자리인 줄 알았습니다.","그런데 가 보니 '너 왜 나왔냐, 나오지 마라, 안 되는데 왜 나왔냐, 정청래 까려고 나온 거 아니냐, 누구 사주를 받았냐' — 이걸 확인하는 자리 같았습니다. 솔직히 황당했습니다. 제가 평소에 뉴스공장을 보지 않아서, 이렇게까지 꼰대 기득권인 줄 몰랐습니다.","말도 계속 끊으시더군요. 저도 똑같이 끊을까 하다가, 똑같이 끊으면 저도 똑같은 사람으로 보일까 봐 내려놓았습니다. 그래, 꼰대가 하고 싶은 말 맘껏 하시라고요. 저는 끊는 사람이 아니라 듣는 사람이 되기로 했습니다. 그게 제가 하고 싶은 정치이기도 하고요.","그래서 되묻고 싶습니다. 김어준씨 말대로라면, 노무현 후보는 지지율 2%였을 때 포기했어야 합니까? 김대중 대통령은 죽이려는 자들 앞에서 포기했어야 합니까? 혁신이라는 게 뭡니까. 아무것도 없는 데서 기존 기득권에 도전하는 것 아닙니까. 그렇게 도전하는 청년의 길을 살려주지는 못할망정, 작정하고 꺾으려 하더군요. 저는 꿀리지 않습니다. 그래서 꼰대라고 한 겁니다. 그런 꼰대가 없습니다.","그날 하고 싶은 말 반도 못 하고 나와서 '아, 이생망'이었습니다. 그런데 중요한 건 꺾이지 않는 마음이거든요. 부끄러움 탁탁 털고 다시 나왔습니다. 한번 더 붙자고 말씀드리고 싶습니다."],"quotes":[["박동완 통화 원워딩(7.19)","인터뷰하러 오라 그래서 인터뷰를 하는 줄 알았다. 그랬더니 '너 왜 나왔냐, 너 나오지 마라, 안 되는데 왜 나왔냐, 정청래 까러 나온 거 아니냐, 누구 사주를 받았냐' 이거 확인하려고 하는 것 같았다 — 이게 제일 중요해요. 김어준 말대로라면 노무현 2프로였을 때 포기했어야지 왜 끝까지 갔냐. 혁신이라는 게 뭐냐. 아무것도 없는 데서 기존 기득권에 도전하는 거 아니냐. 난 꿀리지 않는다. 꼰대도 그런 꼰대가 없다"],["비전·공약 '계란과 바위'","2002년 노무현 후보의 초기 지지율, 바로 2%였습니다. 2%는 끝이 아니라 시작입니다"],["비전·공약 '이생망, 그리고 중꺾마'","중요한 것은, 꺾이지 않는 마음입니다"]],"notes":["후보 본인 소회(7.19): 밤샘 등록 준비 → 유일 출연이라 무리해서 수락 → 들어주는 자리인 줄 → 황당 → 평소 뉴스공장 안 봄 → 말 끊어도 똑같이 안 끊음","7.18 대책회의: '작정한 꼰대 정치였다, 완전히 당했다, 한번 더 붙자' [자료 11]"],"warn":"방송 실수는 먼저 인정(이생망) 후 반격. [방송기록대장 7.20] '꼰대' 표현 재사용 금지 — 이 스크립트의 '꼰대' 부분은 '낡은 검증 방식'·'기득권의 화법'으로 대체 권고(최종 판단 후보). 비판 여론도 지지자발 다수 — 폄하 금지, 수용 화법.","media":"조선일보","label":"Q5"},{"no":6,"part":2,"q":"현재 민주당을 '공정·민주·세대교체·청년·미래'가 사라진 5무(無) 정당으로 규정했다. 구체적으로.","tags":["5무정당","공정","강진공천","유령당원","득표수공개","세대교체","2030"],"script":["공정부터 말씀드리겠습니다. 멀리 갈 것도 없이 강진군수 공천을 보십시오. 의장 선거 때 당에서 찍으라는 후보를 안 찍었다는 이유로, 당헌·당규에도 없는 새 지침까지 만들어 저에게 15% 감산을 때렸습니다. 반대로 전과 5범인 상대 후보에게는 감점을 피할 규정을 억지로 만들어 공천을 줬습니다. 저는 2~3%포인트 차이로 떨어졌고, 결과는 어땠습니까. 공천받은 민주당 후보는 무소속에게 참패했고, 강진은 군수·도의원·군의원까지 모조리 무소속이 이겼습니다. 민주당의 불공정이 부른 대참사입니다. 이게 공정입니까.","저는 그 경선에서 66개 공약을 발표하고 공약집까지 발간했지만 떨어졌고, 공약을 하나도 발표하지 않은 사람이 공천을 받았습니다. 경선 결과라고 받은 건 이름도 없는 '45.5'라는 숫자 하나였습니다. 그게 제 점수인지 남의 점수인지도 모릅니다. 이의를 제기하면 제명하겠다는 협박이 돌아옵니다.","민주는요. 1인 1표라고 하는데, 그 명부에 유령 당원, 그 동네에 살지도 않고 식당에 주소를 올려놓은 당원이 섞여 있습니다. 그 명부로 경선을 하고, 현직 군수는 당무 정지로 출마를 막았습니다. 후보인 저조차 제가 몇 표 받았는지 모릅니다. 득표수를 후보한테도 안 알려주는 당원 주권이 무슨 당원 주권입니까. 이런 1인 1표, 다 사기입니다.","세대교체는커녕 586에 686, 786, 886까지 다 하시겠다고 나서고, 청년 진입은 막혀 있습니다. 그러니 청년이 떠나고, 미래가 없는 겁니다. 분명히 말씀드립니다. 2030이 지지하지 않는 민주당에는 총선도 없고 대선도 없습니다. 저는 그게 걱정돼서 나왔습니다."],"quotes":[["박동완 통화 원워딩(7.19)","강진군수 공천을 봐라. 억지로 규정 만들어 가지고 15프로 감점을 매기더라. 저쪽은 감점을 안 줄 방법을 억지로 찾아내서 감점을 안 주더라. 2~3 차이로 떨어졌다. 이게 공정이냐. 유령 당원, 불법 당원이 포함된 DB를 가지고 경선을 했다. 이게 민주주의냐. 1인 1표 다 사기다. 내가 찍은 후보 몇 표 나왔는지 후보한테도 안 알려 주는데 그게 무슨 당원 주권이냐. 2030이 지지 안 하는 민주당은 총선도 없고 대선도 없다. 걱정이 돼서 나왔다"],["정견발표문(7.12)","공정·민주·세대교체·청년·미래가 사라진 5무(無) 정당"],["7.14 기자회견문","규칙 없는 경기장이야말로 최악의 불공정입니다"]],"notes":["당헌 25조 5항·특례 부칙, 청년최고위원 분리선출 부결: [자료 2·8]"],"warn":"'사기' 원워딩 유지(후보 결정). 강진 공천 15% 감점·유령당원 사례는 날짜·문서 등 사실관계 자료 지참 필수(법적 리스크 본인 인지 하에 발언).","media":"조선일보","label":"Q6"},{"no":7,"part":2,"q":"'호남에는 선거가 없고 공천만 있다', '청년을 죽일 생각만 있다'고 썼다. 호남 청년 정치의 실상은.","tags":["호남","강진","청년","지방"],"script":["공천이 곧 당선인 구조에서는 경쟁이 사라집니다. 청년은 경쟁자가 되는 순간 배제됩니다. 제가 강진에서 겪은 그대로입니다. 도전하는 청년에게 돌아온 건 기회가 아니라 '순서를 기다리라'는 말이었습니다.","더 근본적으로는, 지방을 이용만 했지 지방을 위해 해 준 게 없다는 겁니다. 호남 바닥 민심이 어떤지는 관심이 없고, 이걸 내 선거에 어떻게 이용할까만 생각합니다. 서울에서 호남을 이용하려는 정치로는 절대 호남 문제를 풀 수 없습니다. 호남에서 나고 자라 도민들과 동고동락한 사람이 풀어야 합니다."],"quotes":[["박동완 통화 원워딩(7.19)","지방을 이용만 해 먹었지 지방을 위해서 해 준 게 없다. 호남 바닥 민심을 모르기 때문에 이걸 내 선거에, 내가 권력을 잡는 데 어떻게 이용할 것인가만 생각한다. 호남에서 자라고 호남에서 정치를 하고 도민들과 동고동락했던 사람이 아니면 지방의 문제를 풀 수가 없다. 서울에서 호남을 이용하려고 하는 586 꼰대 정치인들은 절대 호남의 문제를 풀 수 없다"],["페이스북","호남에는 선거가 없고, 공천만 있습니다"]],"notes":["호남 기자회견(7.18) 현장 반응: 청년 환호, 강진 1,000표 목표 [자료 11]"],"warn":"통화 중 특정 전직 대통령 관련 발언은 STT 불명·리스크 커 인터뷰 언급 금지. 투자 규모(800조 등) 수치는 출처 확정 전 인용 금지.","media":"조선일보","label":"Q7"},{"no":8,"part":2,"q":"'가만히 있으면 죽이는 정당, 나서지 말라는 이야기를 많이 들었다'고 했다. 구체적 경험은.","tags":["압박","무혐의","강진","문자폭탄"],"script":["바로 어제도 겪었습니다. 나서지 말라는 조언은 배려처럼 오지만, 사실은 경고입니다. 목소리를 내는 순간 공천 불이익과 문자폭탄이 온다는 걸 모두가 알기 때문에 침묵하는 겁니다.","저는 의장 시절에 영장도 없이 차량을 털리고, 수개월 경찰 조사 끝에 무혐의를 받았습니다. 그런데도 허위사실을 쓴 언론에 조리돌림을 당했습니다. 억울해서 죽고 싶었던 심정, 그때 겪어봤습니다. 그래서 더욱, 이번에 후보 등록을 해야겠다고 생각했습니다. 안 하는 것보다 하는 게 나으니까요."],"quotes":[["박동완 통화 원워딩(7.19)","바로 어제도 겪었다"],["페이스북(등록 직후)","끝까지 살아남아 목소리를 내겠습니다. 지금까지 그랬듯, 쫄지 않고 여러분의 목소리를 전달하겠습니다"]],"notes":["의장 시절 압수·조사·무혐의·언론 피해: 페이스북 게시글 원문 [자료 12]"],"warn":"구체 인명 거론 금지. '어제 겪은 일'은 인터뷰 전 어떤 사례를 말할지 본인이 확정해 둘 것.","media":"조선일보","label":"Q8"},{"no":9,"part":2,"q":"청년 정치인으로서 체감하는 2030의 민주당에 대한 실망감은 어느 정도인가.","tags":["2030","무당층","이생망중꺾마"],"script":["숫자로 말씀드리겠습니다. 18세에서 29세 중 무당층이 48%입니다. 절반이 어떤 정당도 내 삶에 답하지 않았다고 생각하는 겁니다. 원래도 꼰대 정당이라는 인식 때문에 2030 지지율이 낮았는데, 지난 1년 사이 더 무너졌습니다. 특히 20대 남성은 바닥이고, 이제 여성들도 빠져나가고 있습니다.","청년이 민주당을 떠난 게 아닙니다. 민주당이 먼저 청년을 떠난 겁니다. 선거철에 청년을 앞줄에 세워 사진 찍고, 선거가 끝나면 돌려보내는 일을 반복해 놓고 청년이 떠난다고 걱정합니다. 청년의 보수화가 걱정되십니까? 청년의 보수화는 민주당의 기득권 정치가 뿌린 씨앗입니다.","그런데 저는 숫자보다 말이 더 아픕니다. 제 또래들은 '이생망'이라고 합니다. 이번 생은 망했다고 말하는 세대에게, 정치가 한 번도 '네 잘못이 아니다'라고 말해준 적이 없습니다. 저는 그 말을 하러 나왔습니다."],"quotes":[["출마선언문(7.9 최종)","민주당에 청년이 사라졌습니다. 18세에서 29세 중 무당층이 48%입니다. 어떤 정당도 내 삶에 답하지 않았다고 생각하는 것입니다"],["출마선언문(7.9 최종)","청년이 민주당을 떠난 것이 아닙니다. 민주당이 먼저 청년을 떠난 것입니다"],["박동완 통화 원워딩(7.19)","45%가 무당층이다, 이 얘기만 하면 안 돼요. 원래부터 꼰대 정당이라고 소문나 가지고 2030 지지율이 낮았지만 지난 1년 동안 다 말아먹었다. 20대 남자들은 20%도 안 되고, 이제 여자들도 빠져나가고 있다. 그리고 본인 주변에 있었던 얘기를 하시라"],["비전·공약","어제 불합격 통보를 받았지만, 오늘 새로운 입사지원서를 쓰고 계시는 우리 청년 여러분 — 우리 모두, 이 꺾이지 않는 마음을 함께 품읍시다"]],"notes":["'48%'는 출마선언문 공식 수치 — 그대로 인용 가능 [자료 7]"],"warn":"'20대 남성 20%'는 통화 수치로 출처 미확정 — '바닥'으로 표현. 48%는 출마선언문 기재 수치라 그대로 사용.","media":"조선일보","label":"Q9"},{"no":10,"part":2,"q":"정 전 대표의 1인 1표제를 강하게 비판했다.","tags":["1인1표","정청래","선호투표","컷오프","유령당원"],"script":["1인 1표라는 방향 자체는 제가 먼저 요구한 겁니다. 문제는 그 말이 현장에서 거짓이 된다는 겁니다. 유령 당원이 섞인 명부, 후보도 모르는 득표수, 그리고 본선만 1인 1표를 하고 예비경선은 밀실 컷오프로 두는 반쪽 구조 — 정청래식 1인 1표는 사기입니다. 당원 주권이 아니라 간판입니다.","그리고 이건 직전 당대표의 책임이기도 합니다. 민주 정치는 책임 정치니까요. 선호투표를 도입했으면 컷오프는 안 됩니다. 청년의 입을 막는 청년 컷오프 하지 말고, 5인 모두 본선에서 정정당당하게 겨룹시다."],"quotes":[["박동완 통화 원워딩(7.19)","정청래가 말하는 당원주권 1인 1표는 사기다. 유령 당원은 다 섞여 있고, 내가 찍은 후보 몇 표 나왔는지 후보한테도 안 알려 주는데 그게 무슨 당원 주권이냐"],["7.14 기자회견","밀실 컷오프를 폐지하고 예비경선부터 전 당원 1인 1표를 보장하라. 선거인 수와 후보별 득표수를 100% 공개하라"]],"notes":["'사기' 원워딩 그대로 사용(후보 결정) [자료 13]","선호투표제 확정(7.14 최고위·7.15 당무위): [자료 1]"],"warn":null,"media":"조선일보","label":"Q10"},{"no":11,"part":2,"q":"당대표가 된다면 5가지 중 가장 먼저 복원할 제1의 가치는.","tags":["공정","재집권","계란과바위"],"script":["공정입니다. 저는 민주당의 공정을 회복하기 위해서 출마했습니다.","공정과 당내 민주주의를 확립하는 것이 단순히 옳아서가 아니라, 재집권을 위한 핵심 과제이기 때문입니다. 공정이 무너지면 청년이 떠나고, 청년이 떠난 정당에는 총선도 대선도 없습니다. 규칙이 공정해야 계란도 바위와 겨뤄볼 수 있습니다."],"quotes":[["박동완 통화 원워딩(7.19)","공정이다. 나는 민주당의 공정을 회복하기 위해서 출마했다. 공정과 당내 민주주의 확립하는 게 재집권을 위한 핵심적인 과제라고 생각한다"],["공개질의 답변서(7.13)","약한 계란이 강한 바위를 두드려, 결국 금을 냅니다"]],"notes":["통화 지시: 공정과 당내 민주주의 둘 다 말할 것 [자료 13]"],"warn":null,"media":"조선일보","label":"Q11"},{"no":12,"part":2,"q":"'젊은 얼굴'을 넘어 공천·의사결정 구조에서 어떤 구체적 변화를 약속하나.","tags":["공약","25개약속","청년결정권","청년최고위원","공개질의답변"],"script":["말이 아니라 이미 문서로 약속했습니다. 저는 '뽑고 싶은 민주당을 위한 25개 약속'을 냈고, 지금 하루에 하나씩 공개 발표하고 있습니다. 핵심은 세 가지입니다. 첫째, 밀실 컷오프 폐지와 예비경선부터 전 당원 1인 1표. 둘째, 선거인 수·득표수 100% 공개 — 경선과 공천을 유리상자처럼 투명하게. 셋째, 청년 결정권 — 자리가 아니라 권한을 드리는 겁니다.","구체적으로 약속드린 것도 있습니다. 전국청년위원회가 공개 질의를 보내왔을 때 저는 문서로 답했습니다. 청년최고위원제 즉시 시행에 찬성하고, 이번에 무산되면 취임 당일 1호 안건으로 발의해 취임 30일 이내, 9월 안에 개정을 완료하겠다고요. 그리고 청년최고위원은 낙점이 아니라 선출직이어야 하고, 당대표 몫 지명직 최고위원은 전원 청년으로 임명하겠다고 답했습니다. 못 지키면 그 사유와 책임까지 공개하겠다는 것까지, 전부 문서로 남겼습니다.","가짜 1인 1표 문제도 방법까지 제시했습니다. 당원 명부와 행안부 주민등록 데이터를 대조해서 진짜 당원만 가려내는 겁니다. 그 지역에 사는 사람이 그 지역 민주당 후보를 뽑는, 가장 상식적인 일부터 하겠습니다. 그리고 다른 후보들께 공개 제안합니다. 민주당이 정말 공정하고 투명한 정당이라 자신하신다면, 제 '경선 데이터 전면 공개' 공약을 이번 전당대회 우리 모두의 공통 공약으로 삼읍시다. 경선에서 떨어진 사람도 자신이 어느 지역, 어느 세대의 마음을 얻지 못했는지 알아야 성장합니다. 승자도 패자도 박수받는 '싱어게인' 같은 민주당, 그게 제가 만들 경선입니다."],"quotes":[["출마선언문(7.9 최종)","당원 명부와 행안부 주민등록 데이터를 대조해서 진짜 당원만 가려내겠습니다. 그 지역에 사는 사람이 그 지역 민주당 후보를 뽑는, 가장 상식적인 일부터 하겠습니다"],["메시지② '싱어게인'(김보미.com)","저 김보미가 당대표가 된다면, 지난 지방선거의 모든 경선 데이터를 상세하고 투명하게 전면 공개하겠습니다. 다른 후보님들께도 제안합니다 — 이 '경선 데이터 전면 공개'를 우리 모두의 공통 공약으로 삼읍시다"],["공개질의 답변서(7.13)","당대표에 당선되면 취임 당일 청년최고위원제 도입 당헌·당규 개정을 '1호 안건'으로 발의하겠습니다"],["공개질의 답변서(7.13)","청년의 대표는 당대표의 낙점이 아니라 당원의 투표로 세워야 합니다"],["공개질의 답변서(7.13)","최고위원회의에서 청년의 목소리가 '구색'이 아니라 '상수'가 되게 하겠습니다"]],"notes":["전국청년위원회(모경종 위원장) 긴급 공개질의(7.13) → 6개 질의 전체 서면 답변: ①즉시 시행 ②취임 당일 1호 안건 ③30일 이내 완료·결과 공개 ④선출직+지명직 전원 청년 ⑤청년위원장 최고위 상시 배석·청년 사전협의·월례 간담회 ⑥25개 약속 중 '청년 결정권' [자료 14]","통화 지시: '공약 얘기하세요 — 1인 1표, 투명 공개, 어제 발표한 공약 첫째 둘째' [자료 13]"],"warn":null,"media":"조선일보","label":"Q12"},{"no":13,"part":2,"q":"주류를 향한 쓴소리는 '내부 총질' 반발을 부른다. 어떻게 돌파할 계획인가.","tags":["내부총질","강성지지층","김어준","화산","동행"],"script":["당은 강성 지지층의 것도 아니고, 김어준씨의 것도 아니고, 꼰대 686의 것도 아닙니다. 당원과 국민의 것입니다.","저는 청년들, 일반 당원들, 그리고 권리당원 중에 합리적으로 생각하시는 분들이 지금 제 이야기에 귀를 기울이고 계시다고 생각합니다. 정견발표 이후에 쏟아진 폭발적인 관심이 그 증거입니다. 혁신의 동력은, 당의 공정과 민주주의를 회복할 동력은 이미 준비돼 있습니다.","문제는 누가 그 화산을 터뜨려 주느냐입니다. 제 몸이 부서지더라도, 그 분노를 폭발시키는 데 조그만 역할이라도 하겠습니다. 그게 제가 돌파하는 방식입니다. 밀실이 아니라 광장에서, 동원이 아니라 동행으로."],"quotes":[["박동완 통화 원워딩(7.19)","당은 강성 지지층의 것도 아니고 김어준의 것도 아니다. 꼰대 686 것도 아니다. 청년들이나 일반 당원들, 권리당원들 중에 합리적인 생각을 하는 사람들은 내 얘기에 귀를 기울이고 있다. 혁신의 동력, 당의 공정과 민주주의를 회복할 수 있는 동력은 준비되어 있다. 누가 그 화산을 터뜨려 주느냐인데, 제 몸이 부서지더라도 그 분노를 폭발시키는 데 조그만 역할이라도 하겠다"],["전대자료집 확정 멘트","동원이 아니라 동행입니다. 김보미를 마음껏 사용해 주십시오"]],"notes":["통화 원워딩 그대로 [자료 13]"],"warn":null,"media":"조선일보","label":"Q13"},{"no":14,"part":2,"q":"'바위에 맞서는 계란' — 다른 네 명의 쟁쟁한 후보에게 없는 '김보미만의 무기'는.","tags":["무기","계파","재산","나라살림돋보기","청년최고위원"],"script":["기득권 계파에 물들지 않았다는 겁니다. 저는 신세 진 사람이 없습니다. 그래서 갚아야 할 사람도, 챙겨줘야 할 사람도 없습니다. 당원이 원하는 게 뭔지, 국민이 원하는 게 뭔지만 보고 눈치 안 보고 개혁할 수 있는 유일한 후보라고 감히 말씀드립니다.","청년최고위원 하나를 못 만들고 반대하는 걸 보십시오. 챙겨줄 사람이 있고 신세 진 사람이 많은 기득권의 한계가 바로 저겁니다. 저에게는 그 한계가 없습니다.","그리고 삶이 무기입니다. 다섯 후보 중에 일반 국민과 같은 상황에서 같은 마음으로 사는 사람은 저뿐입니다. 제 명의 재산이 마이너스 9,178만 원입니다. 불합격 통보의 무게, 사직서를 품고 출근하는 마음 — 그 삶을 저는 지금 살고 있습니다. 여기에 숫자가 있습니다. 재정주권시민행동 공동대표로 만든 '나라살림 돋보기'는 동네 이름만 치면 전국 243개 지자체와 중앙정부 예산이 3초면 나옵니다.","마지막으로 승복의 품격입니다. 저는 지난 강진군수 경선에서 그 불공정을 겪고도 '경선 결과를 겸허히 받아들입니다'라고 승복했고, 억울함을 삼키고 당 후보들의 본선 승리를 도왔습니다. 승자도 패자도 함께 빛나는 민주당 — 말이 아니라 행동으로 먼저 보여드렸습니다. 지금 제 캠프는 역사상 가장 가난한 캠프지만, 가장 많은 사람이 함께하는 캠프입니다. 저의 빽도, 후원자도, 대변인도 국민 여러분입니다."],"quotes":[["박동완 통화 원워딩(7.19)","기득권 계파에 물들지 않았다. 신세를 갚아야 될 사람도 없다. 진정하게 당원이 원하는 게 뭔지, 국민이 원하는 게 뭔지를 파악해서 개혁을 하려면 챙겨 줄 사람도 없고 신세 진 사람도 없는 저 같은 사람이 나서야 된다. 청년 최고위원 하나 배당 못 하고 반대하는 걸 봐라. 그게 챙겨 줄 사람 있고 신세 진 사람 많은 기득권들의 한계다. 민주당의 대선·총선 승리를 위해 꼭 해야 될 개혁을 눈치 보지 않고 과감하게 할 수 있는 유일한 후보다"],["페이스북(등록 직후)","빽이 없다는 말은 틀렸습니다. 저에게는 지지자 여러분이라는, 세상에서 가장 큰 빽이 있습니다"]],"notes":["재산 -9,178만 원·아버지 이야기 좋아요 600+: [자료 11·12]"],"warn":null,"media":"조선일보","label":"Q14"},{"no":15,"part":2,"q":"지방정치(강진군의회) 경험이 여의도 중앙정치의 고질적 문제 해결에 어떤 실질적 도움이 되나.","tags":["강진","호남","지방","예산","맘다니"],"script":["호남 정치를 개혁하면 민주당이 다 바뀝니다. 그게 제 답입니다.","지금 중앙정치의 제일 큰 문제는, 지방을 이용만 했지 지방을 위해 해 준 게 없다는 겁니다. 저는 예산서를 보좌진 보고서로 읽은 사람이 아니라 직접 뜯어본 사람입니다. 지방의회는 예산과 민생이 매일 부딪히는 최전선이거든요. 그 바닥 민심과 생활 감각이, 거대 담론만 넘치는 여의도에 가장 부족한 것이고, 제가 가진 것입니다.","말이 아니라 기록으로 증명합니다. 역대 최대 규모인 낭비성 예산 108억 원을 삭감했고, 행정사무감사 시정요구 195건, 조례 165건 제·개정 — 전반기 대비 44% 늘렸습니다. 강진군의회 개원 이래 최초로 '일문일답' 군정질문을 도입해 집행부를 실시간 검증했고, 업무추진비는 전면 공개했습니다. 전남 최초·전국 최고 수준의 강진형 육아양육수당 — 자녀 1명당 만 7세까지 월 60만 원 — 조례를 대표 발의해서, 시행 후 출생아와 전입 인구가 늘었습니다. 지방에서 되는 것을 보여줬으니, 이제 중앙에서 하겠다는 겁니다."],"quotes":[["박동완 통화 원워딩(7.19)","호남 정치를 개혁하면 다 바뀐다로 가도 된다. 지방을 이용만 해 먹었지 지방을 위해서 해 준 게 없다"],["김보미.com 의정성과","역대 최대 규모 낭비성 예산 108억 원 삭감(2023 본예산 4,790억의 2.25%) · 행정사무감사 시정요구 195건 · 조례 165건 제·개정(+44%)"],["페이스북","호남에는 선거가 없고, 공천만 있습니다"],["참고 워딩 (자질·경험·나이 질문 공용)","지방의회는 중앙의 축소판입니다. 오히려 지방의회 경험도 없이 중앙정치 하는 분들이 허다합니다. 유럽은 지방의원부터 정치인을 양성합니다. 뉴욕시장 맘다니는 저보다 동생뻘입니다 — 30대가 못할 게 뭐가 있습니까?"]],"notes":["의정 성과 수치 전체: 김보미.com '한눈에 보는 실적'·'주요 의정 성과' 직접 확인 [자료 7]"],"warn":null,"media":"조선일보","label":"Q15"},{"no":16,"part":2,"q":"“AI 3대 강국을 향해야 할 나라” — 민주당이 당장 주도권을 쥐어야 할 핵심 미래 산업·기술 어젠다는.","tags":["AI","메가프로젝트","농업","기후위기","균형발전"],"script":["복잡하게 말씀 안 드리겠습니다. 3대 메가 프로젝트입니다. AI 반도체, 로봇, 그리고 AI 데이터센터. 이 세 가지는 반드시 성사시켜야 합니다.","다만 그 과정에서 양극화가 생길 수 있습니다. 청년이 소외되고, 지방이 소외될 수 있습니다. 대기업과 중소기업, 수도권과 지방의 격차가 더 벌어지지 않도록 배분하고 균형발전에 투자하는 것까지가 국가의 일입니다.","그리고 하나 더, 이건 꼭 말씀드리고 싶습니다. AI 다음은 농업입니다. 기후위기는 곧 식량위기입니다. 인류가 쌀 하나를 주식으로 만드는 데 몇천 년이 걸렸습니다. 기후가 급격히 바뀌면 새로운 식량 작물을 갑자기 만들어낼 수 없습니다. 그래서 AI와 로봇을 식량위기에 대응하는 첨단 농업에 동원해야 하고, AI 이후의 전략 산업으로 농업 첨단화를 지금부터 준비해야 합니다. 호남에서 온 후보라서 하는 말이 아니라, 미래를 보고 드리는 말씀입니다.","그리고 그 미래의 열쇠는 지방에 있습니다. RE100의 핵심인 바람과 태양, AI 벨트에 필수적인 넓은 부지와 풍부한 용수는 여의도 빌딩 숲에 있지 않습니다. 지방에 다 있습니다. 대통령은 남부권 AI·반도체 벨트를 만들고 계신데 당은 계파 싸움만 하고 있습니다. 저는 정부보다 한발 앞서 미래를 연구하는 당, 대통령을 가장 잘 돕는 당대표가 되겠습니다."],"quotes":[["박동완 통화 원워딩(7.19)","복잡하게 얘기하지 말고 — AI 반도체, 로봇, 데이터센터 3대 메가 프로젝트, 반드시 성사시켜야 된다. 그런데 그걸로 인해서 양극화가 생길 수 있다. 청년이 소외되고 지방이 소외될 수 있다. 균형 발전에 투자를 해야 된다. 그리고 중요한 게 하나 있다. AI 다음은 농업이다. 기후 위기는 곧 식량 위기다. 인류가 쌀농사 하나를 인류의 식량으로 만들기 위해서 몇천 년 걸렸다. AI도 로봇도 식량 위기에 대응할 수 있는 농업을 키우는 데 동원해야 한다"],["정견발표문(7.12)","AI 3대 강국을 향해야 할 나라"]],"notes":[],"warn":"정부 기금 명칭 등 세부는 STT 불명 — '정부도 기금으로 대응하는 것으로 안다' 수준까지만.","media":"조선일보","label":"Q16"},{"no":17,"part":2,"q":"결국 정치는 통합이다. 86세대의 경험을 자산으로 남기면서 세대교체를 이루는 연착륙 방안은.","tags":["세대교체","통합","청년최고위원","공정한틀"],"script":["지금처럼 하면 됩니다. 젊은 사람들은 기득권의 잘못된 행태에 날카롭게 문제를 제기하고, 선배 세대는 청년들의 부족한 점을 지적해 주시고, 그렇게 서로 공정하게 경쟁하면 됩니다.","그리고 세대교체는 양심에 맡길 게 아니라 제도로 해야 합니다. 솔직히, 제가 나가시란다고 나가시겠습니까. 동일 지역구 3선 이상 출마 제한 — 이건 김용 최고위원 후보의 공약이기도 합니다 — 여기에 저는 단체장도 연달아가 아니라 모두 합쳐 3선까지로 해야 한다고 봅니다. 국회의원이 자기 자리를 위협할 인기 있는 시장·군수를 무슨 수를 써서라도 공천에서 떨어뜨리는 일, 이런 것만 못 하게 제도를 만들면 세대교체는 자연스럽게 됩니다.","기준은 나이가 아니라 시대의 과제입니다. 686 선배님들이 30대일 때 시대의 과제는 민주화였고, 그분들이 그 과제를 풀었습니다. 지금 우리의 과제는 AI 대전환, 지방소멸, 기후위기, 양극화입니다. 이 과제를 해결할 리더십이 당을 이끌어야 한다는 겁니다. 저는 세대 간의 전쟁이 아니라, 세대 간의 경쟁을 할 수 있는 공정한 틀을 만들어 달라는 겁니다. 그 틀만 있으면 선배들의 경험은 당의 가장 큰 자산이 됩니다."],"quotes":[["박동완 통화 원워딩(7.19)","지금처럼 하면 됩니다. 젊은 사람들은 기득권의 잘못된 행태에 대해서 날카롭게 문제 제기를 하고, 나이든 세대들은 청년들이 부족한 거에 대해서 지적을 하고, 그러면서 서로 공정하게 경쟁을 하면 된다. 청년을 위한 자리가 지금은 하나도 없지 않냐. 청년최고위원제 절대 반대해 가지고 결국은 안 돼 있지 않냐. 나는 세대 간의 전쟁을 하자는 게 아니다. 세대 간의 경쟁을 할 수 있는 공정한 틀을 만들어 달라는 거다"],["출마선언문(7.9 최종)","나설 때가 아니라 이제 멋진 이별을 준비할 때입니다. 대한민국을 다음 세대에게 넘겨주는 아름다운 퇴장, 청년들에게 민주당의 미래를 맡기는 명예로운 은퇴를 준비할 때입니다"],["출마선언문(7.9 최종)","저는 세대 전쟁을 하지 않겠습니다. 그러나 세대교체는 반드시 이루겠습니다. 민주당은 특정 세대의 정당이 아니라 대한민국 모든 세대의 정당이 되어야 하기 때문입니다"],["공개질의 답변서(7.13)","청년최고위원 한 자리는 끝이 아니라 시작입니다"]],"notes":["청년최고위원 분리선출안 부결: [자료 2]"],"warn":null,"media":"조선일보","label":"Q17"},{"no":18,"part":3,"q":"첫 여론조사 2%였다. 예비경선 컷오프 통과가 가능하겠나. 탈락하면 가처분으로 가나.","tags":["노무현2%","컷오프","가처분","완주"],"script":["2002년 국민경선 초반, 노무현 후보 지지율이 몇 %였는지 기억하십니까. 2%였습니다. 2%는 끝이 아니라 시작입니다. 절망의 숫자가 아니라 희망이 출발하는 숫자입니다.","가처분은 당이 당헌 위반 상태를 강행할 경우의 조건부 대응입니다. 그리고 분명히 말씀드립니다. 저는 끝장을 보겠습니다. 끝까지 완주합니다. 8월 17일 대전까지 갑니다."],"quotes":[["비전·공약 '계란과 바위'","기득권은 커 보일 뿐, 당원과 국민의 열망을 이길 수 없습니다. 권력은 강하지만, 민심은 더 강합니다"]],"notes":["완주 의지(7.18): '끝장을 보겠다, 끝까지 완주, 연대 생각 없다' [자료 11]","예비경선 배점 35·35·30(~7.23) vs 보도상 7.21 컷오프 — 상충, 인터뷰 전 확정 [자료 4·11]","노무현 2%는 조사 기준별 상이 가능 — 반박 시 '경선 초반 군소후보' 취지로 수용"],"warn":"'탈락 대비' 프레임에 말리지 말 것.","media":"조선일보","label":"Q18"},{"no":19,"part":3,"q":"이재명 대통령이 X에서 팔로우했다는 보도가 있다. 청와대의 낙점인가.","tags":["이재명","X팔로우","낙점","계파"],"script":["대통령께서 청년 평당원의 목소리를 지켜보신다면 좋은 일이지요. 하지만 저는 누구의 선택이 아니라 당원의 선택으로 여기까지 왔습니다. 누구 사주를 받았냐는 질문, 김어준씨한테도 받았습니다. 저는 누구의 똘마니도 아닙니다."],"quotes":[["페이스북(등록 직후)","저는 계파에 줄 선 적 없습니다. 국민께 줄 서서 여기까지 왔습니다"]],"notes":["뉴스1 보도(교차 미확인 ▲), X 계정 실재 확인 [자료 6]"],"warn":"낙점·교감 프레임 인정 절대 금지.","media":"조선일보","label":"Q19"},{"no":20,"part":3,"q":"조국혁신당과의 합당론에 대한 입장은.","tags":["조국혁신당","합당"],"script":["거꾸로 여쭙고 싶습니다. 당원이 빠진 합당 논의가 무슨 의미가 있습니까. 욕심보따리부터 내려놓아야 합니다."],"quotes":[],"notes":["확정 워딩: 전대자료집 체크리스트 ⑪·⑭ [자료 10]"],"warn":null,"media":"조선일보","label":"Q20"},{"no":21,"part":3,"q":"문자폭탄·팬덤정치는 민주당의 고질병 아닌가.","tags":["팬덤","문자폭탄","흥신소정치","계파","무당층"],"script":["당원의 열정은 민주당의 자산입니다. 문제는 열정이 아니라, 그 열정을 좌표찍기와 족보 캐기에 동원하는 정치입니다. 사진 한 장으로 계파를 판정하는 것 — 저는 그걸 '흥신소 정치'라고 부릅니다.","10년 전 상 받는 사진 한 장이 '이낙연계'의 증거로 돌았습니다. 기차역에서 배웅한 사진이 족보 캐기의 재료가 됐습니다. 가족끼리도 지지하는 사람이 다를 수 있는데, 다르면 무조건 손절해야 합니까.","청년에게 계파가 어디 있습니까. 18~29세 절반 가까이가 무당파입니다. 기득권이 장벽을 쳐놓고 오지 말라고 해놓고, 이제 와서 누구 라인이냐를 따지는 것 자체가 계파 정치입니다. 저를 계파 어디에 넣을지 고민하지 마시고, 제 공약을 검증해 주십시오."],"quotes":[["페이스북(등록 직후)","사진 한 장으로 계파를 판정하는 것, 그것이 바로 흥신소 정치입니다"]],"notes":["페이스북 게시글 원문 [자료 12]"],"warn":"당원 전체 비난 취지 절대 금지 — 그 순간 헤드라인이 된다. 비판 대상은 '흥신소 정치'라는 행태로 한정.","media":"조선일보","label":"Q21"},{"no":22,"part":3,"q":"정치 경력도 짧고 방송에서도 서툴다는 평가가 있다.","tags":["자질론","서툶","이생망중꺾마","맘다니"],"script":["맞습니다, 서툽니다. 뉴스공장에서도 하고 싶은 말을 다 못 했습니다. 그런데 국민 대부분의 인생이 그렇지 않습니까. 어제 실수하고, 오늘 다시 출근합니다.","다만 검증이라면 이미 혹독하게 받았습니다. 당적 박탈, 불신임, 표적 고소·감사·수사 — 전부 겪었고, 전 건 '혐의없음·불송치'로 종결됐습니다. 100여 건의 허위·비방 보도에는 손해배상 소송으로 맞서 2024년에 승소했습니다. 불신임을 당했을 때는 하루 1,000명의 군민이 철회 지지 서명을 해주셨습니다. 방송에는 서툴러도, 시련에는 서툴지 않습니다.","완벽해서 하는 게 아니라 해야만 해서 합니다. 서툴러도 하는 것이 안 하는 것보다 낫다 — 그게 제 정치의 전부입니다."],"quotes":[["비전·공약 '이생망, 그리고 중꺾마'","부끄러움과 좌절을 탁탁 털고 다시 한 번 힘을 내어 나아가보겠습니다"],["참고 워딩 (자질·경험·나이 질문 공용)","지방의회는 중앙의 축소판입니다. 오히려 지방의회 경험도 없이 중앙정치 하는 분들이 허다합니다. 유럽은 지방의원부터 정치인을 양성합니다. 뉴욕시장 맘다니는 저보다 동생뻘입니다 — 30대가 못할 게 뭐가 있습니까?"]],"notes":["'이생망→중꺾마' 서사: [자료 7]"],"warn":null,"media":"조선일보","label":"Q22"},{"no":23,"part":3,"q":"지지를 철회한 유튜버들이 있다. 초반 우군까지 등을 돌린 것 아닌가.","tags":["유튜버","지지철회","계파"],"script":["저는 누구의 똘마니가 아닙니다. 당선되려고 나왔습니다. 저를 마음대로 움직일 수 없다는 걸 확인시켜 드렸다면, 철회해 줘서 오히려 고맙습니다.","지지의 조건이 '말을 잘 듣는 것'이라면, 그 지지는 처음부터 제 것이 아니었습니다."],"quotes":[["페이스북","저는 계파에 줄 선 적 없습니다. 국민께 줄 서서 여기까지 왔습니다"]],"notes":["대응 기조(7.18 확정): '똘마니 아니다, 당선되려고 나왔다, 철회 오히려 고맙다' [자료 11]"],"warn":"이 싸움에 진 빼지 말 것 — 한 번 답하고 다음 주제로 전환.","media":"조선일보","label":"Q23"},{"no":24,"part":3,"q":"군소후보 간 단일화나 특정 후보와의 연대 가능성은.","tags":["단일화","연대","완주","김민석","정청래"],"script":["없습니다. 저는 완주합니다. 어떤 분들은 제가 특정 후보를 위해 뛰어주길 바라셨지만, 저는 누구를 위해서가 아니라 당선되려고 나왔습니다.","계란은 다른 계란과 합쳐서 바위가 되는 게 아닙니다. 바위에 금을 내는 건, 끝까지 부딪히는 계란입니다."],"quotes":[["박동완 통화 원워딩(7.19)","그 사람들은 제가 김민석을 위해서 정청래 까는 역할을 해 주길 바랐던 거잖아요. 그거 하려고 출마한 거 아니에요"]],"notes":["완주·연대 입장(7.18): '끝까지 완주, 연대 생각 없다' [자료 11]"],"warn":null,"media":"조선일보","label":"Q24"},{"no":25,"part":3,"q":"'억대 자산가' '부모 빽' '이낙연계' '세작' 의혹 제기가 있다. 해명한다면.","tags":["재산","계파","이낙연계","세작","검증"],"script":["전부 공개된 기록으로 답하겠습니다. 2018년 첫 재산신고 1억 남짓이 올해 3월 공직자윤리위 기준 3,395만 원이 됐고, 이번 후보 등록 신고 기준 제 명의 재산은 마이너스 9,178만 원입니다. 8년 만에 플러스가 마이너스가 됐습니다. 억대 자산가라니, 저에게는 로또 당첨만큼 꿈같은 얘기입니다.","계파 이력도 공개돼 있습니다. 추미애 대표 시절 첫 공천, 이낙연 대표 시절 제명, 이재명 대표 시절 복당. 이 이력의 어디를 잘라야 제가 누구의 계파가 됩니까. 그 계파에 있었으면 총리실이나 보좌관, 청와대 이력 하나쯤은 있어야 하는 것 아닙니까. 저에겐 단 하나도 없습니다.","한 가지는 정정하겠습니다. 빽이 없다는 말은 틀렸습니다. 저에게는 아낌없이 지지해주시는 지지자 여러분이라는, 세상에서 가장 큰 빽이 있습니다."],"quotes":[["페이스북(등록 직후)","세작이 당에서 쫓겨나고, 15% 감산을 받습니까? 세작이 토론회 한 번 못 열고, 자기 득표수도 모른 채 떨어집니까?"]],"notes":["재산·당적 이력·무혐의: 페이스북 게시글 원문 그대로만 인용 [자료 12]"],"warn":"숫자는 원문 그대로. 제명·수사 이력은 먼저 꺼내되 '무혐의'를 반드시 붙일 것.","media":"조선일보","label":"Q25"},{"no":120,"label":"Q26","part":3,"q":"(공통 대비) 혼자 목소리만 높인다는 지적이 있다. 다른 후보들과 만나 풀 생각은 없나.","tags":["토론회","공정","민주주의","완주"],"script":["그래서 제가 후보 등록을 마치자마자 모든 후보께 공개 제안을 했습니다. 당대표 후보 전원이 참여하는 공개 토론회를 열자고요. 민주당의 공정은 무엇인지, 청년들이 왜 떠나는지, 세대교체는 어떻게 이룰 것인지 — 국민과 당원 앞에서 공개적으로 토론합시다.","혼자 외치는 것은 민주주의가 아닙니다. 입장이 다르더라도 만나서 토론하고 설득하는 것이 민주주의 아니겠습니까. 당이 입을 막더라도 후보들이 뜻만 모으면 얼마든지 열 수 있습니다. 모두가 어렵다면, 되는 분들끼리라도 합시다. 누가 더 큰 목소리를 내느냐가 아니라 누가 민주당의 미래를 책임질 수 있는지를 겨루자는 겁니다. 응하지 않으신다면, 그것이야말로 토론할 실력이 없다는 자백 아니겠습니까."],"quotes":[["등록 소회문(페이스북)","그냥 혼자 외치는 것은 민주주의가 아닙니다. 입장이 다르더라도 만나서 토론하고 설득하는 것이 바로 민주주의 아니겠습니까"],["등록 소회문(페이스북)","비록 계란으로 바위를 치는 일일지라도 누군가는 끝까지 청년의 목소리를 대변해야 한다고 결심했습니다"]],"notes":["등록 당일 전 후보 공개 토론회 제안 — 성사 여부와 무관하게 '토론 회피 프레임'을 상대에게 씌우는 카드 [자료 19]","호남 회견 연계: 합동연설회는 '무관중 동영상 촬영회'일 뿐이라는 비판과 세트로 사용 [자료 17]"],"warn":null,"media":"조선일보"},{"no":101,"label":"B1","part":4,"q":"[후보 소개] 만 36세 최연소 군의장 출신 후보라고 언론들이 소개하던데요. 본인을 스스로 소개할 시간을 드리죠.","tags":["소개","강진","나라살림돋보기","재산"],"script":["안녕하십니까, 서른여섯 평당원 김보미입니다. 나이는 어리지만 민주당에서 정치한 지 13년 됐습니다. 강진에서 군의원 두 번 하고, 전국 최연소 기초의회 의장도 지냈습니다.","계파도, 돈도, 빽도 없습니다. 재산은 빚밖에 없고요. 대신 재정주권시민행동 공동대표로 '나라살림 돋보기'를 만들어서, 검색창에 동네 이름만 치면 전국 243개 지자체 예산이 3초면 나오게 했습니다. 숫자와 현장으로 정치하는 사람입니다."],"quotes":[["정견발표문(7.20 최종)","서른여섯, 평당원 김보미입니다. 나이는 어리지만 민주당에서 정치를 한 지 13년이 지났습니다. 강진에서 전국 최연소 기초의회 의장도 지냈습니다"]],"notes":["연설문 첫인사 그대로 활용 [자료 15]"],"warn":null,"media":"불교방송"},{"no":102,"label":"B2","part":4,"q":"[출마 이유] 현역 의원도 아니고 조직·계파도 없는 원외 후보로서 왜 당대표 경선에 뛰어드셨습니까?","tags":["출마이유","공정","세대교체","계파"],"script":["저는 이번 당대표 선거에 특정 후보를 공격해서 다른 후보 지지자들의 표를 얻으려고 출마한 사람이 아닙니다. 저는 계파가 없습니다.","민주당에 세대교체가 필요하고, 공정과 민주주의를 되찾아야 하고, 민주당에 청년이 돌아와 미래를 만들어야 한다는 의지로 출마했습니다. 686 기득권 정당 민주당을 청년도 공정하게 경쟁하는 정당으로 만들려고, 저 김보미가 당대표가 되려고 나왔습니다.","그렇게 하지 않는다면 총선도, 대선도, 미래도 없습니다. 2030이 지지하지 않는 민주당에는 내일이 없다는 절박한 마음으로 나섰습니다."],"quotes":[["정견발표문(7.20 최종)","저는 계파가 없습니다. 686 기득권 정당 민주당을, 청년도 공정하게 경쟁하는 정당으로 만들겠습니다. 저 김보미가 당대표가 되려고 나왔습니다"]],"notes":["통화 지시: '2030이 지지 안 하는 민주당은 총선도 대선도 없다' [자료 13]"],"warn":null,"media":"불교방송"},{"no":103,"label":"B3","part":4,"q":"[386 세대교체] 유력 후보 3명이 모두 386인데, 세대교체가 필요하다는 주장이시죠?","tags":["세대교체","86용퇴","화염병짱돌"],"script":["그렇습니다. AI 3대 강국에 진입하는 대한민국에, 화염병과 짱돌 들고 싸우던 세대가 아직도 민주당의 주인입니다. 민주화운동은 존중하고 저도 존경합니다. 하지만 그것이 40~50년 정치를 독점할 권리는 될 수 없습니다. 686이 786, 886까지 가면 민주당은 망합니다. 686은 아름답게 퇴장하고, 청년들이 민주당을 이끌어야 합니다.","그리고 세대교체는 양심에 맡길 게 아니라 제도로 해야 합니다. 솔직히, 제가 나가시란다고 나가시겠습니까(웃음). 첫째, 동일 지역구 3선 이상 출마 제한 — 이건 김용 최고위원 후보의 공약이기도 합니다. 여기에 저는 하나 더 얹었습니다. 단체장도 연달아 3선이 아니라 '모두 합쳐' 3선 이상은 못 하게 해야 합니다. 국회의원이 자기 자리 위협할 인기 있는 시장·군수를 무슨 수를 써서라도 공천에서 떨어뜨리는 일만 못 하게 제도를 만들면, 세대교체는 자연스럽게 됩니다. 퇴출이 아니라 영입입니다. 3선이 넘은 지역구가 열려야 새 인재가 들어올 자리가 생깁니다.","기준은 나이가 아니라 시대의 과제입니다. 686 선배님들이 30대일 때 시대의 과제는 민주화였고, 그분들이 풀었습니다. 지금의 과제는 AI 대전환, 지방소멸, 기후위기, 양극화입니다. 이 과제를 해결할 리더십이 당을 이끌어야 합니다. 저는 세대 전쟁이 아니라, 세대 간 경쟁을 할 수 있는 공정한 틀을 만들자는 겁니다."],"quotes":[["정견발표문(7.20 최종)","686이 786, 886까지 가면 민주당은 망합니다. 686은 아름답게 퇴장하고 청년들이 민주당을 이끌어야 합니다"],["뉴스공장 대비원고","세대교체를 하려면 양심에 맡길 것이 아니라 제도를 만들어야 합니다. 김용 최고위원 후보 공약처럼 동일 지역구 3선 이상 출마 못 하게 해야 합니다. 여기에 저는 단체장도, 연달아 3선이 아니라 모두 합쳐 3선 이상 못 하게 해야 한다고 봅니다"],["출마선언문(7.9 최종)","나설 때가 아니라 이제 멋진 이별을 준비할 때입니다. 아름다운 퇴장, 명예로운 은퇴를 준비할 때입니다"],["출마선언문(7.9 최종)","저는 세대 전쟁을 하지 않겠습니다. 그러나 세대교체는 반드시 이루겠습니다"],["박동완 통화 원워딩(7.19)","나는 세대 간의 전쟁을 하자는 게 아니다. 세대 간의 경쟁을 할 수 있는 공정한 틀을 만들어 달라는 거다"]],"notes":["호남 단체장 평균 연령 환갑 근접 — 국회의원이 은퇴 직전 인사만 공천하는 구조 비판(뉴스공장 원고) [자료 18]","조선일보 Q2·Q17과 동일 논리 — 상세는 해당 문항 참조"],"warn":null,"media":"불교방송"},{"no":104,"label":"B4","part":4,"q":"[돌풍] X 계정을 새로 여셨는데 이재명 대통령이 하루 만에 팔로우해서 화제가 됐죠?","tags":["이재명","X팔로우","낙점"],"script":["저도 놀랐습니다. 대통령께서 청년 평당원의 목소리를 지켜봐 주신다면 감사한 일이지요. 다만 분명한 건, 저는 누구의 선택이 아니라 당원의 선택으로 여기까지 왔다는 겁니다.","경청이 무엇인지 몸소 보여주시는 대통령이십니다. 댓글까지 다 보시고 거기서 아이디어도 얻으신다고 하지 않으셨습니까. 그 많은 댓글을 하나하나 확인한다는 게 얼마나 어려운 일입니까. 저를 비롯한 국민들의 목소리와 삶을 보고 들어주는 대통령이 계시다고 생각하면 정말 든든합니다. 저도 그런 '경청의 정치'를 하겠습니다."],"quotes":[],"notes":["낙점 프레임 금지 [금지선]"],"warn":"'낙점·교감' 해석에 동조 금지. 가볍게 받고 다음 질문으로.","media":"불교방송"},{"no":105,"label":"B5","part":4,"q":"[돌풍] 인터뷰 요청도 많이 받고 계시죠? 대중의 관심, 이유가 뭐라고 보세요?","tags":["돌풍","이생망중꺾마","5무정당"],"script":["제가 잘나서가 아니라, 다들 하고 싶었는데 아무도 하지 않던 말을 해서라고 생각합니다. '정말 듣고 싶은 말을 해 줘서 고맙다'는 분들이 많았습니다.","이번 생은 망했다고 말하는 청년 세대에게, 정치가 한 번도 '네 잘못이 아니다'라고 말해준 적이 없거든요. 저는 그 말을 하러 나왔고, 그 마음이 닿은 것 같습니다.","처음에는 제가 청년들의 분노를 대신 말했다고 생각했습니다. 그런데 지금은 2030만이 아니라 전 세대가 공감해 주고 계십니다. 공정과 세대교체가 청년만의 요구가 아니라, 민주당을 사랑하는 모든 세대의 요구였다는 것을 확인하고 있습니다."],"quotes":[["비전·공약","중요한 것은, 꺾이지 않는 마음입니다"]],"notes":["'아버지 이야기' 글 좋아요 600+ — 삶의 서사 공감 [자료 11]"],"warn":null,"media":"불교방송"},{"no":106,"label":"B6","part":4,"q":"[한계론] 언론이 3파전이라고 하고, 김 후보 도전엔 '계란으로 바위치기'라는 제목도 달던데요?","tags":["계란과바위","노무현2%","완주","맘다니"],"script":["맞습니다, 저는 계란입니다. 그런데 민주당의 역사가 처음부터 끝까지 계란으로 바위를 친 역사입니다. 노무현 후보는 2%로 시작했습니다. 그때 왜 안 될 사람이 나오냐고 했습니까? 김대중 대통령은 목숨을 위협받으면서도 도전했습니다.","김어준 공장장도 그러시더군요. 안 그래도 안 될 건데 왜 나왔냐고요. 그럼 여쭙겠습니다. 월드컵 우승 못 하면 출전도 하지 말아야 합니까? 서울대 못 가면 공부도 하지 말아야 합니까? 질 것이 뻔하다던 도전들이 이 나라 민주주의를 만들었고, 지역주의에 금을 냈습니다.","약한 계란이 강한 바위를 두드려, 결국 금을 냅니다. 저는 8월 17일 대전까지 완주합니다."],"quotes":[["공개질의 답변서(7.13)","약한 계란이 강한 바위를 두드려, 결국 금을 냅니다"],["참고 워딩 (자질·경험·나이 질문 공용)","지방의회는 중앙의 축소판입니다. 오히려 지방의회 경험도 없이 중앙정치 하는 분들이 허다합니다. 유럽은 지방의원부터 정치인을 양성합니다. 뉴욕시장 맘다니는 저보다 동생뻘입니다 — 30대가 못할 게 뭐가 있습니까?"]],"notes":[],"warn":null,"media":"불교방송"},{"no":107,"label":"B7","part":4,"q":"[송영길 자격] 송영길 의원 후보자격 예외 인정 — '청년 박지현은 안 되고 686 송영길은 되느냐'고 직격하셨죠? 복당은 신규 입당과 다르다는 반론도 있는데요.","tags":["송영길김용","박지현","공정","컷오프"],"script":["먼저 분명히 말씀드립니다. 저는 송영길 후보 개인을 공격하려고 이 문제를 제기한 것이 아닙니다. 검찰 수사와 재판 과정에서 겪으신 어려움을 모르지 않습니다. 하지만 민주당의 원칙은 개인의 사정보다 우선해야 합니다. 원칙은 사정이 있는 사람을 비껴가는 것이 아니라, 누구에게나 동일하게 적용될 때 비로소 원칙이 됩니다. 청년에게는 예외가 없고 기득권에게만 예외가 반복된다면, 청년들은 민주당에서 계속 멀어질 것입니다.","당헌·당규를 떠나서 보시죠. 4년 전 청년 박지현은 입당 6개월이 안 됐다는 이유로 서류 접수조차 거부당했습니다. 예외조항이 있으니 회의를 열어 논의해 달라는 요구도 묵살됐습니다. 그런데 등록 전날 밤 10시 30분, 똑같은 사유로 탈락 위기에 놓인 686 송영길 후보를 구제하려고 긴급 최고위원회가 열렸습니다. 김민석 후보도 '충분한 예외 사유'라며 거들었고요. 입사 면접장에서 자격 안 되는 면접자를 위해 면접 기준을 바꾸는 것과 한 치도 다르지 않습니다. 예외를 인정하려면 등록 전에 했어야죠. 불공정의 끝판왕입니다.","아무리 손흥민이라도 결정적인 반칙을 하면 레드카드를 받습니다. 심판은 '그동안 국가를 위해 헌신했으니 이번만 봐주겠다'고 하지 않습니다. 규칙보다 사람이 우선하는 순간, 민주주의는 무너집니다. 당대표 후보들 모두 청년 정책을 내놓고선, 정작 청년들이 가장 혐오하는 불공정을 적나라하게 보여줬습니다. 양두구육 아닙니까.","그리고 법원의 판단은 무죄고, 존중합니다. 하지만 돈봉투를 안 돌린 건 아니지 않습니까. 낡은 돈봉투 정치의 책임을 지고 쉬어야 할 분입니다. 당대표도 한 번 하셨습니다. 그때 청년정치를 위해, 공정을 위해 무엇을 하셨습니까. 두 번 하겠다는 건 어이가 없습니다."],"quotes":[["성명 전문","아무리 손흥민이라도 결정적인 반칙을 하면 레드카드를 받습니다. 심판은 '그동안 국가를 위해 헌신했으니 이번만 봐주겠다'고 말하지 않습니다"],["성명 전문","입사 면접을 갔는데, 자격이 안 되는 면접자를 위해 면접 기준을 바꾸겠다고 하는 것과 한 치도 다르지 않습니다"],["성명 전문","규칙보다 사람이 우선하는 순간, 공정보다 특혜를 우선하는 순간 민주주의는 무너집니다"],["문화일보 보도 워딩","규정은 같은데 사람에 따라 적용을 달리한다면, 그것은 불공정을 넘어 비정상의 극치"],["7.18 대책회의","박지현 사례와 이번 자격 특혜는 같지 않고 더 심각 — 룰 확정 후 맞춤형 개정이기 때문"]],"notes":["당규: 권리행사 시행일 6개월 전 입당+당비 6회, 예외는 최고위 의결+당무위 — 송영길 2.27 복당(6개월 미달), 김용 계좌동결로 당비 미납 [한국일보 보도·BBS 제공 자료]"],"warn":"'무죄지만 돈봉투' 발언은 명예훼손 시비 소지 — 반드시 '법원 판단은 존중한다'를 앞에 붙이고 의혹 사건의 정치적 책임론으로 한정.","media":"불교방송"},{"no":108,"label":"B8","part":4,"q":"[컷오프] 오늘 컷오프에서 3인을 추립니다. 컷오프 제도에 비판적 시각을 갖고 계시죠?","tags":["컷오프","선호투표","1인1표"],"script":["선호투표제를 도입했으면 컷오프는 안 됩니다. 표가 갈릴 걱정이 없는데 왜 자릅니까. 청년의 입을 막는 '청년 컷오프'를 하지 말고, 5인 모두 본선에서 정정당당하게 겨루면 됩니다.","지금 이 경선이 어떤지 말씀드릴까요. 저는 등록을 마친 다음에야 경선 룰을 받았습니다. 선수가 뛰기 시작한 뒤에 규칙을 정하는 겁니다. 등록 나흘 뒤 컷오프인데 토론회는 한 번도 없습니다. 합동연설회요? 청중도 없이 동영상 찍는 '무관중 동영상 촬영회'일 뿐입니다. 기탁금 1,000만 원 내고 하는 게 그겁니다. 그래서 제가 후보 전원 공개 토론회를 제안했습니다. 모두 어렵다면 되는 분들끼리라도 합시다.","밀실 컷오프가 아니라, 선거인 수와 득표수를 100% 공개하는 투명한 경선이어야 당원 주권입니다."],"quotes":[["전대자료집 확정 기조","선호투표를 도입했으면 컷오프는 안 됩니다. 5인 모두 본선에서 정정당당하게 겨룹시다"]],"notes":["선호투표제 7.14 의결·7.15 확정 [자료 1]"],"warn":null,"media":"불교방송"},{"no":109,"label":"B9","part":4,"q":"[기탁금] 전당대회 기탁금이 갑자기 인상됐죠? 청년 출마를 어렵게 한다는 비판이 있는데요.","tags":["기탁금","청년","공영제"],"script":["제가 산증인입니다. 예비경선 기탁금이 2,000만 원으로 올랐고, 청년 50% 감면을 받아도 1,000만 원입니다. 저는 그 1,000만 원이 없어서 등록 당일 다섯 군데서 빌렸습니다. 본경선 가면 5,000만 원입니다. 이건 청년에게 출마하지 말라는 얘기입니다.","이재명 대통령이 당대표 시절 당직선거 공영제를 도입하려고 기탁금을 줄여 놓았더니, 오히려 더 올려버렸습니다. 오죽하면 대통령이 나서서 깎아주라고 했겠습니까. 그리고 그게 어떻게 당무개입입니까. 이런 논란은 대체 누가 만든 겁니까. 당직선거 공영제, 저 김보미가 반드시 실현하겠습니다."],"quotes":[["정견발표문(7.20 최종)","오죽하면 대통령이 나서서 기탁금 깎아주라고 이야기했겠습니까. 그리고 이것이 어떻게 당무개입입니까. 당직선거 공영제, 저 김보미가 반드시 실현하겠습니다"]],"notes":["기탁금: 지난해 당대표 1,500/최고위원 500 → 7.14 공고 예비경선 2,000, 본경선 당대표 5,000, 청년 50% 감면 [BBS 제공 자료]","기탁금 당일 5곳 차입: 페이스북 새벽 게시글 [자료 12]"],"warn":null,"media":"불교방송"},{"no":110,"label":"B10","part":4,"q":"[6.3 책임론] 6.3 지방선거 결과에 정청래 대표가 책임져야 한다는 입장이시죠? 연임 도전을 부정적으로 보시죠?","tags":["정청래","책임정치","6.3지방선거"],"script":["민주 정치는 책임 정치입니다. 바로 직전 당대표가 선거 결과와 공천 파행의 책임을 지는 게 당연합니다. 대통령에 대한 국민의 압도적 지지에도 지방선거에서 졌습니다. 그런데 아무런 반성도 평가도 없습니다. 책임져야 할 분이 한 번 더 하겠다고 나오는 것, 그게 지금 민주당의 모습입니다.","국민의힘을 해산하겠다고 해놓고, 지난 지방선거에서 다 죽은 국민의힘을 펄펄 날게 만들어 줬습니다. 정청래 대표 시절 1년, 민주당은 미래의 문을 열지 못하고 과거의 벽에 갇혀 있었습니다. 반성하지 않는 민주당, 변화하지 않는 민주당으로는 청년의 마음을 얻을 수 없습니다."],"quotes":[["박동완 통화 원워딩(7.19)","정청래가 모든 책임을 져야 된다. 민주 정치는 책임 정치 아니에요"]],"notes":[],"warn":null,"media":"불교방송"},{"no":111,"label":"B11","part":4,"q":"[공천 문제] 선거 패배뿐 아니라 6.3 선거의 공천 문제도 지적하고 계시죠?","tags":["강진공천","유령당원","1인1표","공정"],"script":["제가 겪은 강진군수 경선이 불공정의 극치였습니다. 의장 선거 때 당에서 찍으라는 후보를 안 찍었다는 이유로, 당헌·당규에도 없는 새 지침을 만들어 기어이 15%를 감산했고, 전과가 다섯 개나 있는 후보는 감산 조항을 피할 방법을 억지로 만들어 공천을 줬습니다. 저는 66개 공약을 발표하고 공약집까지 냈지만 떨어졌고, 공약 하나 발표하지 않은 사람이 공천을 받았습니다. 제가 받은 경선 결과는 이름도 없는 '45.5'라는 숫자 하나였습니다.","결과는 어땠습니까. 공천받은 민주당 후보는 무소속에게 참패했고, 강진은 군수·도의원·군의원까지 모조리 무소속이 이겼습니다. 불공정 경선이 빚은 대참사입니다. 이런 일이 어디 강진뿐이었겠습니까.","가짜·불법 당원을 모았다고 후보자를 징계해 놓고, 그 가짜 당원들이 민주당 후보를 뽑게 했습니다. 이게 1인 1표입니까? 가짜 1인 1표입니다. 4무공천 약속도 지켜지지 않았습니다."],"quotes":[["정견발표문(7.20 최종)","불공정 경선이 빚은 참사였습니다. 이런 일이 어디 강진만 있었겠습니까"],["정견발표문(7.20 최종)","이게 1인 1표입니까? 이건 가짜 1인 1표입니다"]],"notes":["연설문에서는 '4무공천, 모두 사기였습니다' — 라디오에서는 '지켜지지 않았다'로 조절 가능, 판단은 후보 [자료 15]"],"warn":"강진 사례는 사실관계 자료 지참. 상대 후보 '전과 5개'는 공개된 선거공보 기준으로만.","media":"불교방송"},{"no":112,"label":"B12","part":4,"q":"[적통논쟁] 고 이해찬 전 총리 배우자가 정청래 후보 후원회장을 맡는다고 하죠? 민주당 적통논쟁, 어떻게 보세요?","tags":["적통논쟁","정청래","계파"],"script":["솔직히 저에게는 조금 먼 이야기입니다. 저는 지금 후원회 만드는 절차가 너무 복잡하고 번거로워서, 경선이 얼마 남지도 않았는데 그 안에 만들 수는 있을지 현실적인 걱정을 하고 있는 처지거든요. 어떤 후보는 후원회장이 누구냐로 화제가 되는데, 저는 후원회 자체가 없습니다. 이것이 청년 후보의 현실입니다.","고인은 당의 큰 어른이셨고, 유족께서 누구를 돕는지는 그분들의 선택입니다. 다만 이렇게 여쭙고 싶습니다. 적통이 혈통입니까, 인맥입니까?","민주당의 적통은 계란으로 바위를 쳤던 김대중·노무현의 도전 정신입니다. 누구의 배우자가 후원회장이냐로 적통을 다투는 것 자체가, 실력과 정책이 아니라 의리와 인맥을 앞세우는 낡은 정치입니다. 저는 그 적통 — 도전의 적통을 잇겠습니다."],"quotes":[["정견발표문(7.20 최종)","민주당의 모든 문제는 실력과 능력보다 의리와 인맥을 앞세우기 때문입니다"]],"notes":[],"warn":"고인·유족 관련 직접 비판 절대 금지. 비판 대상은 '적통 마케팅'이라는 정치 문화로 한정.","media":"불교방송"},{"no":113,"label":"B13","part":4,"q":"[유시민 비판] 이재명 대통령이 '필연적 실패의 길'로 가고 있다는 유시민 작가의 비판, 어떻게 들으셨나요?","tags":["유시민","이재명","검찰개혁"],"script":["쓴소리는 경청해야 한다고 생각합니다. 저부터가 당에 쓴소리를 하는 사람이니까요. 다만 저는 이재명 정부가 실패하기를 바라는 사람이 아니라, 성공시키려고 나온 사람입니다.","정부의 성공은 대통령 혼자 만드는 게 아니라 당이 만드는 겁니다. 지금처럼 계파 싸움으로 발목을 잡는 민주당이야말로 '필연적 실패의 길'입니다. 당을 바꿔야 정부가 성공합니다.","한 가지만 덧붙이면, 쓴소리에 문자폭탄으로 답하는 정당에는 미래가 없습니다. 쓴소리일수록 경청하는 것, 그것이 제가 말하는 당내 민주주의이고, 그래야 당도 정부도 삽니다."],"quotes":[],"notes":[],"warn":"유시민 개인 평가 금지. 논점을 '당 개혁 = 정부 성공'으로 전환.","media":"불교방송"},{"no":114,"label":"B14","part":4,"q":"[보완수사권] 수사·기소 분리에 의지가 없어 검찰개혁이 늦어진다는 비판, 보완수사권 논쟁은 어떻게 보세요? 여성단체들도 완전 폐지에 우려를 나타내는데요.","tags":["보완수사권","검찰개혁"],"script":["검찰개혁의 방향에는 전적으로 동의합니다. 그런데 솔직하게 여쭙고 싶습니다. 언제 적 검찰개혁입니까. 노무현 대통령 때 시작해서 24년이 지나도 완성하지 못했습니다. 작년 추석 전에 끝낸다고 하지 않았습니까. 혹시 공천받는 데 유리하니까 수십 년째 외치기만 한 것은 아닙니까.","저의 방향은 분명합니다. 검찰과 경찰이 서로 견제하는 제도를 만들어야 합니다. 정치검찰은 물론이고, 경찰의 독주도 절대 허용해선 안 됩니다. 개혁의 속도전 속에 범죄 피해자 보호에 공백이 생겨서는 안 되고, 여성단체들이 우려하는 지점이 바로 그것입니다. 당론안이 보완수사요구권을 유지하는 방향인 것으로 아는데, 피해자의 눈높이에서 공백이 없는지 국민과 함께 검증하며 가야 합니다. 개혁은 속도가 아니라 신뢰로 완성됩니다. 민주당을 과거에 묶어 둔 검찰개혁, 제가 깨끗이 정리하고 미래로 가겠습니다.","결국 개혁의 목적은 검찰을 이기는 것이 아니라 국민의 인권과 안전을 지키는 것입니다. 칼은 뺏어도 좋습니다. 그러나 국민을 지키는 선까지 자를 일은 아닙니다."],"quotes":[["출마선언문(7.9 최종)","검찰과 경찰이 서로 견제하는 제도를 만들겠습니다. 정치검찰은 물론, 경찰 독주도 절대 허용하지 않겠습니다"],["출마선언문(7.9 최종)","미래를 설계해야 할 정당이 죽자 사자 과거에만 복수하고 있습니다"]],"notes":["당론안: 형소법 196조 삭제 + 보완수사요구권 유지, 법사위 소위 심사 중, '8.17 전 처리' 방침 [자료: 법률신문·뉴시스, 7월 브리핑]"],"warn":"법안 세부는 '~로 안다'로 한정. 확정 전 단정 금지.","media":"불교방송"},{"no":115,"label":"B15","part":4,"q":"[청년최고위원] 선출직 청년최고위원 도입이 최고위에서 부결됐습니다. 계파 간에 선호투표제와 청년최고위원제가 거래된 것 아니냐는 시각도 있는데요.","tags":["청년최고위원","선호투표","계파","공개질의답변"],"script":["거래로 보인다면, 그게 바로 계파 정치의 민낯입니다. 청년의 자리가 계파 간 협상 카드로 쓰였다는 것 아닙니까. 청년최고위원 하나를 못 만들고 부결시키는 것 — 챙겨줄 사람 많고 신세 진 사람 많은 기득권의 한계입니다.","국민의힘조차 하고 있는 청년최고위원을, 민주당은 전준위가 전원일치로 결의한 안조차 계파싸움을 하느라 최고위에서 부결시켰습니다. 이것이 민주당의 현주소입니다. 그리고 이것이 바로 제가 출마한 이유입니다.","저는 전국청년위원회 공개질의에 문서로 답변했습니다. 청년최고위원제 도입에 전적으로 동의하며 즉시 시행을 요구한다고요. 당대표가 되면 취임 당일 도입 당헌·당규 개정을 1호 안건으로 발의하고 30일 이내에 완료하겠습니다. 그리고 한 자리 도입에 그치지 않겠습니다. 청년최고위원은 낙점이 아니라 선출직이어야 하고, 당대표 몫 지명직 최고위원은 전원 청년으로 임명하며, 당직과 예산에 대한 청년의 실질적 결정권까지 보장하겠습니다. 출마선언 25개 약속의 '청년 결정권' 공약 그대로입니다."],"quotes":[["공개질의 답변서(7.13)","당대표에 당선되면 취임 당일 청년최고위원제 도입 당헌·당규 개정을 '1호 안건'으로 발의하겠습니다"],["공개질의 답변서(7.13)","청년최고위원제 도입에 전적으로 동의하며, 즉시 시행을 요구합니다. 지명직 최고위원 전원 청년 임명, 당직과 예산에 대한 청년의 실질적 결정권 보장까지 나아가겠습니다"]],"notes":["분리 선출안 7.14 최고위 부결 — 김민석·송영길 '자기정치' 비판 보도 [자료 2]","국민의힘 청년최고위원 운영 비교 프레임 — 후보 지시(7.20)"],"warn":null,"media":"불교방송"},{"no":116,"label":"B16","part":4,"q":"[청년미래비서관] 이재명 정부가 청년미래비서관직을 신설하고 구글 출신 김태원 대표를 임명했습니다. 어떻게 보세요?","tags":["청년","이재명","청년결정권"],"script":["정부가 청년의 목소리를 들으려는 시도는 환영합니다. 능력 있는 분이 오신 것도 좋은 일이고요.","다만 한 가지만 말씀드리고 싶습니다. 청년 정치는 '청년의 목소리를 듣는 자리'를 만드는 데서 끝나면 안 되고, '청년이 결정하는 권한'까지 가야 합니다. 정부에 비서관이 생겼다면, 당에는 청년 정책 결정권이 생겨야 합니다. 그래서 저는 당 청년위원회에 청년 정책 결정권을 드리겠다고 약속했습니다."],"quotes":[["정견발표문(7.20 최종)","당 청년위원회가 청년 정책 결정권을 갖도록 하겠습니다"]],"notes":[],"warn":"인선 자체에 대한 평가는 절제 — 구조(결정권) 이야기로 전환.","media":"불교방송"},{"no":117,"label":"B17","part":4,"q":"[참정권] 이른바 올림픽공원 시위로 대표되는 청년들의 참정권 침해 비판은 어떻게 보세요?","tags":["참정권","청년","문자폭탄"],"script":["투표용지가 부족해 참정권을 박탈당한 송파 투표소 사건 — 청년들이 분노하는 건 당연합니다. 분명히 해야 할 게 있습니다. 청년들은 선거 결과를 뒤집자는 게 아닙니다. 누가 이기고 졌는지를 따지는 것도 아닙니다. 왜 과정의 공정이 무너졌는지를 묻고 있는 겁니다.","핵심은 결과가 아니라 과정입니다. 민주주의는 결과에 대한 승복 이전에 과정의 공정으로 지켜집니다. 투표소에서 몇 시간을 기다리고도 투표하지 못한 청년에게 '어차피 결과는 안 바뀐다'고 답하는 것은 모욕입니다. 한 표라도 과정에서 침해됐다면 사과하고, 재발 방지를 제도로 답해야 합니다. 그 과정의 불공정에 침묵한 것, 그것이 청년들이 분노하는 이유입니다.","그런데 민주당은 어떤 답을 했습니까. 아무도, 그 어떤 답도 하지 않았습니다. 다가가서 청년의 하소연을 들었다는 소식도 없습니다. 청년들은 정치를 싫어하는 게 아니라 공정하지 않은 정치를 싫어하는 겁니다. 저라면 시위 현장에 가서 먼저 듣겠습니다. 그 목소리가 불편하다고 피하는 순간, 민주당은 민주정당이기를 포기하는 겁니다."],"quotes":[["출마선언문(7.9 최종)","청년들은 선거 결과를 뒤집자고 말하는 것이 아닙니다. 왜 과정의 공정이 무너졌는지 따지고 있는 것입니다. 여기에 민주당이 어떤 답을 했습니까? 아무도 그 어떤 답도 하지 않았습니다"]],"notes":["송파 투표소 투표용지 부족 사건: 출마선언문에 명시 — 올림픽공원 시위와 연결된 참정권 이슈 [자료 7]"],"warn":"시위대 요구사항 세부는 미확인 — '먼저 듣겠다'는 태도까지만, 특정 요구 수용 약속 금지.","media":"불교방송"},{"no":118,"label":"B18","part":4,"q":"[기탁금 주문] 이재명 대통령의 기탁금 원상복귀 주문, 어떻게 보세요?","tags":["기탁금","이재명","공영제"],"script":["당연한 말씀을 하신 겁니다. 그리고 그 당연한 말을 대통령이 직접 해야 할 만큼 당 지도부가 거꾸로 갔다는 것이 문제의 본질입니다. 오죽했으면 대통령이 나섰겠습니까.","지금 민주당은 청년에게 높은 담장을 쳐 놓고 운동장에 못 올라오게 해 놨습니다. 예비경선 기탁금이 1천5백만 원에서 2천만 원으로 올랐습니다. 저는 청년이라 50%를 감면받았는데, 그 1천만 원도 없어서 여기저기 빌리느라 하루 종일 애를 태웠습니다. 그렇게 내고 할 수 있는 선거운동은 5일간 6분짜리 동영상 촬영 하나뿐입니다. 그걸 연설회라고 부르더군요. 경선 규칙이 무엇인지도 등록을 마친 뒤에야 알았습니다. 세계 10대 경제강국 집권당의 깜깜이 경선, 이게 실체입니다.","그런데 특정 후보 측에서는 대통령의 이 말씀마저 당무개입이라고 합니다. 청년의 문턱을 낮추자는 의견이 어떻게 당무개입입니까. 저는 아직 후원회조차 못 만들었는데 어떤 후보는 수억 원의 후원금을 자랑합니다. 이것은 기울어진 운동장이 아닙니다. 운동장 위에는 기득권만 올라가 있고, 청년은 운동장 밖에서 들어갈 문조차 찾지 못하고 있는 겁니다.","기탁금 인하를 넘어 당직선거 공영제로 가야 합니다. 돈이 아니라 정책으로, 인맥이 아니라 실력으로 경쟁하는 정당, 돈이 없어 출마를 포기하는 청년이 없는 민주당을 제가 만들겠습니다."],"quotes":[["정견발표문(7.20 최종)","당직선거 공영제, 저 김보미가 반드시 실현하겠습니다"],["페이스북(7.20)","운동장 위에는 기득권만 올라가 있고, 청년은 운동장 밖에서 들어갈 문조차 찾지 못하고 있습니다"]],"notes":[],"warn":null,"media":"불교방송"},{"no":119,"label":"B19","part":4,"q":"[청년과 부동산] 지방 출신 여성 청년으로서 — 수도권 부동산 급등과 전월세 품귀로 서울 거주 청년층이 민주당을 지지하지 않는 상황, 어떻게 보세요?","tags":["부동산","균형발전","청년","메가프로젝트"],"script":["서울 청년의 주거 절망과 지방 청년의 일자리 절망은 같은 문제의 양면입니다. 모든 것이 수도권에 몰려 있으니 집값은 폭등하고, 지방에는 청년이 남을 이유가 사라집니다. 제 고향에는 면소재지에 밥 먹을 식당이 사라지고 있습니다.","결국 지방이 살아야 나라가 바로잡힙니다. 수도권 집중을 그대로 둔 채 내놓는 부동산 대책은 대증요법일 뿐입니다. 지역균형개발로 지방에 사람과 일자리가 돌아와야 서울의 집값도, 청년의 절망도 풀립니다.","그래서 부동산 대책의 절반은 균형발전입니다. 대통령의 3대 메가프로젝트, 호남 반도체 800조 투자를 반드시 성공시켜서 지방에 좋은 일자리를 만들어야 서울의 주거 압력도 풀립니다. 여기에 청년취업보장제를 민주당 핵심 정책으로 도입해서, 청년이 어디에 살든 출발선을 보장하겠습니다."],"quotes":[["정견발표문(7.20 최종)","청년이 떠나고, 마을과 일자리가 없어지고, 면소재지에 밥 먹을 식당이 사라진 것 아닙니까"],["정견발표문(7.20 최종)","호남이 대한민국의 두 번째 수도권으로 우뚝 서도록, 대통령과 함께 3대 메가프로젝트를 반드시 성공시키겠습니다"]],"notes":["구체 부동산 세제·공급 수치는 캠프 공약 미확정 — 균형발전+청년취업보장제 프레임으로만"],"warn":null,"media":"불교방송"},{"no":201,"label":"N1","part":5,"q":"정견발표 발언이 큰 화제였습니다. 그동안 언론 인터뷰에서 가장 많이 받은 질문은?","tags":["출마이유","김어준"],"script":["'왜 출마했느냐'였습니다. 그래서 답했습니다. 계파도 돈도 빽도 없는 평당원이, 686 기득권 정당 민주당을 청년도 공정하게 경쟁하는 정당으로 만들려고, 당대표가 되려고 나왔다고요.","그런데 김어준 총수는 달랐습니다. 당선될 리도 없는데 정청래 저격하러 나온 것 아니냐고 끈질기게 물으시더군요."],"quotes":[["정견발표문(7.20 최종)","정청래 공격하려 나왔냐, 김민석 도와주려 나왔냐 — 아닙니다. 저 김보미가 당대표가 되려고 나왔습니다"]],"notes":[],"warn":null,"media":"뉴탐사"},{"no":202,"label":"N2","part":5,"q":"정청래 의원을 직접 거명하며 강도 높게 비판했는데, 이후 당내에서 껄끄럽지는 않으신지?","tags":["정청래","문자폭탄","꼰대","노무현2%"],"script":["당연히 시끄러웠습니다. 댓글 달리는 것 보면서 솔직히 공포에 떨기도 했습니다. 그런데 제일 마음이 아팠던 건 청년의 도전을 바라보는 시선이었습니다. '당선이 어렵잖아요', '현실을 인정해야죠' — 이 말이 반복해서 날아왔습니다.","정치가 언제부터 당선 가능성이 높은 사람만 도전할 수 있는 곳이 됐습니까? 노무현은 2%로 시작했습니다. 그때 왜 안 될 사람이 나오냐고 했습니까? 김대중은 박정희 정권이 현해탄에 빠뜨려 죽이려 했습니다. 서슬 퍼런 군사독재 치하에서도 도전했습니다. 탄압이 심하니 포기했어야 합니까?","김어준 총수 같은 꼰대들이 지금도 공격하고 있습니다. 하지만 잘 버티고 있습니다. 격려해 주시는 분들이 훨씬 더 많습니다. '정말 듣고 싶은 말을 해 줘서 고맙다'는 분들이 많았습니다."],"quotes":[["후보 답변 초안(원문)","정치가 언제부터 당선 가능성이 높은 사람만 도전할 수 있는 곳이 되었습니까?"]],"notes":["뉴탐사는 우호 매체 — 7.4 라이브 인터뷰(35:57, 압도적 조회수)·자체 보도 기사 인연 [자료 10·방송기록대장]"],"warn":"[방송기록대장 7.20] '꼰대' 재사용 금지 지침 — 원고의 '꼰대들' 표현은 '낡은 검증 방식'으로 대체 권고(최종 판단 후보). N11 표준답변 확정본과 톤 일치시킬 것.","media":"뉴탐사"},{"no":203,"label":"N3","part":5,"q":"핵심 메시지는 '세대교체'였습니다. 청년이 얼굴마담·들러리로 소모돼 온 현실 비판으로 읽혔는데, 진정한 세대교체란 무엇입니까?","tags":["세대교체","청년결정권","공천","호남"],"script":["청년을 들러리로 생각하지 않는 겁니다. 청년이 청년의 정책을 직접 결정하게 해 주는 것, 그리고 청년도 공정하게 출발선에 세워주는 겁니다.","지역 이야기를 좀 해 볼까요. 지역에서는 국회의원이 왕입니다. 국회의원에게 밉보이면 아무것도 할 수 없습니다. 말 잘 듣는 청년만 클 수 있어요. 아무리 실력이 있어도 국회의원 말을 안 듣거나 자기 자리를 위협할 것 같으면 가차 없이 잘라버립니다.","그래서 진정한 세대교체의 첫걸음은, 공천 과정에서 국회의원의 입김을 완전히 차단하는 것입니다."],"quotes":[["호남 기자회견문(7.18)","호남에는 선거가 없고 공천만 있습니다. 호남 유권자는 민주당의 들러리일 뿐입니다"],["호남 기자회견문(7.18)","저는 정청래를 떨어뜨리려고, 송영길을 떨어뜨리려고 나온 것이 아닙니다. 저는 586 다 떨어뜨리고 제가 당선되려고 나왔습니다"],["정견발표문(7.20 최종)","지역에선 국회의원이 왕입니다. 자기 맘에 들면 키워주고, 자기 말을 듣지 않는 청년은 씨를 말립니다"]],"notes":["호남 정치 독립선언(7.18): '호남이 호남을 키워야 민주당이 바뀝니다' — 뉴탐사에서 확장 가능 [자료 17]"],"warn":null,"media":"뉴탐사"},{"no":204,"label":"N4","part":5,"q":"'개혁' 앞세운 젊은 정치인들이 세대 갈라치기나 스스로 기득권화로 실망을 사기도 했습니다. 김보미도 '검증된 대안'인지 의구심이 있는데요.","tags":["자질론","검증","강진","계파","맘다니"],"script":["나이는 서른여섯이지만 입당한 지 13년입니다. 군의원 두 번 했고, 전국 최연소로 의장도 지냈습니다. 누가 끌어준 것도 아니고, 어느 계파에 소속된 것도 아닙니다. 오직 군민만 보고 정치했습니다. 같은 당 군수라도, 국회의원이라도 잘못하면 지적했습니다. 그래서 얻은 별명이 '폭주 기관차', '동네 쌈닭'입니다. 저를 지지하는 분들은 '강진의 이재명'이라고 부르십니다.","거꾸로 여쭙고 싶습니다. 대한민국에 유력 정치인이 끌어주지 않고, 스스로 온갖 고난을 이겨내면서 이 자리까지 온 청년 정치인이 있으면 한번 소개해 주십시오. 스물셋에 입당해 스물여덟에 최다득표로 당선됐고, 서른둘에 전국 최연소 의장이 됐습니다. 표적 징계와 수사는 전 건 혐의없음으로 끝났고, 허위보도 100여 건에는 소송으로 이겨냈습니다. 그리고 지난 강진군수 경선에서 그 불공정을 겪고도 승복하고 당 후보의 본선을 도왔습니다. 제가 아직 기죽지 않고 당대표에 도전한다는 것 자체가 검증된 대안이라는 증거입니다.","그리고 저는 세대 갈라치기를 하자는 게 아닙니다. 세대 간의 전쟁이 아니라, 세대 간의 경쟁을 할 수 있는 공정한 틀을 만들어 달라는 겁니다."],"quotes":[["박동완 통화 원워딩(7.19)","나는 세대 간의 전쟁을 하자는 게 아니다. 세대 간의 경쟁을 할 수 있는 공정한 틀을 만들어 달라는 거다"],["참고 워딩 (자질·경험·나이 질문 공용)","지방의회는 중앙의 축소판입니다. 오히려 지방의회 경험도 없이 중앙정치 하는 분들이 허다합니다. 유럽은 지방의원부터 정치인을 양성합니다. 뉴욕시장 맘다니는 저보다 동생뻘입니다 — 30대가 못할 게 뭐가 있습니까?"]],"notes":[],"warn":null,"media":"뉴탐사"},{"no":205,"label":"N5","part":5,"q":"재산, 부친의 선거 출마 이력을 거론하며 '지역 유지' 프레임으로 해석하려는 움직임이 있습니다.","tags":["재산","검증","기탁금"],"script":["저는 기탁금 1,000만 원이 없어서 등록 당일 다섯 군데서 빌렸습니다. 이게 '지역 유지'입니까?","재산은 전부 공개돼 있습니다. 2018년 첫 신고 1억 남짓이 올해 3월 공직자윤리위 기준 3,395만 원이 됐고, 이번 후보 등록 신고 기준 제 명의 재산은 마이너스 9,178만 원입니다. 재산은 빚밖에 없습니다.","아버지는 오래전 무소속으로 군의원 선거에 나가신 적이 있을 뿐, 지금은 공방을 운영하시는 분입니다. 자기가 지지하는 후보를 비판하니까 아무말 대잔치를 하는 것뿐입니다."],"quotes":[["페이스북(등록 직후)","억대 자산가라니, 저에게는 로또에 당첨된다는 것만큼이나 꿈같은 이야기입니다"]],"notes":["재산 수치·부친 관련: 페이스북 게시글 원문 그대로 [자료 12]"],"warn":null,"media":"뉴탐사"},{"no":206,"label":"N6","part":5,"q":"이낙연 전 총리 측근으로 알려진 이진련 전 대구시의원과 찍힌 사진 등이 논란이 됐습니다. 어떻게 돌파하실 계획입니까?","tags":["계파","이낙연계","흥신소정치"],"script":["그런 식으로 따진다면 김민석 후보와 사진 찍은 사람은 다 친석파고, 정청래 후보와 사진 찍은 사람은 다 친청파겠네요.","당 행사에 대구·부산에서 전남까지 와주신 여성 지방의원님들을 기차역에서 배웅한 것까지 족보 캐기의 재료가 됐습니다. 사진 한 장으로 계파를 판정하는 것, 그것이 바로 흥신소 정치입니다.","미안하지만 우리 청년들은 계파에 끼워 주지도 않습니다. 계파가 없어요. 벽을 쳐놓고 못 들어오게 막아 놓고, 이제 와서 누구 파냐 하는 것이 웃길 따름입니다."],"quotes":[["페이스북(등록 직후)","사진 한 장으로 계파를 판정하는 것, 그것이 바로 흥신소 정치입니다"]],"notes":["당적 이력 반박(추미애 공천·이낙연 제명·이재명 복당): [자료 12]"],"warn":null,"media":"뉴탐사"},{"no":207,"label":"N7","part":5,"q":"송영길 후보 자격 문제로 박지현 전 위원장을 소환하셨는데, '불가피한 복당'과 '신규 입당'은 다르니 비교가 무리라는 지적도 있습니다.","tags":["송영길김용","박지현","공정","돈봉투"],"script":["당헌·당규를 떠나 이겁니다. 어떤 청년은 후보 자격이 되는지 회의를 열어 결정해 달라고 했는데 접수조차 안 받았습니다. 어떤 686은 자격이 안 되니까 회의를 열어 등록할 길을 열어 줬습니다. 등록 시작하고 나서 규정을 고치는 시험이나 면접이 있습니까? 예외를 인정하려면 등록 전에 했어야죠. 불공정의 끝판왕입니다.","솔직히 말해서, '나를 어찌하랴, 규정이 뭔 필요 있어' 하고 아무 준비도 안 하신 것 아닙니까. 본인의 준비성 없음이 만든 문제를 누구 탓을 합니까. 자격이 안 되는 분이 면접을 보게 해달라고 떼를 쓰는 게 말이 됩니까.","법원의 판단은 무죄입니다. 존중합니다. 하지만 돈봉투를 안 돌린 겁니까? 낡은 돈봉투 정치의 책임을 지고 쉬어야 할 분입니다. 그리고 당대표 한 번 하셨지 않습니까. 그때 청년정치를 위해, 공정을 위해, 당내 민주주의를 위해 뭘 하셨습니까. 두 번 하겠다는 것도 어이가 없습니다."],"quotes":[["후보 답변 초안(원문)","등록 시작하고 나서 규정 고치는 시험이나 면접이 있습니까? 불공정의 끝판왕입니다"]],"notes":["당규 근거(6개월·당비 6회·예외 절차)와 송영길 2.27 복당·김용 계좌동결: BBS 자료와 동일 [B7 참조]"],"warn":"'무죄지만 돈봉투' — 반드시 '법원 판단은 존중한다' 선행. 인신 표현('게으르다')은 방송에서는 '준비성 없음'까지만.","media":"뉴탐사"},{"no":208,"label":"N8","part":5,"q":"줄곧 '공정'을 강조하셨는데, '룰'이 공정의 최고 기준이냐는 지적도 나옵니다.","tags":["공정","룰","송영길김용"],"script":["최고 기준은 아닐지 몰라도, 최소한의 기준입니다. 그런데 우리 민주당의 룰에는 '단, 어떠한 경우 예외로 한다', '단, 달리 정할 수 있다'가 너무 많습니다.","무슨 뜻이냐면, 누굴 떨어뜨리고 싶으면 얼마든지 떨어뜨릴 수 있고, 자격도 조건도 안 되지만 누굴 붙이고 싶으면 얼마든지 붙일 수 있다는 겁니다. 어떤 민주당 의원께서 이번 사태를 보고 '민주당은 룰이 없다'고 했는데, 딱 그 말이 맞습니다. 민주당은 최소한의 룰조차 없는 것과 마찬가지입니다.","그래서 약속합니다. 경선 룰은 6개월 전에 확정하고 절대 바꾸지 않겠습니다."],"quotes":[["정견발표문(7.20 최종)","경선 룰은 6개월 전에 확정하고 절대 바꾸지 않겠습니다"]],"notes":[],"warn":null,"media":"뉴탐사"},{"no":209,"label":"N9","part":5,"q":"지방의회 의장으로서 쌓아온 실질적 성과는 무엇이고, 그 리더십이 중앙 정치에서도 발휘될 수 있다고 자신하십니까?","tags":["강진","예산","나라살림돋보기","리더십","맘다니"],"script":["숫자로 말씀드리겠습니다. 전국 최연소 의장으로서 역대 최대 규모인 낭비성 예산 108억 원을 삭감했습니다. 2023년 본예산 4,790억의 2.25%입니다. 행정사무감사 시정요구 195건, 조례 165건 제·개정으로 전반기 대비 44%를 늘렸고, 강진군의회 개원 이래 최초로 '일문일답' 군정질문을 도입해 집행부를 실시간 검증했습니다. 업무추진비는 전면 공개해서 지방의회 투명성의 새 기준을 만들었습니다.","정책으로는 전남 최초·전국 최고 수준의 강진형 육아양육수당 조례를 대표 발의했습니다. 소득·자녀 수 무관, 자녀 1명당 만 7세까지 월 60만 원 — 시행 후 출생아와 전입 인구가 늘었고, 전액 지역화폐로 지급해 골목경제까지 살렸습니다. 그 예산 감시 경험으로 '나라살림 돋보기'를 만들어 누구나 동네 예산을 3초면 보게 했습니다.","리더십은 시련이 증명합니다. 표적 징계와 수사를 전 건 혐의없음으로 이겨냈고, 불신임을 당했을 때는 하루 1,000명의 군민이 철회 서명을 해주셨습니다. 여의도에 부족한 건 거대 담론이 아니라 숫자, 신뢰, 맷집입니다. 저는 셋 다 검증받았습니다."],"quotes":[["김보미.com 의정성과","전남 최초·전국 최고 수준 강진형 육아양육수당 — 자녀 1명당 만 7세까지 월 60만 원(아동 1인 최대 5,040만 원). 시행 후 출생아·전입 인구 증가"],["페이스북","강진군민들께서는 조용히 최다득표로 힘을 실어주셨습니다"],["참고 워딩 (자질·경험·나이 질문 공용)","지방의회는 중앙의 축소판입니다. 오히려 지방의회 경험도 없이 중앙정치 하는 분들이 허다합니다. 유럽은 지방의원부터 정치인을 양성합니다. 뉴욕시장 맘다니는 저보다 동생뻘입니다 — 30대가 못할 게 뭐가 있습니까?"]],"notes":["의장 성과는 '알아서 답변' 지시 문항 — 김보미.com '주요 의정 성과' 수치로 구성. 8년 연속 의정활동비 지역아동센터 기탁, 언론노출 970건 돌파, 유튜브 생중계 도입도 추가 소재 [자료 7]"],"warn":null,"media":"뉴탐사"},{"no":210,"label":"N10","part":5,"q":"후보님이 만들고 싶은 '미래형 민주당'의 청사진, 핵심 키워드 3가지로 정리해 주신다면?","tags":["공정","1인1표","청년","신천지","공약"],"script":["첫째, 공정한 민주당. 민주당에 공정이 없습니다. 강진군수 경선에서 저에게는 당헌·당규에도 없는 새 지침을 만들어 15%를 감산했고, 전과 다섯 개 후보는 감산 없이 공천을 받았습니다. 경선 규칙을 전면 혁신해서 실력으로, 정책으로 경쟁하는 정당을 만들겠습니다.","둘째, 민주주의가 있는 민주당. 가짜·불법 당원이 후보를 뽑는 가짜 1인 1표, 선거인 수도 득표수도 공개 안 하는 가짜 당원주권을 끝내겠습니다. 신천지가 특정 후보를 지원하려고 조직적으로 들어왔다는 의혹이 사실이라면 명백한 불법 당원입니다. 전수조사해서 모두 솎아내고 경선해야 합니다. 룰은 6개월 전 확정, 결과는 100% 공개하겠습니다.","셋째, 청년정당 민주당. 지역에선 국회의원이 왕입니다. 청년에게 기회가 없는 민주당을 완전히 바꾸겠습니다. 청년취업보장제를 핵심 정책으로 도입하고, 당 청년위원회가 청년 정책 결정권을 갖게 하겠습니다. 남녀 모두 단기 기초군사훈련을 받고 징병제를 단계적 모병제로 바꾸는 공약도 발표했습니다."],"quotes":[["정견발표문(7.20 최종)","불법당원, 유령당원, 신천지 당원 모두 정리하고, 경선 결과는 100% 공개하겠습니다"],["출마선언문(7.9 최종)","민주주의는 상대를 이기는 기술이 아닙니다. 더 나은 답을 찾는 과정입니다"],["김보미.com 공약집","5대 분야 25개 약속 — ①유리상자 경선 ②진짜 1인 1표 ③청년 결정권(청년 예산 10%·정책 오디션) ④미래 설계 정당(미래전략원·AI 대전환) ⑤성장 사다리 정당(풀뿌리 사다리·공정 경쟁 공천)"]],"notes":["신천지 관련은 '의혹이 사실이라면'이라는 조건부 유지 — 단정 금지 [자료 15]","스웨덴 알메달렌 참가(2026) 경험 — '잔디밭이든 주차장이든 모두 토론장, 누가 어느 편인지 대신 누가 더 좋은 정책인지 토론' 비유 활용 가능 [자료 7]"],"warn":"신천지 발언은 반드시 '의혹', '사실이라면' 조건부로. 뉴탐사가 파고들어도 '전수조사가 답'이라는 요구로 수렴.","media":"뉴탐사"},{"no":211,"label":"N11","part":5,"q":"민주당의 분열을 걱정하는 분들이 많습니다. 어떤 생각을 갖고 계신지요.","tags":["통합","정청래","이재명"],"script":["대통령께서 통합을 원하고 계시고, 누가 당선되든 새 대표도 통합을 내세울 겁니다. 지금은 당권을 두고 치열하게 경쟁해서 그렇지, 전당대회가 끝나면 다시 통합의 길로 간다고 봅니다.","다만 정청래 후보가 되면 사정이 달라질 수 있습니다. 지금까지 그랬던 것처럼 집권여당 대표가 야당 대표같이 사사건건 정부와 엇박자를 낸다면, 분열상이 심각해질 수 있습니다.","당권과 대권에만 빠져 허덕이는 정치가 아니라, 국가와 국민을 보고 하는 정치였으면 좋겠습니다. 저는 그 통합의 기준이 '공정'이라고 믿습니다. 규칙이 공정하면 경쟁은 축제가 되고, 규칙이 무너지면 경쟁은 분열이 됩니다."],"quotes":[["후보 답변 초안(원문)","당권과 대권에만 빠져 허덕이는 정치가 아니라 국가와 국민을 보고 정치를 했으면 좋겠습니다"]],"notes":[],"warn":"'소인배' 등 인격 표현은 방송에서 자제 — '당권과 대권에만 빠진 정치'로.","media":"뉴탐사"},{"no":300,"part":6,"media":"한겨레","label":"H0","q":"[첫인사] 인터뷰 시작 멘트 — 예시 3개 (오늘 예비경선 당원투표 시작 → 투표 독려 필수)","tags":["첫인사","오프닝","투표독려","예비경선","권리당원투표","고함사건"],"script":["【예시 1 · 기본형(투표 독려 프레임)】 안녕하세요, 김채운 기자님. 만 서른여섯 평당원 후보, 김보미입니다. 귀한 지면 내주셔서 감사합니다. 오늘부터 23일까지 당대표 예비경선 투표가 시작됐습니다. 권리당원 여러분께 이 자리를 빌려 꼭 부탁드리고 싶습니다. 이번 한 표가 민주당이 이대로 갈 것인지, 다시 태어날 것인지를 정합니다. 꼭 투표해 주십시오. 저는 오늘, 있는 그대로 다 말씀드리겠습니다. 편하게 물어봐 주십시오.","【예시 2 · 고함 사건 정면형 + 독려】 네, 김보미입니다. 반갑습니다. 오늘 아침 공개 석상에서 고함을 듣고 시작한 하루입니다만, 마음은 어느 때보다 단단합니다. 마침 오늘부터 예비경선 당원투표가 시작됐습니다. 왜 오늘 제가 겪은 일이 남의 일이 아닌지, 왜 이번 투표가 중요한지 — 그 이야기를 다 말씀드리겠습니다. 권리당원 여러분, 23일까지입니다. 청년의 목소리가 본선 무대에 오를 수 있을지, 여러분의 한 표에 달려 있습니다.","【예시 3 · 풀뿌리 겸손형 + 독려】 안녕하세요, 김보미입니다. 8년 동안 새벽 민원 전화로 하루를 열었던 지방의원이라, 전화 인터뷰가 오히려 제일 편합니다. 오늘부터 사흘간 예비경선 투표가 진행됩니다. 한겨레 독자 중에 계신 권리당원 여러분, 어떤 후보를 선택하시든 꼭 참여해 주십시오. 참여가 많아질수록 계파와 조직의 힘은 작아지고, 진짜 당원의 뜻이 커집니다. 그것이 제가 말하는 진짜 1인 1표의 시작입니다."],"quotes":[["당 선관위·보도(7.21)","예비경선 7.21~23 · 당대표 5→3인 압축 · 반영 비율: 중앙위원 35% + 권리당원 35% + 국민여론조사 30% · 결과 발표 7.23 국회 의원회관"],["활용 팁","세 예시 모두 '오늘부터 투표 시작 + 23일까지 + 참여 독려'를 반드시 포함 — 독려 문구는 특정 후보 지지 호소가 아니라 '참여' 호소로(기사화 안전)"]],"notes":["첫인사 3요소 유지: ①만 36세 평당원 ②감사 ③가감 없이 예고 — 여기에 ④투표 독려 추가","'참여가 많아질수록 계파의 힘은 작아진다'(예시 3)는 김보미 공정 서사와 자연 연결되는 독려 논리","유선 특성상 첫 문장에 이름 또렷하게"],"warn":"독려 멘트에서 '저를 찍어달라'로 들리는 직접 호소는 기사 인용 시 역풍 가능 — '꼭 투표해 달라, 청년이 본선에 갈지는 여러분 손에'까지만."},{"no":301,"part":6,"q":"정견발표에서 \"화염병과 짱돌로 싸운 분들이 아직도 주축이다. 686이 786, 886까지 갈 게 아니라 이제 멋진 이별을 준비해야 할 때\"라고 해 화제가 됐다. 왜 지금 민주당에 세대교체가 시급한가.","tags":["세대교체","고함사건","대전환","86용퇴","화염병짱돌","내로남불","송영길"],"script":["왜 지금이냐고요. 오늘 아침에 있었던 일부터 말씀드리겠습니다. 오늘 서울시의회 의장실 접견 자리, 의장님과 의원님들, 의회사무과 직원들까지 계신 공개된 자리에서 송영길 후보께서 저에게 고함을 지르셨습니다. 제가 지적한 것은 하나였습니다. 왜 청년과 686에게 절차를 다르게 적용하느냐. 청년 박지현은 서류 접수조차 거부해 놓고, 686은 면접이 시작된 다음에 절차를 무시하고 자격이 안 되는 분에게 자격을 만들어 주느냐. 그 '과정의 불공정'을 지적했더니 돌아온 것은 '내가 뭘 잘못했느냐, 내가 탄압받고 살아왔는데'라는 고함이었습니다. 세대교체가 왜 시급하냐고요. 바로 이 장면이 답입니다. 공정을 물으면 훈장이 돌아오는 정당, 이것이 지금의 민주당입니다.","오해는 마십시오. 저는 김민석·정청래·송영길 선배님들을 진심으로 존경합니다. 독재에 맞선 그 용기가 오늘의 민주주의를 만들었습니다. 저는 선배님들의 시대를 끝내자는 것이 아니라 다음 세대로 이어가자는 것입니다. 그런데 지금 민주당은 반성을 잃었습니다. '우리가 국민의 마음을 잘못 읽은 것은 아닐까'라는 질문이 사라졌고, 질문보다 확신이 많고, 경청은 없고 연설만 있습니다. 실력보다 의리, 정책보다 인맥, 원칙보다 예외 — 그렇게 내로남불이 탄생했습니다.","그래서 저는 '개혁' 정도로는 안 된다고 봅니다. 거의 대전환 수준이어야 합니다. 586 기득권은 물러나고, 청년과 미래세대, 전문가 중심으로 당을 새로 짜야 합니다. AI 3대 강국에 진입해야 할 대한민국에서 화염병과 짱돌 들고 싸우던 세대가 아직도 당의 주인입니다. 686이 786, 886까지 가면 민주당은 망합니다.","민주주의는 권력을 얻는 것으로 끝나지 않습니다. 권력을 다음 세대에게 넘겨줄 때 완성됩니다. 독재에 맞섰던 그 용기를 이제는 권력을 내려놓는 용기로 완성해 주십시오. 가장 위대한 계승, 가장 아름다운 퇴장을 저 김보미가 준비해 드리겠습니다."],"quotes":[["박동완 통화 원워딩(7.21 12:38)","오늘 아침에 있었던 일 알고 계세요? 송영길이 저한테 막 고함을 지르더라고요. 왜 절차를 다르게 적용하냐, 왜 청년들한테 예외를 안 주고 686들은 절차도 무시하고 면접 시작한 다음에 자격이 안 되는 사람에게 자격을 주게 하냐고 지적을 했는데 '내가 뭘 잘못했나 내가 탄압받아 살았는데' — 거기서부터 얘기를 시작하세요"],["박동완 통화 원워딩(7.21 12:38)","거의 대전환 수준으로 586 기득권들 싹 다 물러나야 되고 청년 중심으로, 미래 세대 중심으로, 전문가 중심으로 짜야 된다"],["7.20 합동연설회 연설문(최종)","686이 786, 886까지 가면 민주당은 망합니다. 686은 아름답게 퇴장하고 청년들이 민주당을 이끌어야 합니다"],["7.21 서울시의회 정견발표","권력을 다음 세대에게 넘겨줄 때 완성됩니다 … 가장 위대한 계승, 가장 아름다운 퇴장을, 김보미가 준비해 드리겠습니다"],["새 성명(7.21) '물러나야 민주당이 산다'","운동권 경력은 장기집권 면허증이 아닙니다 … 산업화 세대가 민주화 세대에게 권력을 넘겼듯, 이제 민주화 세대가 AI 세대에 권력을 넘겨야 합니다. 박수 칠 때 떠나라"]],"notes":["통화 지시(7.21): 반드시 오늘 고함 사건에서 시작 → 존경·계승 → 대전환 순서","'대전환'은 이번 인터뷰 핵심 키워드 — 각 답변에서 최소 1회 반복","내로남불 3연은 정견발표 원문 그대로 인용 가능"],"warn":"고함 사건 서술은 사실관계(장소·배석자·발언)만 — 감정 표현은 '황당했다' 수준까지. '꼰대'는 7.21 통화 기조에 따라 고함 사건·청년 문맥에서 사용 가능하나, 자기 규정이 아니라 '청년들이 그렇게 부른다' 화법 병행 권장.","media":"한겨레","label":"H1"},{"no":302,"part":6,"q":"전당대회 기탁금이 인상됐다가 오늘(21일) 당 선관위가 당대표 8,000만원·최고위원 3,000만원으로 감액을 결정했다. 청년최고위원제는 부결됐다. 어떻게 평가하나. 실제로 당에 청년을 유입시키기 위해 어떤 제도적 장치가 필요한가.","tags":["기탁금","기탁금감액","투개표비용","원상복귀","청년최고위원","공영제","청년","들러리","계파"],"script":["오늘 감액 결정부터 말씀드리겠습니다. 여론에 떠밀린 사후 땜질입니다. 물론 안 내리는 것보다는 낫습니다. 그러나 세 가지를 지적하지 않을 수 없습니다. 첫째, 원상복귀가 아닙니다. 대통령께서 '종전 수준으로 되돌리라'고까지 말씀하셨는데, 당대표 8,000만 원·최고위원 3,000만 원은 이재명 대표 시절인 2024년의 4,000만 원·1,500만 원의 정확히 두 배입니다. 절반만 내려놓고 생색을 내는 것입니다. 둘째, 순서가 틀렸습니다. 후보 등록은 이미 지난주에 끝났습니다. 저는 그 기탁금이 없어서 등록 당일 다섯 군데에서 빌렸습니다. 문턱에 걸려 아예 출마를 포기한 청년은 누가 책임집니까. 셋째, 선관위는 '투개표 비용은 후보자가 부담하는 게 맞다'고 합니다. 저는 정반대로 생각합니다. 투개표는 정당 민주주의의 기본 비용입니다. 그 비용을 후보 개인의 지갑에 떠넘기는 순간, 돈 있는 사람만 출마할 수 있는 정당이 됩니다. 비용 분담이 기준이라면 기탁금은 한도 끝도 없이 올라갑니다. 그래서 답은 감액이 아니라 당직선거 공영제입니다.","이 소동 전체가 보여주는 것이 있습니다. 지금 686 세 분 후보가 청년 공약을 쏟아내고 계시지만, 솔직히 저는 하나도 믿지 않습니다. 지금 당이 하는 것을 보십시오. 청년최고위원제는 부결시키지 않았습니까. 기탁금은 올렸다가 대통령이 나서니까 그제서야 절반만 내리지 않았습니까. 왜 청년과 686에게 기준을 다르게 적용하느냐고 물었더니 돌아온 것은 고함이었습니다. 그런 분들이 내놓는 '2030과 함께하겠다'는 말을 어떻게 믿습니까. 지금까지 입으로는 계속 그렇게 해 왔습니다. 그러나 실제로는 청년들을 이용만 하고 들러리만 세웠습니다. 전준위가 전원일치로 올린 청년최고위원 안을 최고위가 부결시킨 것, 그것이 이 당의 진심입니다.","청년이 민주당을 떠난 것이 아닙니다. 민주당이 먼저 청년을 떠난 것입니다.","제도는 명확합니다. 핵심은 '사진 말고 권한'입니다. 첫째, 당직선거 공영제 — 기탁금 장벽 자체를 없애고 당이 선거 비용을 책임지게 하겠습니다. 이재명 대통령이 당대표 시절 도입하려던 것을 제가 완성하겠습니다. 둘째, 청년최고위원제 — 당대표 취임 당일 1호 안건으로 발의해 30일 안에 개정을 완료하겠다고 이미 문서로 약속했고, 임명직 최고위원 두 자리는 전부 청년으로 임명하겠습니다. 셋째, 청년 관련 정책은 당 청년위원회가 결정권을 갖게 하고 청년 예산 10%를 보장하겠습니다. 넷째, 청년취업보장제를 당의 핵심 정책으로 도입하고 풀뿌리부터 크는 공정 경쟁 공천 사다리를 만들겠습니다. 이 정도는 해야 '대전환'입니다."],"quotes":[["당 선관위 발표(7.21, 임호선 부위원장)","당대표 후보 8천만원, 최고위원 후보 3천만원으로 확정 — 과도하게 부담된다는 지적이 있어 2020~2022년 전당대회 기준으로 정했다 / 청년(및 원외 장애인) 후보 50% 감면 → 청년 최고위원 2,500만→1,500만원 / '투개표 비용은 후보자가 부담하는 게 맞다'"],["박동완 통화 원워딩(7.21 12:38)","686 세 분이 청년 공약을 막 내놓고 있는데 하나도 안 믿는다. 지금 당이 하는 거 봐라. 청년최고위원 부결시키지 않았냐, 기탁금 올리지 않았냐. 기준을 다르게 적용하냐고 했더니 그냥 고함지르지 않냐. 입으로는 그렇게 했다. 근데 청년들 이용만 하고 들러리만 세웠다 — 그런 얘기를 꼭 해야죠"],["7.20 합동연설회 연설문(최종)","기탁금이라도 줄여 놓았더니 오히려 더 올려버렸습니다. 오죽하면 대통령이 나서서 기탁금 깎아주자고 이야기했겠습니까 … 당직선거 공영제, 저 김보미가 반드시 실현하겠습니다"],["캠프 확정 멘트","청년이 민주당을 떠난 것이 아닙니다. 민주당이 먼저 청년을 떠난 것입니다 / 사진 말고 권한"],["문진석 의원(서울경제 7.20)","전대 기탁금, 비용 분담이 기준이면 10억도 부족 — '투개표 비용 후보 부담' 논리 반박에 원용 가능"]],"notes":["수치 확정(7.21 당 중앙당선관위): 당대표 1억→8,000만 / 최고위원 5,000만→3,000만 / 청년 50% 감면 유지(청년 최고위원 2,500만→1,500만) / 원외 장애인 50% 감면 신규 [파이낸셜뉴스 7.21]","비교 기준: 2024 이재명 대표 시절 당대표 4,000만·최고위원 1,500만 — '여전히 두 배, 원상복귀 아님'이 핵심 반박","프레임: 감액 자체 폄하보다 '사후 땜질·순서·구조(공영제)' 3단 논리 — 대통령 주문과 같은 방향임을 부각","'취임 당일 1호 안건·30일 내 개정'은 청년최고위원 공개질의 답변서(7.13) 문서 근거"],"warn":"'당무개입' 프레임으로 이어지면: '대통령 말씀은 당연한 것, 그 당연한 말을 대통령이 해야 할 만큼 지도부가 거꾸로 간 게 문제' 기조 유지. 감액 결정 자체를 조롱하는 톤 금지 — '낫지만 부족하다'.","media":"한겨레","label":"H2"},{"no":303,"part":6,"q":"지난 지방선거를 예시로 당의 '불공정 경선' 구조를 핵심 개혁 과제로 들고 나왔다. 당대표가 되면 현행 1인1표제와 경선 구조를 어떻게 바꾸고 싶은가.","tags":["1인1표","가짜1인1표","유령당원","강진공천","유리상자","선호투표","득표수공개"],"script":["핵심부터 말씀드리겠습니다. 지금의 1인1표, 당원주권은 전부 가짜입니다. 686이 기득권을 유지하기 위해 내세우는 명분일 뿐입니다. 유령당원이 천지인데, 당원 명부를 정리하라고 해도 정리하지 않습니다. 오염된 명부 위에서 하는 투표가 무슨 1인1표입니까.","저는 이것을 이론이 아니라 몸으로 겪었습니다. 지난 강진군수 경선에서 저에게는 당헌·당규에도 없는 새 지침을 만들어 기어이 15퍼센트를 감산했습니다. 전과가 다섯 개 있는 상대 후보는 감산 하나 없이 공천을 받았고, 결과는 무소속에게 참패였습니다. 그리고 저는 제가 몇 표를 얻었는지 아직도 모릅니다. 선거인 수도 득표수도 공개하지 않았기 때문입니다. 전 세계 민주주의 국가에서, 후보가 자기 득표수도 모르는 선거를 하는 정당이 민주당 말고 어디에 있습니까.","당대표가 되면 세 가지를 바꾸겠습니다. 첫째, 명부부터 정리하겠습니다. 불법 당원·유령 당원·대리 당원 전수조사입니다. 특정 후보 지원을 위한 조직적 유입 의혹까지 나온 마당에, 모두 솎아내고 실명·거주 인증으로 '진짜 1인1표'를 만들겠습니다. 둘째, 싹 다 공개하겠습니다. '유리상자 경선' — 경선 룰은 6개월 전에 확정해 동결하고, 결과는 100% 공개합니다. 제 1호 공약이 경선 데이터 전면 공개입니다. 선호투표제 도입은 환영합니다만, 순위별 득표 데이터 전면 공개로 완성해야 합니다. 셋째, 공천은 충성도가 아니라 실력과 전문성으로, 당원과 주민이 결정하는 상향식으로 바꾸겠습니다. 밀실 공천과 깜깜이 경선을 끝내는 것, 그것이 대전환의 출발입니다."],"quotes":[["박동완 통화 원워딩(7.21 12:38)","가짜 1인 1표다. 핵심 문장은 — 1인 1표, 당원주권 전부 가짜인데 이거는 686이 기득권을 유지하기 위해서 내세우는 명분일 뿐이다. 유령당원이 천지로 있고 명부 정리하라고 해도 정리도 안 한다. 명단부터 정리해야 되고 그다음에 싹 다 공개해야 되고"],["박동완 통화 원워딩(7.21 12:38)","전 세계 민주주의 국가에서 자기가 몇 표 얻었는지도 모르는 선거를 하는 나라가 민주당밖에 더 있냐 — 그게 또 핵심 문장입니다"],["7.20 합동연설회 연설문(최종)","당헌·당규에도 없는 새 지침을 만들어 기어이 15퍼센트를 감산했습니다. 전과가 다섯 개나 있는 상대후보는 감산을 하나도 하지 않고 공천을 줬습니다 … 이건 가짜 1인1표입니다"],["캠프 확정 멘트","저는 제가 몇 표를 얻었는지 아직도 모릅니다 → 1호 공약 '경선 데이터 전면 공개'"],["호남 정견발표/성명(7.18~7.21) 원문","이름도 밝히지 않고 숫자 3개만 보여줍니다. 조작을 했는지 안 했는지 알 길이 없고, 이의를 제기하면 '제명하겠다'는 협박이 들어옵니다"]],"notes":["답변 뼈대는 통화 지시 그대로: 가짜 1인1표 규정 → 유령당원·명부 → 강진 실증 → 명부 정리·전면 공개","강진 15% 감산·전과 5개는 사실관계 자료를 손에 들고 말할 것(법적 리스크)","신천지 의혹은 '의혹이 사실이라면' 조건부 화법 유지"],"warn":"유령당원·신천지 관련 특정인 단정 금지 — '전수조사 요구'까지만.","media":"한겨레","label":"H3"},{"no":304,"part":6,"q":"민주당이 송영길·김용 후보의 출마 자격을 예외적으로 인정한 것을 두고 공정성 논란이 제기됐다. 민주당이 원칙을 스스로 훼손한 것 아니냐는 비판도 있는데 어떻게 보나.","tags":["송영길김용","박지현","공정","고함사건","가처분","레드카드"],"script":["원칙을 스스로 훼손한 것이 맞습니다. 기준은 하나여야 합니다. 청년 박지현은 4년 전 서류 접수조차 거부당했습니다. 686 송영길은 밤 10시 반 긴급 최고위로 구제됐습니다. 왜 청년과 686에게 절차를 다르게 적용합니까. 청년 박지현은 안 되고 686 송영길은 됩니까. 이게 공정입니까.","분명히 하고 싶은 것은, 저는 송영길 후보가 잘난 사람인지 못난 사람인지를 지적한 것이 아니라는 점입니다. 손흥민 선수라도 반칙을 하면 레드카드를 받습니다. 입사 면접이 한창 진행되는 중에 특정 면접자에 맞추어 자격 요건을 바꾸는 것 — 제가 지적한 것은 사람이 아니라 그 '과정의 불공정'입니다. 자격 요건이 안 되면 후보 등록 전에 미리 당무위를 열어 논의를 요청하는 것이 순서 아닙니까. 규칙보다 사람이 우선하는 순간 민주주의는 무너집니다. 당헌 위반이 강행된다면 가처분을 포함해 대응할 것입니다.","이 문제를 지적한 대가가 오늘 아침의 고함이었습니다. 다른 분들도 계시니 별도로 전화로 말씀 나누자고 정중히 부탁드렸지만 호통은 멈추지 않았습니다. '내가 검찰개혁을 외치다 이렇게 고생했는데', '나 이런 사람이야' — 공정을 물었더니 훈장을 꺼내신 것입니다. 그래서 저는 정견발표에서 공개적으로 사과를 요청드렸습니다. 공개적으로 고함치셨으니 공개적으로 사과를 요구한 것입니다. 그러나 끝끝내 사과는 없었습니다. 섭섭하실 수는 있습니다. 그러나 여러 사람 앞에서 고함치며 윽박지르는 것은 인격무시 행위입니다. 저도 당대표 후보입니다. 존중해 주시기 바랍니다."],"quotes":[["박동완 통화 원워딩(7.21 12:38)","왜 절차를 다르게 적용하냐, 왜 청년들한테 예외를 안 주고 686들은 절차도 무시하고 면접 시작한 다음에 자격이 안 되는 사람에게 자격을 주게 하냐"],["박지현·송영길 성명(7.17)","청년 박지현은 안되고, 686 송영길은 됩니까? 이게 공정입니까?"],["페이스북(7.21)","손흥민 선수라도 반칙을 하면 레드카드를 받습니다 … 공개적으로 고함치셨으니, 저도 공개적으로 사과를 요구한 것입니다"],["7.14 국회 소통관 기자회견","당헌 25조 5항 위반·특례 부칙 — 3대 요구, 가처분 예고"]],"notes":["고함 사건 상세는 H1에서 먼저 나왔으면 여기서는 '아까 말씀드린 그 고함이 바로 이 문제를 지적한 대가였다'로 연결","'복당은 신규 입당과 달라 비교 무리' 반론 대비: '같지 않고 더 심각 — 룰 확정 후 맞춤형 개정'(7.18 대책회의)"],"warn":"송영길 개인 인신 비난 금지 — 행위(규칙 변경·고함)만. '뻔뻔함'은 페이스북 게시글 인용 형태로만.","media":"한겨레","label":"H4"},{"no":305,"part":6,"q":"이번 전당대회는 '적통 논쟁', '자기 정치' 등 계파 갈등이 주요 이슈가 되고 있다. 국민들은 민생보다 '누가 대통령과 더 가까운가'를 두고 경쟁하는 모습으로 비칠 수 있다는 지적도 나온다. 이번 전당대회 경쟁 양상을 어떻게 평가하나.","tags":["적통논쟁","계파","친명친청","김민석","흥신소정치","싱어게인","재집권","족보","무당파"],"script":["지금 전당대회가 친명과 친청의 대결로 가고 있습니다. 바람직하지 않습니다. 싸우려면 과거냐 미래냐를 가지고 싸워야지, 적통 논쟁, 누가 대통령과 더 가깝냐, 묘소에 갔냐 안 갔냐를 가지고 싸우는 것이 말이 됩니까. 국민의 삶은 벼랑 끝인데 말입니다.","김민석 후보께는 아쉬움을 말씀드리고 싶습니다. 저는 김민석 후보가 적어도 친명·친청 논쟁에 휘말리지 않고 선거를 치르실 줄 알았습니다. 민주당은 그렇게 하지 않으면 미래가 없기 때문입니다. 그런데 스스로를 자꾸 '친명 후보'로 위상을 축소하시는 것 같아 안타깝습니다.","저 자신이 그 계파 정치의 피해자입니다. 계파에 낄 틈조차 주지 않았던 저를, 이제 와서 온갖 상상으로 계파에 소속시켜 주십니다. 그간의 상처가 떠올라 쓰립니다. 청년에게 계파가 어디 있습니까. 대한민국의 모든 청년은 계파가 없습니다. 18~29세의 절반 가까이가 무당파입니다. 기득권이 장벽을 쳐놓고 청년들은 오지 말라고 해놓고, 이제 와서 '누구 라인이냐'를 따지는 것 자체가 계파 정치입니다. 정치 13년째에 있지도 않은 족보를 발급받아 보기는 처음입니다. 사진 한 장으로 계파를 판정하는 것 — 저는 이것을 '흥신소 정치'라고 부릅니다. 저를 계파 어디에 넣을지 고민하지 마시고, 부디 제 공약을 검증해 주십시오. 저는 계파에 줄 선 적 없습니다. 국민께 줄 서서 여기까지 왔습니다.","적통이 혈통입니까, 인맥입니까. 민주당의 적통은 계란으로 바위를 쳤던 김대중·노무현의 도전 정신입니다. 저는 그 도전의 적통을 잇겠습니다. 정견발표에서 선배 후보들께 드린 말씀 그대로입니다. 그만 싸우십시오. 힘을 합쳐야 다음 대선에서 이깁니다. 재집권에 실패한다면 다시 계엄입니다. 전당대회는 비전과 실력으로 경쟁해 국민께 '이 후보도 저 후보도 훌륭하다'는 기분 좋은 고민을 드리는, 승자도 패자도 함께 빛나는 싱어게인 같은 자리여야 합니다. 끝까지 살아남아, 쫄지 않고 여러분의 목소리를 전달하겠습니다."],"quotes":[["박동완 통화 원워딩(7.21 12:38)","친명과 친청의 대결로 가고 있다. 바람직하지 않다. 과거냐 미래냐를 가지고 싸워야지, 적통 논쟁·누가 친하냐·묘소 갔냐 안 갔냐 가지고 싸우는 게 말이 되냐"],["박동완 통화 원워딩(7.21 12:38)","나는 김민석 후보가 적어도 친청·친명 논쟁에 휘말리지 않고 선거를 할 줄 알았다. 민주당은 그렇게 하지 않으면 미래가 없기 때문인데, 자기를 자꾸 친명 후보로 위상을 축소하는 것 같다"],["페이스북 '흥신소 정치' 게시글(후보 등록 직후·전문)","계파에 낄 틈조차 주지 않았던 저를, 이제 와서 온갖 상상으로 계파에 소속시켜 주십니다. 그간의 상처가 떠올라 쓰립니다. 청년에게 계파가 어디 있습니까? 대한민국의 모든 청년은 계파가 없습니다. 18~29세의 절반 가까이가 무당파입니다. 기득권이 장벽을 쳐놓고 청년들은 오지 말라고 해놓고, 이제 와서 누구 라인이냐를 따지는 것 자체가 계파 정치입니다. 대한민국과 민주당을 말아먹은 것이 계파 정치입니다. 저를 계파 어디에 넣을지 고민하지 마시고, 부디 제 공약을 검증해주십시오. 정치를 시작한 지 13년째, 있지도 않은 족보를 발급받아 보기는 처음이라 놀랍습니다. 지난 의장 시절, 영장도 없이 차량을 털리고, 수개월 경찰조사 끝에 무혐의를 받고도 허위사실을 게재한 언론에 조리돌림당하며 억울해서 죽고 싶었을 때의 심정과 똑같습니다. 그래서 더욱, 후보 등록을 해야겠다고 생각했습니다. 저는 계파에 줄 선 적 없습니다. 국민께 줄 서서 여기까지 왔습니다. 끝까지 살아남아 목소리를 내겠습니다. 지금까지 그랬듯, 쫄지 않고 여러분의 목소리를 전달하겠습니다."],["7.21 서울시의회 정견발표","그만 싸우십시오. 친석 친청이니 나눌 때가 아닙니다. 힘을 합쳐야 다음 대선에서 이깁니다. 재집권에 실패한다면 다시 계엄입니다"],["새 성명(7.21) '무엇을 위해 다투는가'","원조라는 글자가 안 들어간 가게가 없는 신당동 떡볶이골목이 생각납니다. 내가 김대중과 친했다, 니가 노무현을 배신하지 않았냐 … 언제까지 이런 족보 정치를 계속할 겁니까. 청년들은 686 삼인방의 족보에 아무 관심이 없습니다"]],"notes":["김민석 비판은 통화 지시 수위 그대로 '아쉬움' 톤 — 공격이 아니라 기대와 실망 프레임","이해찬 전 총리 배우자 후원회장 건: '고인은 당의 큰 어른, 유족의 선택은 존중' 먼저","'족보 발급' 대목은 웃음기 없이 — 의장 시절 표적 수사(전 건 무혐의·손배 승소) 서사와 연결하면 '검증된 억울함'으로 힘이 실림","무당파 수치(18~29세 절반)는 페이스북 게시글 근거 그대로 사용"],"warn":"'자기 정치' 비판이 본인에게 오면: '나는 누구를 위해 나온 후보가 아니다 — 청년의 목소리를 가감 없이 대변하러 나왔다'.","media":"한겨레","label":"H5"},{"no":306,"part":6,"q":"차기 여당의 당대표는 어떤 역할을 해야 한다고 보나.","tags":["이재명","재집권","젊은정당","임명직최고위원","AI","기후위기","3대메가프로젝트","지방의원"],"script":["차기 여당 당대표의 제1 임무는 이재명 정부를 성공시키고 재집권의 토대를 만드는 것입니다. 다만 방법이 중요합니다. 박수만 치는 여당은 대통령을 고립시키고, 할 말 하는 여당이 대통령을 성공시킵니다. 과거에 발목 잡힌 정당이 아니라, 미래 의제를 대통령보다 한발 앞서 준비하는 정당이어야 합니다.","첫째, 당을 젊은 정당으로 바꿔야 합니다. 청년이 실제로 결정권을 행사하게 해야 합니다. 저는 당대표가 되면 임명직 최고위원 두 자리를 전부 청년으로 임명하겠습니다. 청년 관련 정책은 당 청년위원회가 결정하도록 하겠습니다. 이것이 말이 아닌 권한의 세대교체입니다.","둘째, 미래 아젠다의 주도자여야 합니다. AI 대전환, 기후위기, 반도체 — 이재명 대통령의 3대 메가프로젝트와 호남 반도체 800조 투자를 당이 온몸으로 뒷받침해 성공시켜야 합니다. 과거의 훈장이 아니라 미래의 설계도를 가진 정당으로 바꾸는 것이 당대표의 일입니다.","셋째, 공정한 룰의 관리자입니다. 다음 총선 공천이 차기 당대표 손에 있습니다. 경선 룰 6개월 전 확정, 결과 전면 공개, 상향식 공천 — 룰을 세우고 예외를 만들지 않아야 총선을 이깁니다. 넷째, 현장과 중앙을 잇는 다리입니다. 지방의원은 동원의 대상이 아니라 당의 주인입니다. 당 최고 의사결정 단위에 지방의원 몫을 보장하고, 서울시의회를 비롯한 지방의회의 입법 과제를 당론으로 뒷받침하겠습니다. 8년 지방의원의 삶을 산 제가 그 다리가 되겠습니다."],"quotes":[["박동완 통화 원워딩(7.21 12:38)","당을 젊은 정당으로 바꿔야 된다. 청년들이 결정권을 행사할 수 있도록 해야 된다. 나는 임명직 최고위원 두 명 전부 청년으로 앉힐 생각이다. 청년 관련 정책은 당 청년위원회가 결정하도록 할 생각이다"],["박동완 통화 원워딩(7.21 12:38)","AI나 기후 위기라든지 미래 아젠다 — 반도체니 3대 메가 프로젝트 뒷받침해야 되고, 미래 의제를 대통령보다 앞서서 해야 된다"],["캠프 확정 멘트","대통령을 가장 잘 돕는 당대표 / 박수만 치는 여당은 대통령을 고립시키고, 할 말 하는 여당이 대통령을 성공시킵니다"],["7.21 서울시의회 정견발표","지방의원은 동원의 대상이 아니라 당의 주인입니다 … 현장의 목소리가 국회와 정부에 곧바로 닿도록 제가 다리가 되겠습니다"]],"notes":["'임명직 최고위원 2석 전원 청년'은 7.21 통화 확정 신규 공약 — 이번 인터뷰에서 처음 공개하는 뉴스포인트로 활용 가능","유시민 '필연적 실패' 논쟁으로 이어지면: '실패를 예언하러 나온 사람이 아니라 성공시키러 나온 사람'"],"warn":null,"media":"한겨레","label":"H6"},{"no":307,"part":6,"q":"왜 다른 사람이 아닌 김보미가 당대표가 돼야 하는가.","tags":["유일한후보","계파없음","신세진사람","의정성과","노무현2%","계란과바위","청년정당"],"script":["다른 후보들도 모두 청년 정책을 말합니다. 그런데 하나도 실현되지 않고 있습니다. 수십 년 동안 당의 주인이었으면서 지금까지도 안 해 놓고, 이제 와서 하겠다는 것이 말이 됩니까. 청년 정당은 청년이 만들 수 있습니다. 벼랑 끝 청년의 삶을 직접 살아 본 사람이 만들 수 있습니다.","그리고 이것을 꼭 말씀드리고 싶습니다. 신세 진 사람, 챙겨줄 사람이 너무 많은 사람은 절대 개혁을 못 합니다. 측근을 챙겨줘야 하는데 청년최고위원에게 줄 자리가 어디 있겠습니까. 민주당의 모든 문제는 실력보다 의리와 인맥을 앞세우는 데서 나옵니다. 신세 진 사람, 챙겨야 할 사람이 많으니 불공정과 반민주가 당헌이 되고 만 것입니다. 저 김보미는 챙겨줄 사람도, 신세 진 사람도 없습니다. 그래서 거침없이, 눈치 보지 않고 개혁할 수 있는 유일한 후보입니다.","저는 유일한 풀뿌리 평당원 후보이고, 686은 모르는 보통 국민의 삶을 사는 유일한 후보이기도 합니다. 정치 13년, 의정 8년, 전국 최연소 기초의회 의장. 말이 아니라 결과로 증명했습니다. 업무추진비 전면 공개, 사상 최초 일문일답 군정질문, 역대 최대 108억 원 낭비예산 삭감, 전남 최초 육아양육수당, 8년 연속 의정활동비 전액 기탁. 표적 징계와 100여 건의 허위 보도를 겪었지만 수사는 전 건 혐의없음으로 종결됐고 손해배상 소송에서 승소했습니다.","첫 여론조사 2%로 시작했습니다. 2002년 노무현 후보의 경선 초기 지지율도 바로 2%였습니다. 2%는 절망의 숫자가 아니라 희망이 출발하는 숫자입니다. 저는 약한 계란입니다. 그러나 계란은 생명을 품고 있습니다. 끝까지 바위를 두드려 결국 금을 내겠습니다."],"quotes":[["박동완 통화 원워딩(7.21 12:38)","본인이, 청년이 청년 정당을 만들 수 있다. 지금까지도 안 해 놓고 이제서 하겠다는 게 말이 되냐"],["박동완 통화 원워딩(7.21 12:38)","신세 진 사람이 너무 많아서 챙겨 줄 사람이 너무 많은 사람들은 절대 개혁을 못 한다. 자기 측근 챙겨 줘야 되는데 청년 최고위원한테 줄 자리가 어디 있냐. 김보미는 챙겨 줄 사람도 없고 신세 진 사람도 없다 → 거침없이, 눈치 보지 않고 개혁을 할 수 있다"],["7.20 합동연설회 연설문(최종)","신세 진 사람, 챙겨야 할 사람이 많으니 불공정과 반민주가 당헌이 되고 말았습니다. 686 세 후보로는 개혁이 안 됩니다"],["게시글(7.19)","2002년 노무현 후보의 초기 지지율이 몇 %였는지 기억하십니까? 바로 2%였습니다"],["캠프 확정 멘트(클로징)","저는 약한 계란입니다. 계란은 생명을 품고 있습니다. 끝까지 바위를 두드려 결국 금을 내겠습니다"]],"notes":["통화 금지 지시: '나밖에, 나 혼자밖에 없다' 식 고립·자만 표현 금지 — '유일한 후보' 프레임까지만","숫자 3종: 2% / 108억 / 13년·8년 · 나이는 '만 36세' 통일","마무리 어깨걸이 가능: '자세한 건 김보미닷컴에…'"],"warn":null,"media":"한겨레","label":"H7"},{"no":308,"part":6,"q":"현행 예비경선 컷오프 제도에 대해 어떻게 평가하나. 만약 최종 3인에 들지 못한다면 당에서 구체적으로 어떤 역할을 할 생각인가.","tags":["컷오프","선호투표","대전환","완주","승복","세대교체","중꺾마"],"script":["다섯 명밖에 출마하지 않았는데 왜 컷오프를 합니까. 당헌에도 컷오프를 '할 수 있다'고 되어 있지, 반드시 3명으로 잘라야 한다고 되어 있지 않습니다. 게다가 선호투표제를 도입했으면 표가 갈릴 걱정도 없는데 왜 자릅니까. 결국 청년에게는 마이크를 쥐여주지 않겠다는 것 아닙니까. 청년 정치를 하겠다면서 청년을 출발선에도 세우지 않겠다는 것입니다. 그래서 저는 컷오프 폐기, 다섯 후보 모두 본선행을 요구하며 서명운동까지 벌였습니다.","백보 양보해 컷오프를 하더라도 방식이 이래서는 안 됩니다. 후보가 10명씩 나와서 추린다면 최소 2~3주는 선거운동을 보장해야 합니다. 그런데 달랑 동영상 하나 찍어 연설이라 하고, 당원들 앞 대면 연설 한 번, 토론회 한 번 없이 자릅니다. 이런 식의 경선으로는 민주당에 청년이 설 자리가 없습니다. 그러면 2030은 다 떠나고, 총선도 대선도 반드시 집니다. 이것부터 뜯어고쳐야 합니다.","3인에 들지 못한다면 어떻게 할 것이냐. 저는 꼭 본선에 가겠습니다. 686끼리 하는 경선이 당원들께 무슨 감동이 있겠습니까. 청년 한 명은 세워야 한다고, 당원들께서 김보미를 본선에 보내주실 것으로 믿습니다. 그러나 만약 아쉽게 탈락한다면, 제가 무엇을 할지는 분명합니다. 끝까지 세대교체를 위해 온몸을 바치겠습니다. 민주당이 586 꼰대 정당이라는 소리를 듣는 정당에서, 공정과 청년과 미래가 있는 정당으로 — 대전환 수준으로 다시 태어날 때까지 싸우겠습니다.","저는 이미 그렇게 살아왔습니다. 강진군수 경선에서 떨어졌을 때도 결과에 승복하고, 선거 때 약속한 공약을 모른 척하지 않고 지역에서 하나하나 실천했습니다. 이번에도 마찬가지입니다. 구체적으로 세 가지입니다. 첫째, 유리상자 경선·당원 명부 전수조사·경선 데이터 전면 공개가 당헌·당규에 반영될 때까지 당 안에서 계속 요구하겠습니다. 둘째, 당내 부당지시·입틀막 제보센터처럼 평당원·청년·지방의원의 목소리를 조직하고 방패가 되겠습니다. 셋째, 저를 지지해 주신 당원·국민들과 함께 다음 청년이 도전할 길을 닦겠습니다. 중요한 것은 꺾이지 않는 마음입니다."],"quotes":[["박동완 통화 원워딩(7.21 12:38)","5명밖에 출마 안 했는데 왜 컷오프를 합니까. 청년들한테는 마이크를 쥐어 주지 않겠다는 것 아니냐. 당헌에도 '할 수 있다'고 되어 있지 3명으로 잘라야 된다고 되어 있지 않습니다. 컷오프를 하려면 최소한 2~3주는 선거운동을 보장해 줘야지, 달랑 동영상 하나 찍고 연설이랍시고, 토론회 한 번·대면 연설 한 번 없는 경선이 말이 되냐. 2030 다 떠날 거고 총선 대선 반드시 진다"],["박동완 통화 원워딩(7.21 12:38)","끝까지 세대교체를 위해서 온몸을 바칠 겁니다. 꼰대 정당에서 공정과 청년과 미래가 있는 정당으로 대전환 수준으로 바뀔 때까지 — '대전환'이라는 말을 써야 돼요. 군수 경선에서는 떨어졌지만 약속한 것을 하고 있다, 마찬가지다. 만약에 아쉽게 탈락한다면 이렇게 이렇게 할 생각이다, 이렇게 해야죠"],["긴급 서명운동(김보미.com)","①최고위원회 해체 ②밀실 컷오프 폐기 — 다섯 후보 모두 본선으로 ③청년최고위원제 도입"],["김보미는(홈페이지·2026 승복)","경선 결과를 겸허히 받아들입니다 — 억울함을 삼키고 당 후보들의 본선 승리를 도왔습니다"]],"notes":["통화 지시: 탈락 시 답변은 '추상적 계란-바위'로 끝내지 말고, 앞으로 무슨 활동을 할지 예상 가능하게 구체적으로 — 대전환 키워드 필수","일정 확정: 예비경선 투표 7.21~23(당대표: 중앙위원 35%·권리당원 35%·국민여론조사 30%), 결과 발표 7.23 — 인터뷰 시점(21일 14:00)엔 결과 없음. '지금 투표가 진행 중입니다. 권리당원 여러분께서 판단해 주실 것'으로 받기","가처분은 '당헌 위반 강행 시' 조건부 표현 유지"],"warn":"'탈락 전제' 유도에 말리지 말 것 — '꼭 본선에 간다' 먼저, 그다음 가정 답변.","media":"한겨레","label":"H8"},{"no":309,"part":6,"media":"한겨레","label":"H9","q":"[마무리] 인터뷰 클로징 멘트 — 예시 3개 (상황별 선택)","tags":["클로징","대전환","계란과바위","노무현2%","중꺾마","김보미닷컴","호남엔딩","본경선진출"],"script":["【예시 1 · 기본형(대전환 + 계란 클로징)】 마지막으로 이 말씀을 드리고 싶습니다. 저는 민주당을 흔들러 나온 사람이 아니라, 살리러 나온 사람입니다. 공정과 청년과 미래가 있는 정당으로, 대전환 수준으로 다시 태어날 때까지 멈추지 않겠습니다. 저는 약한 계란입니다. 그러나 계란은 생명을 품고 있습니다. 끝까지 바위를 두드려 결국 금을 내겠습니다. 김채운 기자님, 그리고 한겨레 독자 여러분, 서른여섯 평당원의 도전을 끝까지 지켜봐 주십시오. 감사합니다.","【예시 2 · 청년 응원형(2% 서사로 맺을 때)】 끝으로 이 인터뷰를 읽으실 청년들께 한마디만 드리겠습니다. 어제 불합격 통보를 받고 오늘 새로운 입사지원서를 쓰고 계신 분들, 저도 첫 여론조사 2%에서 시작했습니다. 2002년 노무현 후보의 경선 초기 지지율도 바로 2%였습니다. 2%는 절망의 숫자가 아니라 희망이 출발하는 숫자입니다. 우리, 꺾이지 맙시다. 저 김보미가 앞에서 두드리겠습니다. 감사합니다.","【예시 3 · 오늘 하루 수미상관형(고함 사건으로 시작했을 때)】 오늘 하루를 돌아보면, 아침에는 고함을 들었고, 낮에는 이렇게 제 이야기를 들어주시는 분을 만났습니다. 저는 이것이 민주당의 오늘과 내일이라고 생각합니다. 호통치는 정당에서 경청하는 정당으로 — 그 전환을 제가 해내겠습니다. 오늘 컷오프 결과가 어떻게 나오든, 저 김보미는 끝까지 세대교체를 위해 온몸을 바치겠습니다. 시간 내주셔서 감사합니다. 아, 그리고 더 궁금하신 것은 김보미닷컴에 다 있습니다. 계란으로 바위 깨는 게임도 하나 있고요.","【예시 4 · 호남 엔딩형(호남 매체·호남 독자 대상일 때)】 민주당이 살아야 호남이 살고, 호남이 살아야 대한민국이 살고, 대한민국이 살아야 청년이 삽니다. 저 김보미를 민주당 당대표 본경선에 꼭 진출시켜 주십시오. 686 세 명으로 하는 경선은 민주당의 몰락을 이끌 뿐입니다. 그런 경선으로는 총선도 대선도 절대 이길 수 없습니다. 가장 현명하신 전남·광주의 힘을 보여주십시오. 서울에서 호남을 이용하려는 정치인이 아니라, 호남에 살며 호남과 운명을 같이할 사람을 꼭 본경선에 올려 주십시오. 저는 약한 계란이지만, 끝까지 바위를 두드려 금을 내겠습니다. 감사합니다."],"quotes":[["캠프 확정 멘트(클로징)","저는 약한 계란입니다. 계란은 생명을 품고 있습니다. 끝까지 바위를 두드려 결국 금을 내겠습니다 + 김보미닷컴"],["캠프 확정 멘트(어깨걸이)","자세한 건 김보미닷컴에 계란 게임 하나 있는데요… (고정 멘트)"],["박동완 통화 원워딩(7.21 12:38)","끝까지 세대교체를 위해서 온몸을 바칠 겁니다 … 대전환 수준으로 바뀔 때까지 — '대전환'이라는 말을 써야 돼요"],["게시글(7.19)","2%는 끝이 아니라 시작입니다. 2%는 절망의 숫자가 아니라, 희망이 출발하는 숫자입니다"]],"notes":["예시 3의 김보미닷컴 어깨걸이는 분위기가 좋을 때만 — 딱딱하게 끝난 인터뷰면 생략","클로징에 '대전환' 키워드 1회 이상 포함(7.21 통화 지시)","인터뷰가 고함 사건 중심으로 흘렀으면 예시 3(수미상관), 청년·공정 중심이면 예시 2, 무난하면 예시 1","예시 4(호남 엔딩형)는 광주·전남 매체이거나 호남 독자 비중이 클 때 — '전남·광주의 힘' 직접 호소가 강력"],"warn":"클로징에서 새 논쟁거리(특정인 비판)를 꺼내지 말 것 — 마지막 인상은 '단단함과 희망'으로."},{"no":2410,"media":"머니투데이","q":"Q1. 이번 전당대회를 마무리하면서 느낀 소회나 감정, 생각들이 있다면?","tags":["소회","감사","기득권바위","세대교체","시대정신","2030"],"script":["당락보다 감사가 먼저 남습니다. 이번 도전에서 평생 먹을 욕도 많이 먹었습니다. 그러나 응원과 격려가 훨씬 더 많았습니다. 세대를 불문하고 많은 분들이 공감해 주셨습니다. 당락의 유불리를 떠나 가치와 미래를 보고 표를 주신 분들이 계셨고, 당신의 젊은 날을 떠올리며 이름 없는 청년의 도전에 기꺼이 손을 내밀어 주신 많은 분들도 계셨습니다. 저는 그 한 표 한 표가 거대한 기득권 바위에 금을 냈다고 생각합니다.","그 따뜻한 마음들이 제가 이번 전당대회에서 받은 가장 큰 상입니다. 한없이 감사할 뿐입니다.","전 세대가 공감해 주신 이유는 분명하다고 봅니다. 세대교체는 더 이상 지체할 수 없는 시대정신입니다. 2030 없이는 민주당의 미래도 없음을 확실히 확인했습니다."],"quotes":[],"notes":[]},{"no":2411,"media":"머니투데이","q":"Q2. 이번 전당대회에 출마하게 된 이유는?","tags":["출마이유","회초리","정청래지도부","책임정치","뭣이중헌지","복수혈전"],"script":["지난 지방선거 참패가 시작이었습니다. 저는 그 결과를 국민이 민주당에 든 회초리로 들었습니다. 그런데 당에서는 아무도 책임지지 않았고, 아무 일도 없었던 것처럼 넘어가려 했습니다. 심지어 그 지도부의 당대표가 한 번 더 하겠다고 나섰습니다.","책임지지 않는 정치를 민주당에 도입한 정청래 지도부에 분노했습니다. 바닥 민심을 모르는 지도부를 향해, 국민 대신 회초리를 들고 출마했습니다.","민생정책은 실종되고, 적통이니 아니니 족보 깨기와 검찰개혁, 과거를 향한 복수혈전만 남은 민주당을 보며 참담했습니다. 친명이니 반명이니 호소하면서, 정작 대통령의 미래 의제를 어떻게 뒷받침할 것인가는 실종된 채 누가 더 친한지, 누가 적통인지만 싸우고 있었습니다.","뭣이 중헌지 모르는 정치를 바꾸자는 것, 그 이상도 이하도 아니었습니다."],"quotes":[],"notes":[]},{"no":2412,"media":"머니투데이","q":"Q3. 전당대회 출마 과정에서 인상 깊었던 것이 있다면?","tags":["KDLC연설회","야유","1초","강성지지자","규칙변경","5무","민낯"],"script":["하나는 KDLC(전국자치분권민주지도자회의) 당대표 후보자 연설회입니다. 저에게 처음으로 발언 기회를 주신 박승원 광명시장님께 지금도 감사드립니다. 단상에 서니, 진영 논리에 갇힌 일부 지지자들의 야유로 제 목소리가 저에게조차 들리지 않았습니다. 그래도 이것이 마지막 기회일지 모른다는 절박함으로 끝까지 말했습니다. 야유 속에서도 그 1초가 소중했습니다.","그날 저는 많은 것을 봤습니다. 진영 논리에 따라 상대 후보 지지자들 사이에 아무 말 대잔치 같은 인신공격이 오가고 몸싸움까지 났습니다. 강성 지지자들의 목소리에 출마한 후보들까지 이리저리 휘둘리는 것이 현실이었습니다. 후보들이 누구와 친한지 족보 캐기부터 하는 이유도 거기에 있는 것 아닌가 싶습니다. 그 뒤에서 침묵하는 더 많은 다수 당원의 의견은 어디에도 반영되지 못하고 있었습니다. 저는 그날 다짐했습니다. 누가 당대표가 되어도 바뀌지 않는, 공정한 정당 시스템으로 바꿔야겠다고.","다른 하나는 규칙이 바뀌는 경험이었습니다. 당헌·당규에 명시된 절차가 기괴한 부칙 하나로 한시적으로 면제되더니 중앙위원 투표로 바뀌었고, 경선 공지는 거의 하루 전에야 떴습니다. 경선 후보에 등록한 뒤에야 경선 규칙을 받았고, 그 규칙마저 예외조항에 따라 바뀌었습니다. 선거운동 기간은 5일, 공휴일을 빼면 고작 이틀 남짓이었습니다. 기탁금은 올랐고, 후보 검증 토론회는 한 번도 없었습니다. 심지어 경선 결과도 알려 주지 않았습니다.","출마선언에서 민주당에 없는 다섯 가지 — 민주주의, 공정, 청년, 미래, 세대교체 — 를 목청껏 외쳤는데, 그것을 따로 설명할 필요도 없이 총망라해 한눈에 보여 준 것이 이번 경선이었습니다. 민주당의 현주소, 민낯을 어떤 말보다 정확하게 보여 줬다고 생각합니다."],"quotes":[],"notes":[]},{"no":2413,"media":"머니투데이","q":"Q4. 청년들이 정치하기 좋은 환경이라고 보나. 출마 과정에서 어려웠던 점과 개선책은?","tags":["청년강퇴정당","입틀막","설계된결과","네겹의문","후원회","족보의벽","개선책","국가청년취업보장제"],"script":["유리천장이니 기울어진 운동장이니 하는 말로는 부족합니다. 청년에게는 출입 자체가 안 되는 '청년 강퇴 정당'이라는 것을, 이번 경선에서 모두가 확인하지 않았습니까.","안타까운 청년들의 현실도 있습니다. 경선 기간에 청년들이 저를 겨냥한 저격 글을 많이 올렸는데, 그 글을 쓴 한 청년이 개인적으로 연락해 와 '어쩔 수 없었다, 미안하다'고 사과했습니다. 또 어떤 청년 지방의원들은 '지역위원장한테 찍힐까 봐 페이스북 좋아요는 못 눌러도 기호 4번은 찍었다'며 몰래 투표 인증샷을 보내 응원해 줬습니다. 대놓고 동지를 지지할 수조차 없는 입틀막 현실 — 저는 그 누구도 원망하지 않습니다. 줄을 서지 않으면 살아남을 수 없는 구조, 그것이 지금 청년 정치인이 놓인 현실이고, 그래서 가장 아픕니다.","이번 전당대회에서 청년 후보들이 전부 낙선한 것은 실력이 부족해서가 아니라, 통과할 수 있도록 설계돼 있지 않았기 때문입니다. 저는 이것을 '설계된 결과'라고 부릅니다.","첫째, 제도에서 지웠습니다. 전당대회준비위원회가 만장일치로 의결한 청년최고위원제를 최고위원회가 부결시켰습니다. 둘째, 돈으로 막았습니다. 최고위원 예비경선 기탁금이 500만 원에서 2,000만 원으로 네 배 올랐습니다. 셋째, 기회를 봉쇄했습니다. 후보들이 맞붙어 검증받는 토론회 없이 첫 방송토론은 컷오프가 끝난 뒤에야 열렸습니다. 넷째, 결과를 감췄습니다. 저는 지금도 제 득표를 모릅니다.","돈의 문턱은 기탁금만이 아닙니다. 저는 우여곡절 끝에 후원회를 만들었지만, 다른 청년 후보들은 절차가 컷오프 뒤에야 진행되는 바람에 고생은 고생대로 하고 만들지도 못했습니다. 경선 기간이 짧아 사실상 후원금을 모을 수도 없습니다. 본선에 올라야만 비로소 모든 것이 가능한 시스템입니다.","여기에 '족보의 벽'이 있습니다. 계파가 없으면 유령 취급을 받고, 정책은 보지 않고 누구와 사진을 찍었는지, 누구와 친한지부터 파묘하듯 사진 검증이 시작됩니다. 5대 분야 25개 정책공약과 민주당이 가야 할 길을 담은 '대전환 선언' 12개 약속을 냈지만, 정책으로 평가받을 링 자체가 없었습니다.","개선책은 구호가 아니라 문서여야 합니다. 제가 이번에 공약한 것들입니다. 청년최고위원제 도입, 임명직 당직의 일정 비율 청년 할당, 당 청년위원회의 청년정책 최고 의결기구 격상, 당 예산의 10%를 청년이 직접 편성·집행·평가, 기탁금 폐지와 당직선거 공영제. 여기에 경선 규칙의 6개월 전 확정, '단, 달리 정할 수 있다'는 단서조항 삭제, 경선 결과 100% 공개까지 — 전부 당헌·당규에 박아야 합니다. 그리고 제가 공약한 대로, 청년의 취업을 국가가 책임지는 '국가청년취업보장제'를 민주당의 핵심 정책으로 도입해야 합니다."],"quotes":[],"notes":[]},{"no":2414,"media":"머니투데이","q":"Q5. 그럼에도 청년 정치인으로서 성장하기 위해 앞으로 어떤 것을 시도할 생각인지?","tags":["계란","예산바로보기","지방소멸","대전환선언","국민에게줄","킵고잉"],"script":["멈추지 않습니다. 계란들의 도전은 이제 시작입니다.","재정주권 시민행동 공동대표로서 '예산 바로보기' 운동을 이어 가겠습니다. 정치가 바뀌려면 결국 돈의 흐름이 투명해져야 하고, 그것은 중앙당의 깜깜이 회계부터 지역의 예산까지 똑같이 적용되는 원칙입니다. 또, 제가 발 딛고 선 지역에서 지방소멸과 청년 일자리 의제를 계속 파고들겠습니다. 강진만의 문제가 아니라, 지역의 문제는 대한민국의 문제이기 때문입니다.","끝으로 이번에 제안한 '민주당 대전환 선언' 12개 과제가 당헌·당규와 입법으로 이어지도록 끝까지 요구하겠습니다.","저는 앞으로도 돈도 빽도 계파도 없이, 오직 국민에게만 줄을 서겠습니다. 꺾이지 않고 가 보겠습니다. 지켜봐 주십시오."],"quotes":[],"notes":[]},{"no":2501,"media":"광주기자회견","q":"Q1. 이번 기자회견은 사실상 김민석 후보 지지 선언 아닌가?","tags":["감시","공천","호남","화답","김민석","정청래","기자회견","모든후보","유령당원","제도지지","득표수공개","공천혁신특위","지지선언아님"],"script":["★ 지지 선언이 아니라 화답입니다. 저는 특정 후보가 아니라 공천혁명이라는 제도를 지지합니다.","이번 5대 요구는 정청래 후보를 포함한 모든 당대표 후보께 드리는 같은 요구입니다. 김민석 후보께 감사를 표한 것은, 이번 전당대회의 모든 후보 가운데 유일하게 호남 공천 문제의 심각성을 인정하고 대안을 내놓으셨기 때문입니다.","누가 당대표가 되어도 공천특위를 만들고 5대 요구를 당헌·당규에 반영한다면 저는 똑같이 환영하고 지원할 것입니다.","★ 저는 지원하되 끝까지 감시하겠습니다. 지지와 감시를 함께 말하는 사람은 캠프 사람이 아닙니다."],"quotes":[],"notes":[]},{"no":2502,"media":"광주기자회견","q":"Q2. '정청래 4무 공천은 사기극'이라는 표현이 지나치다는 지적이 있다.","tags":["공천","호남","김민석","사기극","정청래","4무공천","감산15","강진경선","기자회견","유령당원","전과5범","득표수공개","공천혁신특위"],"script":["사실에 근거한 평가입니다. 정청래 전 대표는 지난 지방선거에서 낙하산도 부당 배제도 없다는 '4무 공천'을 공언했고, 패자도 승리하는 선거라고 자부했습니다.","★ 그러나 제가 겪은 강진 현장은 정반대였습니다. 토론 한 번, 연설 한 번 없었고, 저는 후보 등록을 마친 뒤에야 경선 규칙을 받았으며, 제가 몇 표를 얻었는지 지금도 알지 못합니다.","당내 징계에는 가혹하고 전과에는 관대한 공천 지침으로 저는 15% 감산을 받았고, 전과 5범 후보는 감점 없이 경선을 치렀습니다.","★ 약속과 정반대의 현장을 몸으로 겪은 당사자로서, 이것을 사기극 말고 달리 부를 말을 찾지 못했습니다."],"quotes":[],"notes":[]},{"no":2503,"media":"광주기자회견","q":"Q3. 특위를 낙천자와 청년으로 채우라는 요구는 이해충돌 아닌가? '낙천자의 원한'이라는 시각도 있다.","tags":["공천","호남","김민석","정청래","기자회견","유령당원","경험의문제","도둑자물쇠","득표수공개","공천혁신특위","떨어져본사람","면죄부위원회"],"script":["거꾸로입니다. 공천을 받은 사람은 그 시스템의 수혜자입니다. 수혜자들이 모여 심사하면 혁신위가 아니라 면죄부 위원회가 됩니다.","★ 어느 조항이 자의적으로 적용됐는지, 어느 문턱에서 청년이 사라졌는지는 떨어져 본 사람이 압니다. 사고 조사위원회를 사고 낸 사람들로 채우는 회사는 없습니다.","★ 도둑에게 자물쇠를 맡길 수 없다는 말도 같은 취지입니다. 이것은 원한의 문제가 아니라 경험의 문제입니다."],"quotes":[],"notes":[]},{"no":2504,"media":"광주기자회견","q":"Q4. 본인이 공천혁신특위에 참여할 생각인가?","tags":["감시","공천","호남","김민석","정청래","기자회견","유령당원","자리아님","특위참여","득표수공개","공천혁신특위"],"script":["불러주신다면 마다하지 않겠습니다. 그러나 이 요구는 제 자리를 위한 것이 아닙니다.","★ 5대 요구가 당헌·당규에 반영되는지가 중요하지, 위원 명단에 김보미라는 이름이 있는지는 중요하지 않습니다. 저는 밖에서도 충분히 감시할 수 있습니다."],"quotes":[],"notes":[]},{"no":2505,"media":"광주기자회견","q":"Q5. 당원 명부를 행안부 주민등록 데이터와 대조하자는 요구는 개인정보 침해 소지가 있지 않나?","tags":["공천","호남","김민석","정청래","1인1표","기자회견","당원명부","유령당원","적법설계","득표수공개","공천혁신특위"],"script":["정당의 당원 명부는 공직 후보를 뽑는 근거입니다. 그 명부가 오염되어 있으면 모든 경선 결과가 오염됩니다.","본인 확인과 실거주 확인은 1인 1표 민주주의의 최소 조건이고, 구체적 방법은 당과 관계 기관이 적법하게 설계하면 됩니다. 선거 때마다 이루어지는 선거인명부 검증 수준의 일입니다.","★ 핵심은 기술이나 법리가 아니라 의지입니다. 그 동네 살지도 않는 불법당원, 자기가 당원인지도 모르는 유령당원이 군수를 뽑는 일을 언제까지 두고 볼 수는 없습니다."],"quotes":[],"notes":[]},{"no":2506,"media":"광주기자회견","q":"Q6. 김민석 후보가 약속을 지킬 것이라고 믿는 근거는 무엇인가?","tags":["검증","공천","호남","공수표","김민석","정청래","기자회견","연말시한","유령당원","규칙과숫자","득표수공개","공천혁신특위"],"script":["★ 믿음은 검증의 대상입니다. 선언은 검증되지 않습니다. 검증되는 것은 규칙과 숫자뿐입니다.","그래서 오늘 연말이라는 시한과 5대 요구라는 기준을 공개적으로 제시한 것입니다. 말이 문서가 되는지, 문서가 당헌·당규가 되는지 지켜보겠습니다.","★ 지금까지 민주당 지도부의 공천개혁 약속은 번번이 공수표로 끝났습니다. 이번에도 공수표로 끝난다면, 가장 먼저 가장 크게 비판하는 사람이 저일 것입니다."],"quotes":[],"notes":[]},{"no":2507,"media":"광주기자회견","q":"Q7. 예비경선에서 탈락한 후보가 전당대회 막바지에 목소리를 내는 이유는?","tags":["공천","호남","김민석","정청래","기자회견","다음청년","싱어게인","유령당원","결과비공개","득표수공개","공천혁신특위","여정은멈췄지만"],"script":["★ 저의 여정은 예비경선에서 멈췄지만, 제가 던진 질문은 멈추지 않았습니다.","이번 전당대회 예비경선도 선거인 수, 투표율, 득표수가 공개되지 않았습니다. 저는 제가 몇 표를 받았는지도 모른 채 탈락했습니다. 이 문제를 겪은 당사자가 침묵하면, 다음 청년이 똑같은 벽 앞에 서게 됩니다.","★ 승자도 패자도 함께 빛나는 싱어게인 같은 민주당을 만드는 일. 그것이 제가 지금도 말하는 이유입니다."],"quotes":[],"notes":[]},{"no":2508,"media":"광주기자회견","q":"Q8. 왜 광주에서, 평일 저녁 6시에 기자회견을 하나?","tags":["공천","광주","호남","김민석","정청래","기자회견","유령당원","저녁6시","당원과시민","득표수공개","공천혁신특위"],"script":["호남 공천 문제는 호남에서 말씀드리는 것이 맞다고 생각했습니다.","★ 저녁 6시는 퇴근하는 직장인과 청년들이 함께할 수 있는 시간입니다. 공천혁명의 주인공은 정치인이 아니라 당원과 시민이기 때문입니다.","언론인 여러분께는 퇴근 전에 자료를 먼저 보내드리는 것으로 양해를 구했습니다."],"quotes":[],"notes":[]},{"no":2509,"media":"광주기자회견","q":"Q9. 호남 정치 독립선언, 민주당 대전환 선언과 오늘 기자회견의 관계는?","tags":["공천","호남","김민석","정청래","기자회견","운영체제","유령당원","공천은심장","대전환선언","득표수공개","공천혁신특위","호남독립선언"],"script":["하나의 흐름입니다. 7월 18일 광주에서 '호남 정치 독립선언'으로 문제를 제기했고, 예비경선 컷오프 전날 홍대에서 '민주당 대전환 선언'으로 대안을 제시했습니다. 오늘은 그 대안 가운데 공천혁명을 특위라는 실행 수단에 연결하는 자리입니다.","★ 민주당의 세대교체는 사람 몇 명을 바꾸는 일이 아니라 운영체제를 바꾸는 일이고, 공천은 그 운영체제의 심장입니다."],"quotes":[],"notes":[]},{"no":2510,"media":"광주기자회견","q":"Q10. 전당대회 이후 계획은? 강진군수 선거에 다시 도전하나?","tags":["공천","호남","김민석","정청래","기자회견","연말감시","유령당원","득표수공개","링이열리면","공천혁신특위","예산바로보기"],"script":["★ 링이 열리면 다시 오르겠습니다.","당장은 재정주권 시민행동 공동대표로서 예산 바로보기 운동을 계속하고, 오늘 제시한 5대 요구가 당헌·당규가 되는지 연말까지 감시하겠습니다. 다음 선거는 그다음 문제입니다."],"quotes":[],"notes":[]},{"no":2511,"media":"광주기자회견","q":"Q11. 온라인 혐오, 협박 댓글에 대한 고소는 어떻게 진행되고 있나?","tags":["공천","범죄","호남","김민석","정청래","고소진행","기자회견","유령당원","저질정치","득표수공개","공천혁신특위"],"script":["절차대로 진행하고 있습니다. 비판은 감사히 받겠습니다. 그러나 협박과 혐오, 여성 비하와 장애 조롱은 정치가 아니라 범죄입니다.","★ 저 하나 조용해지는 것으로 끝날 일이었다면 시작하지도 않았습니다. 누구나 마음 놓고 말할 수 있는 민주당을 만드는 일이라 생각하고, 끝까지 가겠습니다."],"quotes":[],"notes":[]},{"no":2512,"media":"광주기자회견","q":"Q12. 요구가 받아들여지지 않으면 탈당이나 신당 창당 가능성도 있나?","tags":["공천","호남","김민석","정청래","기자회견","유령당원","탈당없음","당을고친다","득표수공개","민주당사랑","공천혁신특위"],"script":["★ 없습니다. 저는 더불어민주당을 목숨보다 사랑하는 사람입니다.","당을 떠나는 것이 아니라 당을 고치는 것이 저의 길입니다. 민주당에 민주를 되돌려 놓는 일을 당 안에서 끝까지 하겠습니다."],"quotes":[],"notes":[]},{"no":2513,"media":"광주기자회견","q":"Q13. 5대 요구 가운데 단 하나만 관철할 수 있다면 무엇을 고르겠나?","tags":["공천","첫줄","호남","김민석","데이터","정청래","기자회견","유령당원","득표수공개","공천혁신특위","결과100퍼공개"],"script":["★ 경선 결과 100% 공개입니다. 선거인 수, 투표율, 후보별 득표수가 공개되어야 나머지 모든 검증이 시작됩니다.","데이터가 공개되면 유령당원도, 자의적 규칙 적용도 숨을 곳이 없어집니다. 새 시스템의 첫 줄은 새로운 구호가 아니라 공개된 데이터여야 합니다."],"quotes":[],"notes":[]},{"no":2514,"media":"광주기자회견","q":"Q14. [지역현안] 전남광주통합특별시 청사 재편 — 동부권 청사 배치 논란에 대한 입장은?","tags":["공천","호남","3청사","김민석","정청래","권한부서","균형발전","기자회견","기준공개","동부청사","유령당원","득표수공개","공천혁신특위"],"script":["기능 배분 자체보다 더 중요한 것을 짚고 싶습니다. 지난달 발표된 재편안을 보면 동부청사는 부서가 12개에서 21개로 늘고 산업과 경제의 거점이 된다고 합니다. 방향은 환영합니다. 그런데 기획, 예산, 인사 같은 핵심 권한 부서를 어디에 둘지는 '추가 협의 과제'로 미뤄져 있습니다.","★ 권한과 예산이 없는 청사는 간판일 뿐입니다. 동부권이든 서남권이든, 껍데기 청사를 받고 만족하라는 식이 되어서는 안 됩니다.","★ 그리고 청사 배치야말로 공천과 똑같습니다. 어떤 기준으로, 어떤 데이터로, 누가 결정했는지를 시도민에게 100% 공개해야 합니다. 밀실에서 나눠 먹으면 지역끼리 싸우게 되고, 기준을 공개하면 지역이 납득하게 됩니다.","저는 서남권 강진 사람입니다. 그러나 이 문제를 지역 대 지역의 싸움으로 만들면 모두가 집니다. 기준 공개, 권한 배분 명시, 시도민 공론화. 이 세 가지가 답이라고 생각합니다."],"quotes":[],"notes":[]},{"no":2515,"media":"광주기자회견","q":"Q15. [지역현안] 전남 국립의대 — 목포대와 순천대 통합이 표류하고 있는데 어떻게 보나?","tags":["공천","호남","김민석","목포대","순천대","정청래","기자회견","유령당원","의료공백","전남의대","득표수공개","공천혁신특위","환자에겐동서없다"],"script":["★ 전남은 전국에서 유일하게 의과대학이 없는 도입니다. 30년 넘은 숙원이 대학 간, 지역 간 배치 다툼으로 또 표류하고 있습니다. 지켜보는 도민의 마음은 타들어 갑니다.","★ 환자에게는 동부도 서부도 없습니다. 강진에서 응급환자가 생기면 광주까지 달려가야 하는 현실은 목포든 순천이든 똑같습니다. 의대와 병원의 배치는 대학의 자존심이나 지역 정치인의 성적표가 아니라, 의료 수요 데이터와 응급 이송 시간을 기준으로 정해야 합니다.","제가 요구하는 것은 공천혁명과 같은 원칙입니다. 결정의 기준과 근거를 도민에게 공개하고, 그 기준에 따라 빨리 결론을 내라는 것입니다. 늦어지는 하루하루가 도민의 생명과 직결됩니다.","정부와 전남도, 두 대학 모두에 말씀드립니다. 골든타임을 놓치고 나서 서로를 탓하는 것이 지금까지 호남 정치의 실패 공식이었습니다. 이번에는 그 공식을 깨 주십시오."],"quotes":[],"notes":[]},{"no":2516,"media":"광주기자회견","q":"Q16. [공통 대응] 곤란한 질문, 오늘 주제와 관계없는 질문을 받았을 때 (정중한 거절 멘트 모음)","tags":["공천","호남","김민석","정청래","거절멘트","기자회견","말아끼기","유령당원","주제환기","득표수공개","공천혁신특위"],"script":["★ (주제 밖 질문) \"좋은 질문이지만, 오늘은 공천혁명을 말씀드리려고 마련한 자리입니다. 그 사안은 제가 따로 정리해서 답변드리겠습니다. 양해 부탁드립니다.\"","★ (사실관계 미확인 사안) \"사실관계를 확인하지 않고 말씀드리는 것은 무책임하다고 생각합니다. 확인한 뒤에 입장을 밝히겠습니다.\"","(특정 후보 평가 유도) \"특정 후보에 대한 평가는 삼가겠습니다. 저는 오늘 사람이 아니라 제도를 말씀드리러 왔습니다.\"","(수사, 소송 중 사안) \"진행 중인 사안이라 말을 아끼는 것이 맞다고 생각합니다. 결과가 나오면 그때 소상히 말씀드리겠습니다.\"","(사생활, 제3자 관련) \"제3자와 관련된 일이라 제가 이 자리에서 언급하는 것은 적절하지 않은 것 같습니다.\"","★ 공통 원칙: 회피로 보이지 않게 한 문장으로 이유를 밝히고, 반드시 오늘의 메시지(공천혁명, 5대 요구)로 돌아온다. \"다만 오늘 꼭 말씀드리고 싶은 것은…\"으로 연결."],"quotes":[],"notes":[]},{"no":2517,"media":"광주기자회견","q":"Q17. [지지 멘트] 박선원 최고위원 후보 지지 — 호남의 아들, 호남의 민원해결사","tags":["공천","호남","김민석","박선원","정청래","기자회견","유령당원","중립구분","최고위원","득표수공개","민원해결사","호남의아들","공천혁신특위"],"script":["★ 저는 이번 당대표 선거에서 특정 후보를 지지하지 않습니다. 공천혁명이라는 제도를 지지할 뿐입니다. 그러나 최고위원 선거는 다릅니다. 새 지도부 회의 테이블에 호남의 목소리를 올려놓을 사람이 반드시 있어야 합니다. 그래서 말씀드립니다. 저는 박선원 후보를 지지합니다.","박선원 후보는 나주 영산포에서 태어난 호남의 아들입니다. 김대중, 노무현, 문재인 정부에서 청와대 안보전략비서관과 국정원 기조실장, 차장을 지낸 실무형 정치인입니다. 말로 일하는 사람과 손으로 일하는 사람은 다릅니다. 박선원 후보는 손으로 일해 온 사람입니다.","호남의 민원은 늘 뒤로 밀렸습니다. 중앙의 차별과 배제 속에서, 호남은 나라를 지키고도 청구서 한 장 내밀지 못했습니다. 박선원 후보는 \"호남의 아픔을 영광으로 바꾸겠다\"며 전남광주통합특별시의 초광역 미래경제권 도약, 광주 군공항 이전의 임기 내 착공을 약속했습니다. 구호가 아니라 기한과 방법이 있는 공약입니다.","★ 호남에 필요한 것은 호남을 대변한다고 말만 하는 정치인이 아니었습니다. 호남의 민원 서류를 들고 끝까지 쫓아다니는 해결사였습니다. 저는 박선원 후보의 그 해결사 기질을 믿습니다.","★ 한 가지 부탁도 함께 드립니다. 최고위원이 되시면, 호남 공천혁명과 공천특위 5대 요구가 당헌·당규가 되도록 지도부 안에서 힘을 보태 주십시오. 호남의 민원 1호는 공정한 공천입니다.","호남의 아들이 호남의 민원해결사로 일할 수 있도록, 저 김보미도 함께 뛰겠습니다."],"quotes":[],"notes":[]},{"no":2601,"media":"한겨레21","q":"Q1. 당대표 예비경선 컷오프 이후 어떻게 지내고 계신가요?","tags":["계란","근황","재정주권","한겨레21","예산바로보기","나라살림돋보기"],"script":["★ 살면서 이렇게 많은 관심과 사랑도 받아 보고, 욕도 많이 얻어먹었습니다. 핸드폰이 마비돼서 연락 주신 분들께 답장드릴 준비를 하고 있습니다.","재정주권 시민행동 공동대표로 '예산 바로보기' 운동을 하고 있습니다. 김보미닷컴에 들어오시면 내가 사는 동네만 선택해도 예산과 집행 현황, 계약 현황까지 3초 만에 확인됩니다. 전국 243개 지자체와 중앙정부 예산이 다 들어 있습니다.","★ 내가 낸 세금이 어디로 가는지 직접 들여다보는 것만큼 확실한 정치 참여는 없습니다. 재정주권 시민행동에 많은 참여와 관심 부탁드립니다.","【참고】 정당 재정 공개 논리 — 울릉군도 재정을 공개하고 정부도 예산서를 공개하는데, 국고보조금에 선거보조금까지 받는 정당은 그 돈을 어디에 썼는지 공개하지 않습니다. 올해 지방선거에서도 민주당은 258억 원의 선거보조금을 받았습니다. 밀실이 부패를 만듭니다. (홍대선언 12번째 약속: 재정 10원까지 전면 공개)"],"quotes":[],"notes":[]},{"no":2602,"media":"한겨레21","q":"Q2. 당대표 출마 전과 후, 달라진 점이 있으실까요?","tags":["계란","근황","청년","2030","5060","인터뷰거절","한겨레21","2030계란"],"script":["★ 많은 분들이 알아봐 주시니 옷 매무새도 단정히 하고 바르게 살고 있습니다.","인터뷰 요청도 많이 주셨는데, 후보자 신분이 아니라 다른 정치인이나 현안을 평론하는 것은 의미가 없다고 생각해 부득이 거절하고 있습니다.","★ 대신 사람을 많이 만납니다. 청년들이 특히 연락을 많이 줍니다. 2030 계란들이 꿈틀꿈틀 움직이고 있습니다. 5060, 그야말로 짱돌 세대 어른들도 뭐라도 도와주고 싶다며 연락을 주십니다. 오히려 제가 용기를 얻어 버티고 있습니다.","★ 정치하길 참 잘했다는 생각이 듭니다. 계란은 깨졌지만, 바위에 낸 금은 남았습니다."],"quotes":[],"notes":[]},{"no":2603,"media":"한겨레21","q":"Q3. 이번 전당대회, 당대표 선출의 의미는 무엇이라고 보실까요?","tags":["공천","대전환","시스템","재창당","경선혁신","당원주권","홍대선언","한겨레21"],"script":["★ 재창당 수준의 민주당 갈아엎기, 대전환을 해야 한다는 것입니다.","저는 예비경선 컷오프 전날인 7월 22일, 여의도가 아니라 청년의 거리 홍대에서 '민주당 대전환 선언'을 발표했습니다. 예비경선 결과와 상관없이 국민께 드리는 약속이었습니다.","★ 핵심은 하나입니다. 당대표가 누가 되든, 지도부가 누가 되든 바뀌지 않는 철저하게 공정한 시스템이 필요하다는 것입니다. 낡은 운영체제 위에 새 얼굴만 얹는 것은 혁신이 아닌 도색입니다.","【홍대선언 4대 진단】 ① 규칙을 만든 사람들의 정당이 되었다 — 등록을 해 놓고 자격 기준을 바꾸는 정당의 주인은 당원이 아니라 기득권. ② 사람이 아니라 운영체제를 바꿔야 한다 — 686 몇 사람을 청년 몇 사람으로 바꾼다고 당은 바뀌지 않는다. ③ 디지털 정당은 작은 목소리를 크게 듣는 정당 — 로그인 정당을 끝내고 시민의 삶과 링크된 정당으로. ④ 가짜 당원주권 폐기, 전면 대전환 — 당헌을 다시 쓰고 당원을 다시 받아야 한다.","【홍대선언 12약속 전문】 1. 경선 규칙 선거 6개월 전 확정, '달리 정할 수 있다' 예외조항 전부 삭제. 2. 가짜당원·불법당원 정리 + 경선 결과 100% 공개(행안부 주민등록 대조). 3. 당비 월 1만 원 + 6개월 납부 시 권리당원. 4. 토론과 연설로 겨루는 공천, 토론 불참자 감점. 5. 선호투표제 항구 제도화 + 예비경선 2주 이상 운동·토론회 3회 이상 보장. 6. 기탁금 폐지 + 당직선거 공영제. 7. 청년에게 자리가 아니라 권력과 권한(청년 기준 45→40세, 선출직 청년최고위원 + 지명직 2명 청년, 청년위 최고 의결기구화). 8. 철밥통 사무처 전면 쇄신. 9. 동일 지역구 3선 초과 공천 금지. 10. '검찰 저격수'에서 '국민 삶의 설계자'로(미래전환위·7대 미래산업). 11. 16세부터 50년 당원까지 정치·정책교육. 12. 당 재정 10원까지 전면 공개.","【5대 공약 요약】 ① 유리상자 경선 ② 진짜 1인 1표 ③ 청년 결정권 ④ 미래 설계 정당 ⑤ 성장 사다리 정당"],"quotes":[],"notes":[]},{"no":2604,"media":"한겨레21","q":"Q4. 바람직한 당청관계는 어때야 한다고 보실까요?","tags":["이재명","지지율","뉴이재명","당청관계","대통령발목","지지율간격","한겨레21"],"script":["★ 대통령이나 당이나 목적은 하나 아니겠습니까. 오직 국민만 보는 것입니다.","★ 그런데 그 일을 하는 데 당이 대통령의 발목을 잡고 있는 현실이 한탄스럽습니다. 대통령께서는 밤낮없이 미래 의제를 위해 뛰고 계십니다. 그러면 뭐 합니까. 지금 민주당
