<script>window.__h0=location.hash;</script><script id="__payload" type="application/json">{"DATA":[{"no":3209,"media":"연세대 토론회(10.27)","q":"【인사말·자기소개 · 약 1분】 기조발언 들어가기 전 첫 인사 — 학생회 임원·토론자 이름 부르기","tags":["인사말","자기소개","첫인사","학생회","이륙","김성열","박태훈"],"quotes":[],"script":["★ 안녕하십니까. 전남 강진에서 정치를 시작한 서른여섯 살, 더불어민주당 평당원 김보미입니다.","★ 먼저 자리를 만들어 주신 분들께 인사드립니다. 제62대 정치외교학과 학생회 <이륙> 김민수 학생회장님, 전시은 부학생회장님, 그리고 9월부터 메일로 저를 챙겨 주신 미래진로국 황금별 님, 고맙습니다. 여야정책토론회는 <이륙>이 학생들에게 한 약속이라고 들었습니다. 그 약속 지키는 자리에 제가 끼게 돼서 영광입니다.","★ 같이 서게 된 두 분께도 인사드립니다. 김성열 전 최고위원님은 이 학교 경영학과 선배님이십니다. 모교에 오신 선배님과 같이 서게 돼 반갑습니다. 박태훈 위원장님은 지금 대학생들을 대표해 오셨으니, 오늘 제가 많이 배우겠습니다.","(저를 처음 보시는 분이 많으실 겁니다. 스물여덟에 강진군의원이 됐고, 서른둘에 전국에서 가장 어린 기초의회 의장을 했습니다. 입당 13년 됐지만 계파는 없습니다. 올여름 당대표 경선에 나가 계란으로 바위를 쳤습니다. 계란은 깨졌지만 바위에 금은 갔다고 믿습니다.)","★ 저는 지금도 강진 임대아파트에 살고, 일하는 곳 근처엔 방을 못 구해서 화성 언니 집에서 출퇴근합니다. 그러니까 오늘 의제인 청년 주거와 일자리는 제가 연구한 주제가 아니라 제가 사는 문제입니다.","★ 민주당이지만 틀린 건 틀렸다고 말하겠습니다. 그리고 오늘 여러분 질문에는 보증금 안 받겠습니다. 편하게 물어 주십시오."],"notes":["약 1분(공백 제외 약 420자). 시간이 짧으면 ( ) 문단을 뺀다. 사회자가 토론자 소개를 먼저 하면 자기소개 문단은 \"소개해 주신 대로\" 한마디로 줄인다.","이름은 10.25 학생회 안내문 기준: 학생회장 김민수(정외 24), 부학생회장 전시은(정외 25), 미래진로국 담당 황금별. 당일 사회자·국장 이름을 알게 되면 함께 부른다.","호칭: 김성열 전 최고위원님(의원 아님), 박태훈 위원장님(진보당 전국대학생준비위원장). 경영학과 선배 이야기 이후 김성열 관련 과거는 꺼내지 않는다(3281 카드).","기존 첫인사 801·802·803·809 카드의 문장을 토론회용으로 맞춘 것. 정청래·김민석 등 당내 이름은 뺐다."],"warn":"황금별 님 9.2 메일에 '강진구'로 잘못 쓴 건 언급하지 않는다. 학생회 공약 이행률(78.3%) 숫자도 무대에서는 말하지 않는다.","src":[["학생회 10.25 안내(토론자·일정·학생회 명단) → 행사 개요 카드","#card/3271"],["김성열 전 최고위원 프로필","#card/3281"],["첫인사 표준형(801)","#card/801"],["첫인사 최종형(809)","#card/809"],["기조발언 최종본","#card/3201"]]},{"no":3201,"media":"연세대 토론회(10.27)","q":"【기조발언 · 최종본 약 5분】 ★ = 꼭 할 말 · ( ) = 시간 짧으면 생략","tags":["기조발언","보증금","원룸","강진","청년취업보장제","기숙사","월세"],"quotes":[],"script":["★ 여러분 학교 정문 앞 8평 원룸이 얼마에 팔리는지 아십니까? 올해 6월 창천동에서 8평짜리 원룸 하나가 5억 3천만 원에 팔렸습니다. 같은 달 제 고향 강진에서는 34평 아파트가 1억 7천5백만 원에 팔렸습니다.","★ 여러분 학교 앞 8평 원룸이 강진 34평 아파트보다 세 배 비쌉니다. 평당으로 따지면 열세 배입니다.","(월세는 어떻습니까. 연세대 앞 원룸 평균 월세가 1년 만에 61만 4천 원에서 67만 8천 원으로 올랐습니다. 관리비는 따로 냅니다.)","★ 저는 그 강진에서 34평 임대아파트에 삽니다. 그런데 지금 일하는 곳 근처에서는 방 한 칸을 못 구했습니다. 선거를 치르고 빚이 늘어서 더 빌릴 데도 없습니다. 그래서 요즘 화성 언니 집에서 출퇴근합니다.","전 군의회 의장도 수도권에서 방 한 칸 못 구합니다. 당대표 경선 때는 서울에 잘 곳이 없어서 렌터카에서 노트북 들고 쪽잠을 잤습니다. 웃기면서도 슬픈 현실입니다. 여러분은 오죽하겠습니까?","★ 오늘 여기 오면서 보증금이라는 말을 계속 생각했습니다. 방을 얻으려면 보증금을 내야 합니다. 그런데 요즘 청년은 일자리를 얻을 때도 보증금을 냅니다. 경력이라는 보증금입니다.","신입을 뽑는다면서 경력부터 묻습니다. 경력이 없어서 일을 못 하고, 일을 못 해서 경력이 없습니다. 이게 말이 됩니까?","★ 숫자가 말해 줍니다. 15세부터 29세까지 청년 취업자는 지난달까지 47개월 연속 줄었습니다. 금융위기 이후 가장 깁니다. 졸업하고 한 번이라도 일해 본 청년은 84.8%, 통계를 낸 뒤로 가장 낮습니다.","(우리나라 25세에서 34세 대학 이수율은 71.1%, OECD 1위입니다. 그런데 대학 나온 사람의 고용률은 80.1%로 OECD 평균 86%보다 낮습니다.)","★ 여러분이 공부를 덜 해서입니까? 아닙니다. 이 사회가 청년한테 받는 보증금이 너무 비싸서입니다.","(정치에도 보증금이 있었습니다. 저는 스물여덟에 강진군의원이 됐고, 서른둘에 전국에서 가장 어린 기초의회 의장이 됐습니다. 의장이 되고 업무추진비를 홈페이지에 전부 공개하고, 본회의를 유튜브로 생중계했습니다. 돌아온 건 불신임안이었습니다. 당대표 선거에 나갈 때는 기탁금이 없어서 다섯 군데에서 빌렸습니다.)","★ 저는 민주당입니다. 그래도 틀린 건 틀렸다고 말하겠습니다. 정답은 정당에 있지 않습니다. 국민에게 있습니다. 오늘 이 강의실에서는 여러분이 정답입니다.","★ 하나. 청년 주거는 공공이 가진 방부터 늘려야 합니다. 서울 대학 기숙사 수용률은 16.8%, 전국 17개 시도 가운데 꼴찌입니다. 수도권은 5년 전보다 오히려 떨어졌습니다.","정부 청년 월세 지원은 한 달 20만 원, 여러분 학교 앞 월세의 3분의 1이 안 됩니다. 현실에 맞게 올려야 합니다. 그런데 지원만 올리면 월세도 따라 오릅니다. 대학가 기숙사와 공공 원룸을 몇 호, 언제까지 짓는지 숫자로 약속하고, 실제로 지었는지 공개하게 해야 합니다.","★ 부동산 정책의 성적표는 세율표에 있지 않습니다. 청년이 오늘 밤 어디서 자느냐에 있습니다.","★ 둘. 첫 일자리의 경력 보증금은 나라가 대신 내야 합니다. 저는 이걸 청년취업보장제라고 부릅니다. 나라가 첫 고용의 인건비와 교육비를 대고, 기업과 공공기관이 실제 일과 멘토링을 맡는 겁니다. 몇 달짜리 인턴이 아니라 경력으로 쳐 주는 첫 일자리입니다.","(오스트리아는 2024년 한 해 1만 1천7백여 명에게 이런 견습 자리를 나라가 보장했습니다.) 지방은 더 급합니다. 지방 청년은 수도권 청년보다 취업까지 석 달 넘게 더 걸립니다.","★ 셋. 청년 정책은 청년이 직접 정하게 해야 합니다. 지난여름 우리 당에서 청년 주거 대책으로 폐버스 하우스 이야기가 나왔습니다. 틀린 겁니다. 본인들은 넓은 집에 살면서 청년에게는 폐버스를 던져 주니 청년들이 화가 난 겁니다.","그 무렵 폭염 속에 그늘진 길만 골라 알려 주는 지도 앱이 인기였습니다. 땡볕을 걸어 본 사람이라야 그늘길을 압니다. 청년 정책의 공급자를 기성 정치인에서 청년 당사자로 바꿔야 합니다.","저는 당대표 선거에서 당 예산 10%를 청년이 직접 짜고 쓰게 하자고 했습니다. (서울시는 청년 천여 명이 77억 원어치 사업을 직접 골랐습니다.) 청년한테 쓰는 돈은 청년이 짜야 합니다.","★ 저는 군수 경선에서도, 당대표 예비경선에서도 떨어졌습니다. 계란으로 바위를 쳤고, 계란이 깨졌습니다. 그래도 바위에 금은 갔다고 믿습니다. 오늘 여러분 질문에는 보증금 안 받겠습니다. 무엇이든 물어 주십시오."],"notes":["약 1,641자(공백 제외) · 분당 300자 기준 약 5분 30초 / ( ) 생략 시 1,302자 약 4분 20초. 학생회가 시간을 알려주면 맞춰 줄일 것. 3분이면 1분30초 압축본에 의제 한 줄씩.","중심 비유 하나: 보증금(방 보증금 → 경력 보증금 → 정치 보증금 → 질문 보증금 안 받겠다).","그동안 한 말을 녹임: 렌터카 쪽잠(정치시그널 Q2·전격시사), 성적표는 오늘 밤 어디서 자느냐(전격시사 8.12), 폐버스·그늘길·공급자 교체(이맘때 Q8·정치시그널 Q11), 계란과 바위(출마선언). 어디서 한 말인지는 【그동안 한 말】 카드.","문장별 출처는 바로 아래 【기조발언 근거표】 카드."],"src":[["창천동 원룸 매매 실거래(집품)","https://zippoom.com/browse/%EC%84%9C%EC%9A%B8-%EC%84%9C%EB%8C%80%EB%AC%B8%EA%B5%AC-%EC%B0%BD%EC%B2%9C%EB%8F%99/%EB%B9%8C%EB%9D%BC-%EB%A7%A4%EB%A7%A4"],["강진군 30평대 아파트 시세·실거래(리치고)","https://m.richgo.ai/realty/apt-hub/%EC%A0%84%EB%82%A8%EA%B4%91%EC%A3%BC/%EA%B0%95%EC%A7%84%EA%B5%B0/30%ED%8F%89%EB%8C%80"],["승원팰리체 리버시티 전용84㎡ 34평형 226세대(장강뉴스)","https://www.jgynews.com/news/articleView.html?idxno=33434"],["승원팰리체 리버시티 10년 민간임대(강진일보)","https://www.nsori.com/news/articleView.html?idxno=23309"],["서울 주요 대학가 원룸 월세, 연세대 인근 67.8만(SBS Biz·다방 2026.8.11)","https://biz.sbs.co.kr/amp/article/20000327969"],["2026년 9월 고용동향, 청년 취업자 47개월 감소(스마트투데이)","https://www.smarttoday.co.kr/ko-kr/articles/112773"],["2026년 5월 청년층 부가조사(국가데이터처, KDI 요약)","https://eiec.kdi.re.kr/policy/materialView.do?num=284575"],["OECD 교육지표 2026(파이낸셜뉴스 2026.9.29)","https://www.fnnews.com/news/202609291351196534"],["김보미 경력·의정활동(오마이뉴스 2026.7.13)","https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003250922"],["최연소 의장의 수난, 불신임안(경향신문 2024.5.25)","https://www.khan.co.kr/article/202405250900051"],["수도권 대학 기숙사 수용률, 서울 16.8%(이투데이 2026.10.15)","https://etoday.co.kr/news/view/2635271"],["청년 월세 지원 상시화 20만×24개월(뉴시스 2026.3.18)","https://mobile.newsis.com/view/NISX20260318_0003552925"],["오스트리아 훈련 보장 2024년 1만1,713명(오스트리아 사회부)","https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsmarkt/Arbeitsmarktfoerderungen/Jugendliche-und-junge-Erwachsene.html"],["고용정보원 청년패널, 비수도권 24.6개월(쿠키뉴스)","https://www.kukinews.com/article/view/kuk202511270015"],["당 예산 10% 청년 편성 공약(프레시안 2026.7.16)","https://pressian.com/pages/articles/2026071617485205196"],["서울시 청년자율예산(서울시)","https://news.seoul.go.kr/gov/archives/541685"],["민주당 황희 '폐버스 주택' 제안 후폭풍(아시아경제 2026.8.10)","https://view.asiae.co.kr/article/2026081008325546534"],["\"그늘진 길만 알려준다\" 폭염에 뜬 지도앱(뉴시스 2026.8.6)","https://www.newsis.com/view/NISX20260806_0003738660"],["📼 김보미 원래 답변 — 정치시그널 Q2 렌터카 쪽잠","#card/3002"],["📼 김보미 원래 답변 — 전격시사 8.12 버스하우스·부동산","#card/2707"],["📼 김보미 원래 답변 — 이맘때 Q8 청년 정책 만들기","#card/2911"]],"warn":"\"8평 원룸 5억 3천만 원\"은 거래 1건(창천동 프릭스빌)입니다. \"평균\"이라고 말하지 마십시오. \"올해 6월 창천동에서 거래된 8평 원룸\"이라고 하면 정확합니다."},{"no":3202,"media":"연세대 토론회(10.27)","q":"【기조발언 근거표】 원고의 모든 숫자·사실 → 출처 (질문 받으면 이대로 답)","tags":["근거","출처","팩트체크","기조발언"],"quotes":[],"script":["① 창천동 8평 원룸 5억 3천만 원 → 프릭스빌(신촌로3나길 24), 2026.6.23 매매 실거래 8평. 같은 동 라포레 8평 6억 8천만 원(2026.8.4)도 있음. [집품 창천동 매매]","② 강진 34평 아파트 1억 7천5백만 원 → 강진중흥파크S-클래스빌(군동면) 34평, 2026.6.20 실거래. 강진 30평대 4개 단지 평당 평균 808만 원. [리치고]","③ 세 배·열세 배 → 5.3억 ÷ 1.75억 = 3.03배 / 평당 5.3억÷8평=6,625만 원, 1.75억÷34평=515만 원 → 12.9배. (계산)","④ 연세대 앞 월세 61만 4천 → 67만 8천 원(+10.4%), 관리비 +14.3% → 다방 2026년 7월 서울 주요 10개 대학 분석(보증금 1천만 원·33㎡ 이하). [SBS Biz 8.11]","⑤ 강진 34평 임대아파트 → 승원팰리체 리버시티, 전용 84㎡(34평형), 226세대, 10년 민간임대. [장강뉴스·강진일보] / 화성 언니 집 출퇴근·빚 → 김보미 본인 진술.","⑥ 경력이라는 보증금 → 김보미 기존 발언(신동아 서면, 발언 대시보드 2805 \"경력이 없어서 일을 못 하고, 일을 못 해서 경력이 없다\"). 국가데이터처도 원인으로 \"경력직 선호·수시채용\"을 꼽음. [청년층 부가조사]","⑦ 청년 취업자 47개월 연속 감소, 금융위기 이후 최장 → 2026년 9월 고용동향(10.16 발표), 15~29세 −14만 7천 명, 2022년 11월부터. [스마트투데이]","⑧ 졸업 후 취업경험 84.8%, 2004년 통계 이후 최저 → 2026년 5월 청년층 부가조사(7.23 발표). [KDI 요약·SBS Biz]","⑨ 25~34세 고등교육 이수율 71.1% OECD 1위 / 대졸 고용률 80.1% vs OECD 86.0% → OECD 교육지표 2026(9.29 발표). 고용률은 25~64세 기준. [파이낸셜뉴스]","⑩ 28세 군의원·32세 최연소 의장·업무추진비 공개·유튜브 중계 → [오마이뉴스·인물 정리] / 불신임안 → 2024.1 의원 6명 제출 [경향신문 2024.5.25] / 기탁금 다섯 군데 → 김보미 7월 발언(대시보드 905).","⑪ 서울 대학 기숙사 수용률 16.8% 전국 최저, 수도권 18.1%(2020) → 17.7%(2025) → 대학알리미 공시 수도권 73개 대학 분석. [이투데이 10.15]","⑫ 청년 월세 지원 월 20만 원 → 국토부, 2026.3 상시화, 최대 24개월. 20만 ÷ 67.8만 = 29.5% → \"3분의 1이 안 된다\". [뉴시스 3.18]","⑬ 청년취업보장제 → 김보미 당대표 공약(신동아·다청년 발대식). 정부 2027 신설 \"K-유스개런티·청년 첫취업 지원제도\"와 이름이 비슷하니 차이를 물으면 3236 카드.","⑭ 오스트리아 2024년 1만 1,713명 훈련 보장 → 오스트리아 사회부. [사회부 원문]","⑮ 지방 청년 취업까지 석 달 넘게 더 → 고용정보원 청년패널: 비수도권 24.6개월 vs 수도권 21.2개월(차이 3.4개월). [쿠키뉴스]","⑯ 당 예산 10% 청년 편성 → 김보미 당대표 공약. [프레시안 7.16] / 서울시 청년 천여 명 77억 원 → 2023년 예산 청년자율예산. [서울시]","⑰ 계란으로 바위, 바위에 금 → 김보미 출마선언·이맘때(광주KBS) 답변. [중앙일보 인터뷰]","⑱ 렌터카에서 노트북 들고 쪽잠 → 김보미 정치시그널 Q2(8.27)·전격시사(8.12) 발언 그대로.","⑲ 성적표는 세율표가 아니라 청년이 오늘 밤 어디서 자느냐 → 김보미 전격시사(8.12) 답변 그대로.","⑳ 폐버스 하우스 → 2026년 8월 황희 의원 제안, 2030 반발 뒤 사과. 김보미는 8.12 전격시사·8.27 정치시그널에서 같은 비판. [아시아경제 8.10·SBS Biz] / 그늘길 지도 앱 → 2026년 8월 폭염 때 화제(그늘로). [뉴시스 8.6]"],"notes":["①②는 실거래 플랫폼(국토부 실거래가 기반) 수치입니다. 원자료는 국토부 실거래가 공개시스템에서 같은 주소로 다시 확인할 수 있습니다."],"src":[["창천동 원룸 매매 실거래(집품)","https://zippoom.com/browse/%EC%84%9C%EC%9A%B8-%EC%84%9C%EB%8C%80%EB%AC%B8%EA%B5%AC-%EC%B0%BD%EC%B2%9C%EB%8F%99/%EB%B9%8C%EB%9D%BC-%EB%A7%A4%EB%A7%A4"],["강진군 30평대 아파트 시세·실거래(리치고)","https://m.richgo.ai/realty/apt-hub/%EC%A0%84%EB%82%A8%EA%B4%91%EC%A3%BC/%EA%B0%95%EC%A7%84%EA%B5%B0/30%ED%8F%89%EB%8C%80"],["서울 주요 대학가 원룸 월세, 연세대 인근 67.8만(SBS Biz·다방 2026.8.11)","https://biz.sbs.co.kr/amp/article/20000327969"],["승원팰리체 리버시티 전용84㎡ 34평형 226세대(장강뉴스)","https://www.jgynews.com/news/articleView.html?idxno=33434"],["승원팰리체 리버시티 10년 민간임대(강진일보)","https://www.nsori.com/news/articleView.html?idxno=23309"],["2026년 5월 청년층 부가조사(국가데이터처, KDI 요약)","https://eiec.kdi.re.kr/policy/materialView.do?num=284575"],["2026년 9월 고용동향, 청년 취업자 47개월 감소(스마트투데이)","https://www.smarttoday.co.kr/ko-kr/articles/112773"],["졸업 후 1년 이상 미취업 48.6%(SBS Biz 2026.7.23)","https://biz.sbs.co.kr/amp/article/20000324195"],["OECD 교육지표 2026(파이낸셜뉴스 2026.9.29)","https://www.fnnews.com/news/202609291351196534"],["김보미 경력·의정활동(오마이뉴스 2026.7.13)","https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003250922"],["김보미 의원 프로필(업무추진비 공개·수의계약·유튜브 중계)","https://histale.com/p/%EA%B9%80%EB%B3%B4%EB%AF%B8-%EB%AF%BC%EC%A3%BC%EB%8B%B9-1989/A"],["최연소 의장의 수난, 불신임안(경향신문 2024.5.25)","https://www.khan.co.kr/article/202405250900051"],["수도권 대학 기숙사 수용률, 서울 16.8%(이투데이 2026.10.15)","https://etoday.co.kr/news/view/2635271"],["청년 월세 지원 상시화 20만×24개월(뉴시스 2026.3.18)","https://mobile.newsis.com/view/NISX20260318_0003552925"],["오스트리아 훈련 보장 2024년 1만1,713명(오스트리아 사회부)","https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsmarkt/Arbeitsmarktfoerderungen/Jugendliche-und-junge-Erwachsene.html"],["고용정보원 청년패널, 비수도권 24.6개월(쿠키뉴스)","https://www.kukinews.com/article/view/kuk202511270015"],["당 예산 10% 청년 편성 공약(프레시안 2026.7.16)","https://pressian.com/pages/articles/2026071617485205196"],["서울시 청년자율예산(서울시)","https://news.seoul.go.kr/gov/archives/541685"],["계란으로 바위(중앙일보 인터뷰 2026.8)","https://www.koreadaily.com/article/20260804081433969"],["민주당 황희 '폐버스 주택' 제안 후폭풍(아시아경제 2026.8.10)","https://view.asiae.co.kr/article/2026081008325546534"],["\"우리가 집이 없지, 자존심이 없나\" 청년 버스하우스에 2030 폭발(SBS Biz)","https://biz.sbs.co.kr/amp/article/20000327564"],["\"그늘진 길만 알려준다\" 폭염에 뜬 지도앱(뉴시스 2026.8.6)","https://www.newsis.com/view/NISX20260806_0003738660"],["📼 김보미 원래 답변 — 정치시그널 Q2 렌터카 쪽잠","#card/3002"],["📼 김보미 원래 답변 — 전격시사 8.12 버스하우스·부동산","#card/2707"]]},{"no":3203,"media":"연세대 토론회(10.27)","q":"【기조발언 · 1분 30초 압축본】 시간이 짧으면 이것만","tags":["기조발언","압축"],"quotes":[],"script":["★ 여러분 학교 앞 8평 원룸이 올해 6월 5억 3천만 원에 팔렸습니다. 제 고향 강진 34평 아파트보다 세 배 비쌉니다. 저는 강진에서는 34평 임대아파트에 사는데, 지금 일하는 곳 근처에선 방 한 칸을 못 구해서 화성 언니 집에서 출퇴근합니다. 여러분은 오죽하겠습니까?","★ 요즘 청년은 일자리를 얻을 때도 보증금을 냅니다. 경력이라는 보증금입니다. 청년 취업자는 47개월째 줄었고, 졸업하고 한 번이라도 일해 본 청년은 역대 최저입니다. 여러분이 공부를 덜 해서가 아니라, 이 사회가 받는 보증금이 너무 비싸서입니다.","★ 저는 민주당이지만 틀린 건 틀렸다고 말하겠습니다. 정답은 정당이 아니라 국민에게 있습니다.","★ 세 가지입니다. 하나, 공공이 가진 방부터. 서울 대학 기숙사 수용률 16.8%, 전국 꼴찌입니다. 둘, 첫 일자리의 경력 보증금은 나라가 대신 내는 청년취업보장제. 셋, 청년 예산은 청년이 직접 짜게. 청년 주거 정책을 청년 없이 만드니 폐버스 이야기가 나옵니다.","★ 계란으로 바위를 쳤고 계란은 깨졌지만, 바위에 금은 갔습니다. 오늘 질문엔 보증금 안 받겠습니다."],"notes":["약 420자(공백 제외), 1분 30초. 근거는 3202 카드와 같음."],"src":[["창천동 원룸 매매 실거래(집품)","https://zippoom.com/browse/%EC%84%9C%EC%9A%B8-%EC%84%9C%EB%8C%80%EB%AC%B8%EA%B5%AC-%EC%B0%BD%EC%B2%9C%EB%8F%99/%EB%B9%8C%EB%9D%BC-%EB%A7%A4%EB%A7%A4"],["강진군 30평대 아파트 시세·실거래(리치고)","https://m.richgo.ai/realty/apt-hub/%EC%A0%84%EB%82%A8%EA%B4%91%EC%A3%BC/%EA%B0%95%EC%A7%84%EA%B5%B0/30%ED%8F%89%EB%8C%80"],["2026년 9월 고용동향, 청년 취업자 47개월 감소(스마트투데이)","https://www.smarttoday.co.kr/ko-kr/articles/112773"],["2026년 5월 청년층 부가조사(국가데이터처, KDI 요약)","https://eiec.kdi.re.kr/policy/materialView.do?num=284575"],["수도권 대학 기숙사 수용률, 서울 16.8%(이투데이 2026.10.15)","https://etoday.co.kr/news/view/2635271"]]},{"no":3204,"media":"연세대 토론회(10.27)","q":"【의제 1】 청년 주거 환경, 무엇을 우선적으로 바꿔야 하는가? (토론 중 1~2분)","tags":["의제1","주거","기숙사","관리비","월세지원"],"quotes":[],"script":["★ 월세 그 자체입니다. 안전도 통학도 중요합니다. 그런데 돈이 없으니까 어두운 골목, 먼 동네로 밀려나는 겁니다. 세 문제의 뿌리는 하나입니다.","★ 학생회가 든 희망하우징을 보겠습니다. 시세의 30%, 월세 9만~15만 원. 좋은 제도입니다. 그런데 올해 1차 모집이 18호였습니다. 제도가 있다는 것과 들어갈 방이 있다는 건 다른 이야기입니다. 몇 실을 언제까지 늘릴지 숫자로 약속하고, 지었는지 공개해야 합니다.","★ 순서가 있습니다. 첫째, 공공이 가진 방입니다. 서울 대학 기숙사 수용률 16.8%, 전국 꼴찌입니다. 수도권 대학은 5년 동안 재학생이 2만 7천 명 늘었는데 기숙사 자리는 2천 개 늘었습니다. 대학 부지와 국공유지에 기숙사를 짓고, 연도별 숫자로 약속하게 해야 합니다.","둘째, 안전과 통학입니다. 학생회 자료에도 \"늦은 시간 안심하고 다닐 수 있는 주거환경\"이 적혀 있습니다. 그런데 서울시 안심귀가스카우트 예산은 2022년 37억 원에서 올해 12억, 내년 안은 6억 원입니다. 여학생들은 안전을 월세로 삽니다. 마포·서대문 여성전용 원룸이 일반 원룸보다 월 5만~20만 원 비쌉니다. 안전은 공공이 책임질 일입니다.","(통학도 돈입니다. 서울과 붙은 경기 11개 시 주민 57%가 편도 1시간 넘게 걸립니다. 청년 기후동행카드 5만 5천 원은 좋은 정책입니다. 다만 경기에서 오는 학생에겐 반쪽이라, 경기·인천과 같이 쓰는 정기권이 답입니다.)","셋째, 관리비입니다.","넷째, 월세 지원을 현실에 맞게 올리는 겁니다. 지금 20만 원은 학교 앞 월세의 3분의 1이 안 됩니다. 저는 월 30만 원으로 올려야 한다고 봅니다.","(다섯째, 서울과 지방을 같이 봐야 합니다. 서울은 방이 없어 난리인데 제 고향 강진은 빈집이 늘어 갑니다. 서울 청년의 주거 절망과 지방 청년의 일자리 절망은 같은 문제의 양면입니다. 수도권에 짓는 정성의 절반만 지방 빈집을 청년 집으로 바꾸는 데 써 주십시오. 지방이 살아야 여러분 학교 앞 월세도 내려갑니다.)","★ 청년은 낼 세금이 없어서 힘든 게 아니라, 들어갈 집이 없어서 힘듭니다. 세입자 대책이 곧 청년 대책입니다.","★ 부동산 정책의 성적표는 세율표에 있지 않습니다. 청년이 오늘 밤 어디서 자느냐에 있습니다."],"notes":["\"청년은 낼 세금이 없어서…\"·\"세입자 대책이 곧 청년 대책\"은 8월 전격시사·정치시그널 답변(대시보드 2707·3010)과 같은 말. 일관성 유지.","\"월 30만 원으로\"는 과거 교차점검(2853)에서 정한 표현.","강진 빈집·5만 호 정성의 절반·성적표 문장은 전격시사 8.12(2707), 서울 주거 절망·지방 일자리 절망 양면은 불교방송(119) 답변과 같은 말.","희망하우징: 시세 30%, 보증금 100만~109만 원, 최장 4년. 2026년 1차 모집 18호(정릉·연남·내발산). 최근 공고 5건은 모두 공공기숙사 잔여세대. 2013·2017년에는 공실 37~50%가 문제였음(3인 공유 구조).","안심귀가스카우트 예산 37억(2022)→12억(2025)→6억(2026안), 인력 334명→60명. 여성전용 원룸 월세 격차는 서울신문 2024.2 기사.","연세대 인근 원룸 월세+관리비 75.8만 원(2026.7, 고방). 기조발언의 67.8만 원(다방, 7월)과 출처가 다르니 하나만 쓸 것."],"src":[["수도권 대학 기숙사 수용률, 서울 16.8%(이투데이 2026.10.15)","https://etoday.co.kr/news/view/2635271"],["서울 주요 대학가 원룸 월세, 연세대 인근 67.8만(SBS Biz·다방 2026.8.11)","https://biz.sbs.co.kr/amp/article/20000327969"],["청년 월세 지원 상시화 20만×24개월(뉴시스 2026.3.18)","https://mobile.newsis.com/view/NISX20260318_0003552925"],["대학가 월세+관리비 평균 70.9만(파이낸셜뉴스 2026.10.9)","https://www.fnnews.com/news/202610090343485982"],["📼 김보미 원래 답변 — 전격시사 8.12 버스하우스·부동산","#card/2707"],["📼 김보미 원래 답변 — 정치시그널 Q10 세입자 대책","#card/3010"],["📼 김보미 원래 답변 — 불교방송 청년과 부동산","#card/119"],["희망하우징 2026년 1차 모집 18호(고방 2026.5.13)","https://gobang.kr/contents/7859"],["희망하우징 임대조건(내 손안에 서울 2018.5.9)","https://mediahub.seoul.go.kr/archives/1155750"],["희망하우징 다가구 공실 37%(서울신문 2017.2.6)","https://m.go.seoul.co.kr/news/2017/02/06/20170206500149"],["안심귀가스카우트 예산 37억→6억(서울신문 2025.11.17)","https://m.go.seoul.co.kr/news/2025/11/17/20251117500262"],["여성전용 원룸 월세 5만~20만 원 더(서울신문 2024.2.12)","https://m.seoul.co.kr/news/2024/02/12/20240212500098"],["경기 11개 시 57% 편도 1시간 이상(SBS Biz 2026.10.6)","https://biz.sbs.co.kr/amp/article/20000338571"],["기후동행카드 청년 5만 5천 원(서울시 2025.9.24)","https://news.seoul.go.kr/traffic/archives/514914"],["청년가구 최저주거기준 미달 8.2%(참여연대 2026.5.13)","https://peoplepower21.org/youth/2022703"],["선관위 「제9회 지방선거 정책이슈 선정을 위한 빅데이터 분석」(2026.3, 핀인사이트)","https://policy.nec.go.kr/plc/promotion/initUPRPromotionDetail.do?no=89"]]},{"no":3205,"media":"연세대 토론회(10.27)","q":"【의제 2】 열심히 준비해도 취업이 어려운 사회, 청년 일자리 정책은 어디서부터? (1~2분)","tags":["의제2","일자리","첫일자리","청년취업보장제","계약직"],"quotes":[],"script":["★ 첫 직장 문턱부터입니다. 기업이 신입 대신 경력을 찾는 건 신입을 가르치는 비용을 혼자 지기 싫어서입니다. 그 비용을 나라가 나눠 지면 됩니다. 그게 제가 말하는 청년취업보장제입니다.","★ 그래서 저는 청년의 취업을 국가가 책임지는 '국가청년취업보장제'를 도입해야 한다고 말해 왔습니다.","★ 첫 단추가 평생을 좌우합니다. 국회예산정책처 분석을 보면 계약직으로 시작한 청년 셋 중 하나는 지금도 계약직입니다. 정규직으로 시작한 청년은 다섯 중 하나도 안 됩니다. 그래서 일자리 숫자만큼 첫 일자리의 질이 중요합니다.","그리고 정권 바뀔 때마다 청년 정책 이름이 바뀝니다. 내일채움공제는 생겼다 없어졌고, 도약계좌는 미래적금으로 바뀌었습니다. 국회예산정책처도 청년 자산형성 사업이 6개 부처 10개로 겹친다고 했습니다. 청년은 정책을 믿고 계획을 짜야 하는데, 나라가 계획을 자꾸 바꿉니다.","★ 지방은 사다리가 통째로 없습니다. 배울 곳, 일할 곳, 정착할 곳. 이 세 사다리를 지역 안에 놓아야 합니다. 공장을 지어도 사람이 없으면 수도권에서 데려오고, 지역 청년은 구경꾼이 됩니다. 호남 청년이 공무원 시험이 아니라 AI와 반도체에서 꿈을 키울 수 있어야 합니다.","(군대도 첫 직장이 될 수 있습니다. 월급을 제대로 받고 첨단 기술을 배우고 전역할 때 경력과 가산점을 들고나오는, 내가 선택해서 가는 첫 직장으로 군대를 바꿔야 합니다.)","★ 청년 정책의 성적표는 몇 명한테 얼마 줬냐가 아니라, 3년 뒤 그 청년이 어디서 무엇을 하고 있느냐여야 합니다.","(학생회 자료에 18.4개월이라는 숫자가 나왔는데, 찾아보니 그건 첫 직장에서 버티는 평균 기간이었습니다. 어렵게 들어간 첫 직장을 열에 일곱이 1년 반 만에 그만둡니다. 들어가기도 어렵고, 버티기도 어렵습니다.)"],"notes":["\"3년 뒤 어디서 무엇을\"은 신동아 답변(2804)·이맘때 Q8(2911)과 같은 말.","세 사다리·구경꾼·공무원 시험 대신 AI·반도체는 이맘때 Q12(2915)·KBC Q10(1611)·무등일보(1226) 답변과 같은 말.","계약직 출발 34.5% vs 정규직 출발 18.7%.","\"국가청년취업보장제를 도입해야\"는 머니투데이 답변(2413), 군대를 첫 직장으로는 정치시그널 돌발 6(3020) 답변 그대로."],"src":[["국회예산정책처 「청년층 첫 직장 현황」(2026.5.2 보도)","https://v.daum.net/v/20260502202635766"],["첫 직장 퇴사 70.7%·근속 18.4개월(헤럴드경제 2026.5.4)","https://www.heraldk.com/article/2026050404000057847"],["청년자산형성 6개 부처 10개 사업 중복(국회예산정책처)","https://www.nabo.go.kr/ko/notice/releasesView.do?idx=8981"],["청년도약계좌 해지율 15.3%(한경비즈니스)","https://magazine.hankyung.com/business/article/202508051953b"],["2026년 5월 청년층 부가조사(국가데이터처, KDI 요약)","https://eiec.kdi.re.kr/policy/materialView.do?num=284575"],["📼 김보미 원래 답변 — 이맘때 Q12 세 사다리","#card/2915"],["📼 김보미 원래 답변 — KBC Q10 반도체·사람","#card/1611"],["📼 김보미 원래 답변 — 이맘때 Q8 청년 정책 만들기","#card/2911"],["📼 김보미 원래 답변 — 신동아 Q5 경력의 모순","#card/2805"],["📼 김보미 원래 답변 — 머니투데이 국가청년취업보장제","#card/2413"],["📼 김보미 원래 답변 — 정치시그널 선택적 모병제","#card/3020"]],"warn":"18.4개월 이야기는 학생회 발제문 숫자를 바로잡는 것이라, 학생 체면을 생각해 \"제가 찾아보니 이런 뜻이었다\"는 말투로만 하십시오."},{"no":3210,"media":"연세대 토론회(10.27)","q":"【의제 2 · AI】 AI는 청년에게 위협인가, 기회인가 — 학생들에게 되묻고, 내 경험으로 '경력 쌓을 일자리가 없다'까지 (2분)","tags":["의제2","AI","일자리","경력","국가청년취업보장제","김보미365","재정주권시민행동","되묻기"],"quotes":[],"script":["★ 오늘은 제가 여러분께 하나 여쭙고 싶습니다. AI가 여러분에게 위협입니까, 기회입니까? 정치인이 답을 들고 온 게 아니라, 정말 궁금해서 묻는 겁니다. 이따 질문 시간에 꼭 들려주십시오.","★ 제가 본 사례부터 말씀드리겠습니다. 미국 패서디나의 한 고등학생이 NASA가 10년 넘게 쌓아 둔 적외선 망원경 자료 2천억 건을 혼자 AI 모델로 돌려서, 아무도 몰랐던 천체 150만 개를 찾아냈습니다. 혼자 쓴 논문이 천문학 학술지에 실렸고, 상금으로 25만 달러를 받았습니다. 열여덟 살입니다. 예전 같으면 박사 수십 명이 수십 년 걸릴 일을, 고등학생이 집에서 했습니다. 엄두도 못 내던 꿈이 AI로 실현되는 시대입니다.","★ 저도 그렇게 삽니다. 당대표 경선 때 말씀드렸습니다. \"저는 AI를 직접 활용하는 디지털 세대입니다.\" 군수 경선에서 떨어진 뒤 공약을 지키려고 '김보미365'를 직접 만들었습니다. 강진군 예산과 집행내역, 계약현황, 민원 담당부서까지 핸드폰으로 확인할 수 있는 웹사이트입니다. 하다 보니 전국 243개 지자체와 중앙정부 예산을 동네 이름만 치면 3초 만에 보여 주는 '나라살림 돋보기'까지 만들었고, 지금은 재정주권시민행동 공동대표로 '예산 바로보기' 운동을 전국으로 넓히고 있습니다. 오늘 이 토론 준비도 AI와 같이 했습니다.","★ 예전엔 개발자를 못 구해서, 돈이 없어서, 시간이 너무 많이 들어서 엄두를 못 내던 일들입니다. 그걸 요즘은 날 새는 줄 모르고 합니다. 저한테 AI는 분명히 기회입니다.","★ 그런데 바로 거기서 걱정이 시작됩니다. 전에는 그 일을 하려면 개발자 몇 명, 자료 정리하는 신입 몇 명이 몇 달을 붙어야 했습니다. 그 자리가 청년이 첫 경력을 쌓던 일자리였습니다. 지금은 저 혼자 AI로 끝냅니다. AI가 다 해 주니까, 경력을 쌓을 일자리 자체가 없어지는 겁니다. 경력이라는 보증금은 그만큼 더 비싸집니다.","(숫자도 있습니다. 미국 스탠퍼드 연구진이 급여 자료를 추적했더니 AI 영향이 큰 직종에서 22~25살 신입 고용만 13% 줄었고, 경력자는 오히려 늘거나 그대로였습니다. 한국은행은 우리나라 일자리 341만 개, 전체의 12%가 AI로 대체될 수 있다고 봤습니다. 먼저 사라지는 건 신입 자리입니다.)","★ 그래서 저는 당대표 후보 시절에 이렇게 말했습니다. \"정부도 AI 투자액을 발표하는 데서 끝나면 안 됩니다. AI 대전환으로 사라질 청년 일자리는 무엇인지, 새로 생길 일자리는 무엇인지, 그 일자리로 청년을 어떻게 이동시킬 것인지, 여기에 대한 대책을 내놓아야 합니다.\" 그리고 \"청년의 취업을 국가가 책임지는 '국가청년취업보장제'를 도입해야 합니다.\" 첫 경력의 보증금을 나라가 대신 내자는 겁니다. AI가 신입 자리를 없애는 속도만큼, 나라가 첫 경력을 보장하는 속도도 빨라져야 합니다.","★ 그러니 다시 여쭙겠습니다. 위협입니까, 기회입니까? 저는 둘 다라고 봅니다. 기회는 여러분이 잡을 수 있고, 위협은 정치가 막아야 합니다."],"notes":["되묻기(첫 문단)는 실제로 학생 답을 받는 걸 전제로 한다. 사회자에게 미리 \"질의응답 때 학생들 의견을 듣고 싶다\"고 말해 둘 것.","따옴표 안 문장은 김보미가 실제 한 말 그대로: AI 디지털 세대(SBS 뉴스브리핑 1417), 김보미365·나라살림 돋보기(이맘때 2914, SBS 1419, 전격시사 2718), 'AI 대전환으로 사라질 청년 일자리'(신동아 2806), '국가청년취업보장제 도입'(머니투데이 2413).","고등학생 사례: 마테오 파즈(Matteo Paz), 패서디나고 3학년, 칼텍 IPAC 여름 프로그램에서 NEOWISE 자료(측정값 약 2천억 건)를 자체 AI 모델 VARnet으로 분석, 150만 개 미등록 천체 발견, 단독 저자 논문 The Astronomical Journal, 2025 리제네론 과학경진대회 1등 25만 달러. 기사 기준 나이 18세. '위성'이 아니라 '천체(변광 천체)'다. 무대에서는 이름까지 말할 필요 없음.","스탠퍼드: Brynjolfsson·Chandar·Chen 「Canaries in the Coal Mine」(2025.8), 미국 최대 급여 소프트웨어사 자료, AI 노출 상위 직종 22~25세 고용 13% 상대 감소. 한국은행: BOK이슈노트 「AI와 노동시장 변화」(2023.11), 341만 개·12%.","3205(의제2 본답변) 뒤에 붙이거나, 학생 질문에 AI가 나오면 이 카드로 받는다. 2분이 길면 ( ) 문단을 뺀다."],"warn":"'위성 위치를 찾아냈다'고 말하지 말 것 — 망원경 자료에서 천체를 찾아낸 사례다. 한국은행 341만 개는 '대체 가능' 추정이지 실제 사라진 숫자가 아니다.","src":[["고교생 AI 모델로 NEOWISE 자료에서 150만 천체 발견(R&D World 2025.4.14)","https://www.rdworldonline.com/high-school-students-ai-model-spots-1-5-million-unknown-objects-in-nasa-neowise-data/"],["Matteo Paz, Regeneron STS 25만 달러(ExplorersWeb)","https://explorersweb.com/high-schooler-uncovers-1-5-million-hidden-objects-in-space-wins-250k/"],["스탠퍼드 SIEPR 「Canaries in the Coal Mine」(2025.8)","https://siepr.stanford.edu/publications/working-paper/canaries-coal-mine-six-facts-about-recent-employment-effects-artificial"],["한국은행 「AI와 노동시장 변화」 341만 개 대체 가능(메트로 2023.11.16)","https://www.metroseoul.co.kr/article/20231116500507"],["📼 김보미 원래 답변 — SBS 뉴스브리핑 'AI 직접 활용하는 디지털 세대'","#card/1417"],["📼 김보미 원래 답변 — 이맘때 Q11 김보미365·243개 지자체","#card/2914"],["📼 김보미 원래 답변 — SBS 확정대본 김보미365 직접 개발","#card/1419"],["📼 김보미 원래 답변 — 신동아 Q6 AI 대전환 일자리 대책","#card/2806"],["📼 김보미 원래 답변 — 머니투데이 국가청년취업보장제 도입","#card/2413"],["📼 김보미 원래 답변 — 신동아 Q1 AI 경쟁·청년 일자리에 답하는 정치","#card/2801"]]},{"no":3206,"media":"연세대 토론회(10.27)","q":"【학생회 질문】 8년 지방의원 하면서 조례·정책으로 무엇을 만들었나?","tags":["의정활동","업무추진비","육아수당","공개","조례","청년연령","청년기본조례"],"quotes":[],"script":["★ 제가 제일 자랑하고 싶은 건 조례보다 공개입니다. 의장이 되고 업무추진비를 전부 홈페이지에 올렸습니다. 관행적인 수의계약을 손봤고, 본회의와 위원회를 유튜브로 생중계했습니다. 군민이 볼 수 있으면 정치가 달라집니다.","대가도 있었습니다. 불신임안이 들어왔습니다. 그래도 공개는 한 번 시작하면 되돌리기 어렵습니다. 그래서 의원을 그만두고도 시민이 동네 예산을 직접 볼 수 있는 재정 공개 플랫폼을 만들었습니다.","★ 제가 의장일 때 우리 의회가 전남 최초로 육아양육수당 조례를 만들었습니다. 아이 한 명당 월 60만 원입니다. 시행 전후 같은 기간 출생아가 83명에서 128명으로 늘었습니다. 대표발의는 같은 청년 의원인 노두섭 운영위원장이 했습니다. 청년 의원 둘이 있으니 의회가 달라졌습니다.","제가 의장일 때 청년기본조례의 청년 나이를 49세에서 45세로 낮췄습니다. 농어촌과 도시는 사정이 달라서 시군마다 청년 나이를 따로 정합니다.","★ 그런데 청년 나이를 45세, 50세로 잡으면 한 세대가 통째로 같이 들어옵니다. 아빠가 청년회에 계시는데 아들딸이 나오겠습니까? 진짜 청년은 활동을 안 하게 됩니다. 세대는 건너뛸 수 있어야 합니다.","★ 청년 나이는 낮을수록 진짜 청년이 혜택을 받고, 진짜 청년이 참여합니다."],"notes":["육아양육수당 조례는 김보미 대표발의가 아님(본인 확인 2026.10.19). 의장 재임 중 의회 성과로만 말할 것.","출생아 +54.2%는 강진군 자체 통계라 외부 검증이 아님. \"군 통계로 보면\"을 붙이면 안전.","45세로 낮춘 이유는 김보미 설명(2026.10.21) 그대로. \"나라는 34세로 넓히는데 강진은 왜 줄였나\"가 나오면 3244 카드 둘째 문단으로 답하십시오."],"src":[["김보미 경력·의정활동(오마이뉴스 2026.7.13)","https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003250922"],["김보미 의원 프로필(업무추진비 공개·수의계약·유튜브 중계)","https://histale.com/p/%EA%B9%80%EB%B3%B4%EB%AF%B8-%EB%AF%BC%EC%A3%BC%EB%8B%B9-1989/A"],["최연소 의장의 수난, 불신임안(경향신문 2024.5.25)","https://www.khan.co.kr/article/202405250900051"],["강진 육아수당 출생아 +54.2%(뉴스서울)","https://newsseoul.co.kr/news/view/1065584424875698"],["강진 청년기본조례 45세 조정(미래일보 2022)","https://hkmd.kr/news/article.html?no=70232"]]},{"no":3207,"media":"연세대 토론회(10.27)","q":"【학생회 질문】 떨어져도 왜 계속 도전하나? 도전의 동력은?","tags":["도전","계란과바위","세대교체"],"quotes":[],"script":["★ 출마 선언 때 계란으로 바위를 치겠다고 했습니다. 군수 경선에서 떨어졌고, 당대표 예비경선에서도 떨어졌습니다.","★ 그런데 제가 안 나갔으면, 청년 최고위원이 왜 없어졌는지, 왜 청년한텐 원칙을 들이대고 기득권한텐 예외를 주는지 아무도 묻지 않았을 겁니다.","★ 지는 건 괜찮습니다. 아무도 안 묻는 게 무섭습니다. 그게 제 동력입니다.","(나가 보니 청년한테는 벽이 세 개였습니다. 기탁금 구하느라 반나절 쓰고 렌터카에서 쪽잠 자는 돈의 벽, 규칙과 일정을 기득권만 먼저 아는 정보의 벽, 계파 없으면 유령 취급하는 족보의 벽입니다.)","(그리고 저 혼자가 아니었습니다. 이번에 전국에서 지역을 지키는 청년 정치인들, 계란들을 많이 만났습니다. 줄 서지 말고 실력을 키우고, 흩어지지 말고 연대하자고 했습니다.)"],"notes":["괄호 부분은 이맘때(광주KBS) 답변(2906·2908)·전격시사 세 개의 벽(2729)과 같은 말."],"src":[["계란으로 바위(중앙일보 인터뷰 2026.8)","https://www.koreadaily.com/article/20260804081433969"],["김보미 경력·의정활동(오마이뉴스 2026.7.13)","https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003250922"],["📼 김보미 원래 답변 — 전격시사 세 개의 벽","#card/2729"]]},{"no":3208,"media":"연세대 토론회(10.27)","q":"【그동안 한 말 → 토론에 녹인 것】 이미 방송에서 한 말이라 자신 있게 (원래 답변 링크는 맨 아래 📼)","tags":["그동안한말","일관성","폐버스","렌터카","그늘길","세사다리"],"quotes":[],"script":["★ 렌터카에서 노트북 들고 쪽잠 → 기조발언 도입·폐버스 답변 (정치시그널 Q2·전격시사 8.12)","★ 본인들은 넓은 집에 살면서 청년에게는 폐버스를 던져 주니 분노한 것 → 기조발언 셋째·민주당 지적 ⑤ (정치시그널 Q11·전격시사)","★ 땡볕에 걸어 보지 않은 사람은 그늘길 앱 같은 정책을 못 만든다 → 기조발언 셋째 (이맘때 Q8·한겨레21)","★ 청년 정책의 공급자를 기성 정치인에서 청년 당사자로 → 기조발언 셋째 (이맘때 Q8·이데일리 Q9)","★ 던져 놓고 지우는 정치도, 조롱만 하는 정치도 청년의 잠자리는 못 지킨다 → 민주당 지적 ⑤·개혁신당 공격 ⑧ (전격시사)","★ 청년은 낼 세금이 없어서가 아니라 들어갈 집이 없어서 힘들다 / 세입자 대책이 곧 청년 대책 → 의제 1 (전격시사·정치시그널 Q10)","★ 부동산 정책의 성적표는 청년이 오늘 밤 어디서 자느냐 → 기조발언 하나·의제 1 마무리 (전격시사)","★ 서울은 방이 없어 난리, 강진은 빈집이 늘어 간다 / 서울 주거 절망과 지방 일자리 절망은 양면 → 의제 1 넷째 (전격시사·불교방송)","★ 배울 곳·일할 곳·정착할 곳, 세 사다리를 지역 안에 / 지역 청년은 구경꾼 → 의제 2 (이맘때 Q12·KBC·TV조선)","★ 경력이 없어서 일을 못 하고, 일을 못 해서 경력이 없다 → 기조발언 보증금 (신동아 Q5)","★ 성적표는 3년 뒤 그 청년이 어디서 무엇을 하는가 → 의제 2 (신동아·이맘때 Q8)","★ 청년이 민주당을 떠난 게 아니라 민주당이 먼저 청년을 떠났다 / 분노보다 무서운 게 무관심 → 민주당 지적 ① (이맘때 Q6)","★ 돈의 벽·정보의 벽·족보의 벽 → 도전 동력 (전격시사)","★ 20대 꼰대, 60대 청년 / 사람이 아니라 판의 문제 → 이준석 36세 질문 (한겨레21)","★ 계란으로 바위, 바위에 금 → 기조발언 마무리 (출마선언·여러 방송)","★ 청년의 취업을 국가가 책임지는 '국가청년취업보장제'를 민주당의 핵심 정책으로 도입해야 합니다 → 의제 2 (머니투데이)","★ 내가 선택해서 가는 첫 직장으로 군대를 바꿔야 합니다 / 징병제는 단계적 모병제로, 군 복무자는 가산점과 보상 → 의제 2 괄호·모병제 질문 (정치시그널 돌발 6·뉴스바사삭)"],"notes":["카드 아래 📼 링크를 누르면 그 방송에서 실제로 한 답변 카드가 바로 열립니다.","같은 말을 같은 단어로 하면 \"말 바꾼다\"는 공격을 받지 않습니다."],"src":[["📼 김보미 원래 답변 — 정치시그널 Q2 렌터카 쪽잠","#card/3002"],["📼 김보미 원래 답변 — 전격시사 세 개의 벽","#card/2729"],["📼 김보미 원래 답변 — 정치시그널 Q11 폐버스","#card/3011"],["📼 김보미 원래 답변 — 전격시사 8.12 버스하우스·부동산","#card/2707"],["📼 김보미 원래 답변 — 이맘때 Q8 청년 정책 만들기","#card/2911"],["📼 김보미 원래 답변 — 한겨레21 Q11 청년 정치","#card/2611"],["📼 김보미 원래 답변 — 이데일리 Q9 2030 이탈","#card/2308"],["📼 김보미 원래 답변 — 정치시그널 Q10 세입자 대책","#card/3010"],["📼 김보미 원래 답변 — 불교방송 청년과 부동산","#card/119"],["📼 김보미 원래 답변 — 이맘때 Q12 세 사다리","#card/2915"],["📼 김보미 원래 답변 — KBC Q10 반도체·사람","#card/1611"],["📼 김보미 원래 답변 — TV조선 Q6 전남은 사람이 떠나는 걱정","#card/2387"],["📼 김보미 원래 답변 — 신동아 Q5 경력의 모순","#card/2805"],["📼 김보미 원래 답변 — 이맘때 Q6 청년 정치 불신","#card/2909"],["📼 머니투데이 국가청년취업보장제","#card/2413"],["📼 정치시그널 선택적 모병제","#card/3020"],["📼 뉴스바사삭 미래형 민주당","#card/910"]],"warn":"경선 때 숙박 장면은 과거에 \"렌터카 쪽잠\" / \"방 얻기를 포기하고 오가는 편\" / \"뿔뿔이 흩어져 잤다\" 세 가지가 섞여 나왔습니다(교차점검 2852). 이번엔 최근 방송과 같은 \"렌터카에서 노트북 들고 쪽잠\" 하나로만 말씀하십시오."},{"no":3211,"media":"연세대 토론회(10.27)","q":"【개혁신당 공격 ①】 \"전월세 대란은 이재명 정부가 전세를 없앤 탓입니다. 민생 내란입니다.\"","tags":["이준석","전월세","공공임대","착공"],"quotes":[],"script":["★ 대출 규제에 청년 실수요자가 같이 맞은 건 맞습니다. 저도 고쳐야 한다고 말해 왔습니다. 틀린 건 틀렸다고 하겠습니다.","★ 그런데 공공임대 착공을 멈춘 건 지난 정부입니다. LH 공공주택 착공이 2023년 1만 1천 호로 10년 사이 가장 적었고, 장기공공임대 융자 예산은 연평균 18.8% 줄었습니다. 그때 안 지은 방이 지금 전세난으로 돌아온 겁니다.","누구 탓을 하자는 게 아닙니다. 지금 이 방 학생들한테 필요한 건 방입니다. 언제, 몇 호를 지을지 같이 이야기하시죠."],"notes":["개혁신당(이준석 전 대표)이 써 온 숫자: 본인 동탄 전셋집 2년 새 약 2억 상승, 서울 아파트 전셋값 61주 연속 상승(4월 기준)."],"src":[["이준석 \"전월세 대란은 정부 탓\"·동탄 2억(헤럴드경제 2026.4.14)","https://www.heraldk.com/article/2026041423510949260"],["이준석 \"민생 내란\"·61주 상승(인사이트 2026.4.23)","https://www.insight.co.kr/news/551358"],["LH 공공주택 착공 2023년 1.1만호(아이뉴스24)","https://www.inews24.com/view/2012115"],["장기공공임대 예산 삭감(참여연대 2023.11)","https://peoplepower21.org/stablelife/1951231"],["10·15 대책, 2030 주담대 42.5% 감소(헤럴드경제)","https://www.heraldk.com/article/2025101517300227331"]],"warn":"\"민생 내란\"이라는 단어를 받아서 되받아치지 마십시오. 학생들 앞에서 내란이라는 단어 싸움은 둘 다 손해입니다."},{"no":3212,"media":"연세대 토론회(10.27)","q":"【개혁신당 공격 ②】 \"민주당 의원 중 다주택자가 25명입니다. 그분들 집 파셨습니까?\"","tags":["이준석","다주택","내로남불"],"quotes":[],"script":["★ 국민 눈높이에 맞게 정리해야 합니다. 그건 맞습니다.","★ 저는 그 질문에서 자유롭습니다. 저는 강진에서 임대아파트에 살고, 수도권에서는 방이 없어서 언니 집에서 출퇴근합니다.","그리고 학생들 앞에서는 누가 집이 몇 채냐보다, 여기 있는 학생들이 방 한 칸 얻을 수 있느냐를 이야기했으면 좋겠습니다."],"notes":[],"src":[["이준석 민주당 다주택 의원 25명(트윅 2026.2.2)","https://www.twig24.com/news/2026/02/02/20260202500077"]]},{"no":3213,"media":"연세대 토론회(10.27)","q":"【개혁신당 공격 ③】 \"규제 풀고 용적률 올려서 민간이 많이 짓게 하면 됩니다.\"","tags":["이준석","공급","용적률","민간","영국"],"quotes":[],"script":["★ 공급은 찬성합니다. 그런데 지어도 비싸면 청년 방이 아닙니다. 지금 창천동 8평 원룸이 5억 3천만 원입니다. 누가 짓느냐보다 누구의 방이냐가 중요합니다.","시민단체들이 지난 지방선거 공약을 평가했는데, 개혁신당 주거 공약은 세입자보다 임대인 쪽에 치우쳤다는 평가를 받았습니다. 그 평가에서 우리 민주당 공약도 구체성이 낮다는 지적을 받았습니다. 둘 다 고쳐야 합니다.","★ 영국은 학생 기숙사를 민간에 맡겼더니 런던 기숙사비가 학생 생활비 대출 한도를 넘었습니다. 공공이 빠지면 학생 월세는 끝까지 오릅니다."],"notes":["영국: 런던 학생 기숙사 평균 연 1만 3,595파운드 > 생활비 대출 최대 1만 3,348파운드(2024/25, HEPI). 공부방 해외 섹션."],"src":[["참여연대 2026 지선 정당별 주거공약 평가","https://peoplepower21.org/stablelife/2023030"],["창천동 원룸 매매 실거래(집품)","https://zippoom.com/browse/%EC%84%9C%EC%9A%B8-%EC%84%9C%EB%8C%80%EB%AC%B8%EA%B5%AC-%EC%B0%BD%EC%B2%9C%EB%8F%99/%EB%B9%8C%EB%9D%BC-%EB%A7%A4%EB%A7%A4"],["이준석·조정훈 수도권 주거혁신포럼(데일리안 2026.9.30)","https://m.dailian.co.kr/news/view/1696182"]]},{"no":3214,"media":"연세대 토론회(10.27)","q":"【개혁신당 공격 ④】 \"지방 기피는 인프라보다 심리 문제입니다. 법인세를 지자체가 정하게 하면 기업이 갑니다.\" (2025 연세대 학식먹자 발언)","tags":["이준석","지방","법인세","균형발전"],"quotes":[],"script":["★ 강진에 살아 보면 압니다. 면소재지에 밥 먹을 식당이 없어지는 건 심리가 아닙니다.","★ 세금 몇 % 깎아 준다고 기업이 오지 않습니다. 사람, 교통, 학교가 먼저입니다. 지방끼리 세금 깎기 경쟁하면 지방 재정만 줄어듭니다.","전남 청년마을에 4,191명이 다녀갔지만 남은 사람은 68명입니다. 집만 줘도 안 남고, 세금만 깎아도 안 옵니다. 일자리와 생활이 같이 가야 합니다."],"notes":[],"src":[["이준석 연세대 학식먹자(시대 2025.5.12)","https://www.sidae.com/article/2025051214455242590"],["전남형 청년마을 4,191명 중 68명 정착(헤럴드경제 2026.6.3)","https://www.heraldk.com/article/2026060317462970644"]]},{"no":3215,"media":"연세대 토론회(10.27)","q":"【개혁신당 공격 ⑤】 \"최저임금을 지역마다 ±30% 다르게 하면 지방 일자리가 늘어납니다.\"","tags":["이준석","최저임금","지역차등"],"quotes":[],"script":["★ 그러면 지방 청년은 같은 일을 하고도 30% 덜 받습니다. 청년이 지방을 더 빨리 떠납니다.","언론 팩트체크에서도 그 공약의 해외 근거는 약하다는 평가를 받았습니다."],"notes":[],"src":[["이준석 최저임금 지역 ±30% 공약·팩트체크(노컷뉴스)","https://www.nocutnews.co.kr/news/6346286"]]},{"no":3216,"media":"연세대 토론회(10.27)","q":"【개혁신당 공격 ⑥】 \"청년취업보장제, 재원 얼마고 어떻게 합니까? 숫자로 말씀하세요.\"","tags":["이준석","재원","청년취업보장제","오스트리아"],"quotes":[],"script":["★ 새 돈부터 달라는 게 아닙니다. 정부가 내년 청년 일자리 예산을 3조 3천억 원으로 늘렸고, 청년 예산 전체는 43조 3천억 원입니다. 그런데 국회예산정책처가 청년 사업이 여러 부처에 쪼개져 겹친다고 했습니다. 이미 있는 장려금과 인턴 사업을 첫 고용 보장 하나로 묶는 데서 시작합니다.","★ 오스트리아는 25세까지 견습 자리를 나라가 보장하는데, 2024년에 1만 1,713명, 예산 약 7,140만 유로였습니다. 못 할 일이 아닙니다.","설계는 청년과 같이 하겠습니다. 청년 정책을 청년 없이 만드니까 폐버스 같은 이야기가 나옵니다."],"notes":[],"src":[["2027 노동부 청년 일자리 3.3조(헤럴드경제 2026.8.31)","https://www.heraldk.com/article/2026083122004098221"],["2027 청년예산 43.3조(관계부처 합동, KDI)","https://eiec.kdi.re.kr/policy/materialView.do?num=285992"],["청년자산형성 6개 부처 10개 사업 중복(국회예산정책처)","https://www.nabo.go.kr/ko/notice/releasesView.do?idx=8981"],["오스트리아 훈련 보장 2024년 1만1,713명(오스트리아 사회부)","https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsmarkt/Arbeitsmarktfoerderungen/Jugendliche-und-junge-Erwachsene.html"],["이준석 토론 스타일 분석(시대 2025.5.19)","https://www.sidae.com/article/2025051913323095940"],["📼 김보미 원래 답변 — 이맘때 Q8 청년 정책 만들기","#card/2911"]],"warn":"청년취업보장제 전체 소요 예산은 아직 산출한 숫자가 없습니다. 금액을 지어내지 마십시오. 계속 밀리면 \"설계는 청년과 같이\"로 받으십시오."},{"no":3217,"media":"연세대 토론회(10.27)","q":"【개혁신당 공격 ⑦】 \"정년 연장하면 청년 일자리가 어떻게 늘어납니까?\"","tags":["이준석","정년연장","세대"],"quotes":[],"script":["★ 걱정은 맞습니다. 한국은행도 정년 60세 연장 뒤 고령자 1명 늘 때 청년 고용이 0.4~1.5명 줄었다고 분석했습니다.","★ 우리 당 80년대생 의원들도 청년 빼놓고 정하지 말라고 했습니다. 정년 연장은 필요할 수 있지만, 청년 신규채용을 얼마나 보장할지부터 정해야 합니다."],"notes":[],"src":[["이준석 \"정년 연장하면 청년 일자리 어떻게\"(서울신문 2025.5.23)","https://www.seoul.co.kr/news/2025/05/23/20250523500170"],["정년연장 후 청년고용 감소, 한은 분석(머니투데이 2025.11)","https://www.mt.co.kr/economy/2025/11/24/2025112316181514504"],["민주당 80년대생 의원 \"청년 빼고 정하지 말라\"(헤럴드경제 2026.7.5)","https://www.heraldk.com/article/2026070519522272091"]],"warn":"정년 연장에 대한 김보미 최종 입장이 아직 확정되지 않았습니다. 이 답은 \"조건부\" 안입니다. 다르게 정하시면 이 카드를 고치십시오."},{"no":3218,"media":"연세대 토론회(10.27)","q":"【개혁신당·김성열 대응 원칙】 하지 말 것 / 할 것","tags":["이준석","전략","태도"],"quotes":[],"script":["★ 10.22 학생회 통보: 이준석 의원은 국회 일정으로 못 나오고, 김성열 전 개혁신당 최고위원이 나옵니다. 호칭은 \"김성열 전 최고위원님\". 아래 카드는 개혁신당 노선 대비라 그대로 씁니다.","★ 하지 말 것: 김성열 전 최고위원의 1월 경찰 참고인 조사·탈당 후 복당, 하남갑 보궐 득표, 개혁신당 지선 성적을 먼저 꺼내지 않습니다. 학생 앞 인신공격은 손해입니다.","★ 상대가 인신공격을 먼저 하면: \"정책 얘기 하시죠. 오늘은 학생들 방 이야기 하러 왔습니다.\"","★ 숫자 공세가 오면: \"출처를 같이 보시죠. 제 숫자는 전부 출처가 있습니다.\" (이 대시보드 근거표)","개혁신당 화법(이준석 전 대표 기준): 상대 공약 재원을 숫자로 캐묻고, 본인 경험을 근거로 쓰고, \"민생 내란\"·\"세대 착취\" 같은 이름을 붙이고, \"집 파실 겁니까\" 같은 반문으로 몰아붙임. 2025 대선 토론 평가에서 경청·예의 점수가 가장 낮았음.","인사 소재: 김성열 전 최고위원은 연세대 경영학과 출신입니다. \"모교에 오신 선배님과 같이 서게 돼 반갑습니다\" 정도로 가볍게."],"notes":[],"src":[["이준석 토론 스타일 분석(시대 2025.5.19)","https://www.sidae.com/article/2025051913323095940"],["이준석 대표 사퇴(메트로신문 2026.8.26)","https://www.metroseoul.co.kr/article/20260826500060"],["개혁신당 이기인 비대위(더팩트 2026.9.15)","https://news.tf.co.kr/read/ptoday/2365799.htm"],["이준석 연세대 학식먹자(시대 2025.5.12)","https://www.sidae.com/article/2025051214455242590"],["김보미 경력·의정활동(오마이뉴스 2026.7.13)","https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003250922"]]},{"no":3219,"media":"연세대 토론회(10.27)","q":"【개혁신당 공격 ⑧】 \"민주당은 청년한테 폐버스 하우스나 주는 당 아닙니까?\"","tags":["이준석","폐버스","조롱","민주당"],"quotes":[],"script":["★ 그 제안은 틀렸습니다. 저도 그때 방송에서 바로 틀렸다고 했습니다. 본인들은 넓은 집에 살면서 청년에게 폐버스를 던져 주니 청년들이 화가 난 겁니다.","★ 그런데 던져 놓고 지우는 정치도, 조롱만 하는 정치도 청년의 잠자리는 못 지킵니다. 조롱은 이제 그만하고, 오늘은 학생들 방을 몇 호, 언제 지을지 이야기하시죠.","창천동 8평 원룸이 5억 3천만 원입니다. 어느 당이 이걸 해결할 숫자를 갖고 왔는지, 학생들이 판단할 겁니다."],"notes":["이준석 의원 발언(뉴데일리 8.9 보도): \"지역구엔 고급 주거단지와 토지거래허가제 해제를 약속하신 분, 청년에겐 버스.\" \"차량 거주는 주거가 아닌 노숙 통계에 잡힌다.\" 김은혜 의원도 \"버스하우스 그렇게 좋으면 민주당부터\".","전격시사 8.12(2707)·정치시그널 Q11(3011) 답변과 같은 말.","김성열 전 최고위원도 같은 논리로 꺼낼 수 있습니다."],"src":[["이준석 \"청년에겐 버스\"(뉴데일리 2026.8.9)","https://www.newdaily.co.kr/site/data/html/2026/08/09/2026080900052.html"],["이준석 \"차량 거주는 노숙 통계\"(일요시사 2026.8.10)","https://www.ilyosisa.co.kr/mobile/article.html?no=257313"],["민주당 황희 '폐버스 주택' 제안 후폭풍(아시아경제 2026.8.10)","https://view.asiae.co.kr/article/2026081008325546534"],["황희 '폐버스' 향해 맹공…'내로남불' 지적에 민주당 수습(2026.8.9)","https://v.daum.net/v/20260809193855687"],["\"우리가 집이 없지, 자존심이 없나\" 청년 버스하우스에 2030 폭발(SBS Biz)","https://biz.sbs.co.kr/amp/article/20000327564"],["김은혜 \"버스하우스 그렇게 좋으면 민주당부터\"(경기신문)","https://www.kgnews.co.kr/news/article.html?no=906910"],["📼 김보미 원래 답변 — 전격시사 8.12 버스하우스·부동산","#card/2707"],["📼 김보미 원래 답변 — 정치시그널 Q11 폐버스","#card/3011"]],"warn":"\"틀렸다\"는 제안에 대한 평가입니다. 황희 의원 개인 이름은 먼저 꺼내지 마십시오."},{"no":3281,"media":"연세대 토론회(10.27)","q":"【김성열 전 최고위원】 누구인가 · 어떻게 대할까 (10.22 이준석 의원 대신 참석 통보)","tags":["김성열","개혁신당","상대토론자"],"quotes":[],"script":["★ 1982년생, 연세대 경영학과 출신입니다. 토론장이 그의 모교입니다.","★ 민주당 쪽 국회 보좌진을 오래 하다가(노웅래 의원실 등) 2024년 개혁신당에 합류했습니다. 개혁신당에서 수석대변인, 수석최고위원, 지명직 최고위원을 지냈습니다.","★ 6·3 하남갑 국회의원 보궐선거에 개혁신당 후보로 나와 \"경제정책 전문가\"를 내세웠습니다. 4월 최고위원회의에선 추경을 두고 \"불난 집에 기름을 붓는 격\"이라며 정부 지출을 비판했습니다.","★ 민주당을 안에서 겪어 본 사람이라 민주당 비판이 날카로울 겁니다. 10월 19일 방송에서도 추미애 지사를 두고 \"공천을 준 민주당이 책임을 져야 한다\"고 했습니다.","호칭은 \"김성열 전 최고위원님\". 인사는 \"모교에 오신 선배님과 같이 서게 돼 반갑습니다\" 정도로 가볍게."],"notes":["청년 주거·일자리에 대한 김성열 본인 발언은 기사로 찾지 못했습니다. 개혁신당 노선(대출 정상화·민간 공급·최저임금 지역 차등·정년연장 반대)과 본인의 재정 건전성 논리로 나올 가능성이 큽니다. 아래 개혁신당 공격 카드는 그대로 씁니다.","민주당 보좌진 이력의 세부(어느 의원실에서 언제)는 나무위키 등 2차 출처라 말하지 마십시오. 경향신문은 \"2023년 노웅래 의원 보좌진\"으로 보도했습니다."],"warn":"1월 공천헌금 의혹 관련 경찰 참고인 조사(피의자 아님, 당은 혐의 없음으로 결론)와 그 뒤 탈당·복당, 하남갑 득표(2.18%, 3위)는 절대 먼저 꺼내지 마십시오. 학생들 앞에서 인신공격으로 보입니다.","src":[["김성열 최고위원 출마 선언(더팩트 2025.7.8)","https://news.tf.co.kr/read/ptoday/2222039.htm"],["김성열 하남갑 출마(시사뉴스 2026.5.12)","https://sisa-news.com/mobile/article.html?no=269880"],["김성열 \"경제정책 전문가 선택해달라\"(머니투데이 2026.5.19)","https://www.mt.co.kr/politics/2026/05/19/2026051917031894712"],["김성열 최고위원 모두발언 — 추경 비판(개혁신당 2026.4.9)","https://reformparty.kr/news/press/665-press-764"],["김성열 \"공천 준 민주당이 책임\"(뉴스핌 2026.10.19)","https://www.newspim.com/news/view/20261019001009"],["김성열 CBS 뉴스쇼(노컷뉴스 2026.8.27)","https://nocutnews.co.kr/news/6569040"],["김성열 지명직 최고위원 복귀(머니투데이 2026.3.17)","https://www.mt.co.kr/politics/2026/03/17/2026031711014019159"],["김성열 약력(나무위키 — 2차 출처)","https://namu.wiki/w/%EA%B9%80%EC%84%B1%EC%97%B4(%EC%A0%95%EC%B9%98%EC%9D%B8)"],["경향신문 2026.1.28 참고인 조사 보도","https://www.khan.co.kr/article/202601281022001/"]]},{"no":3282,"media":"연세대 토론회(10.27)","q":"【개혁신당 공격 ⑨ · 김성열】 \"청년 예산 43조, 결국 빚으로 청년 미래를 당겨 쓰는 것 아닙니까?\"","tags":["김성열","재정","청년예산","확장재정"],"quotes":[],"script":["★ 빚 걱정, 맞습니다. 결국 청년이 갚을 돈입니다. 그래서 저는 늘 돈 쓰는 내역부터 공개하자고 말합니다. 청년 예산이든 정당 국고보조금이든 10원까지 공개되면 낭비는 알아서 줄어듭니다.","★ 강진에서 봤습니다. 군민들이 예산 내역을 보기 시작하니 낭비예산 108억이 깎였습니다.","늘어난 청년 예산 절반 가까이가 주거입니다. 집은 짓고 나면 남는 자산입니다. 다만 청년일자리도약장려금처럼 작년에 726억을 못 쓰고도 단가를 올린 건 틀렸습니다. 쓸 데 쓰고, 못 쓴 건 줄여야 합니다."],"notes":["\"강진에서 봤습니다…108억이 깎였습니다\"는 경향신문 통화 답변(2009) 그대로.","김성열 근거(4.9): \"돈을 찍지 않았어도 정부 지출은 시장에 돈을 더 강하게 투입해 총수요를 자극하고 결국 물가를 끌어올립니다.\" M2 4,500조·국가채무 1,200조를 들었습니다. 국가채무 숫자 싸움은 하지 마십시오."],"src":[["김성열 추경 비판(개혁신당 2026.4.9)","https://reformparty.kr/news/press/665-press-764"],["2027 청년예산 43.3조·주거 비중(노컷뉴스 2026.8.28)","https://nocutnews.co.kr/news/6571021"],["도약장려금 726억 미집행(경기신문 2026.7.27)","https://kgnews.co.kr/mobile/article.html?no=905336"],["📼 김보미 원래 답변 — 경향 통화 108억","#card/2009"]]},{"no":3283,"media":"연세대 토론회(10.27)","q":"【개혁신당 공격 ⑩ · 김성열】 \"농어촌 기본소득 같은 선심성 지출부터 줄여야 합니다.\"","tags":["김성열","농어촌기본소득","지방소멸","강진"],"quotes":[],"script":["★ 저는 강진 사람입니다. 제 고향에는 면소재지에 밥 먹을 식당이 사라지고 있습니다. 지방이 사라지는 걸 막는 돈을 선심이라고 하면 안 됩니다.","★ 지역에 사는 것만으로 소득이 생기는 구조가 만들어지면, 떠날 이유는 줄고 돌아올 이유는 늘어납니다.","다만 효과는 숫자로 따져야 합니다. 3년 뒤 그 지역에 청년이 몇 명 남았는지로 평가하자는 겁니다."],"notes":["\"면소재지에 밥 먹을 식당이 사라지고 있습니다\"는 불교방송 답변(119), \"지역에 사는 것만으로 소득이 생기는 구조…\"는 이맘때 Q12(2915) 답변 그대로.","김성열은 4.9 최고위원회의에서 농어촌 기본소득과 중국인 관광객 지원 예산을 선심성 지출로 꼽았습니다."],"warn":"농어촌 기본소득의 금액·대상 지역은 준비된 자료가 없습니다. 숫자로 맞서지 말고 지방 소멸 논리로 답하십시오.","src":[["김성열 \"선심성 지출\"(개혁신당 2026.4.9)","https://reformparty.kr/news/press/665-press-764"],["📼 김보미 원래 답변 — 불교방송 청년과 부동산","#card/119"],["📼 김보미 원래 답변 — 이맘때 Q12 세 사다리","#card/2915"]]},{"no":3284,"media":"연세대 토론회(10.27)","q":"【개혁신당 공격 ⑪ · 김성열】 \"민주당에 있어 봐서 압니다. 민주당은 청년을 병풍으로 씁니다.\"","tags":["김성열","청년정치","병풍","민주당비판"],"quotes":[],"script":["★ 그 말 맞습니다. 저도 똑같이 말했습니다. 영입할 때는 미래라고 부르고, 규칙을 정하는 방에서는 지웁니다. 기자회견 때는 병풍처럼 세워 놓고 사진을 찍고 돌려보냅니다.","★ 그래서 저는 당대표 선거에 나갔습니다. 청년최고위원은 당원이 뽑게, 청년 예산은 청년이 직접 짜게 하자고요. 바꾸려면 결정하는 방에 들어가야 합니다.","(당을 옮기는 것도 선택입니다. 저는 남아서 바꾸는 쪽을 택했습니다.)"],"notes":["\"영입할 때는 미래라고 부르고…돌려보냅니다\"는 이맘때 Q6(2909) 답변 그대로."],"warn":"괄호 문장은 김성열 전 최고위원의 당적 이동을 겨냥하는 말로 들릴 수 있습니다. 상대가 먼저 날을 세울 때만 쓰십시오.","src":[["📼 김보미 원래 답변 — 이맘때 Q6 청년 정치 불신","#card/2909"],["📼 김보미 원래 답변 — 이데일리 Q9 2030 이탈","#card/2308"]]},{"no":3221,"media":"연세대 토론회(10.27)","q":"【박태훈 공격 ①】 \"민주당이 집권해도 청년 삶은 안 바뀌었습니다. 민주진보 진영이 기득권이 됐습니다.\"","tags":["박태훈","민주당비판","기득권"],"quotes":[],"script":["★ 맞습니다. 저도 당대표 선거에서 똑같이 말했습니다. 청년들이 민주당이 미워서 떠난 게 아니라, 기대할 이유를 못 찾아서 떠났습니다.","★ 그 기득권을 제일 세게 비판한 사람이 저입니다. 다만 구호로는 못 바꿉니다. 청년이 결정하는 자리에 앉아야 바뀝니다."],"notes":["\"기대할 이유를 못 찾아서\"는 JTBC 답변(1907)과 같은 말."],"src":[["박태훈 \"진보 집권해도 삶 안 바뀐다\"(경향신문 2026.6.21)","https://www.khan.co.kr/article/202606212153005/"]]},{"no":3222,"media":"연세대 토론회(10.27)","q":"【박태훈 공격 ②】 \"민주당 주거 공약은 공급만 말하고 공공임대 숫자가 없습니다.\"","tags":["박태훈","공공임대","공약평가"],"quotes":[],"script":["★ 그 지적 맞습니다. 시민단체 평가에서도 그렇게 나왔습니다. 숫자 없는 약속은 약속이 아닙니다.","★ 대학가 기숙사부터 연도별 물량으로 약속하자는 데 박 위원장님과 같이 가겠습니다."],"notes":[],"src":[["참여연대 2026 지선 정당별 주거공약 평가","https://peoplepower21.org/stablelife/2023030"]]},{"no":3223,"media":"연세대 토론회(10.27)","q":"【박태훈 공격 ③】 \"지역별 장기공공임대 20% 의무화, 동의하십니까?\" (진보당 지선 공약)","tags":["박태훈","공공임대20%","빈"],"quotes":[],"script":["★ 방향은 동의합니다. 빈은 시민 절반이 시가 짓거나 보조한 집에 삽니다.","다만 지역마다 땅값과 수요가 다릅니다. 서울 대학가는 더 높게, 군 단위는 빈집 활용처럼 다르게 가야 합니다. 일괄 숫자보다 지역별 목표를 법으로 정하자는 쪽입니다."],"notes":[],"src":[["참여연대 2026 지선 정당별 주거공약 평가","https://peoplepower21.org/stablelife/2023030"],["빈 사회주택(socialhousing.wien)","https://socialhousing.wien/"]]},{"no":3224,"media":"연세대 토론회(10.27)","q":"【박태훈 공격 ④】 \"민주당은 노동·차별금지법처럼 차마 못 하는 의제가 있습니다.\"","tags":["박태훈","노동"],"quotes":[],"script":["★ 민주당이 눈치 보느라 미뤄 온 게 있는 건 사실입니다. 그래서 당 안에 다른 목소리가 있어야 합니다.","오늘 의제인 청년 일자리로 말씀드리면, 첫 일자리의 질, 계약직으로 시작하면 계약직에 머무는 구조는 같이 풀어야 할 문제입니다."],"notes":[],"src":[["박태훈 인터뷰(오마이뉴스 연재)","https://brunch.co.kr/@coolboy95/65"],["국회예산정책처 「청년층 첫 직장 현황」(2026.5.2 보도)","https://v.daum.net/v/20260502202635766"]],"warn":"차별금지법에 대한 김보미 입장이 정리돼 있지 않습니다. 이 주제가 나오면 \"오늘 의제인 청년 일자리\"로 돌리십시오."},{"no":3225,"media":"연세대 토론회(10.27)","q":"【박태훈 관계 원칙】 같은 편이 될 수 있는 사람","tags":["박태훈","인물","전략"],"quotes":[],"script":["★ 공공임대·세입자 보호 방향이 김보미와 겹칩니다. 개혁신당과 1대2 구도가 되면 같은 편이 될 수 있습니다.","★ 그의 민주당 비판은 방어하지 말고 인정하면서 대안으로 넘깁니다.","인물: 1992년생, 숭실대 정외과(학생회장). 진보당 부대변인·정책국장, 청년진보당 집행위원장. 2025년 일베폐쇄 서명 11만 명 대통령실 전달. 이재명 대통령이 그의 지지글에 직접 화답(2026.9).","청년 주거·일자리에 대한 본인 발언은 기사로 확인되지 않았습니다. 진보당 공약 기준으로 대비했습니다."],"notes":[],"src":[["박태훈 경력(나무위키)","https://namu.wiki/w/%EB%B0%95%ED%83%9C%ED%9B%88(1992)"],["일베폐쇄 서명 운동(민들레)","https://www.mindlenews.com/news/articleView.html?idxno=14003"],["이 대통령, 박태훈 글에 화답(폴리뉴스)","https://www.polinews.co.kr/news/articleView.html?idxno=743042"]]},{"no":3231,"media":"연세대 토론회(10.27)","q":"【민주당 지적 ①】 \"20대가 민주당을 떠났습니다.\" (갤럽 10월 18~29세 민주 18%·국힘 27%·무당층 47%)","tags":["민주당","2030이탈","지지율"],"quotes":[],"script":["★ 청년이 민주당을 떠난 게 아니라, 민주당이 먼저 청년을 떠났습니다. 몰라서 떠난 게 아니라 너무 잘 알아서 떠났습니다.","영입할 때는 미래라고 부르고, 규칙을 정하는 방에서는 지웠습니다. 기자회견 때는 병풍처럼 세워 놓고 사진만 찍었습니다.","★ 말로는 청년을 외치면서 기탁금 장벽은 세우고 청년최고위원은 좌초시켰습니다. 그 간격을 청년들은 실시간으로 봅니다. 그래서 청년이 결정하는 자리에 앉게 하자는 겁니다.","★ 청년이 국민의힘으로 간 것도 아닙니다. 갤럽 조사에서 20대 절반 가까이가 지지 정당이 없습니다. 양당을 다 떠난 겁니다.","★ 분노보다 무서운 게 무관심입니다. 분노는 아직 기대가 남았다는 뜻이고, 무관심은 기대를 접었다는 뜻입니다. 오늘 여러분이 이 자리에 와 주신 건 아직 기대가 남았다는 뜻이라고 믿습니다."],"notes":["이데일리(2308)·이맘때 Q6(2909) 답변과 같은 말.","ARS 조사(여론조사공정·리얼미터)는 국민의힘 우위로 나옵니다. 숫자를 말할 땐 \"갤럽 조사로는\"을 꼭 붙이십시오."],"src":[["갤럽 10월 3주 정당지지도(톱스타뉴스 2026.10.16)","https://www.topstarnews.net/news/articleView.html?idxno=16248734"],["갤럽 18~29세 민주 16%(헤럴드경제 2025.9)","https://www.heraldk.com/article/2025092008392917287"],["20대 민주 21.5%·국힘 42.6%(뉴스토마토 2026.8)","https://newstomato.com/ReadNews.aspx?no=1311253"],["📼 김보미 원래 답변 — 이데일리 Q9 2030 이탈","#card/2308"],["📼 김보미 원래 답변 — 이맘때 Q6 청년 정치 불신","#card/2909"]]},{"no":3232,"media":"연세대 토론회(10.27)","q":"【민주당 지적 ②】 \"청년최고위원은 무산되고 기탁금은 올랐습니다.\"","tags":["민주당","청년최고위원","기탁금"],"quotes":[],"script":["★ 틀렸습니다. 저는 그 당사자입니다. 기탁금이 없어서 다섯 군데서 빌렸습니다. 지금도 틀렸다고 말합니다.","★ 청년 대표는 당대표가 낙점하는 게 아니라 당원이 투표로 뽑아야 합니다. 국민의힘도 선출로 뽑는데 우리 당은 7월에 부결했습니다."],"notes":[],"src":[["민주당 청년최고위원 도입 부결(데일리안)","https://www.dailian.co.kr/news/view/1667612"],["최고위원 기탁금 2천만원(더팩트)","https://news.tf.co.kr/read/ptoday/2345054.htm"]]},{"no":3233,"media":"연세대 토론회(10.27)","q":"【민주당 지적 ③】 \"청년 몫 최고위원도 결국 지명했잖아요.\"","tags":["민주당","지명직","전용기"],"quotes":[],"script":["★ 청년 몫은 청년이 뽑아야 합니다. 지명은 시혜고, 시혜는 회수됩니다.","다음 전당대회부터는 선출로 의무화하겠다고 했으니, 당헌에 새기는지 끝까지 지켜보겠습니다."],"notes":["전용기 의원(1991년생)은 김보미 당대표 경선 때 공개 지지해 준 유일한 국회의원. 개인 비판은 하지 말 것."],"src":[["청년 몫 지명직 전용기 의원(주간경향 2026.8.21)","https://weekly.khan.co.kr/article/202608211114001"]]},{"no":3234,"media":"연세대 토론회(10.27)","q":"【민주당 지적 ④】 \"10·15 대출 규제로 청년 실수요자가 집을 못 삽니다.\"","tags":["민주당","대출규제","10·15"],"quotes":[],"script":["★ 투기 잡는 건 맞는데 청년 실수요자가 같이 맞았습니다. 2030 주택담보대출 매수가 크게 줄었습니다.","★ 청년·신혼부부 예외는 검토만 할 게 아니라 해야 합니다."],"notes":[],"src":[["10·15 대책, 2030 주담대 42.5% 감소(헤럴드경제)","https://www.heraldk.com/article/2025101517300227331"]]},{"no":3235,"media":"연세대 토론회(10.27)","q":"【민주당 지적 ⑤】 \"폐버스 하우스, 4억 이하 빌라 대출. 청년한테 가두리를 친 것 아닙니까?\"","tags":["민주당","폐버스","보금자리론","가두리"],"quotes":[],"script":["★ 청년의 분노를 못 읽은 겁니다. 청년 주거 정책을 청년 없이 만드니 폐버스 이야기가 나옵니다.","★ 청년미래보금자리론은 서울 빌라의 64%가 4억을 넘어서 대상에서 빠집니다. 선택지는 늘리되 사다리는 끊지 말아야 합니다.","★ 아이디어는 다양할수록 좋습니다. 문제는 절차입니다. 홍콩 튜브하우스, 스웨덴 대학가 마이크로주택처럼 진지한 대안도 많습니다. 청년과 같이 설계하면 됩니다.","★ 던져 놓고 지우는 정치도, 조롱만 하는 정치도 청년의 잠자리는 못 지킵니다.","(저도 당대표 경선 때 서울에 잘 곳이 없어 렌터카에서 쪽잠을 잤습니다.)"],"notes":["페이스북 「폐버스 하우스와 콘크리트 수도관」, 전격시사 8.12(2707)·정치시그널 Q11(3011) 답변과 같은 논지.","사실: 2026년 8월 황희 의원이 폐버스 개조 청년주택을 제안했다가 2030 반발로 사과. 당 지도부가 수습."],"src":[["폐버스 하우스 논란(노컷뉴스 2026.8.7)","https://www.nocutnews.co.kr/news/6560011"],["민주당 황희 '폐버스 주택' 제안 후폭풍(아시아경제 2026.8.10)","https://view.asiae.co.kr/article/2026081008325546534"],["\"우리가 집이 없지, 자존심이 없나\" 청년 버스하우스에 2030 폭발(SBS Biz)","https://biz.sbs.co.kr/amp/article/20000327564"],["황희 '폐버스' 향해 맹공…'내로남불' 지적에 민주당 수습(2026.8.9)","https://v.daum.net/v/20260809193855687"],["청년미래보금자리론, 서울 빌라 64% 제외(헤럴드경제 2026.8.21)","https://biz.heraldcorp.com/article/10847568"],["📼 김보미 원래 답변 — 전격시사 8.12 버스하우스·부동산","#card/2707"],["📼 김보미 원래 답변 — 정치시그널 Q11 폐버스","#card/3011"]]},{"no":3236,"media":"연세대 토론회(10.27)","q":"【민주당 지적 ⑥ / 학생 질문】 \"정부도 K-유스개런티를 하는데 청년취업보장제랑 뭐가 다릅니까?\"","tags":["K-유스개런티","청년취업보장제","정부정책"],"quotes":[],"script":["★ 방향은 같습니다. 정부가 내년에 첫 취업 경험이 없는 청년을 지원하는 제도를 새로 만드는 건 반가운 일입니다.","★ 차이는 끝이 어디냐입니다. 정부 사업은 상담, 연결, 일경험, 수당까지입니다. 제가 말하는 건 실제 첫 고용, 경력으로 쳐 주는 일자리를 보장하는 겁니다. 오스트리아처럼 자리를 못 찾으면 나라가 자리를 만들어 주는 겁니다."],"notes":[],"src":[["K-유스개런티·구직급여 업무보고(헤럴드경제 2026.8.4)","https://www.heraldk.com/article/2026080401112413174"],["2027 청년 첫취업·도약장려금(SBS Biz 2026.9.1)","https://biz.sbs.co.kr/amp/article/20000331977"],["K-유스개런티 3,793억·16만 명(뉴스서울 2026.9.4)","https://newsseoul.co.kr/news/view/1065583215213139"],["오스트리아 훈련 보장 2024년 1만1,713명(오스트리아 사회부)","https://www.sozialministerium.gv.at/Themen/Arbeit/Arbeitsmarkt/Arbeitsmarktfoerderungen/Jugendliche-und-junge-Erwachsene.html"]],"warn":"K-유스개런티(청년 첫 취업지원제도)는 뉴스서울이 \"3,793억 원·16만 명\"으로 보도했지만, SBS Biz는 둘을 별개로 보고 세부 미정이라고 썼습니다. 고용부 원자료로는 확인하지 못했으니 숫자보다 \"끝이 어디냐\"로 말하십시오."},{"no":3237,"media":"연세대 토론회(10.27)","q":"【민주당 지적 ⑦】 \"정부 보편형 공공임대는 고소득 청년 특혜라는 비판이 있습니다.\"","tags":["보편형공공임대","주거안정플랜","고시원"],"quotes":[],"script":["★ 공공임대를 넓히는 방향은 맞습니다.","★ 다만 고시원·반지하 청년이 먼저입니다. 저소득 청년의 86.6%가 공공임대도 주거급여도 못 받습니다. 순서를 지켜야 합니다.","(민간에 맡긴 청년주택이 어떻게 되는지는 서울 청년안심주택이 보여 줍니다. 4개 단지 296가구 보증금이 묶였고, 잠실 한 곳에만 238억 원입니다. 보증보험 사각지대를 국회가 방치한 것도 맞습니다. 의무 가입과 공공 매입으로 고쳐야 합니다.)"],"notes":[],"src":[["주거안정플랜 119만호(MTN 2026.9.21)","https://news.mtn.co.kr/news-detail/2026092116181617226"],["참여연대 주거안정플랜 비판(2026.9.22)","https://peoplepower21.org/stablelife/2029728"],["저소득 청년 86.6% 공공임대·주거급여 사각지대(파이낸셜뉴스, 국토연구원 2026.8)","https://www.fnnews.com/news/202608110630517454"],["청년안심주택 296가구 보증금 선지급(서울시 2025.10.2)","https://mediahub.seoul.go.kr/archives/2015796"],["잠실 238억·미가입 1,231채(동아일보 2025.8.23)","https://v.daum.net/v/20250823014527905"]]},{"no":3238,"media":"연세대 토론회(10.27)","q":"【민주당 지적 ⑧】 \"청년 취업자가 47개월째 줄었는데 정부·여당 책임 아닙니까?\"","tags":["고용","책임","47개월"],"quotes":[],"script":["★ 정부·여당이 결과로 책임질 일입니다. 변명하지 않겠습니다.","다만 47개월이면 지난 정부부터 이어진 겁니다. 누구 탓보다, 첫 일자리를 어떻게 만들지 이야기합시다."],"notes":[],"src":[["2026년 9월 고용동향, 청년 취업자 47개월 감소(스마트투데이)","https://www.smarttoday.co.kr/ko-kr/articles/112773"]]},{"no":3239,"media":"연세대 토론회(10.27)","q":"【민주당 지적 대응 원칙】 방어하지 않는다","tags":["원칙","민주당"],"quotes":[],"script":["★ 인정할 건 먼저 인정합니다.","★ 김보미가 그 문제를 이미 지적했던 사람이라는 걸 보여 줍니다(당대표 선거 발언).","★ 바로 대안으로 넘어갑니다.","★ 정답은 정당이 아니라 국민에게 있습니다. 틀린 건 우리 당이어도 틀렸다고 합니다."],"notes":[],"src":[]},{"no":3241,"media":"연세대 토론회(10.27)","q":"【학생 질문】 \"월세 지원 20만 원은 너무 적지 않나요? 민주당 정부인데요.\"","tags":["학생질문","월세지원"],"quotes":[],"script":["★ 적습니다. 학교 앞 평균 월세 67만 8천 원의 3분의 1이 안 됩니다. 월 30만 원으로 올려야 합니다.","좋아진 것도 있습니다. 올해부터 한시 사업이 상시 사업이 됐고, 내년에는 소득 기준을 중위소득 60%에서 100%로 넓힙니다.","서울시 자체 청년월세지원도 있습니다. 월 20만 원씩 12개월, 올해 1만 2천 명을 추첨으로 뽑고 떨어진 1,500명에게는 관리비 8만 원을 줍니다. 추첨으로 뽑는 지원은 지원이 아니라 복권입니다. 신청하면 받는 구조로 가야 합니다.","★ 그런데 지원금만 올리면 월세도 따라 오릅니다. 기숙사와 공공 원룸이 같이 늘어야 합니다."],"notes":[],"src":[["청년 월세 지원 상시화 20만×24개월(뉴시스 2026.3.18)","https://mobile.newsis.com/view/NISX20260318_0003552925"],["2027 청년 주거 예산(헤럴드경제 2026.8.31)","https://www.heraldk.com/article/2026083120041480854"],["서울 주요 대학가 원룸 월세, 연세대 인근 67.8만(SBS Biz·다방 2026.8.11)","https://biz.sbs.co.kr/amp/article/20000327969"],["서울 청년월세지원 2026(고방 2026.3.10)","https://gobang.kr/contents/7691"],["서울 청년월세지원 2025(서울시 2025.6.10)","https://mediahub.seoul.go.kr/archives/2014747"]]},{"no":3242,"media":"연세대 토론회(10.27)","q":"【학생 질문】 \"지방국립대는 등록금 0원인데 서울 학생은 역차별 아닌가요?\"","tags":["학생질문","지방국립대","등록금","역차별"],"quotes":[],"script":["★ 지방에 좋은 대학이 있어야 처음부터 서울로 안 올라와도 됩니다. 균형발전 정책입니다. 저는 찬성합니다.","★ 다만 서울 대학생한테는 그 혜택이 없습니다. 여러분한테 필요한 건 등록금보다 방입니다. 서울 대학생에게는 기숙사와 월세가 답이어야 합니다.","지방 사립대는 지원이 국립대의 절반이고 연 800만 원 상한이 생겨서 사립대들이 실효성이 부족하다고 반발하고 있습니다."],"notes":["2027학년도 지방국립대 신입생부터 등록금 전액(국가장학금 신청자, 의·치·약·수의대 제외), 지역균형발전장학금 3,280억 원."],"src":[["지방국립대 신입생 등록금 전액(조선비즈 2026.8.28)","https://v.daum.net/v/20260828172809434"],["지방사립대 장학금 1만명·800만 상한(머니투데이 2026.8.28)","https://www.mt.co.kr/policy/2026/08/28/2026082814382133389"]]},{"no":3243,"media":"연세대 토론회(10.27)","q":"【학생 질문】 \"청년미래적금, 도약계좌랑 뭐가 달라요? 정권 바뀌면 또 없어지는 것 아닌가요?\"","tags":["학생질문","청년미래적금","도약계좌"],"quotes":[],"script":["★ 그 걱정이 맞습니다. 내일채움공제는 생겼다 없어졌고, 도약계좌는 해지율이 15%를 넘었고 미래적금으로 바뀌었습니다.","미래적금은 월 50만 원까지 3년 넣으면 나라가 6%, 중소기업 다니면 12%를 얹어 줍니다.","★ 정권 바뀔 때마다 이름 바꾸는 건 틀렸습니다. 국회예산정책처도 청년 자산형성 사업이 10개로 겹친다고 했습니다. 하나로 합치고 오래 가게 해야 합니다."],"notes":[],"src":[["청년미래적금 출시(bnt뉴스 2026.6.22)","https://v.daum.net/v/9o303vtWiL"],["청년도약계좌 해지율 15.3%(한경비즈니스)","https://magazine.hankyung.com/business/article/202508051953b"],["청년자산형성 6개 부처 10개 사업 중복(국회예산정책처)","https://www.nabo.go.kr/ko/notice/releasesView.do?idx=8981"]]},{"no":3244,"media":"연세대 토론회(10.27)","q":"【학생 질문】 \"청년 나이를 34세로 늘리면 20대 몫이 줄지 않나요?\"","tags":["학생질문","청년연령","34세","의무고용","청년기본조례","강진"],"quotes":[],"script":["★ 그럴 수 있습니다. 대상은 넓어졌는데 공공기관 청년 의무고용 비율 3%가 그대로면 20대가 30대 초반과 같은 자리를 놓고 경쟁하게 됩니다.","★ 대상을 넓혔으면 몫도 넓혀야 합니다.","★ 청년 나이는 낮을수록 진짜 청년이 혜택을 받습니다. 저는 강진에서 49세였던 청년 나이를 45세로 낮췄습니다. 45세, 50세면 아빠 세대까지 같이 들어와서 진짜 청년이 빠지거든요.","나라가 29세를 34세로 넓힌 건 취업이 늦어진 30대 초반을 넣자는 겁니다. 강진이 49세를 45세로 낮춘 건 부모 세대까지 들어가는 걸 막자는 겁니다. 방향은 같습니다. 진짜 청년이 빠지지 않게 하는 겁니다."],"notes":[],"src":[["청년고용촉진특별법 개정 국회 통과(SBS Biz)","https://biz.sbs.co.kr/amp/article/20000291545"],["9월 고용동향·청년 15~34세 통계(아이뉴스24)","https://www.inews24.com/view/2015634"],["강진 청년기본조례 49세→45세 조정(미래일보 2022.12)","https://hkmd.kr/news/article.html?no=70232"]],"warn":"\"20대 몫이 줄 수 있다\"는 분석상 추론입니다. 단정하지 말고 \"그럴 수 있다\"로 말하십시오. 3% 조항 일몰 여부는 원문 미확인."},{"no":3245,"media":"연세대 토론회(10.27)","q":"【학생 질문】 \"쉬었음 청년은 그냥 게으른 것 아닌가요?\"","tags":["학생질문","쉬었음","고립은둔"],"quotes":[],"script":["★ 아닙니다. 고립·은둔 청년이 53만 8천 명인데, 은둔하게 된 계기 1위가 취업의 어려움입니다.","★ 서울시가 고립·은둔 청년을 지원했더니 우울감이 20% 넘게 줄고, 응답자 249명 중 92명이 취업하거나 진로를 바꿨습니다. 도우면 돌아옵니다."],"notes":[],"src":[["고립·은둔 청년 53.8만, 은둔 계기 1위 취업(인사이트 2026.9.16)","https://www.insight.co.kr/news/573456"],["서울 고립·은둔 청년 지원 성과(더팩트)","https://news.tf.co.kr/read/life/2169166.htm"]]},{"no":3246,"media":"연세대 토론회(10.27)","q":"【학생 질문】 \"연세대 등록금도 올랐는데요.\"","tags":["학생질문","등록금"],"quotes":[],"script":["★ 연세대는 올해 2.6% 올렸고, 서울 사립대 27곳 중 23곳이 올렸습니다.","등록금은 대학 재정 문제와 같이 봐야 해서 쉽게 말하기 어렵습니다. 다만 등록금을 못 올리게 하려면 나라가 고등교육에 쓰는 돈을 늘려야 합니다. 우리나라 대학생 1인당 공교육비는 OECD 평균보다 낮습니다."],"notes":["2023년 한국 고등교육 학생 1인당 공교육비 1만 6,479달러 vs OECD 평균 2만 2,878달러(OECD 교육지표 2026)."],"src":[["연세대 등록금 2.6% 인상(더팩트 2026.2.8)","https://news.tf.co.kr/read/life/2290752.htm"],["OECD 교육지표 2026(파이낸셜뉴스 2026.9.29)","https://www.fnnews.com/news/202609291351196534"]]},{"no":3247,"media":"연세대 토론회(10.27)","q":"【학생 질문】 \"이준석은 36세에 당대표가 됐는데 민주당에선 왜 안 되나요?\"","tags":["학생질문","이준석","청년당대표","판"],"quotes":[],"script":["★ 이준석이 아니라 맘다니가 와도 안 되는 구조입니다. 사람의 문제가 아니라 판의 문제입니다.","★ 국민의힘은 그때 토론과 미디어로 승부가 나는 판이 열렸습니다. 민주당은 조직과 명부로 승부가 납니다. 제 예비경선은 실제 선거운동이 이틀도 안 됐고 토론은 한 번도 없었습니다. 판만 바꾸면 민주당에도 30대 대표가 나옵니다.","(20대 꼰대가 있을 수 있고 60대 청년이 있을 수 있습니다. 나이가 아니라 시스템입니다.)"],"notes":["한겨레21 답변(2611·2616)과 같은 말."],"src":[["김보미 경력·의정활동(오마이뉴스 2026.7.13)","https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003250922"],["📼 김보미 원래 답변 — 한겨레21 Q11 청년 정치","#card/2611"]]},{"no":3248,"media":"연세대 토론회(10.27)","q":"【학생 질문】 \"청년 이야기에 군대는 왜 안 나오나요? 모병제는 어떻게 보세요?\"","tags":["학생질문","모병제","징병제","군복무","첫일자리"],"quotes":[],"script":["★ 저는 선택적 모병제를 지지합니다.","★ 군대가 가기 싫은 곳이었던 이유는 청춘을 바치는데 제대로 된 대가가 없는 일방적 의무였기 때문입니다. 월급을 제대로 받고 첨단 기술을 배우고 전역할 때 경력과 가산점을 들고나오는, 내가 선택해서 가는 첫 직장으로 군대를 바꿔야 합니다.","★ 다만 이사를 하더라도 살던 집을 먼저 부수지는 않습니다. 모병이 자리 잡는 만큼 징병을 단계적으로 줄여가면 되고, 남성이든 여성이든 차별 없이 모병을 확대해야 성별 갈라치기도 줄어듭니다.","(남녀 모두 단기 기초군사훈련을 받게 하고 징병제는 단계적 모병제로 바꾸는 공약도 발표했습니다. 군 복무자는 가산점과 보상을 받도록 하겠습니다.)"],"notes":["전부 김보미가 방송에서 한 말 그대로입니다: 정치시그널 8.27 돌발 6(3020), 뉴스바사삭(910). 3020 원문의 \"곧 국방일보에 기고도 합니다\"는 시점이 지난 말이라 뺐습니다. 기고가 실렸으면 \"국방일보에도 썼습니다\"로 말하십시오.","의제 2와 이어 쓰기: 군대를 \"선택해서 가는 첫 직장\"으로 — 첫 일자리 이야기의 연장."],"warn":"교차점검(2854)에서 모병제 공약이 \"부록에만 있는 안보 공약, 의도 확인\"으로 표시된 적이 있습니다. 이후 방송에서 지지 입장을 밝혔으니 그 입장대로 말하되, 병력 규모·예산 숫자는 준비된 것이 없으니 지어내지 마십시오.","src":[["📼 김보미 원래 답변 — 정치시그널 선택적 모병제","#card/3020"],["📼 김보미 원래 답변 — 뉴스바사삭 미래형 민주당","#card/910"],["📼 이맘때 Q8","#card/2911"],["선택적 모병제 진단(이슈현안 보고서)","issue-mobyeongje.html"]]},{"no":3251,"media":"연세대 토론회(10.27)","q":"【정외과 질문】 \"한국은 왜 북유럽처럼 30대 총리가 안 나오나요? 제도 탓인가요, 문화 탓인가요?\"","tags":["정외과","IPU","청년의원","북유럽"],"quotes":[],"script":["★ 사람이 아니라 판의 문제입니다. 북유럽은 40세 미만 의원이 30%, 우리 국회는 4.7%로 155개국 중 142위입니다.","★ 북유럽·독일 총리들은 대부분 정당 청년조직에서 컸습니다. 우리 정당엔 청년이 클 길이 없습니다. 그래서 청년최고위원을 선출로 뽑고, 당 예산 일부를 청년이 직접 짜게 하자는 겁니다."],"notes":["IPU 2025: 전 세계 40세 이하 의원 19.0%, 북유럽 30.3%, 동아시아 7.2%. 22대 국회 30대 14명·20대 0명."],"src":[["IPU 청년의원 보고서 2025(원문 PDF)","https://agora-parl.org/sites/default/files/agora-documents/20250902_YouthParticipation_2025_EN_LR.pdf"],["22대 국회 40세 미만 4.7%·142위(서울신문 2025.11.21)","https://seoul.co.kr/news/plan/youngman_area_future/2025/11/21/20251121008003"],["정당 청년조직 출신 지도자(YOUMEM 연구)","https://eprints.soton.ac.uk/498789/1/mcdonnell-et-al-2024-inside-party-youth-wings-the-youmem-project.pdf"]]},{"no":3252,"media":"연세대 토론회(10.27)","q":"【정외과 질문】 \"청년 정치 예산은 이미 법으로 5% 있지 않나요?\"","tags":["정외과","청년정치발전비","국고보조금","투명성"],"quotes":[],"script":["★ 있습니다. 그런데 2023년에 한 당은 그 돈의 99.3%를 청년본부 사무처 급여로 썼고, 우리 당도 행사비·홍보비가 컸습니다.","★ 비율보다 청년이 실제로 쓰느냐가 중요합니다. 독일은 큰 정당 기부를 기부자 이름까지 바로 공개합니다. 정당 국고보조금도 상시로 공개해야 합니다. 제가 요즘 계속 말하는 게 이겁니다."],"notes":[],"src":[["청년정치발전비 99.3% 급여(서울신문 2024.3.18)","https://m.seoul.co.kr/news/2024/03/18/20240318004004"],["독일 정당 기부 공개(독일 연방의회)","https://www.bundestag.de/dokumente/textarchiv/2024/kw51-parteispenden-1034090"]]},{"no":3253,"media":"연세대 토론회(10.27)","q":"【정외과 질문】 \"피선거권을 18세로 낮췄는데 왜 청년 출마가 적나요?\"","tags":["정외과","피선거권","기탁금","공천"],"quotes":[],"script":["★ 법의 문턱은 낮아졌는데 돈의 문턱이 그대로입니다. 국회의원 지역구 기탁금이 1,500만 원입니다. 저도 당대표 선거 기탁금이 없어서 다섯 군데서 빌렸습니다.","★ 지난 총선 양당 지역구 공천자 중 청년은 3%대였습니다. 기탁금을 없애고 당직 선거를 공영제로 해야 합니다."],"notes":[],"src":[["22대 국회 40세 미만 4.7%·142위(서울신문 2025.11.21)","https://seoul.co.kr/news/plan/youngman_area_future/2025/11/21/20251121008003"],["22대 총선 청년 공천 3%대(서울신문 2024.3.5)","https://m.seoul.co.kr/news/2024/03/05/20240305004006"]]},{"no":3254,"media":"연세대 토론회(10.27)","q":"【정외과 질문】 \"5년 단임제를 바꾸거나 내각제로 가면 세대교체가 되나요?\"","tags":["정외과","개헌","내각제","스웨덴"],"quotes":[],"script":["★ 권력구조만 바꿔서는 안 됩니다. 내각제인 스웨덴도 지금 총리 인준이 부결돼서 내각을 못 꾸리고 있습니다.","★ 어떤 제도든 정당이 경선을 투명하게 하고 청년이 클 길을 만들어야 세대교체가 됩니다. 개헌은 필요하지만, 정당 개혁은 개헌 없이 지금 당장 할 수 있습니다."],"notes":[],"src":[["스웨덴 총리 인준 부결(스웨덴 의회 2026.10.15)","https://www.riksdagen.se/en/news/articles/2026/oct/15/no-to-magdalena-andersson-socdem-as-prime_cmsd2ab1134-a03c-4be2-b345-af0aacff33d3en/"]],"warn":"개헌안 내용(4년 중임제 등)에 대한 김보미의 새 입장은 만들지 않았습니다. 구체적으로 물으면 \"국회 개헌 논의를 지켜보되 정당 개혁이 먼저\"로 답하십시오."},{"no":3255,"media":"연세대 토론회(10.27)","q":"【정외과 질문】 \"청년 할당제는 역차별 아닌가요?\"","tags":["정외과","할당제","공천목표제"],"quotes":[],"script":["★ 할당보다 경로가 먼저입니다. 청년이 당에서 배우고 크는 길이 있으면 할당은 필요 없어집니다.","다만 지금처럼 공천자 중 청년이 3%대인 상황에서는 공천 목표제 정도는 필요합니다. IPU 기준으로 청년 할당제를 둔 의회가 16곳입니다."],"notes":["김보미 공약은 \"청년 공천 목표제\"(프레시안). 의무 할당제를 공약한 적은 없음."],"src":[["IPU 청년의원 보고서 2025(원문 PDF)","https://agora-parl.org/sites/default/files/agora-documents/20250902_YouthParticipation_2025_EN_LR.pdf"],["22대 총선 청년 공천 3%대(서울신문 2024.3.5)","https://m.seoul.co.kr/news/2024/03/05/20240305004006"],["당 예산 10% 청년 편성 공약(프레시안 2026.7.16)","https://pressian.com/pages/articles/2026071617485205196"]]},{"no":3261,"media":"연세대 토론회(10.27)","q":"【숫자 카드】 토론 중 바로 꺼내 쓰는 숫자 15개","tags":["숫자","팩트","근거"],"quotes":[],"script":["★ 3배 / 13배 — 창천동 8평 원룸 5.3억(2026.6.23) vs 강진 34평 1.75억(2026.6.20). 평당 6,625만 vs 515만.","1.5배 — 신축과 비교해도: 창천동 8평 5.3억 vs 강진 신축 33평(서성남양휴튼2단지) 3.58억(2026.8.20).","★ 67.8만 원 — 연세대 인근 원룸 평균 월세(2026.7, 1년 새 +10.4%). 창천동 8평 실거래 55~65만(9~10월).","70.9만 원 — 서울 대학가 월세+관리비 평균.","★ 16.8% — 서울 대학 기숙사 수용률, 17개 시도 중 최저. 수도권 2020년 18.1% → 2025년 17.7%.","★ 20만 원 — 정부 청년 월세 지원(최대 24개월). 학교 앞 월세의 29.5%.","★ 47개월 — 15~29세 취업자 연속 감소(2026.9). 청년 고용률 44.0%.","★ 84.8% — 졸업 후 취업경험 비율, 2004년 이후 최저. 1년 이상 미취업 48.6%.","71.1% / 80.1% — 25~34세 고등교육 이수율 OECD 1위 / 대졸 고용률(OECD 86.0%).","★ 34.5% — 계약직으로 시작한 청년 중 지금도 계약직(정규직 출발은 18.7%).","70.7% · 18.4개월 — 첫 직장 그만둔 청년 비율과 평균 근속.","3.4개월 — 지방 청년이 수도권보다 취업에 더 걸리는 기간(24.6 vs 21.2개월).","43.3조 — 2027 정부 청년예산(2026년 28.2조, +53.5%).","4.7% — 22대 국회 40세 미만 의원(155개국 중 142위).","75.9% — 전세사기 피해자 중 40세 미만 비율."],"notes":[],"src":[["창천동 원룸 매매 실거래(집품)","https://zippoom.com/browse/%EC%84%9C%EC%9A%B8-%EC%84%9C%EB%8C%80%EB%AC%B8%EA%B5%AC-%EC%B0%BD%EC%B2%9C%EB%8F%99/%EB%B9%8C%EB%9D%BC-%EB%A7%A4%EB%A7%A4"],["강진군 30평대 아파트 시세·실거래(리치고)","https://m.richgo.ai/realty/apt-hub/%EC%A0%84%EB%82%A8%EA%B4%91%EC%A3%BC/%EA%B0%95%EC%A7%84%EA%B5%B0/30%ED%8F%89%EB%8C%80"],["서울 주요 대학가 원룸 월세, 연세대 인근 67.8만(SBS Biz·다방 2026.8.11)","ht cidadaos"],["공부방 페이지","debate-yonsei-study.html"]],"warn":"\"독일은 기숙사가 많다\"는 틀립니다. 독일 기숙사 수용률은 9.5%(2022)로 한국 수도권 17.7%보다 낮습니다. \"싸다\", \"현금 보조\"만 말하십시오."},{"no":3271,"media":"연세대 토론회(10.27)","q":"【행사 개요·학생회】 10.27(화) 19:00 연희관 401호 · 18:40 도착","tags":["행사","학생회","이륙","분위기"],"quotes":[],"script":["★ 일시 2026.10.27(화) 19:00~21:00, 18:40까지 도착(마이크 점검). 장소 연세대 신촌캠퍼스 연희관 401호. 청중 정외과 학부생 약 50명.","진행: 기조발언 → 상호토론 → 질의응답(학생 질문 사전 수합 + 현장).","★ 의제 선정 근거(학생회 10.25 안내): 중앙선관위 정책선거 보고서 「제9회 지방선거 정책이슈 선정을 위한 빅데이터 분석」. 설문(2026.3.9~16, 온라인 비확률 할당, 전국 2,533명)에서 서울 20대는 주거/도시 69.4%, 경제/일자리 56.5%를 꼽음. 다만 서울 20대 응답자는 62명뿐.","같은 보고서에서 서울 전체(328명)의 주거 세부이슈 1위는 주택정비(재개발·재건축) 58.2%, 2위 주거비 지원·공공임대 44.5%, 3위 전월세 안정 39.6%. 일자리 세부이슈 1위는 일자리·창업지원 67.4%, 노동환경 개선은 10.4%.","토론자(가나다순): 김보미 · 김성열(전 개혁신당 최고위원, 10.22 이준석 의원 대신 참석 통보) · 박태훈(진보당 전국대학생준비위원장).","주최: 제62대 정치외교학과 학생회 <이륙> 미래진로국(담당 황금별). 학생회장 김민수(정외 24), 부학생회장 전시은(정외 25).","★ 여야정책토론회는 <이륙>의 미이행 공약입니다(공약 이행률 78.3%). 학생회에게 꼭 성공시켜야 하는 행사입니다.","★ 분위기: 9월 SKY 연합 세미나에서 윤상현 의원 초청을 재학생 반발로 철회. 6.10 연세대 시국선언에서 정외과 학생 발언이 정치적이라며 충돌. 진영 구호(내란·극우)보다 정책과 숫자로."],"notes":["학생회 안내문은 \"언론 기사·지방의회 회의록·국민신문고를 바탕으로\"라고 했지만, 보고서 원문은 언론 50개 매체 기사 토픽모델링이 본체이고 회의록·민원은 분류 참고자료입니다. 학생 체면을 생각해 굳이 바로잡지 않아도 됩니다.","10.25 안내문의 박태훈 직함은 \"진보당 전국대학생준비위원장\"입니다."],"src":[["📑 보고서 읽기 — 전문·발췌 PDF·건별 요약·학생회 인용 대조","report-nec-2026.html"],["<이륙> 공약 이행률 페이지","https://coda.io/d/_dJNlsDc6TLs/_suG-cZG4"],["김민수 학생회장(연정기자단)","https://blog.naver.com/yonjpress/224202524752"],["SKY 학생회 윤상현 초청 철회(오마이뉴스 2026.9.7)","https://www.ohmynews.com/NWS_Web/View/at_pg.aspx?CNTN_CD=A0003265192"],["연세대 6.10 시국선언 충돌(뉴시스)","https://www.newsis.com/view/NISX20260610_0003664523"],["토론 준비실 페이지","debate-yonsei-20261027.html"],["선관위 「제9회 지방선거 정책이슈 선정을 위한 빅데이터 분석」(2026.3, 핀인사이트)","https://policy.nec.go.kr/plc/promotion/initUPRPromotionDetail.do?no=89"]]},{"no":3272,"media":"연세대 토론회(10.27)","q":"【당일 체크리스트·금지어】","tags":["체크리스트","금지어","당일"],"quotes":[],"script":["★ 학생회에 확인: 기조발언 시간, 토론·질의 시간 배분, 사전 질문 목록, 사회자, 촬영·SNS 게시 가능 여부, 주차, PPT 필요 여부.","★ 김보미가 정할 것: 정년 연장 최종 입장.","★ 경선 숙박 장면은 \"렌터카에서 노트북 들고 쪽잠\" 하나로만. 폐버스는 제안이 틀렸다고만 하고 황희 의원 이름은 먼저 꺼내지 않기.","★ 금지어·주의: \"독일은 기숙사가 많다\"(틀림) / \"29.9조\"(틀림, 43.3조) / \"8평 원룸 평균 5억\"(1건 실거래) / \"육아수당 제가 대표발의\"(틀림) / 김성열 참고인 조사·하남 득표·개혁신당 지선 성적 먼저 꺼내기 / 내란·극우 구호.","★ 숫자를 말할 땐 출처를 같이: \"국가데이터처 발표를 보면\", \"이투데이가 대학알리미로 분석한 걸 보면\".","화성에서 신촌까지 퇴근 시간대. 원고 큰 글씨 출력 1부 + 숫자 카드 1장.","끝나고: 황금별 님·학생회 감사 메시지, 페이스북 후기, 나온 질문과 답을 이 대시보드에 추가."],"notes":[],"src":[]},{"no":3273,"media":"연세대 토론회(10.27)","q":"【학생회 발제 자료 숫자 정정】 토론 중 자연스럽게 바로잡기","tags":["정정","팩트체크","학생회"],"quotes":[],"script":["★ 발제문 \"첫 일자리 취업까지 평균 18.4개월(한국고용정보원)\" → 18.4개월은 국회예산정책처 「청년층 첫 직장 현황 및 시사점」의 첫 직장 평균 근속기간(그만둔 청년 기준). 실제 취업 소요기간은 국가데이터처 2026.5 청년층 부가조사 11.2개월. 고용정보원의 18.4개월 수치는 확인되지 않음.","★ 발제문 \"고등교육 이수 청년 고용률 80%, OECD 평균 87%\" → OECD 교육지표 2026은 80.1% vs 86.0%(25~64세 대졸자). 2025판은 79.9% vs 85.9%. \"87%\"는 어느 판에도 없음.","★ 토론용 한 문장: \"18.4개월은 취업까지 걸린 기간이 아니라 첫 직장을 버틴 기간입니다. 그래서 더 아픈 숫자입니다. 들어가기도 어렵고 버티기도 어렵다는 뜻이니까요.\"","말투: \"제가 찾아보니 이 숫자는 이런 뜻이었습니다.\" 학생 체면을 깎지 않게."],"notes":[],"src":[["첫 직장 퇴사 70.7%·근속 18.4개월(헤럴드경제 2026.5.4)","https://www.heraldk.com/article/2026050404000057847"],["고용정보원 청년패널, 비수도권 24.6개월(쿠키뉴스)","https://www.kukinews.com/article/view/kuk202511270015"],["2026년 5월 청년층 부가조사(국가데이터처, KDI 요약)","https://eiec.kdi.re.kr/policy/materialView.do?num=284575"],["OECD 교육지표 2026(파이낸셜뉴스 2026.9.29)","https://www.fnnews.com/news/202609291351196534"],["첫 직장 근속 18.4개월(헤럴드경제 2026.5.4)","https://www.heraldk.com/article/2026050404000057847"],["첫 취업 소요 11.2개월, 2026.5 청년층 부가조사(SBS Biz 2026.7.23)","https://biz.sbs.co.kr/amp/article/20000324139"],["OECD 교육지표 2026 80.1% vs 86.0%(파이낸셜뉴스 2026.9.29)","https://www.fnnews.com/news/202609291351196534"]]},{"no":2901,"media":"이맘때(광주KBS)","q":"Q. 시청자 여러분께 자기소개 부탁드립니다.","tags":["이맘때","자기소개","첫인사","도전의적통","김대중","노무현","최연소의장"],"quotes":[],"script":["반갑습니다.","★ 민주당의 적통은 혈통도 계파도 아니죠. 계란으로 바위를 쳤던 김대중, 노무현의 도전 정신입니다. 저는 그 도전의 적통을 잇는 호남청년 김보미입니다.","\"나이도 어린 것이, 어디 여자가, 도시도 아닌 농촌에서\" 13년째 정치하고 있고요. 스물셋에 입당해 스물여덟에 군의원이 됐고, 서른둘에 전국 최연소 기초의회 의장을 역임했습니다."],"notes":[]},{"no":2902,"media":"이맘때(광주KBS)","q":"Q1. 요즘은 어떻게 지내고 계신가요?","tags":["이맘때","근황","전당대회결과","비온뒤","호남","침수","단비"],"quotes":[],"script":["(저는 요즘 많은 분들이 연락을 주셔서 직접 뵙고 소통하면서 많이 배우고 있습니다. 전당대회 호남 경선을 앞두고 강진에 내려와서 전남과 광주 분들을 뵙고, 몸과 마음의 배터리를 풀충전하고 있습니다.)","우리 강진에는 며칠 전 많은 비가 내렸습니다. 해갈의 단비가 내려 반가웠습니다. 그런데 같은 날 호남 곳곳에 침수 피해가 심하다는 소식을 들었습니다.","★ 뉴스를 보면서 생각했습니다. 같은 비가 어느 땅에는 단비가 되고, 어느 땅에는 상처가 됩니다. 이번 전당대회도 그랬습니다. 그러나 비 온 뒤에 땅은 굳지 않습니까? 굳어진 땅 위에 어떤 민주당을 세울지, 그 이야기를 오늘 나누고 싶습니다."],"notes":[]},{"no":2903,"media":"이맘때(광주KBS)","q":"Q2. 이번 당대표 도전은 어떤 시간이었나요?","tags":["이맘때","계란과바위","시골쥐","완주","컷오프","도전은시작"],"quotes":[],"script":["솔직히 두려웠지만 용기를 냈습니다.","★ 오죽하면 강진 시골쥐가 집도 없는데 서울까지 올라가 도전했겠습니까. 누군가는 꼭 용기 내서 말해야 한다고 믿었기 때문입니다.","이름 석 자를 알리기에도 벅찬 짧은 시간이었지만, 한 분 한 분의 응원 덕분에 무사히 완주할 수 있었습니다. 이 자리를 빌려 감사 인사드립니다.","★ 저는 경선기간  공정과 민주주의가 살아 있는 민주당을 만들자, 청년정치를 키워 세대교체를 준비하자, 과거가 아니라 미래를 준비하자. 길을 잃은 민주당이 가야 할 길을 목이 터져라 외쳤습니다.","(물론 저의 도전은 계란으로 바위 치기였습니다. 하지만 많은 분들은 물론, 전당대회에 출마하신 당대표, 최고위원 후보들도 저의 주장에 공감해 주셨습니다.)","이제 새 지도부가 이런 당 개혁 과제들을 하나하나 실천해 주기를 바랍니다."],"notes":[]},{"no":2904,"media":"이맘때(광주KBS)","q":"Q2-1. 당대표가 됐다면 가장 하고 싶었던 일은 무엇인가요?","tags":["이맘때","25개공약","12개공약","대전환","공천혁신특위","5대요구","유리상자","득표수공개","유령당원"],"quotes":[],"script":["저는 5대 분야 25개 정책공약과 3단계 실행 로드맵을 준비했습니다. 예비경선 컷오프 전날에는 '민주당 갈아엎기' 수준의 대전환 선언을 통해 12가지 약속을 외쳤습니다.","(결과와 상관없이, 당대표가 누가 되더라도 바뀌지 않는 공정한 시스템을 구축하는 것이 가장 시급하다고 생각했고, 앞으로 가야 할 방향을 제시했습니다. 그 약속들이 지켜질 때까지 지금 제 자리에서 최선을 다해야 한다고 생각합니다.)","김민석 후보가 당대표가 되는 즉시 공천혁신특위를 구성해 연말까지 새 공천 시스템을 만들겠다고 약속했습니다. 반가운 소식에 기자회견을 열어 특위가 반드시 담아야 할 다섯 가지를 요구했습니다.","첫째, 공천 규칙을 선거 6개월 전에 미리 확정하고 '달리 정할 수 있다'는 예외조항을 삭제할 것. 둘째, 유령당원과 불법당원, 이중당원을 전면 정리해 진짜 1인 1표를 실현할 것. (셋째, 투표율과 후보별 득표수까지 경선 결과를 100% 공개할 것. 넷째, 토론과 연설로 실력을 겨루는 경선을 보장할 것. 다섯째, 특위 위원 과반수를 낙천자와 청년 당원으로 구성할 것.)","★ 너무나 당연하지만 사라져버린 이 다섯 가지가 반영될 때까지 목소리 내겠습니다.","★ 마침 김민석 대표가 후보 시절 약속했던 '민주당 4대 혁신 플랜'을 당선 직후 다시 확인했습니다. 경선토론 의무화, 원샷 선호투표제, 경선 결과 완전 공개, 청년최고위원 보장, 청년 예산 자율권까지, 제가 목이 터져라 외쳤던 요구들이 대부분 담겨 있습니다. 속도전으로 잘하고 계십니다. 이 약속들이 그대로 지켜지도록 힘껏 돕고, 끝까지 지켜보겠습니다."],"notes":[]},{"no":2905,"media":"이맘때(광주KBS)","q":"Q3. 왜 지금 세대교체가 필요하다고 보십니까?","tags":["이맘때","세대교체","686용퇴","응원봉","김대중","김민석","골든타임","386컴퓨터","5060정당","2030"],"quotes":[],"script":["386세대라는 이름, 30대에 80년대 학번, 60년대생이라는 뜻이죠. 그런데 그 숫자가 그 시절 최신 컴퓨터였던 386과 똑같아서 그렇게 불리게 됐습니다.","★ 그 386 컴퓨터, 지금 어디 있습니까? 486, 586, 펜티엄까지 지나서 이제는 스마트 안경부터 손안의 핸드폰 하나로 다 되는 AI 대전환 시대입니다.","(김대중 대통령께서는 386 컴퓨터가 최신이던 그 시절에 청년 김민석을 발탁하셨습니다. 그때 민주당은 2030의 지지가 가장 높은 정당이었습니다. 그리고 그 청년이 지금 총리를 거쳐 당대표까지 잘하고 계시지 않습니까?)","★ 그런데 지금 민주당은 5060 정당이 되었습니다. 2030 없이 총선 승리가 가능하겠습니까?","선배 세대가 화염병과 짱돌을 들고 민주주의를 만들었다면, 우리 세대는 응원봉을 들고 민주주의를 지켰습니다. 늦었지만 세대교체는 시대정신이고, 지금이 골든타임입니다."],"notes":[]},{"no":2906,"media":"이맘때(광주KBS)","q":"Q3-1. 세대교체를 위해 무엇이 필요합니까?","tags":["이맘때","세대교체","제도개혁","기울어진운동장","입장불가","토론회","공천","계파"],"quotes":[],"script":["세대교체를 외친다고 스스로 물러날 분이 얼마나 되겠습니까.","★ 그래서 사람에게 기대하지 말고, 제도로 바꿔야 합니다.","(20대 꼰대가 있고, 60대 청년이 있습니다. 나이가 문제의 전부는 아닙니다. 진짜 문제는 능력 검증 없이 줄만 잘 서면 계속 자리를 지키는 구조입니다.)","★ 지금 계파가 없는 청년에게 이 판은 기울어진 운동장 정도가 아닙니다. 입장 자체가 안 되는 시스템입니다.","최소한 토론과 연설로 실력을 검증하는 공천, 당대표와 지도부가 누구로 바뀌어도 흔들리지 않는 공정한 시스템이 만들어지면, 세대교체는 저절로 시작됩니다.","★ 청년들께도 말씀드리고 싶습니다. 줄 서지 말고 실력을 키우고, 흩어지지 말고 연대해야 합니다. 문은 두드리는 사람에게 열립니다. 도전합시다."],"notes":[]},{"no":2907,"media":"이맘때(광주KBS)","q":"Q4. 당대표, 최고위원 선출 방식은 무엇이 바뀌어야 합니까?","tags":["이맘때","경선혁신","5무정당","득표수공개","기탁금","공영제","선호투표","컷오프","밀실공천"],"quotes":[],"script":["저는 지난 지방선거에서 불공정 경선을 겪은 당사자로서, 민주당에서 다섯 가지가 사라졌다고 외쳐 왔습니다.","★ 공정, 민주, 세대교체, 청년, 그리고 미래입니다. 이번 전당대회 짧은 예비경선이 5無 민주당 민낯을 훤히 보여줬습니다.","후보 등록을 하고 나서야 경선 규칙을 받았습니다. 예비경선 기간은 사실상 나흘, 등록 서류와 후원회 준비에 이틀을 쓰고 나니 실제 선거운동 할 시간조차 없었습니다. 토론회는 한 번도 없었습니다.","★ 그리고 저는 지금도 제가 몇 표를 받았는지 모릅니다. 후보가 자기 득표수를 모르는 선거, 민주주의 정당에서 있을 수 있는 일입니까?","(경선 결과 100% 공개, 고무줄처럼 늘어나는 단서조항 삭제, 후보를 검증할 토론의 링 보장, 기탁금 폐지와 공영제, 그리고 선호투표제의 제도화까지 필요합니다.)","★ 공개하지 못할 경선은 공정한 경선이 아닙니다. 당당하다면 깜깜이 밀실 공천을 할 이유가 없습니다."],"notes":[]},{"no":2908,"media":"이맘때(광주KBS)","q":"Q5. \"계란들이 꿈틀대고 있다\"고 하셨습니다. 어떤 의미인가요?","tags":["이맘때","계란과바위","전국의김보미","청년정치","연대","지방의원","686"],"quotes":[],"script":["경선 기간, 젊은 시절 짱돌을 들었던 선배님들이 전화를 주셔서 격려하시고, 뭐든 도와주려 하셨습니다. 청년들도 용기 내어 응원을 보내줬습니다.","★ 그야말로 온 마을이 김보미를 키운 셈입니다.","저는 이번 도전에서 전국 곳곳의 계란들을 만났습니다. 기성 정치에 줄 서지 않고, 686 선배들의 뒤꽁무니를 따라다니지 않고, 지역에서 굳건히 지지 기반을 넓혀 가는 청년 정치인들입니다.","(지금 지방의원을 하고 있는 분들, 지방의원에 도전하려는 분들, 2년 뒤 총선이나 4년 뒤 단체장에 나가려는 청년들이 힘을 모아야 합니다.)","★ 686 기성 정치인 중에서 청년 세대를 지원하려는 그룹도 함께 세대교체의 맨 앞자리에서 길을 열고 싶습니다."],"notes":[]},{"no":2909,"media":"이맘때(광주KBS)","q":"Q6. 청년들이 정치를 불신하는 이유가 뭘까요?","tags":["이맘때","청년","2030","무당층","공정","병풍","청년최고위원부결","기탁금","무관심"],"quotes":[],"script":["★ 청년이 민주당을 떠난 게 아니라, 민주당이 먼저 청년을 떠났죠.","원인은 공정의 상실입니다. 공정에 가장 민감한 세대에게 민주당은 내로남불, 가장 불공정한 모습을 보여 왔습니다.","★ 영입할 때는 미래라고 부르고, 규칙을 정하는 방에서는 지웁니다. 기자회견 때는 병풍처럼 세워 놓고 사진을 찍고 돌려보냅니다.","(이번 전당대회만 봐도 청년 정치를 확대하겠다면서 청년최고위원제는 부결시켰고, 청년에게 기회를 준다면서 기탁금 장벽은 확 올려버렸습니다. SNS 세대는 말과 행동의 그 간격을 실시간으로 확인합니다.)","★ 청년들은 몰라서 떠나는 게 아닙니다. 너무 잘 알아서 떠납니다.","지금 18세에서 29세의 절반 가까이가 무당층입니다.","★ 분노보다 무서운 것이 무관심입니다. 분노는 아직 기대가 남았다는 뜻이지만, 무관심은 기대를 접었다는 뜻이기 때문입니다. 노력해야합니다."],"notes":[]},{"no":2910,"media":"이맘때(광주KBS)","q":"Q7. 청년 정치인이 힘을 가지려면 무엇이 필요합니까?","tags":["이맘때","청년결정권","청년최고위원","기탁금","공영제","당원교육","성장사다리"],"quotes":[],"script":["★ 지금 아예 한 세대가 실종되었는데, 자리를 주는 것으로는 부족합니다. 권한을 줘야 합니다.","먼저 당 안의 권한입니다. 청년최고위원을 선출직으로 당헌에 명문화하고, 지명직 최고위원 2명도 청년으로 임명해야 합니다.","(청년위원회를 청년정책의 최고 의결기구로 격상하고, 청년위가 결정한 정책은 당이 책임지고 입법하도록 의무화해야 합니다. 당 예산의 10%는 청년이 직접 결정하게 해야 합니다.)","★ 다음은 진입 장벽입니다. 기탁금을 폐지하고, 당직선거 공영제를 도입해야 합니다. 돈이 없어서 도전을 포기하는 청년이 없어야 합니다.","(그리고 키우는 일입니다. 16세, 18세 어린 당원들을 위한 정치교육과 정책교육부터 시작해서, 지방의원을 거쳐 단계를 밟아 성장하는 사다리를 당이 만들어야 합니다.)"],"notes":[]},{"no":2911,"media":"이맘때(광주KBS)","q":"Q8. 청년 정책, 어떻게 만들어야 합니까?","tags":["이맘때","청년정책","버스하우스","그늘앱","청년당사자","청년취업보장제","모병제","3년뒤평가"],"quotes":[],"script":["얼마 전 폐버스 하우스 논란이 있었습니다. 핵심은 청년의 분노를 읽지 못한 데 있습니다.","★ 요즘 한 대학생이 만든, 그늘을 따라 걷는 길을 알려주는 앱이 인기라고 합니다. 땡볕에 걸어보지 않은 사람은 이런 정책을 만들지 못합니다.","★ 청년 정책의 공급자를 기성 정치인에서 청년 당사자로 바꿔야 합니다.","당사자의 눈으로 보면 우선순위가 달라집니다. 청년에게 지금 가장 절실한 것은 첫 일자리입니다. 그래서 저는 청년취업보장제를 민주당의 핵심 정책으로 제안했습니다.","★ (징병제의 단계적 모병제 전환과 군 복무자에 대한 정당한 보상도 청년의 삶에서 나온 요구입니다.) 정책의 성과는 3년 뒤 그 청년이 어디에서 무엇을 하고 있는지로 평가해야 합니다. 그래야 보여주기 정책이 사라지고, 진짜 삶을 바꾸는 정책이 남습니다."],"notes":[]},{"no":2912,"media":"이맘때(광주KBS)","q":"Q9. 정치 이력을 소개해 주시죠.","tags":["이맘때","지방의원","맘다니","최연소의장","프랑스","산나마린","평가절하","바닥민심"],"quotes":[],"script":["저는 13년 동안 선거운동을 하면서 대한민국에 안 가 본 데가 없습니다.","★ 저보다 두 살 아래인 뉴욕시장 맘다니가 동생뻘인데도, 어딜 가도 막내라 서른여섯인 저를 아직 어리다고들 합니다. 또 국회의원도 아닌 지방의원이 당대표에 출마했다고 평가절하하는 분들도 계셨습니다.","★ 지방의회는 중앙의 축소판입니다. 조례 만들고, 예산 심의하고, 행정사무감사 하고, 주민을 대변합니다. 국회가 하는 일을 규모만 작게 다 합니다.","(프랑스는 하원의원의 60% 이상이 지방직 경력자이고, 영국도 지난 총선에서 당선 가능성이 높은 지역구 후보의 절반가량이 지방의원 출신이었습니다. 스웨덴은 아예 국회의원이 지방의원을 겸직합니다. 핀란드의 산나 마린 총리는 스물일곱에 시의회 의장을 지냈고, 서른넷에 총리가 됐습니다.)","★ 우리도 이제 지방의원에서 시작해 단계를 밟아 성장하는 커리큘럼을 만들어야 합니다. 바닥 민심을 경청하는 최전선, 그 지방의원의 경험이 저의 밑천입니다."],"notes":[]},{"no":2913,"media":"이맘때(광주KBS)","q":"Q10. 별명이 많다고 들었습니다. 어떻게 얻으셨나요?","tags":["이맘때","쌈닭","불도저","오뚝이","강진의이재명","표적징계","승소","훈장"],"quotes":[],"script":["★ 똑 부러진다고 좋게 말하면 똑례, 안 좋게 말하면 쌈닭이죠. 한번 말한 것은 끝까지 밀어붙인다고 불도저, 넘어져도 일어난다고 오뚝이라고 불러주십니다.","지난 13년, 표적 징계에 제명, 불신임, 차량수색, 경찰수사까지 탈탈 털렸습니다.","★ 그러나 전부 혐의없음과 기각으로 끝났고, 허위보도 손해배상 소송에서는 승소했습니다.","(무엇보다 하루 1,000명의 군민이 서명으로 저를 지켜주셨고, 재선 때는 최다득표로 답해 주셨습니다.)","★ 하도 털려서 '강진의 이재명'이라고 불리는데, 제 별명은 사실 군민들이 달아주신 훈장입니다. 별별경험으로 깡깡하게 많이 배우고있습니다."],"notes":[]},{"no":2914,"media":"이맘때(광주KBS)","q":"Q11. 지자체 발전을 위해 어떤 노력을 하시겠습니까?","tags":["이맘때","재정주권","김보미365","나라살림돋보기","예산바로보기","당비","국고보조금","243개"],"quotes":[],"script":["투명한 재정 공개입니다.","★ 군수 경선에서 떨어진 뒤에도 공약을 지키려고 '김보미365'라는 플랫폼을 직접 만들어, 강진군의 예산과 집행내역, 계약현황, 민원 담당부서까지 핸드폰으로 확인할 수 있게 했습니다.","하다 보니 전국 243개 지자체와 중앙정부 예산도 확인할 수 있는 플랫폼을 만들고, 재정주권 시민행동 공동대표로 '예산 바로보기' 운동을 전국으로 넓히고 있습니다.","★ 시민 한 명 한 명이 내 혈세의 감시자가 되어야 합니다. 내가 낸 세금이 어디로 가는지 직접 들여다보는것만큼 확실한 정치 참여는 없습니다. 사람이 생기면 돈의 방향이 바뀝니다. 저는 정당의 돈, 국고보조금과 당비도 1원까지 투명하게 공개해야 한다고 생각합니다."],"notes":[]},{"no":2915,"media":"이맘때(광주KBS)","q":"Q12. 청년이 농어촌에 돌아오게 하려면 무엇이 필요합니까?","tags":["이맘때","지방소멸","청년취업보장제","스마트팜","AI농업","군민배당","햇빛연금","육아수당","강진"],"quotes":[],"script":["★ 세 가지 사다리를 지역 안에 놓아야 합니다. 배울 곳, 일할 곳, 정착할 곳입니다.","청년취업보장제로 첫 경력을 지역에서 쌓게 하고, AI 다음은 농업이라는 마음으로 AI 농업 시범지구와 청년 스마트팜을 키워야 합니다. 강진의 육아수당처럼 아이 키우기 좋은 조건도 필수입니다.","(제가 강진군수 경선에서 내놓은 공약도 같은 방향이었습니다. 에너지 산업단지를 유치해 그 수익을 '군민 배당', 햇빛연금과 바람연금으로 군민께 돌려드리자는 것입니다. 지역에 사는 것만으로 소득이 생기는 구조가 만들어지면, 떠날 이유는 줄고 돌아올 이유는 늘어납니다.)","★ 그리고 무엇보다, 이 모든 설계에 청년 당사자가 참여해야 합니다. 청년 없이 만든 청년 정책은 반드시 실패합니다."],"notes":[]},{"no":2916,"media":"이맘때(광주KBS)","q":"Q13. 앞으로의 계획은 무엇입니까?","tags":["이맘때","공천혁명","호남","감시","재정주권","다시시작","청년정치","문제해결의정치"],"quotes":[],"script":["★ 이번 경선에서 호남이 김민석 대표에게 몰아준 표는, 공천의 방식도, 정치의 주체도, 정치의 품격도 바꾸라는 절박한 주문이었다고 생각합니다.","김민석 대표가 연말까지 약속한 공천혁명, 당원 명부 정비와 정책토론 의무화가 실현되는지 지켜보고 목소리 내어야 하고요.","★ 또 뜻이 맞는 청년들과 함께, 투쟁의 정치에서 문제를 해결하는 정치로 나아가겠습니다.","김보미가 지금 열심히 활동하고 있는 재정주권 시민행동에도 많은 관심 부탁드립니다."],"notes":[]},{"no":2917,"media":"이맘때(광주KBS)","q":"Q. 마지막으로 시청자 여러분께 한 말씀 부탁드립니다.","tags":["이맘때","클로징","원팀","민생","계란과바위","다시시작","국민을지키면"],"quotes":[],"script":["★ 민주당 전당대회가 끝났습니다. 이제 원팀입니다. 우리의 상대는 당 안에 있지 않습니다. 민생의 위기입니다.","★ 청년의 일자리를 지키고, 자영업자의 가게를 지키고, 농민의 논밭을 지키고, 노동자의 일터를 지키고, 우리 아이들의 미래를 지켜야 합니다.","★ 국민을 지키면, 국민이 대통령을 지켜준다고 확신합니다.","★ 계란은 깨졌지만, 여러분과 함께 바위에 낸 금은 남았습니다. 이제, 김보미는 다시 시작입니다. 함께해 주십시오."],"notes":[]},{"no":2624,"media":"한겨레21 추가(8.18)","q":"[추가] Q1. 김민석 당대표 선출 결과, 청년 정치인 입장에서 어떻게 보십니까?","tags":["한겨레21추가","전당대회결과","김민석","호남","공천혁신","비온뒤","세대교체"],"script":["먼저 김민석 당대표를 비롯한 새 지도부의 출범을 진심으로 축하드립니다. 마지막까지 최선을 다한 정청래, 송영길 후보께도 큰 박수를 보냅니다. 이제 이긴 사람은 손을 내밀고, 진 사람은 그 손을 잡을 때입니다.","★ 청년 정치인으로서 저는 이번 결과를 '바꾸라는 주문'으로 읽습니다. 이번 경선에서 전국 대부분의 지역은 두 후보의 접전이었습니다. 그런데 호남은 김민석 후보에게 압도적인 지지를 몰아줬습니다.","★ 공천이 곧 당선인 호남에서 이 표는 한 사람을 향한 환호를 넘어, 공천의 방식도, 정치의 주체도, 정치의 품격도 제발 좀 바꾸라는 절박한 요구였다고 생각합니다.","그 약속이 지켜지는지 지켜볼 것입니다. 저부터 새 지도부를 지원하되, 끝까지 지켜보겠습니다.","★ 비 온 뒤에 땅이 굳는다고 했습니다. 환호와 아쉬움을 뒤로하고, 굳어진 이 땅 위에 어떤 민주당을 세울 것인가. 지금부터가 진짜 시작입니다."],"quotes":[],"notes":["[확인] 김민석 최종 54.08% vs 정청래 45.92%(선호투표 반영) / 1차 누적 49.91% 과반 미달 / 호남 순회경선 김민석 57.54%."]},{"no":2625,"media":"한겨레21 추가(8.18)","q":"[추가] Q2. 최고위원 선출 결과(친명 2명, 친청 3명)는 어떻게 보십니까?","tags":["한겨레21추가","최고위원","친명친청","당원주권","청년최고위원","계파","견제와균형"],"script":["우리 국민과 당원들은 정말 대단합니다. 언론은 친명 몇 명, 친청 몇 명으로 분류합니다만, 저는 숫자보다 그 안에 담긴 당심을 봅니다.","★ 당원들은 어느 한쪽에도 전권을 주지 않았습니다. 독주하지 말라, 서로 견제하며 협력하라는 절묘한 균형을 만들어낸 것입니다. 정당의 주인이 누구인지 보여준 결과라고 생각합니다.","그래서 새 최고위원들께 부탁드리고 싶습니다. 당원들이 지도부에 맡긴 것은 계파의 승리가 아닙니다. 민주당의 승리, 대한민국의 민생입니다.","전당대회 기간 누가 대통령과 더 친한지를 두고 다투는 모습에 국민들은 지쳤습니다. 이제 그런 정치는 끝내고, 계파의 대표가 아닌 당원 전체의 지도부로 일해주시길 바랍니다.","★ 한 가지 아쉬움도 말씀드리겠습니다. 이번 지도부에도 청년은 보이지 않습니다. 제가 전당대회 기간 청년최고위원제 도입을 요구했던 이유가 바로 여기에 있습니다. 지도부에 청년 세대의 목소리를 대변할 사람이 없습니다. 새 지도부가 청년의 자리를 제도로 만들어주시길 바랍니다."],"quotes":[],"notes":["[확인] 최고위원 당선: 최민희(1위), 박선원, 서미화, 이성윤, 한민수.","[주의] 계파 분류는 '언론은 ~으로 분류합니다만' 전언 문형 유지. 특정 최고위원 개인 평가 금지."]},{"no":2626,"media":"한겨레21 추가(8.18)","q":"[추가] Q3. 청년 입장에서, 김민석 당대표가 최우선으로 해야 할 일은 무엇입니까?","tags":["한겨레21추가","공천혁신","6대기구","당원명부","정책토론","민생","집권여당","청년"],"script":["공약을 지키는 것입니다. 김민석 대표는 당선되면 이틀째인 18일에 공천혁신, 통합, 청년, 메가프로젝트, 양극화 해소, 당원주권정당 등 6대 기구를 출범시키겠다고 밝혔습니다. 방향은 옳습니다. 이제 중요한 것은 속도와 실천입니다.","★ 그 첫 단추는 연말까지 하겠다고 약속한 공천혁신입니다. 가짜당원과 불법당원, 이중당원 명부를 바로잡고, 후보자 정책토론을 의무화해서 능력과 정책으로 경쟁하는 공천을 만들어야 합니다.","하나만 더 말씀드리면, 민주당은 당 안에서만 박수받는 정치를 끝내고 당 밖으로 나가야 합니다. 오늘 장사가 안 돼 힘들고, 취업을 못 해 내일이 막막한 국민의 삶을 책임지는 것이 집권여당의 일입니다.","★ 청년의 일자리를 지키고, 자영업자의 가게를 지키고, 농민의 논밭을 지켜야 합니다. 국민을 지키면 국민이 대통령을 지켜줍니다."],"quotes":[],"notes":["[확인] 김민석 6대 기구(공천혁신·통합·청년·메가프로젝트·양극화 해소·당원주권정당) 출범 구상 보도됨."]},{"no":2801,"media":"신동아","q":"1. 한국 정치가 가장 시급하게 해결해야 할 고질적 병폐나 악습이 무엇이라고 보나.","tags":["신동아","전쟁정치","686","줄서기","투쟁에서정책으로","짱돌"],"script":["한마디로 전쟁입니다. 한국 정치는 정치가 아니라 전쟁입니다. 대통령이 세 번이나 탄핵 소추되고, 검찰에 복수하기 위한 검찰개혁이 20년째 모든 이슈를 삼키고 있습니다.","대화도 설득도 없고, 정치를 잘하기 위한 훈련 과정도 없이 그냥 유명하고 싸움 잘하는 사람이 국회의원이 되는 정치입니다. 화염병과 짱돌이 지금도 계속되고 있는 것입니다.","내 편은 무조건 선이고 상대편은 무조건 악입니다. 타협은 없습니다. 내 편의 큰 범죄는 감싸 주고, 상대방의 작은 범죄는 끝까지 단죄해야 합니다. 국민을 위한 정책 논쟁은 설 자리가 없고, 누가 더 비정한 언어로 잘 싸우는지가 대한민국 정치인의 제1조건이 되었습니다.","당대표 선거에 나가서 다시 확신했습니다. 같은 당인데도 생각이 조금 다르면 토론할 상대가 아니라 제거해야 할 적이 됩니다. 제가 제시한 정책을 들여다보는 사람은 없었습니다. 내가 누구 편인지, 누구를 비판했는지만 따졌습니다.","정청래 후보를 비판하면 김민석 후보 편이라고 하고, 김민석 후보를 비판하면 이낙연계라고 했습니다. 저는 세 후보 모두에게 이제 세대교체를 준비해야 한다고 말했는데도, 저를 자꾸 어느 편에 집어넣으려고 했습니다.","대한민국 정치에는 686파밖에 없는 것입니까. 독자적인 청년파는 없어야 하는 것입니까. 이게 참 이상했습니다. 왜 청년은 누구한테 줄을 서야 합니까. 언론도 정치권도 모두 김보미는 누구에게 줄을 서는 것이 당연하다고 생각하는 것 같았습니다.","정치는 누구 꽁무니를 따라다닐 것인지를 결정하는 것이 아니라, 어떤 문제를 해결할 것인지를 결정하는 것입니다.","AI 경쟁, 청년 일자리, 기후위기, 지방소멸, 반도체 패권 같은 문제에 답을 내는 것이 정치입니다. 저는 한국 정치가 이제 투쟁의 기술에서 정책의 기술로 넘어가야 한다고 생각합니다. 40년 동안 짱돌 던지며 싸웠으면 이제 그만할 때도 되지 않았습니까.","민주화 시대에 필요했던 정치의 문법을 AI 시대에도 끝까지 적용하려고 하니, 이 나라 미래가 어디로 갈지 정말 걱정입니다."],"quotes":[["김보미","한국 정치는 정치가 아니라 전쟁입니다."],["김보미","왜 청년은 누구한테 줄을 서야 합니까. 대한민국 정치에는 686파밖에 없는 것입니까."]],"notes":["'세 후보 모두에게 세대교체를 말했다'는 중립 프레임 → 답변지의 정청래 비판·김민석 환영과 나란히 읽히면 반박이 나올 수 있음. 질문 오면 '시스템 비판이지 편들기가 아니다'로 정리."],"warn":"탄핵 소추 3회는 소추 의결 기준(노무현은 기각). '검찰개혁 20년'은 기산점 물으면 참여정부 기준이라고 답할 것."},{"no":2802,"media":"신동아","q":"2. 기성 정치가 청년세대 목소리를 대변하지 못한다고 느끼는 가장 큰 이유는 뭔가.","tags":["신동아","청년정치","기탁금","입틀막","운동장","김어준","예비경선4일"],"script":["청년에게 말할 기회를 주지 않으면서 청년을 위한 정치를 한다고 말하기 때문입니다.","정치권은 선거 때마다 청년을 찾습니다. 청년위원회를 만들고, 청년 공약을 발표하고, 청년 간담회를 하고, 비대위원장을 맡기기도 하고, 최고위원 자리에 임명하기도 합니다.","그런데 그때뿐입니다. 고분고분 말 잘 들으면 우쭈쭈해 주면서 키워 주고, 기득권 정치와 686 정치를 비판하면 사정없이 버립니다. 자리에 임명해도 결정권이 없습니다. 민주당에서 청년 정치인들이 세력화해 청년정책을 결정하거나, 당내 문제에 획기적인 대안을 제시해 채택된 사례는 하나도 없습니다. 민주당에 청년이 사라진 지는 오래되었습니다.","이번 전당대회를 한번 보십시오. 청년최고위원을 만들자는 제안은 받아들여지지 않았습니다. 청년 후보가 감당하기 어려운 기탁금 장벽도 있었습니다. 저는 기탁금을 마련하지 못해 돈을 빌려 후보 등록을 했습니다.","말할 기회조차 주지 않습니다. 예비경선 기간은 사실상 4일에 불과했습니다. 그것도 등록 서류 만들고 후원회 만드는 데 이틀을 쓰고, 실제로는 48시간 선거운동을 했습니다. 기탁금을 내고 7분짜리 동영상을 촬영한 것이 선거운동의 전부입니다. 토론 한 번 없었고, 당원을 모아 놓고 하는 연설회 한 번 없었습니다.","누가 이런 엉터리 경선판을 만들었겠습니까. 기득권입니다. 청년에게 말할 기회조차, 도전할 기회조차 봉쇄한 정당이 지금의 민주당입니다. 흔히 기울어진 운동장이라고들 표현하는데, 그것도 아닙니다. 운동장이 기울어진 정도가 아니라 청년은 운동장에 들어오지도 못하게 막고 있습니다.","제가 당대표에 도전했더니 김어준 씨가 \"당선도 안 될 건데 왜 나왔느냐\"고 집요하게 물었습니다. 어이가 없어서 \"그런 마인드가 꼰대 마인드 아니냐\"고 되물었습니다.","청년 정치의 가장 큰 장벽은 돈도 조직도 아닙니다. 너는 아직 때가 아니다, 그러니 기다려라, 이런 686의 기득권입니다. 이걸 허물지 못하면 민주당에 청년도 없고 미래도 없습니다."],"quotes":[["김보미","운동장이 기울어진 정도가 아니라 청년은 운동장에 들어오지도 못하게 막고 있습니다."]],"notes":["기탁금 액수를 물으면 정확한 금액으로 답할 것 — 답변지에는 액수가 빠져 있음."],"warn":"기간을 물으면 '달력 4일 → 공휴일 빼면 이틀 미만 → 실제 운동 48시간' 순서로 답할 것. 김어준 발언 인용은 방송명·날짜를 물으면 확인 필요."},{"no":2803,"media":"신동아","q":"3. 거대 양당 중심 정치 구조를 바꾸려면 어떤 변화가 필요하다고 보나.","tags":["신동아","다당제","호남공천","공천혁신","강진군수경선","득표율공개","당내민주주의"],"script":["다당제가 되면 달라질까요. 전쟁은 다당제를 만들지 못합니다. 어느 한쪽에 서지 않으면 살아남을 수 없기 때문입니다. 조국혁신당이 있고 정의당, 기본소득당이 있는 것 같지만 사실상 의미 있는 역할을 하지 못하고 있고, 민주당과 한 몸입니다.","어찌 되었든 새로운 정당을 창당하는 것보다는, 정당 내부에서 버티면서 사라진 당내 민주주의를 되찾는 활동을 해야 합니다. 청년들이 힘을 모아야 합니다. 686 같은 조직력은 없더라도 지금부터 모이는 연습이라도 해야 합니다.","무엇보다 기성 정치에 줄 서지 않고, 686 선배들의 뒤꽁무니를 따라다니지 않고, 지역에서 굳건히 지지 기반을 넓혀 가며 영토를 확장해 나가는 청년 정치인들을 모아야 합니다.","저는 그 일을 하고 싶습니다. 지금 지방의원을 하고 있는 분들, 지방의원에 도전하려는 분들, 2년 뒤 총선이나 4년 뒤 단체장에 나가려는 청년들이 힘을 모아야 합니다. 그리고 기성 정치인 중에서 청년세대를 지원하려는 그룹과 함께, 세대교체의 맨 앞자리에서 길을 열고 싶습니다.","김민석 후보가 말한 호남 공천 혁신도 계속 요구하고 지원할 것입니다. 한국 정치는 소수의 지도자와 계파가 공천과 당직을 독점하는 구조가 문제입니다.","특히 호남처럼 민주당 공천이 사실상 당선인 지역에서는 당내 경선이 곧 본선입니다. 그런데 후보자 정책토론회 한 번 없고, 정책 공약조차 없습니다. 그런 사람이 민주당 후보가 됩니다.","저도 강진군수 경선 과정에서 정책토론회를 열어 달라고 계속 요구했습니다. 저는 66개의 정책공약을 준비했고 상대 후보는 공약이 하나도 없었지만, 후보가 된 것은 그쪽이었습니다. 이게 말이 됩니까.","이것부터 바꿔야 합니다. 공천 과정에서 후보자 정책토론을 의무화하고, 당원명부를 정기적으로 검증하고, 경선 결과도 투명하게 공개해야 합니다.","이번 당대표 예비경선에서도 저는 득표율 공개를 요구했습니다. 선거를 치렀는데 후보자가 자신이 몇 표를 얻었는지조차 알려 주지 않는 정당이 무슨 민주정당입니까."],"quotes":[["김보미","선거를 치렀는데 후보자가 몇 표를 얻었는지조차 알려 주지 않는 정당이 무슨 민주정당입니까."]],"notes":["'66개 공약'은 강진군수 경선 당시 기준 — 당대표 경선 25개 공약과 헷갈리지 않게 반드시 한정어를 붙여 말할 것."],"warn":"조국혁신당·정의당·기본소득당을 '민주당과 한 몸'이라고 한 대목은 해당 정당 반박을 부를 수 있음. 강진군수 경선 상대 후보 '공약 하나도 없었다'는 근거(공보물) 확보 필요."},{"no":2804,"media":"신동아","q":"4. 정부나 지자체에서 다양한 청년 정책을 시행하고 있는데, 효과가 있다고 보나.","tags":["신동아","청년정책","지원사업","첫사다리","정책평가"],"script":["도움이 되는 사업도 많습니다. 다만 저는 지금의 청년정책이 너무 잘게 쪼개진 지원사업 중심이라고 생각합니다. 취업하면 얼마, 창업하면 얼마, 월세 얼마, 자격증 따면 얼마를 지원하는 식입니다.","청년 입장에서는 자기에게 맞는 정책을 찾는 것부터가 쉽지 않습니다. 그런 정책들이 근본적인 해결책이 되지 못하고 있다는 것도 문제입니다.","청년이 가장 원하는 것은 지원금 몇십만 원이 아닙니다. 앞으로 먹고살 일자리와 주거가 핵심입니다. 정부와 지자체의 정책은 좋은 일자리를 얻고, 결혼 여부와 관계없이 독립해서 살 수 있고, 열심히 일하면 조금씩 자산을 만들 수 있다는 희망을 갖도록 하는 데 집중해야 합니다.","그런데 지금 청년들은 대학을 졸업하고도 첫 일자리를 얻는 단계에서부터 막힙니다. 기업은 경력자를 원하는데 청년에게는 경력이 없습니다. 그래서 제가 계속 이야기하는 것이 있습니다.","청년에게 물고기를 몇 번 나눠 주는 정책에서, 청년이 스스로 살아갈 수 있는 첫 번째 사다리, 첫 번째 일자리를 만들어 주는 정책으로 옮겨 가야 합니다.","청년정책의 성과도 몇 명에게 얼마를 지급했느냐가 아니라, 그 정책을 거친 청년이 3년 뒤 어디에서 무엇을 하고 있느냐로 평가해야 합니다. 피드백을 제대로 해야 성공하는 정책을 찾아낼 수 있습니다."],"quotes":[["김보미","청년에게 물고기를 나눠 주는 정책에서, 첫 번째 사다리를 만들어 주는 정책으로 가야 합니다."]],"notes":[]},{"no":2805,"media":"신동아","q":"5. 청년이 원하는, 청년에게 실질적 도움이 될 정책 대안을 제시한다면?","tags":["신동아","청년취업보장제","국가청년취업보장제","미래대응기금","지방소멸","일자리"],"script":["제가 가장 중요하게 생각하는 것이 청년취업보장제입니다. 대학을 졸업한 청년에게 가장 필요한 것은 첫 번째 경력입니다.","그런데 기업은 경력 있는 신입을 찾습니다. 일을 해 봐야 경력이 생기는데, 경력이 없어서 일을 못 하는 모순이 발생합니다.","그래서 저는 국가가 일정 기간 청년의 첫 고용을 보장하는 시스템을 만들자고 제안했습니다. 국가는 초기 인건비와 교육비를 지원하고, 기업과 공공기관, 연구기관, 지역 산업체는 실제 업무와 멘토링을 담당하는 구조입니다.","단순한 공공근로나 몇 달짜리 인턴을 하자는 것이 아닙니다. 반도체, AI, 바이오, 콘텐츠, 에너지, 돌봄처럼 앞으로 사람이 필요한 산업과 연결해 교육과 훈련, 취업을 하나의 트랙으로 묶자는 것입니다.","이런 정책은 특히 지방 청년에게 도움이 될 것입니다. 제가 강진에서 정치를 하면서 가장 가슴 아팠던 것은 능력 있는 청년들이 계속 지역을 떠나는 것이었습니다. 지역에 일자리가 없으니 떠나고, 청년이 떠나니 기업과 서비스가 줄고, 다시 지역이 쇠퇴합니다.","그래서 청년취업보장제를 지역산업정책과 연결해야 합니다. 이것을 비용이라 생각하면 안 됩니다. 청년에게 주는 돈이 아니라 대한민국의 미래 인재에 대한 투자입니다. 시장이 당장 키우지 못하는 인재를 사회가 함께 키워서 다시 시장으로 보내는 시스템을 만들자는 것입니다."],"quotes":[["김보미","경력이 없어서 일을 못 하고, 일을 못 해서 경력이 없습니다. 이 고리를 국가가 끊어 줘야 합니다."]],"notes":["공약 이름이 문서마다 '국가청년취업보장제'와 '청년취업보장제'로 갈림 — 한쪽으로 통일해서 말할 것."]},{"no":2806,"media":"신동아","q":"6. 이재명 정부가 추진하고 있는 청년 정책을 어떻게 평가하나.","tags":["신동아","이재명정부","반도체800조","3대메가프로젝트","AI대전환","당청관계"],"script":["방향은 상당 부분 공감합니다. 특히 청년 문제를 단순히 복지의 문제가 아니라 일자리와 주거, 자산, 산업정책을 함께 봐야 하는 문제로 접근하려는 것은 중요하다고 생각합니다. 반도체 800조를 호남에 투자하겠다는 것도 청년정책에 획기적인 변화를 줄 것입니다. 다만 이는 먼 미래의 일입니다.","당장 청년에게 필요한 것은 정부가 무엇을 하나 더 지원해 주겠다는 약속보다, 미래에 대한 예측 가능한 믿음이라고 생각합니다.","열심히 하면 취업할 수 있다, 실패해도 다시 시작할 수 있다는 믿음을 주어야 합니다. 그리고 대통령 혼자 미래를 이야기해서는 안 됩니다. 민주당이 뒷받침해야 합니다.","제가 당대표 선거를 보면서 답답한 것도 이것입니다. 대통령은 AI와 반도체, 미래산업을 이야기하는데 후보들은 여전히 계파와 적통을 놓고 싸우고 있습니다.","정부가 3대 메가프로젝트와 7대 시드산업에 투자하겠다고 하면, 민주당은 거기서 청년에게 어떤 일자리가 생기는지를 설계해야 합니다. 그런데 정부 정책에는 아무 관심이 없습니다.","정부도 AI 투자액을 발표하는 데서 끝나면 안 됩니다. 장밋빛 미래만 제시한다고 청년 문제가 해결되지 않습니다. AI 대전환으로 사라질 청년 일자리는 무엇인지, 새로 생길 일자리는 무엇인지, 그 일자리로 청년을 어떻게 이동시킬 것인지. 여기에 대한 대책을 내놓아야 합니다."],"quotes":[["김보미","여당이 할 일은 대통령팔이가 아니라, 정부가 국민께 약속한 것을 입법과 예산으로 완수하는 것입니다."]],"notes":["'7대 시드산업'은 다른 자료에서 '7대 미래산업'으로 표기됨 — 정부 공식 명칭 확인 후 통일."],"warn":"반도체 800조는 금액·지역·주체(정부 재정인지 민간 투자 총액인지)를 확인하고 말할 것. 단독 인용되면 가장 크게 회자될 수치."},{"no":2807,"media":"신동아","q":"7. 정치권에 투신한 후 가장 크게 환멸을 느꼈던 순간은? 반대로 '정치하기 잘했다'고 보람을 느꼈던 순간은 언제인가?","tags":["신동아","계란","온마을","세대교체","캠프세명","보람"],"script":["대한민국에서 정치는 정치를 잘 아는 사람이 하는 것이 아닙니다. 정치는 할 줄 몰라도 유명해진 사람, 권력자에게 줄을 잘 서는 사람이 하는 것이 지금의 정치입니다.","열심히 정책을 공부하고 지역 주민과 함께 지역 문제를 해결하려고 노력하는 사람은 거들떠보지 않습니다. 누구와 친한지, 어느 계파인지가 더 중요합니다. 정치가 가치가 아니라 족보를 묻는다면 그 정치는 미래가 없습니다. 이런 정치에 환멸을 느꼈다기보다는, 그 때문에 더욱 이를 악물고 제대로 된 정치를 하겠다고 다짐했습니다.","역설적으로 이번에 모두가 무모하다고 한 도전을 하면서 정치하기 정말 잘했다고 생각했습니다. 저희 캠프는 딱 세 명이었습니다. 사무실도 없어 식당과 카페, 달리는 차 안에서 회의하고, 숙박비를 아끼려고 뿔뿔이 흩어져 잤습니다. 기탁금이 없어 돈을 빌려 등록했고, 후원회를 만드는 데 거의 이틀이 걸렸습니다.","그런데 전국에서 모르는 분들이 후원금을 보내 주시고 응원 메시지를 보내 주셨습니다. 거기서 희망을 보았습니다. 저는 이런 글을 썼습니다. \"한 아이를 키우려면 온 마을이 필요하다고 하는데, 온 마을이 김보미를 키워 주셨다.\"","저는 강진의 시골 정치인이었습니다. 계파도 없고 국회의원도 아닙니다. 그런데 제가 던진 공정과 세대교체라는 작은 돌멩이에 전국에서 답이 왔습니다. 제가 가장 보람을 느낀 순간이었습니다.","당락을 떠나 가치를 보고 표를 주는 사람이 있었고, 이름도 모르는 청년의 도전에 자신의 젊은 날을 떠올리며 손을 내미는 시민들이 있었습니다. 너무 고마웠고, 정치하기 정말 잘했다고 생각했습니다.","저는 계란으로 바위를 치겠다고 다짐했습니다. 처음에는 계란이 깨진다고만 생각했습니다. 그런데 지금은 조금 다르게 생각합니다. 그 바위가 낡아 빠졌다면 균열을 낼 수 있고, 저 같은 계란이 수천, 수만이라면 결국 깨질 것이라는 확신입니다.","제가 낸 작은 균열 사이로 다음 청년이 들어오고, 그다음 청년이 조금 더 넓은 길을 걸을 수 있다면, 그것으로 정치한 보람이 있다고 생각합니다.","청년이 민주당을, 정치를 떠난다고 합니다. 하지만 그게 아닙니다. 민주당이 청년을 밀어낸 것입니다.","저는 앞으로도 민주당이 잃어버린 공정과 미래와 민주주의를 되찾기 위해, 청년과 함께 세대교체를 주장하며 정치를 할 것입니다.","제가 말한 세대교체는 단순한 686 퇴진으로 완성되는 것이 아닙니다. 정치의 주력군이 686에서 2030으로 바뀌는 것이고, 투쟁의 정치에서 문제해결의 정치로 전환하는 것입니다. 많은 응원 바랍니다."],"quotes":[["김보미","청년이 정치를
